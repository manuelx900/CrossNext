STR_CAR_INTRO: "Culpa y honestidad son independientes. Cada caso tiene una sola solución. Las alturas son rasgos ficticios de los personajes."
STR_CAR_HELP_TEXT: "CÓMO RESOLVER UN CASO\nCada personaje hace una declaración. Arriba se indica el número exacto de culpables y de declaraciones falsas. Encuentra una combinación que cumpla ambas cantidades. Cada caso tiene una sola solución.\n\nCULPABILIDAD Y SINCERIDAD\nUn inocente puede mentir y un culpable puede decir la verdad. Dos mentiras significa que exactamente dos declaraciones completas son falsas; las demás son verdaderas. Verdad / Mentira se refiere a la declaración; Sospechoso, a la culpabilidad.\n\nCÓMO LEER LAS PISTAS\n«A o B lo hizo (o ambos)» significa que al menos uno es culpable. «A y B lo hicieron» exige que ambos lo sean. Una mentira niega la declaración completa: una «o» falsa significa que ninguno lo hizo; una «y» falsa, que al menos uno no lo hizo.\n\n«Ambos dicen la verdad o ambos mienten» compara declaraciones, no culpabilidad. «Exactamente uno miente» indica que una declaración es verdadera y la otra falsa. Estas pistas también pueden ser verdad o mentira.\n\nVECINOS EN ESTA PANTALLA\nEl orden circular original es Pantera, Pavo real, Tiburón, Zorro, Oso, Ciervo y Caballo, usando solo los personajes del caso. El último y el primero son vecinos. Aquí cada pista de vecinos muestra directamente sus dos nombres. No tienes que deducir quién está al lado de un retrato. Cambiar de página o girar la pantalla no cambia una pista.\n\nALTURA Y DIETA\nCada ficha muestra una altura ficticia y una dieta. «Un culpable es más alto que yo» significa que al menos un culpable supera la altura de quien habla, no necesariamente todos. «Más bajo» funciona igual. Carnívoro y herbívoro indican que al menos un culpable tiene esa dieta; los omnívoros no cuentan como ninguno de esos dos grupos. Nombres, alturas y dietas son datos fiables; las declaraciones pueden mentir.\n\nTU ANÁLISIS\nUsa ? / Verdad / Mentira y Sospechoso bajo cada declaración para anotar hipótesis. Son tus notas, no pruebas ni comprobaciones automáticas. Las flechas muestran los demás personajes. En vertical se ven hasta tres por página.\n\nCÓMO ACUSAR\nPulsa Acusar y elige exactamente la cantidad indicada de culpables. Solo gastas una vida al confirmar una acusación incorrecta. Principiante y Normal tienen dos vidas; Avanzado y Experto, una. Acertar resuelve el caso. Si agotas las vidas, se revela la solución.\n\nCAMPAÑA Y REPETICIÓN\nHay 1.470 casos. Abrir caso retoma el intento actual o abre el siguiente después de cerrar uno. Campaña permite elegir cualquiera de los 1.470 casos desde el principio y en el orden que quieras. Repetir caso inicia un intento nuevo y conserva el resultado anterior. Cada dificultad avanza de un culpable a dos y, dentro de cada grupo, de menos a más mentirosos. Principiante mantiene un culpable. Con iguales cantidades, aparecen primero los grupos con menos personajes. Todos los casos siguen disponibles. Resolver uno antes agotado lo mejora a resuelto.\n\nEl avance y las vidas se guardan en la tarjeta SD. Salir, dormir o reiniciar no devuelve las vidas del intento actual. Si falla el guardado, el resultado queda bloqueado hasta que Reintentar funcione. Restablecer todo pide confirmación antes de borrar solo el avance de Carnívoro."
