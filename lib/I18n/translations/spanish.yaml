STR_INTERCEPT_TITLE_0: "BARRACÓN 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. Te han encerrado en el barracón 14 para interrogarte: falta una pieza de la máquina Bombe. Llevas en el abrigo un mensaje interceptado esa mañana. Alguien se detiene al otro lado de la puerta."
STR_INTERCEPT_CHOICE_0_0: "Repasar de qué te acusan"
STR_INTERCEPT_CHOICE_0_1: "Esperar a quien te interrogará"
STR_INTERCEPT_CHOICE_0_2: "Revisar el abrigo"
STR_INTERCEPT_TITLE_1: "LA ACUSACIÓN"
STR_INTERCEPT_TEXT_1: "Sospechan que has traicionado a tu país. Tu trabajo consiste en resolver códigos, crucigramas y problemas de ajedrez. Ahora debes resolver otro problema: explicar lo ocurrido sin contradecirte ni perder la confianza de quien te interrogue."
STR_INTERCEPT_CHOICE_1_0: "Elegir un plan"
STR_INTERCEPT_CHOICE_1_1: "Escuchar lo que saben"
STR_INTERCEPT_TITLE_2: "LLEGA HARRIS"
STR_INTERCEPT_TEXT_2: "Harris entra con una taza de té y un expediente. Ha desaparecido un tambor de la Bombe, la máquina que ayuda a descifrar códigos alemanes. Anoche estabas de servicio. Harris deja el té a tu lado y te pregunta dónde estuviste."
STR_INTERCEPT_CHOICE_2_0: "Beber el té"
STR_INTERCEPT_CHOICE_2_1: "No tocar el té"
STR_INTERCEPT_CHOICE_2_2: "Responder con calma"
STR_INTERCEPT_TITLE_3: "LA PIEZA"
STR_INTERCEPT_TEXT_3: "Metes la mano en el forro del abrigo y tocas una pieza de metal: el tambor sigue ahí. Hooper te obligó a robarlo y prometió poner fin al chantaje si lo hacías. Ahora entiendes por qué te han encerrado."
STR_INTERCEPT_CHOICE_3_0: "Mantener la pieza oculta"
STR_INTERCEPT_CHOICE_3_1: "Dársela a Harris"
STR_INTERCEPT_TITLE_4: "TU ESTRATEGIA"
STR_INTERCEPT_TEXT_4: "Si cooperas, quizá Harris te crea. Una coartada falsa podría darte tiempo, pero también ponerte en evidencia. Si huyes, tendrás que esquivar a los guardias. Debes elegir cómo actuar; no podrás deshacer tus decisiones."
STR_INTERCEPT_CHOICE_4_0: "Cooperar"
STR_INTERCEPT_CHOICE_4_1: "Inventar una coartada"
STR_INTERCEPT_CHOICE_4_2: "Revisar la ventana"
STR_INTERCEPT_TITLE_5: "EL TÉ"
STR_INTERCEPT_TEXT_5: "Todo empieza a darte vueltas después de beber el té. Intentas fijarte en Harris, pero pierdes el conocimiento. Cuando vuelves en ti, hay otra persona junto a la mesa."
STR_INTERCEPT_CHOICE_5_0: "Fingir que duermes"
STR_INTERCEPT_CHOICE_5_1: "Hablar con quien ha entrado"
STR_INTERCEPT_CHOICE_5_2: "Pedir agua"
STR_INTERCEPT_TITLE_6: "RECHAZAS EL TÉ"
STR_INTERCEPT_TEXT_6: "Apartas la taza sin beber. Harris se fija en ese gesto y te pregunta si hay alguien más a quien debería interrogar."
STR_INTERCEPT_CHOICE_6_0: "Preguntar qué pruebas tiene"
STR_INTERCEPT_CHOICE_6_1: "Mencionar a Hooper"
STR_INTERCEPT_CHOICE_6_2: "Mirar la ventana"
STR_INTERCEPT_TITLE_7: "EL TAMBOR PERDIDO"
STR_INTERCEPT_TEXT_7: "Harris te hace una pregunta directa: ¿robaste el tambor? Puedes entregarle la pieza que llevas en el abrigo, contarle que Hooper te chantajeó o intentar culpar a Hooper del robo."
STR_INTERCEPT_CHOICE_7_0: "Entregar la pieza"
STR_INTERCEPT_CHOICE_7_1: "Explicar el chantaje"
STR_INTERCEPT_CHOICE_7_2: "Acusar a Hooper"
STR_INTERCEPT_TITLE_8: "METAL EN LA MESA"
STR_INTERCEPT_TEXT_8: "Dejas el tambor sobre la mesa. Harris lo examina, pero sigue desconfiando de ti. Devolverlo no explica por qué lo robaste. Quiere saber quién te presionó y necesita algo que pueda comprobar."
STR_INTERCEPT_CHOICE_8_0: "Ofrecerte a buscar pruebas"
STR_INTERCEPT_CHOICE_8_1: "Quedarte y responder"
STR_INTERCEPT_TITLE_9: "LA COARTADA"
STR_INTERCEPT_TEXT_9: "Dices que pasaste una noche tranquila trabajando en tu escritorio. Harris consulta el expediente: un guardia te vio salir de la sala de máquinas. Hay un testigo que contradice tu coartada."
STR_INTERCEPT_CHOICE_9_0: "Mantener la coartada falsa"
STR_INTERCEPT_CHOICE_9_1: "Admitir el chantaje"
STR_INTERCEPT_CHOICE_9_2: "Negarte a responder"
STR_INTERCEPT_TITLE_10: "LA VENTANA"
STR_INTERCEPT_TEXT_10: "La ventana está muy alta y el vidrio es grueso. Al otro lado hay un sendero que pasa junto a otro barracón. Romper el vidrio llamaría la atención, pero quedarte aquí también tiene sus riesgos."
STR_INTERCEPT_CHOICE_10_0: "Romper el cristal"
STR_INTERCEPT_CHOICE_10_1: "Observar el sendero"
STR_INTERCEPT_CHOICE_10_2: "Volver a la entrevista"
STR_INTERCEPT_TITLE_11: "UNA VISITA INESPERADA"
STR_INTERCEPT_TEXT_11: "Hooper ha entrado mientras te recuperas del efecto del té. Quiere saber si le has dado el tambor a Harris. Mantiene una mano junto a la puerta, como si estuviera listo para marcharse."
STR_INTERCEPT_CHOICE_11_0: "Fingir que duermes"
STR_INTERCEPT_CHOICE_11_1: "Exigirle una explicación"
STR_INTERCEPT_CHOICE_11_2: "Pedir agua"
STR_INTERCEPT_TITLE_12: "UNA ADVERTENCIA"
STR_INTERCEPT_TEXT_12: "Llamas a Harris antes de perder el conocimiento. Regresa molesto. Si vas a decirle que alguien ha puesto algo en el té, necesitarás una prueba que pueda analizar."
STR_INTERCEPT_CHOICE_12_0: "Guardar la taza como prueba"
STR_INTERCEPT_CHOICE_12_1: "Acusar a Harris de envenenarte"
STR_INTERCEPT_CHOICE_12_2: "Centrarte en el tambor"
STR_INTERCEPT_TITLE_13: "HOOPER"
STR_INTERCEPT_TEXT_13: "Harris conoce a Hooper: es un hombre útil y con buenos contactos. También estuvo de servicio anoche. Eso hace que tu acusación sea posible, pero todavía no demuestra nada."
STR_INTERCEPT_CHOICE_13_0: "Buscar una prueba comprobable"
STR_INTERCEPT_CHOICE_13_1: "Insistir en que fue Hooper"
STR_INTERCEPT_TITLE_14: "CHANTAJE"
STR_INTERCEPT_TEXT_14: "Le hablas a Harris de un joven, de un secreto íntimo que alguien reveló y de la amenaza que vino después. Te escucha sin darte pistas sobre lo que piensa. Si cuentas quién preparó la trampa, quizá también expongas a la persona que intentabas proteger."
STR_INTERCEPT_CHOICE_14_0: "Contarlo todo a Harris"
STR_INTERCEPT_CHOICE_14_1: "Omitir los nombres"
STR_INTERCEPT_CHOICE_14_2: "Proponer atrapar a Hooper"
STR_INTERCEPT_TITLE_15: "ACUSAR NO BASTA"
STR_INTERCEPT_TEXT_15: "Afirmas que Hooper es el responsable. Harris te pregunta cómo lo sabes. Sospechar de alguien no basta: necesitas un testigo o una prueba que permita demostrarlo."
STR_INTERCEPT_CHOICE_15_0: "Responder a las dudas de Harris"
STR_INTERCEPT_CHOICE_15_1: "Mandar un mensaje a Hooper"
STR_INTERCEPT_TITLE_16: "BUSCAR PRUEBAS"
STR_INTERCEPT_TEXT_16: "Harris puede poner en duda tu relato. Un documento, un testigo o la pieza robada serían más difíciles de negar. Te queda poco tiempo para decidir qué prueba buscar."
STR_INTERCEPT_CHOICE_16_0: "Revisar el barracón cercano"
STR_INTERCEPT_CHOICE_16_1: "Revisar el mensaje interceptado"
STR_INTERCEPT_CHOICE_16_2: "Interrogar a Hooper"
STR_INTERCEPT_TITLE_17: "UNA ÚLTIMA OPORTUNIDAD"
STR_INTERCEPT_TEXT_17: "La máquina ya puede volver a funcionar, pero Harris aún debe averiguar quién organizó el robo. Te da una última oportunidad para demostrarlo."
STR_INTERCEPT_CHOICE_17_0: "Mostrar las pruebas"
STR_INTERCEPT_CHOICE_17_1: "Buscar pruebas"
STR_INTERCEPT_CHOICE_17_2: "Aceptar su decisión"
STR_INTERCEPT_TITLE_18: "UNA CONTRADICCIÓN"
STR_INTERCEPT_TEXT_18: "Harris compara lo que dijiste al principio con lo que acabas de contar. Las dos versiones no pueden ser ciertas. Puedes reconocer que mentiste o mantener una contradicción que te hará perder su confianza."
STR_INTERCEPT_CHOICE_18_0: "Confesar el chantaje"
STR_INTERCEPT_CHOICE_18_1: "Seguir negándolo"
STR_INTERCEPT_CHOICE_18_2: "Intentar salir"
STR_INTERCEPT_TITLE_19: "SILENCIO"
STR_INTERCEPT_TEXT_19: "Te cruzas de brazos y dejas de responder. Harris cierra el expediente. Tu silencio no detiene la investigación; solo te impide influir en cómo seguirá."
STR_INTERCEPT_CHOICE_19_0: "Escuchar qué decide Harris"
STR_INTERCEPT_TITLE_20: "CRISTALES ROTOS"
STR_INTERCEPT_TEXT_20: "El vidrio se rompe. Entran el aire frío y el sonido del silbato de un guardia. Solo tienes tiempo para tomar una decisión antes de que alguien llegue a la puerta."
STR_INTERCEPT_CHOICE_20_0: "Correr al sendero"
STR_INTERCEPT_CHOICE_20_1: "Dejar una pista en clave"
STR_INTERCEPT_CHOICE_20_2: "Quedarte y explicar"
STR_INTERCEPT_TITLE_21: "ENTRE BARRACONES"
STR_INTERCEPT_TEXT_21: "El sendero está mojado. El barracón de Hooper queda lo bastante cerca como para llegar antes de la próxima patrulla. También podrías aprovechar la oscuridad para intentar salir del recinto."
STR_INTERCEPT_CHOICE_21_0: "Intentar salir del recinto"
STR_INTERCEPT_CHOICE_21_1: "Entrar al barracón de Hooper"
STR_INTERCEPT_CHOICE_21_2: "Volver con Harris"
STR_INTERCEPT_TITLE_22: "UN MENSAJE EN CLAVE"
STR_INTERCEPT_TEXT_22: "Hooper te observa mientras dibuja con los dedos una posición de ajedrez imaginaria sobre la mesa. Si respondes con una pista en clave, quizá revele algo que no admitiría ante una acusación directa."
STR_INTERCEPT_CHOICE_22_0: "Responder con una clave de ajedrez"
STR_INTERCEPT_CHOICE_22_1: "Amenazar con delatarlo"
STR_INTERCEPT_CHOICE_22_2: "Hablar con sinceridad"
STR_INTERCEPT_TITLE_23: "CARA A CARA"
STR_INTERCEPT_TEXT_23: "Hooper te pregunta qué puedes demostrar. Solo pierde un poco la seguridad cuando mencionas detalles de su plan que, según él, no deberías conocer."
STR_INTERCEPT_CHOICE_23_0: "Mostrarle las pruebas"
STR_INTERCEPT_CHOICE_23_1: "Ofrecer la pieza a cambio"
STR_INTERCEPT_CHOICE_23_2: "Fingir que tienes pruebas"
STR_INTERCEPT_TITLE_24: "LA TAZA"
STR_INTERCEPT_TEXT_24: "Hooper te trae agua, pero antes intenta llevarse la taza de té. Tal vez conservar esa taza sea más útil que aceptar cualquier cosa que te ofrezca."
STR_INTERCEPT_CHOICE_24_0: "Guardar la taza"
STR_INTERCEPT_CHOICE_24_1: "Revisar de nuevo el abrigo"
STR_INTERCEPT_TITLE_25: "LA TAZA COMO PRUEBA"
STR_INTERCEPT_TEXT_25: "Conservas la taza y le pides a Harris que analice su contenido. Por fin tienes un objeto que respalda tu acusación. El intento de Hooper de retirarla es otro detalle que Harris puede investigar."
STR_INTERCEPT_CHOICE_25_0: "Dar la taza a Harris"
STR_INTERCEPT_CHOICE_25_1: "Mostrarla a Hooper"
STR_INTERCEPT_TITLE_26: "UNA ACUSACIÓN SIN PRUEBAS"
STR_INTERCEPT_TEXT_26: "Acusas a Harris de haber puesto algo en el té, pero no tienes pruebas. Él cree que intentas desacreditarlo para librarte del interrogatorio. Ahora será más difícil que te crea."
STR_INTERCEPT_CHOICE_26_0: "Dejar que termine el interrogatorio"
STR_INTERCEPT_TITLE_27: "TODA LA VERDAD"
STR_INTERCEPT_TEXT_27: "Das los nombres y cuentas cómo fue el encuentro. Harris te hace preguntas concretas. Te avergüenza hablar del asunto, pero ahora él dispone de datos que puede comprobar."
STR_INTERCEPT_CHOICE_27_0: "Dejar que lo compruebe"
STR_INTERCEPT_CHOICE_27_1: "Ofrecerte a buscar a Hooper"
STR_INTERCEPT_TITLE_28: "EL FAROL FRACASA"
STR_INTERCEPT_TEXT_28: "Harris ya ha oído demasiadas afirmaciones sin pruebas. Hooper tampoco se deja intimidar. Hablar con seguridad no resuelve lo que falta en tu relato."
STR_INTERCEPT_CHOICE_28_0: "Insistir sin presentar pruebas"
STR_INTERCEPT_CHOICE_28_1: "Intentar huir"
STR_INTERCEPT_CHOICE_28_2: "Admitir la verdad"
STR_INTERCEPT_TITLE_29: "THE INTERCEPT"
STR_INTERCEPT_TEXT_29: "El mensaje que llevas en el bolsillo contiene algo más que letras cifradas: el recorrido que hizo por los barracones sitúa a Hooper cerca de la máquina. Puedes usarlo como prueba o enviar una pista en clave para que alguien investigue."
STR_INTERCEPT_CHOICE_29_0: "Cifrar un mensaje para Hooper"
STR_INTERCEPT_CHOICE_29_1: "Mostrar el recorrido del mensaje"
STR_INTERCEPT_TITLE_30: "LA MÁQUINA FUNCIONA"
STR_INTERCEPT_TEXT_30: "Harris recupera el tambor y encuentra pruebas que van más allá de tus primeras respuestas, dadas por miedo. La Bombe vuelve a funcionar. Sales libre del barracón 14. Has aclarado parte de lo ocurrido, aunque aún tendrás que asumir sus consecuencias."
STR_INTERCEPT_TITLE_31: "BAJO SOSPECHA"
STR_INTERCEPT_TEXT_31: "Devolver el tambor evita que la máquina siga detenida, pero no te libra de sospechas. Harris te retira el acceso a los barracones mientras continúa la investigación. Sales del interrogatorio sin haber demostrado tu inocencia."
STR_INTERCEPT_TITLE_32: "BAJO CUSTODIA"
STR_INTERCEPT_TEXT_32: "La puerta se abre para que entre un guardia. Tus contradicciones, la falta de pruebas y el robo del tambor han acabado en tu detención. Esta partida termina aquí."
STR_INTERCEPT_TITLE_33: "EL SENDERO EXTERIOR"
STR_INTERCEPT_TEXT_33: "Dejas atrás los barracones y te amparas en la oscuridad. El recinto está vigilado. La ventana rota ha puesto a las patrullas en alerta y están más cerca de lo que esperabas."
STR_INTERCEPT_CHOICE_33_0: "Cruzar el terreno abierto"
STR_INTERCEPT_CHOICE_33_1: "Seguir el camino de servicio"
STR_INTERCEPT_CHOICE_33_2: "Volver y afrontar a Harris"
STR_INTERCEPT_TITLE_34: "EL BARRACÓN DE HOOPER"
STR_INTERCEPT_TEXT_34: "No hay nadie en el escritorio de Hooper. Bajo un crucigrama encuentras varios papeles y un horario escrito a lápiz que menciona la sala de máquinas. Oyes pasos acercándose por el pasillo de madera."
STR_INTERCEPT_CHOICE_34_0: "Revisar los papeles"
STR_INTERCEPT_CHOICE_34_1: "Esperar a Hooper"
STR_INTERCEPT_CHOICE_34_2: "Ir con Harris"
STR_INTERCEPT_TITLE_35: "UN RETO DE AJEDREZ"
STR_INTERCEPT_TEXT_35: "Le planteas a Hooper un problema de ajedrez que refleja su situación: una pieza protegida, un rey expuesto y una jugada que parece segura hasta que responde el rival. Entiende la advertencia. Su respuesta revela la conexión que buscabas."
STR_INTERCEPT_CHOICE_35_0: "Pedirle que reconozca su plan"
STR_INTERCEPT_CHOICE_35_1: "Enviar la confesión a Harris"
STR_INTERCEPT_TITLE_36: "HABLAR SIN MENTIR"
STR_INTERCEPT_TEXT_36: "Deja de fingir que nadie te ha presionado y hablas con sinceridad. Por un momento, Hooper también responde sin esconderse tras sus amenazas. Puedes intentar llegar a un acuerdo o usar esa apertura para que confiese."
STR_INTERCEPT_CHOICE_36_0: "Proponer un acuerdo sincero"
STR_INTERCEPT_CHOICE_36_1: "Pedirle que confiese"
STR_INTERCEPT_CHOICE_36_2: "Contarle a Harris lo que ha dicho"
STR_INTERCEPT_TITLE_37: "LA CONFESIÓN DE HOOPER"
STR_INTERCEPT_TEXT_37: "Hooper admite lo suficiente para relacionar el chantaje con el robo del tambor. Harris podría recuperar la pieza y comprobar tu versión. Debes decidir si llevas la confesión hasta él o dejas que Hooper escape."
STR_INTERCEPT_CHOICE_37_0: "Comunicar la confesión a Harris"
STR_INTERCEPT_CHOICE_37_1: "Dejar ir a Hooper y marcharte"
STR_INTERCEPT_TITLE_38: "UN TRATO ARRIESGADO"
STR_INTERCEPT_TEXT_38: "Pones al alcance de Hooper lo único que todavía te permite negociar. Sin testigos ni pruebas, nada le impediría quedarse con la pieza y dejar que cargues con la culpa."
STR_INTERCEPT_CHOICE_38_0: "Entregar la pieza"
STR_INTERCEPT_CHOICE_38_1: "Pedir un testigo para el acuerdo"
STR_INTERCEPT_CHOICE_38_2: "Retirar la oferta"
STR_INTERCEPT_TITLE_39: "HARRIS ESCUCHA"
STR_INTERCEPT_TEXT_39: "Harris escucha: esta vez hay detalles que puede comprobar. Te pregunta dónde está el tambor. Demostrar lo que pasó y recuperar la pieza son dos tareas distintas; todavía debes resolver ambas."
STR_INTERCEPT_CHOICE_39_0: "Entregar el tambor de tu abrigo"
STR_INTERCEPT_CHOICE_39_1: "Ayudar a recuperar la pieza"
STR_INTERCEPT_CHOICE_39_2: "Dejar de responder"
STR_INTERCEPT_TITLE_40: "MÁS ALLÁ DE LA VALLA"
STR_INTERCEPT_TEXT_40: "Los barracones desaparecen a tu espalda. Has conseguido escapar, pero eso no demuestra tu inocencia. La máquina sigue siendo un problema urgente para quienes se quedaron. Tu historia termina sin resolver el robo."
STR_INTERCEPT_TITLE_41: "EL ÚLTIMO ERROR"
STR_INTERCEPT_TEXT_41: "No te quedan salidas seguras: puede que la patrulla te haya alcanzado al cruzar el terreno abierto o que Hooper haya incumplido su promesa. Esta partida ha terminado. Puedes empezar otra y tomar decisiones diferentes."
STR_INTERCEPT_TITLE_42: "LOS PAPELES"
STR_INTERCEPT_TEXT_42: "El horario sitúa a Hooper donde tú afirmabas que estuvo. Junto a él aparece la nota con la que te atrajo a la trampa. Ambos documentos contienen detalles que Harris puede verificar."
STR_INTERCEPT_CHOICE_42_0: "Llevar los papeles a Harris"
STR_INTERCEPT_CHOICE_42_1: "Esperar a Hooper y confrontarlo"
STR_INTERCEPT_TITLE_43: "DEVOLVER LA PIEZA"
STR_INTERCEPT_TEXT_43: "Hooper ofrece devolver la pieza a su sitio. Si confías en él, quizá soluciones el problema inmediato. Si Harris presencia la devolución, será más difícil que Hooper vuelva a engañarte."
STR_INTERCEPT_CHOICE_43_0: "Exigir testigos para la devolución"
STR_INTERCEPT_CHOICE_43_1: "Incluir a Harris en el plan"
STR_INTERCEPT_TITLE_44: "RECUPERAR EL TAMBOR"
STR_INTERCEPT_TEXT_44: "Harris ya ha dejado constancia de tu declaración. Ahora toca recuperar la pieza. Revisa la sala de máquinas mientras tú le indicas dónde debería estar el tambor."
STR_INTERCEPT_CHOICE_44_0: "Confirmar que la pieza ha vuelto"
STR_INTERCEPT_CHOICE_44_1: "Sacarla de tu abrigo"
STR_INTERCEPT_CHOICE_44_2: "Advertir a Harris de Hooper"
STR_INTERCEPT_TITLE_45: "LA PREGUNTA FINAL"
STR_INTERCEPT_TEXT_45: "Harris espera tu última respuesta. Si puedes relacionar a Hooper con el robo, aún hay una forma de recuperar el tambor y cerrar el caso. De lo contrario, solo quedará tu relato lleno de cambios."
STR_INTERCEPT_CHOICE_45_0: "Presentar las pruebas"
STR_INTERCEPT_CHOICE_45_1: "Admitir que no tienes más"
