STR_QUOTES_HELP: "Para marcar texto al leer, mantén una palabra y arrastra los tiradores. Luego guarda la cita. Aquí aparecen tus citas, las más nuevas primero. Se guardan en /My Clippings.txt."
STR_FLASHCARDS_APP: "Flashcards"
STR_FLASHCARDS_WHERE: "Archivos: /FLASHCARDS  -  Ayuda"
STR_FLASHCARDS_HELP: "Copia a /FLASHCARDS mazos Anki (.apkg/.colpkg, .anki2/.anki21), CSV/TSV/texto o carpetas Study convertidas. Subcarpetas: hasta 128 elementos cada una.\n\nAdmite texto básico, invertido y de huecos simples. No admite audio ni HTML a medida. Convierte antes los mazos con imágenes o CJK. Repasos FSRS sin conexión. Importar inicia un calendario nuevo y conserva los originales."
