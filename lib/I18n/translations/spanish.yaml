STR_CAR_GUIDE_SOLVE: "Cómo resolver un caso"
STR_CAR_GUIDE_SOLVE_COPY: "Debes resolver un asesinato. Escucha a los personajes y descubre quién es culpable. Al abrir un caso verás cuántos culpables y mentiras hay."
STR_CAR_GUIDE_SINCERE: "Culpa y sinceridad"
STR_CAR_GUIDE_SINCERE_COPY: "Algunos personajes dicen la verdad y otros mienten. Mentir no convierte a alguien en culpable: un inocente también puede mentir."
STR_CAR_GUIDE_EXAMPLE: "Ejemplo"
STR_CAR_GUIDE_EXAMPLE_COPY: "Si el caso tiene 1 culpable y 1 mentira, busca una sola persona culpable y una sola declaración falsa. Todas las demás declaraciones deben ser ciertas."
STR_CAR_GUIDE_OR: "A o B lo hizo"
STR_CAR_GUIDE_OR_COPY: "«Ana o Bruno lo hizo» significa que al menos uno es culpable. Si quien habla miente, ninguno de los dos lo hizo."
STR_CAR_GUIDE_AND: "A y B lo hicieron"
STR_CAR_GUIDE_AND_COPY: "«Ana y Bruno lo hicieron» afirma que los dos son culpables. Si es mentira, al menos uno es inocente."
STR_CAR_GUIDE_COMPARE: "Sinceridad"
STR_CAR_GUIDE_COMPARE_COPY: "«Ambos dicen la verdad o ambos mienten» compara sus declaraciones. No dice si son culpables. Comprueba si las dos son ciertas o las dos son falsas."
STR_CAR_GUIDE_NEIGHBOURS: "Vecinos"
STR_CAR_GUIDE_NEIGHBOURS_COPY: "Las pistas muestran directamente los dos nombres. Cambiar de página no altera la relación."
STR_CAR_GUIDE_RELIABLE: "Datos fiables"
STR_CAR_GUIDE_RELIABLE_COPY: "Los nombres, las alturas y las dietas son fiables. Las declaraciones pueden mentir. Las alturas son ficticias."
STR_CAR_GUIDE_HEIGHT: "Altura y dieta"
STR_CAR_GUIDE_HEIGHT_COPY: "La altura y la dieta de cada ficha siempre son correctas. «El culpable es más alto que yo» compara al culpable con quien habla. Un omnívoro no cuenta como carnívoro ni herbívoro."
STR_CAR_GUIDE_MARKS: "Tus marcas"
STR_CAR_GUIDE_MARKS_COPY: "Lee cada declaración. Usa Verdad, Mentira y Sospechoso para anotar tus ideas. Estas marcas son tus notas: el juego no te dice si acertaste todavía."
STR_CAR_GUIDE_NAV: "Navegación"
STR_CAR_GUIDE_NAV_COPY: "En vertical, 3 por página. Flechas: más personajes."
STR_CAR_GUIDE_CONFIRM: "Confirmar acusación"
STR_CAR_GUIDE_CONFIRM_COPY: "Cuando tus ideas encajen con todas las pistas y con el número de mentiras, toca Acusar. Elige los culpables y confirma tu respuesta."
STR_CAR_GUIDE_LIVES: "Vidas y resultado"
STR_CAR_GUIDE_LIVES_COPY: "Principiante y Normal: 2 vidas. Avanzado y Experto: 1. Acertar resuelve el caso; agotar vidas permite ver la solución."
STR_CAR_GUIDE_CAMPAIGN: "Campaña"
STR_CAR_GUIDE_CAMPAIGN_COPY: "Abrir caso continúa tu partida. En Campaña puedes elegir entre 1.470 casos. Empieza en Principiante si estás aprendiendo."
STR_CAR_GUIDE_REPEAT: "Repetir y guardar"
STR_CAR_GUIDE_REPEAT_COPY: "Repetir caso inicia otro intento sin borrar el resultado anterior. El progreso y las vidas se guardan en la microSD."

