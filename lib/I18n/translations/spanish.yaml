STR_INTERCEPT_ABOUT: "Adaptación breve de The Intercept, de inkle (2016), con licencia MIT. Eres un descifrador de códigos en Bletchley Park, durante la Segunda Guerra Mundial. Alguien te ha chantajeado para que robes una pieza de la máquina Bombe. Ahora te interrogan por su desaparición.\n\nLee cada escena y elige qué decir o hacer. Si el texto ocupa más de una página, usa las flechas. Cada decisión guarda tu avance. Una nueva historia sustituye la partida guardada.\n\nEl proyecto incluye el guion original y su licencia. Las ilustraciones se crearon para este firmware."
