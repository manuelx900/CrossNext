STR_PET_STORY_1: "Un día de lluvia"
STR_PET_STORY_TEXT_1: "La lluvia golpea la ventana mientras lees. Tu mascota se acurruca cerca. Por un rato, toda la habitación parece un refugio."
STR_PET_STORY_2: "La visita"
STR_PET_STORY_TEXT_2: "Un pájaro se posa en la ventana. Tu mascota lo observa hasta que se va. Marcas la página y sonríes."
STR_PET_STORY_3: "Barco de papel"
STR_PET_STORY_TEXT_3: "Un trozo de papel se convierte en un barquito. Tu mascota lo sigue por la mesa, como si llevara una aventura entera."
STR_PET_STORY_4: "Bajo las estrellas"
STR_PET_STORY_TEXT_4: "Después de leer miráis afuera. Aparece una estrella, luego otra. Todavía queda mucho por descubrir."
STR_PET_STORY_5: "La hoja perdida"
STR_PET_STORY_TEXT_5: "Tu mascota te trae una hoja. La guardas junto al marcapáginas: un pequeño regalo de un día cualquiera."
STR_PET_STORY_6: "Un rincón tranquilo"
STR_PET_STORY_TEXT_6: "Encuentras un rincón cómodo y abres tu libro. Tu mascota se acomoda a tu lado. Ninguno tiene prisa."
STR_PET_STORY_7: "Un camino nuevo"
STR_PET_STORY_TEXT_7: "Una página más te lleva a otro lugar. Tu mascota se estira y te mira, lista para el capítulo de mañana."
