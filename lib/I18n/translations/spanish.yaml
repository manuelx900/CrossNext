STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "El comienzo de la aventura"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Durante muchos años, las personas vivieron en paz y disfrutaron de sus libros. Pero un día, el Rey del Olvido comenzó a destruirlos. Su objetivo era que nadie pudiera volver a leer y que todas las historias desaparecieran para siempre."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Los monstruos del rey"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Para cumplir su plan, el Rey del Olvido envió a sus monstruos por todo el mundo. Estas criaturas destruyen los libros que encuentran y atacan a cualquiera que intente detenerlas. Poco a poco, las bibliotecas comenzaron a desaparecer y las personas dejaron de leer."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "El poder de la lectura"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Un día, mientras lees cerca de tu aldea, aparece uno de estos monstruos. Intentas escapar, pero descubres algo sorprendente: cuanto más lees, más débil se vuelve la criatura. Entonces comprendes que la lectura es la única forma de luchar contra la magia del Rey del Olvido."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Tu misión"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Decides emprender un viaje para detener al rey. Para llegar hasta su castillo tendrás que recorrer bosques, ciudades, montañas y otros lugares llenos de enemigos. Cada monstruo que derrotes te permitirá avanzar un poco más. Tu misión es sencilla: seguir leyendo, vencer a los guardianes del rey y llegar hasta él antes de que destruya todos los libros del mundo."
