STR_INTERCEPT_TITLE_0: "HUT 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. Oni vas drže da čekate iza zaključanih vrata. Komponenta iz računske mašine je nestala. Jutarnji presretak šušti u džepu kaputa. Napolju se zaustavljaju koraci."
STR_INTERCEPT_CHOICE_0_0: "Razmislite o optužbi"
STR_INTERCEPT_CHOICE_0_1: "Sačekajte sagovornika"
STR_INTERCEPT_CHOICE_0_2: "Pretražite svoj kaput"
STR_INTERCEPT_TITLE_1: "OPTUŽBA"
STR_INTERCEPT_TEXT_1: "Sumnjaju na izdaju. Za život rješavate figure, ukrštene riječi i šahovske pozicije. Ova soba je još jedan problem: proturječite sami sebi, a vaš kredibilitet može biti prva žrtva."
STR_INTERCEPT_CHOICE_1_0: "Odaberite strategiju"
STR_INTERCEPT_CHOICE_1_1: "Čujte šta znaju"
STR_INTERCEPT_TITLE_2: "HARRIS STIŽE"
STR_INTERCEPT_TEXT_2: "Harris ulazi sa šoljicom za čaj i turpijom. Bombe nedostaje kolut. Vaše ime je bilo na spisku dužnosti. Stavlja šolju pored vas i pita gde ste bili sinoć."
STR_INTERCEPT_CHOICE_2_0: "Popijte čaj"
STR_INTERCEPT_CHOICE_2_1: "Ostavite čaj netaknut"
STR_INTERCEPT_CHOICE_2_2: "Odgovorite mirno"
STR_INTERCEPT_TITLE_3: "KOMPONENTA"
STR_INTERCEPT_TEXT_3: "Unutar postave vašeg kaputa prsti se susreću sa hladnim metalom. Komponenta je još uvijek tu. Hooper je rekao da će uzimanje toga zaustaviti ucjenu. Sada zaključana vrata imaju drugačije značenje."
STR_INTERCEPT_CHOICE_3_0: "Držite skriveno"
STR_INTERCEPT_CHOICE_3_1: "Predajte to Harrisu"
STR_INTERCEPT_TITLE_4: "POBJEDNIČKA IGRA"
STR_INTERCEPT_TEXT_4: "Saradnja bi mogla sačuvati vaš kredibilitet. Uvjerljiva laž bi mogla kupiti vrijeme. Escape bi zamijenio zaključanu sobu za stražare napolju. Nijedan od ovih poteza se ne može vratiti."
STR_INTERCEPT_CHOICE_4_0: "Sarađujte"
STR_INTERCEPT_CHOICE_4_1: "Izmislite alibi"
STR_INTERCEPT_CHOICE_4_2: "Pregledajte prozor"
STR_INTERCEPT_TITLE_5: "ČAJ"
STR_INTERCEPT_TEXT_5: "Soba se naginje. Haris primjećuje tvoju tišinu, ali mu se lice već povlači. Kada sljedeći put otvorite oči, drugi par cipela stoji pored stola."
STR_INTERCEPT_CHOICE_5_0: "Pravite se da spavate"
STR_INTERCEPT_CHOICE_5_1: "Suočite se sa posetiocem"
STR_INTERCEPT_CHOICE_5_2: "Zatražite vodu"
STR_INTERCEPT_TITLE_6: "MALO ODBIJANJE"
STR_INTERCEPT_TEXT_6: "Odgurnete šolju. Haris pažljivije posmatra pokret nego odgovor. Pita da li postoji još neko koga bi trebao ispitati."
STR_INTERCEPT_CHOICE_6_0: "Pitajte koje dokaze ima"
STR_INTERCEPT_CHOICE_6_1: "Pomenuti Hoopera"
STR_INTERCEPT_CHOICE_6_2: "Pogledaj prema prozoru"
STR_INTERCEPT_TITLE_7: "KOLUT koji nedostaje"
STR_INTERCEPT_TEXT_7: "Haris želi direktan odgovor. Jeste li uzeli komponentu? Možete mu reći šta je u vašem kaputu, objasniti pritisak koji je Hooper izvršio ili pokušati da ukažete na optužbu negdje drugdje."
STR_INTERCEPT_CHOICE_7_0: "Daj mu komponentu"
STR_INTERCEPT_CHOICE_7_1: "Objasnite ucjenu"
STR_INTERCEPT_CHOICE_7_2: "Optužite Hoopera"
STR_INTERCEPT_TITLE_8: "METAL NA STOLU"
STR_INTERCEPT_TEXT_8: "Komponenta leži između vas. Haris to provjerava bez opuštanja. Vraćanje ukradene opreme ne objašnjava zašto je oduzeta. Želi ime i nešto pouzdanije od tvoje riječi."
STR_INTERCEPT_CHOICE_8_0: "Ponudite pronalaženje dokaza"
STR_INTERCEPT_CHOICE_8_1: "Ostanite i odgovorite na pitanja"
STR_INTERCEPT_TITLE_9: "ALIBI"
STR_INTERCEPT_TEXT_9: "Opisujete mirno veče za svojim stolom. Haris otvara fajl. Čuvar te je vidio kako izlaziš iz strojarnice. Vaš izmišljeni račun sada ima svjedoka protiv toga."
STR_INTERCEPT_CHOICE_9_0: "Odbrani priču"
STR_INTERCEPT_CHOICE_9_1: "Priznajte ucjenu"
STR_INTERCEPT_CHOICE_9_2: "Odbijte dalja pitanja"
STR_INTERCEPT_TITLE_10: "PROZOR"
STR_INTERCEPT_TEXT_10: "Prozor je visok, a staklo debelo. Iza nje, put vodi pored druge kolibe. Razbijanje bi bilo glasno; čekanje ovdje ima svoje opasnosti."
STR_INTERCEPT_CHOICE_10_0: "Razbijte staklo"
STR_INTERCEPT_CHOICE_10_1: "Proučite stazu vani"
STR_INTERCEPT_CHOICE_10_2: "Vratite se na intervju"
STR_INTERCEPT_TITLE_11: "JOŠ JEDAN POSETILAC"
STR_INTERCEPT_TEXT_11: "Hooper je došao dok si nesiguran. Želi da zna da li Haris ima komponentu. Drži jednu ruku blizu vrata."
STR_INTERCEPT_CHOICE_11_0: "Pravite se da spavate"
STR_INTERCEPT_CHOICE_11_1: "Zahtijevajte objašnjenje"
STR_INTERCEPT_CHOICE_11_2: "Zatražite vodu"
STR_INTERCEPT_TITLE_12: "UPOZORENJE"
STR_INTERCEPT_TEXT_12: "Pozovite Harrisa prije nego što se čaj primi. Vraća se iznerviran. Optužba o peharu će trebati nešto što može testirati."
STR_INTERCEPT_CHOICE_12_0: "Zadržite šolju kao dokaz"
STR_INTERCEPT_CHOICE_12_1: "Optužite Harrisa da vas je otrovao"
STR_INTERCEPT_CHOICE_12_2: "Koncentrišite se na kolut"
STR_INTERCEPT_TITLE_13: "HOOPER"
STR_INTERCEPT_TEXT_13: "Haris prepoznaje ime. Hooper je koristan, dobro povezan, a nije odsutan ni sa sinoćnjeg popisa. Priznanje nije dokaz."
STR_INTERCEPT_CHOICE_13_0: "Pronađite nešto što se može provjeriti"
STR_INTERCEPT_CHOICE_13_1: "Insistirajte da ga je Hooper ukrao"
STR_INTERCEPT_TITLE_14: "UCENA"
STR_INTERCEPT_TEXT_14: "Opisujete mladog čovjeka, iznevjereno samopouzdanje i zahtjev koji je uslijedio. Haris sluša bez pomoći. Imenovanje osobe koja je postavila zamku takođe može razotkriti osobu koju ste nadali da ćete zaštititi."
STR_INTERCEPT_CHOICE_14_0: "Dajte Harrisu cijeli račun"
STR_INTERCEPT_CHOICE_14_1: "Izostavite imena"
STR_INTERCEPT_CHOICE_14_2: "Predložite način da uhvatite Hoopera"
STR_INTERCEPT_TITLE_15: "LAKA OPTUŽBA"
STR_INTERCEPT_TEXT_15: "Hooper, kažete, mora biti odgovoran. Harris pita kako znaš. Postoji razlika između rješavanja problema i stvaranja svjedoka koji može dokazati odgovor."
STR_INTERCEPT_CHOICE_15_0: "Neka Harris ospori tvrdnju"
STR_INTERCEPT_CHOICE_15_1: "Pokušajte poslati privatnu poruku Hooperu"
STR_INTERCEPT_TITLE_16: "PROVERLJIV TRAG"
STR_INTERCEPT_TEXT_16: "Priča se može poreći. Teže je objasniti dokument, svjedoka ili komponentu koja nedostaje. Imate malo vremena da odaberete čime ćete se baviti."
STR_INTERCEPT_CHOICE_16_0: "Pregledajte obližnju kolibu"
STR_INTERCEPT_CHOICE_16_1: "Koristite jutarnji presret"
STR_INTERCEPT_CHOICE_16_2: "Direktno pitanje Hoopera"
STR_INTERCEPT_TITLE_17: "VIŠE OD POVRATAKA"
STR_INTERCEPT_TEXT_17: "Mašina može ponovo da radi, ali Haris još uvek mora da objasni bezbednosni propust. On vam nudi posljednju priliku da ustanovite ko je to organizovao."
STR_INTERCEPT_CHOICE_17_0: "Pokažite dokaze"
STR_INTERCEPT_CHOICE_17_1: "Potražite dokaz"
STR_INTERCEPT_CHOICE_17_2: "Prihvatite njegovu presudu"
STR_INTERCEPT_TITLE_18: "KONTRADIKCIJA"
STR_INTERCEPT_TEXT_18: "Harris postavlja vaš prvi odgovor pored najnovijeg. Ne mogu oboje biti istiniti. Možete odustati od laži ili pustiti da se intervju završi na kontradikciji."
STR_INTERCEPT_CHOICE_18_0: "Recite istinu o ucjeni"
STR_INTERCEPT_CHOICE_18_1: "Nastavite sve poricati"
STR_INTERCEPT_CHOICE_18_2: "Pokušajte da odete"
STR_INTERCEPT_TITLE_19: "TIŠINA"
STR_INTERCEPT_TEXT_19: "Prekrižiš ruke. Harris zatvara fajl. U ovoj prostoriji tišina ne završava istragu; to samo završava tvoju ulogu u režiranju."
STR_INTERCEPT_CHOICE_19_0: "Čujte odluku"
STR_INTERCEPT_TITLE_20: "Slomljeno staklo"
STR_INTERCEPT_TEXT_20: "Okno popušta. Hladan vazduh i zvuk zvižduka stražara stižu zajedno. Ima vremena za jednu odluku prije nego što neko dođe do vrata."
STR_INTERCEPT_CHOICE_20_0: "Trčite prema vanjskoj stazi"
STR_INTERCEPT_CHOICE_20_1: "Ostavite kodirani trag"
STR_INTERCEPT_CHOICE_20_2: "Ostani i objasni"
STR_INTERCEPT_TITLE_21: "IZMEĐU KOLIBA"
STR_INTERCEPT_TEXT_21: "Staza je mokra. Hooperova koliba je dovoljno blizu da se stigne prije sljedeće patrole, ali otvoreno tlo iza nje nudi drugu vrstu šanse."
STR_INTERCEPT_CHOICE_21_0: "Pokušajte pobjeći sa terena"
STR_INTERCEPT_CHOICE_21_1: "Idi u Hooperovu kolibu"
STR_INTERCEPT_CHOICE_21_2: "Vratite se Harrisu"
STR_INTERCEPT_TITLE_22: "PRIVATNA IGRA"
STR_INTERCEPT_TEXT_22: "Hooper te proučava. Na stolu prstima postavlja zamišljenu šahovsku poziciju. Šifrirani odgovor mogao bi ga natjerati da otkrije ono što direktna optužba nikada ne bi."
STR_INTERCEPT_CHOICE_22_0: "Odgovorite šahovskim tragom"
STR_INTERCEPT_CHOICE_22_1: "Zaprijeti mu ime"
STR_INTERCEPT_CHOICE_22_2: "Govori iskreno"
STR_INTERCEPT_TITLE_23: "LICE U LICE"
STR_INTERCEPT_TEXT_23: "Hooper pita šta zapravo možete dokazati. Njegovo samopouzdanje pokoleba samo kada spomenete detalje koje neko izvan njegovog plana ne bi trebao znati."
STR_INTERCEPT_CHOICE_23_0: "Suočite ga s dokazom"
STR_INTERCEPT_CHOICE_23_1: "Ponudite komponentu kao trgovinu"
STR_INTERCEPT_CHOICE_23_2: "Blef"
STR_INTERCEPT_TITLE_24: "KUP"
STR_INTERCEPT_TEXT_24: "Huper donosi vodu, ali prvi poseže za šoljicom. Čuvanje te čaše moglo bi biti korisnije od prihvatanja bilo čega drugog što on nudi."
STR_INTERCEPT_CHOICE_24_0: "Zadrži šolju"
STR_INTERCEPT_CHOICE_24_1: "Provjerite svoj kaput ponovo"
STR_INTERCEPT_TITLE_25: "NEŠTO ZA TESTIRANJE"
STR_INTERCEPT_TEXT_25: "Zadržite čašu i tražite od Harrisa da je pregleda. Ovo je konačno optužba s prikačenim predmetom. Hooperov pokušaj da ga ukloni pruža još jedan koristan detalj."
STR_INTERCEPT_CHOICE_25_0: "Daj Harrisu šolju"
STR_INTERCEPT_CHOICE_25_1: "Suočite se s Hooperom"
STR_INTERCEPT_TITLE_26: "POGREŠNA CILJA"
STR_INTERCEPT_TEXT_26: "Optužujete Harrisa bez dokaza. Vidi kako osumnjičeni pokušava diskreditirati istražitelja. Šta god da se desilo sa čajem, otežali ste mu da vam poveruje."
STR_INTERCEPT_CHOICE_26_0: "Intervju se završava"
STR_INTERCEPT_TITLE_27: "CIJELI RAČUN"
STR_INTERCEPT_TEXT_27: "Dajete imena i opisujete sastanak. Haris postavlja precizna pitanja. Vaša sramota je stvarna, ali i detalji koje sada može provjeriti."
STR_INTERCEPT_CHOICE_27_0: "Neka on potvrdi račun"
STR_INTERCEPT_CHOICE_27_1: "Ponudite da pronađete Hoopera"
STR_INTERCEPT_TITLE_28: "NEUSPALI BLEF"
STR_INTERCEPT_TEXT_28: "Haris je čuo dovoljno sigurnih odgovora. Hooper takođe. Ni jedno ni drugo ne potvrđuje činjenicu da vaša priča nedostaje."
STR_INTERCEPT_CHOICE_28_0: "Ustrajati u zahtjevu"
STR_INTERCEPT_CHOICE_28_1: "Napravite očajnički bijeg"
STR_INTERCEPT_CHOICE_28_2: "Priznajte šta se zaista dogodilo"
STR_INTERCEPT_TITLE_29: "PRESREĆANJE"
STR_INTERCEPT_TEXT_29: "List u vašem džepu nosi više od zbrkanih slova: njegova ruta kroz kolibe stavlja Hoopera blizu mašine. Koncizan trag bi mogao navesti pravu osobu da potraži na pravom mjestu."
STR_INTERCEPT_CHOICE_29_0: "Kodiranje poruke za Hoopera"
STR_INTERCEPT_CHOICE_29_1: "Pokaži rutu do Harrisa"
STR_INTERCEPT_TITLE_30: "MAŠINA RADI"
STR_INTERCEPT_TEXT_30: "Haris ima komponentu i trag koji vodi dalje od vaših prvih uplašenih odgovora. Bombe nastavlja sa radom. Napuštate Hut 14 pod svojim imenom, s manje tajni i budućnošću za koju još morate odgovarati."
STR_INTERCEPT_TITLE_31: "POD SUMNJA"
STR_INTERCEPT_TEXT_31: "Vraćanje komponente spasilo je mašinu od kašnjenja. To nije spasilo tvoju poziciju. Haris prekida vaš pristup kolibama dok se istraga nastavlja. Preživjeli ste intervju, ali niste obrisali svoje ime."
STR_INTERCEPT_TITLE_32: "U PRITVORI"
STR_INTERCEPT_TEXT_32: "Vrata se otvaraju za čuvara, a ne za vas. Kontradikcije, nedostajući dokazi i ukradena komponenta postali su predmet koji više ne možete voditi. Ovaj pokušaj se ovdje završava."
STR_INTERCEPT_TITLE_33: "VANJSKI PUT"
STR_INTERCEPT_TEXT_33: "Ostavljate kolibe iza sebe. Mrak je koristan, ali teren se čuva. Razbijen prozor približio je patrole više nego što ste se nadali."
STR_INTERCEPT_CHOICE_33_0: "Pređite otvoreno tlo"
STR_INTERCEPT_CHOICE_33_1: "Držite se servisne putanje"
STR_INTERCEPT_CHOICE_33_2: "Okrenite se i suočite se s Harrisom"
STR_INTERCEPT_TITLE_34: "HOOPER'S HUT"
STR_INTERCEPT_TEXT_34: "Stol je bez nadzora. Radovi leže ispod ukrštenice, a mašinska soba se pojavljuje u olovkom napisanom rasporedu. Koraci se približavaju duž dasaka napolju."
STR_INTERCEPT_CHOICE_34_0: "Pregledajte papire"
STR_INTERCEPT_CHOICE_34_1: "Čekaj Hoopera"
STR_INTERCEPT_CHOICE_34_2: "Odlazak za Harris"
STR_INTERCEPT_TITLE_35: "ŠAHOVSKI PROBLEM"
STR_INTERCEPT_TEXT_35: "Dajete Hooperu poziciju koja odražava njegovu nevolju: zaštićenu figuru, izloženog kralja i potez koji izgleda sigurno do odgovora. Razumije upozorenje. Njegove sljedeće riječi pružaju vezu koja vam je potrebna."
STR_INTERCEPT_CHOICE_35_0: "Zamolite ga da prizna plan"
STR_INTERCEPT_CHOICE_35_1: "Pošaljite priznanje Harrisu"
STR_INTERCEPT_TITLE_36: "BEZ MASKA"
STR_INTERCEPT_TEXT_36: "Govorite o pritisku umjesto da se pretvarate da ga nikada nije bilo. Hooper kratko odgovara kao osoba, a ne kao protivnik. Taj otvor bi se mogao iskoristiti za trgovinu ili zamku."
STR_INTERCEPT_CHOICE_36_0: "Tražite pošten dogovor"
STR_INTERCEPT_CHOICE_36_1: "Zamolite ga da prizna"
STR_INTERCEPT_CHOICE_36_2: "Prenesite račun Harrisu"
STR_INTERCEPT_TITLE_37: "HOOPEROV PRIHVAT"
STR_INTERCEPT_TEXT_37: "Hooper objašnjava dovoljno da poveže ucjenu s komponentom koja nedostaje. Haris sada može povratiti opremu i provjeriti priču. Morate odlučiti da li ćete završiti istragu ili pustiti Hoopera da nestane."
STR_INTERCEPT_CHOICE_37_0: "Donesite Harrisu priznanje"
STR_INTERCEPT_CHOICE_37_1: "Pusti Hoopera i ode"
STR_INTERCEPT_TITLE_38: "TRGOVINA"
STR_INTERCEPT_TEXT_38: "Svoju posljednju polugu stavljate na dohvat Hoopera. Nagodba bez svjedoka ili dokaza je poziv za njega da riješi svoj problem o vašem trošku."
STR_INTERCEPT_CHOICE_38_0: "Predajte komponentu"
STR_INTERCEPT_CHOICE_38_1: "Zahtijevajte potvrđeni sporazum"
STR_INTERCEPT_CHOICE_38_2: "Povući ponudu"
STR_INTERCEPT_TITLE_39: "HARIS SLUŠA"
STR_INTERCEPT_TEXT_39: "Detalji se mogu provjeriti. Haris pita gdje je komponenta sada. Brisanje vašeg naloga i pokretanje mašine su povezani problemi, ali nisu isti."
STR_INTERCEPT_CHOICE_39_0: "Vratite ono što vam je u kaputu"
STR_INTERCEPT_CHOICE_39_1: "Pomozite oporaviti komponentu"
STR_INTERCEPT_CHOICE_39_2: "Prestani da odgovaraš sada"
STR_INTERCEPT_TITLE_40: "IZNAD OGRADE"
STR_INTERCEPT_TEXT_40: "Kolibe nestaju iza tebe. Sloboda izvan terena nije isto što i nevinost, a mašina je sada nečiji hitni problem. Ti si pobjegao; priča ostaje nedovršena."
STR_INTERCEPT_TITLE_41: "POSLEDNJA GREŠKA"
STR_INTERCEPT_TEXT_41: "Patrola stiže do vas prije nego što se otvoreno tlo završi, ili se Hooperovo obećanje sruši kada mu više nije korisno. Ponestalo vam je sigurnih poteza. Priča se može ponovo isprobati od početka."
STR_INTERCEPT_TITLE_42: "RADOVI"
STR_INTERCEPT_TEXT_42: "Raspored postavlja Hoopera tamo gdje je vaša priča rekla da je bio. Pored nje je poruka koja vas je prva uvukla u zamku. Kombinacija je dovoljno specifična da Harris može provjeriti."
STR_INTERCEPT_CHOICE_42_0: "Odnesi papire Harrisu"
STR_INTERCEPT_CHOICE_42_1: "Čekaj i suoči se s Huperom"
STR_INTERCEPT_TITLE_43: "JEDAN POSLJEDNJI ARANŽMAN"
STR_INTERCEPT_TEXT_43: "Hooper nudi da vrati dio. Vjerovanje u njega otklonilo bi jedan trenutni problem; ako bi Harris bio svjedok, bilo bi teže stvoriti drugog svjedoka."
STR_INTERCEPT_CHOICE_43_0: "Organizujte povratak svedoka"
STR_INTERCEPT_CHOICE_43_1: "Uvedite Harrisa u plan"
STR_INTERCEPT_TITLE_44: "POVRAĆANJE KOLUTA"
STR_INTERCEPT_TEXT_44: "Sa evidentiranim računom, pretraga se vraća na hardver koji nedostaje. Haris provjerava mašinsku sobu dok vi identifikujete gdje bi komponenta trebala biti."
STR_INTERCEPT_CHOICE_44_0: "Završite verifikovani povratak"
STR_INTERCEPT_CHOICE_44_1: "Uzmi ga iz svog kaputa"
STR_INTERCEPT_CHOICE_44_2: "Upozori Harrisa o Hooperu"
STR_INTERCEPT_TITLE_45: "KONAČNO PITANJE"
STR_INTERCEPT_TEXT_45: "Haris čeka. Ako možete povezati Hooper s krađom, još uvijek postoji način da se komponenta povrati i da se ovo ispravno okonča. U suprotnom istraga ima samo vaš promjenjivi račun."
STR_INTERCEPT_CHOICE_45_0: "Predstavite dokaze"
STR_INTERCEPT_CHOICE_45_1: "Priznaj da nemaš ništa više"
