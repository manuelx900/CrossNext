STR_QUEST_CAM_DECOR_NAME_7: "Feniksovo pero"
STR_QUEST_CAM_DECOR_TEXT_7: "Iz pronađenog pepela diže se pero: obećanje da priče mogu početi iznova."
STR_QUEST_CAM_DECOR_NAME_8: "Pustinjska lampa"
STR_QUEST_CAM_DECOR_TEXT_8: "Pripovjedač vam daje lampu koja je održala pustinjske priče u životu."
STR_QUEST_CAM_DECOR_NAME_9: "Cloud Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "Otvarate kavez za oblake. Mali koi ostaje da čuva vaše snove."
STR_QUEST_CAM_DECOR_NAME_10: "Zmajevo srce"
STR_QUEST_CAM_DECOR_TEXT_10: "Zmajevi vam povjeravaju kristal rođen iz njihovog oporavljenog sjećanja."
STR_QUEST_CAM_DECOR_NAME_11: "Zvijezda sjećanja"
STR_QUEST_CAM_DECOR_TEXT_11: "Prva restaurirana zvijezda osvjetljava vam put prema posljednjim stranicama."
STR_QUEST_CAM_DECOR_NAME_12: "Čitalačka mladica"
STR_QUEST_CAM_DECOR_TEXT_12: "Mala biljka za miran kutak za čitanje."
STR_QUEST_CAM_DECOR_NAME_13: "Sačuvane knjige"
STR_QUEST_CAM_DECOR_TEXT_13: "Priče koje čekaju svog sljedećeg čitaoca."
STR_QUEST_CAM_DECOR_NAME_14: "Voyager Baner"
STR_QUEST_CAM_DECOR_TEXT_14: "Zastavica za pamćenje svakog novog početka."
STR_QUEST_CAM_DECOR_NAME_15: "Mjesečeve gljive"
STR_QUEST_CAM_DECOR_TEXT_15: "Mali komad šume za vaš dom."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Početak avanture"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Dugi niz godina ljudi su živjeli u miru i uživali u svojim knjigama. Tada ih je Kralj zaborava počeo uništavati. Želio je spriječiti sve da čitaju i učiniti da sve priče nestanu zauvijek."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Kraljeva čudovišta"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Kralj zaborava poslao je svoja čudovišta po cijelom svijetu. Uništili su svaku knjigu koju su pronašli i napali svakoga ko je pokušao da ih zaustavi. Biblioteke su počele da nestaju, a ljudi su prestali da čitaju."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Moć čitanja"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Jednog dana, dok čitate u blizini svog sela, pojavljuje se čudovište. Pokušavate da pobegnete, ali se dešava nešto iznenađujuće: što više čitate, to postaje slabije. Shvaćate da je čitanje jedini način da se borite protiv kraljeve magije."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Vaša misija"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Nameravao si da zaustaviš kralja. Na svom putu do njegovog dvorca morate prijeći šume, gradove, planine i druga mjesta puna neprijatelja. Svako čudovište koje pobijedite približava vas malo bliže. Nastavite čitati, pobijedite njegove čuvare i dođite do njega prije nego što uništi svaku knjigu na svijetu."
STR_QUEST_CAM_JOURNEY2_BOOK_0: "Šuma čudovišta"
STR_QUEST_CAM_JOURNEY2_BOOK_1: "Grad bez knjiga"
STR_QUEST_CAM_JOURNEY2_BOOK_2: "The Harbour of Mist"
