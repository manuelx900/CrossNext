STR_CAR_INTRO: "Krivica i poštenje su nezavisni. Svaki slučaj ima tačno jedno rešenje. Visine su izmišljene karakterne osobine."
STR_CAR_HELP_TEXT: "Kako riješiti slučaj\nSvaki lik daje jednu izjavu. Gornji dio ekrana daje tačan broj krivaca i lažnih izjava. Pronađi kombinaciju koja zadovoljava oba broja. Svaki slučaj ima jedno rješenje.\n  \nKrivnja nije iskrenost\nNevin lik može lagati, a krivac može reći istinu. Dvije laži znači da su tačno dvije cijele izjave lažne; ostale su istinite. Oznake Istina / Laž se odnose na izjavu; Sumnjivac se odnosi na krivicu.\n  \nČitanje tragova\n\"A ili B je to učinio (ili oboje)\" znači da je barem jedan od navedenih likova kriv. \"A i B su to učinili\" zahtijeva oba. Laž negira cijelu izjavu: lažno OR znači da nijedan nije učinio; lažno AND znači da barem jedan nije.\n  \n\"Oboje istiniti ili oboje lažu\" uspoređuje izjave, a ne krivnju. \"Tačno jedan laže\" znači da njihove izjave imaju različite vrijednosti istine.\n  \nKomšije na malom ekranu\nIzvorni kružni redoslijed je Panther, Peacock, Shark, Fox, Bear, Stag, Horse, koristeći samo znakove ovog slučaja. Posljednji i prvi su susjedi. Ova aplikacija piše dva imena direktno u svaki susjedni trag. Nikad ne morate pogoditi koje karte su pored portreta. Promjena stranice ili orijentacije ne mijenja trag.\n  \nVisina i težina\nSvaka kartica prikazuje fiktivnu visinu i prehranu. \"Kriv je viši od mene\" znači da je barem jedan krivac viši od govornika, ne nužno svi krivci. Kraće djeluje na isti način. Tragovi mesoždera i biljoždera znače da barem jedan krivac ima tu prehranu; svejedi se računaju kao nijedno od njih. Imena, visine i prehrane su pouzdane činjenice; izjave mogu lažirati.\n  \nTvoja analiza\nKoristite ? / Istina / Laž i Sumnja ispod svake izjave da zabilježite hipoteze. Ovo su vaše bilješke, a ne dokazi ili automatske provjere. Strelice pokazuju druge znakove. Portretni način prikazuje do tri po stranici.\n  \nOptužnica.\nPritisnite Optuži i odaberite tačno potreban broj krivaca. Samo potvrda pogrešne optužbe troši život. Početnik i Normal imaju dva života; Napredni i Ekspert imaju jedan. Tačna optužba rješava slučaj. Kad nema preostalih života, otkriva se rješenje.\n  \nKampanja i ponavljanje\nPostoji 1470 slučajeva. Otvoreni slučaj nastavlja trenutni pokušaj ili otvara sljedeći nakon zatvorenog. Kampanja vam omogućava da odaberete bilo koji od 1470 slučajeva u bilo kojem redoslijedu od početka. Ponovni pokušaj pokreće novi pokušaj uz zadržavanje ranijeg završetka. Unutar svake težine, slučajevi napreduju od jednog krivca do dva, zatim od manje lažova do više unutar svake grupe krivaca. Početnik zadržava jednog krivca. Manje bacanje dolazi prvo kada se brojevi podudaraju. Svi slučajevi ostaju dostupni. Rješavanje prethodno iscrpljenog slučaja ga unaprjeđuje do riješenog.\n  \nNapredak i životi se spremaju na SD karticu. Napuštanje, spavanje ili ponovno pokretanje uređaja ne vraćaju živote u trenutnom pokušaju. Neuspješno spremanje blokira rezultat dok Ponovni pokušaj nije uspješan. Resetiranje svih traži potvrdu prije brisanja samo napretka Carnivore."
