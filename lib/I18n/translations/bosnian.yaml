STR_QUEST_CAM_JOURNEY2_BOOK_5: "More pijeska"
STR_QUEST_CAM_JOURNEY2_BOOK_6: "Citadela sa satom"
STR_QUEST_CAM_JOURNEY2_BOOK_7: "Mjesečeva palača"
STR_QUEST_CAM_JOURNEY2_BOOK_8: "Vrt bogova"
STR_QUEST_CAM_JOURNEY2_BOOK_9: "Rat za knjige"
STR_QUEST_CAM_JOURNEY2_BOOK_10: "Put zvijezda"
STR_QUEST_CAM_JOURNEY2_BOOK_11: "Posljednja stranica"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Nakon što pobijedite Kralja zaborava, vraćate se kući. Njegova vojska više ne može uništavati knjige, a ljudi ponovo čitaju u miru. Spasili ste priče svijeta. Ostalo je još mnogo knjiga za otkrivanje."
