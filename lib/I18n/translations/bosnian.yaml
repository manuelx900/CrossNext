STR_INTERCEPT_ABOUT: "Sažeta adaptacija The Intercept by Inkle, 2016, korištena pod MIT licencom. Bletchley Park, 1942: komponenta mašine koja nedostaje, ucjena i intervju koji može završiti slobodom ili pritvorom.\n\nVaše odluke i pozicija se čuvaju nakon svakog izbora. Nova priča resetuje ovo igranje. Originalne ilustracije su kreirane za ovaj firmver. Originalna skripta i licenca uključeni su u projekat."
