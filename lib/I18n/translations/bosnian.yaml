STR_QUEST_CAM_JOURNEY2_SAGA_11_6: "Sobe su krcate ukradenim i oštećenim knjigama. Oslobodite one koji su još uvijek zaključani u kutijama, a zatim se popnite prema najvišem dijelu tvrđave kako biste pronašli izvor kraljeve moći.\n\nOgromna knjiga sadrži nešto od kraljeve magije. Njegova brava odgovara tri pečata na ključu. Kada ga otvorite, tamna magija slabi i možete krenuti prema tronu."
STR_QUEST_CAM_JOURNEY2_SAGA_11_9: "Sobe su krcate ukradenim i oštećenim knjigama. Oslobodite one koji su još uvijek zaključani u kutijama, a zatim se popnite prema najvišem dijelu tvrđave kako biste pronašli izvor kraljeve moći.\n\nOgromna knjiga sadrži nešto od kraljeve magije. Njegova brava odgovara tri pečata na ključu. Kada ga otvorite, tamna magija slabi i možete krenuti prema tronu.\n\nKralj pravi posljednju sjenu kako bi se zaštitio. Ti činiš da nestane. Nijedan čuvar sada ne stoji između vas, a bitka za knjige uskoro počinje."
STR_QUEST_CAM_JOURNEY2_SAGA_11_10: "Sobe su krcate ukradenim i oštećenim knjigama. Oslobodite one koji su još uvijek zaključani u kutijama, a zatim se popnite prema najvišem dijelu tvrđave kako biste pronašli izvor kraljeve moći.\n\nOgromna knjiga sadrži nešto od kraljeve magije. Njegova brava odgovara tri pečata na ključu. Kada ga otvorite, tamna magija slabi i možete krenuti prema tronu.\n\nKralj pravi posljednju sjenu kako bi se zaštitio. Ti činiš da nestane. Nijedan čuvar sada ne stoji između vas, a bitka za knjige uskoro počinje.\n\nPobijedio si Kralja zaborava. Njegova čudovišta više ne mogu prijetiti svijetu, a ukradene knjige se vraćaju vlasnicima. Kad se vratite kući, otvarate knjigu baš kao i prije putovanja."
