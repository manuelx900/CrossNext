STR_FLASHCARDS_HELP: "Kopirajte Anki špilove (.apkg /.colpkg , .anki2 /.anki21 ), CSV /TSV/text ili konvertujte studijske fascikle u /FLASHCARDS. Koristite podfoldere: do 128 stavki svaki.\n\nUvoz prihvata osnovne, obrnute i jednostavne zatvorene tekstualne kartice. Audio i prilagođeni HTML nisu podržani. Prvo konvertujte slike /CJK špilove. Offline recenzije koriste FSRS. Uvoz započinje novi raspored i zadržava originale."
