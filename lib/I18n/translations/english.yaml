STR_UI_A_CHEST_SITS_IN_A_3X3_9CFD49: "A CHEST SITS IN A 3x3 ROOM OF FLOOR. ONE WAY IN, ONE CHEST, AND NOTHING LIVING IN IT."
STR_UI_MONSTERS_43BFEB: "MONSTERS"
