STR_CAR_INTRO: "Guilt and honesty are independent. Every case has exactly one solution. Heights are fictional character traits."
STR_CAR_HELP_TEXT: "HOW TO SOLVE A CASE\nEach character makes one statement. The top of the screen gives the exact numbers of culprits and false statements. Find a combination that satisfies both counts. Every case has one solution.\n\nGUILT IS NOT HONESTY\nAn innocent character can lie, and a culprit can tell the truth. Two lies means exactly two entire statements are false; the others are true. Truth / Lie marks refer to the statement; Suspect refers to guilt.\n\nREADING THE CLUES\n\"A or B did it (or both)\" means at least one named character is guilty. \"A and B did it\" requires both. A lie negates the whole statement: a false OR means neither did it; a false AND means at least one did not.\n\n\"Both truthful or both lying\" compares statements, not guilt. \"Exactly one is lying\" means their statements have different truth values. These clues can themselves be true or false.\n\nNEIGHBOURS ON A SMALL SCREEN\nThe original circular order is Panther, Peacock, Shark, Fox, Bear, Stag, Horse, using only this case's characters. The last and first are neighbours. This app writes the two names directly in every neighbour clue. You never need to guess which cards are beside a portrait. Changing page or orientation does not change a clue.\n\nHEIGHT AND DIET\nEach card shows a fictional height and diet. \"A culprit is taller than me\" means at least one culprit is taller than the speaker, not necessarily all culprits. Shorter works the same way. Carnivore and herbivore clues mean at least one culprit has that diet; omnivores count as neither. Names, heights and diets are reliable facts; statements can lie.\n\nYOUR ANALYSIS\nUse ? / Truth / Lie and Suspect under each statement to record hypotheses. These are your notes, not evidence or automatic checks. Arrows show the other characters. Portrait mode displays up to three per page.\n\nMAKING AN ACCUSATION\nPress Accuse and select exactly the required number of culprits. Only confirming a wrong accusation spends a life. Beginner and Normal have two lives; Advanced and Expert have one. A correct accusation solves the case. With no lives left, the solution is revealed.\n\nCAMPAIGN AND REPLAY\nThere are 1,470 cases. Open case resumes the current attempt or opens the next after a closed one. Campaign lets you choose any of the 1,470 cases in any order from the beginning. Replay starts a fresh attempt while preserving earlier completion. Within each difficulty, cases progress from one culprit to two, then from fewer liars to more within each culprit group. Beginner keeps one culprit. Smaller casts come first when the counts match. All cases stay available. Solving a previously exhausted case upgrades it to solved.\n\nProgress and lives are saved on the SD card. Leaving, sleep or a device restart does not restore lives in the current attempt. A failed save blocks the result until Retry succeeds. Reset all asks for confirmation before erasing only Carnivore progress."

