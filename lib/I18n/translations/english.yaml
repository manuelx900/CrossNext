STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "The beginning of the adventure"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "For many years people lived in peace and enjoyed their books. Then the King of Oblivion began to destroy them. He wanted to stop everyone from reading and make all stories disappear forever."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "The king's monsters"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "The King of Oblivion sent his monsters all over the world. They destroyed every book they found and attacked anyone who tried to stop them. Libraries began to disappear, and people stopped reading."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "The power of reading"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "One day, while you are reading near your village, a monster appears. You try to get away, but something surprising happens: the more you read, the weaker it becomes. You realize reading is the only way to fight the king's magic."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Your mission"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "You set out to stop the king. On your way to his castle you must cross forests, cities, mountains and other places full of enemies. Each monster you defeat takes you a little closer. Keep reading, defeat his guardians and reach him before he destroys every book in the world."
