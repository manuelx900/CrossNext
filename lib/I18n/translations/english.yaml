STR_UI_EVERY_PAIR_OF_THINGS_MEETS_IN_1E0DCF: "Tap a pair: first X, then confirmed. Confirming rules out the rest of its row and column with lighter marks. The grid only clears its own marks; yours stay until you clear them."
