STR_QUEST_CAM_JOURNEY_DAILYREQUEST_0: "Read this account with me. There are still families searching for their own words in the village book."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_1: "Stay with these accounts a little longer. Someone in the market may recognise the person the words describe."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_2: "Read these names with me. I want a family to be waiting when the next boat comes in."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_3: "Read this account before I move it to a higher shelf. I need to know which words are still missing."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_4: "Read the travellers' words with me. I do not want to mistake an old warning for a call to follow."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Read these accounts beside the fire. Before we travel, I want everyone to hear their own name."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_6: "Read this page with me before the bells ring. I need to remember more than the hour on the dial."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_7: "Read this testimony in full. There are people here who have waited too long to be heard."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Read this memory near the fountain. I would like to hear what the person who planted here hoped to leave behind."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Read the accounts we have sent you. The voices from home can keep you company, even this far away."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Read this letter before setting out. You do not have to carry every memory alone."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_11: "Read the words we have kept for you. The fortress is not the whole world, however quiet it becomes."
STR_QUEST_CAM_JOURNEY_WEEKLYTITLE_0: "The village book"
STR_QUEST_CAM_JOURNEY_WEEKLYTITLE_1: "Names for the city"
STR_QUEST_CAM_JOURNEY_WEEKLYTITLE_2: "Accounts of the crossing"
STR_QUEST_CAM_JOURNEY_WEEKLYTITLE_3: "The borrowed books"
