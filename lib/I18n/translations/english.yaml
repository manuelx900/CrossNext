STR_UI_YOU_PLAY_BLACK_TAP_AN_EMPTY_29AEBA: "You play black. Tap an empty square which traps white discs in a straight line. All trapped discs flip to your colour. The device plays white. If a side has no legal move, it passes automatically. Most discs wins when neither side can move."
