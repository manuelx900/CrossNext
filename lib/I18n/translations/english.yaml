STR_QUEST_CAM_JOURNEY_WEEKLYTITLE_8: "Stories for the seeds"
STR_QUEST_CAM_JOURNEY_WEEKLYTITLE_9: "The travelling library"
STR_QUEST_CAM_JOURNEY_WEEKLYTITLE_10: "The lives beyond the gate"
STR_QUEST_CAM_JOURNEY_WEEKLYTITLE_11: "The stories that return"
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_0: "Help me compare the pages we bring home. A name in the margin may tell us which family a memory belongs to."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "Read the accounts the neighbours have brought to the square. We need to put each name beside the life it belongs to."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "Help me compare the sailors' accounts. I cannot send another boat into a channel we no longer remember."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "Help me read the rescued volumes. When they leave these rooms, I want someone to know whose stories they carry."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "Help me compare the accounts from the shelters. The next traveller should find a path, not another misleading echo."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "Help us compare the old journeys. A remembered well can make the difference between arriving and disappearing in the sand."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "Help me listen to the neighbours' accounts. A clock cannot tell me what they hoped to do with the day."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "Help us read the accounts arriving from the freed regions. The palace has spent enough years speaking only to itself."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Help me put the gardeners' accounts in order. These seeds need more than a name on a packet."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Help us keep these stories in circulation. I want the people we have found to be able to hear one another."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Help us read the accounts reaching the last road. Each one belongs to someone waiting beyond the king's walls."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Help us read these accounts in full. After so long apart, their owners deserve more than a name in a list."
STR_QUEST_CAM_JOURNEY_THANKS_0: "Liora smooths the page with her palm. “I can hear that line again,” she says. This evening she will leave the book open beside the lamp."
STR_QUEST_CAM_JOURNEY_THANKS_1: "At the stall, someone moves a chair to make room for you. An unfinished account has acquired another line; its owner takes the page home in both hands."
STR_QUEST_CAM_JOURNEY_THANKS_2: "Mara folds a newly legible page and puts it beside her tide book. Before returning to the window, she thanks you in a voice roughened by the salt air."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Iri lays a strip of dry cloth between two pages. “That one can travel now.” She holds the volume against her chest before carrying it to the other books."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Taren rests his pack on the stone and listens while you finish. Then he repeats a traveller's words, this time without needing to look at the page."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Nadir draws a ribbon through his fingers, reading a name that was difficult to make out before. He makes a place for you beside the fire."
STR_QUEST_CAM_JOURNEY_THANKS_6: "Orin puts down the tool he has been turning in his fingers. For a while he speaks about the person in the account, and the clock is allowed to tick unheard."
STR_QUEST_CAM_JOURNEY_THANKS_7: "Sera moves the account away from the pile of royal orders. She asks for another chair, then listens to its last lines with you."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Aster marks a page with a clean leaf. She thanks you quietly; a little later you hear her reading the same passage beside the fountain."
STR_QUEST_CAM_JOURNEY_THANKS_9: "A short note arrives with the next bundle of pages. Liora has copied a passage you helped restore; in the margin she has written, “We read this one together at home.”"
STR_QUEST_CAM_JOURNEY_THANKS_10: "The note is only a few lines long. Liora has left room for a reply, as though she could already see you sitting at the other end of the table."
