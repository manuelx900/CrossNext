STR_INTERCEPT_TITLE_0: "HUT 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. They are keeping you waiting behind a locked door. A component from the calculating machine has vanished. The morning intercept rustles in your coat pocket. Outside, footsteps stop."
STR_INTERCEPT_CHOICE_0_0: "Think through the accusation"
STR_INTERCEPT_CHOICE_0_1: "Wait for the interviewer"
STR_INTERCEPT_CHOICE_0_2: "Search your coat"
STR_INTERCEPT_TITLE_1: "THE ACCUSATION"
STR_INTERCEPT_TEXT_1: "They suspect treason. You solve figures, crosswords and chess positions for a living. This room is another problem: contradict yourself, and your credibility may be the first casualty."
STR_INTERCEPT_CHOICE_1_0: "Choose a strategy"
STR_INTERCEPT_CHOICE_1_1: "Hear what they know"
STR_INTERCEPT_TITLE_2: "HARRIS ARRIVES"
STR_INTERCEPT_TEXT_2: "Harris enters with a teacup and a file. A reel is missing from the Bombe. Your name was on the duty roster. He puts the cup beside you and asks where you were last night."
STR_INTERCEPT_CHOICE_2_0: "Drink the tea"
STR_INTERCEPT_CHOICE_2_1: "Leave the tea untouched"
STR_INTERCEPT_CHOICE_2_2: "Answer calmly"
STR_INTERCEPT_TITLE_3: "THE COMPONENT"
STR_INTERCEPT_TEXT_3: "Inside the lining of your coat your fingers meet cold metal. The component is still there. Hooper said taking it would make the blackmail stop. Now the locked door has a different meaning."
STR_INTERCEPT_CHOICE_3_0: "Keep it concealed"
STR_INTERCEPT_CHOICE_3_1: "Hand it to Harris"
STR_INTERCEPT_TITLE_4: "A WINNING PLAY"
STR_INTERCEPT_TEXT_4: "Cooperation could preserve your credibility. A convincing lie could buy time. Escape would trade a locked room for the guards outside. None of these moves can be taken back."
STR_INTERCEPT_CHOICE_4_0: "Cooperate"
STR_INTERCEPT_CHOICE_4_1: "Invent an alibi"
STR_INTERCEPT_CHOICE_4_2: "Examine the window"
STR_INTERCEPT_TITLE_5: "THE TEA"
STR_INTERCEPT_TEXT_5: "The room tilts. Harris notices your silence, but his face is already receding. When you next open your eyes, another pair of shoes stands by the table."
STR_INTERCEPT_CHOICE_5_0: "Pretend to remain asleep"
STR_INTERCEPT_CHOICE_5_1: "Confront the visitor"
STR_INTERCEPT_CHOICE_5_2: "Ask for water"
STR_INTERCEPT_TITLE_6: "A SMALL REFUSAL"
STR_INTERCEPT_TEXT_6: "You push the cup away. Harris watches the movement more closely than the answer. He asks whether there is someone else he should be questioning."
STR_INTERCEPT_CHOICE_6_0: "Ask what evidence he has"
STR_INTERCEPT_CHOICE_6_1: "Mention Hooper"
STR_INTERCEPT_CHOICE_6_2: "Look toward the window"
STR_INTERCEPT_TITLE_7: "THE MISSING REEL"
STR_INTERCEPT_TEXT_7: "Harris wants a direct answer. Did you take the component? You can tell him what is in your coat, explain the pressure Hooper applied, or try to point the accusation elsewhere."
STR_INTERCEPT_CHOICE_7_0: "Give him the component"
STR_INTERCEPT_CHOICE_7_1: "Explain the blackmail"
STR_INTERCEPT_CHOICE_7_2: "Accuse Hooper"
STR_INTERCEPT_TITLE_8: "METAL ON THE TABLE"
STR_INTERCEPT_TEXT_8: "The component lies between you. Harris checks it without relaxing. Returning stolen equipment does not explain why it was taken. He wants a name and something more reliable than your word."
STR_INTERCEPT_CHOICE_8_0: "Offer to find evidence"
STR_INTERCEPT_CHOICE_8_1: "Stay and answer questions"
STR_INTERCEPT_TITLE_9: "THE ALIBI"
STR_INTERCEPT_TEXT_9: "You describe a quiet evening at your desk. Harris opens the file. A guard saw you leaving the machine room. Your invented account now has a witness against it."
STR_INTERCEPT_CHOICE_9_0: "Defend the story"
STR_INTERCEPT_CHOICE_9_1: "Admit the blackmail"
STR_INTERCEPT_CHOICE_9_2: "Refuse further questions"
STR_INTERCEPT_TITLE_10: "THE WINDOW"
STR_INTERCEPT_TEXT_10: "The window is high and the glass is thick. Beyond it, the path leads past another hut. Breaking it would be loud; waiting here has its own dangers."
STR_INTERCEPT_CHOICE_10_0: "Break the glass"
STR_INTERCEPT_CHOICE_10_1: "Study the path outside"
STR_INTERCEPT_CHOICE_10_2: "Return to the interview"
STR_INTERCEPT_TITLE_11: "ANOTHER VISITOR"
STR_INTERCEPT_TEXT_11: "Hooper has come while you are unsteady. He wants to know whether Harris has the component. He keeps one hand near the door."
STR_INTERCEPT_CHOICE_11_0: "Pretend to sleep"
STR_INTERCEPT_CHOICE_11_1: "Demand an explanation"
STR_INTERCEPT_CHOICE_11_2: "Ask for water"
STR_INTERCEPT_TITLE_12: "A WARNING"
STR_INTERCEPT_TEXT_12: "You call for Harris before the tea takes hold. He returns, irritated. An accusation about the cup will need something he can test."
STR_INTERCEPT_CHOICE_12_0: "Keep the cup as evidence"
STR_INTERCEPT_CHOICE_12_1: "Accuse Harris of poisoning you"
STR_INTERCEPT_CHOICE_12_2: "Concentrate on the reel"
STR_INTERCEPT_TITLE_13: "HOOPER"
STR_INTERCEPT_TEXT_13: "Harris recognizes the name. Hooper is useful, well connected, and not absent from last night's roster either. Recognition is not proof."
STR_INTERCEPT_CHOICE_13_0: "Find something verifiable"
STR_INTERCEPT_CHOICE_13_1: "Insist Hooper stole it"
STR_INTERCEPT_TITLE_14: "BLACKMAIL"
STR_INTERCEPT_TEXT_14: "You describe a young man, a confidence betrayed, and the demand that followed. Harris listens without helping you. Naming the person who set the trap might also expose the person you hoped to protect."
STR_INTERCEPT_CHOICE_14_0: "Give Harris the full account"
STR_INTERCEPT_CHOICE_14_1: "Leave out the names"
STR_INTERCEPT_CHOICE_14_2: "Propose a way to catch Hooper"
STR_INTERCEPT_TITLE_15: "AN EASY ACCUSATION"
STR_INTERCEPT_TEXT_15: "Hooper, you say, must be responsible. Harris asks how you know. There is a difference between solving a problem and producing a witness who can prove the answer."
STR_INTERCEPT_CHOICE_15_0: "Let Harris challenge the claim"
STR_INTERCEPT_CHOICE_15_1: "Try a private message to Hooper"
STR_INTERCEPT_TITLE_16: "A TESTABLE CLUE"
STR_INTERCEPT_TEXT_16: "A story can be denied. A document, a witness, or the missing component is harder to explain away. You have a little time to choose what to pursue."
STR_INTERCEPT_CHOICE_16_0: "Inspect the nearby hut"
STR_INTERCEPT_CHOICE_16_1: "Use the morning intercept"
STR_INTERCEPT_CHOICE_16_2: "Question Hooper directly"
STR_INTERCEPT_TITLE_17: "MORE THAN A RETURN"
STR_INTERCEPT_TEXT_17: "The machine can work again, but Harris still has a security breach to explain. He offers you one last opportunity to establish who organized it."
STR_INTERCEPT_CHOICE_17_0: "Show the evidence"
STR_INTERCEPT_CHOICE_17_1: "Look for proof"
STR_INTERCEPT_CHOICE_17_2: "Accept his judgment"
STR_INTERCEPT_TITLE_18: "A CONTRADICTION"
STR_INTERCEPT_TEXT_18: "Harris sets your first answer beside your latest one. They cannot both be true. You can abandon the lie, or let the interview end on a contradiction."
STR_INTERCEPT_CHOICE_18_0: "Tell the truth about the blackmail"
STR_INTERCEPT_CHOICE_18_1: "Keep denying everything"
STR_INTERCEPT_CHOICE_18_2: "Try to leave"
STR_INTERCEPT_TITLE_19: "SILENCE"
STR_INTERCEPT_TEXT_19: "You fold your arms. Harris closes the file. In this room, silence does not end the investigation; it only ends your part in directing it."
STR_INTERCEPT_CHOICE_19_0: "Hear the decision"
STR_INTERCEPT_TITLE_20: "BROKEN GLASS"
STR_INTERCEPT_TEXT_20: "The pane gives way. Cold air and the sound of a guard's whistle arrive together. There is time for one decision before someone reaches the door."
STR_INTERCEPT_CHOICE_20_0: "Run for the outer path"
STR_INTERCEPT_CHOICE_20_1: "Leave a coded clue"
STR_INTERCEPT_CHOICE_20_2: "Stay and explain"
STR_INTERCEPT_TITLE_21: "BETWEEN THE HUTS"
STR_INTERCEPT_TEXT_21: "The path is wet. Hooper's hut is close enough to reach before the next patrol, but the open ground beyond it offers a different kind of chance."
STR_INTERCEPT_CHOICE_21_0: "Try to escape the grounds"
STR_INTERCEPT_CHOICE_21_1: "Go into Hooper's hut"
STR_INTERCEPT_CHOICE_21_2: "Return to Harris"
STR_INTERCEPT_TITLE_22: "A PRIVATE GAME"
STR_INTERCEPT_TEXT_22: "Hooper studies you. On the table he sets out an imaginary chess position with his fingers. A coded answer could make him reveal what a direct accusation never would."
STR_INTERCEPT_CHOICE_22_0: "Answer with a chess clue"
STR_INTERCEPT_CHOICE_22_1: "Threaten to name him"
STR_INTERCEPT_CHOICE_22_2: "Speak honestly"
STR_INTERCEPT_TITLE_23: "FACE TO FACE"
STR_INTERCEPT_TEXT_23: "Hooper asks what you can actually prove. His confidence falters only when you mention details that someone outside his plan should not know."
STR_INTERCEPT_CHOICE_23_0: "Confront him with proof"
STR_INTERCEPT_CHOICE_23_1: "Offer the component as a trade"
STR_INTERCEPT_CHOICE_23_2: "Bluff"
STR_INTERCEPT_TITLE_24: "THE CUP"
STR_INTERCEPT_TEXT_24: "Hooper brings water but reaches for the teacup first. Keeping that cup might be more useful than accepting anything else he offers."
STR_INTERCEPT_CHOICE_24_0: "Keep the cup"
STR_INTERCEPT_CHOICE_24_1: "Check your coat again"
STR_INTERCEPT_TITLE_25: "SOMETHING TO TEST"
STR_INTERCEPT_TEXT_25: "You keep the cup and ask Harris to have it examined. This is finally an allegation with an object attached to it. Hooper's attempt to remove it supplies a second useful detail."
STR_INTERCEPT_CHOICE_25_0: "Give Harris the cup"
STR_INTERCEPT_CHOICE_25_1: "Confront Hooper with it"
STR_INTERCEPT_TITLE_26: "THE WRONG TARGET"
STR_INTERCEPT_TEXT_26: "You accuse Harris without evidence. He sees a suspect trying to discredit the investigator. Whatever happened to the tea, you have made it harder for him to believe you."
STR_INTERCEPT_CHOICE_26_0: "The interview ends"
STR_INTERCEPT_TITLE_27: "THE WHOLE ACCOUNT"
STR_INTERCEPT_TEXT_27: "You give the names and describe the meeting. Harris asks precise questions. Your embarrassment is real, but so are the details he can now check."
STR_INTERCEPT_CHOICE_27_0: "Let him verify the account"
STR_INTERCEPT_CHOICE_27_1: "Offer to find Hooper"
STR_INTERCEPT_TITLE_28: "A FAILED BLUFF"
STR_INTERCEPT_TEXT_28: "Harris has heard enough confident answers. Hooper has too. Neither supplies the fact your story is missing."
STR_INTERCEPT_CHOICE_28_0: "Persist in the claim"
STR_INTERCEPT_CHOICE_28_1: "Make a desperate escape"
STR_INTERCEPT_CHOICE_28_2: "Admit what really happened"
STR_INTERCEPT_TITLE_29: "THE INTERCEPT"
STR_INTERCEPT_TEXT_29: "The sheet in your pocket carries more than jumbled letters: its route through the huts places Hooper near the machine. A concise clue might get the right person to look in the right place."
STR_INTERCEPT_CHOICE_29_0: "Encode a message for Hooper"
STR_INTERCEPT_CHOICE_29_1: "Show the route to Harris"
STR_INTERCEPT_TITLE_30: "THE MACHINE RUNS"
STR_INTERCEPT_TEXT_30: "Harris has the component, and a trail that leads beyond your first frightened answers. The Bombe resumes its work. You leave Hut 14 under your own name, with fewer secrets and a future still to answer for."
STR_INTERCEPT_TITLE_31: "UNDER SUSPICION"
STR_INTERCEPT_TEXT_31: "Returning the component saved the machine from a delay. It did not save your position. Harris ends your access to the huts while the investigation continues. You survived the interview, but did not clear your name."
STR_INTERCEPT_TITLE_32: "IN CUSTODY"
STR_INTERCEPT_TEXT_32: "The door opens for the guard rather than for you. Contradictions, missing evidence and a stolen component have become a case you can no longer direct. This attempt ends here."
STR_INTERCEPT_TITLE_33: "THE OUTER PATH"
STR_INTERCEPT_TEXT_33: "You leave the huts behind. The darkness is useful, but the grounds are watched. A broken window has brought the patrols closer than you hoped."
STR_INTERCEPT_CHOICE_33_0: "Cross the open ground"
STR_INTERCEPT_CHOICE_33_1: "Keep to the service path"
STR_INTERCEPT_CHOICE_33_2: "Turn back and face Harris"
STR_INTERCEPT_TITLE_34: "HOOPER'S HUT"
STR_INTERCEPT_TEXT_34: "The desk is unattended. Papers lie beneath a crossword, and the machine room appears in a pencilled schedule. Footsteps approach along the boards outside."
STR_INTERCEPT_CHOICE_34_0: "Examine the papers"
STR_INTERCEPT_CHOICE_34_1: "Wait for Hooper"
STR_INTERCEPT_CHOICE_34_2: "Leave for Harris"
STR_INTERCEPT_TITLE_35: "A CHESS PROBLEM"
STR_INTERCEPT_TEXT_35: "You give Hooper a position that mirrors his predicament: a protected piece, an exposed king, and a move that looks safe until the reply. He understands the warning. His next words supply the connection you needed."
STR_INTERCEPT_CHOICE_35_0: "Ask him to admit the plan"
STR_INTERCEPT_CHOICE_35_1: "Send the admission to Harris"
STR_INTERCEPT_TITLE_36: "WITHOUT A MASK"
STR_INTERCEPT_TEXT_36: "You speak about the pressure instead of pretending it never existed. Hooper briefly answers as a person rather than as an opponent. That opening could be used for a trade, or a trap."
STR_INTERCEPT_CHOICE_36_0: "Ask for an honest arrangement"
STR_INTERCEPT_CHOICE_36_1: "Ask him to confess"
STR_INTERCEPT_CHOICE_36_2: "Take the account to Harris"
STR_INTERCEPT_TITLE_37: "HOOPER'S ADMISSION"
STR_INTERCEPT_TEXT_37: "Hooper explains enough to connect the blackmail to the missing component. Harris can now recover the equipment and check the story. You must decide whether to finish the investigation or let Hooper disappear."
STR_INTERCEPT_CHOICE_37_0: "Bring Harris the admission"
STR_INTERCEPT_CHOICE_37_1: "Let Hooper go and leave"
STR_INTERCEPT_TITLE_38: "THE TRADE"
STR_INTERCEPT_TEXT_38: "You place your last piece of leverage within Hooper's reach. A bargain without a witness or evidence is an invitation for him to solve his problem at your expense."
STR_INTERCEPT_CHOICE_38_0: "Hand over the component"
STR_INTERCEPT_CHOICE_38_1: "Demand a witnessed agreement"
STR_INTERCEPT_CHOICE_38_2: "Withdraw the offer"
STR_INTERCEPT_TITLE_39: "HARRIS LISTENS"
STR_INTERCEPT_TEXT_39: "The details can be checked. Harris asks where the component is now. Clearing your account and getting the machine running are related problems, but they are not the same one."
STR_INTERCEPT_CHOICE_39_0: "Return what is in your coat"
STR_INTERCEPT_CHOICE_39_1: "Help recover the component"
STR_INTERCEPT_CHOICE_39_2: "Stop answering now"
STR_INTERCEPT_TITLE_40: "BEYOND THE FENCE"
STR_INTERCEPT_TEXT_40: "The huts vanish behind you. Freedom outside the grounds is not the same as innocence, and the machine is someone else's urgent problem now. You escaped; the account remains unfinished."
STR_INTERCEPT_TITLE_41: "THE LAST MISTAKE"
STR_INTERCEPT_TEXT_41: "The patrol reaches you before the open ground ends, or Hooper's promise collapses when it is no longer useful to him. You have run out of safe moves. The story can be tried again from the beginning."
STR_INTERCEPT_TITLE_42: "THE PAPERS"
STR_INTERCEPT_TEXT_42: "The schedule places Hooper where your story said he was. Beside it is the note that first drew you into the trap. The combination is specific enough for Harris to verify."
STR_INTERCEPT_CHOICE_42_0: "Take the papers to Harris"
STR_INTERCEPT_CHOICE_42_1: "Wait and confront Hooper"
STR_INTERCEPT_TITLE_43: "ONE LAST ARRANGEMENT"
STR_INTERCEPT_TEXT_43: "Hooper offers to put the part back. Trusting him would remove one immediate problem; making Harris a witness would make it harder to create another."
STR_INTERCEPT_CHOICE_43_0: "Arrange a witnessed return"
STR_INTERCEPT_CHOICE_43_1: "Bring Harris into the plan"
STR_INTERCEPT_TITLE_44: "RECOVERING THE REEL"
STR_INTERCEPT_TEXT_44: "With the account on record, the search returns to the missing hardware. Harris checks the machine room while you identify where the component should be."
STR_INTERCEPT_CHOICE_44_0: "Finish the verified return"
STR_INTERCEPT_CHOICE_44_1: "Retrieve it from your coat"
STR_INTERCEPT_CHOICE_44_2: "Warn Harris about Hooper"
STR_INTERCEPT_TITLE_45: "THE FINAL QUESTION"
STR_INTERCEPT_TEXT_45: "Harris waits. If you can connect Hooper to the theft, there is still a way to recover the component and end this properly. Otherwise the investigation has only your changing account."
STR_INTERCEPT_CHOICE_45_0: "Present the evidence"
STR_INTERCEPT_CHOICE_45_1: "Admit you have nothing more"
