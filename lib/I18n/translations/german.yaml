STR_QUEST_CAM_JOURNEY_THANKS_7: "Sera verschiebt die Geschichte vom Stapel der königlichen Anordnungen weg, bittet um einen anderen Stuhl und hört sich dann mit dir die letzten Zeilen an."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Aster markiert eine Seite mit einem leeren Blatt. Sie dankt Ihnen leise; Wenig später hört man sie neben dem Brunnen die gleiche Passage lesen."
STR_QUEST_CAM_JOURNEY_THANKS_9: "Eine kurze Notiz kommt mit dem nächsten Seitenbündel. Liora hat eine Passage kopiert, bei deren Restaurierung Sie geholfen haben; Am Rand hat sie geschrieben: „Wir haben das zusammen zu Hause gelesen.“"
STR_QUEST_CAM_JOURNEY_THANKS_10: "Die Notiz ist nur wenige Zeilen lang. Liora hat Raum für eine Antwort gelassen, als könnte sie dich bereits am anderen Ende des Tisches sitzen sehen."
STR_QUEST_CAM_JOURNEY_THANKS_11: "Unter den wiederhergestellten Seiten finden Sie den gefalteten Zettel von zu Hause. Die letzte Zeile ist einfach: „Hier ist noch ein Platz für dich.“"
