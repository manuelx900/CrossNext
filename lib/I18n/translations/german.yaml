STR_CAR_INTRO: "Schuld und Ehrlichkeit sind unabhängig voneinander. Für jeden Fall gibt es genau eine Lösung. Körpergrößen sind fiktive Charaktereigenschaften."
STR_CAR_HELP_TEXT: "Wie man einen Fall löst\nJeder Charakter macht eine Aussage. Der obere Teil des Bildschirms gibt die genaue Anzahl der Schuldigen und falschen Aussagen an. Finde eine Kombination, die beide Zählungen erfüllt. Jeder Fall hat eine Lösung.\n  \nGuilt Is Not Honesty\nEin unschuldiger Charakter kann lügen und ein Schuldiger kann die Wahrheit sagen. Zwei Lügen bedeuten, dass genau zwei ganze Aussagen falsch sind; die anderen sind wahr. Wahrheit / Lüge Marken beziehen sich auf die Aussage; Verdächtige bezieht sich auf Schuld.\n  \nReading the Clues\n\"A oder B hat es getan (oder beide)\" bedeutet, dass mindestens ein namentlich genannter Charakter schuldig ist. \"A und B haben es getan\" erfordert beide. Eine Lüge negiert die gesamte Aussage: ein falsches ODER bedeutet, dass keiner von beiden es getan hat; ein falsches UND bedeutet, dass mindestens einer von beiden es nicht getan hat.\n  \n\"Beide wahrhaftig oder beide lügen\" vergleicht Aussagen, nicht Schuld. \"Genau einer lügt\" bedeutet, dass ihre Aussagen unterschiedliche Wahrheitswerte haben. Diese Hinweise können selbst wahr oder falsch sein.\n  \nNachbarn auf kleinem Bildschirm\nDie ursprüngliche kreisförmige Reihenfolge ist Panther, Pfau, Hai, Fuchs, Bär, Hirsch, Pferd, wobei nur die Zeichen dieses Falles verwendet werden. Der letzte und der erste sind Nachbarn. Diese App schreibt die beiden Namen direkt in jeden Nachbarhinweis. Sie müssen nie erraten, welche Karten neben einem Porträt liegen. Seitenwechsel oder Orientierung ändert einen Hinweis nicht.\n  \nHöhe und Ernährung\nJede Karte zeigt eine fiktive Größe und Ernährung. \"Ein Schuldiger ist größer als ich\" bedeutet, dass mindestens ein Schuldiger größer als der Sprecher ist, nicht unbedingt alle Schuldigen. Kürzer funktioniert auf die gleiche Weise. Karnivore und herbivore Hinweise bedeuten, dass mindestens ein Schuldiger diese Ernährung hat; Allesfresser zählen als beides. Namen, Größen und Ernährung sind verlässliche Fakten; Aussagen können lügen.\n  \nIhre Analyse\nVerwenden Sie ? / Wahrheit / Lüge und Verdächtig unter jeder Aussage, um Hypothesen aufzuzeichnen. Dies sind Ihre Notizen, keine Beweise oder automatische Prüfungen. Pfeile zeigen die anderen Zeichen. Hochformatmodus zeigt bis zu drei pro Seite an.\n  \nMaking an Accusation\nDrücken Sie Accuse und wählen Sie genau die erforderliche Anzahl von Schuldigen aus. Nur die Bestätigung einer falschen Anklage kostet ein Leben. Beginner und Normal haben zwei Leben; Advanced und Expert haben eins. Eine richtige Anklage löst den Fall. Wenn keine Leben mehr übrig sind, wird die Lösung enthüllt.\n  \nCAMPAIGN AND REPLAY\nEs gibt 1.470 Fälle. Der offene Fall nimmt den aktuellen Versuch wieder auf oder öffnet den nächsten nach einem geschlossenen. Die Kampagne lässt dich einen der 1.470 Fälle in beliebiger Reihenfolge von Anfang an auswählen. Die Wiederholung startet einen neuen Versuch, während die früheren Abschlüsse beibehalten werden. Innerhalb jedes Schwierigkeitsgrades entwickeln sich die Fälle von einem Schuldigen zu zwei, dann von weniger Lügnern zu mehr innerhalb jeder Schuldnergruppe. Der Anfänger behält einen Schuldigen. Kleinere Würfe kommen zuerst, wenn die Zählungen übereinstimmen. Alle Fälle bleiben verfügbar. Das Lösen eines zuvor erschöpften Falls verbessert ihn auf gelöst.\n  \nFortschritt und Leben werden auf der SD-Karte gespeichert. Durch Verlassen, Ruhezustand oder Neustart des Geräts werden keine Leben im aktuellen Versuch wiederhergestellt. Ein fehlgeschlagener Speichervorgang blockiert das Ergebnis, bis Wiederholen erfolgreich ist. Alle zurücksetzen fragt nach einer Bestätigung, bevor nur der Fortschritt von Carnivore gelöscht wird."
