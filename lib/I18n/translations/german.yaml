STR_MYST_GUIDE_HOOPER_COPY: "Hooper arbeitet auch im Bletchley Park. Er hat Sie unter Druck gesetzt, die Rolle zu übernehmen, und hat seine eigenen Interessen. Sie können ihn befragen, verhandeln oder Beweise einholen. Wenn Sie seine Rolle kennen, wissen Sie nicht, welche Wahl sicher ist."
