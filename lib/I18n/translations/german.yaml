STR_MYST_GUIDE_OBJECTIVE_COPY: "Ein Teil der Bombe, einer Codeknackmaschine, fehlt. Sie stehen unter Verdacht. Erklären Sie, was passiert ist, finden Sie Beweise und entscheiden Sie, wem Sie vertrauen können. Ihre Entscheidungen führen zu unterschiedlichen Enden."
