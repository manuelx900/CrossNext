STR_PET_STORY_0: "Der Samen"
STR_PET_STORY_TEXT_0: "Du beendest ein Kapitel. Neben deinem Gefährten ist ein winziges Samenkorn gekeimt. Geben Sie ihm einen Platz am Fenster."
STR_PET_STORY_1: "Ein regnerischer Tag"
STR_PET_STORY_TEXT_1: "Regen klopft an das Fenster, während Sie lesen. Ihr Begleiter rollt sich in der Nähe zusammen. Für eine Weile fühlt sich der ganze Raum wie ein Unterschlupf an."
STR_PET_STORY_2: "Der Besucher"
STR_PET_STORY_TEXT_2: "Ein Vogel landet am Fenster. Ihr Begleiter schaut ruhig zu, bis er wegfliegt. Sie markieren Ihre Seite und lächeln."
STR_PET_STORY_3: "Ein Papierboot"
STR_PET_STORY_TEXT_3: "Aus einem Stück Papier wird ein kleines Boot. Ihr Begleiter folgt ihm über den Tisch, als ob darin ein ganzes Abenteuer verborgen wäre."
STR_PET_STORY_4: "Unter den Sternen"
STR_PET_STORY_TEXT_4: "Nach der Lektüre schaut ihr gemeinsam hinaus. Ein einzelner Stern erscheint, dann ein anderer. Es gibt noch so viel zu entdecken."
STR_PET_STORY_5: "Das verlorene Blatt"
STR_PET_STORY_TEXT_5: "Dein Begleiter bringt dir ein Blatt. Sie bewahren es neben Ihrem Lesezeichen auf: ein kleines Geschenk aus einem ganz gewöhnlichen Tag."
STR_PET_STORY_6: "Eine ruhige Ecke"
STR_PET_STORY_TEXT_6: "Du suchst dir eine gemütliche Ecke und schlägst dein Buch auf. Ihr Begleiter lässt sich neben Ihnen nieder. Keiner von euch hat es eilig."
STR_PET_STORY_7: "Ein neuer Weg"
STR_PET_STORY_TEXT_7: "Eine weitere Seite führt Sie an einen neuen Ort. Ihr Begleiter streckt sich und sieht Sie an, bereit für das morgige Kapitel."
