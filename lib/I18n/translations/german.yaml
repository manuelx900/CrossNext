STR_QUEST_CAM_JOURNEY_DAILYREQUEST_3: "Lesen Sie diese Geschichte, bevor ich sie in ein höheres Regal schiebe.Ich muss wissen, welche Wörter noch fehlen."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_4: "Lesen Sie mit mir die Worte der Reisenden. Ich möchte eine alte Warnung nicht mit einem Aufruf verwechseln, dem man folgen muss."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Lesen Sie diese Berichte neben dem Feuer. Bevor wir reisen, möchte ich, dass jeder seinen eigenen Namen hört."
