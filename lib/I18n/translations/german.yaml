STR_INTERCEPT_TITLE_0: "HÜTTE 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. Sie lassen Sie hinter einer verschlossenen Tür warten. Ein Bauteil aus der Rechenmaschine ist verschwunden. Das Morgensignal raschelt in Ihrer Manteltasche. Draußen hören Schritte auf."
STR_INTERCEPT_CHOICE_0_0: "Denken Sie über die Anschuldigung nach"
STR_INTERCEPT_CHOICE_0_1: "Warten Sie auf den Interviewer"
STR_INTERCEPT_CHOICE_0_2: "Suchen Sie Ihren Mantel"
STR_INTERCEPT_TITLE_1: "DIE ANKLAGE"
STR_INTERCEPT_TEXT_1: "Sie vermuten Verrat. Du verdienst deinen Lebensunterhalt mit dem Lösen von Zahlen, Kreuzworträtseln und Schachstellungen. Dieser Raum ist ein weiteres Problem: Widersprechen Sie sich selbst, und Ihre Glaubwürdigkeit könnte das erste Opfer sein."
STR_INTERCEPT_CHOICE_1_0: "Wählen Sie eine Strategie"
STR_INTERCEPT_CHOICE_1_1: "Hören Sie, was sie wissen"
STR_INTERCEPT_TITLE_2: "HARRIS KOMMT"
STR_INTERCEPT_TEXT_2: "Harris kommt mit einer Teetasse und einer Akte herein. Bei der Bombe fehlt eine Rolle. Ihr Name stand auf der Dienstliste. Er stellt die Tasse neben dich und fragt, wo du letzte Nacht warst."
STR_INTERCEPT_CHOICE_2_0: "Trinken Sie den Tee"
STR_INTERCEPT_CHOICE_2_1: "Lassen Sie den Tee unberührt"
STR_INTERCEPT_CHOICE_2_2: "Antworte ruhig"
STR_INTERCEPT_TITLE_3: "DIE KOMPONENTE"
STR_INTERCEPT_TEXT_3: "Im Futter deines Mantels treffen deine Finger auf kaltes Metall. Das Bauteil ist noch da. Hooper sagte, dass die Erpressung ein Ende haben würde, wenn er es nehmen würde. Jetzt hat die verschlossene Tür eine andere Bedeutung."
STR_INTERCEPT_CHOICE_3_0: "Halten Sie es verborgen"
STR_INTERCEPT_CHOICE_3_1: "Gib es Harris"
STR_INTERCEPT_TITLE_4: "EIN GEWINNSPIEL"
STR_INTERCEPT_TEXT_4: "Eine Zusammenarbeit könnte Ihre Glaubwürdigkeit bewahren. Eine überzeugende Lüge könnte Zeit gewinnen. Escape würde einen verschlossenen Raum gegen die Wachen draußen eintauschen. Keiner dieser Schritte kann rückgängig gemacht werden."
STR_INTERCEPT_CHOICE_4_0: "Kooperieren"
STR_INTERCEPT_CHOICE_4_1: "Erfinde ein Alibi"
STR_INTERCEPT_CHOICE_4_2: "Untersuchen Sie das Fenster"
STR_INTERCEPT_TITLE_5: "DER TEE"
STR_INTERCEPT_TEXT_5: "Der Raum kippt. Harris bemerkt Ihr Schweigen, aber sein Gesicht verschwindet bereits. Als Sie das nächste Mal die Augen öffnen, steht ein weiteres Paar Schuhe am Tisch."
STR_INTERCEPT_CHOICE_5_0: "Tu so, als ob du weiter schläfst"
STR_INTERCEPT_CHOICE_5_1: "Konfrontieren Sie den Besucher"
STR_INTERCEPT_CHOICE_5_2: "Bitten Sie um Wasser"
STR_INTERCEPT_TITLE_6: "EINE KLEINE VERWEIGERUNG"
STR_INTERCEPT_TEXT_6: "Du schiebst die Tasse weg. Harris beobachtet die Bewegung genauer als die Antwort. Er fragt, ob es noch jemanden gibt, den er befragen sollte."
STR_INTERCEPT_CHOICE_6_0: "Fragen Sie, welche Beweise er hat"
STR_INTERCEPT_CHOICE_6_1: "Erwähnen Sie Hooper"
STR_INTERCEPT_CHOICE_6_2: "Schauen Sie zum Fenster"
STR_INTERCEPT_TITLE_7: "DIE FEHLENDE ROLLE"
STR_INTERCEPT_TEXT_7: "Harris möchte eine direkte Antwort. Hast du das Bauteil genommen? Sie können ihm sagen, was sich in Ihrem Mantel befindet, den Druck erklären, den Hooper ausgeübt hat, oder versuchen, den Vorwurf anderswo zu formulieren."
STR_INTERCEPT_CHOICE_7_0: "Gib ihm die Komponente"
STR_INTERCEPT_CHOICE_7_1: "Erklären Sie die Erpressung"
STR_INTERCEPT_CHOICE_7_2: "Beschuldigen Sie Hooper"
STR_INTERCEPT_TITLE_8: "METALL AUF DEM TISCH"
STR_INTERCEPT_TEXT_8: "Die Komponente liegt zwischen Ihnen. Harris prüft es, ohne sich zu entspannen. Die Rückgabe gestohlener Ausrüstung erklärt nicht, warum sie gestohlen wurde. Er möchte einen Namen und etwas Verlässlicheres als Ihr Wort."
STR_INTERCEPT_CHOICE_8_0: "Bieten Sie an, Beweise zu finden"
STR_INTERCEPT_CHOICE_8_1: "Bleiben Sie und beantworten Sie Fragen"
STR_INTERCEPT_TITLE_9: "DAS ALIBI"
STR_INTERCEPT_TEXT_9: "Sie beschreiben einen ruhigen Abend an Ihrem Schreibtisch. Harris öffnet die Datei. Ein Wachmann hat gesehen, wie Sie den Maschinenraum verlassen haben. Ihr erfundenes Konto hat jetzt einen Zeugen dagegen."
STR_INTERCEPT_CHOICE_9_0: "Verteidige die Geschichte"
STR_INTERCEPT_CHOICE_9_1: "Geben Sie die Erpressung zu"
STR_INTERCEPT_CHOICE_9_2: "Weitere Fragen ablehnen"
STR_INTERCEPT_TITLE_10: "DAS FENSTER"
STR_INTERCEPT_TEXT_10: "Das Fenster ist hoch und das Glas ist dick. Dahinter führt der Weg an einer weiteren Hütte vorbei. Es zu zerbrechen wäre laut; Das Warten hier birgt seine eigenen Gefahren."
STR_INTERCEPT_CHOICE_10_0: "Zerbrich das Glas"
STR_INTERCEPT_CHOICE_10_1: "Studieren Sie den Weg draußen"
STR_INTERCEPT_CHOICE_10_2: "Zurück zum Interview"
STR_INTERCEPT_TITLE_11: "EIN ANDERER BESUCHER"
STR_INTERCEPT_TEXT_11: "Hooper ist gekommen, während Sie unsicher sind. Er möchte wissen, ob Harris die Komponente hat. Er hält eine Hand in der Nähe der Tür."
STR_INTERCEPT_CHOICE_11_0: "Tu so, als ob du schläfst"
STR_INTERCEPT_CHOICE_11_1: "Fordern Sie eine Erklärung"
STR_INTERCEPT_CHOICE_11_2: "Bitten Sie um Wasser"
STR_INTERCEPT_TITLE_12: "EINE WARNUNG"
STR_INTERCEPT_TEXT_12: "Sie rufen nach Harris, bevor der Tee Einzug hält. Er kehrt genervt zurück. Eine Anschuldigung bezüglich des Pokals erfordert etwas, das er überprüfen kann."
STR_INTERCEPT_CHOICE_12_0: "Bewahren Sie den Becher als Beweismittel auf"
STR_INTERCEPT_CHOICE_12_1: "Beschuldigen Sie Harris, Sie vergiftet zu haben"
STR_INTERCEPT_CHOICE_12_2: "Konzentrieren Sie sich auf die Rolle"
STR_INTERCEPT_TITLE_13: "HOOPER"
STR_INTERCEPT_TEXT_13: "Harris erkennt den Namen. Hooper ist nützlich, gut vernetzt und auch gestern Abend nicht im Kader gefehlt. Anerkennung ist kein Beweis."
STR_INTERCEPT_CHOICE_13_0: "Finden Sie etwas Überprüfbares"
STR_INTERCEPT_CHOICE_13_1: "Bestehen Sie darauf, dass Hooper es gestohlen hat"
STR_INTERCEPT_TITLE_14: "Erpressung"
STR_INTERCEPT_TEXT_14: "Sie beschreiben einen jungen Mann, ein verratenes Vertrauen und die daraus resultierende Forderung. Harris hört zu, ohne Ihnen zu helfen. Wenn Sie die Person nennen, die die Falle aufgestellt hat, entlarven Sie möglicherweise auch die Person, die Sie schützen wollten."
STR_INTERCEPT_CHOICE_14_0: "Geben Sie Harris den vollständigen Account"
STR_INTERCEPT_CHOICE_14_1: "Lassen Sie die Namen weg"
STR_INTERCEPT_CHOICE_14_2: "Schlagen Sie einen Weg vor, Hooper zu fangen"
STR_INTERCEPT_TITLE_15: "EINE EINFACHE ANKLAGE"
STR_INTERCEPT_TEXT_15: "Hooper, sagen Sie, muss verantwortlich sein. Harris fragt, woher Sie das wissen. Es besteht ein Unterschied zwischen der Lösung eines Problems und der Vorlage eines Zeugen, der die Antwort beweisen kann."
STR_INTERCEPT_CHOICE_15_0: "Lassen Sie Harris die Behauptung anfechten"
STR_INTERCEPT_CHOICE_15_1: "Versuchen Sie es mit einer privaten Nachricht an Hooper"
STR_INTERCEPT_TITLE_16: "EIN ÜBERPRÜFBARER HINWEIS"
STR_INTERCEPT_TEXT_16: "Eine Geschichte kann geleugnet werden. Ein Dokument, ein Zeuge oder die fehlende Komponente lässt sich schwerer erklären. Sie haben ein wenig Zeit, um zu entscheiden, was Sie verfolgen möchten."
STR_INTERCEPT_CHOICE_16_0: "Untersuchen Sie die nahegelegene Hütte"
STR_INTERCEPT_CHOICE_16_1: "Verwenden Sie den Morgenabschnitt"
STR_INTERCEPT_CHOICE_16_2: "Befragen Sie Hooper direkt"
STR_INTERCEPT_TITLE_17: "MEHR ALS EINE RÜCKGABE"
STR_INTERCEPT_TEXT_17: "Die Maschine kann wieder funktionieren, aber Harris muss immer noch eine Sicherheitslücke erklären. Er bietet Ihnen eine letzte Gelegenheit herauszufinden, wer es organisiert hat."
STR_INTERCEPT_CHOICE_17_0: "Zeigen Sie den Beweis"
STR_INTERCEPT_CHOICE_17_1: "Suchen Sie nach Beweisen"
STR_INTERCEPT_CHOICE_17_2: "Akzeptieren Sie sein Urteil"
STR_INTERCEPT_TITLE_18: "EIN WIDERSPRUCH"
STR_INTERCEPT_TEXT_18: "Harris legt Ihre erste Antwort neben Ihre letzte. Sie können nicht beide wahr sein. Sie können die Lüge aufgeben oder das Interview mit einem Widerspruch enden lassen."
STR_INTERCEPT_CHOICE_18_0: "Sagen Sie die Wahrheit über die Erpressung"
STR_INTERCEPT_CHOICE_18_1: "Leugne weiterhin alles"
STR_INTERCEPT_CHOICE_18_2: "Versuchen Sie zu gehen"
STR_INTERCEPT_TITLE_19: "STILLE"
STR_INTERCEPT_TEXT_19: "Du verschränkest deine Arme. Harris schließt die Akte. Schweigen in diesem Raum beendet die Ermittlungen nicht; Es beendet nur Ihre Rolle als Regisseur."
STR_INTERCEPT_CHOICE_19_0: "Hören Sie die Entscheidung"
STR_INTERCEPT_TITLE_20: "ZERBROCHENES GLAS"
STR_INTERCEPT_TEXT_20: "Die Scheibe gibt nach. Kalte Luft und der Pfiff eines Wachmanns treffen gleichzeitig ein. Es bleibt Zeit für eine Entscheidung, bevor jemand die Tür erreicht."
STR_INTERCEPT_CHOICE_20_0: "Lauf zum äußeren Pfad"
STR_INTERCEPT_CHOICE_20_1: "Hinterlassen Sie einen codierten Hinweis"
STR_INTERCEPT_CHOICE_20_2: "Bleiben Sie und erklären Sie es"
STR_INTERCEPT_TITLE_21: "ZWISCHEN DEN HÜTTEN"
STR_INTERCEPT_TEXT_21: "Der Weg ist nass. Hoopers Hütte ist nah genug, um vor der nächsten Patrouille erreicht zu werden, aber das offene Gelände dahinter bietet eine andere Chance."
STR_INTERCEPT_CHOICE_21_0: "Versuchen Sie, dem Gelände zu entkommen"
STR_INTERCEPT_CHOICE_21_1: "Gehe in Hoopers Hütte"
STR_INTERCEPT_CHOICE_21_2: "Rückkehr nach Harris"
STR_INTERCEPT_TITLE_22: "EIN PRIVATES SPIEL"
STR_INTERCEPT_TEXT_22: "Hooper studiert dich. Auf dem Tisch zeichnet er mit den Fingern eine imaginäre Schachstellung auf. Eine verschlüsselte Antwort könnte ihn offenbaren lassen, was eine direkte Anschuldigung niemals verraten würde."
STR_INTERCEPT_CHOICE_22_0: "Antworten Sie mit einem Schachhinweis"
STR_INTERCEPT_CHOICE_22_1: "Drohen Sie, ihn beim Namen zu nennen"
STR_INTERCEPT_CHOICE_22_2: "Sprechen Sie ehrlich"
STR_INTERCEPT_TITLE_23: "VON ANSEHEN"
STR_INTERCEPT_TEXT_23: "Hooper fragt, was man eigentlich beweisen kann. Sein Selbstvertrauen gerät nur ins Wanken, wenn Sie Details erwähnen, die jemand außerhalb seines Plans nicht wissen sollte."
STR_INTERCEPT_CHOICE_23_0: "Konfrontieren Sie ihn mit Beweisen"
STR_INTERCEPT_CHOICE_23_1: "Bieten Sie die Komponente als Tausch an"
STR_INTERCEPT_CHOICE_23_2: "Bluff"
STR_INTERCEPT_TITLE_24: "DER BECHER"
STR_INTERCEPT_TEXT_24: "Hooper bringt Wasser, greift aber zuerst nach der Teetasse. Es könnte nützlicher sein, diesen Kelch zu behalten, als alles andere anzunehmen, was er anbietet."
STR_INTERCEPT_CHOICE_24_0: "Behalte die Tasse"
STR_INTERCEPT_CHOICE_24_1: "Überprüfen Sie Ihren Mantel noch einmal"
STR_INTERCEPT_TITLE_25: "ETWAS ZUM TESTEN"
STR_INTERCEPT_TEXT_25: "Sie behalten den Becher und bitten Harris, ihn untersuchen zu lassen. Es handelt sich schließlich um eine Behauptung, an die ein Gegenstand geknüpft ist. Hoopers Versuch, es zu entfernen, liefert ein zweites nützliches Detail."
STR_INTERCEPT_CHOICE_25_0: "Gib Harris den Pokal"
STR_INTERCEPT_CHOICE_25_1: "Konfrontiere Hooper damit"
STR_INTERCEPT_TITLE_26: "DAS FALSCHE ZIEL"
STR_INTERCEPT_TEXT_26: "Sie beschuldigen Harris ohne Beweise. Er sieht einen Verdächtigen, der versucht, den Ermittler zu diskreditieren. Was auch immer mit dem Tee passiert ist, Sie haben es ihm schwerer gemacht, Ihnen zu glauben."
STR_INTERCEPT_CHOICE_26_0: "Das Interview endet"
STR_INTERCEPT_TITLE_27: "DAS GESAMTE KONTO"
STR_INTERCEPT_TEXT_27: "Sie geben die Namen an und beschreiben das Treffen. Harris stellt präzise Fragen. Ihre Verlegenheit ist real, aber auch die Details, die er jetzt überprüfen kann, sind real."
STR_INTERCEPT_CHOICE_27_0: "Lassen Sie ihn das Konto verifizieren"
STR_INTERCEPT_CHOICE_27_1: "Biete an, Hooper zu finden"
STR_INTERCEPT_TITLE_28: "EIN FEHLGESCHLAGENER BLUFF"
STR_INTERCEPT_TEXT_28: "Harris hat genug selbstbewusste Antworten gehört. Hooper auch. Weder liefert die Tatsache, dass Ihre Geschichte fehlt."
STR_INTERCEPT_CHOICE_28_0: "Beharren Sie auf dem Anspruch"
STR_INTERCEPT_CHOICE_28_1: "Machen Sie eine verzweifelte Flucht"
STR_INTERCEPT_CHOICE_28_2: "Geben Sie zu, was wirklich passiert ist"
STR_INTERCEPT_TITLE_29: "DER ANFANG"
STR_INTERCEPT_TEXT_29: "Das Blatt in Ihrer Tasche enthält mehr als nur ein Durcheinander von Buchstaben: Sein Weg durch die Hütten bringt Hooper in die Nähe der Maschine. Ein prägnanter Hinweis könnte dazu führen, dass die richtige Person an der richtigen Stelle sucht."
STR_INTERCEPT_CHOICE_29_0: "Verschlüsseln Sie eine Nachricht für Hooper"
STR_INTERCEPT_CHOICE_29_1: "Zeigt die Route nach Harris"
STR_INTERCEPT_TITLE_30: "DIE MASCHINE LÄUFT"
STR_INTERCEPT_TEXT_30: "Harris hat die Komponente und eine Spur, die über Ihre ersten ängstlichen Antworten hinausführt. Die Bombe nimmt ihre Arbeit wieder auf. Sie verlassen Hut 14 unter Ihrem eigenen Namen, mit weniger Geheimnissen und einer Zukunft, die Sie noch verantworten müssen."
STR_INTERCEPT_TITLE_31: "UNTER VERDACH"
STR_INTERCEPT_TEXT_31: "Die Rücksendung des Bauteils hat die Maschine vor einer Verzögerung bewahrt. Ihre Position wurde dadurch nicht gespeichert. Harris verbietet Ihnen den Zugang zu den Hütten, während die Ermittlungen andauern. Sie haben das Interview überlebt, Ihren Namen aber nicht reinwaschen lassen."
STR_INTERCEPT_TITLE_32: "IN HAFT"
STR_INTERCEPT_TEXT_32: "Die Tür öffnet sich für den Wachmann und nicht für Sie. Widersprüche, fehlende Beweise und eine gestohlene Komponente sind zu einem Fall geworden, den Sie nicht mehr steuern können. Dieser Versuch endet hier."
STR_INTERCEPT_TITLE_33: "DER ÄUSSERE WEG"
STR_INTERCEPT_TEXT_33: "Du lässt die Hütten zurück. Die Dunkelheit ist nützlich, aber das Gelände wird überwacht. Ein zerbrochenes Fenster hat die Patrouillen näher gebracht, als Sie gehofft hatten."
STR_INTERCEPT_CHOICE_33_0: "Überqueren Sie das offene Gelände"
STR_INTERCEPT_CHOICE_33_1: "Halten Sie sich an den Servicepfad"
STR_INTERCEPT_CHOICE_33_2: "Drehen Sie sich um und schauen Sie Harris gegenüber"
STR_INTERCEPT_TITLE_34: "HOOPERS HUT"
STR_INTERCEPT_TEXT_34: "Der Schreibtisch ist unbeaufsichtigt. Papiere liegen unter einem Kreuzworträtsel und der Maschinenraum erscheint in einem mit Bleistift gezeichneten Zeitplan. Schritte nähern sich draußen den Brettern entlang."
STR_INTERCEPT_CHOICE_34_0: "Untersuchen Sie die Papiere"
STR_INTERCEPT_CHOICE_34_1: "Warte auf Hooper"
STR_INTERCEPT_CHOICE_34_2: "Abfahrt nach Harris"
STR_INTERCEPT_TITLE_35: "EIN SCHACHPROBLEM"
STR_INTERCEPT_TEXT_35: "Sie geben Hooper eine Stellung, die seine missliche Lage widerspiegelt: eine gedeckte Figur, einen exponierten König und einen Zug, der bis zur Antwort sicher aussieht. Er versteht die Warnung. Seine nächsten Worte stellen die Verbindung her, die Sie brauchten."
STR_INTERCEPT_CHOICE_35_0: "Bitten Sie ihn, den Plan zuzugeben"
STR_INTERCEPT_CHOICE_35_1: "Schicken Sie die Zulassung an Harris"
STR_INTERCEPT_TITLE_36: "OHNE MASKE"
STR_INTERCEPT_TEXT_36: "Sie sprechen über den Druck, anstatt so zu tun, als hätte er nie existiert. Hooper antwortet kurz als Person und nicht als Gegner. Diese Öffnung könnte für einen Handel oder eine Falle genutzt werden."
STR_INTERCEPT_CHOICE_36_0: "Bitten Sie um eine ehrliche Vereinbarung"
STR_INTERCEPT_CHOICE_36_1: "Bitten Sie ihn um ein Geständnis"
STR_INTERCEPT_CHOICE_36_2: "Bringen Sie das Konto zu Harris"
STR_INTERCEPT_TITLE_37: "HOOPERS EINTRITT"
STR_INTERCEPT_TEXT_37: "Hooper erklärt genug, um die Erpressung mit der fehlenden Komponente in Verbindung zu bringen. Harris kann nun die Ausrüstung bergen und die Geschichte überprüfen. Sie müssen entscheiden, ob Sie die Ermittlungen beenden oder Hooper verschwinden lassen."
STR_INTERCEPT_CHOICE_37_0: "Bringen Sie Harris die Zulassung"
STR_INTERCEPT_CHOICE_37_1: "Lassen Sie Hooper los und gehen Sie"
STR_INTERCEPT_TITLE_38: "DER HANDEL"
STR_INTERCEPT_TEXT_38: "Sie platzieren Ihren letzten Hebel in Hoopers Reichweite. Ein Handel ohne Zeugen oder Beweise ist für ihn eine Einladung, sein Problem auf Ihre Kosten zu lösen."
STR_INTERCEPT_CHOICE_38_0: "Übergeben Sie das Bauteil"
STR_INTERCEPT_CHOICE_38_1: "Fordern Sie eine beglaubigte Vereinbarung"
STR_INTERCEPT_CHOICE_38_2: "Ziehen Sie das Angebot zurück"
STR_INTERCEPT_TITLE_39: "HARRIS HÖRT ZU"
STR_INTERCEPT_TEXT_39: "Die Angaben können überprüft werden. Harris fragt, wo sich die Komponente jetzt befindet. Das Löschen Ihres Kontos und das Starten der Maschine sind zwar verwandte Probleme, aber nicht dasselbe."
STR_INTERCEPT_CHOICE_39_0: "Geben Sie zurück, was in Ihrem Mantel ist"
STR_INTERCEPT_CHOICE_39_1: "Helfen Sie bei der Wiederherstellung der Komponente"
STR_INTERCEPT_CHOICE_39_2: "Hören Sie jetzt auf zu antworten"
STR_INTERCEPT_TITLE_40: "HINTER DEM ZAUN"
STR_INTERCEPT_TEXT_40: "Die Hütten verschwinden hinter dir, Freiheit außerhalb des Grundstücks ist nicht das gleiche wie Unschuld, und die Maschine ist jetzt jemandes anderes dringendes Problem. Du bist geflohen; die Geschichte bleibt unvollendet."
STR_INTERCEPT_TITLE_41: "DER LETZTE FEHLER"
STR_INTERCEPT_TEXT_41: "Die Patrouille erreicht Sie, bevor das offene Gelände endet, oder Hoopers Versprechen bricht zusammen, wenn es ihm nicht mehr nützt. Ihnen sind die sicheren Züge ausgegangen. Die Geschichte kann noch einmal von Anfang an versucht werden."
STR_INTERCEPT_TITLE_42: "DIE PAPIERE"
STR_INTERCEPT_TEXT_42: "Der Zeitplan platziert Hooper dort, wo er laut Ihrer Geschichte war. Daneben steht der Zettel, der Sie zuerst in die Falle lockte. Die Kombination ist spezifisch genug, dass Harris sie überprüfen kann."
STR_INTERCEPT_CHOICE_42_0: "Bringen Sie die Papiere zu Harris"
STR_INTERCEPT_CHOICE_42_1: "Warten Sie und konfrontieren Sie Hooper"
STR_INTERCEPT_TITLE_43: "EINE LETZTE ABORDNUNG"
STR_INTERCEPT_TEXT_43: "Hooper bietet an, das Teil zurückzugeben. Ihm zu vertrauen würde ein unmittelbares Problem beseitigen; Harris zum Zeugen zu machen, würde es schwieriger machen, einen weiteren Zeugen zu benennen."
STR_INTERCEPT_CHOICE_43_0: "Vereinbaren Sie eine beglaubigte Rückgabe"
STR_INTERCEPT_CHOICE_43_1: "Beziehen Sie Harris in den Plan ein"
STR_INTERCEPT_TITLE_44: "WIEDERHERSTELLEN DER ROLLE"
STR_INTERCEPT_TEXT_44: "Wenn das Konto registriert ist, kehrt die Suche zur fehlenden Hardware zurück. Harris überprüft den Maschinenraum, während Sie feststellen, wo sich die Komponente befinden sollte."
STR_INTERCEPT_CHOICE_44_0: "Schließen Sie die verifizierte Rücksendung ab"
STR_INTERCEPT_CHOICE_44_1: "Nimm es aus deinem Mantel"
STR_INTERCEPT_CHOICE_44_2: "Warnen Sie Harris vor Hooper"
STR_INTERCEPT_TITLE_45: "DIE LETZTE FRAGE"
STR_INTERCEPT_TEXT_45: "Harris wartet. Wenn Sie Hooper mit dem Diebstahl in Verbindung bringen können, gibt es immer noch eine Möglichkeit, die Komponente wiederherzustellen und den Diebstahl ordnungsgemäß zu beenden. Ansonsten hat die Untersuchung nur Ihr Wechselkonto zur Folge."
STR_INTERCEPT_CHOICE_45_0: "Legen Sie die Beweise vor"
STR_INTERCEPT_CHOICE_45_1: "Gib zu, dass du nichts mehr hast"
