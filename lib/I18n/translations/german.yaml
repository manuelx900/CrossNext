STR_QUEST_CAM_JOURNEY_THANKS_2: "Mara faltet eine neu lesbare Seite und legt sie neben ihr Gezeitenbuch. Bevor sie zum Fenster zurückkehrt, dankt sie Ihnen mit einer von der salzigen Luft rauen Stimme."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Iri legt einen Streifen trockenes Tuch zwischen zwei Seiten. „Der kann jetzt reisen.“ Sie hält den Band an ihre Brust, bevor sie ihn zu den anderen Büchern trägt."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Taren legt seinen Rucksack auf den Stein und hört zu, während Sie fertig sind. Dann wiederholt er die Worte eines Reisenden, diesmal ohne einen Blick auf die Seite zu werfen."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Nadir zieht ein Band durch seine Finger und liest einen Namen, der vorher schwer zu erkennen war. Er macht für dich einen Platz neben dem Feuer."
