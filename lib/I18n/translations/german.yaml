STR_PET_GUIDE_SUPPLIES: "Sie verdienen eine Portion bei 5, 10, 15, 30, 60 und 120 Leseminuten pro Tag: bis zu 6 Portionen. Jeder erhöht den Sättigungsmesser um 25 Punkte auf bis zu 100."
STR_PET_GUIDE_FEED: "Sie verdienen ein Heilmittel für 30 Minuten Lesen und ein weiteres für 120 Minuten pro Tag. Verwenden Sie sie im Gesundheitsbereich, wenn Ihr Haustier krank wird."
STR_PET_GUIDE_GAMES: "Die ersten 3 Spiele pro Tag verbessern die Stimmung und kosten 20 Energie. Danach kannst du kostenlos üben. Kümmere dich vor dem Spielen um einen kranken, hungrigen, müden oder schlafenden Begleiter."
STR_PET_GUIDE_HEALTH: "Die Reinigung ist kostenlos und stellt die Hygiene auf 100 wieder her. Es heilt keine Krankheit: Öffnen Sie dazu Gesundheit und verwenden Sie ein Heilmittel."
STR_PET_GUIDE_DIFFICULTY: "Relaxed hat keine Frist für die Rückkehr zum Lesen. „Normal“ erlaubt 7 Tage, „Schwer“ 3 Tage und „Extrem“ 24 Stunden. Wenn die Frist verstrichen ist, stirbt Ihr Haustier. Beim Lesen wird der Timer erneut gestartet."
STR_PET_GUIDE_PROJECT: "Wählen Sie ein Objekt und lesen Sie es bis zu 60 Minuten lang, um es zu verdienen. Das Ändern von Projekten beginnt bei Null. Sie können eigene Objekte entfernen, ohne sie zu verlieren; sie werden vererbt."
