STR_QUEST_CAM_DECOR_NAME_0: "Waldfee"
STR_QUEST_CAM_DECOR_TEXT_0: "Du hast die Fee von den stillen Wurzeln befreit. Sie wird ein kleines Wunder zu Ihnen nach Hause bringen."
STR_QUEST_CAM_SOLO_DECOR_NAME_1: "Waldlaterne"
STR_QUEST_CAM_SOLO_DECOR_TEXT_1: "Eine Laterne zur Beleuchtung Ihrer Leseecke."
STR_QUEST_CAM_DECOR_NAME_2: "Echo Conch"
STR_QUEST_CAM_DECOR_TEXT_2: "Ein geretteter Seemann schenkt Ihnen eine Muschel, die noch immer das Lied des Meeres enthält."
STR_QUEST_CAM_DECOR_NAME_3: "Tintengeist"
STR_QUEST_CAM_DECOR_TEXT_3: "Ein Geist entkam einer leeren Seite. Es entscheidet sich, mit Ihnen zu reisen."
STR_QUEST_CAM_DECOR_NAME_4: "Mondblume"
STR_QUEST_CAM_DECOR_TEXT_4: "Die Gärtner haben einen Samen aus dem schlafenden Garten gerettet. Diese Blume ist für dich gewachsen."
STR_QUEST_CAM_DECOR_NAME_5: "Winterkristall"
STR_QUEST_CAM_DECOR_TEXT_5: "Das Tauwetter bringt einen Kristall zum Vorschein, der die letzte Erinnerung an den Berg enthält."
STR_QUEST_CAM_DECOR_NAME_6: "Uhrwerk-Eule"
STR_QUEST_CAM_DECOR_TEXT_6: "Der Uhrmacher repariert diesen kleinen Wächter, um Ihnen dafür zu danken, dass Sie die Zeit zurückgebracht haben."
STR_QUEST_CAM_DECOR_NAME_7: "Phönixfeder"
STR_QUEST_CAM_DECOR_TEXT_7: "Aus der geborgenen Asche erhebt sich eine Feder: das Versprechen, dass Geschichten von neuem beginnen können."
STR_QUEST_CAM_DECOR_NAME_8: "Wüstenlampe"
STR_QUEST_CAM_DECOR_TEXT_8: "Ein Geschichtenerzähler gibt Ihnen die Lampe, die die Wüstengeschichten am Leben hielt."
STR_QUEST_CAM_DECOR_NAME_9: "Wolkenkoi"
STR_QUEST_CAM_DECOR_TEXT_9: "Du öffnest den Wolkenkäfig. Ein kleiner Koi bleibt, um über Ihre Träume zu wachen."
STR_QUEST_CAM_DECOR_NAME_10: "Drachenherz"
STR_QUEST_CAM_DECOR_TEXT_10: "Die Drachen vertrauen dir einen Kristall an, der aus ihrer wiederhergestellten Erinnerung entstanden ist."
STR_QUEST_CAM_DECOR_NAME_11: "Stern der Erinnerung"
STR_QUEST_CAM_DECOR_TEXT_11: "Der erste wiederhergestellte Stern erhellt Ihren Weg zu den letzten Seiten."
STR_QUEST_CAM_DECOR_NAME_12: "Sprout lesen"
STR_QUEST_CAM_DECOR_TEXT_12: "Eine kleine Pflanze für eine ruhige Leseecke."
STR_QUEST_CAM_DECOR_NAME_13: "Gespeicherte Bücher"
STR_QUEST_CAM_DECOR_TEXT_13: "Geschichten warten auf ihren nächsten Leser."
STR_QUEST_CAM_DECOR_NAME_14: "Voyager-Banner"
STR_QUEST_CAM_DECOR_TEXT_14: "Ein Wimpel zur Erinnerung an jeden Neuanfang."
STR_QUEST_CAM_DECOR_NAME_15: "Mondpilze"
STR_QUEST_CAM_DECOR_TEXT_15: "Ein kleines Stück Wald für Ihr Zuhause."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Der Beginn des Abenteuers"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Viele Jahre lang lebten die Menschen in Frieden und genossen ihre Bücher. Dann begann der König des Vergessens, sie zu zerstören. Er wollte alle vom Lesen abhalten und alle Geschichten für immer verschwinden lassen."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Die Monster des Königs"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Der König des Vergessens schickte seine Monster in die ganze Welt. Sie zerstörten jedes Buch, das sie fanden, und griffen jeden an, der versuchte, sie aufzuhalten. Bibliotheken begannen zu verschwinden und die Leute hörten auf zu lesen."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Die Kraft des Lesens"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Eines Tages, während Sie in der Nähe Ihres Dorfes lesen, erscheint ein Monster. Du versuchst wegzukommen, aber es passiert etwas Überraschendes: Je mehr du liest, desto schwächer wird es. Dir wird klar, dass Lesen der einzige Weg ist, die Magie des Königs zu bekämpfen."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Ihre Mission"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Du wolltest den König aufhalten. Auf Ihrem Weg zu seiner Burg müssen Sie Wälder, Städte, Berge und andere Orte voller Feinde durchqueren. Jedes Monster, das du besiegst, bringt dich ein Stück näher. Lesen Sie weiter, besiegen Sie seine Wächter und erreichen Sie ihn, bevor er jedes Buch der Welt zerstört."
STR_QUEST_CAM_JOURNEY2_BOOK_0: "Der Wald der Monster"
STR_QUEST_CAM_JOURNEY2_BOOK_1: "Die Stadt ohne Bücher"
STR_QUEST_CAM_JOURNEY2_BOOK_2: "Der Hafen des Nebels"
STR_QUEST_CAM_JOURNEY2_BOOK_3: "Die Bibliothek unter dem Meer"
STR_QUEST_CAM_JOURNEY2_BOOK_4: "Die Berge der Echos"
STR_QUEST_CAM_JOURNEY2_BOOK_5: "Das Sandmeer"
STR_QUEST_CAM_JOURNEY2_BOOK_6: "Die Uhrwerk-Zitadelle"
STR_QUEST_CAM_JOURNEY2_BOOK_7: "Der Palast des Mondes"
STR_QUEST_CAM_JOURNEY2_BOOK_8: "Der Garten der Götter"
STR_QUEST_CAM_JOURNEY2_BOOK_9: "Der Krieg um die Bücher"
STR_QUEST_CAM_JOURNEY2_BOOK_10: "Der Weg der Sterne"
STR_QUEST_CAM_JOURNEY2_BOOK_11: "Die letzte Seite"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Nachdem Sie den König des Vergessens besiegt haben, kehren Sie nach Hause zurück. Seine Armee kann keine Bücher mehr zerstören und die Menschen lesen wieder in Frieden. Du hast die Geschichten der Welt gerettet. Es gibt noch viele Bücher zu entdecken."
