STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Lesen Sie diese Erinnerung in der Nähe des Brunnens. Ich würde gerne hören, was die Person, die hier gepflanzt hat, hinterlassen wollte."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Lesen Sie die Geschichten, die wir Ihnen geschickt haben: Die Stimmen von zu Hause können Ihnen Gesellschaft leisten, auch so weit weg."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Lesen Sie diesen Brief, bevor Sie losfahren. Sie müssen nicht jede Erinnerung alleine mit sich herumtragen."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_11: "Lesen Sie die Wörter, die wir für Sie aufbewahrt haben. Die Festung ist nicht die ganze Welt, so still es auch sein mag."
