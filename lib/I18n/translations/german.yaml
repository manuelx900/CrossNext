STR_INTERCEPT_ABOUT: "Eine komprimierte Adaption von The Intercept von inkle, 2016, verwendet unter der MIT-Lizenz. Bletchley Park, 1942: eine fehlende Maschinenkomponente, Erpressung und ein Interview, das mit Freiheit oder Haft enden kann.\n\nIhre Entscheidungen und Ihre Position werden nach jeder Auswahl gespeichert. Eine neue Geschichte setzt diesen Spieldurchgang zurück. Für diese Firmware wurden Originalillustrationen erstellt. Das Originalskript und die Lizenz sind im Projekt enthalten."
