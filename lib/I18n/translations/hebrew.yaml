STR_FLASHCARDS_HELP: "העתק חפיסות Anki (.apkg /.colpkg , .anki2 /.anki21 ), CSV /TSV/text או תיקיות מחקר מומרות ל-/FLASHCARDS. השתמש בתיקיות משנה: עד 128 פריטים כל אחת.\n\nייבוא ​​מקבל כרטיסי טקסט בסיסיים, הפוכים ופשוטים. אודיו ו-HTML מותאם אישית אינם נתמכים. המר תחילה חפיסות תמונה /CJK. ביקורות לא מקוונות משתמשות ב-FSRS. הייבוא ​​מתחיל לוח זמנים חדש ושומר על מסמכים מקוריים."
