STR_CAR_HELP_TEXT: "איך לפתור מקרה\nכל דמות עושה הצהרה אחת. בפינה העליונה של המסך מופיעים המספרים המדויקים של האשמים וההצהרות השגויות. תמצאו שילוב שמספק את שני המספרים. לכל מקרה יש פתרון אחד.\n  \nאשמה היא לא כנות.\nדמות חפה מפשע יכולה לשקר, ואשם יכול לומר את האמת. שני שקרים אומרים בדיוק שתי הצהרות שלמות שגויות; האחרים נכונים. סימני אמת / שקר מתייחסים להצהרה; חשוד מתייחס לאשמה.\n  \nלקרוא את הרמזים\n\"A או B עשו את זה (או שניהם)\" פירושו שלפחות דמות אחת בשם היא אשמה. \"A ו-B עשו את זה\" דורש את שניהם. שקר מכחיש את ההצהרה כולה: OR שגוי פירושו שאף אחד לא עשה את זה; AND שגוי פירושו שלפחות אחד לא עשה את זה.\n  \n\"שניהם אמינים או שניהם משקרים\" משווה הצהרות, לא אשמה. \"דיוק אחד משקר\" אומר להצהרות שלהם ערכי אמת שונים. רמזים אלה עצמם יכולים להיות נכונים או שגויים.\n  \nשכנינו על מסך קטן\nהסדר המעגלי המקורי הוא פנתר, תאו, כריש, שועל, דוב, אייל, סוס, בעזרת האותיות של המקרה הזה בלבד. האחרון והראשון הם שכנים. התוכנה הזו כותבת את שני השמות ישירות בכל רמז של שכנה. אתה לעולם לא צריך לנחש אילו קלפים נמצאים ליד דיוקנו. שינוי דף או כיוון לא משנה את הרמז.\n  \nגובה ודיאטה\nכל קלף מראה גובה ודיאטה דמיוניים. \"אשם הוא גבוה ממני\" אומר שלפחות אשם אחד גבוה מהדובר, לא בהכרח כל האשמים. קצר יותר עובד באותה דרך. רמזים של טורפים וצמחונים אומרים שלפחות אשם אחד יש את הדיאטה הזו; אוכלי כל נחשבים כאחד מהם. שמות, גובה ודיאטה הם עובדות אמינות; הצהרות יכולות לשקר.\n  \nהניתוח שלך\nהשתמש ב? / אמת / שקר וחשוד מתחת לכל הצהרה כדי לכתוב היפותיזות. אלה הם הערותיך, לא ראיות או בדיקות אוטומטיות. חצים מציגים את התווים האחרים. מצב דיוקן מציג עד שלושה על כל עמוד.\n  \nלהגיש כתב אישום\nלחץ על האשמה ובחר בדיוק את המספר הנדרש של אשמים. רק אישור האשמה שגויה לוקח חיים. למתחיל ולנורמלי יש שני חיים; למתקדם ולמומחה יש חיים אחד. האשמה נכונה פותרת את המקרה. כשלא נשארו עוד חיים, מתגלה הפיתרון.\n  \nקמפיין ומשחק חוזר\nישנם 1,470 מקרים. מקרה פתוח חוזר על הניסיון הנוכחי או פותח את המקרה הבא אחרי אחד סגור. קמפיין מאפשר לך לבחור כל אחד מ- 1,470 המקרים בכל סדר מההתחלה. משחק חוזר מתחיל ניסיון חדש תוך שמירה על השלמתם הקודמת. בתוך כל רמה של קושי, המקרים מתקדמים מאשם אחד לשניים, ואז מפחות שקרנים ליותר בתוך כל קבוצת אשמים. מתחילים שומרים על אשם אחד. הזרקות קטנות מגיעות קודם כשהספירה מתאימה. כל המקרים נשארים זמינים. פתרון מקרה שהושלם קודם משדרג אותו לפתרון.\n  \nההתקדמות והחיים נשמרים על כרטיס SD. היציאה, השינה או ההפעלה מחדש של המכשיר לא משחזרים חיים בניסיון הנוכחי. שמירה כושלת חוסמת את התוצאה עד שניסיון נוסף מצליח. איפוס הכל מבקש אישור לפני שמוחקת רק את ההתקדמות של קרניבור."
