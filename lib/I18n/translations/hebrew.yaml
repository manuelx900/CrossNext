STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "תחילתה של ההרפתקה"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "במשך שנים רבות אנשים חיו בשלום ונהנו מהספרים שלהם. ואז מלך השכחה החל להשמיד אותם. הוא רצה למנוע מכולם לקרוא ולהעלים את כל הסיפורים לנצח."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "המפלצות של המלך"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "מלך השכחה שלח את המפלצות שלו לכל רחבי העולם. הם השמידו כל ספר שמצאו ותקפו את כל מי שניסה לעצור אותם. הספריות החלו להיעלם, ואנשים הפסיקו לקרוא."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "כוחה של קריאה"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "יום אחד, בזמן שאתה קורא ליד הכפר שלך, מופיעה מפלצת. אתה מנסה לברוח, אבל משהו מפתיע קורה: ככל שאתה קורא יותר, כך הוא נחלש. אתה מבין שקריאה היא הדרך היחידה להילחם בקסם של המלך."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "המשימה שלך"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "יצאת לעצור את המלך. בדרכך לטירה שלו עליך לחצות יערות, ערים, הרים ומקומות אחרים מלאי אויבים. כל מפלצת שאתה מביס מקרבת אותך קצת יותר. המשיכו לקרוא, הבס את האפוטרופוסים שלו והגיעו אליו לפני שהוא יהרוס כל ספר בעולם."
