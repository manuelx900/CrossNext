STR_QUEST_CAM_DECOR_NAME_6: "ינשוף שעון"
STR_QUEST_CAM_DECOR_TEXT_6: "השען מתקן את השומר הקטן הזה כדי להודות לך שהחזרת את הזמן."
STR_QUEST_CAM_DECOR_NAME_7: "נוצת הפניקס"
STR_QUEST_CAM_DECOR_TEXT_7: "מהאפר המשוחזר עולה נוצה: ההבטחה שסיפורים יכולים להתחיל מחדש."
STR_QUEST_CAM_DECOR_NAME_8: "מנורת מדבר"
STR_QUEST_CAM_DECOR_TEXT_8: "מספר סיפורים נותן לך את המנורה ששמרה על סיפורי המדבר בחיים."
STR_QUEST_CAM_DECOR_NAME_9: "Cloud Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "אתה פותח את כלוב הענן. קוי קטן נשאר לשמור על החלומות שלך."
