STR_PET_GUIDE_GAMES: "3 המשחקים הראשונים בכל יום משפרים את מצב הרוח וצורכים 20 אנרגיה. לאחר מכן אפשר לתרגל בחינם. לפני המשחק טפל בחבר חולה, רעב, עייף או ישן."
STR_PET_GUIDE_HEALTH: "ניקוי הוא חופשי ומחזיר היגיינה ל-100: זה לא מרפא מחלה: לשם כך, פתחו בריאות ושתמשו בתרופה."
STR_PET_GUIDE_DIFFICULTY: "רגיל מאפשר 7 ימים, קשה 3 ימים וקיצוני 24 שעות.אם המועד עובר, חיית המחמד שלך מתה.קריאה מתחילה את הזמן שוב."
STR_PET_GUIDE_PROJECT: "בחר אובייקט וקרא עד 60 דקות כדי להרוויח אותו.שינוי פרויקטים מתחיל מאפס."
