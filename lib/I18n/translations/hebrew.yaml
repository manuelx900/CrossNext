STR_UI_SWIPE_OR_TAP_AN_ARROW_TO_887004: "החלק או הקש על חץ כדי לנווט. אכלו את המזון המתואר כדי לגדול. הימנע מקירות ומהזנב שלך. אתה לא יכול להפוך כיוון. הקש על השהה לפני הנחת הקורא. משחקים שנשמרו תמיד חוזרים למושהים."
STR_UI_YOU_PLAY_BLACK_TAP_AN_EMPTY_29AEBA: "אתה משחק שחור. הקש על ריבוע ריק אשר לוכד דיסקים לבנים בקו ישר. כל הדיסקים הכלואים מתהפכים לצבע שלך. המכשיר משחק לבן. אם לצד אין מהלך חוקי, הוא עובר אוטומטית. רוב הדיסקים מנצחים כאשר אף צד לא יכול לזוז."
STR_UI_MAKE_ONE_CLOSED_LOOP_EACH_NUMBER_D60227: "צור לולאה אחת סגורה. כל מספר אומר כמה מארבעת הקצוות שלו שייכים ללולאה. הקש ליד קצה כדי לעבור על קו, לחצות ולרוקן. קווים אינם יכולים להסתעף או ליצור לולאות נפרדות. כל הרמזים חייבים להתאים. כל פתרון תקף מתקבל."
STR_UI_CONNECT_ALL_ISLANDS_IN_ONE_NETWORK_C5618B: "חבר את כל האיים ברשת אחת. המספר על אי הוא ספירת הגשרים הנדרשת שלו. הקש על שני איים שכנים באותה שורה או עמודה כדי לעבור על גשרים אחד, שניים ואפס. גשרים לא יכולים לקפוץ מעל איים. כל פתרון מחובר המתאים לכל המספרים מנצח."
