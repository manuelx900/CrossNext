STR_INTERCEPT_TITLE_0: "HUT 14"
STR_INTERCEPT_TEXT_0: "בלצ'לי פארק, 1942. הם מחכים לך מאחורי דלת נעולה. רכיב ממכונת החישוב נעלם. יירוט הבוקר מרשרש בכיס המעיל שלך. בחוץ נעצרים צעדים."
STR_INTERCEPT_CHOICE_0_0: "חשבו דרך ההאשמה"
STR_INTERCEPT_CHOICE_0_1: "המתן למראיין"
STR_INTERCEPT_CHOICE_0_2: "חפש את המעיל שלך"
STR_INTERCEPT_TITLE_1: "האשמה"
STR_INTERCEPT_TEXT_1: "הם חושדים בבגידה. אתה פותר דמויות, תשבצים ועמדות שחמט למחייתך. החדר הזה הוא בעיה נוספת: סתור את עצמך, והאמינות שלך עשויה להיות הנפגע הראשון."
STR_INTERCEPT_CHOICE_1_0: "בחר אסטרטגיה"
STR_INTERCEPT_CHOICE_1_1: "שמע מה הם יודעים"
STR_INTERCEPT_TITLE_2: "הריס מגיע"
STR_INTERCEPT_TEXT_2: "האריס נכנס עם כוס תה ותיק. חסר סליל מהבומבה. שמך היה ברשימת התפקידים. הוא מניח את הספל לידך ושואל איפה היית אתמול בלילה."
STR_INTERCEPT_CHOICE_2_0: "שתו את התה"
STR_INTERCEPT_CHOICE_2_1: "השאר את התה ללא נגיעה"
STR_INTERCEPT_CHOICE_2_2: "ענה בשלווה"
STR_INTERCEPT_TITLE_3: "הרכיב"
STR_INTERCEPT_TEXT_3: "בתוך בטנת המעיל שלך אצבעותיך פוגשות מתכת קרה. הרכיב עדיין שם. הופר אמר שלקיחתו תגרום לסחטנות להפסיק. עכשיו לדלת הנעולה יש משמעות אחרת."
STR_INTERCEPT_CHOICE_3_0: "שמור אותו מוסתר"
STR_INTERCEPT_CHOICE_3_1: "מסור אותו להריס"
STR_INTERCEPT_TITLE_4: "משחק מנצח"
STR_INTERCEPT_TEXT_4: "שיתוף פעולה יכול לשמר את האמינות שלך. שקר משכנע יכול לקנות זמן. בריחה הייתה מחליפה חדר נעול עבור השומרים בחוץ. אף אחד מהמהלכים הללו לא ניתן להחזרה."
STR_INTERCEPT_CHOICE_4_0: "שיתוף פעולה"
STR_INTERCEPT_CHOICE_4_1: "המציא אליבי"
STR_INTERCEPT_CHOICE_4_2: "בדוק את החלון"
STR_INTERCEPT_TITLE_5: "התה"
STR_INTERCEPT_TEXT_5: "החדר נוטה. האריס מבחין בשתיקתך, אבל פניו כבר מתרחקות. בפעם הבאה שאתה פוקח את העיניים, זוג נעליים נוסף עומד ליד השולחן."
STR_INTERCEPT_CHOICE_5_0: "העמד פנים שאתה ישן"
STR_INTERCEPT_CHOICE_5_1: "התעמת עם המבקר"
STR_INTERCEPT_CHOICE_5_2: "בקשו מים"
STR_INTERCEPT_TITLE_6: "סירוב קטן"
STR_INTERCEPT_TEXT_6: "אתה דוחף את הספל. האריס מתבונן בתנועה מקרוב יותר מאשר בתשובה. הוא שואל אם יש מישהו אחר שהוא צריך לחקור."
STR_INTERCEPT_CHOICE_6_0: "שאל אילו ראיות יש לו"
STR_INTERCEPT_CHOICE_6_1: "הזכירו את הופר"
STR_INTERCEPT_CHOICE_6_2: "הביטו לכיוון החלון"
STR_INTERCEPT_TITLE_7: "הגלגל החסר"
STR_INTERCEPT_TEXT_7: "האריס רוצה תשובה ישירה. לקחת את הרכיב? אתה יכול להגיד לו מה יש במעיל שלך, להסביר את הלחץ שהופר הפעיל, או לנסות להפנות את ההאשמה למקום אחר."
STR_INTERCEPT_CHOICE_7_0: "תן לו את הרכיב"
STR_INTERCEPT_CHOICE_7_1: "הסבר את הסחיטה"
STR_INTERCEPT_CHOICE_7_2: "האשים את הופר"
STR_INTERCEPT_TITLE_8: "מתכת על השולחן"
STR_INTERCEPT_TEXT_8: "הרכיב נמצא ביניכם. האריס בודק את זה בלי להירגע. החזרת ציוד גנוב אינה מסבירה מדוע הוא נלקח. הוא רוצה שם ומשהו אמין יותר מהמילה שלך."
STR_INTERCEPT_CHOICE_8_0: "הציעו למצוא ראיות"
STR_INTERCEPT_CHOICE_8_1: "הישאר וענה על שאלות"
STR_INTERCEPT_TITLE_9: "האליבי"
STR_INTERCEPT_TEXT_9: "אתה מתאר ערב שקט ליד השולחן שלך. האריס פותח את התיק. שומר ראה אותך יוצא מחדר המכונות. לחשבון המומצא שלך יש כעת עד נגדו."
STR_INTERCEPT_CHOICE_9_0: "הגן על הסיפור"
STR_INTERCEPT_CHOICE_9_1: "תודו בסחיטה"
STR_INTERCEPT_CHOICE_9_2: "סרב לשאלות נוספות"
STR_INTERCEPT_TITLE_10: "החלון"
STR_INTERCEPT_TEXT_10: "החלון גבוה והזכוכית עבה. מעבר לו, השביל עובר על פני בקתה נוספת. לשבור אותו יהיה רם; לחכות כאן יש סכנות משלה."
STR_INTERCEPT_CHOICE_10_0: "שבור את הכוס"
STR_INTERCEPT_CHOICE_10_1: "למד את השביל בחוץ"
STR_INTERCEPT_CHOICE_10_2: "חזור לראיון"
STR_INTERCEPT_TITLE_11: "מבקר נוסף"
STR_INTERCEPT_TEXT_11: "הופר הגיע בזמן שאתה לא יציב. הוא רוצה לדעת אם להריס יש את הרכיב. הוא מחזיק יד אחת ליד הדלת."
STR_INTERCEPT_CHOICE_11_0: "העמד פנים שאתה ישן"
STR_INTERCEPT_CHOICE_11_1: "דרשו הסבר"
STR_INTERCEPT_CHOICE_11_2: "בקשו מים"
STR_INTERCEPT_TITLE_12: "אזהרה"
STR_INTERCEPT_TEXT_12: "אתה קורא להריס לפני שהתה תופס. הוא חוזר, עצבני. האשמה לגבי הגביע תצטרך משהו שהוא יכול לבדוק."
STR_INTERCEPT_CHOICE_12_0: "שמור את הכוס כראיה"
STR_INTERCEPT_CHOICE_12_1: "האשים את האריס שהרעיל אותך"
STR_INTERCEPT_CHOICE_12_2: "התרכז בסליל"
STR_INTERCEPT_TITLE_13: "הופר"
STR_INTERCEPT_TEXT_13: "האריס מזהה את השם. הופר שימושי, מחובר היטב, וגם לא נעדר מהסגל של אמש. הכרה אינה הוכחה."
STR_INTERCEPT_CHOICE_13_0: "מצא משהו שניתן לאימות"
STR_INTERCEPT_CHOICE_13_1: "התעקש שהופר גנב אותו"
STR_INTERCEPT_TITLE_14: "סחט"
STR_INTERCEPT_TEXT_14: "אתה מתאר בחור צעיר, אמון שנבגד ואת הדרישה שבאה בעקבותיו. האריס מקשיב בלי לעזור לך. מתן שם לאדם שטמן את המלכודת עשוי גם לחשוף את האדם שקיווית להגן עליו."
STR_INTERCEPT_CHOICE_14_0: "תן להריס את החשבון המלא"
STR_INTERCEPT_CHOICE_14_1: "השאירו את השמות בחוץ"
STR_INTERCEPT_CHOICE_14_2: "הצע דרך לתפוס את הופר"
STR_INTERCEPT_TITLE_15: "האשמה קלה"
STR_INTERCEPT_TEXT_15: "הופר, אתה אומר, חייב להיות אחראי. האריס שואל איך אתה יודע. יש הבדל בין פתרון בעיה לבין הפקת עד שיכול להוכיח את התשובה."
STR_INTERCEPT_CHOICE_15_0: "תן להריס לערער על הטענה"
STR_INTERCEPT_CHOICE_15_1: "נסה לשלוח הודעה פרטית להופר"
STR_INTERCEPT_TITLE_16: "רמז שניתן לבדיקה"
STR_INTERCEPT_TEXT_16: "ניתן להכחיש סיפור. קשה יותר להסביר מסמך, עד או הרכיב החסר. יש לך קצת זמן לבחור מה להמשיך."
STR_INTERCEPT_CHOICE_16_0: "בדוק את הצריף הסמוך"
STR_INTERCEPT_CHOICE_16_1: "השתמש בירוט הבוקר"
STR_INTERCEPT_CHOICE_16_2: "שאלה ישירות עם הופר"
STR_INTERCEPT_TITLE_17: "יותר מהחזרה"
STR_INTERCEPT_TEXT_17: "המכונה יכולה לעבוד שוב, אבל להריס עדיין יש פרצת אבטחה להסביר. הוא מציע לך הזדמנות אחרונה לקבוע מי ארגן את זה."
STR_INTERCEPT_CHOICE_17_0: "הצג את ההוכחות"
STR_INTERCEPT_CHOICE_17_1: "חפש הוכחות"
STR_INTERCEPT_CHOICE_17_2: "קבל את שיקול דעתו"
STR_INTERCEPT_TITLE_18: "סתירה"
STR_INTERCEPT_TEXT_18: "האריס מציב את התשובה הראשונה שלך לצד האחרונה שלך. שניהם לא יכולים להיות נכונים. אתה יכול לנטוש את השקר, או לתת לראיון להסתיים בסתירה."
STR_INTERCEPT_CHOICE_18_0: "ספר את האמת על הסחיטה"
STR_INTERCEPT_CHOICE_18_1: "המשיכו להכחיש הכל"
STR_INTERCEPT_CHOICE_18_2: "נסה לעזוב"
STR_INTERCEPT_TITLE_19: "שתיקה"
STR_INTERCEPT_TEXT_19: "אתה מקפל את הידיים. האריס סוגר את התיק. בחדר זה השתיקה אינה מסיימת את החקירה; זה רק מסיים את החלק שלך בבימוי."
STR_INTERCEPT_CHOICE_19_0: "שמע את ההחלטה"
STR_INTERCEPT_TITLE_20: "זכוכית שבורה"
STR_INTERCEPT_TEXT_20: "החלונית מוותרת. אוויר קר וקול שריקת שומר מגיעים יחד. יש זמן להחלטה אחת לפני שמישהו מגיע לדלת."
STR_INTERCEPT_CHOICE_20_0: "רץ בשביל החיצוני"
STR_INTERCEPT_CHOICE_20_1: "השאר רמז מקודד"
STR_INTERCEPT_CHOICE_20_2: "הישארו והסבירו"
STR_INTERCEPT_TITLE_21: "בין הצריפים"
STR_INTERCEPT_TEXT_21: "השביל רטוב. הצריף של הופר קרוב מספיק כדי להגיע לפני הסיור הבא, אבל הקרקע הפתוחה שמעבר לו מציעה סיכוי מסוג אחר."
STR_INTERCEPT_CHOICE_21_0: "נסו לברוח מהשטח"
STR_INTERCEPT_CHOICE_21_1: "היכנסו לבקתה של הופר"
STR_INTERCEPT_CHOICE_21_2: "חזור להריס"
STR_INTERCEPT_TITLE_22: "משחק פרטי"
STR_INTERCEPT_TEXT_22: "הופר לומד אותך. על השולחן הוא מציב באצבעותיו עמדת שחמט דמיונית. תשובה מוצפנת יכולה לגרום לו לחשוף מה שהאשמה ישירה לעולם לא תעשה."
STR_INTERCEPT_CHOICE_22_0: "ענה עם רמז לשחמט"
STR_INTERCEPT_CHOICE_22_1: "מאיים בשמו"
STR_INTERCEPT_CHOICE_22_2: "דבר בכנות"
STR_INTERCEPT_TITLE_23: "פנים אל פנים"
STR_INTERCEPT_TEXT_23: "הופר שואל מה אתה באמת יכול להוכיח. הביטחון שלו מתערער רק כאשר אתה מזכיר פרטים שמישהו מחוץ לתוכנית שלו לא צריך לדעת."
STR_INTERCEPT_CHOICE_23_0: "עמת אותו עם הוכחות"
STR_INTERCEPT_CHOICE_23_1: "הציעו את הרכיב כמסחר"
STR_INTERCEPT_CHOICE_23_2: "בלוף"
STR_INTERCEPT_TITLE_24: "הגביע"
STR_INTERCEPT_TEXT_24: "הופר מביא מים אבל מושיט יד קודם לכוס התה. שמירה על הספל הזה עשויה להיות שימושית יותר מאשר לקבל כל דבר אחר שהוא מציע."
STR_INTERCEPT_CHOICE_24_0: "שמור את הכוס"
STR_INTERCEPT_CHOICE_24_1: "בדוק שוב את המעיל שלך"
STR_INTERCEPT_TITLE_25: "משהו לבדיקה"
STR_INTERCEPT_TEXT_25: "אתה שומר את הספל ומבקש מהאריס שיבדוק אותו. סוף סוף מדובר בטענה עם חפץ צמוד אליה. הניסיון של הופר להסיר אותו מספק פרט שימושי שני."
STR_INTERCEPT_CHOICE_25_0: "תן להריס את הגביע"
STR_INTERCEPT_CHOICE_25_1: "התעמת איתו עם הופר"
STR_INTERCEPT_TITLE_26: "היעד השגוי"
STR_INTERCEPT_TEXT_26: "אתה מאשים את האריס ללא ראיות. הוא רואה חשוד שמנסה להכפיש את החוקר. לא משנה מה קרה לתה, הקשה עליו להאמין לך."
STR_INTERCEPT_CHOICE_26_0: "הראיון מסתיים"
STR_INTERCEPT_TITLE_27: "כל החשבון"
STR_INTERCEPT_TEXT_27: "אתה נותן את השמות ומתאר את הפגישה. האריס שואל שאלות מדויקות. המבוכה שלך אמיתית, אבל כך גם הפרטים שהוא יכול לבדוק כעת."
STR_INTERCEPT_CHOICE_27_0: "תן לו לאמת את החשבון"
STR_INTERCEPT_CHOICE_27_1: "הצע למצוא את הופר"
STR_INTERCEPT_TITLE_28: "BLUFF כושל"
STR_INTERCEPT_TEXT_28: "האריס שמע מספיק תשובות בטוחות. גם להופר יש. שתיהן לא מספקות את העובדה שהסיפור שלך חסר."
STR_INTERCEPT_CHOICE_28_0: "התמידו בתביעה"
STR_INTERCEPT_CHOICE_28_1: "עשה בריחה נואשת"
STR_INTERCEPT_CHOICE_28_2: "תודו במה באמת קרה"
STR_INTERCEPT_TITLE_29: "האינטרספט"
STR_INTERCEPT_TEXT_29: "הגיליון בכיס שלך נושא יותר מאותיות מבולבלות: המסלול שלו דרך הצריפים מציב את הופר ליד המכונה. רמז תמציתי עשוי לגרום לאדם הנכון לחפש במקום הנכון."
STR_INTERCEPT_CHOICE_29_0: "קודד הודעה עבור הופר"
STR_INTERCEPT_CHOICE_29_1: "הצג את המסלול להריס"
STR_INTERCEPT_TITLE_30: "המכונה פועלת"
STR_INTERCEPT_TEXT_30: "להריס יש את המרכיב, ושובל שמוביל מעבר לתשובות המבוהלות הראשונות שלך. הבומבה ממשיכה את עבודתה. אתה עוזב את Hut 14 תחת השם שלך, עם פחות סודות ועתיד שעדיין צריך לענות עליו."
STR_INTERCEPT_TITLE_31: "תחת חשד"
STR_INTERCEPT_TEXT_31: "החזרת הרכיב הצילה את המכונה מעיכוב. זה לא הציל את עמדתך. האריס מסיים את הגישה שלך לבקתות בזמן שהחקירה נמשכת. שרדת את הראיון, אבל לא ניקית את שמך."
STR_INTERCEPT_TITLE_32: "במעצר"
STR_INTERCEPT_TEXT_32: "הדלת נפתחת עבור השומר ולא עבורך. סתירות, ראיות חסרות ורכיב גנוב הפכו לתיק שאתה כבר לא יכול לכוון. הניסיון הזה מסתיים כאן."
STR_INTERCEPT_TITLE_33: "הנתיב החיצוני"
STR_INTERCEPT_TEXT_33: "אתה משאיר את הבקתות מאחור. החושך מועיל, אבל השטח נשמר. חלון שבור קירב את הסיורים מכפי שקיוויתם."
STR_INTERCEPT_CHOICE_33_0: "חצו את הקרקע הפתוחה"
STR_INTERCEPT_CHOICE_33_1: "היצמד לנתיב השירות"
STR_INTERCEPT_CHOICE_33_2: "הסתובב לאחור והתמודד מול האריס"
STR_INTERCEPT_TITLE_34: "בקתת הופר"
STR_INTERCEPT_TEXT_34: "השולחן ללא השגחה. ניירות מונחים מתחת לתשבץ, וחדר המכונות מופיע בלוח זמנים עם עיפרון. צעדים מתקרבים לאורך הקרשים שבחוץ."
STR_INTERCEPT_CHOICE_34_0: "בחנו את המסמכים"
STR_INTERCEPT_CHOICE_34_1: "המתן להופר"
STR_INTERCEPT_CHOICE_34_2: "עזוב להריס"
STR_INTERCEPT_TITLE_35: "בעיית שחמט"
STR_INTERCEPT_TEXT_35: "אתה נותן להופר עמדה שמשקפת את המצב הקשה שלו: חלק מוגן, מלך חשוף ומהלך שנראה בטוח עד לתשובה. הוא מבין את האזהרה. המילים הבאות שלו מספקות את החיבור שאתה צריך."
STR_INTERCEPT_CHOICE_35_0: "בקשו ממנו להודות בתוכנית"
STR_INTERCEPT_CHOICE_35_1: "שלח את הקבלה להריס"
STR_INTERCEPT_TITLE_36: "ללא מסיכה"
STR_INTERCEPT_TEXT_36: "אתה מדבר על הלחץ במקום להעמיד פנים שהוא מעולם לא היה קיים. הופר עונה בקצרה כאדם ולא כיריב. הפתח הזה יכול לשמש למסחר, או למלכודת."
STR_INTERCEPT_CHOICE_36_0: "בקשו הסדר כנה"
STR_INTERCEPT_CHOICE_36_1: "בקשו ממנו להתוודות"
STR_INTERCEPT_CHOICE_36_2: "קח את החשבון להריס"
STR_INTERCEPT_TITLE_37: "כניסת הופר"
STR_INTERCEPT_TEXT_37: "הופר מסביר מספיק כדי לחבר את הסחיטה לרכיב החסר. האריס יכול כעת לשחזר את הציוד ולבדוק את הסיפור. עליך להחליט אם לסיים את החקירה או לתת להופר להיעלם."
STR_INTERCEPT_CHOICE_37_0: "הביאו להריס את הקבלה"
STR_INTERCEPT_CHOICE_37_1: "תן להופר ללכת ולעזוב"
STR_INTERCEPT_TITLE_38: "המסחר"
STR_INTERCEPT_TEXT_38: "אתה מציב את פיסת המינוף האחרונה שלך בהישג ידו של הופר. מציאה ללא עד או ראיה היא הזמנה עבורו לפתור את בעייתו על חשבונכם."
STR_INTERCEPT_CHOICE_38_0: "מסור את הרכיב"
STR_INTERCEPT_CHOICE_38_1: "דרשו הסכם עדים"
STR_INTERCEPT_CHOICE_38_2: "בטל את ההצעה"
STR_INTERCEPT_TITLE_39: "הריס מאזין"
STR_INTERCEPT_TEXT_39: "ניתן לבדוק את הפרטים. האריס שואל איפה הרכיב עכשיו. ניקוי חשבונך והפעלת המחשב הן בעיות קשורות, אך הן אינן זהות."
STR_INTERCEPT_CHOICE_39_0: "החזר את מה שיש במעיל שלך"
STR_INTERCEPT_CHOICE_39_1: "עזור לשחזר את הרכיב"
STR_INTERCEPT_CHOICE_39_2: "הפסק לענות עכשיו"
STR_INTERCEPT_TITLE_40: "מעבר לגדר"
STR_INTERCEPT_TEXT_40: "הבקתות נעלמות מאחוריך החופש מחוץ לאזור אינו זהה לתמימות, והמכונה היא בעיה דחופה של מישהו אחר עכשיו נמלטת, הסיפור נשאר לא גמור"
STR_INTERCEPT_TITLE_41: "הטעות האחרונה"
STR_INTERCEPT_TEXT_41: "הסיירת מגיעה אליך לפני שהשטח הפתוחה מסתיימת, או שההבטחה של הופר קורסת כשהיא כבר לא מועילה לו. נגמרו לך המהלכים הבטוחים. אפשר לנסות שוב את הסיפור מההתחלה."
STR_INTERCEPT_TITLE_42: "הניירות"
STR_INTERCEPT_TEXT_42: "לוח הזמנים מציב את הופר היכן שהסיפור שלך אמר שהוא היה. לצידו נמצא הפתק ששאב אותך לראשונה למלכודת. השילוב מספיק ספציפי כדי שהאריס יוכל לאמת."
STR_INTERCEPT_CHOICE_42_0: "קח את הניירות להריס"
STR_INTERCEPT_CHOICE_42_1: "המתן והתעמת עם הופר"
STR_INTERCEPT_TITLE_43: "סידור אחרון"
STR_INTERCEPT_TEXT_43: "הופר מציע להחזיר את החלק בחזרה. אמון בו יסיר בעיה אחת מיידית; הפיכת האריס לעד תקשה על יצירת אחר."
STR_INTERCEPT_CHOICE_43_0: "ארגן החזרה של עדים"
STR_INTERCEPT_CHOICE_43_1: "הביאו את האריס לתכנית"
STR_INTERCEPT_TITLE_44: "שחזור הסליל"
STR_INTERCEPT_TEXT_44: "כשהחשבון רשום, החיפוש חוזר לחומרה החסרה. האריס בודק את חדר המכונות בזמן שאתה מזהה היכן הרכיב צריך להיות."
STR_INTERCEPT_CHOICE_44_0: "סיים את ההחזר המאומת"
STR_INTERCEPT_CHOICE_44_1: "קבל אותו מהמעיל שלך"
STR_INTERCEPT_CHOICE_44_2: "הזהיר את האריס מפני הופר"
STR_INTERCEPT_TITLE_45: "השאלה הסופית"
STR_INTERCEPT_TEXT_45: "האריס מחכה. אם אתה יכול לחבר את הופר לגניבה, עדיין יש דרך לשחזר את הרכיב ולסיים את זה כמו שצריך. אחרת החקירה כוללת רק את החשבון המשתנה שלך."
STR_INTERCEPT_CHOICE_45_0: "הצג את הראיות"
STR_INTERCEPT_CHOICE_45_1: "תודו שאין לכם יותר"
