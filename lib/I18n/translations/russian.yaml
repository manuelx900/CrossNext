STR_INTERCEPT_ABOUT: "Сплошная адаптация The Intercept by inkle, 2016, используемая под лицензией MIT. Bletchley Park, 1942: отсутствующий компонент машины, шантаж и интервью, которое может закончиться свободой или опекой.\n\nВаши решения и позиция сохраняются после каждого выбора. Новая история восстанавливает эту игру. Для этого фирменного программного обеспечения были созданы оригинальные иллюстрации. Оригинальный сценарий и лицензия включены в проект."
