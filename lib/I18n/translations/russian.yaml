STR_PET_STORY_TEXT_1: "Дождь стучится в окно, пока вы читаете. Ваш спутник закручивается рядом."
STR_PET_STORY_2: "Посетитель"
STR_PET_STORY_TEXT_2: "Птица приземляется у окна.Ваш спутник тихо смотрит, пока не отлетит.Вы отмечаете свою страницу и улыбаетесь."
STR_PET_STORY_3: "Бумажная лодка"
STR_PET_STORY_TEXT_3: "Осколок бумаги превращается в маленькую лодку.Ваш спутник следует за ней через стол, как будто она провела целое приключение."
STR_PET_STORY_4: "Под звездами"
STR_PET_STORY_TEXT_4: "После чтения вы смотрите вместе, одна звезда появляется, а затем другая."
STR_PET_STORY_5: "Потерянный лист"
STR_PET_STORY_TEXT_5: "Твой спутник приносит тебе лист, который ты держишь рядом со своей книжкой: маленький подарок от обычного дня."
STR_PET_STORY_6: "Тихий уголок"
STR_PET_STORY_TEXT_6: "Ты найдешь уютный уголок и откроешь свою книгу, твой товарищ поселится рядом с тобой, и никто из вас не спешит."
STR_PET_STORY_7: "Новый путь"
STR_PET_STORY_TEXT_7: "Ваш компаньон растягивается и смотрит на вас, готов к завтрашней главе."
STR_PET_GAMES_SHORT: "Игры"
STR_PET_NO_LIVES_TINY: "Никаких предыдущих поколений."
STR_PET_HEALTH_HELP_SHORT: "Чистка бесплатна. исцеление использует одно лекарство. чтение зарабатывает максимум два средства в день."
