STR_INTERCEPT_TITLE_0: "Хаты 14"
STR_INTERCEPT_TEXT_0: "Блетчли Парк, 1942 г. Они держат вас в ожидании за замкнутой дверью. Компонент из вычислительной машины исчез. Утром перехватывают шерсть в кармане пальто."
STR_INTERCEPT_CHOICE_0_0: "Подумайте о обвинении"
STR_INTERCEPT_CHOICE_0_1: "Ждите интервьюера"
STR_INTERCEPT_CHOICE_0_2: "Поиск своего пальто"
STR_INTERCEPT_TITLE_1: "Обвинение"
STR_INTERCEPT_TEXT_1: "Они подозревают предательство. Вы решаете фигуры, перекрестные слова и шахматные позиции для жизни. Эта комната является другой проблемой: противоречите себе, и ваша достоверность может быть первой жертвой."
STR_INTERCEPT_CHOICE_1_0: "Выберите стратегию"
STR_INTERCEPT_CHOICE_1_1: "Слышать то, что они знают"
STR_INTERCEPT_TITLE_2: "Гарри приезжает"
STR_INTERCEPT_TEXT_2: "Харрис входит с чашкой чая и файлом. Из бомбы отсутствует рулон. Ваше имя было на списке обязанностей. Он ставит чашу рядом с вами и спрашивает, где вы были прошлой ночью."
STR_INTERCEPT_CHOICE_2_0: "Пейте чай"
STR_INTERCEPT_CHOICE_2_1: "Оставьте чай нетронутым"
STR_INTERCEPT_CHOICE_2_2: "Ответить спокойно"
STR_INTERCEPT_TITLE_3: "Компонент"
STR_INTERCEPT_TEXT_3: "Внутри покрытия вашего пальца ваши пальцы встречают холодный металл. Компонент все еще там. Хопер сказал, что принятие его приведет к прекращению шантажа."
STR_INTERCEPT_CHOICE_3_0: "Держите его скрытым"
STR_INTERCEPT_CHOICE_3_1: "Дайте это Харрису"
STR_INTERCEPT_TITLE_4: "Победительская игра"
STR_INTERCEPT_TEXT_4: "Сотрудничество может сохранить вашу достоверность. Убеждающая ложь может купить время. Бегство будет обменять замкнутую комнату для охранников снаружи."
STR_INTERCEPT_CHOICE_4_0: "Сотрудничать"
STR_INTERCEPT_CHOICE_4_1: "Создать алиби"
STR_INTERCEPT_CHOICE_4_2: "Исследуйте окно"
STR_INTERCEPT_TITLE_5: "Чай"
STR_INTERCEPT_TEXT_5: "Гаррис замечает ваше молчание, но его лицо уже отступает.Когда вы в следующий раз открываете глаза, у стола стоит еще одна пара обуви."
STR_INTERCEPT_CHOICE_5_0: "Делайте вид, что вы спите"
STR_INTERCEPT_CHOICE_5_1: "Сравнить с посетителем"
STR_INTERCEPT_CHOICE_5_2: "Запросить воду"
STR_INTERCEPT_TITLE_6: "Маленький отказ"
STR_INTERCEPT_TEXT_6: "Вы отталкиваете чашу.Харис внимательнее смотрит на движение, чем на ответ."
STR_INTERCEPT_CHOICE_6_0: "Спросите, какие доказательства у него есть"
STR_INTERCEPT_CHOICE_6_1: "Упомянуть Хупера"
STR_INTERCEPT_CHOICE_6_2: "Смотрите в окно"
STR_INTERCEPT_TITLE_7: "Пропавшая реальность"
STR_INTERCEPT_TEXT_7: "Харрис хочет прямого ответа.Вы взяли компонент? Вы можете сказать ему, что находится в вашем пальто, объяснить давление Гупера, или попытаться указать обвинение в другом месте."
STR_INTERCEPT_CHOICE_7_0: "Дайте ему компонент"
STR_INTERCEPT_CHOICE_7_1: "Объяснить шантаж"
STR_INTERCEPT_CHOICE_7_2: "Обвинение Хоппер"
STR_INTERCEPT_TITLE_8: "Металл на столе"
STR_INTERCEPT_TEXT_8: "Харрис проверяет его без расслабления. Возвращение украденного оборудования не объясняет, почему он был взят."
STR_INTERCEPT_CHOICE_8_0: "Предлагаем найти доказательства"
STR_INTERCEPT_CHOICE_8_1: "Оставайтесь и отвечайте на вопросы"
STR_INTERCEPT_TITLE_9: "«Алиби"
STR_INTERCEPT_TEXT_9: "Вы описываете тихий вечер у вашего стола.Харис открывает файл. Страж увидел вас, покидая машинную комнату."
STR_INTERCEPT_CHOICE_9_0: "Защитите историю"
STR_INTERCEPT_CHOICE_9_1: "Признать шантаж"
STR_INTERCEPT_CHOICE_9_2: "Отказаться от дополнительных вопросов"
STR_INTERCEPT_TITLE_10: "окна"
STR_INTERCEPT_TEXT_10: "Окно высокое, а стекло толстое.После него проходит дорога через другую хижину.Разрыв будет громким; ожидание здесь имеет свои опасности."
STR_INTERCEPT_CHOICE_10_0: "Разорвать стекло"
STR_INTERCEPT_CHOICE_10_1: "Изучайте дорогу снаружи"
STR_INTERCEPT_CHOICE_10_2: "Вернуться к интервью"
STR_INTERCEPT_TITLE_11: "Еще один посетитель"
STR_INTERCEPT_TEXT_11: "Хупер пришел, пока вы не стабильны.Он хочет узнать, есть ли у Харриса компонент.Он держит одну руку возле двери."
STR_INTERCEPT_CHOICE_11_0: "Делайте вид, что спите"
STR_INTERCEPT_CHOICE_11_1: "Требует объяснения"
STR_INTERCEPT_CHOICE_11_2: "Запросить воду"
STR_INTERCEPT_TITLE_12: "Один предостережение"
STR_INTERCEPT_TEXT_12: "Вы звоните Харрису, прежде чем чай задержится.Он возвращается, раздраженный.Обвинение о чашке потребует чего-то, что он может проверить."
STR_INTERCEPT_CHOICE_12_0: "Держите чашу в качестве доказательства"
STR_INTERCEPT_CHOICE_12_1: "Обвинить Харриса в отравлении тебя"
STR_INTERCEPT_CHOICE_12_2: "Сосредоточьтесь на реальном"
STR_INTERCEPT_TITLE_13: "Хопер"
STR_INTERCEPT_TEXT_13: "Харрис признает имя.Хупер полезен, хорошо связан и не отсутствует ни в прошлой ночи."
STR_INTERCEPT_CHOICE_13_0: "Найти что-то проверенное"
STR_INTERCEPT_CHOICE_13_1: "Настоятельно настаивать Hooper украл его"
STR_INTERCEPT_TITLE_14: "Блэкмайл"
STR_INTERCEPT_TEXT_14: "Вы описываете молодого человека, доверие, которое было предано, и требование, которое последовало за ним.Харис слушает вас без помощи.Назовите человека, который установил ловушку, также может раскрыть человека, которого вы надеялись защитить."
STR_INTERCEPT_CHOICE_14_0: "Дайте Харрису полный счет"
STR_INTERCEPT_CHOICE_14_1: "Оставьте имена"
STR_INTERCEPT_CHOICE_14_2: "Предложите способ поймать Хупера"
STR_INTERCEPT_TITLE_15: "Легкое обвинение"
STR_INTERCEPT_TEXT_15: "Хопер, вы говорите, должен быть ответственным.Харис спрашивает, как вы знаете.Есть разница между решением проблемы и выпуском свидетеля, который может доказать ответ."
STR_INTERCEPT_CHOICE_15_0: "Пусть Харрис оспаривает претензии"
STR_INTERCEPT_CHOICE_15_1: "Попробуйте отправить частное сообщение для Hooper"
STR_INTERCEPT_TITLE_16: "Тестируемый ключ"
STR_INTERCEPT_TEXT_16: "История может быть опровергнута. Документ, свидетель или отсутствующий компонент сложнее объяснить."
STR_INTERCEPT_CHOICE_16_0: "Проверьте ближайшую хижину"
STR_INTERCEPT_CHOICE_16_1: "Используйте утренний перехват"
STR_INTERCEPT_CHOICE_16_2: "Вопрос Губернатор напрямую"
STR_INTERCEPT_TITLE_17: "Больше, чем возвращение"
STR_INTERCEPT_TEXT_17: "Машина может снова работать, но у Харриса все еще есть нарушение безопасности, которое он должен объяснить."
STR_INTERCEPT_CHOICE_17_0: "Показать доказательства"
STR_INTERCEPT_CHOICE_17_1: "Ищите доказательства"
STR_INTERCEPT_CHOICE_17_2: "Примите его приговор"
STR_INTERCEPT_TITLE_18: "Противоречия"
STR_INTERCEPT_TEXT_18: "Харрис ставит ваш первый ответ рядом с вашим последним.Они не могут быть правдой.Вы можете отказаться от лжи, или позволить интервью закончиться на противоречии."
STR_INTERCEPT_CHOICE_18_0: "Расскажите правду о шантаже"
STR_INTERCEPT_CHOICE_18_1: "Продолжайте все отрицать"
STR_INTERCEPT_CHOICE_18_2: "Попробуйте уйти"
STR_INTERCEPT_TITLE_19: "Тишина"
STR_INTERCEPT_TEXT_19: "Харрис закрывает файл.В этой комнате молчание не заканчивает расследование; оно только заканчивает вашу роль в его руководстве."
STR_INTERCEPT_CHOICE_19_0: "Слышать решение"
STR_INTERCEPT_TITLE_20: "Разбитое стекло"
STR_INTERCEPT_TEXT_20: "Холодный воздух и звук свистка охранника приходят вместе.Есть время для одного решения, прежде чем кто-то достигнет двери."
STR_INTERCEPT_CHOICE_20_0: "Бег на внешний путь"
STR_INTERCEPT_CHOICE_20_1: "Оставьте кодированный ключ"
STR_INTERCEPT_CHOICE_20_2: "Оставайтесь и объясните"
STR_INTERCEPT_TITLE_21: "Между каютами"
STR_INTERCEPT_TEXT_21: "Хоперская хижина достаточно близко, чтобы добраться до следующего патруля, но открытая почва за ней предлагает другой вид шансов."
STR_INTERCEPT_CHOICE_21_0: "Постарайтесь избежать оснований"
STR_INTERCEPT_CHOICE_21_1: "Вход в хижину Гупера"
STR_INTERCEPT_CHOICE_21_2: "Вернуться к Harris"
STR_INTERCEPT_TITLE_22: "Частная игра"
STR_INTERCEPT_TEXT_22: "Хопер изучает вас.На столе он устанавливает воображаемую шахматную позицию своими пальцами. Кодированный ответ может заставить его раскрыть то, что прямое обвинение никогда не сделает."
STR_INTERCEPT_CHOICE_22_0: "Ответ с шахматным ключом"
STR_INTERCEPT_CHOICE_22_1: "Угрожают назвать его"
STR_INTERCEPT_CHOICE_22_2: "Говорите честно"
STR_INTERCEPT_TITLE_23: "Лицом к лицу"
STR_INTERCEPT_TEXT_23: "Хопер спрашивает, что вы действительно можете доказать.Его уверенность ослабевает только тогда, когда вы упомянете детали, которые кто-то вне его плана не должен знать."
STR_INTERCEPT_CHOICE_23_0: "Сравнить его с доказательством"
STR_INTERCEPT_CHOICE_23_1: "Предложите компонент как торговлю"
STR_INTERCEPT_CHOICE_23_2: "блеф"
STR_INTERCEPT_TITLE_24: "Кубок"
STR_INTERCEPT_TEXT_24: "Хупер приносит воду, но сначала тянется за чашкой чая. Держать эту чашку может быть более полезным, чем принимать что-либо другое, что он предлагает."
STR_INTERCEPT_CHOICE_24_0: "Держите чашу"
STR_INTERCEPT_CHOICE_24_1: "Проверяйте платье еще раз"
STR_INTERCEPT_TITLE_25: "Что-то для тестирования"
STR_INTERCEPT_TEXT_25: "Вы держите чашу и просите Харриса, чтобы она была осмотрена.Это, наконец, обвинение с объектом, прикрепленным к ней.Попытка Гупера удалить ее обеспечивает вторую полезную деталь."
STR_INTERCEPT_CHOICE_25_0: "Дайте Харрису Кубок"
STR_INTERCEPT_CHOICE_25_1: "Конфронтация с Hooper"
STR_INTERCEPT_TITLE_26: "Неправильная цель"
STR_INTERCEPT_TEXT_26: "Вы обвиняете Харриса без доказательств. он видит подозреваемого, пытающегося дискредитировать следователя. Что бы ни случилось с чаем, вы затруднили ему поверить вам."
STR_INTERCEPT_CHOICE_26_0: "Интервью заканчивается"
STR_INTERCEPT_TITLE_27: "Весь счет"
STR_INTERCEPT_TEXT_27: "Вы указываете имена и описываете встречу.Харис задает точные вопросы.Ваша стыдливость реальна, но так же и детали он теперь может проверить."
STR_INTERCEPT_CHOICE_27_0: "Пусть он проверит счет"
STR_INTERCEPT_CHOICE_27_1: "Поиск предложений для Hooper"
STR_INTERCEPT_TITLE_28: "Неудачный обман"
STR_INTERCEPT_TEXT_28: "Харрис слышал достаточно уверенных ответов.Хупер тоже имеет.Ни один из них не предоставляет факт, что ваша история отсутствует."
STR_INTERCEPT_CHOICE_28_0: "Продолжайте в претензии"
STR_INTERCEPT_CHOICE_28_1: "Сделайте отчаянный побег"
STR_INTERCEPT_CHOICE_28_2: "Признать то, что на самом деле произошло"
STR_INTERCEPT_TITLE_29: "Прохождение"
STR_INTERCEPT_TEXT_29: "Лист в вашем кармане несет больше, чем скользкие буквы: его маршрут через хижины ставит Хупера рядом с машиной."
STR_INTERCEPT_CHOICE_29_0: "Закодировать сообщение для Хупера"
STR_INTERCEPT_CHOICE_29_1: "Показать маршрут в Харрис"
STR_INTERCEPT_TITLE_30: "Машина бежит"
STR_INTERCEPT_TEXT_30: "У Харриса есть компонент, и путь, который ведет за пределы ваших первых испуганных ответов. The Bombe возобновляет свою работу. Вы оставляете Hut 14 под своим собственным именем, с меньшим количеством секретов и будущим, которое еще предстоит ответить."
STR_INTERCEPT_TITLE_31: "Под подозрением"
STR_INTERCEPT_TEXT_31: "Возврат компонента спас машину от задержки. Это не сохранило вашу позицию. Харрис прекращает ваш доступ к хатам, пока расследование продолжается. Вы пережили интервью, но не удалили свое имя."
STR_INTERCEPT_TITLE_32: "На попечении"
STR_INTERCEPT_TEXT_32: "Противоречия, отсутствие доказательств и украденный компонент стали случаем, который вы больше не можете направить."
STR_INTERCEPT_TITLE_33: "Внешний путь"
STR_INTERCEPT_TEXT_33: "Вы оставляете за собой хижины.Темнота полезна, но на земле наблюдают.Сломленные окна приблизили патрули ближе, чем вы надеялись."
STR_INTERCEPT_CHOICE_33_0: "Пересечь открытую землю"
STR_INTERCEPT_CHOICE_33_1: "Продолжайте путь обслуживания"
STR_INTERCEPT_CHOICE_33_2: "Обратитесь назад и обратитесь к Харрису"
STR_INTERCEPT_TITLE_34: "Хопперская хижина"
STR_INTERCEPT_TEXT_34: "Стол находится без присмотра. Документы лежат под крестовым словом, а машинная комната появляется в графике с карандашом."
STR_INTERCEPT_CHOICE_34_0: "Проверьте документы"
STR_INTERCEPT_CHOICE_34_1: "Подождите Хоппер"
STR_INTERCEPT_CHOICE_34_2: "Уйти от Харриса"
STR_INTERCEPT_TITLE_35: "Шахматная проблема"
STR_INTERCEPT_TEXT_35: "Вы даете Хуперу позицию, которая отражает его положение: защищенный кусок, раскрытый король и шаг, который выглядит безопасным до ответа."
STR_INTERCEPT_CHOICE_35_0: "Попросите его признать план"
STR_INTERCEPT_CHOICE_35_1: "Отправить заявку на Харриса"
STR_INTERCEPT_TITLE_36: "Без маски"
STR_INTERCEPT_TEXT_36: "Вы говорите о давлении вместо того, чтобы притворяться, что оно никогда не существовало.Хупер кратко отвечает как человек, а не как противник."
STR_INTERCEPT_CHOICE_36_0: "Запросите честное соглашение"
STR_INTERCEPT_CHOICE_36_1: "Попросите его исповедовать"
STR_INTERCEPT_CHOICE_36_2: "Ответить на счет Харриса"
STR_INTERCEPT_TITLE_37: "Признание Хопера"
STR_INTERCEPT_TEXT_37: "Хопер объясняет достаточно, чтобы подключить шантаж к отсутствующему компоненту.Харис теперь может восстановить оборудование и проверить историю."
STR_INTERCEPT_CHOICE_37_0: "Принесите Харрису признание"
STR_INTERCEPT_CHOICE_37_1: "Пусть Гупер уходит и уходит"
STR_INTERCEPT_TITLE_38: "Торговля"
STR_INTERCEPT_TEXT_38: "Вы размещаете свой последний рычаг в пределах доступа Гупера.Сделка без свидетеля или доказательств является приглашением для него решить свою проблему за ваш счет."
STR_INTERCEPT_CHOICE_38_0: "Рука над компонентом"
STR_INTERCEPT_CHOICE_38_1: "Требуется свидетельское соглашение"
STR_INTERCEPT_CHOICE_38_2: "Отменить предложение"
STR_INTERCEPT_TITLE_39: "Гаррис Слух"
STR_INTERCEPT_TEXT_39: "Детали могут быть проверены.Харис спрашивает, где сейчас находится компонент.Очистка вашего аккаунта и запуск машины являются связанными проблемами, но они не одно и то же."
STR_INTERCEPT_CHOICE_39_0: "Верните то, что есть в вашем пальто"
STR_INTERCEPT_CHOICE_39_1: "Помощь в восстановлении компонента"
STR_INTERCEPT_CHOICE_39_2: "Перестаньте отвечать сейчас"
STR_INTERCEPT_TITLE_40: "За пределами ограждения"
STR_INTERCEPT_TEXT_40: "Свобода за пределами земли не то же самое, что невиновность, а машина - это уже чья-то неотложная проблема."
STR_INTERCEPT_TITLE_41: "Последняя ошибка"
STR_INTERCEPT_TEXT_41: "Патруль доходит до вас, прежде чем открытая земля закончится, или обещание Хупера рухнет, когда оно больше не будет полезным для него."
STR_INTERCEPT_TITLE_42: "Бумаги"
STR_INTERCEPT_TEXT_42: "График помещает Гупера там, где ваша история сказала, что он был. Помимо этого есть нота, которая впервые привлекла вас в ловушку."
STR_INTERCEPT_CHOICE_42_0: "Отправить документы для Харриса"
STR_INTERCEPT_CHOICE_42_1: "Ждите и сражайтесь с Хопером"
STR_INTERCEPT_TITLE_43: "Одно последнее соглашение"
STR_INTERCEPT_TEXT_43: "Доверяя ему, он устранит одну непосредственную проблему; сделав Харриса свидетелем, было бы сложнее создать другую."
STR_INTERCEPT_CHOICE_43_0: "Устройте свидетельское возвращение"
STR_INTERCEPT_CHOICE_43_1: "Приведите Харриса в план"
STR_INTERCEPT_TITLE_44: "Восстановление реального"
STR_INTERCEPT_TEXT_44: "С учетной записью поиск возвращается к отсутствующему оборудованию.Харис проверяет машинную комнату, пока вы определяете, где должен находиться компонент."
STR_INTERCEPT_CHOICE_44_0: "Завершить проверенный возврат"
STR_INTERCEPT_CHOICE_44_1: "Восстановите его из пальто"
STR_INTERCEPT_CHOICE_44_2: "Предупредить Харриса о Хопере"
STR_INTERCEPT_TITLE_45: "Окончательный вопрос"
STR_INTERCEPT_TEXT_45: "Если вы можете подключить Hooper к краже, все еще есть способ восстановить компонент и закончить это правильно."
STR_INTERCEPT_CHOICE_45_0: "Представьте доказательства"
STR_INTERCEPT_CHOICE_45_1: "Признайте, что у вас нет ничего больше"
