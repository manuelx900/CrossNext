STR_QUEST_CAM_DECOR_NAME_0: "Лесная Фея"
STR_QUEST_CAM_DECOR_TEXT_0: "Вы освободили фею от безмолвных корней. Она принесет маленькое чудо в ваш дом."
STR_QUEST_CAM_SOLO_DECOR_NAME_1: "Лесной фонарь"
STR_QUEST_CAM_SOLO_DECOR_TEXT_1: "Фонарь для освещения уголка для чтения."
STR_QUEST_CAM_DECOR_NAME_2: "Эхо-оболочка"
STR_QUEST_CAM_DECOR_TEXT_2: "Спасенный моряк дарит вам раковину, в которой до сих пор хранится песня моря."
STR_QUEST_CAM_DECOR_NAME_3: "Чернильный дух"
STR_QUEST_CAM_DECOR_TEXT_3: "Дух сбежал с пустой страницы. Он решает путешествовать с вами."
STR_QUEST_CAM_DECOR_NAME_4: "Лунный цветок"
STR_QUEST_CAM_DECOR_TEXT_4: "Садовники спасли одно семечко из спящего сада. Этот цветок вырос для тебя."
STR_QUEST_CAM_DECOR_NAME_5: "Зимний кристалл"
STR_QUEST_CAM_DECOR_TEXT_5: "Оттепель открывает кристалл, хранящий последнее воспоминание о горе."
STR_QUEST_CAM_DECOR_NAME_6: "Заводная сова"
STR_QUEST_CAM_DECOR_TEXT_6: "Часовщик ремонтирует этого маленького стража, чтобы поблагодарить вас за то, что вы вернули время назад."
STR_QUEST_CAM_DECOR_NAME_7: "Перо Феникса"
STR_QUEST_CAM_DECOR_TEXT_7: "Из восстановленного пепла поднимается перо: обещание того, что истории могут начаться снова."
STR_QUEST_CAM_DECOR_NAME_8: "Лампа пустыни"
STR_QUEST_CAM_DECOR_TEXT_8: "Рассказчик дает вам лампу, которая поддерживала легенды пустыни."
STR_QUEST_CAM_DECOR_NAME_9: "Облачный кои"
STR_QUEST_CAM_DECOR_TEXT_9: "Вы открываете облачную клетку. Маленький кои остается охранять ваши мечты."
STR_QUEST_CAM_DECOR_NAME_10: "Сердце Дракона"
STR_QUEST_CAM_DECOR_TEXT_10: "Драконы доверяют вам кристалл, рожденный из их восстановленной памяти."
STR_QUEST_CAM_DECOR_NAME_11: "Звезда Памяти"
STR_QUEST_CAM_DECOR_TEXT_11: "Первая восстановленная звезда освещает вам путь к последним страницам."
STR_QUEST_CAM_DECOR_NAME_12: "Читающий Росток"
STR_QUEST_CAM_DECOR_TEXT_12: "Небольшое растение для тихого уголка для чтения."
STR_QUEST_CAM_DECOR_NAME_13: "Сохраненные книги"
STR_QUEST_CAM_DECOR_TEXT_13: "Истории ждут своего следующего читателя."
STR_QUEST_CAM_DECOR_NAME_14: "Знамя Путешественника"
STR_QUEST_CAM_DECOR_TEXT_14: "Вымпел, который помнит каждое новое начало."
STR_QUEST_CAM_DECOR_NAME_15: "Лунные грибы"
STR_QUEST_CAM_DECOR_TEXT_15: "Маленький кусочек леса для вашего дома."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Начало приключений"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Многие годы люди жили мирно и наслаждались книгами. Тогда Король Обливиона начал их уничтожать. Он хотел запретить всем читать и заставить все истории исчезнуть навсегда."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Монстры короля"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Король Обливиона разослал своих монстров по всему миру. Они уничтожали все найденные книги и нападали на всех, кто пытался их остановить. Библиотеки начали исчезать, и люди перестали читать."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Сила чтения"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Однажды, когда вы читаете возле своей деревни, появляется монстр. Вы пытаетесь уйти, но происходит нечто удивительное: чем больше вы читаете, тем слабее он становится. Вы понимаете, что чтение — единственный способ бороться с королевской магией."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Ваша миссия"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Вы намеревались остановить короля. На пути к его замку вам придется пересечь леса, города, горы и другие места, полные врагов. Каждый монстр, которого вы побеждаете, приближает вас немного ближе. Продолжайте читать, победите его стражей и доберитесь до него, прежде чем он уничтожит все книги в мире."
