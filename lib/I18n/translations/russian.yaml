STR_CAR_HELP_TEXT: "КАК РАЗРЕШИТЬ ДЕЛО\nКаждый персонаж делает одно утверждение. В верхней части экрана показано точное число виновных и ложных утверждений. Найдите комбинацию, которая удовлетворяет обоим подсчетам. Каждый случай имеет одно решение.\n  \nВина — это не честность\nНевинный персонаж может лгать, а виновный может говорить правду. Две лжи означают, что точно два целых утверждения являются ложными; остальные являются правдивыми. Знаки истины / лжи относятся к заявлению; Подозреваемый относится к вине.\n  \nЧтение следов\n\"A или B сделали это (или оба)\" означает, что по крайней мере один из названных персонажей виновен. \"A и B сделали это\" требует обоих. Ложь отрицает все утверждение: ложно ИЛИ означает, что ни один из них не сделал этого; ложно И означает, что по крайней мере один из них не сделал этого.\n  \n\"Оба правдивы или оба лгут\" сравнивает утверждения, а не вину. \"Точно одно лжет\" означает, что их утверждения имеют разные значения истины. Эти указания сами по себе могут быть истинными или ложными.\n  \nСоседи на маленьком экране\nОригинальный круговой порядок Пантера, павлин, акула, лисица, медведь, олень, лошадь, используя только символы этого случая. Последний и первый являются соседями. Это приложение пишет два имени непосредственно в каждом соседнем подсказке. Вы никогда не должны угадывать, какие карты находятся рядом с портретом. Изменение страницы или ориентации не меняет подсказку.\n  \nРост и диета\nКаждая карта показывает вымышленный рост и рацион питания. \"Виновник выше меня\" означает, что по крайней мере один виновник выше говорящего, но не обязательно все виновники. Более короткая работает так же. Пищевики и травоядные подсказки означают, что по крайней мере один виновник имеет такую диету; всеядные считаются как ни то, ни другое. Имена, рост и рацион питания являются достоверными фактами; заявления могут лгать.\n  \nВаш анализ\nИспользуйте ? / Правда / Ложь и Подозреваемый под каждым утверждением, чтобы записать гипотезы. Это ваши заметки, а не доказательства или автоматические проверки. Стрелки показывают другие символы. Портретный режим отображает до трех на странице.\n  \nОбвинение\nНажмите Обвинение и выберите точно требуемое количество виновников. Только подтверждение неправильного обвинения тратит жизнь. Начинающий и Нормальный имеют две жизни; Продвинутый и Эксперт имеют одну жизнь. Правильное обвинение решает дело. Когда не осталось жизней, решение раскрывается.\n  \nКампания и повтор\nЕсть 1470 дел. Открытое дело возобновляет текущую попытку или открывает следующее после закрытого. Кампания позволяет вам выбрать любое из 1470 дел в любом порядке с самого начала. Повторная игра начинает новую попытку, сохраняя предыдущее завершение. В рамках каждой сложности дела продвигаются от одного виновника до двух, затем от меньшего количества лжецов к большему в каждой группе виновников. Начинающий держит одного виновника. Меньшие броски приходят первыми, когда числа совпадают. Все дела остаются доступными. Решение ранее исчерпанного дела повышает его до разрешенного.\n  \nПрогресс и жизни сохраняются на SD-карте. Уход, спящий режим или перезапуск устройства не восстанавливает жизни в текущей попытке. Неудачное сохранение блокирует результат до тех пор, пока повторная попытка не удастся. Сбросить все просит подтвердить, прежде чем удалить только прогресс Хищника."
