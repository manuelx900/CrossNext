STR_QUEST_CAM_JOURNEY2_BOOK_11: "Последняя страница"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Победив Короля Обливиона, вы возвращаетесь домой. Его армия больше не может уничтожать книги, и люди снова спокойно читают. Вы сохранили истории мира. Нам еще предстоит открыть для себя много книг."
