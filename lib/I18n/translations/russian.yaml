STR_FLASHCARDS_WHERE: "Файлы: /FLASHCARDS - Помощь"
STR_FLASHCARDS_HELP: "Скопируйте колоды Anki (.apkg /.colpkg, .anki2 /.anki21), CSV /TSV/text или конвертируйте папки Study в /FLASHCARDS.. Используйте подпапки: до 128 элементов в каждой.\n\nИмпорт принимает базовые, перевернутые и простые текстовые карточки. Аудио и пользовательский HTML не поддерживаются. Сначала конвертируйте образы колод /CJK. Офлайн-обзоры используют FSRS. Импорт запускает новое расписание и сохраняет оригиналы."
