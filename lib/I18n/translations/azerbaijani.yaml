STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Macəranın başlanğıcı"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Uzun illər insanlar sülh şəraitində yaşayıb, kitablarından həzz alırdılar. Sonra Unudulmanın Kralı onları məhv etməyə başladı. O, hər kəsin oxumasını dayandırmaq və bütün hekayələri əbədi olaraq yox etmək istəyirdi."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Padşahın canavarları"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Unudulmanın Kralı canavarlarını bütün dünyaya göndərdi. Tapdıqları hər kitabı məhv etdi və onlara mane olmağa çalışan hər kəsə hücum etdi. Kitabxanalar yoxa çıxmağa başladı, insanlar kitab oxumağı dayandırdılar."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Oxumaq gücü"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Bir gün kəndinizin yaxınlığında kitab oxuyanda bir canavar peyda olur. Qaçmağa çalışırsan, amma təəccüblü bir şey olur: nə qədər çox oxusan, bir o qədər zəifləyir. Sən başa düşürsən ki, padşahın sehri ilə mübarizə aparmağın yeganə yolu oxumaqdır."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Sizin missiyanız"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Padşahı dayandırmaq üçün yola çıxdın. Onun qalasına gedən yolda meşələri, şəhərləri, dağları və düşmənlərlə dolu digər yerləri keçməlisən. Məğlub etdiyiniz hər bir canavar sizi bir az da yaxınlaşdırır. Oxumağa davam edin, onun qəyyumlarını məğlub edin və o, dünyadakı hər kitabı məhv etməzdən əvvəl ona çatın."
