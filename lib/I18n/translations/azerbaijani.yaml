STR_CAR_GUIDE_HEIGHT: "Boy və pəhriz"
STR_CAR_GUIDE_HEIGHT_COPY: "Xarakterin boyu və pəhrizi etibarlıdır. “Günahkar məndən uzundur” günahkarı danışanla müqayisə edir. Omnivorlar ətyeyən və ya ot yeyənlər sayılmır."
STR_CAR_GUIDE_MARKS: "Qeydləriniz"
STR_CAR_GUIDE_MARKS_COPY: "Hər bəyanatı oxuyun. Fikirlərinizi qeyd etmək üçün Həqiqət, Yalan və Şübhəli istifadə edin. Bunlar sizin qeydlərinizdir: oyun hələ onları yoxlamır."
