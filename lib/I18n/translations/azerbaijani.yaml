STR_CAR_INTRO: "Günah və dürüstlük müstəqildir. Hər bir işin tam olaraq bir həlli var. Boylar uydurma xarakter xüsusiyyətləridir."
STR_CAR_HELP_TEXT: "CİNAYƏTİ NECƏ AÇMALI\n Hər personaj bir ifadə verir. Ekranın yuxarı hissəsi günahkarların və yalançı ifadələrin tam sayını göstərir. Hər iki hesablamanı yerinə yetirən bir kombinasiya tapın. Hər halda bir həll yolu var. \n \n GÜNAHKAR HƏQİQƏTÇİ DEYİL \n Bir günahsız personaj yalan deyə bilər, günahkar isə həqiqəti deyə bilər. İki ifadə tamamilə yalandır; digərləri doğrudur. Həqiqət / Yalan işarələri ifadəyə aiddir; Şübhəli günahkardır. \n \n İŞARƏLƏRİ OXUYUR \n \"A və ya B bunu etdi (və ya hər ikisi)\" hər hansı bir personajın günahkar olmasına işarə edir. \"A və B bunu etdi\" hər ikisini tələb edir. Yalan bütün ifadəni inkar edir: yanlış ya da heç birinin günahkar olmaması deməkdir; yanlış və ən azı birinin günahkar olmaması deməkdir. \n \n \n \"Hər ikisi də həqiqəti deyir və ya hər ikisi yalan danışır\" ifadələri müqayisə edir, günahı göstərmir. \"Həqiqətən biri yalan danışır\" ifadələri onların müxtəlif həqiqət dəyərlərinə malikdir. Bu ipuçları öz-özünə doğru və ya yanlış ola bilər. \n \n \n \n \n SİZİN ANALİZ \n \n 1,470 halı var. Açıq halı açmaq üçün təkcə səhv ittihamı təsdiqləmək kifayətdir. Hər çətinlik səviyyəsində hallar bir günahkardan iki günahkara, sonra isə hər günahkar qrupunda daha az yalançıdan daha çox yalançıya qədər inkişaf edir. Başlayanlar və Normallar iki həyata malikdirlər; Peşəkarlar və Ekspertlər bir həyata malikdirlər. Əgər hesablama uyğun gəlmirsə, bütün hallar bərpa olunur. \n \n \n SİZİN ANALİZ \n CAMPAIGN AND REPLAY \n Accuse düyməsini basın və lazım olan hallar arasından istədiyinizi seçin. Yalnız səhv ittihamı təsdiqlədikdən sonra yeni bir sınaq başlayır. \n \n Progress and lives are saved on the SD card. Leaving, sleeping or a device restarting does not restore lives in the current attempt. Failed save blocks the result until Retry succeeds. Reset all asks for confirmation before erasing only Carnivore progress. Every case has one solution. \n Hər personaj bir ifadə verir. Ekranın yuxarı hissəsi günahkarların və yalançı ifadələrin tam sayını göstərir. Hər halda bir həll yolu var. \n \n GUILT IS NOT HONESTY"
