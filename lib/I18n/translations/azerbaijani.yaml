STR_CAR_GUIDE_OR: "A və ya B bunu etdi"
STR_CAR_GUIDE_OR_COPY: "“Ana və ya Bruno bunu etdi” ən azı birinin günahkar olması deməkdir. Əgər danışan yalan danışırsa, heç biri bunu etməyib."
STR_CAR_GUIDE_AND: "A və B bunu etdi"
STR_CAR_GUIDE_AND_COPY: "“Ana və Bruno bunu etdi” hər ikisinin günahkar olduğunu deyir. Yalandırsa, heç olmasa biri günahsızdır."
STR_CAR_GUIDE_COMPARE: "Səmimiyyət"
STR_CAR_GUIDE_COMPARE_COPY: "“Hər ikisi doğru deyir və ya hər ikisi yalan” ifadəsi onların günahlarını deyil, ifadələrini müqayisə edir. Hər iki ifadənin doğru olub olmadığını yoxlayın və ya hər ikisinin yalan olduğunu yoxlayın."
STR_CAR_GUIDE_NEIGHBOURS: "Qonşular"
