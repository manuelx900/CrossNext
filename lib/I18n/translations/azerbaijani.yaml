STR_INTERCEPT_TITLE_0: "HUT 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. Onlar sizi bağlı qapı arxasında gözləyirlər. Hesablama maşınının komponenti itdi. Səhər palto cibinizdə xışıltıları kəsir. Çöldə ayaq səsləri dayanır."
STR_INTERCEPT_CHOICE_0_0: "İttihamı düşünün"
STR_INTERCEPT_CHOICE_0_1: "Müsahibini gözləyin"
STR_INTERCEPT_CHOICE_0_2: "Paltonunuzu axtarın"
STR_INTERCEPT_TITLE_1: "İttiham"
STR_INTERCEPT_TEXT_1: "Xəyanətdən şübhələnirlər. Yaşamaq üçün fiqurlar, krossvordlar və şahmat mövqelərini həll edirsiniz. Bu otaq başqa bir problemdir: özünüzə zidd olun və etibarlılığınız ilk qurban ola bilər."
STR_INTERCEPT_CHOICE_1_0: "Strategiya seçin"
STR_INTERCEPT_CHOICE_1_1: "Onların bildiklərini eşidin"
STR_INTERCEPT_TITLE_2: "HARRIS GƏLİR"
STR_INTERCEPT_TEXT_2: "Harris çay fincanı və faylı ilə içəri daxil olur. Bombadan bir çarx yoxdur. Sənin adın vəzifə siyahısında idi. Kuboku sənin yanına qoyur və dünən gecə harada olduğunu soruşur."
STR_INTERCEPT_CHOICE_2_0: "Çayı iç"
STR_INTERCEPT_CHOICE_2_1: "Çaya toxunmadan buraxın"
STR_INTERCEPT_CHOICE_2_2: "Sakit cavab verin"
STR_INTERCEPT_TITLE_3: "KOMPONENT"
STR_INTERCEPT_TEXT_3: "Paltonun astarının içərisində barmaqlarınız soyuq metalla birləşir. Komponent hələ də oradadır. Hooper, bunun şantajı dayandıracağını söylədi. İndi kilidli qapının başqa mənası var."
STR_INTERCEPT_CHOICE_3_0: "Gizli saxlayın"
STR_INTERCEPT_CHOICE_3_1: "Onu Harrisə verin"
STR_INTERCEPT_TITLE_4: "ULDAN OYNA"
STR_INTERCEPT_TEXT_4: "Əməkdaşlıq sizin etibarınızı qoruya bilər. İnandırıcı bir yalan vaxt qazana bilər. Escape çöldəki mühafizəçilər üçün kilidli bir otaq alacaqdı. Bu hərəkətlərin heç biri geri alına bilməz."
STR_INTERCEPT_CHOICE_4_0: "Əməkdaşlıq"
STR_INTERCEPT_CHOICE_4_1: "Alibi icad edin"
STR_INTERCEPT_CHOICE_4_2: "Pəncərəni yoxlayın"
STR_INTERCEPT_TITLE_5: "ÇAY"
STR_INTERCEPT_TEXT_5: "Otaq əyilir. Harris sizin susmağınızı hiss edir, lakin onun sifəti artıq geri çəkilir. Növbəti dəfə gözlərinizi açdığınız zaman stolun yanında başqa bir cüt ayaqqabı dayanır."
STR_INTERCEPT_CHOICE_5_0: "Yuxuda qalmış kimi davranın"
STR_INTERCEPT_CHOICE_5_1: "Ziyarətçi ilə qarşılaşın"
STR_INTERCEPT_CHOICE_5_2: "Su isteyin"
STR_INTERCEPT_TITLE_6: "KİÇİK İMTİNA"
STR_INTERCEPT_TEXT_6: "Siz fincanı itələyirsiniz. Harris cavabdan daha çox hərəkəti izləyir. O, sorğu-sual etməli olduğu başqa birinin olub-olmadığını soruşur."
STR_INTERCEPT_CHOICE_6_0: "Onun hansı sübutu olduğunu soruş"
STR_INTERCEPT_CHOICE_6_1: "Hooperi qeyd edin"
STR_INTERCEPT_CHOICE_6_2: "Pəncərəyə tərəf baxın"
STR_INTERCEPT_TITLE_7: "İTKİN MƏKAR"
STR_INTERCEPT_TEXT_7: "Harris birbaşa cavab istəyir. Komponent götürmüsünüz? Siz ona paltonuzda nə olduğunu söyləyə, Huperin tətbiq etdiyi təzyiqi izah edə və ya ittihamı başqa yerdə göstərməyə çalışa bilərsiniz."
STR_INTERCEPT_CHOICE_7_0: "Ona komponenti verin"
STR_INTERCEPT_CHOICE_7_1: "Şantajı izah edin"
STR_INTERCEPT_CHOICE_7_2: "Huperi ittiham edin"
STR_INTERCEPT_TITLE_8: "METAL STANDA"
STR_INTERCEPT_TEXT_8: "Komponent sizin aranızdadır. Harris rahatlamadan onu yoxlayır. Oğurlanmış avadanlıqların geri qaytarılması onların nə üçün götürüldüyünü izah etmir. Bir ad və sözünüzdən daha etibarlı bir şey istəyir."
STR_INTERCEPT_CHOICE_8_0: "Sübut tapmağı təklif edin"
STR_INTERCEPT_CHOICE_8_1: "Qalın və suallara cavab verin"
STR_INTERCEPT_TITLE_9: "ALIBI"
STR_INTERCEPT_TEXT_9: "Siz masanızda sakit bir axşamı təsvir edirsiniz. Harris faylı açır. Bir gözətçi sizi maşın otağından çıxarkən gördü. Uydurduğunuz hesabın indi buna qarşı şahidi var."
STR_INTERCEPT_CHOICE_9_0: "Hekayəni müdafiə edin"
STR_INTERCEPT_CHOICE_9_1: "Şantajı qəbul edin"
STR_INTERCEPT_CHOICE_9_2: "Əlavə suallardan imtina edin"
STR_INTERCEPT_TITLE_10: "Pəncərə"
STR_INTERCEPT_TEXT_10: "Pəncərə hündür, şüşə qalındır. Ondan kənarda yol başqa bir daxmanın yanından keçir. Onu sındırmaq yüksək səslə olardı; burada gözləməyin öz təhlükələri var."
STR_INTERCEPT_CHOICE_10_0: "Şüşəni sındırın"
STR_INTERCEPT_CHOICE_10_1: "Çöldəki yolu öyrənin"
STR_INTERCEPT_CHOICE_10_2: "Müsahibəyə qayıdın"
STR_INTERCEPT_TITLE_11: "DİGƏR QONAQÇI"
STR_INTERCEPT_TEXT_11: "Hooper siz sabitsiz ikən gəldi. O, Harrisdə komponentin olub-olmadığını bilmək istəyir. Bir əlini qapının yanında saxlayır."
STR_INTERCEPT_CHOICE_11_0: "Özünü yatmış kimi göstər"
STR_INTERCEPT_CHOICE_11_1: "İzahat tələb edin"
STR_INTERCEPT_CHOICE_11_2: "Su isteyin"
STR_INTERCEPT_TITLE_12: "XƏBƏRDARLIQ"
STR_INTERCEPT_TEXT_12: "Çay dayanmazdan əvvəl Harrisi çağırırsınız. Əsəbiləşərək qayıdır. Kubokla bağlı ittihamın sınaya biləcəyi bir şeyə ehtiyacı olacaq."
STR_INTERCEPT_CHOICE_12_0: "Kuboku sübut kimi saxlayın"
STR_INTERCEPT_CHOICE_12_1: "Harrisi sizi zəhərləməkdə ittiham edin"
STR_INTERCEPT_CHOICE_12_2: "Diqqəti çarxda cəmləyin"
STR_INTERCEPT_TITLE_13: "HUPER"
STR_INTERCEPT_TEXT_13: "Harris adı tanıyır. Hooper faydalıdır, yaxşı əlaqəlidir və dünənki siyahıda da yoxdur. Tanınma sübut deyil."
STR_INTERCEPT_CHOICE_13_0: "Təsdiq edilə bilən bir şey tapın"
STR_INTERCEPT_CHOICE_13_1: "Huperin onu oğurladığını israr edin"
STR_INTERCEPT_TITLE_14: "ŞANAT"
STR_INTERCEPT_TEXT_14: "Siz bir gənci, xəyanət edilmiş bir güvəni və ondan sonra gələn tələbi təsvir edirsiniz. Harris sizə kömək etmədən dinləyir. Tələni quran adamın adını çəkmək, qorumaq istədiyiniz insanı da ifşa edə bilər."
STR_INTERCEPT_CHOICE_14_0: "Harrisə tam hesabı verin"
STR_INTERCEPT_CHOICE_14_1: "Adları buraxın"
STR_INTERCEPT_CHOICE_14_2: "Huperi tutmağın yolunu təklif edin"
STR_INTERCEPT_TITLE_15: "ASAN İTTİHAM"
STR_INTERCEPT_TEXT_15: "Hooper, deyirsən, məsuliyyətli olmalıdır. Harris hardan bildiyini soruşur. Problemin həlli ilə cavabı sübut edə biləcək bir şahid çıxarmaq arasında fərq var."
STR_INTERCEPT_CHOICE_15_0: "Qoy Harrisə iddiaya etiraz edin"
STR_INTERCEPT_CHOICE_15_1: "Hooperə şəxsi mesaj göndərməyə çalışın"
STR_INTERCEPT_TITLE_16: "SINILABİLƏN BİR İPUCU"
STR_INTERCEPT_TEXT_16: "Hekayəni inkar etmək olar. Sənədi, şahidi və ya itkin komponenti izah etmək daha çətindir. Nəyi izləyəcəyinizi seçmək üçün bir az vaxtınız var."
STR_INTERCEPT_CHOICE_16_0: "Yaxınlıqdakı daxmanı yoxlayın"
STR_INTERCEPT_CHOICE_16_1: "Səhər kəsişməsindən istifadə edin"
STR_INTERCEPT_CHOICE_16_2: "Birbaşa Hooperə sual verin"
STR_INTERCEPT_TITLE_17: "GERİ DÖNÜŞDƏN ARTIQ"
STR_INTERCEPT_TEXT_17: "Maşın yenidən işləyə bilər, lakin Harrisin izah etmək üçün hələ də təhlükəsizlik pozuntusu var. O, sizə bunu kimin təşkil etdiyini müəyyən etmək üçün son fürsət təklif edir."
STR_INTERCEPT_CHOICE_17_0: "Sübutları göstərin"
STR_INTERCEPT_CHOICE_17_1: "Sübut axtarın"
STR_INTERCEPT_CHOICE_17_2: "Onun hökmünü qəbul et"
STR_INTERCEPT_TITLE_18: "TƏZİLDİR"
STR_INTERCEPT_TEXT_18: "Harris son cavabınızın yanında ilk cavabınızı təyin edir. Onların hər ikisi doğru ola bilməz. Yalandan imtina edə və ya müsahibənin ziddiyyətlə bitməsinə icazə verə bilərsiniz."
STR_INTERCEPT_CHOICE_18_0: "Şantaj haqqında həqiqəti deyin"
STR_INTERCEPT_CHOICE_18_1: "Hər şeyi inkar etməyə davam edin"
STR_INTERCEPT_CHOICE_18_2: "Ayrılmağa çalışın"
STR_INTERCEPT_TITLE_19: "SÜSKÜT"
STR_INTERCEPT_TEXT_19: "Qollarınızı qatlayırsınız. Harris faylı bağlayır. Bu otaqda sükutla istintaq bitmir; yalnız onu idarə etməkdə sizin payınızı bitirir."
STR_INTERCEPT_CHOICE_19_0: "Qərara qulaq asın"
STR_INTERCEPT_TITLE_20: "SINIR ŞÜŞƏ"
STR_INTERCEPT_TEXT_20: "Panel öz yerini verir. Soyuq hava və mühafizəçi fitinin səsi bir yerdə gəlir. Kimsə qapıya çatana qədər bir qərar vermək üçün vaxt var."
STR_INTERCEPT_CHOICE_20_0: "Xarici yol üçün qaçın"
STR_INTERCEPT_CHOICE_20_1: "Kodlanmış bir ipucu buraxın"
STR_INTERCEPT_CHOICE_20_2: "Qalın və izah edin"
STR_INTERCEPT_TITLE_21: "DAXMALARIN ARASINDA"
STR_INTERCEPT_TEXT_21: "Yol yaşdır. Hooperin daxması növbəti patruldan əvvəl çatmaq üçün kifayət qədər yaxındır, lakin ondan kənarda olan açıq yer fərqli bir şans təqdim edir."
STR_INTERCEPT_CHOICE_21_0: "Əsaslardan qaçmağa çalışın"
STR_INTERCEPT_CHOICE_21_1: "Huperin daxmasına girin"
STR_INTERCEPT_CHOICE_21_2: "Harrisə qayıdın"
STR_INTERCEPT_TITLE_22: "ŞƏXSİ OYUN"
STR_INTERCEPT_TEXT_22: "Hooper sizi öyrənir. Masanın üstündə barmaqları ilə xəyali şahmat mövqeyini qoyur. Şifrələnmiş cavab ona birbaşa ittihamın heç vaxt bilməyəcəyini göstərə bilər."
STR_INTERCEPT_CHOICE_22_0: "Şahmat ipucu ilə cavab verin"
STR_INTERCEPT_CHOICE_22_1: "Onun adını çəkməklə hədələyin"
STR_INTERCEPT_CHOICE_22_2: "Dürüst danışın"
STR_INTERCEPT_TITLE_23: "ÜZÜ ÜZƏ"
STR_INTERCEPT_TEXT_23: "Hooper əslində nəyi sübut edə biləcəyinizi soruşur. Onun inamı yalnız planından kənar birinin bilməməsi lazım olan detalları qeyd etdikdə sarsılır."
STR_INTERCEPT_CHOICE_23_0: "Onu sübutla qarşı-qarşıya qoy"
STR_INTERCEPT_CHOICE_23_1: "Komponenti ticarət kimi təklif edin"
STR_INTERCEPT_CHOICE_23_2: "Blef"
STR_INTERCEPT_TITLE_24: "KUPÇA"
STR_INTERCEPT_TEXT_24: "Hooper su gətirir, lakin əvvəlcə çay fincanına uzanır. O fincanı saxlamaq onun təklif etdiyi hər şeyi qəbul etməkdən daha faydalı ola bilər."
STR_INTERCEPT_CHOICE_24_0: "Kuboku saxlayın"
STR_INTERCEPT_CHOICE_24_1: "Paltonuzu yenidən yoxlayın"
STR_INTERCEPT_TITLE_25: "SINAQ EDİLƏCƏK BİR ŞEY"
STR_INTERCEPT_TEXT_25: "Siz fincanı saxlayırsınız və Harrisdən onun müayinə olunmasını xahiş edirsiniz. Bu, nəhayət, ona bir obyekt əlavə edilmiş bir iddiadır. Hooperin onu çıxarmaq cəhdi ikinci faydalı detalı təmin edir."
STR_INTERCEPT_CHOICE_25_0: "Kuboku Harrisə verin"
STR_INTERCEPT_CHOICE_25_1: "Bununla Huperlə qarşılaşın"
STR_INTERCEPT_TITLE_26: "YANLIŞ MƏQSƏD"
STR_INTERCEPT_TEXT_26: "Siz Harrisi sübut olmadan ittiham edirsiniz. O, müstəntiqi gözdən salmağa çalışan şübhəli görür. Çaya nə olubsa, onun sənə inanmasını çətinləşdirmisən."
STR_INTERCEPT_CHOICE_26_0: "Müsahibə başa çatır"
STR_INTERCEPT_TITLE_27: "BÜTÜN HESAB"
STR_INTERCEPT_TEXT_27: "Siz adları verirsiniz və görüşü təsvir edirsiniz. Harris dəqiq suallar verir. Sizin utancınız realdır, amma indi yoxlaya biləcəyi təfərrüatlar da belədir."
STR_INTERCEPT_CHOICE_27_0: "Qoy hesabı yoxlasın"
STR_INTERCEPT_CHOICE_27_1: "Hooperi tapmağı təklif edin"
STR_INTERCEPT_TITLE_28: "UĞURSUZ BLUF"
STR_INTERCEPT_TEXT_28: "Harris kifayət qədər inamlı cavablar eşitdi. Hooper də var. Heç biri hekayənizin çatışmadığı faktını təmin etmir."
STR_INTERCEPT_CHOICE_28_0: "İddiada israr edin"
STR_INTERCEPT_CHOICE_28_1: "Çarəsiz bir qaçış edin"
STR_INTERCEPT_CHOICE_28_2: "Həqiqətən nə baş verdiyini etiraf edin"
STR_INTERCEPT_TITLE_29: "KESME"
STR_INTERCEPT_TEXT_29: "Cibinizdəki vərəq qarışıq hərflərdən daha çoxunu daşıyır: onun daxmalardan keçən marşrutu Huperi maşının yanında yerləşdirir. Qısa bir ipucu doğru insanı doğru yerdə axtarmağa vadar edə bilər."
STR_INTERCEPT_CHOICE_29_0: "Hooper üçün mesajı kodlayın"
STR_INTERCEPT_CHOICE_29_1: "Harrisə gedən marşrutu göstərin"
STR_INTERCEPT_TITLE_30: "MAŞIN ÇALIŞIR"
STR_INTERCEPT_TEXT_30: "Harrisin komponenti və ilk qorxulu cavablarınızdan kənara çıxaran izi var. Bombe öz işini davam etdirir. Hut 14-ü öz adınızla tərk edirsiniz, daha az sirr və cavab verəcəyiniz bir gələcək var."
STR_INTERCEPT_TITLE_31: "ŞÜBHƏ ALTINDA"
STR_INTERCEPT_TEXT_31: "Komponentin geri qaytarılması maşını gecikmədən xilas etdi. Bu, mövqeyinizi xilas etmədi. İstintaq davam edərkən Harris daxmalara girişinizi dayandırır. Müsahibədən sağ çıxdınız, ancaq adınıza aydınlıq gətirmədiniz."
STR_INTERCEPT_TITLE_32: "HƏYATDA"
STR_INTERCEPT_TEXT_32: "Qapı sizin üçün deyil, gözətçi üçün açılır. Ziddiyyətlər, itkin dəlillər və oğurlanmış komponentlər artıq idarə edə bilməyəcəyiniz bir işə çevrildi. Bu cəhd burada bitir."
STR_INTERCEPT_TITLE_33: "XARİCİ YOLU"
STR_INTERCEPT_TEXT_33: "Daxmaları arxada qoyursan. Qaranlıq faydalıdır, amma zəminlərə baxılır. Sınıq pəncərə patrulları gözlədiyinizdən də yaxınlaşdırdı."
STR_INTERCEPT_CHOICE_33_0: "Açıq yerdən keçin"
STR_INTERCEPT_CHOICE_33_1: "Xidmət yoluna davam edin"
STR_INTERCEPT_CHOICE_33_2: "Geri dönün və Harrisə üz tutun"
STR_INTERCEPT_TITLE_34: "HUPER'S HUT"
STR_INTERCEPT_TEXT_34: "İş masası nəzarətsizdir. Kağızlar krossvordun altında yatır və maşın otağı qələmlə yazılmış cədvəldə görünür. Ayaq səsləri çöldəki lövhələrlə yaxınlaşır."
STR_INTERCEPT_CHOICE_34_0: "Sənədləri yoxlayın"
STR_INTERCEPT_CHOICE_34_1: "Hooperi gözləyin"
STR_INTERCEPT_CHOICE_34_2: "Harrisə yola salın"
STR_INTERCEPT_TITLE_35: "ŞAHMAT PROBLEMİ"
STR_INTERCEPT_TEXT_35: "Siz Hooperə düşdüyü vəziyyəti əks etdirən bir mövqe verirsiniz: qorunan parça, açıq padşah və cavab gələnə qədər təhlükəsiz görünən bir hərəkət. O, xəbərdarlığı başa düşür. Onun növbəti sözləri sizə lazım olan əlaqəni təmin edir."
STR_INTERCEPT_CHOICE_35_0: "Ondan planı qəbul etməsini xahiş edin"
STR_INTERCEPT_CHOICE_35_1: "Qəbul sənədini Harrisə göndərin"
STR_INTERCEPT_TITLE_36: "MASKASIZ"
STR_INTERCEPT_TEXT_36: "Heç olmamış kimi göstərmək əvəzinə təzyiqdən danışırsınız. Hooper rəqib kimi deyil, bir şəxs kimi qısaca cavab verir. Bu açılış ticarət və ya tələ üçün istifadə edilə bilər."
STR_INTERCEPT_CHOICE_36_0: "Dürüst tənzimləmə tələb edin"
STR_INTERCEPT_CHOICE_36_1: "Ondan etiraf etməsini xahiş edin"
STR_INTERCEPT_CHOICE_36_2: "Hesabı Harrisə aparın"
STR_INTERCEPT_TITLE_37: "HUPERİN QƏBULU"
STR_INTERCEPT_TEXT_37: "Hooper şantajı çatışmayan komponentə bağlamaq üçün kifayət qədər izah edir. Harris indi avadanlığı bərpa edə və hekayəni yoxlaya bilər. İstintaqı bitirmək və ya Huperin itməsinə icazə vermək barədə qərar verməlisiniz."
STR_INTERCEPT_CHOICE_37_0: "Harrisə qəbulu gətirin"
STR_INTERCEPT_CHOICE_37_1: "Qoy Huper gedib getsin"
STR_INTERCEPT_TITLE_38: "TİCARƏT"
STR_INTERCEPT_TEXT_38: "Siz son rıçaq parçanızı Hooperin çata biləcəyi yerə yerləşdirirsiniz. Şahid və dəlilsiz sövdələşmə onun öz problemini sənin hesabına həll etməsi üçün dəvətdir."
STR_INTERCEPT_CHOICE_38_0: "Komponenti təhvil verin"
STR_INTERCEPT_CHOICE_38_1: "Şahid razılaşma tələb edin"
STR_INTERCEPT_CHOICE_38_2: "Təklifi geri götürün"
STR_INTERCEPT_TITLE_39: "HARRIS DİNLƏYİR"
STR_INTERCEPT_TEXT_39: "Detalları yoxlamaq olar. Harris komponentin indi harada olduğunu soruşur. Hesabınızı təmizləmək və maşını işə salmaq əlaqəli problemlərdir, lakin onlar eyni deyil."
STR_INTERCEPT_CHOICE_39_0: "Paltonunuzdakıları geri qaytarın"
STR_INTERCEPT_CHOICE_39_1: "Komponenti bərpa etməyə kömək edin"
STR_INTERCEPT_CHOICE_39_2: "İndi cavab verməyi dayandırın"
STR_INTERCEPT_TITLE_40: "HASARDAN ARAYI"
STR_INTERCEPT_TEXT_40: "Evlər arxanızda yox olur. Ərazinin xaricindəki azadlıq günahsızlıqla eyni deyil, və maşın indi başqa birinin təcili problemidir. Siz qaçdınız; hekayət bitməmiş qalır."
STR_INTERCEPT_TITLE_41: "SON SƏHV"
STR_INTERCEPT_TEXT_41: "Patrul açıq yer bitməzdən əvvəl sizə çatır və ya Hooperin vədi onun üçün artıq faydalı olmadıqda iflasa uğrayır. Təhlükəsiz hərəkətləriniz tükəndi. Hekayə əvvəldən yenidən sınaqdan keçirilə bilər."
STR_INTERCEPT_TITLE_42: "BİLGİLER"
STR_INTERCEPT_TEXT_42: "Cədvəl Huperi hekayənizin dediyi yerə yerləşdirir. Yanında sizi tələyə ilk çəkən qeyd var. Bu birləşmə Harrisin təsdiqləməsi üçün kifayət qədər spesifikdir."
STR_INTERCEPT_CHOICE_42_0: "Sənədləri Harrisə aparın"
STR_INTERCEPT_CHOICE_42_1: "Gözləyin və Hooperlə qarşılaşın"
STR_INTERCEPT_TITLE_43: "SON BİR RAZIMAN"
STR_INTERCEPT_TEXT_43: "Hooper hissəni geri qoymağı təklif edir. Ona güvənmək ani bir problemi aradan qaldıracaq; Harrisin şahid olması başqasını yaratmağı çətinləşdirərdi."
STR_INTERCEPT_CHOICE_43_0: "Şahidli dönüş təşkil edin"
STR_INTERCEPT_CHOICE_43_1: "Harrisi plana daxil edin"
STR_INTERCEPT_TITLE_44: "MƏKARIN BƏRPA EDİLMƏSİ"
STR_INTERCEPT_TEXT_44: "Qeyddə olan hesabla axtarış itkin avadanlıqa qayıdır. Siz komponentin harada olması lazım olduğunu müəyyən edərkən Harris maşın otağını yoxlayır."
STR_INTERCEPT_CHOICE_44_0: "Təsdiqlənmiş geri dönüşü tamamlayın"
STR_INTERCEPT_CHOICE_44_1: "Onu paltonuzdan çıxarın"
STR_INTERCEPT_CHOICE_44_2: "Harrisi Hooper haqqında xəbərdar edin"
STR_INTERCEPT_TITLE_45: "YEKUN SUAL"
STR_INTERCEPT_TEXT_45: "Harris gözləyir. Əgər Hooper-ı oğurluğa bağlaya bilsəniz, komponenti bərpa etmək və bunu düzgün şəkildə bitirmək üçün hələ də bir yol var. Əks halda, istintaq yalnız dəyişən hesabınıza malikdir."
