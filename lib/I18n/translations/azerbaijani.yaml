STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "Qohumların meydançaya gətirdikləri hekayələri oxuyun. Biz hər bir adı onun aid olduğu həyatın yanında qoymalıyıq."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "Mənə dənizçilərin hekayələrini müqayisə etməyə kömək et. Mən başqa bir gəmini xatırlamadığımız kanala göndərə bilmərəm."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "Mənə xilas edilmiş cildləri oxumağa kömək et. Onlar bu otaqları tərk edəndə istəyirəm ki, kimsə bilsin ki, onlar kimin hekayələrini daşıyırlar."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "Sığınacaqların hekayələrini müqayisə etməyimə kömək et. Sonrakı səyahətçi yol tapmalıdır, başqa bir yanlış əks-səda deyil."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "Köhnə səyahətləri müqayisə etməkdə bizə kömək edin. Yadda qalan quyu quma gəlib itmək arasında fərq yarada bilər."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "Qohumların hekayələrini dinləməyimə kömək et. Saat mənə onların bu gün nə etmək istədiklərini deyə bilməz."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "Bizə azad edilmiş bölgələrdən gələn hekayələri oxumağa kömək edin. Saray kifayət qədər illərdir ki, yalnız öz-özünə danışır."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Mənə bağbanların hekayələrini düzəltməyə kömək et. Bu toxumlar paketdəki addan daha çox şeyə ehtiyac duyur."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Bu hekayələri dövriyyədə saxlamağa kömək edin. İstəyirəm ki, tapdığımız insanlar bir-birini eşitsinlər."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Bizə son yola çatan hekayələri oxumağa kömək et. Hər biri kral divarlarının arxasında gözləyən birinə aiddir."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Bizə bu hekayələri tam oxumağa kömək edin. Bu qədər uzun müddət ayrıldıqdan sonra, onların sahibləri siyahıda bir addan daha çoxuna layiqdirlər."
STR_QUEST_CAM_JOURNEY_THANKS_0: "Liora ovucu ilə səhifəni hamarlayır. \"Mən bu xətti yenidən eşidə bilərəm\" deyir. Bu axşam o, kitabı lampanın yanında açıq qoyacaq."
STR_QUEST_CAM_JOURNEY_THANKS_1: "Kitabxanada kimsə sizə yer vermək üçün kreslonu hərəkət etdirir. Bitməmiş bir hekayə yeni bir sətir qazanır; onun sahibi səhifəni iki əllə evinə aparır."
STR_QUEST_CAM_JOURNEY_THANKS_2: "Mara yeni oxuna bilən səhifəni qatlayır və axını kitabının yanına qoyur. Pəncərəyə qayıtmazdan əvvəl o, duzlu havadan kobud səslə sizə təşəkkür edir."
STR_QUEST_CAM_JOURNEY_THANKS_3: "İri iki səhifənin arasına quru parça zolağı qoyur. \"İndi səyahət edə bilər.\" O, digər kitablara aparmazdan əvvəl səsi sinəsinə qarşı tutur."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Taren paketini daşın üstünə qoyur və siz bitirdiyiniz zaman dinləyir. Sonra bir səyyahın sözlərini təkrarlayır, bu dəfə səhifəyə baxmağa ehtiyac duymadan."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Nadir barmaqlarının arasından lent çəkir, əvvəllər ayırd etmək çətin olan adı oxuyur. O, sizin üçün odun yanında bir yer düzəldir."
STR_QUEST_CAM_JOURNEY_THANKS_6: "Orin barmaqlarında dönən aləti yerə qoyur. Bir müddət o hekayədəki şəxs haqqında danışır və saatın eşitmədən titrəməyinə icazə verilir."
STR_QUEST_CAM_JOURNEY_THANKS_7: "Sera hekayəni kral əmrlərinin yığınından uzaqlaşdırır. O, başqa bir kreslo istəyir, sonra da onun son sətirlərini sizinlə dinləyir."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Aster səhifəni təmiz yarpaqla qeyd edir. O, sakitcə sizə təşəkkür edir; bir az sonra onun bulağın yanında eyni parçanı oxuduğunu eşidirsən."
