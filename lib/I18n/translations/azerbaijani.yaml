STR_QUEST_CAM_JOURNEY_DAILYREQUEST_2: "Bu adları mənimlə oxuyun. İstəyirəm ki, növbəti gəmi gələndə bir ailə gözləsin."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_3: "Bu hekayəni daha yüksək səfərə köçürməmişdən əvvəl oxu. Hansı sözlərin hələ də eksik olduğunu bilmək istəyirəm."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_4: "Səyahətçilərin sözlərini mənimlə oxuyun. Köhnə xəbərdarlığı təqib etmək üçün zəng etmək üçün səhv salmaq istəmirəm."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Bu hekayələri odun yanında oxu. Yola çıxmadan əvvəl istərdim ki, hər kəs öz adını eşitsin."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_6: "Zənglər çalmadan bu səhifəni mənimlə oxuyun. Mən siferblatdakı saatdan çoxunu xatırlamalıyam."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_7: "Bu ifadəni tam oxuyun. Burada eşitmək üçün çox gözləyən insanlar var."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Bu xatirəni fəvvarənin yanında oxuyun. Eşitmək istərdim ki, burada əkin edən adam nəyi geridə qoymağa ümid edirdi."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Sizə göndərdiyimiz hekayələri oxuyun. Evdən gələn səslər bu qədər uzaq olsa belə sizə yoldaş ola bilər."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Yola çıxmazdan əvvəl bu məktubu oxuyun. Hər xatirəni tək başına daşımaq məcburiyyətində deyilsən."
