STR_FLASHCARDS_HELP: "Kopiraj komplete Anki (.apkg /.colpkg , .anki2 /.anki21), CSV /TSV/text ali pretvorjene študijske mape v /FLASHCARDS. Uporabi podmape: do 128 elementov vsaka.\n\nUvozi sprejemajo osnovne, obrnjene in enostavne zaprte besedilne kartice. Zvok in HTML po meri nista podprta. Najprej pretvorite sklope slikovnih /CJK. Pregledi brez povezave uporabljajo FSRS. Uvažanje začne nov urnik in ohrani izvirnike."
