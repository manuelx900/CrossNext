STR_CAR_HELP_TEXT: "KAKO REŠITI PRIMER\nVsak lik naredi eno izjavo. Na vrhu zaslona je natančno število krivcev in lažnih izjav. Poišči kombinacijo, ki izpolnjuje obe številki. Vsak primer ima eno rešitev.\n  \nKrivda ni poštenost\nNedolžen lik lahko laže in krivec lahko pove resnico. Dve laži pomenita, da sta točno dve celotni izjavi napačni; druge so resnične. Znaki resnice / laži se nanašajo na izjavo; Osumljenec se nanaša na krivdo.\n  \nBranje namig\n\"A ali B je to storil (ali oba)\" pomeni, da je vsaj eden izmed imenovanih likov kriv. \"A in B sta to storila\" zahtevata oba. Laž negira celotno izjavo: lažno ALI pomeni, da nobeden ni storil; lažno IN pomeni, da vsaj eden ni storil.\n  \n\"Oba sta resnična ali oba lažeta\" primerja izjave, ne krivdo. \"Točno eden laže\" pomeni, da imajo njune izjave različne vrednosti resnice. Ti namigi so lahko resnični ali neresnični.\n  \nSOSETJE NA MALEM ZASLONU\nPrvotni krožni vrstni red je Panther, Peacock, Shark, Fox, Bear, Stag, Horse, ki uporablja samo znake tega primera. Zadnji in prvi sta soseda. Ta aplikacija piše dve imeni neposredno v vsak sosed namig. Nikoli ni treba uganiti, katere kartice so poleg portreta. Spreminjanje strani ali usmerjenosti ne spremeni namig.\n  \nVišina in teža\nVsaka kartica prikazuje izmišljeno višino in prehrano. \"Krivec je višji od mene\" pomeni, da je vsaj en krivec višji od govorca, ne nujno vsi krivci. Krajši deluje na enak način. Mesojede in rastlinojede namige pomenijo, da ima vsaj en krivec to prehrano; omnivori štejejo kot nobenega. Imena, višine in diete so zanesljiva dejstva; izjave lahko lažejo.\n  \nVAŠA ANALIZA\nUporabi? / Resnica / Laž in Sumnik pod vsako izjavo, da zabeležiš hipoteze. To so tvoji zapiski, ne dokazi ali samodejna preverjanja. Puščice kažejo druge znake. V pokončnem načinu se prikažejo do tri na stran.\n  \nVložitev obtožbe\nPritisnite Obtoži in izberite točno zahtevano število krivcev. Samo potrditev napačne obtožbe porabi življenje. Začetnik in Normal imajo dve življenji; Napredni in strokovnjak imajo eno. Pravilno obtožbo rešuje primer. Ko ni več življenj, se razkrije rešitev.\n  \nKampanja in ponovitev\nObstaja 1470 primerov. Odprt primer nadaljuje trenutni poskus ali odpre naslednji po zaprtem. Kampanja vam omogoča, da izberete katerokoli od 1470 primerov v poljubnem vrstnem redu od začetka. Ponovitev začne nov poskus ob ohranitvi prejšnjega zaključka. Znotraj vsake težavnosti, primeri napredujejo od enega krivca do dveh, nato pa od manj lažnivcev do več znotraj vsake skupine krivcev. Začetnik obdrži enega krivca. Manjše vloge pridejo najprej, ko se številke ujemajo. Vsi primeri ostanejo na voljo. Reševanje predhodno izčrpanega primera ga nadgradi na rešen.\n  \nNapredek in življenja so shranjeni na kartici SD. Zapustitev, spanje ali ponovni zagon naprave ne obnovi življenja v trenutnem poskusu. Neuspelo shranjevanje blokira rezultat, dokler Retry uspe. Ponastavi vse prosi za potrditev, preden izbrišete samo Carnivore napredek."
