STR_QUEST_CAM_DECOR_NAME_0: "Gozdna vila"
STR_QUEST_CAM_DECOR_TEXT_0: "Vilo si osvobodil tihih korenin. V vaš dom bo prinesla malo čudeža."
STR_QUEST_CAM_SOLO_DECOR_NAME_1: "Gozdna svetilka"
STR_QUEST_CAM_SOLO_DECOR_TEXT_1: "Lučka za osvetlitev vašega bralnega kotička."
STR_QUEST_CAM_DECOR_NAME_2: "Echo Conch"
STR_QUEST_CAM_DECOR_TEXT_2: "Rešen mornar ti da školjko, ki še vedno hrani pesem morja."
STR_QUEST_CAM_DECOR_NAME_3: "Duh črnila"
STR_QUEST_CAM_DECOR_TEXT_3: "Duh je pobegnil s prazne strani. Odloči se potovati z vami."
STR_QUEST_CAM_DECOR_NAME_4: "mesečev cvet"
STR_QUEST_CAM_DECOR_TEXT_4: "Vrtnarji so rešili eno seme iz spečega vrta. Ta roža je zrasla za vas."
STR_QUEST_CAM_DECOR_NAME_5: "Zimski kristal"
STR_QUEST_CAM_DECOR_TEXT_5: "Otoplitev razkrije kristal, ki hrani zadnji spomin na goro."
STR_QUEST_CAM_DECOR_NAME_6: "Mehanska sova"
STR_QUEST_CAM_DECOR_TEXT_6: "Urar popravi tega malega varuha v zahvalo, ker si vrnil čas."
STR_QUEST_CAM_DECOR_NAME_7: "Feniksovo pero"
STR_QUEST_CAM_DECOR_TEXT_7: "Iz vrnjenega pepela se dvigne pero: obljuba, da se lahko zgodbe začnejo znova."
STR_QUEST_CAM_DECOR_NAME_8: "Puščavska svetilka"
STR_QUEST_CAM_DECOR_TEXT_8: "Pripovedovalec vam podari svetilko, ki je ohranjala puščavske zgodbe pri življenju."
STR_QUEST_CAM_DECOR_NAME_9: "Cloud Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "Odpreš oblakovo kletko. Majhen koi ostane, da pazi na vaše sanje."
STR_QUEST_CAM_DECOR_NAME_10: "Zmajevo srce"
STR_QUEST_CAM_DECOR_TEXT_10: "Zmaji vam zaupajo kristal, rojen iz njihovega obnovljenega spomina."
STR_QUEST_CAM_DECOR_NAME_11: "Zvezda spomina"
STR_QUEST_CAM_DECOR_TEXT_11: "Prva obnovljena zvezda vam osvetljuje pot proti zadnjim stranem."
STR_QUEST_CAM_DECOR_NAME_12: "Bralni Sprout"
STR_QUEST_CAM_DECOR_TEXT_12: "Majhna rastlinica za miren bralni kotiček."
STR_QUEST_CAM_DECOR_NAME_13: "Shranjene knjige"
STR_QUEST_CAM_DECOR_TEXT_13: "Zgodbe čakajo na naslednjega bralca."
STR_QUEST_CAM_DECOR_NAME_14: "Pasica Voyager"
STR_QUEST_CAM_DECOR_TEXT_14: "Zastavica za spomin na vsak nov začetek."
STR_QUEST_CAM_DECOR_NAME_15: "Mesečeve gobe"
STR_QUEST_CAM_DECOR_TEXT_15: "Košček gozda za vaš dom."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Začetek pustolovščine"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Dolga leta so ljudje živeli v miru in uživali v svojih knjigah. Potem jih je kralj pozabe začel uničevati. Vsem je želel preprečiti branje in narediti, da bi vse zgodbe za vedno izginile."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Kraljeve pošasti"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Kralj pozabe je poslal svoje pošasti po vsem svetu. Uničili so vsako knjigo, ki so jo našli, in napadli vse, ki so jih poskušali ustaviti. Knjižnice so začele izginjati in ljudje so nehali brati."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Moč branja"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Nekega dne, ko berete blizu vaše vasi, se pojavi pošast. Poskušate pobegniti, a zgodi se nekaj presenetljivega: več kot berete, šibkejše postaja. Zavedaš se, da je branje edini način za boj proti kraljevi magiji."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Vaše poslanstvo"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Namenil si se ustaviti kralja. Na poti do njegovega gradu morate prečkati gozdove, mesta, gore in druge kraje, polne sovražnikov. Vsaka pošast, ki jo premagate, vas pripelje malo bližje. Nadaljujte z branjem, premagajte njegove skrbnike in ga dosegite, preden uniči vse knjige na svetu."
STR_QUEST_CAM_JOURNEY2_BOOK_0: "Gozd pošasti"
STR_QUEST_CAM_JOURNEY2_BOOK_1: "Mesto brez knjig"
STR_QUEST_CAM_JOURNEY2_BOOK_2: "Pristanišče megle"
STR_QUEST_CAM_JOURNEY2_BOOK_3: "Knjižnica pod morjem"
STR_QUEST_CAM_JOURNEY2_BOOK_4: "Gore odmevov"
STR_QUEST_CAM_JOURNEY2_BOOK_5: "Morje peska"
