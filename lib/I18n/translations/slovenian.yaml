STR_QUEST_CAM_JOURNEY2_BOOK_7: "Mesečeva palača"
STR_QUEST_CAM_JOURNEY2_BOOK_8: "Vrt bogov"
STR_QUEST_CAM_JOURNEY2_BOOK_9: "Vojna za knjige"
STR_QUEST_CAM_JOURNEY2_BOOK_10: "Pot zvezd"
STR_QUEST_CAM_JOURNEY2_BOOK_11: "Zadnja stran"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Ko premagate King of Oblivion, se vrnete domov. Njegova vojska ne more več uničevati knjig in ljudje spet berejo v miru. Rešili ste zgodbe sveta. Še veliko knjig je treba odkriti."
