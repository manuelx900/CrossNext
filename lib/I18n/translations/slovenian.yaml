STR_INTERCEPT_TITLE_0: "hiša 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. Čakajo vas za zaklenjenimi vrati. Komponenta iz računalniškega stroja je izginila. Zjutraj prestrežejo žlebove v žepu plašča. Zunaj se stopnice ustavijo."
STR_INTERCEPT_CHOICE_0_0: "Razmislite o obtožbi"
STR_INTERCEPT_CHOICE_0_1: "Počakajte na intervju"
STR_INTERCEPT_CHOICE_0_2: "Poiščite svoj plašč"
STR_INTERCEPT_TITLE_1: "obtožnica"
STR_INTERCEPT_TEXT_1: "Sumijo na izdajo. Rešujete številke, križišča in šahovske položaje za preživetje.Ta soba je še en problem: nasprotujte sebi in vaša verodostojnost je lahko prva žrtev."
STR_INTERCEPT_CHOICE_1_0: "Izberite strategijo"
STR_INTERCEPT_CHOICE_1_1: "Poslušaj, kar veš"
STR_INTERCEPT_TITLE_2: "Harry prihaja"
STR_INTERCEPT_TEXT_2: "Harris vstopi s skodelico čaja in datoteko. Iz bombe manjka zvitek. tvoje ime je bilo na seznamu dolžnosti. On postavi skodelico poleg tebe in vpraša, kje si bil včeraj zvečer."
STR_INTERCEPT_CHOICE_2_0: "Pijte čaj"
STR_INTERCEPT_CHOICE_2_1: "Čaj pustite nedotaknjen"
STR_INTERCEPT_CHOICE_2_2: "Odgovori mirno"
STR_INTERCEPT_TITLE_3: "sestavni del"
STR_INTERCEPT_TEXT_3: "V notranjosti vašega plašča prsti srečajo hladno kovino. Komponenta je še vedno tam. Hooper je dejal, da bi ga vzeli, da bi izsiljevanje ustavilo."
STR_INTERCEPT_CHOICE_3_0: "Naj bo skrito"
STR_INTERCEPT_CHOICE_3_1: "Daj ga Harris"
STR_INTERCEPT_TITLE_4: "zmagovalna igra"
STR_INTERCEPT_TEXT_4: "Sodelovanje lahko ohrani vašo verodostojnost. Prepričljiva laž lahko kupi čas. Pobeg bi zamenjal zaklenjeno sobo za straže zunaj."
STR_INTERCEPT_CHOICE_4_0: "Sodelujte"
STR_INTERCEPT_CHOICE_4_1: "Izdelava alibija"
STR_INTERCEPT_CHOICE_4_2: "Preverite okno"
STR_INTERCEPT_TITLE_5: "Čaj je"
STR_INTERCEPT_TEXT_5: "Harris opazi tvojo tišino, a obraz se že umika.Ko naslednjič odpreš oči, stoji ob mizi še en par čevljev."
STR_INTERCEPT_CHOICE_5_0: "Pretvarjajte se, da zaspite"
STR_INTERCEPT_CHOICE_5_1: "Primerjajte obiskovalca"
STR_INTERCEPT_CHOICE_5_2: "Prosite za vodo"
STR_INTERCEPT_TITLE_6: "Majhna zavrnitev"
STR_INTERCEPT_TEXT_6: "Harris bolj pozorno gleda na gibanje kot odgovor.Vpraša, če bi moral še koga vprašati."
STR_INTERCEPT_CHOICE_6_0: "Vprašajte, kakšne dokaze ima"
STR_INTERCEPT_CHOICE_6_1: "Omenjeno v Hooper"
STR_INTERCEPT_CHOICE_6_2: "Pogled proti oknu"
STR_INTERCEPT_TITLE_7: "Manjkajoča resničnost"
STR_INTERCEPT_TEXT_7: "Harris želi neposreden odgovor.Ali ste vzeli komponento? mu lahko poveste, kaj je v vašem plašču, razložite pritisk Hooperja ali poskusite opozoriti na obtožbo drugje."
STR_INTERCEPT_CHOICE_7_0: "Daj mu sestavino"
STR_INTERCEPT_CHOICE_7_1: "Razložite izsiljevanje"
STR_INTERCEPT_CHOICE_7_2: "Obtožnica Hooper"
STR_INTERCEPT_TITLE_8: "Metal na mizi"
STR_INTERCEPT_TEXT_8: "Komponenta leži med vami. Harris jo preveri brez sprostitve. Vrnitev ukradene opreme ne pojasnjuje, zakaj je bila vzeta. Želi ime in nekaj bolj zanesljivega kot vaša beseda."
STR_INTERCEPT_CHOICE_8_0: "Ponudba za iskanje dokazov"
STR_INTERCEPT_CHOICE_8_1: "Ostani in odgovori na vprašanja"
STR_INTERCEPT_TITLE_9: "Alibi je"
STR_INTERCEPT_TEXT_9: "Harris odpre datoteko. varuh vas je videl, da ste zapustili strojno sobo. Vaš izumljeni račun ima zdaj pričo proti temu."
STR_INTERCEPT_CHOICE_9_0: "Zaščitite zgodbo"
STR_INTERCEPT_CHOICE_9_1: "Priznaj izsiljevanje"
STR_INTERCEPT_CHOICE_9_2: "Zavrni dodatna vprašanja"
STR_INTERCEPT_TITLE_10: "okno"
STR_INTERCEPT_TEXT_10: "Okno je visoko in steklo je debelo. Nad njim pot vodi mimo druge koče. Zlom bi bil glasen; čakanje tukaj ima svoje nevarnosti."
STR_INTERCEPT_CHOICE_10_0: "Zlomite steklo"
STR_INTERCEPT_CHOICE_10_1: "Preučite pot zunaj"
STR_INTERCEPT_CHOICE_10_2: "Nazaj na intervju"
STR_INTERCEPT_TITLE_11: "Še en obiskovalec"
STR_INTERCEPT_TEXT_11: "Hooper je prišel, medtem ko ste nestabilni. Želi vedeti, ali ima Harris komponento."
STR_INTERCEPT_CHOICE_11_0: "Pretvarjaj se, da spiš"
STR_INTERCEPT_CHOICE_11_1: "Zahteva pojasnilo"
STR_INTERCEPT_CHOICE_11_2: "Prosite za vodo"
STR_INTERCEPT_TITLE_12: "Opozorilo"
STR_INTERCEPT_TEXT_12: "Harrisa pokličete, preden se čaj ustavi. Vrne se, razdražen. Obtožba o skodelici bo potrebovala nekaj, kar lahko preizkusi."
STR_INTERCEPT_CHOICE_12_0: "Čašo vzemite kot dokaz"
STR_INTERCEPT_CHOICE_12_1: "Obtoži Harrisa, da te je zastrupil"
STR_INTERCEPT_CHOICE_12_2: "Osredotočite se na realno"
STR_INTERCEPT_TITLE_13: "Hooper"
STR_INTERCEPT_TEXT_13: "Harris prepozna ime. Hooper je koristen, dobro povezan in tudi ni odsoten iz včerajšnjega seznama."
STR_INTERCEPT_CHOICE_13_0: "Poiščite nekaj preverljivega"
STR_INTERCEPT_CHOICE_13_1: "Hooper ga je ukradel"
STR_INTERCEPT_TITLE_14: "črna mail"
STR_INTERCEPT_TEXT_14: "Opisujete mladeniča, zaupanje, ki ga je izdal, in zahtevo, ki je sledila. Harris posluša, ne da bi vam pomagal."
STR_INTERCEPT_CHOICE_14_0: "Daj Harris celoten račun"
STR_INTERCEPT_CHOICE_14_1: "Pustite imena"
STR_INTERCEPT_CHOICE_14_2: "Predlagajte način za ulov Hooper"
STR_INTERCEPT_TITLE_15: "Enostavna obtožnica"
STR_INTERCEPT_TEXT_15: "Hooper, praviš, mora biti odgovoren. Harris vpraša, kako veš. Obstaja razlika med reševanjem problema in izdelavo priče, ki lahko dokaže odgovor."
STR_INTERCEPT_CHOICE_15_0: "Naj Harris izpodbija zahtevek"
STR_INTERCEPT_CHOICE_15_1: "Preizkusite zasebno sporočilo za Hooper"
STR_INTERCEPT_TITLE_16: "Testni ključ"
STR_INTERCEPT_TEXT_16: "Zgodbo je mogoče zanikati. Dokument, priča ali manjkajoča komponenta je težje razložiti."
STR_INTERCEPT_CHOICE_16_0: "Preverite bližnjo hišo"
STR_INTERCEPT_CHOICE_16_1: "Uporaba jutranjega pregleda"
STR_INTERCEPT_CHOICE_16_2: "Vprašanje Hooper neposredno"
STR_INTERCEPT_TITLE_17: "Več kot vrnitev"
STR_INTERCEPT_TEXT_17: "Stroj lahko znova deluje, vendar ima Harris še vedno varnostno kršitev, ki jo je treba pojasniti."
STR_INTERCEPT_CHOICE_17_0: "Prikaži dokaze"
STR_INTERCEPT_CHOICE_17_1: "Išči dokaze"
STR_INTERCEPT_CHOICE_17_2: "Sprejmite njegovo sodbo"
STR_INTERCEPT_TITLE_18: "Protislovje"
STR_INTERCEPT_TEXT_18: "Harris postavlja vaš prvi odgovor poleg vašega zadnjega. Oba ne morejo biti resnična. Lahko opustite laž ali pustite, da se intervju konča na protislovju."
STR_INTERCEPT_CHOICE_18_0: "Povejte resnico o izsiljevanju"
STR_INTERCEPT_CHOICE_18_1: "Še naprej zanikaš vse"
STR_INTERCEPT_CHOICE_18_2: "Poskusite zapustiti"
STR_INTERCEPT_TITLE_19: "tišine"
STR_INTERCEPT_TEXT_19: "Harris zapre datoteko.V tej sobi tišina ne konča preiskave; konča samo vaš del pri usmerjanju."
STR_INTERCEPT_CHOICE_19_0: "Poslušajte odločitev"
STR_INTERCEPT_TITLE_20: "Zlomljeno steklo"
STR_INTERCEPT_TEXT_20: "Hladni zrak in zvok stražarjevega šepeta sta skupaj.Čas je za eno odločitev, preden nekdo doseže vrata."
STR_INTERCEPT_CHOICE_20_0: "Teči po zunanji poti"
STR_INTERCEPT_CHOICE_20_1: "Pustite kodiran clue"
STR_INTERCEPT_CHOICE_20_2: "Ostani in pojasni"
STR_INTERCEPT_TITLE_21: "Med kletkami"
STR_INTERCEPT_TEXT_21: "Hooperjeva koča je dovolj blizu, da jo doseže pred naslednjo patruljo, vendar odprto zemljo za njo ponuja drugačno vrsto priložnosti."
STR_INTERCEPT_CHOICE_21_0: "Poskusite pobegniti iz razlogov"
STR_INTERCEPT_CHOICE_21_1: "Vstopite v Hooperjevo kočo"
STR_INTERCEPT_CHOICE_21_2: "Vrni se na Harris"
STR_INTERCEPT_TITLE_22: "Zasebna igra"
STR_INTERCEPT_TEXT_22: "Hooper vas preučuje.Na mizi s prsti postavlja domišljijski šahovski položaj.Kodirani odgovor bi mu lahko pokazal, kaj neposredna obtožba ne bi nikoli."
STR_INTERCEPT_CHOICE_22_0: "Odgovori s šahovskim ključem"
STR_INTERCEPT_CHOICE_22_1: "Grozijo, da ga bodo poimenovali"
STR_INTERCEPT_CHOICE_22_2: "Govorite pošteno"
STR_INTERCEPT_TITLE_23: "obraza v obraz"
STR_INTERCEPT_TEXT_23: "Hooper sprašuje, kaj lahko dejansko dokaže. njegovo zaupanje zbledi le, ko omenjate podrobnosti, ki jih nekdo zunaj njegovega načrta ne bi smel vedeti."
STR_INTERCEPT_CHOICE_23_0: "soočiti se z dokazom"
STR_INTERCEPT_CHOICE_23_1: "Ponudite komponento kot trgovino"
STR_INTERCEPT_CHOICE_23_2: "blufanje"
STR_INTERCEPT_TITLE_24: "Kupa"
STR_INTERCEPT_TEXT_24: "Hooper prinaša vodo, vendar najprej doseže čajno skodelico."
STR_INTERCEPT_CHOICE_24_0: "Ohranite skodelico"
STR_INTERCEPT_CHOICE_24_1: "Še enkrat preverite plašč"
STR_INTERCEPT_TITLE_25: "Nekaj za preizkus"
STR_INTERCEPT_TEXT_25: "Držite skodelico in prosite Harrisa, naj jo pregleda.To je končno obtožba z predmetom, ki je pritrjen nanjo.Hooperov poskus, da ga odstrani, zagotavlja drugo koristno podrobnost."
STR_INTERCEPT_CHOICE_25_0: "Daj Harrisu skodelico"
STR_INTERCEPT_CHOICE_25_1: "Hooper se sooči z njim"
STR_INTERCEPT_TITLE_26: "Napačen cilj"
STR_INTERCEPT_TEXT_26: "Harrisa obtožuješ brez dokazov. On vidi osumljenca, ki poskuša diskreditirati preiskovalca. Karkoli se je zgodilo s čajem, ste mu težje verjeli."
STR_INTERCEPT_CHOICE_26_0: "Intervju se konča"
STR_INTERCEPT_TITLE_27: "Celoten račun"
STR_INTERCEPT_TEXT_27: "Harris postavlja natančna vprašanja. vaša sramota je resnična, vendar so podrobnosti, ki jih lahko zdaj preveri."
STR_INTERCEPT_CHOICE_27_0: "Naj preverja račun"
STR_INTERCEPT_CHOICE_27_1: "Ponudba za iskanje Hooper"
STR_INTERCEPT_TITLE_28: "Neuspešna prevara"
STR_INTERCEPT_TEXT_28: "Harris je slišal dovolj samozavestnih odgovorov. Hooper ima tudi. niti ne zagotavlja dejstva, da vaša zgodba manjka."
STR_INTERCEPT_CHOICE_28_0: "Vztraja v trditvi"
STR_INTERCEPT_CHOICE_28_1: "Naredite obupno pobeg"
STR_INTERCEPT_CHOICE_28_2: "Priznaj, kar se je res zgodilo"
STR_INTERCEPT_TITLE_29: "Intercepcija"
STR_INTERCEPT_TEXT_29: "List v vašem žepu nosi več kot le črke: njegova pot skozi koče Hooper postavi blizu stroja."
STR_INTERCEPT_CHOICE_29_0: "Kodiraj sporočilo za Hooperja"
STR_INTERCEPT_CHOICE_29_1: "Pokaži pot do Harris"
STR_INTERCEPT_TITLE_30: "stroj teče"
STR_INTERCEPT_TEXT_30: "Harris ima komponento in pot, ki vodi mimo vaših prvih prestrašenih odgovorov. Bomba nadaljuje s svojim delom. Pustiš Hut 14 pod svojim imenom, z manj skrivnosti in prihodnostjo, za katero še vedno odgovarjaš."
STR_INTERCEPT_TITLE_31: "Pod sumom"
STR_INTERCEPT_TEXT_31: "Vrnitev komponente je rešila stroj pred zamudo. Ni shranila vašega položaja. Harris konča dostop do kletk, medtem ko se preiskava nadaljuje. Preživeli ste intervju, vendar niste izbrisali svojega imena."
STR_INTERCEPT_TITLE_32: "V varstvu"
STR_INTERCEPT_TEXT_32: "Vrata se odpirajo varuhu namesto tebi.Protislovja, manjkajoči dokazi in ukradena komponenta so postali primer, ki ga ne morete več usmeriti."
STR_INTERCEPT_TITLE_33: "zunanja pot"
STR_INTERCEPT_TEXT_33: "Pustite koče za seboj. temno je koristno, vendar so ozemlja varovana. Zlomljeno okno je patrulje približalo, kot ste pričakovali."
STR_INTERCEPT_CHOICE_33_0: "Prečkati odprto zemljo"
STR_INTERCEPT_CHOICE_33_1: "Pojdite na storitev pot"
STR_INTERCEPT_CHOICE_33_2: "Obrni se in obrni se proti Harrisu"
STR_INTERCEPT_TITLE_34: "Hooperjeva kapa"
STR_INTERCEPT_TEXT_34: "Miza je brez nadzora. Papiiri ležijo pod križanko, strojna soba pa se prikaže v pisarniškem urniku."
STR_INTERCEPT_CHOICE_34_0: "Preverite dokumente"
STR_INTERCEPT_CHOICE_34_1: "Počakajte na Hooperja"
STR_INTERCEPT_CHOICE_34_2: "Odpravite se za Harris"
STR_INTERCEPT_TITLE_35: "Šahovska težava"
STR_INTERCEPT_TEXT_35: "Hooperju daš položaj, ki odraža njegovo stanje: zaščiten kos, izpostavljen kralj in premik, ki izgleda varen do odgovora."
STR_INTERCEPT_CHOICE_35_0: "Prosite ga, naj prizna načrt"
STR_INTERCEPT_CHOICE_35_1: "Pošljite prijavo na Harris"
STR_INTERCEPT_TITLE_36: "Brez maske"
STR_INTERCEPT_TEXT_36: "Govorite o pritisku, namesto da bi se pretvarjali, da nikoli ni obstajal. Hooper na kratko odgovori kot oseba, ne pa kot nasprotnik."
STR_INTERCEPT_CHOICE_36_0: "Zahtevajte pošten dogovor"
STR_INTERCEPT_CHOICE_36_1: "Prosite ga, naj se spovedi"
STR_INTERCEPT_CHOICE_36_2: "Račun za Harris"
STR_INTERCEPT_TITLE_37: "Hooperjeva priznanja"
STR_INTERCEPT_TEXT_37: "Hooper razloži dovolj, da se izsiljevanje poveže z manjkajočo komponento. Harris lahko zdaj ponovno vzame opremo in preveri zgodbo."
STR_INTERCEPT_CHOICE_37_0: "Prinesite Harrisu priznanje"
STR_INTERCEPT_CHOICE_37_1: "Hooper naj gre in odide"
STR_INTERCEPT_TITLE_38: "Trgovanje"
STR_INTERCEPT_TEXT_38: "Sklenitev pogodbe brez prič ali dokazov je vabilo, da rešijo svoj problem na vaš račun."
STR_INTERCEPT_CHOICE_38_0: "Roka nad komponentami"
STR_INTERCEPT_CHOICE_38_1: "Zahteva za pričevani dogovor"
STR_INTERCEPT_CHOICE_38_2: "Preklic ponudbe"
STR_INTERCEPT_TITLE_39: "Harris posluša"
STR_INTERCEPT_TEXT_39: "Podrobnosti je mogoče preveriti. Harris vpraša, kje je komponenta zdaj. Počistite račun in zagon stroja so povezane težave, vendar niso enake."
STR_INTERCEPT_CHOICE_39_0: "Vrnite, kar je v vašem plašču"
STR_INTERCEPT_CHOICE_39_1: "Pomaga obnoviti komponento"
STR_INTERCEPT_CHOICE_39_2: "Nehajte odgovarjati zdaj"
STR_INTERCEPT_TITLE_40: "čez ograjo"
STR_INTERCEPT_TEXT_40: "Svoboda zunaj zemljišča ni enaka nedolžnosti, stroj pa je zdaj nekdo drug nujna težava."
STR_INTERCEPT_TITLE_41: "Zadnja napaka"
STR_INTERCEPT_TEXT_41: "Patrol vas doseže, preden se konča odprto zemljo, ali Hooperova obljuba propade, ko mu ni več koristna."
STR_INTERCEPT_TITLE_42: "papirjev"
STR_INTERCEPT_TEXT_42: "Načrt postavlja Hooper, kjer je vaša zgodba dejal, da je bil. Poleg tega je opomba, ki vas najprej vleče v past. Kombinacija je dovolj specifična za Harris preveriti."
STR_INTERCEPT_CHOICE_42_0: "Vzemite papirje za Harris"
STR_INTERCEPT_CHOICE_42_1: "Pričakujte in se soočite z Hooperjem"
STR_INTERCEPT_TITLE_43: "Ena zadnja ureditev"
STR_INTERCEPT_TEXT_43: "Zaupanje v njega bi odpravilo eno takojšnjo težavo; da bi Harris pričal, bi bilo težje ustvariti drugo."
STR_INTERCEPT_CHOICE_43_0: "Pripravite pričevano vrnitev"
STR_INTERCEPT_CHOICE_43_1: "Prinesite Harris v načrt"
STR_INTERCEPT_TITLE_44: "Obnovitev resničnega"
STR_INTERCEPT_TEXT_44: "Ko je račun zabeležen, se iskanje vrne na manjkajočo strojno opremo. Harris preveri strojno sobo, medtem ko ugotovite, kje naj bi bila komponenta."
STR_INTERCEPT_CHOICE_44_0: "Dokončajte preverjeno vrnitev"
STR_INTERCEPT_CHOICE_44_1: "Odstranite ga iz plašča"
STR_INTERCEPT_CHOICE_44_2: "Harris opozarja na Hooperja"
STR_INTERCEPT_TITLE_45: "Končno vprašanje"
STR_INTERCEPT_TEXT_45: "Harris čaka. Če lahko Hooper povežete s krajo, obstaja še vedno način za obnovitev komponente in pravilno končati to."
STR_INTERCEPT_CHOICE_45_0: "Predložite dokaze"
STR_INTERCEPT_CHOICE_45_1: "Priznaj, da nimaš nič več"
