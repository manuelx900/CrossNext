STR_UI_SWIPE_OR_TAP_AN_ARROW_TO_887004: "Faites glisser ou appuyez sur une flèche pour diriger. Mangez la nourriture décrite pour grandir. Évitez les murs et votre propre queue. Vous ne pouvez pas inverser la direction. Appuyez sur Pause avant de poser le lecteur. Les parties sauvegardées reprennent toujours en pause."
STR_UI_YOU_PLAY_BLACK_TAP_AN_EMPTY_29AEBA: "Vous jouez noir. Appuyez sur un carré vide qui emprisonne les disques blancs en ligne droite. Tous les disques piégés se retournent à votre couleur. L'appareil joue en blanc. Si un camp n'a aucun mouvement légal, il passe automatiquement. La plupart des disques gagnent lorsqu'aucun des deux côtés ne peut bouger."
STR_UI_MAKE_ONE_CLOSED_LOOP_EACH_NUMBER_D60227: "Créez une boucle fermée. Chaque nombre indique combien de ses quatre arêtes appartiennent à la boucle. Appuyez près d'un bord pour parcourir la ligne, la traverser et la vider. Les lignes ne peuvent pas se ramifier ou former des boucles séparées. Tous les indices doivent correspondre. Toute solution valable est acceptée."
STR_UI_CONNECT_ALL_ISLANDS_IN_ONE_NETWORK_C5618B: "Connectez toutes les îles en un seul réseau. Le numéro sur une île est le nombre de ponts requis. Appuyez sur deux îles voisines dans la même ligne ou colonne pour faire défiler les ponts un, deux et zéro. Les ponts ne peuvent pas franchir les îles. Toute solution connectée correspondant à tous les numéros gagne."
