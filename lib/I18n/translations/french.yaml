STR_QUEST_CAM_JOURNEY2_SAGA_10_10: "Vous traversez un pont suspendu et ouvrez une porte couverte de lumières. Au-delà se trouve une ancienne archive dont les livres peuvent vous indiquer où trouver le dernier sceau.\n\nUn livre indique que le troisième sceau est conservé sous les archives. Vous empruntez les escaliers dans des tunnels sombres qui mènent à une chambre scellée.\n\nVous récupérez le troisième sceau et complétez la clé. En sortant des tunnels, vous apercevez les murs de la forteresse. Un pont mène à la porte, où les derniers monstres veillent.\n\nLe Serpent du Vide ne peut plus garder l'arche. Les trois sceaux brillent lorsque vous insérez la clé dans la porte. Le château s'ouvre et seul le roi de l'oubli reste."
STR_QUEST_CAM_JOURNEY2_SAGA_11_0: "Vous atteignez enfin le château du roi de l'oubli. Il contient de nombreux livres volés par ses soldats. Ses derniers gardiens protègent le trône, et vous devez affaiblir sa magie avant de l'affronter."
STR_QUEST_CAM_JOURNEY2_SAGA_11_3: "Les pièces sont remplies de livres volés et endommagés. Vous libérez ceux encore enfermés dans des caisses, puis grimpez vers la partie la plus haute de la forteresse pour trouver la source du pouvoir du roi."
STR_QUEST_CAM_JOURNEY2_SAGA_11_6: "Les pièces sont remplies de livres volés et endommagés. Vous libérez ceux encore enfermés dans des caisses, puis grimpez vers la partie la plus haute de la forteresse pour trouver la source du pouvoir du roi.\n\nUn énorme livre contient une partie de la magie du roi. Sa serrure correspond aux trois sceaux de la clé. Lorsque vous l'ouvrez, la magie noire s'affaiblit et vous pouvez vous diriger vers le trône."
STR_QUEST_CAM_JOURNEY2_SAGA_11_9: "Les pièces sont remplies de livres volés et endommagés. Vous libérez ceux encore enfermés dans des caisses, puis grimpez vers la partie la plus haute de la forteresse pour trouver la source du pouvoir du roi.\n\nUn énorme livre contient une partie de la magie du roi. Sa serrure correspond aux trois sceaux de la clé. Lorsque vous l'ouvrez, la magie noire s'affaiblit et vous pouvez vous diriger vers le trône.\n\nLe roi fait une dernière ombre pour se protéger. Vous le faites disparaître. Aucun gardien ne se dresse désormais entre vous et la bataille pour les livres est sur le point de commencer."
STR_QUEST_CAM_JOURNEY2_SAGA_11_10: "Les pièces sont remplies de livres volés et endommagés. Vous libérez ceux encore enfermés dans des caisses, puis grimpez vers la partie la plus haute de la forteresse pour trouver la source du pouvoir du roi.\n\nUn énorme livre contient une partie de la magie du roi. Sa serrure correspond aux trois sceaux de la clé. Lorsque vous l'ouvrez, la magie noire s'affaiblit et vous pouvez vous diriger vers le trône.\n\nLe roi fait une dernière ombre pour se protéger. Vous le faites disparaître. Aucun gardien ne se dresse désormais entre vous et la bataille pour les livres est sur le point de commencer.\n\nVous battez le roi de l'oubli. Ses monstres ne peuvent plus menacer le monde et les livres volés reviennent à leurs propriétaires. De retour chez vous, vous ouvrez un livre comme vous le faisiez avant le voyage."
