STR_INTERCEPT_TITLE_0: "CABANE 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. Ils vous font attendre derrière une porte verrouillée. Un composant de la machine à calculer a disparu. L'interception matinale bruisse dans la poche de votre manteau. Dehors, les pas s'arrêtent."
STR_INTERCEPT_CHOICE_0_0: "Réfléchissez à l'accusation"
STR_INTERCEPT_CHOICE_0_1: "Attendez l'intervieweur"
STR_INTERCEPT_CHOICE_0_2: "Recherchez votre manteau"
STR_INTERCEPT_TITLE_1: "L'ACCUSATION"
STR_INTERCEPT_TEXT_1: "Ils soupçonnent une trahison. Vous résolvez des chiffres, des mots croisés et des positions d'échecs pour gagner votre vie. Cette salle est un autre problème : contredisez-vous, et votre crédibilité pourrait être la première victime."
STR_INTERCEPT_CHOICE_1_0: "Choisissez une stratégie"
STR_INTERCEPT_CHOICE_1_1: "Écoutez ce qu'ils savent"
STR_INTERCEPT_TITLE_2: "HARRIS ARRIVE"
STR_INTERCEPT_TEXT_2: "Harris entre avec une tasse de thé et un dossier. Il manque un moulinet à la Bombe. Votre nom figurait sur la liste de service. Il pose la tasse à côté de vous et vous demande où vous étiez la nuit dernière."
STR_INTERCEPT_CHOICE_2_0: "Boire le thé"
STR_INTERCEPT_CHOICE_2_1: "Laissez le thé intact"
STR_INTERCEPT_CHOICE_2_2: "Répondez calmement"
STR_INTERCEPT_TITLE_3: "LE COMPOSANT"
STR_INTERCEPT_TEXT_3: "À l'intérieur de la doublure de votre manteau, vos doigts rencontrent du métal froid. Le composant est toujours là. Hooper a dit que le prendre mettrait fin au chantage. Désormais, la porte verrouillée a une autre signification."
STR_INTERCEPT_CHOICE_3_0: "Gardez-le caché"
STR_INTERCEPT_CHOICE_3_1: "Donnez-le à Harris"
STR_INTERCEPT_TITLE_4: "UN JEU GAGNANT"
STR_INTERCEPT_TEXT_4: "La coopération pourrait préserver votre crédibilité. Un mensonge convaincant pourrait faire gagner du temps. S'échapper échangerait une pièce verrouillée contre les gardes à l'extérieur. Aucun de ces mouvements ne peut être repris."
STR_INTERCEPT_CHOICE_4_0: "Coopérer"
STR_INTERCEPT_CHOICE_4_1: "Inventez un alibi"
STR_INTERCEPT_CHOICE_4_2: "Examinez la fenêtre"
STR_INTERCEPT_TITLE_5: "LE THÉ"
STR_INTERCEPT_TEXT_5: "La pièce s'incline. Harris remarque votre silence, mais son visage s'éloigne déjà. La prochaine fois que vous ouvrez les yeux, une autre paire de chaussures se trouve près de la table."
STR_INTERCEPT_CHOICE_5_0: "Faire semblant de rester endormi"
STR_INTERCEPT_CHOICE_5_1: "Confronter le visiteur"
STR_INTERCEPT_CHOICE_5_2: "Demandez de l'eau"
STR_INTERCEPT_TITLE_6: "UN PETIT REFUS"
STR_INTERCEPT_TEXT_6: "Vous repoussez la tasse. Harris surveille le mouvement plus attentivement que la réponse. Il demande s'il y a quelqu'un d'autre qu'il devrait interroger."
STR_INTERCEPT_CHOICE_6_0: "Demandez quelles sont les preuves dont il dispose"
STR_INTERCEPT_CHOICE_6_1: "Mentionner Hooper"
STR_INTERCEPT_CHOICE_6_2: "Regardez vers la fenêtre"
STR_INTERCEPT_TITLE_7: "LA BOBINE MANQUANTE"
STR_INTERCEPT_TEXT_7: "Harris veut une réponse directe. Avez-vous pris le composant ? Vous pouvez lui dire ce qu'il y a dans votre manteau, expliquer la pression exercée par Hooper ou essayer de porter l'accusation ailleurs."
STR_INTERCEPT_CHOICE_7_0: "Donnez-lui le composant"
STR_INTERCEPT_CHOICE_7_1: "Expliquez le chantage"
STR_INTERCEPT_CHOICE_7_2: "Accuser Hooper"
STR_INTERCEPT_TITLE_8: "MÉTAL SUR LA TABLE"
STR_INTERCEPT_TEXT_8: "Le composant se situe entre vous. Harris le vérifie sans se détendre. La restitution du matériel volé n’explique pas pourquoi il a été pris. Il veut un nom et quelque chose de plus fiable que votre parole."
STR_INTERCEPT_CHOICE_8_0: "Proposez de trouver des preuves"
STR_INTERCEPT_CHOICE_8_1: "Restez et répondez aux questions"
STR_INTERCEPT_TITLE_9: "L'ALIBI"
STR_INTERCEPT_TEXT_9: "Vous décrivez une soirée tranquille à votre bureau. Harris ouvre le dossier. Un garde vous a vu quitter la salle des machines. Votre récit inventé a désormais un témoin contre lui."
STR_INTERCEPT_CHOICE_9_0: "Défendre l'histoire"
STR_INTERCEPT_CHOICE_9_1: "Admettre le chantage"
STR_INTERCEPT_CHOICE_9_2: "Refuser d'autres questions"
STR_INTERCEPT_TITLE_10: "LA FENÊTRE"
STR_INTERCEPT_TEXT_10: "La fenêtre est haute et le verre est épais. Au-delà, le chemin passe devant une autre cabane. Le casser serait bruyant ; attendre ici comporte ses propres dangers."
STR_INTERCEPT_CHOICE_10_0: "Briser le verre"
STR_INTERCEPT_CHOICE_10_1: "Étudiez le chemin à l'extérieur"
STR_INTERCEPT_CHOICE_10_2: "Retour à l'entretien"
STR_INTERCEPT_TITLE_11: "UN AUTRE VISITEUR"
STR_INTERCEPT_TEXT_11: "Hooper est venu alors que vous êtes instable. Il veut savoir si Harris possède le composant. Il garde une main près de la porte."
STR_INTERCEPT_CHOICE_11_0: "Faire semblant de dormir"
STR_INTERCEPT_CHOICE_11_1: "Exiger une explication"
STR_INTERCEPT_CHOICE_11_2: "Demandez de l'eau"
STR_INTERCEPT_TITLE_12: "UN AVERTISSEMENT"
STR_INTERCEPT_TEXT_12: "Vous appelez Harris avant que le thé ne prenne le dessus. Il revient, irrité. Une accusation concernant la coupe nécessitera quelque chose qu'il pourra tester."
STR_INTERCEPT_CHOICE_12_0: "Conservez la coupe comme preuve"
STR_INTERCEPT_CHOICE_12_1: "Accusez Harris de vous avoir empoisonné"
STR_INTERCEPT_CHOICE_12_2: "Concentrez-vous sur la bobine"
STR_INTERCEPT_TITLE_13: "HOOPER"
STR_INTERCEPT_TEXT_13: "Harris reconnaît le nom. Hooper est utile, bien connecté et n'est pas non plus absent de la liste d'hier soir. La reconnaissance n'est pas une preuve."
STR_INTERCEPT_CHOICE_13_0: "Trouvez quelque chose de vérifiable"
STR_INTERCEPT_CHOICE_13_1: "Insistez sur le fait que Hooper l'a volé"
STR_INTERCEPT_TITLE_14: "CHANTAGE"
STR_INTERCEPT_TEXT_14: "Vous décrivez un jeune homme, une confiance trahie, et l'exigence qui a suivi. Harris écoute sans vous aider. Nommer la personne qui a tendu le piège pourrait également révéler la personne que vous espériez protéger."
STR_INTERCEPT_CHOICE_14_0: "Donnez à Harris le compte complet"
STR_INTERCEPT_CHOICE_14_1: "Oubliez les noms"
STR_INTERCEPT_CHOICE_14_2: "Proposer un moyen d'attraper Hooper"
STR_INTERCEPT_TITLE_15: "UNE ACCUSATION FACILE"
STR_INTERCEPT_TEXT_15: "Hooper, dites-vous, doit être responsable. Harris demande comment vous le savez. Il y a une différence entre résoudre un problème et produire un témoin capable de prouver la réponse."
STR_INTERCEPT_CHOICE_15_0: "Laissez Harris contester cette affirmation"
STR_INTERCEPT_CHOICE_15_1: "Essayez d'envoyer un message privé à Hooper"
STR_INTERCEPT_TITLE_16: "UN INDICE TESTABLE"
STR_INTERCEPT_TEXT_16: "Une histoire peut être refusée. Un document, un témoin ou un élément manquant est plus difficile à expliquer. Vous avez un peu de temps pour choisir ce que vous souhaitez poursuivre."
STR_INTERCEPT_CHOICE_16_0: "Inspectez la cabane à proximité"
STR_INTERCEPT_CHOICE_16_1: "Utilisez l'interception du matin"
STR_INTERCEPT_CHOICE_16_2: "Interrogez directement Hooper"
STR_INTERCEPT_TITLE_17: "PLUS QU'UN RETOUR"
STR_INTERCEPT_TEXT_17: "La machine peut à nouveau fonctionner, mais Harris a encore une faille de sécurité à expliquer. Il vous offre une dernière opportunité d'établir qui l'a organisé."
STR_INTERCEPT_CHOICE_17_0: "Montrer les preuves"
STR_INTERCEPT_CHOICE_17_1: "Rechercher une preuve"
STR_INTERCEPT_CHOICE_17_2: "Acceptez son jugement"
STR_INTERCEPT_TITLE_18: "UNE CONTRADICTION"
STR_INTERCEPT_TEXT_18: "Harris place votre première réponse à côté de votre dernière. Les deux ne peuvent pas être vrais. Vous pouvez abandonner le mensonge ou laisser l’entretien se terminer sur une contradiction."
STR_INTERCEPT_CHOICE_18_0: "Dites la vérité sur le chantage"
STR_INTERCEPT_CHOICE_18_1: "Continue de tout nier"
STR_INTERCEPT_CHOICE_18_2: "Essayez de partir"
STR_INTERCEPT_TITLE_19: "SILENCE"
STR_INTERCEPT_TEXT_19: "Vous croisez les bras. Harris ferme le dossier. Dans cette salle, le silence ne met pas fin à l’enquête ; cela ne fait que mettre fin à votre rôle dans la direction."
STR_INTERCEPT_CHOICE_19_0: "Écoutez la décision"
STR_INTERCEPT_TITLE_20: "VERRE CASSÉ"
STR_INTERCEPT_TEXT_20: "La vitre cède. L'air froid et le son du sifflet d'un garde arrivent ensemble. Il est temps de prendre une décision avant que quelqu'un n'atteigne la porte."
STR_INTERCEPT_CHOICE_20_0: "Courir vers le chemin extérieur"
STR_INTERCEPT_CHOICE_20_1: "Laisser un indice codé"
STR_INTERCEPT_CHOICE_20_2: "Reste et explique"
STR_INTERCEPT_TITLE_21: "ENTRE LES CABINES"
STR_INTERCEPT_TEXT_21: "Le chemin est mouillé. La cabane de Hooper est suffisamment proche pour qu'on puisse l'atteindre avant la prochaine patrouille, mais le terrain découvert au-delà offre un autre type de chance."
STR_INTERCEPT_CHOICE_21_0: "Essayez de vous échapper du terrain"
STR_INTERCEPT_CHOICE_21_1: "Entrez dans la cabane de Hooper"
STR_INTERCEPT_CHOICE_21_2: "Retour à Harris"
STR_INTERCEPT_TITLE_22: "UN JEU PRIVÉ"
STR_INTERCEPT_TEXT_22: "Hooper vous étudie. Sur la table, il trace avec ses doigts une position d'échecs imaginaire. Une réponse codée pourrait lui faire révéler ce qu’une accusation directe ne ferait jamais."
STR_INTERCEPT_CHOICE_22_0: "Répondez avec un indice d'échecs"
STR_INTERCEPT_CHOICE_22_1: "Menacer de le nommer"
STR_INTERCEPT_CHOICE_22_2: "Parlez honnêtement"
STR_INTERCEPT_TITLE_23: "FACE À FACE"
STR_INTERCEPT_TEXT_23: "Hooper demande ce que vous pouvez réellement prouver. Sa confiance ne faiblit que lorsque vous mentionnez des détails qu'une personne extérieure à son plan ne devrait pas connaître."
STR_INTERCEPT_CHOICE_23_0: "Confrontez-le avec des preuves"
STR_INTERCEPT_CHOICE_23_1: "Proposer le composant en échange"
STR_INTERCEPT_CHOICE_23_2: "Bluff"
STR_INTERCEPT_TITLE_24: "LA COUPE"
STR_INTERCEPT_TEXT_24: "Hooper apporte de l'eau mais prend d'abord la tasse de thé. Garder cette coupe pourrait être plus utile que d’accepter tout ce qu’il propose."
STR_INTERCEPT_CHOICE_24_0: "Gardez la tasse"
STR_INTERCEPT_CHOICE_24_1: "Vérifiez à nouveau votre manteau"
STR_INTERCEPT_TITLE_25: "QUELQUE CHOSE À TESTER"
STR_INTERCEPT_TEXT_25: "Vous gardez la coupe et demandez à Harris de la faire examiner. Il s’agit finalement d’une allégation à laquelle est attaché un objet. La tentative de Hooper de le supprimer fournit un deuxième détail utile."
STR_INTERCEPT_CHOICE_25_0: "Donnez la coupe à Harris"
STR_INTERCEPT_CHOICE_25_1: "Affrontez Hooper avec lui"
STR_INTERCEPT_TITLE_26: "LA MAUVAISE CIBLE"
STR_INTERCEPT_TEXT_26: "Vous accusez Harris sans preuves. Il voit un suspect tenter de discréditer l'enquêteur. Quoi qu’il soit arrivé au thé, vous avez rendu plus difficile pour lui de vous croire."
STR_INTERCEPT_CHOICE_26_0: "L'entretien se termine"
STR_INTERCEPT_TITLE_27: "TOUT LE COMPTE"
STR_INTERCEPT_TEXT_27: "Vous donnez les noms et décrivez la réunion. Harris pose des questions précises. Votre embarras est réel, tout comme les détails qu’il peut désormais vérifier."
STR_INTERCEPT_CHOICE_27_0: "Laissez-le vérifier le compte"
STR_INTERCEPT_CHOICE_27_1: "Offrez de retrouver Hooper"
STR_INTERCEPT_TITLE_28: "UN BLUFF MANQUÉ"
STR_INTERCEPT_TEXT_28: "Harris a entendu suffisamment de réponses confiantes. Hooper aussi. Ni l’un ni l’autre ne prouve que votre histoire est manquante."
STR_INTERCEPT_CHOICE_28_0: "Persister dans la réclamation"
STR_INTERCEPT_CHOICE_28_1: "Échappez-vous désespérément"
STR_INTERCEPT_CHOICE_28_2: "Admettre ce qui s'est réellement passé"
STR_INTERCEPT_TITLE_29: "L'INTERCEPTION"
STR_INTERCEPT_TEXT_29: "La feuille dans votre poche transporte bien plus que des lettres en désordre : son parcours à travers les cabanes place Hooper à proximité de la machine. Un indice concis pourrait inciter la bonne personne à regarder au bon endroit."
STR_INTERCEPT_CHOICE_29_0: "Encoder un message pour Hooper"
STR_INTERCEPT_CHOICE_29_1: "Afficher l'itinéraire vers Harris"
STR_INTERCEPT_TITLE_30: "LA MACHINE FONCTIONNE"
STR_INTERCEPT_TEXT_30: "Harris a la composante et une piste qui mène au-delà de vos premières réponses effrayées. La Bombe reprend son travail. Vous quittez la Hutte 14 sous votre propre nom, avec moins de secrets et un avenir encore à répondre."
STR_INTERCEPT_TITLE_31: "SOUS SUSPICION"
STR_INTERCEPT_TEXT_31: "Le retour du composant a évité un retard à la machine. Cela n'a pas sauvegardé votre position. Harris met fin à votre accès aux cabanes pendant que l'enquête se poursuit. Vous avez survécu à l’entretien, mais vous n’avez pas innocenté votre nom."
STR_INTERCEPT_TITLE_32: "EN GARDE"
STR_INTERCEPT_TEXT_32: "La porte s'ouvre pour le gardien plutôt que pour vous. Les contradictions, les preuves manquantes et un composant volé sont devenus un dossier que vous ne pouvez plus diriger. Cette tentative se termine ici."
STR_INTERCEPT_TITLE_33: "LE CHEMIN EXTÉRIEUR"
STR_INTERCEPT_TEXT_33: "Vous quittez les cabanes. L'obscurité est utile, mais les lieux sont surveillés. Une vitre brisée a rapproché les patrouilles plus près que vous ne l'espériez."
STR_INTERCEPT_CHOICE_33_0: "Traverser le terrain découvert"
STR_INTERCEPT_CHOICE_33_1: "Rester sur le chemin de service"
STR_INTERCEPT_CHOICE_33_2: "Retournez-vous et faites face à Harris"
STR_INTERCEPT_TITLE_34: "CABANE DE HOOPER"
STR_INTERCEPT_TEXT_34: "Le bureau est sans surveillance. Les papiers se trouvent sous des mots croisés et la salle des machines apparaît dans un tableau dessiné au crayon. Des pas s'approchent le long des planches à l'extérieur."
STR_INTERCEPT_CHOICE_34_0: "Examiner les papiers"
STR_INTERCEPT_CHOICE_34_1: "Attendez Hooper"
STR_INTERCEPT_CHOICE_34_2: "Départ pour Harris"
STR_INTERCEPT_TITLE_35: "UN PROBLÈME D'ÉCHECS"
STR_INTERCEPT_TEXT_35: "Vous donnez à Hooper une position qui reflète sa situation difficile : une pièce protégée, un roi exposé et un mouvement qui semble sûr jusqu'à la réponse. Il comprend l'avertissement. Ses prochains mots fournissent la connexion dont vous aviez besoin."
STR_INTERCEPT_CHOICE_35_0: "Demandez-lui d'admettre le plan"
STR_INTERCEPT_CHOICE_35_1: "Envoyez l'admission à Harris"
STR_INTERCEPT_TITLE_36: "SANS MASQUE"
STR_INTERCEPT_TEXT_36: "Vous parlez de la pression au lieu de prétendre qu'elle n'a jamais existé. Hooper répond brièvement en tant que personne plutôt qu'en tant qu'adversaire. Cette ouverture pourrait être utilisée pour un échange ou un piège."
STR_INTERCEPT_CHOICE_36_0: "Demandez un arrangement honnête"
STR_INTERCEPT_CHOICE_36_1: "Demandez-lui d'avouer"
STR_INTERCEPT_CHOICE_36_2: "Apportez le compte à Harris"
STR_INTERCEPT_TITLE_37: "ADMISSION DE HOOPER"
STR_INTERCEPT_TEXT_37: "Hooper en explique suffisamment pour relier le chantage au composant manquant. Harris peut désormais récupérer l'équipement et vérifier l'histoire. Vous devez décider si vous souhaitez terminer l'enquête ou laisser Hooper disparaître."
STR_INTERCEPT_CHOICE_37_0: "Apportez à Harris l'admission"
STR_INTERCEPT_CHOICE_37_1: "Laisse Hooper partir et partir"
STR_INTERCEPT_TITLE_38: "LE COMMERCE"
STR_INTERCEPT_TEXT_38: "Vous placez votre dernier levier à la portée de Hooper. Une affaire sans témoin ni preuve est une invitation pour lui à résoudre son problème à vos dépens."
STR_INTERCEPT_CHOICE_38_0: "Remettre le composant"
STR_INTERCEPT_CHOICE_38_1: "Exiger un accord devant témoin"
STR_INTERCEPT_CHOICE_38_2: "Retirer l'offre"
STR_INTERCEPT_TITLE_39: "HARRIS ÉCOUTE"
STR_INTERCEPT_TEXT_39: "Les détails peuvent être vérifiés. Harris demande où se trouve actuellement le composant. Effacer votre compte et faire fonctionner la machine sont des problèmes liés, mais ce ne sont pas les mêmes."
STR_INTERCEPT_CHOICE_39_0: "Rendez ce qu'il y a dans votre manteau"
STR_INTERCEPT_CHOICE_39_1: "Aide à récupérer le composant"
STR_INTERCEPT_CHOICE_39_2: "Arrêtez de répondre maintenant"
STR_INTERCEPT_TITLE_40: "AU-DELÀ DE LA CLÔTURE"
STR_INTERCEPT_TEXT_40: "Les cabanes disparaissent derrière vous. La liberté en dehors des terrains n'est pas la même chose que l'innocence, et la machine est désormais le problème urgent de quelqu'un d'autre. Vous vous êtes échappé ; le récit reste inachevé."
STR_INTERCEPT_TITLE_41: "LA DERNIÈRE ERREUR"
STR_INTERCEPT_TEXT_41: "La patrouille vous atteint avant la fin du terrain découvert, ou la promesse de Hooper s'effondre lorsqu'elle ne lui est plus utile. Vous êtes à court de mouvements sûrs. L'histoire peut être recommencée depuis le début."
STR_INTERCEPT_TITLE_42: "LES PAPIERS"
STR_INTERCEPT_TEXT_42: "Le planning place Hooper là où votre histoire dit qu'il se trouvait. À côté se trouve la note qui vous a attiré pour la première fois dans le piège. La combinaison est suffisamment spécifique pour que Harris puisse la vérifier."
STR_INTERCEPT_CHOICE_42_0: "Apportez les papiers à Harris"
STR_INTERCEPT_CHOICE_42_1: "Attendez et affrontez Hooper"
STR_INTERCEPT_TITLE_43: "UN DERNIER ARRANGEMENT"
STR_INTERCEPT_TEXT_43: "Hooper propose de remettre la pièce. Lui faire confiance éliminerait un problème immédiat ; faire de Harris un témoin rendrait plus difficile la création d’un autre."
STR_INTERCEPT_CHOICE_43_0: "Organiser un retour assisté"
STR_INTERCEPT_CHOICE_43_1: "Intégrez Harris au plan"
STR_INTERCEPT_TITLE_44: "RÉCUPÉRATION DE LA BOBINE"
STR_INTERCEPT_TEXT_44: "Le compte étant enregistré, la recherche revient au matériel manquant. Harris vérifie la salle des machines pendant que vous identifiez l'emplacement du composant."
STR_INTERCEPT_CHOICE_44_0: "Terminez le retour vérifié"
STR_INTERCEPT_CHOICE_44_1: "Récupérez-le sur votre manteau"
STR_INTERCEPT_CHOICE_44_2: "Avertir Harris de Hooper"
STR_INTERCEPT_TITLE_45: "LA DERNIÈRE QUESTION"
STR_INTERCEPT_TEXT_45: "Harris attend. Si vous pouvez relier Hooper au vol, il existe toujours un moyen de récupérer le composant et d'y mettre fin correctement. Sinon l'enquête n'a que votre compte changeant."
