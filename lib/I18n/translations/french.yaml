STR_CAR_INTRO: "La culpabilité et l'honnêteté sont indépendantes. Chaque cas a exactement une solution. Les hauteurs sont des traits de caractère fictifs."
STR_CAR_HELP_TEXT: "Comment résoudre un cas ?\nChaque personnage fait une déclaration. Le haut de l'écran donne le nombre exact de coupables et de fausses déclarations. Trouvez une combinaison qui satisfait les deux comptes. Chaque cas a une solution.\n  \nLa culpabilité n'est pas honnête\nUn personnage innocent peut mentir, et un coupable peut dire la vérité. Deux mensonges signifient exactement que deux déclarations entières sont fausses; les autres sont vraies. Les marques Vérité / Mensonge se réfèrent à la déclaration; Suspect se réfère à la culpabilité.\n  \nLIRE LES INDICES\n\"A ou B l'a fait (ou les deux)\" signifie qu'au moins un personnage nommé est coupable. \"A et B l'ont fait\" requiert les deux. Un mensonge nie toute la déclaration: un faux OU signifie que ni l'un ni l'autre ne l'a fait; un faux ET signifie qu'au moins un n'a pas fait.\n  \n\"Les deux sont véridiques ou les deux mentent\" compare les déclarations, pas la culpabilité. \"Exactement l'un ment\" signifie que leurs déclarations ont des valeurs de vérité différentes. Ces indices peuvent eux-mêmes être vrais ou faux.\n  \nLES VOISINS SUR UN PETIT ÉCRAN\nL'ordre circulaire original est Panther, Peacock, Shark, Fox, Bear, Stag, Horse, en utilisant uniquement les caractères de ce cas. Le dernier et le premier sont des voisins. Cette application écrit les deux noms directement dans chaque indice voisin. Vous n'avez jamais besoin de deviner quelles cartes sont à côté d'un portrait. Changer la page ou l'orientation ne change pas un indice.\n  \nTaille et alimentation\nChaque carte montre une taille et un régime alimentaire fictifs. « Un coupable est plus grand que moi » signifie qu'au moins un coupable est plus grand que l'orateur, pas nécessairement tous les coupables. Plus court fonctionne de la même manière. Les indices carnivore et herbivore signifient qu'au moins un coupable a ce régime; les omnivores ne comptent comme ni l'un ni l'autre. Les noms, les tailles et les régimes sont des faits fiables; les déclarations peuvent mentir.\n  \nVOTRE ANALYSE\nUtilisez ? / Vérité / Mensonge et Suspect sous chaque déclaration pour enregistrer des hypothèses. Ce sont vos notes, pas des preuves ou des vérifications automatiques. Les flèches montrent les autres caractères. Le mode portrait affiche jusqu'à trois par page.\n  \nFaire une accusation\nAppuyez sur Accuser et sélectionnez exactement le nombre requis de coupables. Seule la confirmation d'une mauvaise accusation passe une vie. Débutant et Normal ont deux vies; Avancé et Expert en ont une. Une accusation correcte résout l'affaire. Avec aucune vie restante, la solution est révélée.\n  \nCAMPAGNE ET REPLAY\nIl y a 1470 cas. Le cas ouvert reprend la tentative en cours ou ouvre le prochain après un fermé. La campagne vous permet de choisir n'importe lequel des 1470 cas dans n'importe quel ordre depuis le début. Rejouer commence une nouvelle tentative tout en préservant l'achèvement antérieur. Dans chaque difficulté, les cas progressent d'un coupable à deux, puis de moins de menteurs à plus au sein de chaque groupe de coupables. Le débutant garde un coupable. Les plus petits lancements viennent en premier lorsque les comptes correspondent. Tous les cas restent disponibles. Résoudre un cas précédemment épuisé le met à niveau vers résolu.\n  \nLa progression et les vies sont enregistrées sur la carte SD. Quitter, mettre en veille ou redémarrer un appareil ne restaure pas les vies dans la tentative actuelle. Une sauvegarde échouée bloque le résultat jusqu'à ce que Retry réussisse. Réinitialiser tout demande une confirmation avant d'effacer seulement la progression Carnivore."
