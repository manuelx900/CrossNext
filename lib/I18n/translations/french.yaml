STR_INTERCEPT_ABOUT: "Une adaptation condensée de The Intercept par Inkle, 2016, utilisée sous licence MIT. Bletchley Park, 1942 : un élément de machine manquant, du chantage et un entretien qui peut aboutir à la liberté ou à la détention.\n\nVos décisions et votre position sont enregistrées après chaque choix. Une nouvelle histoire réinitialise ce playthrough. Des illustrations originales ont été créées pour ce firmware. Le script original et la licence sont inclus dans le projet."
