STR_DRAUGHTS_HELP: "Appuyez sur une pièce, puis sur sa destination. Des captures sont requises ; terminer chaque saut. International : 10x10, 20 pièces, captures arrière, rois volants et capture maximale. Brésilien : mêmes règles de capture sur 8x8 avec 12 pièces. Espagnol : les hommes capturent des rois volants en avant ; prenez la plupart des pièces, puis la plupart des rois. Anglais : rois courts, captures de l'homme avancé, toute chaîne de capture complète. Atteindre la rangée de couronnes termine un tour anglais ou espagnol. Choisissez les règles, l'adversaire et la difficulté dans les paramètres. Le mode local permet à deux personnes de partager le lecteur. Les changements de règles s'appliquent à un nouveau jeu."
