STR_UI_EVERY_PAIR_OF_THINGS_MEETS_IN_1E0DCF: "Appuyez sur une paire : d'abord X, puis confirmé. La confirmation exclut le reste de sa ligne et de sa colonne avec des marques plus claires. La grille n'efface que ses propres marques ; les vôtres restent jusqu'à ce que vous les effaciez."
STR_UI_READ_ONE_MARK_WHAT_IT_RULES_5DA72B: "Lisez-en un, marquez ce qu'il exclut, appuyez sur son numéro pour le cocher. Les indices ne mentent jamais, à moins que l’affaire n’indique qu’un suspect parle."
