STR_QUEST_CAM_JOURNEY2_BOOK_11: "La dernière page"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Après avoir vaincu le roi de l'oubli, vous rentrez chez vous. Son armée ne peut plus détruire les livres et les gens lisent à nouveau en paix. Vous avez sauvé les histoires du monde. Il reste encore de nombreux livres à découvrir."
