STR_QUEST_CAM_JOURNEY_DAILYREQUEST_2: "Lisez ces noms avec moi. Je veux qu'une famille attende quand le prochain bateau arrive."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_3: "Lisez cette histoire avant que je la déplace sur une étagère plus haute, j'ai besoin de savoir quels mots manquent encore."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_4: "Lisez avec moi les mots des voyageurs. Je ne veux pas confondre un vieil avertissement avec un appel à suivre."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Lisez ces récits au coin du feu. Avant de voyager, je veux que chacun entende son propre nom."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_6: "Lisez cette page avec moi avant que les cloches ne sonnent. J'ai besoin de me souvenir de plus que l'heure sur le cadran."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_7: "Lisez ce témoignage dans son intégralité. Il y a des gens ici qui ont attendu trop longtemps pour être entendus."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Lisez ce souvenir près de la fontaine. J'aimerais savoir ce que la personne qui a planté ici espérait laisser derrière elle."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Lisez les histoires que nous vous avons envoyées, les voix de la maison peuvent vous tenir compagnie, même si loin."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Lisez cette lettre avant de partir. Vous n’êtes pas obligé de porter seul chaque souvenir."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_11: "Lisez les mots que nous avons gardés pour vous. La forteresse n’est pas le monde entier, aussi calme soit-elle."
