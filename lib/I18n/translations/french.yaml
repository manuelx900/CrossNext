STR_PET_STORY_0: "La graine"
STR_PET_STORY_TEXT_0: "Vous terminez un chapitre. A côté de votre compagnon, une minuscule graine a germé. Vous lui donnez une place près de la fenêtre."
STR_PET_STORY_1: "Un jour de pluie"
STR_PET_STORY_TEXT_1: "Rain tape sur la fenêtre pendant que vous lisez. Votre compagnon se blottit à proximité. Pendant un moment, toute la pièce ressemble à un abri."
STR_PET_STORY_2: "Le visiteur"
STR_PET_STORY_TEXT_2: "Un oiseau se pose près de la fenêtre. Votre compagnon regarde tranquillement jusqu'à ce qu'il s'envole. Vous marquez votre page et souriez."
STR_PET_STORY_3: "Un bateau en papier"
STR_PET_STORY_TEXT_3: "Un bout de papier devient un petit bateau. Votre compagnon le suit à travers la table, comme s'il contenait toute une aventure."
STR_PET_STORY_4: "Sous les étoiles"
STR_PET_STORY_TEXT_4: "Après la lecture, vous regardez ensemble. Une seule étoile apparaît, puis une autre. Il y a encore tellement de choses à découvrir."
STR_PET_STORY_5: "La feuille perdue"
STR_PET_STORY_TEXT_5: "Votre compagnon vous apporte une feuille. Vous le gardez à côté de votre marque-page : un petit cadeau d'une journée ordinaire."
STR_PET_STORY_6: "Un coin tranquille"
STR_PET_STORY_TEXT_6: "Vous trouvez un coin confortable et ouvrez votre livre. Votre compagnon s'installe à côté de vous. Aucun de vous n’est pressé."
STR_PET_STORY_7: "Un nouveau chemin"
STR_PET_STORY_TEXT_7: "Une page de plus vous emmène dans un nouvel endroit. Votre compagnon s'étire et vous regarde, prêt pour le chapitre de demain."
