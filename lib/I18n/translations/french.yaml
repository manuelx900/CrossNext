STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Le début de l'aventure"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Pendant de nombreuses années, les gens ont vécu en paix et ont apprécié leurs livres. Puis le Roi de l’Oblivion commença à les détruire. Il voulait empêcher tout le monde de lire et faire disparaître à jamais toutes les histoires."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Les monstres du roi"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Le roi de l'oubli a envoyé ses monstres partout dans le monde. Ils ont détruit tous les livres qu'ils ont trouvés et ont attaqué tous ceux qui tentaient de les arrêter. Les bibliothèques ont commencé à disparaître et les gens ont arrêté de lire."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Le pouvoir de la lecture"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Un jour, alors que vous lisez près de votre village, un monstre apparaît. Vous essayez de vous échapper, mais quelque chose de surprenant se produit : plus vous lisez, plus il s'affaiblit. Vous réalisez que la lecture est le seul moyen de combattre la magie du roi."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Votre mission"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Vous avez décidé d'arrêter le roi. Sur votre chemin vers son château, vous devez traverser des forêts, des villes, des montagnes et d'autres lieux pleins d'ennemis. Chaque monstre que vous battez vous rapproche un peu plus. Continuez à lire, battez ses gardiens et atteignez-le avant qu'il ne détruise tous les livres du monde."
