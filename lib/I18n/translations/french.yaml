STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_0: "Aidez-moi à comparer les pages que nous rapportons à la maison. Un nom en marge peut nous indiquer à quelle famille appartient un souvenir."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "Lisez les récits que les voisins ont apportés sur la place. Nous devons mettre chaque nom à côté de la vie à laquelle il appartient."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "Aidez-moi à comparer les récits des marins, je ne peux pas envoyer un autre bateau dans un chenal dont nous ne nous souvenons plus."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "Aidez-moi à lire les volumes sauvés. Lorsqu’ils quittent ces pièces, je veux que quelqu’un sache de qui ils racontent les histoires."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "Aidez-moi à comparer les récits des refuges. Le prochain voyageur devrait trouver un chemin, pas un autre écho trompeur."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "Aidez-nous à comparer les anciens voyages. Un puits dont on se souvient peut faire la différence entre arriver et disparaître dans le sable."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "Aide-moi à écouter les récits des voisins. Une horloge ne peut pas me dire ce qu’ils espéraient faire de la journée."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "Aidez-nous à lire les récits arrivant des régions libérées. Le palais a passé suffisamment d’années à ne parler qu’à lui-même."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Aidez-moi à mettre les histoires des jardiniers dans l'ordre, ces graines ont besoin de plus qu'un nom sur un paquet."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Aidez-nous à maintenir ces histoires en circulation. Je veux que les gens que nous avons trouvés puissent s'entendre."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Aidez-nous à lire les histoires qui atteignent la dernière route, chacune appartenant à quelqu'un qui attend au-delà des murs du roi."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Aidez-nous à lire ces histoires dans leur intégralité, car après une si longue séparation, leurs propriétaires méritent plus qu’un nom sur une liste."
STR_QUEST_CAM_JOURNEY_THANKS_0: "Liora lisse la page avec sa paume. «Je peux réentendre cette phrase», dit-elle. Ce soir, elle laissera le livre ouvert à côté de la lampe."
STR_QUEST_CAM_JOURNEY_THANKS_1: "Au kiosque, quelqu’un déplace une chaise pour vous faire place. Une histoire inachevée a acquis une autre ligne. Son propriétaire ramène la page à la maison les deux mains."
STR_QUEST_CAM_JOURNEY_THANKS_2: "Mara plie une page nouvellement lisible et la place à côté de son carnet de marée. Avant de retourner à la fenêtre, elle vous remercie d'une voix rauque par l'air salin."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Iri pose une bande de tissu sec entre deux pages. \" Celui-là peut voyager maintenant. \" Elle tient le volume contre sa poitrine avant de le porter vers les autres livres."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Taren pose sa meute sur la pierre et écoute pendant que vous terminez. Puis il répète les paroles d'un voyageur, cette fois sans avoir besoin de regarder la page."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Nadir tire un ruban entre ses doigts, lisant un nom difficile à déchiffrer auparavant. Il vous fait une place près du feu."
STR_QUEST_CAM_JOURNEY_THANKS_6: "Orin dépose l’outil qu’il tourne entre ses doigts, il parle un moment de la personne de l’histoire et on laisse l’horloge tic-tac."
STR_QUEST_CAM_JOURNEY_THANKS_7: "Sera déplace l'histoire loin de la pile des ordres royaux, elle demande une autre chaise, puis écoute les dernières lignes avec vous."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Aster marque une page avec une feuille propre. Elle vous remercie doucement ; un peu plus tard, on l'entend lire le même passage à côté de la fontaine."
STR_QUEST_CAM_JOURNEY_THANKS_9: "Une courte note arrive avec le prochain paquet de pages. Liora a copié un passage que vous avez aidé à restaurer ; en marge, elle a écrit : « Nous avons lu celui-ci ensemble à la maison. »"
STR_QUEST_CAM_JOURNEY_THANKS_10: "La note ne fait que quelques lignes. Liora a laissé la place à une réponse, comme si elle vous voyait déjà assis à l'autre bout de la table."
STR_QUEST_CAM_JOURNEY_THANKS_11: "Parmi les pages récupérées, vous trouvez la note pliée de chez vous. Sa dernière phrase est simple : « Il y a encore une place pour vous ici. »"
