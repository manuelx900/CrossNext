STR_CAR_INTRO: "Вина і чесність є незалежними. Кожен випадок має саме одне рішення. Висоти - це вигадані риси персонажів."
STR_CAR_HELP_TEXT: "Як розв' язати справу\nКожен з персонажів робить одне твердження. У верхній частині екрана показано точну кількість винуватців і хибних тверджень. Знайдіть комбінацію, яка задовольняє обом умовам. Кожен випадок має один розв’ язок.\n  \nВина - це не чесність\nНевинний персонаж може брехати, а винуватець може сказати правду. Дві брехні означають, що всього два цілих твердження є хибними; інші є істинними. Позначки « Правда » або « Брехня » відносяться до твердження, « Підозрюваний » — до провини.\n  \nЧИТАННЯ ПІДКАЗОК\n« A або B зробили це (або обидва) » означає, що принаймні один з названих персонажів є винним. « A і B зробили це » вимагає, щоб обидва були винними. Неправда заперечує ціле твердження: хибний OR означає, що жоден з персонажів не зробив цього; хибний AND означає, що принаймні один з персонажів не зробив цього.\n  \n« Обидва правдиві або обидва брешуть » порівнює твердження, а не вину. « Одне з них бреше » означає, що їхні твердження мають різні значення істинності. Ці підказки самі по собі можуть бути істинними або хибними.\n  \nСУСІДИ НА МАЛОМУ ЕКРАНІ\nПочатковий круговий порядок: пантера, павук, акула, лисиця, ведмідь, олень, кінь, використовуючи лише символи цього регістру. Останні два символи — це сусіди. Ця програма записує дві назви безпосередньо до кожної підказки про сусіда. Вам ніколи не доведеться вгадувати, які карти знаходяться поруч з портретом. Зміна сторінки або орієнтації не змінює підказку.\n  \nВисота і вага\nНа кожній картці показано вигаданий зріст і раціон харчування. « Винуватець більший за мене » означає, що принаймні один з винуватців більший за мовця, але не обов’ язково всі винуватці. Коротші відповіді працюють так само. Підказки про м’ ясоїдів і травоїдів означають, що принаймні один з винуватців має таку дієту; всеїдні вважаються ні тими, ні іншими. Імена, зріст і раціон харчування є надійними фактами; твердження можуть бути хибними.\n  \nВАШ АНАЛІЗ\nСкористайтеся? / Правда / Брехня і Підозрюваний під кожним твердженням, щоб записати гіпотези. Це ваші нотатки, а не докази або автоматичні перевірки. Стрілками показано інші символи. У портретному режимі буде показано до трьох символів на сторінку.\n  \nЗвинувачення\nНатисніть кнопку Звинувачення і оберіть потрібну кількість злочинців. Тільки підтвердження неправильного звинувачення витрачає життя. Початківці та звичайні гравці мають два життя; досвідчені гравці та експерти мають одне життя. Правильне звинувачення розв’ язує справу. Якщо у гравця не залишилося життя, буде показано рішення.\n  \nКАМПАНІЯ І ПОВТОРЕННЯ\nІснує 1470 випадків. Відкритий випадок відновлює поточну спробу або відкриває наступний випадок після закритого. Кампанія надає вам змогу обрати будь- яке з 1470 випадків у будь- якому порядку з самого початку. Повторний випадок починає нову спробу, зберігаючи попереднє завершення. У межах кожного рівня складності випадки розвиваються від одного злочинця до двох, потім від меншої кількості брехунів до більшої кількості у кожній групі злочинців. Початківець зберігає одного злочинця. Менші випадки починаються першими, коли кількість випадків збігається. Всі випадки залишаються доступними. Розв’ язання раніше вичерпаного випадку перетворює його на розв’ язане.\n  \nПрогрес і життя зберігаються на SD- картці. Вихід з гри, перехід у режим сну або перезапуск пристрою не відновлюють життя за поточної спроби. Неможливість збереження блокує результат до успішного повторення спроби. Відновити всі запитує про підтвердження перед вилученням лише прогресу в грі « М’ ясоїд »."
