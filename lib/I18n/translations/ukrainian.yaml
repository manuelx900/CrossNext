STR_QUEST_CAM_JOURNEY2_SAGA_7_9: "У палаці кидаються в очі стародавні символи та малюнок ключа. Ключ, здається, належить королівському замку, тому ви шукаєте в палацових книгах, щоб дізнатися більше.\n\nУ старій книзі сказано, що замок відкривається спеціальним ключем і трьома печатками. Ключ може бути в саду позаду палацу. Тепер ви знаєте, що вам потрібно і де шукати в першу чергу.\n\nСтаре дзеркало виявляє приховані сліди на стінах. Вони ведуть до механізму задніх воріт. Поза нею ви бачите сухі дерева та занедбаний фонтан, але велика тінь охороняє шлях."
