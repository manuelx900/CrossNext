STR_PET_GUIDE_SATIETY: "Насичення: 100 означає, що ви не голодні. Їжа збільшує це значення."
STR_PET_GUIDE_MOOD: "Гладь улюбленця та грайся з ним. Читання також покращує його настрій."
STR_PET_GUIDE_ENERGY: "Вибирайте відпочинок, коли ви втомилися: ваш вихованець відпочиває 2 години."
STR_PET_GUIDE_HYGIENE: "Очистіть свого вихованця безкоштовно, щоб допомогти запобігти хвороби.Якщо він вже хворий, дайте йому ліки в здоров'я."
STR_PET_GUIDE_READING: "Вибирайте яйце і підніміть свого вихованця, читаючи. Дайте йому їжу, компанію, відпочинок і прибирання."
STR_PET_GUIDE_HOME: "Заробіть прикраси, читаючи.Поставте або видаліть їх вільно; ви зберігаєте кожен предмет."
STR_PET_GUIDE_SUPPLIES: "Ви отримуєте порцію за 5, 10, 15, 30, 60 і 120 хвилин читання на день: до 6 порцій. Кожен збільшує показник ситості на 25 пунктів, до 100."
STR_PET_GUIDE_FEED: "Ви отримуєте один засіб за 30 хвилин читання і інший за 120 хвилин кожен день."
STR_PET_GUIDE_GAMES: "Перші 3 гри щодня покращують настрій і витрачають 20 енергії. Потім можна тренуватися безкоштовно. Перед грою подбай про хворого, голодного, втомленого або сонного улюбленця."
STR_PET_GUIDE_HEALTH: "Очищення безкоштовне і відновлює гігієну до 100.Не виліковує хворобу: для цього відкрийте здоров'я і використовуйте засіб."
STR_PET_GUIDE_DIFFICULTY: "Релакс не має терміну повернення до читання. Нормальний дозволяє 7 днів, жорсткий 3 дні і екстремальні 24 години. Якщо термін проходить, ваш домашній тварина помирає. Читання починає таймер знову."
STR_PET_GUIDE_PROJECT: "Вибирайте об'єкт і читайте до 60 хвилин, щоб заробити його. Зміна проектів починається з нуля. Ви можете видалити власні об'єкти без втрати їх; вони успадковуються."
