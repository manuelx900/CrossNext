STR_QUEST_CAM_JOURNEY2_APPROACH_1: "Ви знаходите повалені дерева і порвані книги. Зграя вовків стежить за перехрестям попереду."
STR_QUEST_CAM_JOURNEY2_APPROACH_2: "Міст зламано, а на дошках, що залишилися, стоїть охоронець коренів."
STR_QUEST_CAM_JOURNEY2_APPROACH_3: "У хаті повно зіпсованих книг. Монстр з кори охороняє двері та не дає вам шукати підказки."
STR_QUEST_CAM_JOURNEY2_APPROACH_4: "Карта веде вас до старого колодязя. З-поміж каміння вискакує звір і підсікає вас."
STR_QUEST_CAM_JOURNEY2_APPROACH_5: "Ви йдете слідами вздовж стежки, майже вкритої гілками. З-поміж дерев до вас підкрадається якась істота."
STR_QUEST_CAM_JOURNEY2_APPROACH_6: "Ви досягаєте каменя, але його оточує темна зграя. Не можна оглядати, поки там вовки."
STR_QUEST_CAM_JOURNEY2_APPROACH_7: "Вдалині видно перші будинки. Охоронець стежить за величезними коріннями, які блокують дорогу."
STR_QUEST_CAM_JOURNEY2_APPROACH_8: "Ви досягаєте воріт, вкритих корінням. Перед ним крокує вартовий з кори."
STR_QUEST_CAM_JOURNEY2_APPROACH_9: "Володар Коріння охороняє останній вихід. Він більший і сильніший за будь-якого монстра, з яким ви стикалися досі."
STR_QUEST_CAM_JOURNEY2_APPROACH_10: "Солдат короля охороняє вхід і не пропускає мандрівників."
STR_QUEST_CAM_JOURNEY2_APPROACH_11: "Ви бачите закриті лавки та спалені книги. Охоронець патрулює площу і не дає людей подалі."
STR_QUEST_CAM_JOURNEY2_APPROACH_12: "Повідомлення наказує закрити кожну бібліотеку. Чудовисько стежить за дорогою до центральної вулиці."
STR_QUEST_CAM_JOURNEY2_APPROACH_13: "Солдати заповнюють вулиці до бібліотеки. Один помічає вас і стає на вашому шляху."
STR_QUEST_CAM_JOURNEY2_APPROACH_14: "Великий монстр охороняє закриту бібліотеку. Всередині ще можуть бути книги, які ви можете зберегти."
STR_QUEST_CAM_JOURNEY2_APPROACH_15: "Ви знайдете замкнену кімнату, де бібліотека зберігала свої карти. За дверима стежить охоронець."
STR_QUEST_CAM_JOURNEY2_APPROACH_16: "Щось стукає в двері. Монстри вриваються в бібліотеку, щоб знищити книги, що залишилися."
STR_QUEST_CAM_JOURNEY2_APPROACH_17: "Городяни направляють вас до дзвіниці, але шлях охороняють солдати."
STR_QUEST_CAM_JOURNEY2_APPROACH_18: "Ви піднімаєтеся на вежу, щоб відкрити ворота. Охоронець стоїть між вами та колесом, яке ним керує."
STR_QUEST_CAM_JOURNEY2_APPROACH_19: "Охоронець дзвоника з'являється на вершині вежі. Ворота в гавань залишаються закритими, поки вони там стоять."
STR_QUEST_CAM_JOURNEY2_APPROACH_20: "Ви знайдете покинуті човни та монстра, який стежить за доком. Вам ще потрібен шлях через воду."
