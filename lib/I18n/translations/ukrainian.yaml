STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_0: "Допоможіть мені порівняти сторінки, які ми привезли додому. Ім'я на полі може сказати нам, до якої сім'ї належить пам'ять."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "Прочитайте звіти, які сусіди принесли на площу. Ми повинні поставити кожне ім'я поряд з життям, до якого воно належить."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "Допоможіть мені порівняти історії моряків, я не можу відправити інший човен в канал, який ми більше не пам'ятаємо."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "Помогите мне прочитать спасенные тома, когда они покинут эти комнаты, я хочу, чтобы кто-то знал, чьи истории они несут."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "Допоможіть мені порівняти звіти з притулків. наступний мандрівник повинен знайти шлях, а не ще одне вводяче в оману ехо."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "Допоможіть нам порівняти старі подорожі. Пам'ятний колодязь може зробити різницю між прибуттям і зникненням у піску."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "Допоможіть мені вислухати розповіді сусідів. годинник не може сказати мені, що вони сподівалися зробити з днем."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "Допоможіть нам прочитати звіти, що надходять з вільних регіонів. палац провів достатньо років, говорячи тільки сам собі."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Допоможіть мені впорядкувати історії садівників. цим семенам потрібно щось більше, ніж назва на пакетику."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Допоможіть нам зберегти ці історії в обігу, я хочу, щоб люди, яких ми знайшли, могли чути один одного."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Допоможіть нам прочитати історії, що дійшли до останньої дороги, кожна з яких належить комусь, хто чекає за королівськими стінами."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Допоможіть нам прочитати ці повідомлення повністю. Після такої довгої розлуки їхні власники заслуговують більше, ніж ім'я в списку."
STR_QUEST_CAM_JOURNEY_THANKS_0: "Ліора розгладжує сторінку своєю долонею. « Я знову чую цей рядок », — каже вона. Сьогодні ввечері вона залишить книгу відкритою біля лампи."
STR_QUEST_CAM_JOURNEY_THANKS_1: "Біля кіоску хтось присуває стілець, щоб звільнити для вас місце. Незакінчена повість набула іншої лінії; її власник бере сторінку додому обома руками."
STR_QUEST_CAM_JOURNEY_THANKS_2: "Мара згортає сторінку, яку тепер можна читати, і кладе її поруч зі своєю книгою про припливи. Перед тим, як повернутися до вікна, вона дякує тобі голосом, який затвердів від солоного повітря."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Ірі кладе смужку сухої тканини між двома сторінками. «Ця тепер може подорожувати», - вона тримає том на грудях, перш ніж перенести його до інших книг."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Тарен опускає сумку на камінь і слухає, поки ти закінчуєш, а потім повторює слова мандрівника, цього разу не дивлячись на сторінку."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Надір перетягує стрічку через пальці, читає ім'я, яке раніше було важко зрозуміти, і робить для тебе місце біля вогню."
STR_QUEST_CAM_JOURNEY_THANKS_6: "Орін опускає інструмент, який він обертав на пальцях. Деякий час він говорить про людину в історії, і годинник дозволяє відтискатися беззвучно."
STR_QUEST_CAM_JOURNEY_THANKS_7: "Сера переносить історію з купи королівських наказів, вона просить інший стіл, а потім слухає останні рядки разом з тобою."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Астер відзначає сторінку чистим листом. Вона тихо дякує вам; трохи пізніше ви чуєте, як вона читає той самий уривок біля фонтану."
STR_QUEST_CAM_JOURNEY_THANKS_9: "З наступним набором сторінок буде надіслано коротку записку. Liora скопіювала вираз, який ви допомогли відновити; на полі вона написала: « Ми читали цей вираз разом удома »."
STR_QUEST_CAM_JOURNEY_THANKS_10: "Записка складається лише з декількох рядків. Ліора залишила місце для відповіді, начебто вона вже бачила вас, коли ви сиділи на іншому кінці столу."
STR_QUEST_CAM_JOURNEY_THANKS_11: "Серед відновлених сторінок ви знайдете складену записку з дому. Його останній рядок простий: « Тут все ще є місце для вас »."
