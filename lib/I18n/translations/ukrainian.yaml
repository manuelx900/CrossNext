STR_QUEST_CAM_JOURNEY2_SAGA_9_6: "Ви досягаєте армійського табору та знаходите візок, повний книг, які ще можна врятувати. Карта всередині веде вас до намету командира, де ви сподіваєтеся дізнатися про другу печатку.\n\nЗаписка вказує на табірний архів. Усередині ви знайдете записи про напади на бібліотеки та план кімнати за залізними дверима. Печатка має бути серед цінностей, які там зберігаються."
