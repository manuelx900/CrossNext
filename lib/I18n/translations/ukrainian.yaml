STR_QUEST_CAM_JOURNEY2_SAGA_10_3: "Ви переходите через підвісний міст і відкриваєте двері, освітлені вогнями. За ним лежить старий архів, книги якого можуть підказати вам, де знайти останню печатку."
STR_QUEST_CAM_JOURNEY2_SAGA_10_6: "Ви переходите через підвісний міст і відкриваєте двері, освітлені вогнями. За ним лежить старий архів, книги якого можуть підказати вам, де знайти останню печатку.\n\nУ книзі сказано, що третя печатка зберігається під архівом. Ви йдете сходами в темні тунелі, які ведуть до запечатаної камери."
