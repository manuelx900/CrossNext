STR_INTERCEPT_TEXT_1: "Вони підозрюють зраду. Ви вирішуєте фігури, хрестові слова і шахові позиції для проживання.Ця кімната є ще однією проблемою: суперечите собі, і ваша вірогідність може бути першою жертвою."
STR_INTERCEPT_CHOICE_1_0: "Виберіть стратегію"
STR_INTERCEPT_CHOICE_1_1: "Слухайте те, що знаєте"
STR_INTERCEPT_TITLE_2: "Гарріс приїжджає"
STR_INTERCEPT_TEXT_2: "Гарріс входить з чашкою і файлом. З бомби відсутня рулонка. Твоє ім'я було на обов'язковому списку. Він ставить чашку поруч з тобою і запитує, де ти був минулої ночі."
STR_INTERCEPT_CHOICE_2_0: "Пийте чай"
STR_INTERCEPT_CHOICE_2_1: "Залишити чай недоторканим"
STR_INTERCEPT_CHOICE_2_2: "Відповісти спокійно"
STR_INTERCEPT_TITLE_3: "Компонент"
STR_INTERCEPT_TEXT_3: "Внутрішньою поверхнею вашого пальця ваші пальці зустрічаються з холодним металом. Компонент все ще там. Гупер сказав, що прийом його зупинить шантаж."
STR_INTERCEPT_CHOICE_3_0: "Тримайте його прихованим"
STR_INTERCEPT_CHOICE_3_1: "Подаруйте йому Гарріса"
STR_INTERCEPT_TITLE_4: "Переможна гра"
STR_INTERCEPT_TEXT_4: "Співпраця може зберегти вашу вірогідність. Переконлива брехня може купити час. Втеча буде обмінюватися замкненою кімнатою для охоронців ззовні."
STR_INTERCEPT_CHOICE_4_0: "співпрацювати"
STR_INTERCEPT_CHOICE_4_1: "Створити алібі"
STR_INTERCEPT_CHOICE_4_2: "Види вікон"
STR_INTERCEPT_TITLE_5: "Чай"
STR_INTERCEPT_TEXT_5: "Гарріс помічає ваше мовчання, але його обличчя вже відступає.Коли ви наступного разу відкриєте очі, ще одна пара взуття стоїть біля столу."
STR_INTERCEPT_CHOICE_5_0: "Прикидайтеся, що спите"
STR_INTERCEPT_CHOICE_5_1: "Порівняння з відвідувачем"
STR_INTERCEPT_CHOICE_5_2: "Запрошуємо на воду"
STR_INTERCEPT_TITLE_6: "Невелика відмова"
STR_INTERCEPT_TEXT_6: "Ви відштовхуєте чашу.Гарріс дивиться на рух ближче, ніж на відповідь.Він запитує, чи є хтось інший, кого він повинен ставити під сумнів."
STR_INTERCEPT_CHOICE_6_0: "Запитайте, які докази він має"
STR_INTERCEPT_CHOICE_6_1: "Згадати Хопер"
STR_INTERCEPT_CHOICE_6_2: "Погляд у вікно"
STR_INTERCEPT_TITLE_7: "Відсутня реальність"
STR_INTERCEPT_TEXT_7: "Харріс хоче прямої відповіді.Ви взяли компонент? Ви можете сказати йому, що в вашому пальто, пояснити тиск Гупер застосував, або спробувати вказувати звинувачення в іншому місці."
STR_INTERCEPT_CHOICE_7_0: "Дайте йому компонент"
STR_INTERCEPT_CHOICE_7_1: "Поясніть шантаж"
STR_INTERCEPT_CHOICE_7_2: "Обвинувачення Хоперу"
STR_INTERCEPT_TITLE_8: "Метал на столі"
STR_INTERCEPT_TEXT_8: "Харріс перевіряє його без розслаблення. Повернення вкраденого обладнання не пояснює, чому він був взятий."
STR_INTERCEPT_CHOICE_8_0: "Пропозиція знайти докази"
STR_INTERCEPT_CHOICE_8_1: "Залишайтеся і відповідайте на питання"
STR_INTERCEPT_TITLE_9: "Алібі"
STR_INTERCEPT_TEXT_9: "Ви описуєте тихий вечір на вашому столі.Гарріс відкриває файл.Охоронець побачив, що ви залишаєте машинну кімнату.Ваш винайдений рахунок тепер має свідка проти цього."
STR_INTERCEPT_CHOICE_9_0: "Захисти історію"
STR_INTERCEPT_CHOICE_9_1: "Визнання шантажу"
STR_INTERCEPT_CHOICE_9_2: "Відмовитися від додаткових запитань"
STR_INTERCEPT_TITLE_10: "вікно"
STR_INTERCEPT_TEXT_10: "Вікно високе, а склянка товста.Поза нею шлях проходить через іншу хату.Поривати його було б гучно; очікування тут має свої небезпеки."
STR_INTERCEPT_CHOICE_10_0: "Розбити склянку"
STR_INTERCEPT_CHOICE_10_1: "Вивчайте дорогу зовні"
STR_INTERCEPT_CHOICE_10_2: "Повернутися до інтерв'ю"
STR_INTERCEPT_TITLE_11: "Ще один відвідувач"
STR_INTERCEPT_TEXT_11: "Хопер прийшов, поки ви нестійкі. Він хоче знати, чи має Гарріс компонент."
STR_INTERCEPT_CHOICE_11_0: "Прикидайтеся спати"
STR_INTERCEPT_CHOICE_11_1: "Запросити пояснення"
STR_INTERCEPT_CHOICE_11_2: "Запрошуємо на воду"
STR_INTERCEPT_TITLE_12: "1 Попередження"
STR_INTERCEPT_TEXT_12: "Ви зателефонуєте Гаррісу, перш ніж чай затримається.Він повертається, роздратований.Обвинувачення про чашку потребуватиме чогось, що він може перевірити."
STR_INTERCEPT_CHOICE_12_0: "Кубок як доказ"
STR_INTERCEPT_CHOICE_12_1: "Засуджує Харріса за отруєння"
STR_INTERCEPT_CHOICE_12_2: "Зосередьтеся на реальному"
STR_INTERCEPT_TITLE_13: "Хопер"
STR_INTERCEPT_TEXT_13: "Гарріс розпізнає ім'я.Хупер корисний, добре пов'язаний і не відсутній з минулої ночі."
STR_INTERCEPT_CHOICE_13_0: "Знайдіть що-небудь перевіряється"
STR_INTERCEPT_CHOICE_13_1: "Хоппер вкрав його"
STR_INTERCEPT_TITLE_14: "Блекмейк"
STR_INTERCEPT_TEXT_14: "Ви описуєте молодого чоловіка, довіру, яку зрадили, і вимогу, яка слідувала.Гарріс слухає без вашої допомоги.Названня людини, яка встановила пастку, також може розкрити людину, яку ви сподівалися захистити."
STR_INTERCEPT_CHOICE_14_0: "Дайте Харрісу повний рахунок"
STR_INTERCEPT_CHOICE_14_1: "Залиште назви"
STR_INTERCEPT_CHOICE_14_2: "Пропонуйте спосіб зловити Гупера"
STR_INTERCEPT_TITLE_15: "Легкі звинувачення"
STR_INTERCEPT_TEXT_15: "Гарріс запитує, як ви знаєте.Є різниця між вирішенням проблеми і виробленням свідка, який може довести відповідь."
STR_INTERCEPT_CHOICE_15_0: "Хай Харріс оскаржує претензії"
STR_INTERCEPT_CHOICE_15_1: "Спробуйте надіслати приватне повідомлення для Hooper"
STR_INTERCEPT_TITLE_16: "Тест на ключ"
STR_INTERCEPT_TEXT_16: "Історію можна заперечувати.Документ, свідок або відсутній компонент важче пояснити."
STR_INTERCEPT_CHOICE_16_0: "Огляньте найближчий будинок"
STR_INTERCEPT_CHOICE_16_1: "Використовуйте ранковий перехоплення"
STR_INTERCEPT_CHOICE_16_2: "Питання Губернатор безпосередньо"
STR_INTERCEPT_TITLE_17: "Більше, ніж повернення"
STR_INTERCEPT_TEXT_17: "Машина може знову працювати, але Гарріс все ще має порушення безпеки, щоб пояснити. він пропонує вам останню можливість встановити, хто організував його."
STR_INTERCEPT_CHOICE_17_0: "Покажіть докази"
STR_INTERCEPT_CHOICE_17_1: "Шукайте докази"
STR_INTERCEPT_CHOICE_17_2: "Прийміть його суд"
STR_INTERCEPT_TITLE_18: "Протиріччя"
STR_INTERCEPT_TEXT_18: "Гарріс ставить вашу першу відповідь поруч з останньою. Вони не можуть бути істинними. Ви можете відмовитися від брехні, або дозволити інтерв'ю закінчитися на суперечності."
STR_INTERCEPT_CHOICE_18_0: "Скажіть правду про шантаж"
STR_INTERCEPT_CHOICE_18_1: "Постійно заперечувати все"
STR_INTERCEPT_CHOICE_18_2: "Спробуйте піти"
STR_INTERCEPT_TITLE_19: "Мовчання"
STR_INTERCEPT_TEXT_19: "Гарріс закриває файл.У цій кімнаті мовчання не закінчує розслідування; воно тільки закінчує вашу роль в його направленні."
STR_INTERCEPT_CHOICE_19_0: "Почути рішення"
STR_INTERCEPT_TITLE_20: "Пошкоджене скло"
STR_INTERCEPT_TEXT_20: "Холодне повітря і звук свистка охоронця приходять разом. є час для одного рішення, перш ніж хтось дійде до дверей."
STR_INTERCEPT_CHOICE_20_0: "Біг на зовнішній шлях"
STR_INTERCEPT_CHOICE_20_1: "Залишити кодований ключ"
STR_INTERCEPT_CHOICE_20_2: "Залишайтеся і пояснюйте"
STR_INTERCEPT_TITLE_21: "Між хатами"
STR_INTERCEPT_TEXT_21: "Хоперська хата досить близько, щоб дістатися до наступного патруля, але відкритий грунт за нею пропонує інший вид можливості."
STR_INTERCEPT_CHOICE_21_0: "Намагайтеся уникнути причин"
STR_INTERCEPT_CHOICE_21_1: "Вхід в хату Гупера"
STR_INTERCEPT_CHOICE_21_2: "Повернутися до Гарріс"
STR_INTERCEPT_TITLE_22: "Приватна гра"
STR_INTERCEPT_TEXT_22: "На столі він виставляє уявне шахове положення своїми пальцями. Кодована відповідь може змусити його розкрити те, що пряме звинувачення ніколи не зробить."
STR_INTERCEPT_CHOICE_22_0: "Відповісти з шаховим ключем"
STR_INTERCEPT_CHOICE_22_1: "Погрожували назвати його"
STR_INTERCEPT_CHOICE_22_2: "Говоріть чесно"
STR_INTERCEPT_TITLE_23: "Обличчя до обличчя"
STR_INTERCEPT_TEXT_23: "Його впевненість в собі зникає тільки тоді, коли ви згадуєте деталі, які хтось поза його планом не повинен знати."
STR_INTERCEPT_CHOICE_23_0: "Звертайтеся до нього з доказом"
STR_INTERCEPT_CHOICE_23_1: "Пропонуйте компонент як торгівлю"
STR_INTERCEPT_CHOICE_23_2: "Блуф"
STR_INTERCEPT_TITLE_24: "Кубок"
STR_INTERCEPT_TEXT_24: "Хопер приносить воду, але спочатку доходить до чашки чаю."
STR_INTERCEPT_CHOICE_24_0: "Тримайте чашу"
STR_INTERCEPT_CHOICE_24_1: "Перевірте костюм ще раз"
STR_INTERCEPT_TITLE_25: "Щось для тестування"
STR_INTERCEPT_TEXT_25: "Ви тримаєте чашу і просите Гарріса перевірити її.Це, нарешті, звинувачення з об'єктом, прикріпленим до неї."
STR_INTERCEPT_CHOICE_25_0: "Дайте Гаррісу кубок"
STR_INTERCEPT_CHOICE_25_1: "Конфронтація Гупер з ним"
STR_INTERCEPT_TITLE_26: "Неправильна мета"
STR_INTERCEPT_TEXT_26: "Ви звинувачуєте Гарріса без доказів. Він бачить підозрюваного, який намагається дискредитувати слідчого. Що б не трапилося з чаєм, ви ускладнили для нього вірити вам."
STR_INTERCEPT_CHOICE_26_0: "Інтерв'ю закінчується"
STR_INTERCEPT_TITLE_27: "Весь рахунок"
STR_INTERCEPT_TEXT_27: "Ви даєте імена та описуєте зустріч.Гарріс задає точні питання.Ваша сором'язливість реальна, але так само і деталі, які він тепер може перевірити."
STR_INTERCEPT_CHOICE_27_0: "Дозвольте йому перевірити рахунок"
STR_INTERCEPT_CHOICE_27_1: "Пропозиції для пошуку Hooper"
STR_INTERCEPT_TITLE_28: "Невдалий обман"
STR_INTERCEPT_TEXT_28: "Гарріс почув достатньо впевнених відповідей. Гупер теж має."
STR_INTERCEPT_CHOICE_28_0: "Залишається в заяві"
STR_INTERCEPT_CHOICE_28_1: "Зробіть відчайдушний втеча"
STR_INTERCEPT_CHOICE_28_2: "Признайте, що насправді сталося"
STR_INTERCEPT_TITLE_29: "Про перехоплення"
STR_INTERCEPT_TEXT_29: "Лист у вашій кишені несе більше, ніж згуртовані літери: його маршрут через хати ставить Хупера поблизу машини."
STR_INTERCEPT_CHOICE_29_0: "Закодувати повідомлення для Хупера"
STR_INTERCEPT_CHOICE_29_1: "Показати маршрут до Харріс"
STR_INTERCEPT_TITLE_30: "Машина біжить"
STR_INTERCEPT_TEXT_30: "У Харріса є компонент, і шлях, який веде за межі ваших перших страшних відповідей. The Bombe відновлює свою роботу. Ви залишаєте Hut 14 під своїм власним ім'ям, з меншою кількістю таємниць і майбутнім, на яке ще потрібно відповідати."
STR_INTERCEPT_TITLE_31: "Під підозрою"
STR_INTERCEPT_TEXT_31: "Повернення компонента врятувало машину від затримки. Це не зберегло вашу позицію. Харріс припиняє ваш доступ до хатів, поки розслідування триває. Ви вижили інтерв'ю, але не видалили своє ім'я."
STR_INTERCEPT_TITLE_32: "На охороні"
STR_INTERCEPT_TEXT_32: "Двері відкриваються для охоронця, а не для вас.Протиріччя, відсутні докази і вкрадений компонент стали справою, яку ви більше не можете направляти."
STR_INTERCEPT_TITLE_33: "Зовнішній шлях"
STR_INTERCEPT_TEXT_33: "Ви залишаєте хати позаду.Темнота корисна, але ділянки охороняються.Зламане вікно привело патрулі ближче, ніж ви сподівалися."
STR_INTERCEPT_CHOICE_33_0: "Перетинаючи відкриту землю"
STR_INTERCEPT_CHOICE_33_1: "Продовжуйте шлях служби"
STR_INTERCEPT_CHOICE_33_2: "Повернутись назад і подивитися на Харріса"
STR_INTERCEPT_TITLE_34: "Хата Хопера"
STR_INTERCEPT_TEXT_34: "Стіл без нагляду. Документи лежать під хрестовим словом, а машинна кімната з'являється в олівцевому графіку."
STR_INTERCEPT_CHOICE_34_0: "Перевірте документи"
STR_INTERCEPT_CHOICE_34_1: "Чекаємо на Хоппер"
STR_INTERCEPT_CHOICE_34_2: "Відвідайте Гарріса"
STR_INTERCEPT_TITLE_35: "Проблема шахів"
STR_INTERCEPT_TEXT_35: "Ви даєте Гупер позицію, яка відображає його неприємність: захищений шматок, викритий король і рух, який здається безпечним до відповіді."
STR_INTERCEPT_CHOICE_35_0: "Просимо його визнати план"
STR_INTERCEPT_CHOICE_35_1: "Надіслати заяву до Харріса"
STR_INTERCEPT_TITLE_36: "Без маски"
STR_INTERCEPT_TEXT_36: "Ви говорите про тиск, а не робите вигляд, що він ніколи не існував.Хупер коротко відповідає як людина, а не як опонент."
STR_INTERCEPT_CHOICE_36_0: "Запрошуємо до чесної угоди"
STR_INTERCEPT_CHOICE_36_1: "Запрошуйте його зізнатися"
STR_INTERCEPT_CHOICE_36_2: "Знайдіть рахунок для Харріса"
STR_INTERCEPT_TITLE_37: "Признання Хопера"
STR_INTERCEPT_TEXT_37: "Хопер пояснює достатньо, щоб підключити шантаж до відсутнього компонента.Гарріс тепер може відновити обладнання і перевірити історію.Ви повинні вирішити, чи завершити розслідування або дозволити Гупер зникнути."
STR_INTERCEPT_CHOICE_37_0: "Візьміть Гарріса з визнанням"
STR_INTERCEPT_CHOICE_37_1: "Пускай хоп піде і піде"
STR_INTERCEPT_TITLE_38: "Торгівля"
STR_INTERCEPT_TEXT_38: "Ви ставите свій останній шматок ваги в межах досягнення Гупера. Угода без свідків або доказів є запрошенням для нього вирішити свою проблему за ваш рахунок."
STR_INTERCEPT_CHOICE_38_0: "Рука над компонентом"
STR_INTERCEPT_CHOICE_38_1: "Вимоги до свідкового договору"
STR_INTERCEPT_CHOICE_38_2: "Відкликати пропозицію"
STR_INTERCEPT_TITLE_39: "Гарріс Слух"
STR_INTERCEPT_TEXT_39: "Деталі можна перевірити.Гарріс запитує, де зараз знаходиться компонент.Чищення облікового запису і запуск машини є пов'язаними проблемами, але вони не однакові."
STR_INTERCEPT_CHOICE_39_0: "Поверніть те, що у вашому пальто"
STR_INTERCEPT_CHOICE_39_1: "Допоможіть відновити компонент"
STR_INTERCEPT_CHOICE_39_2: "Перестаньте відповідати зараз"
STR_INTERCEPT_TITLE_40: "Поза огорожею"
STR_INTERCEPT_TEXT_40: "Свобода за межами землі – це не те ж саме, що невинність, а машина тепер є нагальною проблемою когось іншого."
STR_INTERCEPT_TITLE_41: "Остання помилка"
STR_INTERCEPT_TEXT_41: "Патруль дістається до вас, перш ніж відкритий грунт закінчиться, або обіцянка Гупера впаде, коли вона більше не буде корисною для нього."
STR_INTERCEPT_TITLE_42: "Документи"
STR_INTERCEPT_TEXT_42: "Графік розміщує Гупера там, де ваша історія сказала, що він був. Поруч з нею є нота, яка вперше втягнула вас у пастку."
STR_INTERCEPT_CHOICE_42_0: "Візьміть документи до Харріса"
STR_INTERCEPT_CHOICE_42_1: "Чекати і протистояти Хоперу"
STR_INTERCEPT_TITLE_43: "Остання угода"
STR_INTERCEPT_TEXT_43: "Довіра до нього усунула б одну негайну проблему; зробивши Гарріса свідком, було б складніше створити іншу."
STR_INTERCEPT_CHOICE_43_0: "Повернення свідків"
STR_INTERCEPT_CHOICE_43_1: "Введіть Харріса в план"
STR_INTERCEPT_TITLE_44: "Відновлення реального"
STR_INTERCEPT_TEXT_44: "При записі облікового запису пошук повертається до відсутнього обладнання.Гарріс перевіряє машинну кімнату, а ви визначаєте, де має знаходитися компонент."
STR_INTERCEPT_CHOICE_44_0: "Завершити перевірений повернення"
STR_INTERCEPT_CHOICE_44_1: "Зніміть його з пальто"
