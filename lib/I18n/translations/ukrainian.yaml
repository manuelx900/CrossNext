STR_FLASHCARDS_HELP: "Скопіюйте колоди Anki (.apkg /.colpkg , .anki2 /.anki21), CSV /TSV/text або перетворені папки Study у /FLASHCARDS. Використовуйте вкладені папки: до 128 елементів кожна.\n\nImports приймає базові, перевернуті та прості закриті текстові картки. Аудіо та користувацький HTML не підтримуються. Спочатку перетворіть колоди зображень /CJK. Офлайн-огляди використовують FSRS. Імпорт починається за новим розкладом і зберігає оригінали."
