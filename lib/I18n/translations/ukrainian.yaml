STR_QUEST_CAM_JOURNEY_DAILYREQUEST_1: "Залишайся з цими історіями трохи довше. Хтось на ринку може впізнати людину, яку описують ці слова."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_2: "Прочитай разом зі мною ці імена, я хочу, щоб сім'я чекала на наступний човен."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_3: "Прочитайте цю історію, перш ніж я перенесу її на більш високу полицю. Мені потрібно знати, яких слів ще не вистачає."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_4: "Прочитайте слова мандрівників зі мною. Я не хочу, щоб ви помилково сприймали старе попередження як заклик до дії."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Перед тим, як ми поїдемо, я хочу, щоб кожен почув своє ім'я."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_6: "Прочитай цю сторінку зі мною, поки дзвони не зазвучать. Мені потрібно запам'ятати більше, ніж годину на циферблаті."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_7: "Прочитайте ці свідчення повністю, тут є люди, які занадто довго чекали, щоб їх вислухали."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Прочитайте ці спогади біля фонтану, я б хотів почути, що людина, яка тут посадила, сподівалася залишити після себе."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Прочитайте повідомлення, які ми вам надіслали. Голоси з дому можуть робити вам компанію, навіть якщо ви так далеко."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Прочитайте цю листівку перед тим, як вирушати. Вам не потрібно носити всі пам' яті самостійно."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_11: "Прочитайте слова, які ми зберегли для вас. Фортеця - це не весь світ, як би тихо він не був."
