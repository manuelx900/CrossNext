STR_MYST_GUIDE_HARRIS: "Гарріс"
STR_MYST_GUIDE_HARRIS_ROLE: "Дослідник"
STR_MYST_GUIDE_HARRIS_COPY: "Гарріс запитує вас про відсутній компонент. Він перевіряє ваш рахунок проти списку обов'язків та інших доказів. Він є людиною, яку ви повинні переконати; тільки звинувачення нічого не доводить."
STR_MYST_GUIDE_HOOPER: "Хопер"
STR_MYST_GUIDE_HOOPER_ROLE: "Колеги та шантажники"
STR_MYST_GUIDE_HOOPER_COPY: "Гупер також працює в Блетчлі-Парку. Він тиснув на вас, щоб ви взяли компонент і має свої власні інтереси. Ви можете поставити йому питання, вести переговори або шукати докази. Знання його ролі не говорить вам, який вибір безпечний."
STR_MYST_GUIDE_CHOICES: "Читайте, а потім виберіть відповідь або дію."
