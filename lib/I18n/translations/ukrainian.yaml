STR_QUEST_CAM_DECOR_NAME_0: "Лісова фея"
STR_QUEST_CAM_DECOR_TEXT_0: "Ти звільнив фею від мовчазного коріння. Вона принесе трохи дива у ваш дім."
STR_QUEST_CAM_SOLO_DECOR_NAME_1: "Лісовий ліхтар"
STR_QUEST_CAM_SOLO_DECOR_TEXT_1: "Ліхтар для освітлення вашого куточка для читання."
STR_QUEST_CAM_DECOR_NAME_2: "Echo Conch"
STR_QUEST_CAM_DECOR_TEXT_2: "Врятований моряк дає вам мушлю, яка все ще зберігає пісню моря."
STR_QUEST_CAM_DECOR_NAME_3: "Дух чорнила"
STR_QUEST_CAM_DECOR_TEXT_3: "Дух втік із чистої сторінки. Він вирішує подорожувати з вами."
STR_QUEST_CAM_DECOR_NAME_4: "Місячна квітка"
STR_QUEST_CAM_DECOR_TEXT_4: "Садівники врятували одну насінину зі сплячого саду. Ця квітка виросла для вас."
STR_QUEST_CAM_DECOR_NAME_5: "Зимовий кристал"
STR_QUEST_CAM_DECOR_TEXT_5: "Відлига відкриває кристал, що зберігає останню пам'ять про гору."
STR_QUEST_CAM_DECOR_NAME_6: "Заводна сова"
STR_QUEST_CAM_DECOR_TEXT_6: "Годинникар відремонтував цього маленького охоронця, щоб подякувати тобі за повернення часу."
STR_QUEST_CAM_DECOR_NAME_7: "Перо Фенікса"
STR_QUEST_CAM_DECOR_TEXT_7: "З знайденого попелу з’являється пір’їна: обіцянка того, що історії можуть початися знову."
STR_QUEST_CAM_DECOR_NAME_8: "Лампа пустелі"
STR_QUEST_CAM_DECOR_TEXT_8: "Оповідач дає вам лампу, яка підтримувала казки про пустелю."
STR_QUEST_CAM_DECOR_NAME_9: "Cloud Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "Ви відкриваєте хмарну клітку. Маленький коі залишається стежити за вашими мріями."
STR_QUEST_CAM_DECOR_NAME_10: "Серце дракона"
STR_QUEST_CAM_DECOR_TEXT_10: "Дракони довіряють вам кристал, народжений з їх відновленої пам'яті."
STR_QUEST_CAM_DECOR_NAME_11: "Зірка Пам'яті"
STR_QUEST_CAM_DECOR_TEXT_11: "Перша відновлена зірка освітлює ваш шлях до останніх сторінок."
STR_QUEST_CAM_DECOR_NAME_12: "Паросток читання"
STR_QUEST_CAM_DECOR_TEXT_12: "Невелика рослинка для тихого куточка для читання."
STR_QUEST_CAM_DECOR_NAME_13: "Збережені книги"
STR_QUEST_CAM_DECOR_TEXT_13: "Історії чекають свого наступного читача."
STR_QUEST_CAM_DECOR_NAME_14: "Банер Voyager"
STR_QUEST_CAM_DECOR_TEXT_14: "Вимпел, який пам'ятає про кожен новий початок."
STR_QUEST_CAM_DECOR_NAME_15: "Місячні гриби"
STR_QUEST_CAM_DECOR_TEXT_15: "Маленький шматочок лісу для вашого дому."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Початок пригод"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Багато років люди жили в мирі і насолоджувалися своїми книгами. Тоді Король Забуття почав їх знищувати. Він хотів заборонити всім читати і змусити всі історії зникнути назавжди."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Королівські монстри"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Король Забуття розіслав своїх монстрів по всьому світу. Вони знищували кожну книгу, яку знаходили, і нападали на кожного, хто намагався їх зупинити. Бібліотеки почали зникати, а люди перестали читати."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Сила читання"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Одного разу, коли ви читаєте біля свого села, з'являється чудовисько. Ви намагаєтеся втекти, але відбувається щось дивовижне: чим більше ви читаєте, тим слабшим стає. Ви розумієте, що читання — це єдиний спосіб боротися з магією короля."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Ваша місія"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Ви вирішили зупинити короля. На шляху до його замку ви повинні перетнути ліси, міста, гори та інші місця, повні ворогів. Кожен монстр, якого ви перемагаєте, наближає вас. Продовжуйте читати, перемогти його опікунів і дістатися до нього, перш ніж він знищить усі книги у світі."
STR_QUEST_CAM_JOURNEY2_BOOK_0: "Ліс монстрів"
