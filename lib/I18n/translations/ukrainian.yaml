STR_QUEST_CAM_JOURNEY2_SAGA_11_6: "Кімнати завалені вкраденими та пошкодженими книгами. Ви звільняєте тих, хто все ще замкнений у ящиках, а потім піднімаєтеся до найвищої частини фортеці, щоб знайти джерело влади короля.\n\nВеличезна книга зберігає частину магії короля. Його замок відповідає трьом печаткам на ключі. Коли ви відкриваєте його, темна магія слабшає, і ви можете прямувати до трону."
