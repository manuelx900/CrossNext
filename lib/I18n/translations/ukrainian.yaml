STR_QUEST_CAM_JOURNEY2_BOOK_10: "Шлях зірок"
STR_QUEST_CAM_JOURNEY2_BOOK_11: "Остання сторінка"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Після перемоги над Королем Забуття ви повертаєтеся додому. Його армія більше не може нищити книжки, і люди знову спокійно читають. Ви врятували історії світу. Залишилося відкрити ще багато книг."
