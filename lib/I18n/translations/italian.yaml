STR_UI_SWIPE_OR_TAP_AN_ARROW_TO_887004: "Spostare o toccare una freccia per guidare. Mangiare il cibo delineato per crescere. Evitare le pareti e la propria coda. Non puoi invertire la direzione. Toccare Pausa prima di mettere il lettore giù. Giochi salvati riprendono sempre in pausa."
STR_UI_YOU_PLAY_BLACK_TAP_AN_EMPTY_29AEBA: "Giochi nero. Toccare un quadrato vuoto che cattura i dischi bianchi in una linea retta. Tutti i dischi intrappolati si spostano al tuo colore. Il dispositivo gioca a bianco. Se un lato non ha alcun movimento legale, passa automaticamente. La maggior parte dei dischi vince quando nessuno può muoversi."
STR_UI_MAKE_ONE_CLOSED_LOOP_EACH_NUMBER_D60227: "Fai un ciclo chiuso. Ogni numero dice quanti dei suoi quattro bordi appartengono al ciclo. Toccare vicino a un bordo per la linea del ciclo, incrociato e vuoto. Le linee non possono ramificare o formare loop separati. Tutti i segnali devono corrispondere. Qualsiasi soluzione valida è accettata."
STR_UI_CONNECT_ALL_ISLANDS_IN_ONE_NETWORK_C5618B: "Connetti tutte le isole in una sola rete. Il numero su un'isola è il suo numero di ponti richiesto. Toccare due isole vicine nella stessa riga o colonna per circolare i ponti uno, due e zero. I ponti non possono saltare sopra le isole. Qualsiasi soluzione connessa che corrisponda a tutti i numeri vince."
