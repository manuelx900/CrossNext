STR_QUEST_CAM_DECOR_TEXT_2: "Un marinaio salvato ti regala una conchiglia che racchiude ancora il canto del mare."
STR_QUEST_CAM_DECOR_NAME_3: "Spirito d'inchiostro"
STR_QUEST_CAM_DECOR_TEXT_3: "Uno spirito è fuggito da una pagina bianca. Sceglie di viaggiare con te."
STR_QUEST_CAM_DECOR_NAME_4: "Fiore di luna"
STR_QUEST_CAM_DECOR_TEXT_4: "I giardinieri hanno salvato un seme dal giardino addormentato. Questo fiore è cresciuto per te."
STR_QUEST_CAM_DECOR_NAME_5: "Cristallo invernale"
STR_QUEST_CAM_DECOR_TEXT_5: "Il disgelo rivela un cristallo che custodisce l'ultimo ricordo della montagna."
STR_QUEST_CAM_DECOR_NAME_6: "Gufo Meccanico"
STR_QUEST_CAM_DECOR_TEXT_6: "L'orologiaio ripara questo piccolo guardiano per ringraziarti di aver riportato indietro il tempo."
STR_QUEST_CAM_DECOR_NAME_7: "Piuma di fenice"
STR_QUEST_CAM_DECOR_TEXT_7: "Dalle ceneri recuperate rinasce una piuma: la promessa che le storie possono ricominciare."
STR_QUEST_CAM_DECOR_NAME_8: "Lampada del deserto"
STR_QUEST_CAM_DECOR_TEXT_8: "Un narratore ti regala la lampada che manteneva vive le storie del deserto."
STR_QUEST_CAM_DECOR_NAME_9: "Nuvola Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "Apri la gabbia delle nuvole. Una piccola koi resta a vegliare sui tuoi sogni."
STR_QUEST_CAM_DECOR_NAME_10: "Cuore del drago"
STR_QUEST_CAM_DECOR_TEXT_10: "I draghi ti affidano un cristallo nato dalla loro memoria recuperata."
STR_QUEST_CAM_DECOR_NAME_11: "Stella della Memoria"
STR_QUEST_CAM_DECOR_TEXT_11: "La prima stella restaurata vi illumina verso le pagine finali."
STR_QUEST_CAM_DECOR_NAME_12: "Lettura del germoglio"
STR_QUEST_CAM_DECOR_TEXT_12: "Una piccola pianta per un tranquillo angolo lettura."
STR_QUEST_CAM_DECOR_NAME_13: "Libri salvati"
STR_QUEST_CAM_DECOR_TEXT_13: "Storie in attesa del prossimo lettore."
STR_QUEST_CAM_DECOR_NAME_14: "Stendardo della Voyager"
STR_QUEST_CAM_DECOR_TEXT_14: "Un gagliardetto per ricordare ogni nuovo inizio."
STR_QUEST_CAM_DECOR_NAME_15: "Funghi Lunari"
STR_QUEST_CAM_DECOR_TEXT_15: "Un piccolo pezzo di bosco per la tua casa."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "L'inizio dell'avventura"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Per molti anni le persone vissero in pace e apprezzarono i loro libri. Quindi il Re dell'Oblivione iniziò a distruggerli. Voleva impedire a tutti di leggere e far sparire per sempre tutte le storie."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "I mostri del re"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Il Re dell'Oblivione ha inviato i suoi mostri in tutto il mondo. Distrussero ogni libro che trovarono e attaccarono chiunque tentasse di fermarli. Le biblioteche iniziarono a scomparire e la gente smise di leggere."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Il potere della lettura"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Un giorno, mentre stai leggendo vicino al tuo villaggio, appare un mostro. Cerchi di scappare, ma succede qualcosa di sorprendente: più leggi, più diventa debole. Ti rendi conto che leggere è l'unico modo per combattere la magia del re."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "La tua missione"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Hai deciso di fermare il re. Sulla strada per il suo castello devi attraversare foreste, città, montagne e altri luoghi pieni di nemici. Ogni mostro che sconfiggi ti avvicina un po' di più. Continua a leggere, sconfiggi i suoi guardiani e raggiungilo prima che distrugga tutti i libri del mondo."
STR_QUEST_CAM_JOURNEY2_BOOK_0: "La foresta dei mostri"
STR_QUEST_CAM_JOURNEY2_BOOK_1: "La città senza libri"
STR_QUEST_CAM_JOURNEY2_BOOK_2: "Il porto della nebbia"
STR_QUEST_CAM_JOURNEY2_BOOK_3: "La Biblioteca sotto il mare"
STR_QUEST_CAM_JOURNEY2_BOOK_4: "Le montagne degli echi"
STR_QUEST_CAM_JOURNEY2_BOOK_5: "Il mare di sabbia"
STR_QUEST_CAM_JOURNEY2_BOOK_6: "La Cittadella dell'Orologio"
STR_QUEST_CAM_JOURNEY2_BOOK_7: "Il Palazzo della Luna"
STR_QUEST_CAM_JOURNEY2_BOOK_8: "Il Giardino degli Dei"
STR_QUEST_CAM_JOURNEY2_BOOK_9: "La guerra per i libri"
STR_QUEST_CAM_JOURNEY2_BOOK_10: "Il Sentiero delle Stelle"
STR_QUEST_CAM_JOURNEY2_BOOK_11: "L'ultima pagina"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Dopo aver sconfitto il Re dell'Oblivione, torni a casa. Il suo esercito non può più distruggere i libri e la gente torna a leggere in pace. Hai salvato le storie del mondo. Ci sono ancora molti libri da scoprire."
