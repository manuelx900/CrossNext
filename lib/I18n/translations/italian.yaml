STR_INTERCEPT_ABOUT: "Un adattamento condensato di The Intercept di inkle, 2016, utilizzato sotto la licenza MIT. Bletchley Park, 1942: un componente mancante di una macchina, un ricatto e un colloquio che può finire con la libertà o la custodia cautelare.\n\nLe tue decisioni e la tua posizione vengono salvate dopo ogni scelta. Una nuova storia ripristina questo gioco. Per questo firmware sono state create illustrazioni originali. Lo script originale e la licenza sono inclusi nel progetto."
