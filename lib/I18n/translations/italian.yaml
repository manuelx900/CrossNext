STR_CAR_INTRO: "La colpa e l'onestà sono indipendenti. Ogni caso ha esattamente una soluzione. Le altezze sono tratti di carattere fictivi."
STR_CAR_HELP_TEXT: "COME RISOLVERE UN CASO\nOgni personaggio fa una dichiarazione. La parte superiore dello schermo mostra il numero esatto di colpevoli e false dichiarazioni. Trova una combinazione che soddisfi entrambi i conteggi. Ogni caso ha una soluzione.\n  \nLa colpa non è l'onestà\nUn personaggio innocente può mentire, e un colpevole può dire la verità. Due bugie significa che esattamente due dichiarazioni intere sono false; le altre sono vere. I segni Verità / Bugia si riferiscono alla dichiarazione; Sospettato si riferisce alla colpevolezza.\n  \nLEGGENDO GLI INDIRIZZI\n\"A o B lo ha fatto (o entrambi)\" significa che almeno un personaggio nominato è colpevole. \"A e B lo hanno fatto\" richiede entrambi. Una menzogna nega l'intera affermazione: un falso OR significa che nessuno dei due lo ha fatto; un falso AND significa che almeno uno non lo ha fatto.\n  \n\"Entrambi veritieri o entrambi bugiardi\" confronta le affermazioni, non la colpevolezza. \"Esattamente uno sta mentendo\" significa che le loro affermazioni hanno diversi valori di verità. Questi indizi possono essere veri o falsi.\n  \nI VICINI SU UN PICCOLO SCHERMO\nL'ordine circolare originale è Panther, Peacock, Shark, Fox, Bear, Stag, Horse, utilizzando solo i caratteri di questo caso. L'ultimo e il primo sono vicini. Questa applicazione scrive i due nomi direttamente in ogni indizio vicino. Non c'è mai bisogno di indovinare quali carte sono accanto a un ritratto. Cambiare pagina o orientamento non cambia un indizio.\n  \nAltezza e dieta\nOgni carta mostra un'altezza e una dieta immaginaria. \"Un colpevole è più alto di me\" significa che almeno un colpevole è più alto dell'oratore, non necessariamente tutti i colpevoli. Più corto funziona allo stesso modo. Gli indizi carnivori ed erbivori significano che almeno un colpevole ha quella dieta; gli onnivori contano come nessuno dei due. Nomi, altezze e diete sono fatti affidabili; le dichiarazioni possono mentire.\n  \nLA TUA ANALISI\nUsa ? / Verità / Menzogna e Sospetto sotto ogni dichiarazione per registrare le ipotesi. Questi sono i tuoi appunti, non prove o controlli automatici. Le frecce mostrano gli altri caratteri. La modalità verticale mostra fino a tre per pagina.\n  \nFare un'accusa\nPremere Accusa e selezionare esattamente il numero richiesto di colpevoli. Solo confermando un'accusa sbagliata si spende una vita. Principiante e Normale hanno due vite; Avanzato ed Esperto ne hanno una. Un'accusa corretta risolve il caso.\n  \nCAMPAGNA E REPLAY\nCi sono 1.470 casi. Caso aperto riprende il tentativo corrente o apre il successivo dopo uno chiuso. Campagna ti permette di scegliere uno qualsiasi dei 1.470 casi in qualsiasi ordine dall'inizio. Replay inizia un nuovo tentativo preservando il completamento precedente. All'interno di ogni difficoltà, i casi progrediscono da un colpevole a due, poi da meno bugiardi a più all'interno di ciascun gruppo di colpevoli. Principiante mantiene un colpevole. I lanci più piccoli vengono prima quando i conteggi corrispondono. Tutti i casi rimangono disponibili. Risolvere un caso precedentemente esaurito lo aggiorna a risolto.\n  \nI progressi e le vite vengono salvati sulla scheda SD. L'uscita, la sospensione o il riavvio del dispositivo non ripristinano le vite nel tentativo corrente. Un salvataggio fallito blocca il risultato fino a quando Retry ha successo. Reset all chiede conferma prima di cancellare solo i progressi Carnivore."
