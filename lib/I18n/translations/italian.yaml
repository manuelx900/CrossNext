STR_INTERCEPT_TITLE_0: "Cappuccetto 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942.Vi stanno tenendo in attesa dietro una porta chiusa. Un componente della macchina di calcolo è scomparso.La mattina intercettate le rughe nella tasca del vostro cappotto."
STR_INTERCEPT_CHOICE_0_0: "Pensa attraverso l'accusa"
STR_INTERCEPT_CHOICE_0_1: "Aspettando l’intervista"
STR_INTERCEPT_CHOICE_0_2: "Cerca il tuo cappotto"
STR_INTERCEPT_TITLE_1: "L’accusa"
STR_INTERCEPT_TEXT_1: "Si sospetta il tradimento. si risolve figure, parole incrociate e posizioni di scacchi per vivere. Questa stanza è un altro problema: contraddicendosi, e la vostra credibilità può essere la prima vittima."
STR_INTERCEPT_CHOICE_1_0: "Scegli una strategia"
STR_INTERCEPT_CHOICE_1_1: "Ascoltate quello che sanno"
STR_INTERCEPT_TITLE_2: "Arriva Harry"
STR_INTERCEPT_TEXT_2: "Harris entra con una tazza di tè e un file. Un rullo è mancante dalla Bombe. Il tuo nome era sul tavolo del dovere. Egli mette la tazza accanto a te e ti chiede dove eri ieri sera."
STR_INTERCEPT_CHOICE_2_0: "Bevi il tè"
STR_INTERCEPT_CHOICE_2_1: "Lascia il tè intatto"
STR_INTERCEPT_CHOICE_2_2: "Rispondi con calma"
STR_INTERCEPT_TITLE_3: "Il componente"
STR_INTERCEPT_TEXT_3: "All’interno del rivestimento del tuo cappotto le dita si incontrano con il metallo freddo. Il componente è ancora lì. Hooper ha detto che prendendolo farebbe cessare il ricatto."
STR_INTERCEPT_CHOICE_3_0: "Tieni nascosto"
STR_INTERCEPT_CHOICE_3_1: "Fatevi prendere da Harris"
STR_INTERCEPT_TITLE_4: "Un gioco vincente"
STR_INTERCEPT_TEXT_4: "La cooperazione potrebbe preservare la vostra credibilità. Una menzogna convincente potrebbe comprare tempo. Escape scambierebbe una stanza chiusa per le guardie fuori."
STR_INTERCEPT_CHOICE_4_0: "Collaborare"
STR_INTERCEPT_CHOICE_4_1: "Inventare un alibi"
STR_INTERCEPT_CHOICE_4_2: "Esaminare la finestra"
STR_INTERCEPT_TITLE_5: "Il tè"
STR_INTERCEPT_TEXT_5: "Harris nota il tuo silenzio, ma il suo volto si sta già ritirando.Quando aprite gli occhi la prossima volta, un'altra coppia di scarpe si trova accanto al tavolo."
STR_INTERCEPT_CHOICE_5_0: "Fingiamo di restare addormentati"
STR_INTERCEPT_CHOICE_5_1: "Confronta il visitatore"
STR_INTERCEPT_CHOICE_5_2: "Chiedere acqua"
STR_INTERCEPT_TITLE_6: "Un piccolo rifiuto"
STR_INTERCEPT_TEXT_6: "Harris osserva il movimento più da vicino della risposta. chiede se c'è qualcun altro che dovrebbe mettere in discussione."
STR_INTERCEPT_CHOICE_6_0: "Chiedete quali sono le prove"
STR_INTERCEPT_CHOICE_6_1: "Menzione di Hooper"
STR_INTERCEPT_CHOICE_6_2: "Guardare verso la finestra"
STR_INTERCEPT_TITLE_7: "Il reale mancante"
STR_INTERCEPT_TEXT_7: "Harris vuole una risposta diretta. hai preso il componente? puoi dirgli cosa c'è nel tuo cappotto, spiegare la pressione che Hooper ha applicato o cercare di indicare l'accusa altrove."
STR_INTERCEPT_CHOICE_7_0: "Dai il componente"
STR_INTERCEPT_CHOICE_7_1: "Spiegare il ricatto"
STR_INTERCEPT_CHOICE_7_2: "Accusa Hooper"
STR_INTERCEPT_TITLE_8: "Metallo sul tavolo"
STR_INTERCEPT_TEXT_8: "Harris lo controlla senza rilassarsi.Ritorno attrezzature rubate non spiega perché è stato preso.Voleva un nome e qualcosa di più affidabile della tua parola."
STR_INTERCEPT_CHOICE_8_0: "Offerta per trovare prove"
STR_INTERCEPT_CHOICE_8_1: "Rimanere e rispondere alle domande"
STR_INTERCEPT_TITLE_9: "Il suo alibi"
STR_INTERCEPT_TEXT_9: "Hai descritto una serata tranquilla sul tuo tavolo.Harris apre il file.Un guardia ti ha visto uscire dalla macchina.Il tuo account inventato ora ha un testimone contro di esso."
STR_INTERCEPT_CHOICE_9_0: "Difendere la storia"
STR_INTERCEPT_CHOICE_9_1: "Riconoscere il ricatto"
STR_INTERCEPT_CHOICE_9_2: "Rifiuta ulteriori domande"
STR_INTERCEPT_TITLE_10: "La finestra"
STR_INTERCEPT_TEXT_10: "La finestra è alta e il vetro è spessa.Al di là di esso, il sentiero passa attraverso un'altra cabina.Ricondendolo sarebbe forte; aspettare qui ha i suoi pericoli."
STR_INTERCEPT_CHOICE_10_0: "rompere il bicchiere"
STR_INTERCEPT_CHOICE_10_1: "Studiare il percorso esterno"
STR_INTERCEPT_CHOICE_10_2: "Torna all'intervista"
STR_INTERCEPT_TITLE_11: "Un altro visitatore"
STR_INTERCEPT_TEXT_11: "Hooper è venuto mentre tu sei instabile. vuole sapere se Harris ha il componente. Tiene una mano vicino alla porta."
STR_INTERCEPT_CHOICE_11_0: "Fingere di dormire"
STR_INTERCEPT_CHOICE_11_1: "Richiedi una spiegazione"
STR_INTERCEPT_CHOICE_11_2: "Chiedere acqua"
STR_INTERCEPT_TITLE_12: "Un avvertimento"
STR_INTERCEPT_TEXT_12: "Chiami Harris prima che il tè si fermi.Ritorna, irritato.Una accusa sulla tazza avrà bisogno di qualcosa che possa testare."
STR_INTERCEPT_CHOICE_12_0: "La coppa come prova"
STR_INTERCEPT_CHOICE_12_1: "Accusa Harris di avvelenarti"
STR_INTERCEPT_CHOICE_12_2: "Concentrati sul reale"
STR_INTERCEPT_TITLE_13: "Hooper"
STR_INTERCEPT_TEXT_13: "Harris riconosce il nome. Hooper è utile, ben connesso e non assente neanche dalla lista di ieri sera."
STR_INTERCEPT_CHOICE_13_0: "Trova qualcosa di verificabile"
STR_INTERCEPT_CHOICE_13_1: "Hooper lo ha rubato"
STR_INTERCEPT_TITLE_14: "Il Blackmail"
STR_INTERCEPT_TEXT_14: "Descrivi un giovane, una fiducia tradita e la richiesta che ne è seguita. Harris ascolta senza aiutarti."
STR_INTERCEPT_CHOICE_14_0: "Dai a Harris il conto completo"
STR_INTERCEPT_CHOICE_14_1: "Lascia fuori i nomi"
STR_INTERCEPT_CHOICE_14_2: "Proporre un modo per catturare Hooper"
STR_INTERCEPT_TITLE_15: "Una semplice accusa"
STR_INTERCEPT_TEXT_15: "Hooper, dici tu, deve essere responsabile.Harris chiede come sai.C'è una differenza tra risolvere un problema e produrre un testimone che può dimostrare la risposta."
STR_INTERCEPT_CHOICE_15_0: "Lasciate che Harris sfida la richiesta"
STR_INTERCEPT_CHOICE_15_1: "Provare un messaggio privato a Hooper"
STR_INTERCEPT_TITLE_16: "Un test chiave"
STR_INTERCEPT_TEXT_16: "Una storia può essere negata. Un documento, un testimone o il componente mancante è più difficile da spiegare."
STR_INTERCEPT_CHOICE_16_0: "Controllare la capanna vicina"
STR_INTERCEPT_CHOICE_16_1: "Usare l'intercettazione mattutina"
STR_INTERCEPT_CHOICE_16_2: "Domanda Hooper direttamente"
STR_INTERCEPT_TITLE_17: "Più che un ritorno"
STR_INTERCEPT_TEXT_17: "La macchina può funzionare di nuovo, ma Harris ha ancora una violazione della sicurezza da spiegare."
STR_INTERCEPT_CHOICE_17_0: "Mostra le prove"
STR_INTERCEPT_CHOICE_17_1: "Cerca la prova"
STR_INTERCEPT_CHOICE_17_2: "Accetta il suo giudizio"
STR_INTERCEPT_TITLE_18: "Una contraddizione"
STR_INTERCEPT_TEXT_18: "Harris mette la tua prima risposta accanto a quella più recente.Non possono essere entrambe vere.Puoi abbandonare la menzogna, o lasciare che l'intervista finisca su una contraddizione."
STR_INTERCEPT_CHOICE_18_0: "La verità sul ricatto"
STR_INTERCEPT_CHOICE_18_1: "Continua a negare tutto"
STR_INTERCEPT_CHOICE_18_2: "Prova a lasciare"
STR_INTERCEPT_TITLE_19: "silenzio"
STR_INTERCEPT_TEXT_19: "Harris chiude il file.In questa stanza, il silenzio non mette fine all'indagine; termina solo la tua parte nel dirigere."
STR_INTERCEPT_CHOICE_19_0: "Ascolta la decisione"
STR_INTERCEPT_TITLE_20: "Il vetro rotto"
STR_INTERCEPT_TEXT_20: "L'aria fredda e il suono del sussurro di una guardia si uniscono.C'è tempo per una decisione prima che qualcuno raggiunga la porta."
STR_INTERCEPT_CHOICE_20_0: "Correre per il sentiero esterno"
STR_INTERCEPT_CHOICE_20_1: "Lascia un codice di cognome"
STR_INTERCEPT_CHOICE_20_2: "Rimanere e spiegare"
STR_INTERCEPT_TITLE_21: "Tra le capanne"
STR_INTERCEPT_TEXT_21: "La cabina di Hooper è abbastanza vicina da raggiungere prima della prossima pattuglia, ma il terreno aperto oltre offre un altro tipo di possibilità."
STR_INTERCEPT_CHOICE_21_0: "Cercare di sfuggire alle ragioni"
STR_INTERCEPT_CHOICE_21_1: "Vai alla Cappella di Hooper"
STR_INTERCEPT_CHOICE_21_2: "Ritorno a Harris"
STR_INTERCEPT_TITLE_22: "Un gioco privato"
STR_INTERCEPT_TEXT_22: "Hooper ti studia.Sulla tavola si pone una posizione immaginaria di scacchi con le dita.Una risposta codificata potrebbe fargli rivelare ciò che un'accusa diretta non avrebbe mai fatto."
STR_INTERCEPT_CHOICE_22_0: "Rispondi con una chiave di scacchi"
STR_INTERCEPT_CHOICE_22_1: "minaccia di chiamarlo"
STR_INTERCEPT_CHOICE_22_2: "Parla con onestà"
STR_INTERCEPT_TITLE_23: "Faccia a faccia"
STR_INTERCEPT_TEXT_23: "Hooper chiede cosa si può dimostrare, la sua fiducia scompare solo quando si menzionano i dettagli che qualcuno al di fuori del suo piano non dovrebbe sapere."
STR_INTERCEPT_CHOICE_23_0: "Confrontarlo con la prova"
STR_INTERCEPT_CHOICE_23_1: "Offri il componente come un commercio"
STR_INTERCEPT_CHOICE_23_2: "Il bluff"
STR_INTERCEPT_TITLE_24: "La Coppa"
STR_INTERCEPT_TEXT_24: "Hooper porta acqua ma raggiunge per la tazza di tè prima.Tener quella tazza potrebbe essere più utile che accettare qualsiasi altra cosa che offre."
STR_INTERCEPT_CHOICE_24_0: "Tieni la coppa"
STR_INTERCEPT_CHOICE_24_1: "Controlla nuovamente il cappotto"
STR_INTERCEPT_TITLE_25: "Qualcosa da testare"
STR_INTERCEPT_TEXT_25: "Tieni la tazza e chiedi a Harris di farla esaminare.Questa è infine un'accusa con un oggetto attaccato ad essa.Il tentativo di Hooper di rimuoverla fornisce un secondo dettaglio utile."
STR_INTERCEPT_CHOICE_25_0: "Dai a Harris la coppa"
STR_INTERCEPT_CHOICE_25_1: "Confrontare Hooper con esso"
STR_INTERCEPT_TITLE_26: "Il bersaglio sbagliato"
STR_INTERCEPT_TEXT_26: "Hai accusato Harris senza prove. vede un sospetto che tenta di screditare l'investigatore. Qualunque cosa sia successo al tè, hai reso più difficile per lui credere a te."
STR_INTERCEPT_CHOICE_26_0: "L’intervista finisce"
STR_INTERCEPT_TITLE_27: "L’intero conto"
STR_INTERCEPT_TEXT_27: "Dai i nomi e descrivi l'incontro. Harris pone domande precise. La tua imbarazzo è reale, ma così sono i dettagli che ora può controllare."
STR_INTERCEPT_CHOICE_27_0: "Lasciate che verifichi il conto"
STR_INTERCEPT_CHOICE_27_1: "Offerta per trovare Hooper"
STR_INTERCEPT_TITLE_28: "Una truffa fallita"
STR_INTERCEPT_TEXT_28: "Harris ha sentito abbastanza risposte fiduciose. Hooper ha anche. né fornisce il fatto che la tua storia manca."
STR_INTERCEPT_CHOICE_28_0: "Persiste nel reclamo"
STR_INTERCEPT_CHOICE_28_1: "Una fuga disperata"
STR_INTERCEPT_CHOICE_28_2: "Ammettere quello che è successo davvero"
STR_INTERCEPT_TITLE_29: "L’intercettazione"
STR_INTERCEPT_TEXT_29: "Il foglio nella tasca porta più di lettere in giro: il suo percorso attraverso le cabanne mette Hooper vicino alla macchina."
STR_INTERCEPT_CHOICE_29_0: "Codifica un messaggio per Hooper"
STR_INTERCEPT_CHOICE_29_1: "Mostra il percorso per Harris"
STR_INTERCEPT_TITLE_30: "La macchina corre"
STR_INTERCEPT_TEXT_30: "Harris ha il componente, e una traccia che porta al di là delle tue prime risposte spaventate. La bomba riprende il suo lavoro. Lasci Hut 14 sotto il tuo nome, con meno segreti e un futuro ancora da rispondere."
STR_INTERCEPT_TITLE_31: "Sotto sospetto"
STR_INTERCEPT_TEXT_31: "Il ritorno del componente ha salvato la macchina da un ritardo. Non ha salvato il tuo posizionamento. Harris termina l'accesso alle capanne mentre l'indagine continua. Hai sopravvissuto all'intervista, ma non hai cancellato il tuo nome."
STR_INTERCEPT_TITLE_32: "in custodia"
STR_INTERCEPT_TEXT_32: "Le contraddizioni, le prove mancanti e un componente rubato sono diventati un caso che non puoi più indirizzare."
STR_INTERCEPT_TITLE_33: "Il cammino esterno"
STR_INTERCEPT_TEXT_33: "Lasciate le capanne dietro.L'oscurità è utile, ma i terreni sono sorvegliati.Una finestra rotta ha portato le pattuglie più vicino di quanto si spera."
STR_INTERCEPT_CHOICE_33_0: "attraversare il terreno aperto"
STR_INTERCEPT_CHOICE_33_1: "Continua il cammino del servizio"
STR_INTERCEPT_CHOICE_33_2: "Torna indietro e faccia a faccia Harris"
STR_INTERCEPT_TITLE_34: "La Cappella di Hooper"
STR_INTERCEPT_TEXT_34: "Il tavolo è privo di sorveglianza. I documenti si trovano sotto una parola incrociata, e la stanza della macchina appare in un programma a matita."
STR_INTERCEPT_CHOICE_34_0: "Esaminare i documenti"
STR_INTERCEPT_CHOICE_34_1: "Aspettando Hooper"
STR_INTERCEPT_CHOICE_34_2: "Lasciati andare da Harris"
STR_INTERCEPT_TITLE_35: "Il problema degli scacchi"
STR_INTERCEPT_TEXT_35: "Dai a Hooper una posizione che riflette la sua condizione: un pezzo protetto, un re esposto e un movimento che sembra sicuro fino alla risposta."
STR_INTERCEPT_CHOICE_35_0: "Chiedi a lui di ammettere il piano"
STR_INTERCEPT_CHOICE_35_1: "Invia l'ammissione a Harris"
STR_INTERCEPT_TITLE_36: "Senza una maschera"
STR_INTERCEPT_TEXT_36: "Parli della pressione invece di fingere che non sia mai esistita. Hooper risponde brevemente come persona piuttosto che come avversario."
STR_INTERCEPT_CHOICE_36_0: "Richiedi un accordo onesto"
STR_INTERCEPT_CHOICE_36_1: "Chiedi a lui di confessare"
STR_INTERCEPT_CHOICE_36_2: "Fai il conto a Harris"
STR_INTERCEPT_TITLE_37: "L'ammissione di Hooper"
STR_INTERCEPT_TEXT_37: "Hooper spiega abbastanza per collegare il ricatto al componente mancante. Harris può ora recuperare l'attrezzatura e controllare la storia. Devi decidere se terminare l'indagine o lasciare che Hooper scompaia."
STR_INTERCEPT_CHOICE_37_0: "Portare Harris l'ammissione"
STR_INTERCEPT_CHOICE_37_1: "Lascia che Hooper vada e vada"
STR_INTERCEPT_TITLE_38: "Il commercio"
