STR_QUOTES_HELP: "Evidenzia il testo durante la lettura: tieni premuta una parola, trascina le maniglie di selezione, quindi salva. Gli estratti salvati vengono visualizzati qui, prima quelli più recenti. La raccolta è archiviata in /My Clippings.txt."
