STR_FLASHCARDS_WHERE: "File: /FLASHCARDS - Guida"
STR_FLASHCARDS_HELP: "Copia mazzi Anki (.apkg /.colpkg , .anki2 /.anki21 ), CSV /TSV/text o cartelle di studio convertite in /FLASHCARDS. Utilizza sottocartelle: fino a 128 elementi ciascuna.\n\nLe importazioni accettano carte di testo cloze di base, invertite e semplici. L'audio e l'HTML personalizzato non sono supportati. Converti prima i deck /CJK con immagini. Le revisioni offline utilizzano FSRS. L'importazione avvia una nuova pianificazione e mantiene gli originali."
STR_FLASHCARDS_PREPARING: "Controllo e importazione di questo mazzo. Le grandi raccolte Anki possono richiedere del tempo. Mantieni la scheda SD collegata."
