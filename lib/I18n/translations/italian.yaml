STR_WORDLE_INSTRUCTIONS: "Indovina la parola nascosta in 6 tentativi. Inserisci una parola valida e confermala per vedere il risultato. Una parola mancante dall'elenco delle parole non utilizza un tentativo; modificalo e riprova. Il nero significa che la lettera e la sua posizione sono corrette. Grigio significa che la lettera è nella parola ma in una posizione diversa. Il bianco significa che la lettera è assente. Le lettere ripetute vengono conteggiate separatamente. In spagnolo, usa Ñ e scrivi le vocali accentate senza accenti."
