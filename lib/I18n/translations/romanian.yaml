STR_QUEST_CAM_JOURNEY_THANKS_7: "Sera mută povestea departe de teancul de ordine regale, cere un alt scaun, apoi ascultă ultimele rânduri împreună cu tine."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Aster marchează o pagină cu o frunză curată. Ea vă mulțumește în liniște; puțin mai târziu o auzi citind același pasaj lângă fântână."
STR_QUEST_CAM_JOURNEY_THANKS_9: "O scurtă notă sosește împreună cu următorul pachet de pagini. Liora a copiat un pasaj pe care l-ai ajutat să-l restaurezi; pe margine ea a scris: „Am citit-o împreună acasă”."
STR_QUEST_CAM_JOURNEY_THANKS_10: "Nota are doar câteva rânduri. Liora a lăsat loc pentru un răspuns, de parcă te-ar putea vedea deja stând la celălalt capăt al mesei."
STR_QUEST_CAM_JOURNEY_THANKS_11: "Printre paginile recuperate găsiți nota împăturită de acasă. Ultima sa linie este simplă: „Există încă un loc pentru tine aici”."
