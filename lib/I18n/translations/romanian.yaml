STR_CAR_NEIGHBOUR: "%s sau %s a făcut-o (sau ambele)."
STR_CAR_INTRO: "Vinovăția și onestitatea sunt independente. Fiecare caz are exact o soluție. Înălțimile sunt trăsături de caracter fictive."
STR_CAR_HELP_TEXT: "Cum se rezolvă un caz\nFiecare caracter face o declarație. În partea de sus a ecranului oferă numărul exact de vinovați și declarații false. Găsiți o combinație care satisface ambele numere. Fiecare caz are o soluție.\n  \nVinovăția nu este onestitate\nUn personaj nevinovat poate minți, iar un vinovat poate spune adevărul. Două minciuni înseamnă că exact două declarații întregi sunt false; celelalte sunt adevărate. Semnele Adevăr / Minciună se referă la declarație; Suspectul se referă la vinovăție.\n  \nCitirea indiciilor\n\"A sau B a făcut-o (sau amândoi)\" înseamnă că cel puțin un personaj numit este vinovat. \"A și B au făcut-o\" necesită ambele. O minciună neagă întreaga afirmație: un fals OR înseamnă că niciunul nu a făcut-o; un fals AND înseamnă că cel puțin unul nu a făcut-o.\n  \n\"Amândoi adevărați sau amândoi mincinoși\" compară afirmațiile, nu vinovăția. \"Exact unul minte\" înseamnă că afirmațiile lor au valori diferite ale adevărului. Aceste indicii pot fi adevărate sau false.\n  \nVecini pe un mic ecran\nOrdinea circulară originală este Panther, Peacock, Shark, Fox, Bear, Cerb, Cal, folosind numai caracterele acestui caz. Ultimul și primul sunt vecini. Această aplicație scrie cele două nume direct în fiecare indiciu vecin. Nu trebuie să ghiciți care cărți sunt lângă un portret. Schimbarea paginii sau orientare nu schimbă un indiciu.\n  \nÎnălțime și greutate\nFiecare carte prezintă o înălțime și o dietă fictivă. \"Un vinovat este mai înalt decât mine\" înseamnă că cel puțin un vinovat este mai înalt decât vorbitorul, nu neapărat toți vinovații. Mai scurt funcționează în același mod. Indicii carnivore și erbivore înseamnă că cel puțin un vinovat are acea dietă; omnivorii contează ca nici unul. Numele, înălțimile și dietele sunt fapte de încredere; declarațiile pot minți.\n  \nANALIZĂ DUMNEAVOASTRĂ\nUtilizați? / Adevăr / Minciună și Suspect sub fiecare afirmație pentru a înregistra ipoteze. Acestea sunt notele dvs., nu dovezi sau verificări automate. Săgețile arată celelalte caractere. Modul portret afișează până la trei pe pagină.\n  \nFăcând o acuzație\nApăsați Accuse și selectați exact numărul necesar de vinovați. Doar confirmarea unei acuzații greșite consumă o viață. Începător și Normal au două vieți; Avansat și Expert au una. O acuzație corectă rezolvă cazul. Fără vieți rămase, soluția este dezvăluită.\n  \nCampanie şi reluare\nExistă 1.470 de cazuri. Cazul deschis reia încercarea curentă sau deschide următorul după unul închis. Campania vă permite să alegeți oricare dintre cele 1.470 de cazuri în orice ordine de la început. Reluarea începe o nouă încercare, păstrând finalizarea anterioară. În fiecare dificultate, cazurile progresează de la un vinovat la doi, apoi de la mai puțini mincinoși la mai mulți în fiecare grup de vinovați. Începătorul păstrează un vinovat. Lansările mai mici vin mai întâi atunci când numărul se potrivește. Toate cazurile rămân disponibile. Rezolvarea unui caz epuizat anterior îl actualizează la rezolvat.\n  \nProgresul și viețile sunt salvate pe cardul SD. Părăsirea, somnul sau repornirea unui dispozitiv nu restabilește vieți în încercarea curentă. O salvare eșuată blochează rezultatul până când Reîncercați reușește. Resetați toate cere confirmare înainte de a șterge numai progresul Carnivore."
