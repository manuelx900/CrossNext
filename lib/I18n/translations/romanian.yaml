STR_QUEST_CAM_JOURNEY_THANKS_2: "Mara pliază o pagină nou lizibilă și o pune lângă cartea de maree. Înainte de a se întoarce la fereastră, ea îți mulțumește cu o voce aspră de aerul sărat."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Iri pune o fâșie de cârpă uscată între două pagini. „Acela poate călători acum.” Ea ține volumul la piept înainte de a-l duce în celelalte cărți."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Taren își sprijină rucsacul pe piatră și ascultă în timp ce tu termini. Apoi repetă cuvintele unui călător, de data aceasta fără a fi nevoie să se uite la pagină."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Nadir își trage o panglică printre degete, citind un nume care era greu de deslușit înainte. El îți face un loc lângă foc."
