STR_INTERCEPT_TITLE_0: "Cabana 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942 – Te așteaptă în spatele unei uși încuiate. O componentă a calculatorului a dispărut. Dimineața interceptează rugina din buzunarul hainei tale."
STR_INTERCEPT_CHOICE_0_0: "Gândește-te prin acuzație"
STR_INTERCEPT_CHOICE_0_1: "Așteptați interviul"
STR_INTERCEPT_CHOICE_0_2: "Caută haina ta"
STR_INTERCEPT_TITLE_1: "acuzaţia"
STR_INTERCEPT_TEXT_1: "Ei suspectează trădarea. Tu rezolvi cifre, cuvinte încrucișate și poziții de șah pentru a trăi. Această cameră este o altă problemă: contrazice-te, iar credibilitatea ta poate fi prima victimă."
STR_INTERCEPT_CHOICE_1_0: "Alege o strategie"
STR_INTERCEPT_CHOICE_1_1: "Ascultați ce știu"
STR_INTERCEPT_TITLE_2: "A venit Harry"
STR_INTERCEPT_TEXT_2: "Harris intră cu o ceașcă de ceai și un fișier. Un rol este lipsit din Bombe. Numele tău era pe lista de sarcini."
STR_INTERCEPT_CHOICE_2_0: "Bea ceaiul"
STR_INTERCEPT_CHOICE_2_1: "Lăsați ceaiul neatins"
STR_INTERCEPT_CHOICE_2_2: "Răspunde calm"
STR_INTERCEPT_TITLE_3: "Componentul"
STR_INTERCEPT_TEXT_3: "În interiorul stratului de acoperire al hainei, degetele se întâlnesc cu metal rece. Componenta este încă acolo. Hooper a spus că luând-o ar face șantajul să se oprească."
STR_INTERCEPT_CHOICE_3_0: "Păstrează-l ascuns"
STR_INTERCEPT_CHOICE_3_1: "Dăruiește-i lui Harris"
STR_INTERCEPT_TITLE_4: "Un joc câștigător"
STR_INTERCEPT_TEXT_4: "Cooperarea vă poate păstra credibilitatea.O minciună convingătoare ar putea cumpăra timp.Escape-ul ar schimba o cameră închisă pentru gardienii din afară."
STR_INTERCEPT_CHOICE_4_0: "Cooperare"
STR_INTERCEPT_CHOICE_4_1: "Încearcă un alibi"
STR_INTERCEPT_CHOICE_4_2: "Verifică fereastra"
STR_INTERCEPT_TITLE_5: "Ceaiul"
STR_INTERCEPT_TEXT_5: "Harris observă tăcerea ta, dar fața lui se retrage deja.Când îți deschizi următorul ochi, o altă pereche de pantofi stă lângă masă."
STR_INTERCEPT_CHOICE_5_0: "Prefaceți-vă că rămâneți adormit"
STR_INTERCEPT_CHOICE_5_1: "Comparați vizitatorul"
STR_INTERCEPT_CHOICE_5_2: "Cereți apă"
STR_INTERCEPT_TITLE_6: "Un mic refuz"
STR_INTERCEPT_TEXT_6: "Harris urmărește mișcarea mai atent decât răspunsul.El întreabă dacă există altcineva pe care ar trebui să-l pună la îndoială."
STR_INTERCEPT_CHOICE_6_0: "Întreabă-l ce dovezi are"
STR_INTERCEPT_CHOICE_6_1: "Cuvânt cheie: Hooper"
STR_INTERCEPT_CHOICE_6_2: "Privește spre fereastră"
STR_INTERCEPT_TITLE_7: "Realitatea lipsă"
STR_INTERCEPT_TEXT_7: "Harris dorește un răspuns direct. – Ați luat componenta? – Puteți să-i spuneți ce este în haină, să explicați presiunea pe care Hooper a aplicat-o sau să încercați să indicați acuzația în altă parte."
STR_INTERCEPT_CHOICE_7_0: "Dă-i componenta"
STR_INTERCEPT_CHOICE_7_1: "Explicați șantajul"
STR_INTERCEPT_CHOICE_7_2: "Acuzarea lui Hooper"
STR_INTERCEPT_TITLE_8: "Metal pe masă"
STR_INTERCEPT_TEXT_8: "Componenta se află între tine. Harris o verifică fără să se relaxeze. Returnarea echipamentului furat nu explică de ce a fost luat. El vrea un nume și ceva mai fiabil decât cuvântul tău."
STR_INTERCEPT_CHOICE_8_0: "Oferta de a găsi dovezi"
STR_INTERCEPT_CHOICE_8_1: "Stai și răspunde la întrebări"
STR_INTERCEPT_TITLE_9: "Alibiul"
STR_INTERCEPT_TEXT_9: "Descrieți o seară liniștită la biroul dvs. Harris deschide fișierul. Un gardian v-a văzut părăsind camera de mașini. contul dvs. inventat are acum un martor împotriva acestuia."
STR_INTERCEPT_CHOICE_9_0: "Apără povestea"
STR_INTERCEPT_CHOICE_9_1: "Recunoaște șantajul"
STR_INTERCEPT_CHOICE_9_2: "Refuză alte întrebări"
STR_INTERCEPT_TITLE_10: "Fereastra"
STR_INTERCEPT_TEXT_10: "Fereastra este înaltă, iar sticla este groasă.Dincolo de ea, calea trece printr-o altă colibă.Ruptura ar fi tare; așteptarea aici are propriile pericole."
STR_INTERCEPT_CHOICE_10_0: "Rupeți paharul"
STR_INTERCEPT_CHOICE_10_1: "Studiază calea din afară"
STR_INTERCEPT_CHOICE_10_2: "Înapoi la interviu"
STR_INTERCEPT_TITLE_11: "Încă un vizitator"
STR_INTERCEPT_TEXT_11: "Hooper a venit în timp ce tu ești instabil. El vrea să știe dacă Harris are componenta."
STR_INTERCEPT_CHOICE_11_0: "Să pretinzi că dormi"
STR_INTERCEPT_CHOICE_11_1: "Cere o explicaţie"
STR_INTERCEPT_CHOICE_11_2: "Cereți apă"
STR_INTERCEPT_TITLE_12: "O avertizare"
STR_INTERCEPT_TEXT_12: "Îl chemi pe Harris înainte ca ceaiul să se oprească.El se întoarce, iritat.O acuzație despre pahar va avea nevoie de ceva ce poate testa."
STR_INTERCEPT_CHOICE_12_0: "Păstrează paharul ca dovadă"
STR_INTERCEPT_CHOICE_12_1: "Acuză-l pe Harris că te otrăvește"
STR_INTERCEPT_CHOICE_12_2: "Concentrează-te pe realitate"
STR_INTERCEPT_TITLE_13: "Speranță"
STR_INTERCEPT_TEXT_13: "Harris recunoaște numele. Hooper este util, bine conectat și nu lipsește nici din lista de aseară."
STR_INTERCEPT_CHOICE_13_0: "Găsește ceva verificabil"
STR_INTERCEPT_CHOICE_13_1: "Insistă Hooper a furat-o"
STR_INTERCEPT_TITLE_14: "Blackmailul"
STR_INTERCEPT_TEXT_14: "Descrieți un tânăr, o încredere trădată și cererea care a urmat. Harris ascultă fără să vă ajute."
STR_INTERCEPT_CHOICE_14_0: "Dați lui Harris contul complet"
STR_INTERCEPT_CHOICE_14_1: "Lasă numele"
STR_INTERCEPT_CHOICE_14_2: "Un mod de a prinde Hooper"
STR_INTERCEPT_TITLE_15: "O acuzaţie uşoară"
STR_INTERCEPT_TEXT_15: "Hooper, spui tu, trebuie să fie responsabil. Harris întreabă cum știi.Există o diferență între rezolvarea unei probleme și producerea unui martor care poate dovedi răspunsul."
STR_INTERCEPT_CHOICE_15_0: "Lasă-l pe Harris să conteste pretenția"
STR_INTERCEPT_CHOICE_15_1: "Încercați un mesaj privat pentru Hooper"
STR_INTERCEPT_TITLE_16: "Testul cheie"
STR_INTERCEPT_TEXT_16: "O poveste poate fi negată.Un document, un martor sau componenta lipsă este mai greu de explicat."
STR_INTERCEPT_CHOICE_16_0: "Verificați cabana din apropiere"
STR_INTERCEPT_CHOICE_16_1: "Utilizați interceptul de dimineață"
STR_INTERCEPT_CHOICE_16_2: "Întrebare Hooper direct"
STR_INTERCEPT_TITLE_17: "Mai mult decât o revenire"
STR_INTERCEPT_TEXT_17: "Mașina poate funcționa din nou, dar Harris are încă o încălcare a securității de explicat."
STR_INTERCEPT_CHOICE_17_0: "Arată dovezile"
STR_INTERCEPT_CHOICE_17_1: "Caută dovada"
STR_INTERCEPT_CHOICE_17_2: "Acceptă hotărârea lui"
STR_INTERCEPT_TITLE_18: "O contradicţie"
STR_INTERCEPT_TEXT_18: "Harris îți pune primul răspuns alături de cel mai recent.Nu pot fi amândoi adevărate.Puteți renunța la minciună sau puteți lăsa interviul să se încheie cu o contradicție."
STR_INTERCEPT_CHOICE_18_0: "Adevărul despre șantaj"
STR_INTERCEPT_CHOICE_18_1: "Continuă să negi totul"
STR_INTERCEPT_CHOICE_18_2: "Încearcă să pleci"
STR_INTERCEPT_TITLE_19: "Tăcerea"
STR_INTERCEPT_TEXT_19: "Harris închide dosarul.În această cameră, tăcerea nu pune capăt anchetei; ea doar încheie partea ta în direcționarea ei."
STR_INTERCEPT_CHOICE_19_0: "Ascultă decizia"
STR_INTERCEPT_TITLE_20: "Sticlă spartă"
STR_INTERCEPT_TEXT_20: "Aerul rece şi sunetul şoaptelor unui paznic se întâlnesc.Există timp pentru o decizie înainte ca cineva să ajungă la uşă."
STR_INTERCEPT_CHOICE_20_0: "Fugi pe calea exterioară"
STR_INTERCEPT_CHOICE_20_1: "Lăsați un codat clue"
STR_INTERCEPT_CHOICE_20_2: "Rămâi și explică"
STR_INTERCEPT_TITLE_21: "Între cabane"
STR_INTERCEPT_TEXT_21: "Hooper's Cottage este suficient de aproape pentru a ajunge înainte de următoarea patrulă, dar terenul deschis dincolo de ea oferă un alt fel de șansă."
STR_INTERCEPT_CHOICE_21_0: "Încercați să scăpați de motive"
STR_INTERCEPT_CHOICE_21_1: "Intră în cabana lui Hooper"
STR_INTERCEPT_CHOICE_21_2: "Înapoi la Harris"
STR_INTERCEPT_TITLE_22: "Un joc privat"
STR_INTERCEPT_TEXT_22: "Hooper te studiază pe tine.Pe masă el pune o poziţie imaginară de şah cu degetele sale.Un răspuns codificat l-ar putea face să dezvăluie ceea ce o acuzaţie directă nu ar fi făcut niciodată."
STR_INTERCEPT_CHOICE_22_0: "Răspuns cu un șah"
STR_INTERCEPT_CHOICE_22_1: "ameninţă cu numirea lui"
STR_INTERCEPT_CHOICE_22_2: "Vorbește sincer"
STR_INTERCEPT_TITLE_23: "Față în față"
STR_INTERCEPT_TEXT_23: "Încrederea lui se estompează numai atunci când menţionezi detalii pe care cineva din afara planului său nu ar trebui să le ştie."
STR_INTERCEPT_CHOICE_23_0: "Îl confruntă cu dovezi"
STR_INTERCEPT_CHOICE_23_1: "Oferă componenta ca o tranzacție"
STR_INTERCEPT_CHOICE_23_2: "blufă"
STR_INTERCEPT_TITLE_24: "Cupa"
STR_INTERCEPT_TEXT_24: "Hooper aduce apă, dar ajunge mai întâi la ceasca de ceai."
STR_INTERCEPT_CHOICE_24_0: "Păstrează paharul"
STR_INTERCEPT_CHOICE_24_1: "Verifică-ți haina din nou"
STR_INTERCEPT_TITLE_25: "Ceva de testat"
STR_INTERCEPT_TEXT_25: "Păstrezi paharul și îl rogi pe Harris să-l examineze.Acesta este în cele din urmă o acuzație cu un obiect atașat la el.Încercarea lui Hooper de a-l elimina oferă un al doilea detaliu util."
STR_INTERCEPT_CHOICE_25_0: "Dă-i lui Harris paharul"
STR_INTERCEPT_CHOICE_25_1: "Confruntare Hooper cu ea"
STR_INTERCEPT_TITLE_26: "Ținta greșită"
STR_INTERCEPT_TEXT_26: "Îl acuză pe Harris fără dovezi. vede un suspect care încearcă să-l discrediteze pe anchetator."
STR_INTERCEPT_CHOICE_26_0: "Interviul se încheie"
STR_INTERCEPT_TITLE_27: "Întregul cont"
STR_INTERCEPT_TEXT_27: "Dă numele și descrie întâlnirea. Harris pune întrebări precise. rușinea ta este reală, dar și detaliile pe care le poate verifica acum."
STR_INTERCEPT_CHOICE_27_0: "Să verifice contul"
STR_INTERCEPT_CHOICE_27_1: "Oferta de a găsi Hooper"
STR_INTERCEPT_TITLE_28: "O înșelăciune eșuată"
STR_INTERCEPT_TEXT_28: "Harris a auzit suficiente răspunsuri încrezătoare. Hooper are, de asemenea. nici nu furnizează faptul că povestea ta este lipsă."
STR_INTERCEPT_CHOICE_28_0: "Persistă în revendicare"
STR_INTERCEPT_CHOICE_28_1: "O evadare disperată"
STR_INTERCEPT_CHOICE_28_2: "Recunoaște ce s-a întâmplat cu adevărat"
STR_INTERCEPT_TITLE_29: "Interceptarea"
STR_INTERCEPT_TEXT_29: "Hârtia din buzunar poartă mai mult decât litere: traseul său prin colibe îl plasează pe Hooper lângă mașină."
STR_INTERCEPT_CHOICE_29_0: "Codifică un mesaj pentru Hooper"
STR_INTERCEPT_CHOICE_29_1: "Arată traseul către Harris"
STR_INTERCEPT_TITLE_30: "Mașina rulează"
STR_INTERCEPT_TEXT_30: "Harris are componenta, și un traseu care duce dincolo de primele dvs. răspunsuri speriate. Bomba își relansează activitatea. Lăsați Hut 14 sub propriul nume, cu mai puține secrete și un viitor încă de răspuns pentru."
STR_INTERCEPT_TITLE_31: "Sub suspiciune"
STR_INTERCEPT_TEXT_31: "Returnarea componentei a salvat aparatul de o întârziere. Nu v-a salvat poziția. Harris vă încheie accesul la cuști în timp ce ancheta continuă. Ați supraviețuit interviului, dar nu v-ați șters numele."
STR_INTERCEPT_TITLE_32: "În custodie"
STR_INTERCEPT_TEXT_32: "Contradicțiile, dovezile lipsă și o componentă furată au devenit un caz pe care nu îl mai puteți direcționa."
STR_INTERCEPT_TITLE_33: "Calea exterioară"
STR_INTERCEPT_TEXT_33: "Lăsați cuiburile în urmă. Întunericul este util, dar terenul este păzit.O fereastră spartă a adus patrulele mai aproape decât v-ați așteptat."
STR_INTERCEPT_CHOICE_33_0: "traversează terenul deschis"
STR_INTERCEPT_CHOICE_33_1: "Continuă pe calea serviciului"
STR_INTERCEPT_CHOICE_33_2: "Întoarce-te și privește pe Harris"
STR_INTERCEPT_TITLE_34: "Cabana lui Hooper"
STR_INTERCEPT_TEXT_34: "Biroul este neînsoțit. Documentele se află sub un cuvânt încrucișat, iar camera mașinilor apare într-un program cu creion."
STR_INTERCEPT_CHOICE_34_0: "Examinează documentele"
STR_INTERCEPT_CHOICE_34_1: "Așteptați Hooper"
STR_INTERCEPT_CHOICE_34_2: "Plecare pentru Harris"
STR_INTERCEPT_TITLE_35: "O problemă de șah"
STR_INTERCEPT_TEXT_35: "Îi dai lui Hooper o poziție care reflectă situația sa: o bucată protejată, un rege expus și o mișcare care pare sigură până la răspuns."
STR_INTERCEPT_CHOICE_35_0: "Cere-i să recunoască planul"
STR_INTERCEPT_CHOICE_35_1: "Trimiteți admiterea la Harris"
STR_INTERCEPT_TITLE_36: "Fără mască"
STR_INTERCEPT_TEXT_36: "Vorbiți despre presiune în loc să pretindeți că nu a existat niciodată. Hooper răspunde pe scurt ca persoană mai degrabă decât ca adversar."
STR_INTERCEPT_CHOICE_36_0: "Solicitați un acord corect"
STR_INTERCEPT_CHOICE_36_1: "Cere-i să mărturisească"
STR_INTERCEPT_CHOICE_36_2: "Luați contul pentru Harris"
STR_INTERCEPT_TITLE_37: "Admiterea lui Hooper"
STR_INTERCEPT_TEXT_37: "Hooper explică suficient pentru a conecta șantajul la componenta lipsă. Harris poate acum să recupereze echipamentul și să verifice povestea."
STR_INTERCEPT_CHOICE_37_0: "Dă-i lui Harris recunoaşterea"
STR_INTERCEPT_CHOICE_37_1: "Lasă-l pe Hooper să plece"
STR_INTERCEPT_TITLE_38: "comerţului"
STR_INTERCEPT_TEXT_38: "Puneți ultima bucată de pârghie la îndemâna lui Hooper.O afacere fără un martor sau dovezi este o invitație pentru el să-și rezolve problema pe cheltuiala ta."
STR_INTERCEPT_CHOICE_38_0: "Mâna peste componentă"
STR_INTERCEPT_CHOICE_38_1: "Solicitați un acord martor"
STR_INTERCEPT_CHOICE_38_2: "Retrage oferta"
STR_INTERCEPT_TITLE_39: "Harry ascultă"
STR_INTERCEPT_TEXT_39: "Detaliile pot fi verificate. Harris întreabă unde este componenta acum. Clearing contul și obținerea mașinii rulează sunt probleme conexe, dar acestea nu sunt aceleași."
STR_INTERCEPT_CHOICE_39_0: "Întoarce ce ai în haină"
STR_INTERCEPT_CHOICE_39_1: "Ajută la recuperarea componentei"
STR_INTERCEPT_CHOICE_39_2: "Nu mai răspunde acum"
STR_INTERCEPT_TITLE_40: "Dincolo de gard"
STR_INTERCEPT_TEXT_40: "Libertatea în afara terenului nu este același lucru cu inocența, iar mașina este acum problema urgentă a altcuiva."
STR_INTERCEPT_TITLE_41: "Ultima greșeală"
STR_INTERCEPT_TEXT_41: "Patrula ajunge la tine înainte de sfârșitul terenului deschis, sau promisiunea lui Hooper se prăbușește atunci când nu mai este util pentru el."
STR_INTERCEPT_TITLE_42: "hârtiilor"
STR_INTERCEPT_TEXT_42: "Calendarul îl plasează pe Hooper unde povestea voastră a spus că este. Alături de el este nota care te-a atras mai întâi în capcană."
STR_INTERCEPT_CHOICE_42_0: "Luați documentele la Harris"
STR_INTERCEPT_CHOICE_42_1: "Așteptați și confruntați-vă cu Hooper"
STR_INTERCEPT_TITLE_43: "Un ultim aranjament"
STR_INTERCEPT_TEXT_43: "Încrederea în el ar elimina o problemă imediată; făcând pe Harris un martor ar face mai dificilă crearea unei alte."
STR_INTERCEPT_CHOICE_43_0: "Întoarceți un martor"
STR_INTERCEPT_CHOICE_43_1: "Luați-l pe Harris în plan"
STR_INTERCEPT_TITLE_44: "Recuperarea reală"
STR_INTERCEPT_TEXT_44: "Cu contul înregistrat, căutarea revine la hardware-ul lipsă. Harris verifică camera de mașini în timp ce identificați unde ar trebui să fie componenta."
STR_INTERCEPT_CHOICE_44_0: "Încheie revenirea verificată"
STR_INTERCEPT_CHOICE_44_1: "Scoate-l din haina ta"
STR_INTERCEPT_CHOICE_44_2: "Avertizează-l pe Harris despre Hooper"
STR_INTERCEPT_TITLE_45: "întrebarea finală"
STR_INTERCEPT_TEXT_45: "Harris așteaptă. Dacă puteți conecta Hooper la furt, există încă o modalitate de a recupera componenta și de a termina acest lucru în mod corespunzător."
