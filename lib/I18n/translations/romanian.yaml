STR_DRAUGHTS_HELP: "Atingeți o piesă, apoi destinația acesteia. Sunt necesare capturi; finaliza fiecare salt. Internațional: 10x10, 20 de piese, capturi înapoi, regi zburătoare și captura maximă. Brazilian: aceleași reguli de captură pe 8x8 cu 12 piese. Spaniolă: bărbații captează înainte, regi zburători; ia majoritatea pieselor, apoi majoritatea regilor. Engleză: regii scurti, capturi înaintea omului, orice lanț de captură complet. Atingerea rândului de coroană încheie o viraj în engleză sau spaniolă. Alegeți regulile, adversarul și dificultatea din Setări. Modul local permite două persoane să partajeze cititorul. Modificările regulilor se aplică unui joc nou."
