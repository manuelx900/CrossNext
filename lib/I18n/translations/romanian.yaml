STR_QUEST_CAM_DECOR_NAME_0: "Zână Pădurii"
STR_QUEST_CAM_DECOR_TEXT_0: "Ai eliberat zâna de rădăcinile tăcute. Ea va aduce o mică minune acasă."
STR_QUEST_CAM_SOLO_DECOR_NAME_1: "Lanterna de pădure"
STR_QUEST_CAM_SOLO_DECOR_TEXT_1: "Un felinar pentru a vă lumina colțul de lectură."
STR_QUEST_CAM_DECOR_NAME_2: "Echo Conch"
STR_QUEST_CAM_DECOR_TEXT_2: "Un marinar salvat îți oferă o carapace care încă ține cântecul mării."
STR_QUEST_CAM_DECOR_NAME_3: "Spirit de cerneală"
STR_QUEST_CAM_DECOR_TEXT_3: "Un spirit a scăpat de pe o pagină goală. Alege să călătorească cu tine."
STR_QUEST_CAM_DECOR_NAME_4: "floare de lună"
STR_QUEST_CAM_DECOR_TEXT_4: "Grădinarii au salvat o sămânță din grădina adormită. Această floare a crescut pentru tine."
STR_QUEST_CAM_DECOR_NAME_5: "Cristal de iarnă"
STR_QUEST_CAM_DECOR_TEXT_5: "Dezghețul dezvăluie un cristal care deține ultima amintire a muntelui."
STR_QUEST_CAM_DECOR_NAME_6: "Bufniță mecanică"
STR_QUEST_CAM_DECOR_TEXT_6: "ceasornicarul repară acest mic gardian pentru a-ți mulțumi că ai adus timpul înapoi."
STR_QUEST_CAM_DECOR_NAME_7: "Pene de Phoenix"
STR_QUEST_CAM_DECOR_TEXT_7: "Din cenușa recuperată se ridică o pană: promisiunea că poveștile pot începe din nou."
STR_QUEST_CAM_DECOR_NAME_8: "Lampă din deșert"
STR_QUEST_CAM_DECOR_TEXT_8: "Un povestitor îți oferă lampa care a ținut vii poveștile din deșert."
STR_QUEST_CAM_DECOR_NAME_9: "Cloud Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "Deschideți cușca de nor. O mică koi rămâne să vă vegheze asupra viselor."
STR_QUEST_CAM_DECOR_NAME_10: "Inimă de dragon"
STR_QUEST_CAM_DECOR_TEXT_10: "Dragonii îți încredințează un cristal născut din amintirea lor recuperată."
STR_QUEST_CAM_DECOR_NAME_11: "Steaua memoriei"
STR_QUEST_CAM_DECOR_TEXT_11: "Prima stea restaurată îți luminează drumul către paginile finale."
STR_QUEST_CAM_DECOR_NAME_12: "Vlăstarul lecturii"
STR_QUEST_CAM_DECOR_TEXT_12: "O plantă mică pentru un colț de lectură liniștit."
STR_QUEST_CAM_DECOR_NAME_13: "Cărți salvate"
STR_QUEST_CAM_DECOR_TEXT_13: "Povești care își așteaptă următorul cititor."
STR_QUEST_CAM_DECOR_NAME_14: "Banner Voyager"
STR_QUEST_CAM_DECOR_TEXT_14: "Un fanion pentru a aminti fiecare nou început."
STR_QUEST_CAM_DECOR_NAME_15: "Ciuperci Lună"
STR_QUEST_CAM_DECOR_TEXT_15: "O bucată mică de pădure pentru casa ta."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Începutul aventurii"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Mulți ani oamenii au trăit în pace și s-au bucurat de cărțile lor. Atunci regele uitării a început să-i distrugă. A vrut să-i oprească pe toți să citească și să facă toate poveștile să dispară pentru totdeauna."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Monștrii regelui"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Regele Uitării și-a trimis monștrii în toată lumea. Au distrus fiecare carte pe care au găsit-o și au atacat pe oricine încerca să-i oprească. Bibliotecile au început să dispară, iar oamenii au încetat să citească."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Puterea lecturii"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Într-o zi, în timp ce citești lângă satul tău, apare un monstru. Încerci să scapi, dar se întâmplă ceva surprinzător: cu cât citești mai mult, cu atât devine mai slab. Îți dai seama că lectura este singura modalitate de a lupta cu magia regelui."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Misiunea ta"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Ți-ai propus să-l oprești pe rege. În drum spre castelul lui trebuie să traversezi păduri, orașe, munți și alte locuri pline de dușmani. Fiecare monstru pe care îl învingi te duce puțin mai aproape. Continuați să citiți, învingeți-i pe gardienii și ajungeți la el înainte de a distruge fiecare carte din lume."
