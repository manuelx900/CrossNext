STR_INTERCEPT_ABOUT: "O adaptare condensată a The Intercept de inkle , 2016, utilizată sub licența MIT. Bletchley Park, 1942: o componentă a mașinii lipsă, șantaj și un interviu care se poate termina în libertate sau custodie.\n\nDeciziile și poziția dvs. sunt salvate după fiecare alegere. O nouă poveste resetează acest joc. Ilustrațiile originale au fost create pentru acest firmware. Scriptul și licența originală sunt incluse în proiect."
