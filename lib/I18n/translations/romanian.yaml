STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Ajută-mă să pun în ordine poveştile grădinarilor, aceste seminţe au nevoie de mai mult decât un nume pe un pachet."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Ajută-ne să păstrăm aceste povești în circulație. Vreau ca oamenii pe care i-am găsit să se poată auzi unul pe altul."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Ajută-ne să citim poveștile care ajung pe ultimul drum, fiecare aparținând cuiva care așteaptă dincolo de zidurile regelui."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Ajutați-ne să citim aceste povești în întregime, pentru că după atâta timp de separare, proprietarii lor merită mai mult decât un nume pe o listă."
STR_QUEST_CAM_JOURNEY_THANKS_0: "Liora netezește pagina cu palma. „Pot auzi din nou acea linie”, spune ea. În această seară, va lăsa cartea deschisă lângă lampă."
