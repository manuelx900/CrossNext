STR_FLASHCARDS_HELP: "Copiați pachetele Anki (.apkg /.colpkg , .anki2 /.anki21 ), CSV /TSV/text sau dosarele de studiu convertite în /FLASHCARDS. Folosiți subdosare: până la 128 de articole fiecare.\n\nImports acceptă carduri de text de bază, inversate și simple. Audio și HTML personalizat nu sunt acceptate. Convertiți mai întâi pachetele de imagini /CJK. Recenziile offline folosesc FSRS. Importul începe o nouă programare și păstrează originalele."
