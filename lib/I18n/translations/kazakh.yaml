STR_CAR_HELP_TEXT: "ІСТІ ҚАЛАЙ ШЕШУ КЕРЕК\nӘрбір күдікті бір мәлімдеме жасайды. Экранның жоғарғы жағында кінәлілердің нақты сандары мен жалған мәлімдемелер берілген. Екі санды да қанағаттандыратын комбинацияны табыңыз. Әрбір жағдайда бір шешім бар.\n\nКҮНӘ АДАЛ ЕМЕС\nЖазықсыз күдікті өтірік айтуы мүмкін, ал кінәлі шындықты айтуы мүмкін. Екі өтірік дәл екі толық мәлімдеменің жалған екенін білдіреді; басқалары рас. Ақиқат / Өтірік белгілері мәлімдемеге қатысты; Күдікті кінәні білдіреді.\n\nНҰСҚАУЛАРДЫ ОҚУ\n\"А немесе В мұны жасады (немесе екеуі де)\" кем дегенде бір күдіктінің кінәлі екенін білдіреді. «А және В мұны істеді» екеуін де талап етеді. Өтірік барлық мәлімдемені жоққа шығарады: өтірік НЕМЕСЕ оны орындамағанын білдіреді; жалған ЖӘНЕ кем дегенде біреуі жоқ дегенді білдіреді.\n\n\"Екеуі де шын немесе екеуі де өтірік\" кінәні емес, мәлімдемелерді салыстырады. «Дәл біреуі өтірік айтады» дегені олардың мәлімдемелерінің әртүрлі ақиқат мәндерін білдіреді. Бұл белгілердің өзі ақиқат немесе жалған болуы мүмкін.\n\nКІШІ ЭКРАНДАҒЫ КӨРШІЛЕР\nТүпнұсқа дөңгелек тәртіп - Пантера, Тауыс, Акула, Түлкі, Аю, Бұғы, Жылқы, тек осы істің күдіктілері қолданылады. Соңғысы мен біріншісі көрші. Бұл қолданба екі атауды әрбір көрші анықтамаға тікелей жазады. Портреттің жанында қандай карталар бар екенін ешқашан болжау қажет емес. Бетті немесе бағдарды өзгерту анықтаманы өзгертпейді.\n\nBOY МЕН ДИЕТА\nӘрбір карта ойдан шығарылған бой мен диетаны көрсетеді. «Кінәлі меннен биік» демекші, барлық кінәлілер міндетті емес, кем дегенде бір кінәлі сөйлеушіден биік. Shorter бірдей жұмыс істейді. Етқоректілер мен шөпқоректілердің анықтамалары кем дегенде бір кінәліде бұл диета бар дегенді білдіреді; барлық қоректілер ешқайсысы да жоқ деп есептеледі. Аттар, бойлар мен диеталар - сенімді фактілер; мәлімдемелер өтірік айтуы мүмкін.\n\nСІЗДІҢ ТАЛДАУ\nПайдалану? / Ақиқат / Гипотезаларды жазу үшін әрбір мәлімдеменің астында өтірік және күдікті. Бұл сіздің жазбаларыңыз, дәлелдер немесе автоматты тексерулер емес. Көрсеткілер басқа күдіктілерді көрсетеді. Портрет режимі әр бетте үшке дейін көрсетеді.\n\nАЙПА ҚОСУ\nАйыптау түймесін басып, кінәлілердің қажетті санын дәл таңдаңыз. Қате айыпты растау ғана өмірді өткізеді. Бастауыш пен Қалыптының екі өмірі бар; Жетілдірілген және Сарапшылардың біреуі бар. Дұрыс айыптау істі шешеді. Ешбір адам қалмай, шешім ашылды.\n\nНАУҚАНЫ ЖӘНЕ\nҚАЙТАЛАУ 1470 жағдай бар. Ашық регистр ағымдағы әрекетті жалғастырады немесе жабылғаннан кейін келесісін ашады. Науқан басынан бастап кез келген ретпен 1470 жағдайдың кез келгенін таңдауға мүмкіндік береді. Қайта ойнату ертерек аяқталуын сақтай отырып, жаңа әрекетті бастайды. Әрбір қиындықтың ішінде істер бір кінәліден екіге, содан кейін әрбір кінәлі топтағы өтірікшілер саны аздан көбірек болады. Бастаушы бір кінәлі ұстайды. Есептер сәйкес келген кезде кішірек құймалар бірінші орында келеді. Барлық жағдайлар қолжетімді болып қалады. Бұрын таусылған істі шешу оны шешілгенге дейін жаңартады.\n\nПрогресс пен өмір SD картасында сақталады. Шығу, ұйықтау немесе құрылғыны қайта іске қосу ағымдағы әрекеттегі өмірді қалпына келтірмейді. Сәтсіз сақтау Қайталау сәтті болғанша нәтижені блоктайды. Тек Carnivore барысын өшірмес бұрын, растауды сұрайтын барлық сұрауларды қалпына келтіріңіз."
