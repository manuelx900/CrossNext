STR_PET_STORY_TEXT_0: "Сіз тарауды аяқтадыңыз. Сіздің жолдасыңыздың жанында кішкентай тұқым өсіп шықты. Сіз оған терезеден орын бересіз."
STR_PET_STORY_1: "Жаңбырлы күн"
STR_PET_STORY_TEXT_1: "Сіз оқып жатқанда жаңбыр терезені түртеді. Сіздің серігіңіз жақын жерде бұралған. Біраз уақыт бойы бүкіл бөлме өзін баспана сияқты сезінеді."
STR_PET_STORY_2: "Келуші"
STR_PET_STORY_TEXT_2: "Терезенің жанына құс қонды. Сіздің серігіңіз ұшып кеткенше тыныш қарап тұрады. Парақшаңызды белгілеп, күліңіз."
STR_PET_STORY_3: "Қағаз қайық"
STR_PET_STORY_TEXT_3: "Қағаз қиындысы кішкентай қайыққа айналады. Сіздің серігіңіз оның соңынан бүкіл шытырман оқиғаны өткізгендей, үстелдің арғы жағында жүреді."
STR_PET_STORY_4: "Жұлдыздар астында"
STR_PET_STORY_TEXT_4: "Оқыған соң бірге қарайсың. Бір жұлдыз пайда болады, содан кейін басқа. Әлі ашатын көп нәрсе бар."
STR_PET_STORY_5: "Жоғалған жапырақ"
STR_PET_STORY_TEXT_5: "Жолдасыңыз сізге жапырақ әкеледі. Сіз оны бетбелгіңіздің қасында сақтайсыз: кәдімгі күндегі шағын сыйлық."
STR_PET_STORY_6: "Тыныш бұрыш"
STR_PET_STORY_TEXT_6: "Ыңғайлы бұрыш тауып, кітабыңызды ашасыз. Сіздің серігіңіз сіздің жаныңызға орналасады. Екеуіңіз де асықпайсыз."
STR_PET_STORY_7: "Жаңа жол"
