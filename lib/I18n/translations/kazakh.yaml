STR_FLASHCARDS_HELP: "Anki палубаларын (.apkg /.colpkg , .anki2 /.anki21 ), CSV /TSV/text немесе /FLASHCARDS. түріне түрлендірілген Оқу қалталарын көшіріңіз Ішкі қалталарды пайдаланыңыз: әрқайсысында 128 элементке дейін.\n\nИмпорттар негізгі, кері және қарапайым жабу мәтін карталарын қабылдайды. Аудио және реттелетін HTML қолдау көрсетілмейді. Алдымен кескіннің /CJK палубаларын түрлендіріңіз. Офлайн шолулар FSRS пайдаланады. Импорттау жаңа кестені бастайды және түпнұсқаларды сақтайды."
