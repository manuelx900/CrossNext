STR_INTERCEPT_ABOUT: "MIT лицензиясы бойынша пайдаланылған The Intercept by inkle, 2016 жылғы қысқартылған бейімделуі. Блетчли Парк, 1942: машинаның жетіспейтін құрамдас бөлігі, бопсалау және бостандықпен немесе қамауда болуы мүмкін сұхбат.\n\nСіздің шешімдеріңіз бен ұстанымыңыз әрбір таңдаудан кейін сақталады. Жаңа оқиға осы ойынды қалпына келтіреді. Осы микробағдарлама үшін түпнұсқа иллюстрациялар жасалды. Түпнұсқа сценарий мен лицензия жобаға енгізілген."
