STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Осы оқиғаларды оттың жанында оқыңыз. Саяхатқа шықпас бұрын мен әркім өз атын естігенін қалаймын."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_6: "Қоңыраулар соғылмай тұрып менімен бірге осы бетті оқыңыз. Маған циферблаттағы сағаттан артық есте қалуым керек."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_7: "Осы куәлікті толығымен оқыңыз. Мұнда тыңдау үшін тым көп күткен адамдар бар."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Бұл естелікті субұрқақтың жанында оқыңыз. Осында еккен адам артына не қалдырар деп үміттенгенін естігім келеді."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Біз сізге жіберген оқиғаларды оқыңыз. Үйден шыққан дауыстар сізді осынша алыс жерде де жалғастыра алады."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Жолға шықпас бұрын осы хатты оқыңыз. Әрбір естелікті жалғыз алып жүрудің қажеті жоқ."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_11: "Біз сіз үшін сақтаған сөздерді оқыңыз. Бекініс бүкіл әлем емес, ол қаншалықты тыныш болса да."
