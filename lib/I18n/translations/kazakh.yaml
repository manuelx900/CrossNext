STR_INTERCEPT_TITLE_0: "HUT 14"
STR_INTERCEPT_TEXT_0: "Блетчли Парк, 1942. Олар сізді жабық есіктің артында күтіп тұр. Есептеу машинасының құрамдас бөлігі жоғалып кетті. Таңертең пальто қалтаңыздың сыбдырын естиді. Сыртта аяқ дыбыстары тоқтайды."
STR_INTERCEPT_CHOICE_0_0: "Айыптау туралы ойланыңыз"
STR_INTERCEPT_CHOICE_0_1: "Сұхбат алушыны күтіңіз"
STR_INTERCEPT_CHOICE_0_2: "Пальтоңызды іздеңіз"
STR_INTERCEPT_TITLE_1: "АЙПА"
STR_INTERCEPT_TEXT_1: "Олар опасыздықтан күдіктенеді. Сіз өмір сүру үшін фигураларды, кроссвордтарды және шахмат позицияларын шешесіз. Бұл бөлме тағы бір мәселе: өзіңізге қайшы келіңіз және сіздің сенімділігіңіз бірінші құрбан болуы мүмкін."
STR_INTERCEPT_CHOICE_1_0: "Стратегияны таңдаңыз"
STR_INTERCEPT_CHOICE_1_1: "Олардың білетінін тыңдаңыз"
STR_INTERCEPT_TITLE_2: "ХАРРИС КЕЛЕДІ"
STR_INTERCEPT_TEXT_2: "Харрис шәй шыны мен файлмен кіреді. Бомбеде катушкалар жоқ. Сіздің атыңыз кезекшілік тізімінде болды. Кесені қасыңа қойып, кеше түнде қайда болғаныңды сұрайды."
STR_INTERCEPT_CHOICE_2_0: "Шай ішіңіз"
STR_INTERCEPT_CHOICE_2_1: "Шайды қол тигізбей қалдырыңыз"
STR_INTERCEPT_CHOICE_2_2: "Сабырмен жауап беріңіз"
STR_INTERCEPT_TITLE_3: "КОМПОНЕНТ"
STR_INTERCEPT_TEXT_3: "Пальто төсенішінің ішінде саусақтарыңыз суық металға түседі. Компонент әлі де бар. Хупер оны алу бопсалауды тоқтататынын айтты. Енді жабық есіктің мағынасы басқаша."
STR_INTERCEPT_CHOICE_3_0: "Оны жасырыңыз"
STR_INTERCEPT_CHOICE_3_1: "Оны Харриске беріңіз"
STR_INTERCEPT_TITLE_4: "ҰТТЫ ОЙЫН"
STR_INTERCEPT_TEXT_4: "Ынтымақтастық сіздің сеніміңізді сақтай алады. Сенімді өтірік уақытты сатып алуы мүмкін. Escape сырттағы күзетшілерге жабық бөлмені ауыстырады. Бұл қозғалыстардың ешқайсысын кері қайтару мүмкін емес."
STR_INTERCEPT_CHOICE_4_0: "Ынтымақтастық"
STR_INTERCEPT_CHOICE_4_1: "Әліби ойлап табыңыз"
STR_INTERCEPT_CHOICE_4_2: "Терезені тексеріңіз"
STR_INTERCEPT_TITLE_5: "ШАЙ"
STR_INTERCEPT_TEXT_5: "Бөлме еңкейеді. Харрис сенің үнсіздігіңді байқады, бірақ оның жүзі әлдеқашан кетіп қалды. Келесі рет көзіңізді ашқанда үстелдің жанында тағы бір аяқ киім тұр."
STR_INTERCEPT_CHOICE_5_0: "Ұйықтап жатқандай кейіп танытыңыз"
STR_INTERCEPT_CHOICE_5_1: "Келушімен бетпе-бет келіңіз"
STR_INTERCEPT_CHOICE_5_2: "Су сұраңыз"
STR_INTERCEPT_TITLE_6: "КІШІН БАСТАУ"
STR_INTERCEPT_TEXT_6: "Сіз тостағанды итеріп жібересіз. Харрис жауаптан гөрі қозғалысты мұқият бақылайды. Ол сұрайтын басқа біреу бар ма деп сұрайды."
STR_INTERCEPT_CHOICE_6_0: "Оның қандай дәлелдері бар екенін сұраңыз"
STR_INTERCEPT_CHOICE_6_1: "Хуперді атап өтіңіз"
STR_INTERCEPT_CHOICE_6_2: "Терезе жаққа қараңыз"
STR_INTERCEPT_TITLE_7: "ЖОҚ БАР"
STR_INTERCEPT_TEXT_7: "Харрис тікелей жауап алғысы келеді. Сіз компонентті қабылдадыңыз ба? Сіз оған пальтоңызда не бар екенін айта аласыз, Гупер жасаған қысымды түсіндіре аласыз немесе айыпты басқа жерде көрсетуге тырысыңыз."
STR_INTERCEPT_CHOICE_7_0: "Оған компонентті беріңіз"
STR_INTERCEPT_CHOICE_7_1: "Бопсалауды түсіндіріңіз"
STR_INTERCEPT_CHOICE_7_2: "Гуперді айыптау"
STR_INTERCEPT_TITLE_8: "СТАЛДАҒЫ МЕТАЛ"
STR_INTERCEPT_TEXT_8: "Құрамдас бөлік сіздің араңызда. Харрис оны босаңсытпай тексереді. Ұрланған жабдықты қайтару оның не үшін алынғанын түсіндірмейді. Ол сіздің сөзіңізден гөрі есімді және сенімдірек нәрсені қалайды."
STR_INTERCEPT_CHOICE_8_0: "Дәлелдерді табуды ұсыныңыз"
STR_INTERCEPT_CHOICE_8_1: "Қалып, сұрақтарға жауап беріңіз"
STR_INTERCEPT_TITLE_9: "ӘЛІБИ"
STR_INTERCEPT_TEXT_9: "Сіз үстеліңіздегі тыныш кешті суреттейсіз. Харрис файлды ашады. Күзетші сіздің машина бөлмесінен шығып жатқаныңызды көрді. Сіздің ойлап тапқан есептік жазбаңыз енді оған қарсы куәгер бар."
STR_INTERCEPT_CHOICE_9_0: "Әңгімені қорғау"
STR_INTERCEPT_CHOICE_9_1: "Бопсалауды мойындаңыз"
STR_INTERCEPT_CHOICE_9_2: "Қосымша сұрақтардан бас тартыңыз"
STR_INTERCEPT_TITLE_10: "ТЕРЕЗЕ"
STR_INTERCEPT_TEXT_10: "Терезе биік, әйнегі қалың. Оның арғы жағында жол басқа саятықтың жанынан өтеді. Оны бұзу қатты болады; мұнда күтудің өз қаупі бар."
STR_INTERCEPT_CHOICE_10_0: "Шыныны сындырыңыз"
STR_INTERCEPT_CHOICE_10_1: "Сырттағы жолды зерттеңіз"
STR_INTERCEPT_CHOICE_10_2: "Сұхбатқа оралу"
STR_INTERCEPT_TITLE_11: "ТАҒЫ КЕЛУШІ"
STR_INTERCEPT_TEXT_11: "Сіз тұрақсыз кезде Хупер келді. Ол Харристің құрамдас бөлігі бар-жоғын білгісі келеді. Бір қолын есікке жақын ұстайды."
STR_INTERCEPT_CHOICE_11_0: "Ұйықтап жатқан кейіп танытыңыз"
STR_INTERCEPT_CHOICE_11_1: "Түсіндіруді талап етіңіз"
STR_INTERCEPT_CHOICE_11_2: "Су сұраңыз"
STR_INTERCEPT_TITLE_12: "ЕСКЕРТУ"
STR_INTERCEPT_TEXT_12: "Шай ішер алдында Харристі шақырасыз. Ол тітіркеніп қайтады. Тостағанға қатысты айыптау үшін ол сынай алатын нәрсе керек болады."
STR_INTERCEPT_CHOICE_12_0: "Шыныаяқты дәлел ретінде сақтаңыз"
STR_INTERCEPT_CHOICE_12_1: "Харристі сізді уландырды деп айыптаңыз"
STR_INTERCEPT_CHOICE_12_2: "Бар назарыңызды катушкаға аударыңыз"
STR_INTERCEPT_TITLE_13: "ХУПЕР"
STR_INTERCEPT_TEXT_13: "Харрис есімді таниды. Хупер пайдалы, жақсы байланысқан және кеше түнгі тізімде де жоқ емес. Тану дәлел емес."
STR_INTERCEPT_CHOICE_13_0: "Тексерілетін нәрсені табыңыз"
STR_INTERCEPT_CHOICE_13_1: "Оны Хупер ұрлады деп талап етіңіз"
STR_INTERCEPT_TITLE_14: "ШАПТАУ"
STR_INTERCEPT_TEXT_14: "Сіз жас жігітті, сатқындық жасаған сенімді және одан кейінгі талапты сипаттайсыз. Харрис сізге көмектеспей тыңдайды. Тұзақ құрған адамның атын атасаңыз, сіз қорғаймын деп үміттенген адамды да ашуы мүмкін."
STR_INTERCEPT_CHOICE_14_0: "Харриске толық есептік жазбаны беріңіз"
STR_INTERCEPT_CHOICE_14_1: "Есімдерді қалдырыңыз"
STR_INTERCEPT_CHOICE_14_2: "Хуперді ұстау жолын ұсыныңыз"
STR_INTERCEPT_TITLE_15: "ОҢАЙ АЙПА"
STR_INTERCEPT_TEXT_15: "Гупер, сіз айтасыз, жауапты болуы керек. Харрис сен қайдан білесің деп сұрайды. Мәселені шешу мен жауапты дәлелдей алатын куәгер шығарудың арасында айырмашылық бар."
STR_INTERCEPT_CHOICE_15_0: "Харриске шағымға қарсы шығуға рұқсат етіңіз"
STR_INTERCEPT_CHOICE_15_1: "Хуперге жеке хабарлама жіберіп көріңіз"
STR_INTERCEPT_TITLE_16: "ТЕКСЕРУГЕ БОЛАДЫ"
STR_INTERCEPT_TEXT_16: "Оқиғаны жоққа шығаруға болады. Құжатты, куәгерді немесе жоқ құрамдас бөлікті түсіндіру қиынырақ. Сізде не істеу керектігін таңдауға аз уақыт бар."
STR_INTERCEPT_CHOICE_16_0: "Маңайдағы саятшылықты тексеріңіз"
STR_INTERCEPT_CHOICE_16_1: "Таңертеңгілік үзіндіні пайдаланыңыз"
STR_INTERCEPT_CHOICE_16_2: "Гуперге тікелей сұрақ қойыңыз"
STR_INTERCEPT_TITLE_17: "ҚАЙТАРУДАН АРТЫҚ"
STR_INTERCEPT_TEXT_17: "Құрылғы қайтадан жұмыс істей алады, бірақ Харристе әлі де түсіндіруге болатын қауіпсіздік бұзылысы бар. Ол сізге оны кім ұйымдастырғанын анықтаудың соңғы мүмкіндігін ұсынады."
STR_INTERCEPT_CHOICE_17_0: "Дәлелдерді көрсетіңіз"
STR_INTERCEPT_CHOICE_17_1: "Дәлел іздеңіз"
STR_INTERCEPT_CHOICE_17_2: "Оның үкімін қабыл алыңыз"
STR_INTERCEPT_TITLE_18: "ҚАЙШЫЛЫҚ"
STR_INTERCEPT_TEXT_18: "Харрис сіздің бірінші жауабыңызды соңғы жауабыңыздың жанына қояды. Олардың екеуі де шынайы бола алмайды. Сіз өтіріктен бас тарта аласыз немесе сұхбаттың қайшылықпен аяқталуына жол бере аласыз."
STR_INTERCEPT_CHOICE_18_0: "Бопсалау туралы шындықты айтыңыз"
STR_INTERCEPT_CHOICE_18_1: "Бәрін жоққа шығара бер"
STR_INTERCEPT_CHOICE_18_2: "Кетіп көріңіз"
STR_INTERCEPT_TITLE_19: "ТЫНЫШТЫҚ"
STR_INTERCEPT_TEXT_19: "Сіз қолдарыңызды қайырып аласыз. Харрис файлды жабады. Бұл бөлмеде үнсіздік тергеуді аяқтамайды; бұл сіздің оны басқарудағы үлесіңізді ғана аяқтайды."
STR_INTERCEPT_CHOICE_19_0: "Шешімді тыңдаңыз"
STR_INTERCEPT_TITLE_20: "СЫНҒАН Әйнек"
STR_INTERCEPT_TEXT_20: "Панель жол береді. Суық ауа мен күзетшінің ысқырығы бірге келеді. Біреу есікке жеткенше бір шешім қабылдауға уақыт бар."
STR_INTERCEPT_CHOICE_20_0: "Сыртқы жолға жүгіріңіз"
STR_INTERCEPT_CHOICE_20_1: "Кодталған анықтама қалдырыңыз"
STR_INTERCEPT_CHOICE_20_2: "Қалып, түсіндіріңіз"
STR_INTERCEPT_TITLE_21: "ШАРТ АРАСЫНДА"
STR_INTERCEPT_TEXT_21: "Жол дымқыл. Хупердің үйі келесі патрульге дейін жетуге жеткілікті жақын, бірақ оның арғы жағындағы ашық жер басқа мүмкіндікті ұсынады."
STR_INTERCEPT_CHOICE_21_0: "Жерден қашуға тырысыңыз"
STR_INTERCEPT_CHOICE_21_1: "Хупердің үйіне кіріңіз"
STR_INTERCEPT_CHOICE_21_2: "Харрис дегенге қайта келу"
STR_INTERCEPT_TITLE_22: "ЖЕКЕ ОЙЫН"
STR_INTERCEPT_TEXT_22: "Гупер сізді зерттейді. Үстел үстінде ол саусақтарымен ойдан шығарылған шахмат позициясын қояды. Кодталған жауап оны тікелей айыптау ешқашан болмайтынын ашуға мәжбүр етуі мүмкін."
STR_INTERCEPT_CHOICE_22_0: "Шахмат ойыны арқылы жауап беріңіз"
STR_INTERCEPT_CHOICE_22_1: "Оның атын атаймын деп қорқытыңыз"
STR_INTERCEPT_CHOICE_22_2: "Адал сөйлеңіз"
STR_INTERCEPT_TITLE_23: "БЕТ-БЕТ"
STR_INTERCEPT_TEXT_23: "Гупер нені дәлелдей алатыныңызды сұрайды. Оның сенімі оның жоспарынан тыс біреу білмеуі керек мәліметтерді айтқан кезде ғана әлсірейді."
STR_INTERCEPT_CHOICE_23_0: "Оған дәлелмен қарсы тұрыңыз"
STR_INTERCEPT_CHOICE_23_1: "Компонентті сауда ретінде ұсыныңыз"
STR_INTERCEPT_CHOICE_23_2: "Блеф"
STR_INTERCEPT_TITLE_24: "КУБОК"
STR_INTERCEPT_TEXT_24: "Хупер су әкеледі, бірақ алдымен шәй шыныға қол созады. Ол ұсынатын кез келген нәрсені қабылдағаннан гөрі бұл шыныаяқты сақтау пайдалырақ болуы мүмкін."
STR_INTERCEPT_CHOICE_24_0: "Тостағанды ұстаңыз"
STR_INTERCEPT_CHOICE_24_1: "Пальтоңызды қайта тексеріңіз"
STR_INTERCEPT_TITLE_25: "ТЕКСЕРУ КЕРЕК"
STR_INTERCEPT_TEXT_25: "Сіз шыныаяқты ұстайсыз және Харристен оны тексеруді сұрайсыз. Бұл, сайып келгенде, оған бекітілген нысаны бар айыптау. Хупердің оны жою әрекеті екінші пайдалы мәліметтерді береді."
STR_INTERCEPT_CHOICE_25_0: "Харриске шыныаяқты беріңіз"
STR_INTERCEPT_CHOICE_25_1: "Онымен Гуперге қарсы тұрыңыз"
STR_INTERCEPT_TITLE_26: "ҚАТЕ МАҚСАТ"
STR_INTERCEPT_TEXT_26: "Сіз Харристі дәлелсіз айыптайсыз. Ол тергеушінің беделін түсірмек болған күдіктіні көреді. Шайға не болса да сенуін қиындаттың."
STR_INTERCEPT_CHOICE_26_0: "Сұхбат аяқталады"
STR_INTERCEPT_TITLE_27: "БАРЛЫҚ шот"
STR_INTERCEPT_TEXT_27: "Сіз аттарды беріп, кездесуді сипаттайсыз. Харрис нақты сұрақтар қояды. Сіздің ұятыңыз шынайы, бірақ ол қазір тексере алатын мәліметтер де солай."
STR_INTERCEPT_CHOICE_27_0: "Есептік жазбаны тексеруге рұқсат етіңіз"
STR_INTERCEPT_CHOICE_27_1: "Хуперді табуды ұсыныңыз"
STR_INTERCEPT_TITLE_28: "СӘТСІЗ БЛЕФ"
STR_INTERCEPT_TEXT_28: "Харрис жеткілікті сенімді жауаптарды естіді. Хупер де бар. Ешқайсысы сіздің тарихыңыздың жетіспейтінін көрсетпейді."
STR_INTERCEPT_CHOICE_28_0: "Шағымда қалу"
STR_INTERCEPT_CHOICE_28_1: "Үмітсіз қашып құтылыңыз"
STR_INTERCEPT_CHOICE_28_2: "Не болғанын мойындаңыз"
STR_INTERCEPT_TITLE_29: "КЕТУ"
STR_INTERCEPT_TEXT_29: "Қалтаңыздағы парақ шатастырылған әріптерден де көп болады: оның үйшіктер арқылы өтетін жолы Хуперді машинаның жанына қояды. Қысқа анықтама дұрыс адамды дұрыс жерде іздеуге әкелуі мүмкін."
STR_INTERCEPT_CHOICE_29_0: "Хупер үшін хабарды кодтаңыз"
STR_INTERCEPT_CHOICE_29_1: "Харриске баратын жолды көрсетіңіз"
STR_INTERCEPT_TITLE_30: "МАШИНА ЖҰМЫС ЕТЕДІ"
STR_INTERCEPT_TEXT_30: "Харристің құрамдас бөлігі және сіздің алғашқы қорқынышты жауаптарыңыздан асып түсетін ізі бар. Бомба жұмысын жалғастырады. Сіз Hut 14-ті өз атыңызбен қалдырасыз, оның құпиялары азырақ және әлі жауап беретін болашақ бар."
STR_INTERCEPT_TITLE_31: "КҮМІЛІК АСТЫНДА"
STR_INTERCEPT_TEXT_31: "Құрамдас бөлікті қайтару құрылғыны кешігуден құтқарды. Бұл сіздің позицияңызды сақтамады. Тергеу жалғасып жатқанда Харрис саятшылыққа кіруді тоқтатады. Сұхбаттан аман қалдыңыз, бірақ аты-жөніңізді тазаламадыңыз."
STR_INTERCEPT_TITLE_32: "ҚАМАҚТА"
STR_INTERCEPT_TEXT_32: "Есік сізге емес, күзетшіге ашылады. Қарама-қайшылықтар, жетіспейтін дәлелдер және ұрланған құрамдас бөлік сіз басқара алмайтын жағдайға айналды. Бұл әрекет осында аяқталады."
STR_INTERCEPT_TITLE_33: "СЫРТҚЫ ЖОЛ"
STR_INTERCEPT_TEXT_33: "Сіз саятшылықтарды артта қалдырасыз. Қараңғылық пайдалы, бірақ жер бақыланады. Сынған терезе патрульдерді сіз ойлағаннан да жақындатты."
STR_INTERCEPT_CHOICE_33_0: "Ашық жерден өтіңіз"
STR_INTERCEPT_CHOICE_33_1: "Қызмет көрсету жолын ұстаныңыз"
STR_INTERCEPT_CHOICE_33_2: "Артқа бұрылып, Харриске бет бұрыңыз"
STR_INTERCEPT_TITLE_34: "ХУПЕРДІҢ ХОТЫ"
STR_INTERCEPT_TEXT_34: "Жұмыс үстелі қараусыз қалды. Қағаздар кроссвордтың астында жатыр, ал машина бөлмесі қарындашпен кестеде пайда болады. Сырттағы тақталар бойымен аяқ дыбыстары жақындайды."
STR_INTERCEPT_CHOICE_34_0: "Құжаттарды тексеріңіз"
STR_INTERCEPT_CHOICE_34_1: "Хуперді күтіңіз"
STR_INTERCEPT_CHOICE_34_2: "Харриске кетіңіз"
STR_INTERCEPT_TITLE_35: "ШАХМАТ МӘСЕЛЕСІ"
STR_INTERCEPT_TEXT_35: "Сіз Хуперге оның қиын жағдайын көрсететін позицияны бересіз: қорғалған бөлік, ашық патша және жауап келгенше қауіпсіз болып көрінетін қозғалыс. Ол ескертуді түсінеді. Оның келесі сөздері сізге қажет байланыс береді."
STR_INTERCEPT_CHOICE_35_0: "Оның жоспарды мойындауын сұраңыз"
STR_INTERCEPT_CHOICE_35_1: "Харриске рұқсатты жіберіңіз"
STR_INTERCEPT_TITLE_36: "МАСКАСЫЗ"
STR_INTERCEPT_TEXT_36: "Ешқашан болмағандай етіп көрсетудің орнына қысым туралы айтасыз. Хупер қарсылас ретінде емес, тұлға ретінде қысқаша жауап береді. Бұл саңылау сауда немесе тұзақ үшін пайдаланылуы мүмкін."
STR_INTERCEPT_CHOICE_36_0: "Адал келісім сұраңыз"
STR_INTERCEPT_CHOICE_36_1: "Оның мойындауын сұраңыз"
STR_INTERCEPT_CHOICE_36_2: "Есептік жазбаны Харриске алыңыз"
STR_INTERCEPT_TITLE_37: "ХУПЕРДІ ҚАБЫЛДАУ"
STR_INTERCEPT_TEXT_37: "Гупер шантажды жетіспейтін құрамдасқа қосу үшін жеткілікті түрде түсіндіреді. Харрис енді жабдықты қалпына келтіріп, оқиғаны тексере алады. Сіз тергеуді аяқтау немесе Хупердің жоғалып кетуіне рұқсат беру туралы шешім қабылдауыңыз керек."
STR_INTERCEPT_CHOICE_37_0: "Харриске рұқсатты әкеліңіз"
STR_INTERCEPT_CHOICE_37_1: "Хуперді жіберіңіз де кетіңіз"
STR_INTERCEPT_TITLE_38: "САУДА"
STR_INTERCEPT_TEXT_38: "Сіз левередждің соңғы бөлігін Хупер қол жеткізе алатын жерге орналастырасыз. Куәгерсіз немесе дәлелсіз мәміле оның мәселесін сіздің есебінен шешуге шақыру болып табылады."
STR_INTERCEPT_CHOICE_38_0: "Құрамдас бөлікті тапсырыңыз"
STR_INTERCEPT_CHOICE_38_1: "Куәландырылған келісімді талап етіңіз"
STR_INTERCEPT_CHOICE_38_2: "Ұсынысты қайтарып алу"
STR_INTERCEPT_TITLE_39: "ХАРРИС ТЫҢДАЙДЫ"
STR_INTERCEPT_TEXT_39: "Мәліметтерді тексеруге болады. Харрис компонент қазір қайда екенін сұрайды. Тіркелгіні тазалау және құрылғыны іске қосу - байланысты мәселелер, бірақ олар бірдей емес."
STR_INTERCEPT_CHOICE_39_0: "Пальтодағы нәрсені қайтарыңыз"
STR_INTERCEPT_CHOICE_39_1: "Құрамдас бөлікті қалпына келтіруге көмектесіңіз"
STR_INTERCEPT_CHOICE_39_2: "Қазір жауап беруді тоқтатыңыз"
STR_INTERCEPT_TITLE_40: "ҚОРШАҒАН АРТА"
STR_INTERCEPT_TEXT_40: "Үйлер сіздің артыңызда жоғалып кетті. Жерден тыс еркіндік кінәсіздікпен бірдей емес, ал машина қазір біреудің өзекті мәселесі. Сіз қашып кеттіңіз; есеп аяқталмаған күйінде қалады."
STR_INTERCEPT_TITLE_41: "СОҢҒЫ ҚАТЕ"
STR_INTERCEPT_TEXT_41: "Патруль сізге ашық жер аяқталмай тұрып жетеді немесе Хупердің уәдесі оған пайдалы болмай қалғанда бұзылады. Сізде қауіпсіз қозғалыстар таусылды. Әңгімені басынан бастап қайталап көруге болады."
STR_INTERCEPT_TITLE_42: "БАҒДАРЛАМАЛАР"
STR_INTERCEPT_TEXT_42: "Кесте Хуперді сіздің әңгімеңіз айтқан жерде орналастырады. Оның қасында сізді тұзаққа алғаш түсірген жазба. Бұл комбинация Харристің тексеруі үшін жеткілікті."
STR_INTERCEPT_CHOICE_42_0: "Құжаттарды Харриске апарыңыз"
STR_INTERCEPT_CHOICE_42_1: "Күте тұрыңыз және Гупермен бетпе-бет келіңіз"
STR_INTERCEPT_TITLE_43: "СОҢҒЫ БІР АРАҢ"
STR_INTERCEPT_TEXT_43: "Гупер бөлікті орнына қоюды ұсынады. Оған сену бірден бір мәселені жояды; Харристі куәгер ету басқасын жасауды қиындатады."
STR_INTERCEPT_CHOICE_43_0: "Куәгерді қайтаруды ұйымдастырыңыз"
STR_INTERCEPT_CHOICE_43_1: "Харристі жоспарға қосыңыз"
STR_INTERCEPT_TITLE_44: "КАТТАНЫ ҚАЛПЫНА АЛУ"
STR_INTERCEPT_TEXT_44: "Тіркелгі жазылған кезде іздеу жетіспейтін жабдыққа қайтарылады. Компоненттің қай жерде болуы керектігін анықтаған кезде Харрис машина бөлмесін тексереді."
STR_INTERCEPT_CHOICE_44_0: "Тексерілген қайтаруды аяқтаңыз"
STR_INTERCEPT_CHOICE_44_1: "Оны пальтодан алыңыз"
STR_INTERCEPT_CHOICE_44_2: "Харриске Хупер туралы ескертіңіз"
STR_INTERCEPT_TITLE_45: "ҚОРЫТЫНДЫ СҰРАҚ"
STR_INTERCEPT_TEXT_45: "Харрис күтіп тұр. Егер сіз Хуперді ұрлыққа қоса алсаңыз, құрамдас бөлікті қалпына келтірудің және оны дұрыс аяқтаудың әлі де жолы бар. Әйтпесе, тергеу тек сіздің есептік жазбаңызды өзгертеді."
STR_INTERCEPT_CHOICE_45_0: "Дәлелдерді көрсетіңіз"
STR_INTERCEPT_CHOICE_45_1: "Сізде басқа ештеңе жоқ екенін мойындаңыз"
