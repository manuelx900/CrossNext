STR_CAR_GUIDE_SOLVE: "Істі қалай шешуге болады"
STR_CAR_GUIDE_SOLVE_COPY: "Кейіпкерлерді тыңдап, қылмыскерді табу арқылы кісі өлтіруді шешіңіз. Әрбір іс сізге қанша кінәлілер мен жалған мәлімдемелерді табу керектігін айтады."
STR_CAR_GUIDE_SINCERE: "Кінә мен шынайылық"
STR_CAR_GUIDE_SINCERE_COPY: "Кей кейіпкерлер шындықты айтса, басқалары өтірік айтады. Өтірікші міндетті түрде кінәлі емес: жазықсыз кейіпкер де өтірік айтуы мүмкін."
STR_CAR_GUIDE_EXAMPLE: "Мысал"
STR_CAR_GUIDE_EXAMPLE_COPY: "1 кінәлі және 1 өтірік арқылы дәл бір кінәлі кейіпкерді және бір жалған мәлімдемені табыңыз. Кез келген басқа мәлімдеме шындық болуы керек."
STR_CAR_GUIDE_OR: "A немесе B жасады"
STR_CAR_GUIDE_OR_COPY: "\"Ана немесе Бруно жасады\" кем дегенде біреу кінәлі дегенді білдіреді. Сөйлеуші ​​өтірік айтса, ешқайсысы мұны істемеді."
STR_CAR_GUIDE_AND: "А және В орындады"
STR_CAR_GUIDE_AND_COPY: "\"Ана мен Бруно мұны істеді\" дейді екеуі де кінәлі. Өтірік болса, тым болмаса біреуі кінәсіз."
STR_CAR_GUIDE_COMPARE: "Шынайылық"
STR_CAR_GUIDE_COMPARE_COPY: "«Екеуі де шындықты айтады немесе екеуі де өтірік айтады» олардың кінәсін емес, сөздерін салыстырады. Екі мәлімдеменің де шын немесе екеуі де жалған екенін тексеріңіз."
STR_CAR_GUIDE_NEIGHBOURS: "Көршілер"
STR_CAR_GUIDE_NEIGHBOURS_COPY: "Анықтамалар екі көршінің де атын тікелей көрсетеді. Беттерді өзгерту қарым-қатынасты өзгертпейді."
STR_CAR_GUIDE_RELIABLE: "Сенімді фактілер"
STR_CAR_GUIDE_RELIABLE_COPY: "Аты-жөні, бойы мен диетасы сенімді. Мәлімдеме өтірік айтуы мүмкін. Биіктіктер ойдан шығарылған."
STR_CAR_GUIDE_HEIGHT: "Бой және диета"
STR_CAR_GUIDE_HEIGHT_COPY: "Кейіпкердің бойы мен диетасы сенімді. «Кінәлі меннен биік» деп кінәлі мен шешенді салыстырады. Барлық қоректілер жыртқыштар немесе шөпқоректілер қатарына жатпайды."
STR_CAR_GUIDE_MARKS: "Жазбаларыңыз"
STR_CAR_GUIDE_MARKS_COPY: "Әрбір мәлімдемені оқыңыз. Идеяларыңызды жазу үшін «Шындық», «Өтірік» және «Күдікті» пайдаланыңыз. Бұл сіздің жазбаларыңыз: ойын оларды әлі тексермейді."
STR_CAR_GUIDE_NAV: "Навигация"
STR_CAR_GUIDE_NAV_COPY: "Портретте әр бетте 3 таңба бар. Көрсеткілер басқаларды көрсетеді."
STR_CAR_GUIDE_CONFIRM: "Айыптауды растау"
STR_CAR_GUIDE_CONFIRM_COPY: "Идеяларыңыз әрбір анықтамаға және өтірік санына сәйкес келгенде, Айыптау түймесін түртіңіз. Кінәлілерді таңдап, жауабыңызды растаңыз."
STR_CAR_GUIDE_LIVES: "Өмір және нәтиже"
STR_CAR_GUIDE_LIVES_COPY: "Бастауыш /Normal : 2 өмір. Жетілдірілген /Expert : 1. Дұрыс айыптау істі шешеді. Ешбір адам қалмай, шешімді қараңыз."
STR_CAR_GUIDE_CAMPAIGN: "Науқан"
STR_CAR_GUIDE_CAMPAIGN_COPY: "Ашық корпус ойыныңызды жалғастырады. Науқан 1470 жағдайдың ішінен таңдауға мүмкіндік береді. Оқу кезінде Beginner-ден бастаңыз."
