STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_0: "Үйге әкелетін беттерді салыстыруға көмектесіңіз. Шеттегі атау бізге жадтың қай отбасыға жататынын айтуы мүмкін."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "Көршілер алаңға әкелген әңгімелерді оқыңыз. Біз әрбір есімді өзіне тиесілі өмірмен қатар қоюымыз керек."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "Теңізшілердің әңгімелерін салыстыруға көмектесіңізші. Мен енді есімізде жоқ арнаға басқа қайық жібере алмаймын."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "Маған құтқарылған томдарды оқуға көмектесіңіз. Олар осы бөлмелерден шыққанда, мен олардың кімнің әңгімелері бар екенін білгім келеді."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "Баспаналардағы оқиғаларды салыстыруға көмектесіңіз. Келесі саяхатшы басқа адастыратын жаңғырық емес, жол табуы керек."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "Ескі саяхаттарды салыстыруға көмектесіңіз. Есте қалған құдық құмға келу мен жоғалу арасындағы айырмашылықты жасай алады."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "Маған көршілердің әңгімелерін тыңдауға көмектесіңіз. Сағат маған олардың күнімен не істеуге үміттенгенін айта алмайды."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "Азат етілген аймақтардан келген оқиғаларды оқуға көмектесіңіз. Сарай тек өзіне ғана сөйлейтін жылдарды өткізген."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Бағбандардың әңгімелерін ретке келтіруге көмектесіңізші. Бұл тұқымдар пакеттегі атаудан көп нәрсені қажет етеді."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Осы оқиғаларды айналымда ұстауға көмектесіңіз. Мен біз тапқан адамдар бір-бірін тыңдай алатынын қалаймын."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Соңғы жолға жеткен оқиғаларды оқуға көмектесіңіз. Олардың әрқайсысы патшаның қабырғаларының ар жағында күтіп тұрған біреуге тиесілі."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Осы оқиғаларды толық оқып шығуға көмектесіңіз. Біраз уақыттан кейін олардың иелері тізімдегі есімнен гөрі көбірек лайық."
STR_QUEST_CAM_JOURNEY_THANKS_0: "Лиора алақанымен парақты тегістейді. «Мен бұл жолды қайтадан естимін», - дейді ол. Бүгін кешке ол кітапты шамның жанында ашық қалдырады."
STR_QUEST_CAM_JOURNEY_THANKS_1: "Дүңгіректе біреу сізге орын беру үшін орындықты жылжытады. Аяқталмаған оқиға тағы бір желіге ие болды; оның иесі парақты екі қолымен үйге апарады."
STR_QUEST_CAM_JOURNEY_THANKS_2: "Мара жаңадан оқылатын парақты бүктеп, ағын кітабының жанына қояды. Терезеге оралмас бұрын, ол тұзды ауадан дөрекі дауыспен сізге рахмет айтады."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Айри екі беттің арасына құрғақ матаның жолағын салады. «Ол қазір саяхаттай алады». Ол басқа кітаптарға апарар алдында томды кеудесіне қарсы ұстайды."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Тарен қапшығын тасқа тіреп, сіз аяқтағанша тыңдайды. Сосын ол бұл жолы бетке қарауды қажет етпей, саяхатшының сөзін қайталайды."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Нәдір бұрын табу қиын болған есімді оқып отырып, саусақтарының арасынан лента тартады. Ол сендерге оттың жанынан орын жасайды."
STR_QUEST_CAM_JOURNEY_THANKS_6: "Орин саусағымен айналдырып жүрген құралды қояды. Біраз уақыт ол әңгімедегі адам туралы айтады, ал сағат тілі естілмей тұрып қалады."
STR_QUEST_CAM_JOURNEY_THANKS_7: "Сера оқиғаны патша бұйрықтарының үйіндісінен алыстатады. Ол басқа орындық сұрайды, содан кейін сізбен бірге оның соңғы жолдарын тыңдайды."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Астер парақты таза жапырақпен белгілейді. Ол сізге үнсіз рахмет айтады; Біраз уақыттан кейін оның субұрқақтың жанында сол үзіндіні оқып жатқанын естисіз."
STR_QUEST_CAM_JOURNEY_THANKS_9: "Қысқа жазба келесі беттер жинағымен бірге келеді. Лиора сіз қалпына келтіруге көмектескен үзінді көшірді; жиегіне ол: «Біз мұны үйде бірге оқыдық» деп жазды."
