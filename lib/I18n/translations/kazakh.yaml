STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Шытырман оқиғаның басы"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Ұзақ жылдар бойы адамдар бейбіт өмір сүріп, кітаптарын тамашалады. Содан кейін ұмытылған патша оларды жоюға кірісті. Ол барлығын оқуды тоқтатып, барлық оқиғаларды мәңгілікке жоғалтқысы келді."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Корольдің құбыжықтары"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Ұмыту патшасы өзінің құбыжықтарын бүкіл әлемге жіберді. Олар табылған әрбір кітапты жойып, оларды тоқтатуға тырысқан кез келген адамға шабуыл жасады. Кітапханалар жойылып, адамдар кітап оқуды тоқтатты."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Оқудың күші"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Бір күні ауылыңның қасында кітап оқып отырсаң, бір құбыжық пайда болады. Сіз қашуға тырысасыз, бірақ таңғаларлық нәрсе болады: неғұрлым көп оқыған сайын ол әлсірейді. Сіз оқу патшаның сиқырымен күресудің жалғыз жолы екенін түсінесіз."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Сіздің миссияңыз"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Сіз патшаны тоқтату үшін жолға шықтыңыз. Оның қамалына барар жолда сіз ормандарды, қалаларды, тауларды және жауларға толы басқа жерлерді кесіп өтуіңіз керек. Сіз жеңген әрбір құбыжық сізді аздап жақындатады. Оқуды жалғастырыңыз, оның қамқоршыларын жеңіңіз және ол әлемдегі барлық кітаптарды жоймас бұрын оған жетіңіз."
