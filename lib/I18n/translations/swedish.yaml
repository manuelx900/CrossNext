STR_INTERCEPT_CHOICE_44_1: "Hämta den från din jacka"
STR_INTERCEPT_CHOICE_44_2: "Varna Harris för Hooper"
STR_INTERCEPT_TITLE_45: "Den slutliga frågan"
STR_INTERCEPT_TEXT_45: "Harris väntar. Om du kan ansluta Hooper till stölden finns det fortfarande ett sätt att återställa komponenten och avsluta detta ordentligt. Annars har utredningen bara ditt ändringskonto."
