STR_CAR_INTRO: "Skyld och ärlighet är oberoende. Varje fall har exakt en lösning. Höjder är fiktiva karaktärsdrag."
STR_CAR_HELP_TEXT: "HUR MAN LÖSER ETT FALL\nVarje karaktär gör ett uttalande. Överst på skärmen ger det exakta antalet skyldiga och falska uttalanden. Hitta en kombination som tillfredsställer båda räkningarna. Varje fall har en lösning.\n  \nSkuld är inte ärlighet\nEn oskyldig karaktär kan ljuga, och en skyldig kan säga sanningen.Två lögner innebär exakt två hela påståenden är falska; de andra är sanna.Sanning / Lie märken hänvisar till uttalandet; misstänkt hänvisar till skuld.\n  \nLäsa ledtrådarna\n\"A eller B gjorde det (eller båda)\" betyder att åtminstone en av de namngivna karaktärerna är skyldig. \"A och B gjorde det\" kräver båda. En lögn förnekar hela påståendet: ett falskt ELLER betyder att ingen av dem gjorde det; ett falskt OCH betyder att åtminstone en av dem inte gjorde det.\n  \n\"Båda är sanna eller båda ljuger\" jämför påståenden, inte skuld. \"Exakt en ljuger\" betyder att deras påståenden har olika sanningsvärden. Dessa ledtrådar kan själva vara sanna eller falska.\n  \nGrannar på en liten skärm\nDen ursprungliga cirkulära ordningen är Panther, Peacock, Shark, Fox, Bear, Hirsch, Horse, med endast detta fall tecken. Den sista och den första är grannar. Denna app skriver de två namnen direkt i varje granne ledtråd. Du behöver aldrig gissa vilka kort är bredvid ett porträtt. Ändra sida eller orientering ändrar inte en ledtråd.\n  \nHöjd och vikt\nVarje kort visar en fiktiv höjd och diet. \"En skyldig är längre än mig\" betyder att åtminstone en skyldig är längre än talaren, inte nödvändigtvis alla skyldiga. Kortare fungerar på samma sätt. Köttätare och växtätare ledtrådar innebär att åtminstone en skyldig har den dieten; allätare räknas som ingen av dem. Namn, höjder och dieter är tillförlitliga fakta; uttalanden kan ljuga.\n  \nDin analys\nAnvänd ? / Sanning / Lögn och Misstänkt under varje påstående för att skriva hypoteser. Dessa är dina anteckningar, inte bevis eller automatiska kontroller. Pilarna visar de andra tecknen. Stående läge visar upp till tre per sida.\n  \nAtt göra en anklagelse\nTryck på Anklaga och välj exakt det antal skyldiga som krävs. Bara att bekräfta en felaktig anklagelse spenderar ett liv. Nybörjare och Normal har två liv; Avancerad och Expert har ett. En korrekt anklagelse löser fallet. Med inga liv kvar, avslöjas lösningen.\n  \nKAMPANJ OCH REPLAY\nDet finns 1 470 fall. Öppet fall återupptar det aktuella försöket eller öppnar nästa efter ett stängt fall. Kampanj låter dig välja något av de 1 470 fallen i valfri ordning från början. Replay startar ett nytt försök samtidigt som tidigare slutförande bevaras. Inom varje svårighetsgrad går fallen från en till två skyldiga, sedan från färre lögnare till fler inom varje grupp av skyldiga. Nybörjare behåller en skyldig. Mindre kast kommer först när antalet matchar. Alla fall förblir tillgängliga. Att lösa ett tidigare uttömt fall uppgraderar det till löst.\n  \nFramsteg och liv sparas på SD-kortet. Att lämna, sova eller starta om enheten återställer inte liv i det aktuella försöket. Ett misslyckat spara blockerar resultatet tills Försök igen lyckas. Återställ alla ber om bekräftelse innan du raderar bara Carnivore framsteg."
