STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Kungens monster"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "The King of Oblivion skickade sina monster över hela världen. De förstörde varje bok de hittade och attackerade alla som försökte stoppa dem. Biblioteken började försvinna och folk slutade läsa."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Kraften i att läsa"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "En dag, medan du läser nära din by, dyker ett monster upp. Du försöker komma undan, men något överraskande händer: ju mer du läser, desto svagare blir det. Du inser att läsning är det enda sättet att bekämpa kungens magi."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Ditt uppdrag"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Du gav dig ut för att stoppa kungen. På din väg till hans slott måste du korsa skogar, städer, berg och andra platser fulla av fiender. Varje monster du besegrar tar dig lite närmare. Fortsätt läsa, besegra hans väktare och nå honom innan han förstör alla böcker i världen."
