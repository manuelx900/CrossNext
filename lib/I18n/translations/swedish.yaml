STR_INTERCEPT_CHOICE_43_1: "Ta med Harris i planen"
STR_INTERCEPT_TITLE_44: "Att återfå det verkliga"
STR_INTERCEPT_TEXT_44: "När kontot är registrerat returneras sökningen till den saknade hårdvaran. Harris kontrollerar maskinrummet medan du identifierar var komponenten ska vara."
