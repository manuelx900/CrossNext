STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Efter att ha besegrat King of Oblivion återvänder du hem. Hans armé kan inte längre förstöra böcker, och folk läser i fred igen. Du har räddat världens berättelser. Det finns fortfarande många böcker kvar att upptäcka."
