STR_INTERCEPT_ABOUT: "En kondenserad anpassning av The Intercept by inkle, 2016, som används under MIT-licensen. Bletchley Park, 1942: en saknad maskinkomponent, utpressning och en intervju som kan sluta i frihet eller vårdnad.\n\nDina beslut och position sparas efter varje val. En ny berättelse återställer denna playthrough. Ursprungliga illustrationer skapades för denna firmware. Det ursprungliga skriptet och licensen ingår i projektet."
