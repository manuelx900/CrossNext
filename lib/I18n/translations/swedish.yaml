STR_INTERCEPT_CHOICE_42_1: "Vänta och konfrontera Hooper"
STR_INTERCEPT_TITLE_43: "Ett sista arrangemang"
STR_INTERCEPT_TEXT_43: "Att lita på honom skulle ta bort ett omedelbart problem; att göra Harris ett vittne skulle göra det svårare att skapa en annan."
