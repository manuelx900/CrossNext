STR_INTERCEPT_TITLE_0: "Hytta 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942.De håller dig väntar bakom en låst dörr.En komponent från beräkningsmaskinen har försvunnit.Morgonen avlyssnar rustlar i din jacka ficka.Utanför, fotsteg stannar."
STR_INTERCEPT_CHOICE_0_0: "Tänk igenom anklagelsen"
STR_INTERCEPT_CHOICE_0_1: "Vänta på intervjuaren"
STR_INTERCEPT_CHOICE_0_2: "Hitta din jacka"
STR_INTERCEPT_TITLE_1: "Den anklagelsen"
STR_INTERCEPT_TEXT_1: "De misstänker förräderi. Du löser siffror, korsord och schackpositioner för en överlevnad. Detta rum är ett annat problem: motsäga dig själv, och din trovärdighet kan vara det första offret."
STR_INTERCEPT_CHOICE_1_0: "Välj en strategi"
STR_INTERCEPT_CHOICE_1_1: "Lyssna på vad de vet"
STR_INTERCEPT_TITLE_2: "Harry kommer"
STR_INTERCEPT_TEXT_2: "Harris kommer in med en kopp te och en fil. En rulle saknas från bomben. Ditt namn fanns på uppdragsförteckningen. Han lägger koppen bredvid dig och frågar var du var i går kväll."
STR_INTERCEPT_CHOICE_2_0: "Drick Tea"
STR_INTERCEPT_CHOICE_2_1: "Lämna teet orört"
STR_INTERCEPT_CHOICE_2_2: "Svar lugnt"
STR_INTERCEPT_TITLE_3: "Den komponenter"
STR_INTERCEPT_TEXT_3: "Inne i din jackas yta möter dina fingrar kallmetall. Komponenten är fortfarande där. Hooper sa att ta det skulle göra utpressningen stoppa."
STR_INTERCEPT_CHOICE_3_0: "Håll det dolt"
STR_INTERCEPT_CHOICE_3_1: "Ge det till Harris"
STR_INTERCEPT_TITLE_4: "Ett vinnande spel"
STR_INTERCEPT_TEXT_4: "Samarbete kan bevara din trovärdighet. En övertygande lögn kan köpa tid. Escape skulle byta ett låst rum för vakterna utanför."
STR_INTERCEPT_CHOICE_4_0: "samarbeta"
STR_INTERCEPT_CHOICE_4_1: "Hitta ett alibi"
STR_INTERCEPT_CHOICE_4_2: "Undersök fönstret"
STR_INTERCEPT_TITLE_5: "och Tea"
STR_INTERCEPT_TEXT_5: "Harris märker din tystnad, men hans ansikte har redan dragit sig tillbaka.När du nästa gång öppnar ögonen står ett annat par skor vid bordet."
STR_INTERCEPT_CHOICE_5_0: "Låtsas förbli sömnig"
STR_INTERCEPT_CHOICE_5_1: "Jämför besökaren"
STR_INTERCEPT_CHOICE_5_2: "Be om vatten"
STR_INTERCEPT_TITLE_6: "Ett litet avslag"
STR_INTERCEPT_TEXT_6: "Harris tittar närmare på rörelsen än svaret. Han frågar om det finns någon annan han borde ifrågasätta."
STR_INTERCEPT_CHOICE_6_0: "Fråga vad han har för bevis"
STR_INTERCEPT_CHOICE_6_1: "Omtale Hooper"
STR_INTERCEPT_CHOICE_6_2: "Titta mot fönstret"
STR_INTERCEPT_TITLE_7: "Den saknade verkligheten"
STR_INTERCEPT_TEXT_7: "Har du tagit komponenten? du kan berätta för honom vad som är i din jacka, förklara trycket Hooper tillämpade, eller försöka peka på anklagelsen någon annanstans."
STR_INTERCEPT_CHOICE_7_0: "Ge honom komponenten"
STR_INTERCEPT_CHOICE_7_1: "Förklara utpressningen"
STR_INTERCEPT_CHOICE_7_2: "Anklagar Hooper"
STR_INTERCEPT_TITLE_8: "Metall på bordet"
STR_INTERCEPT_TEXT_8: "Komponenten ligger mellan dig. Harris kontrollerar det utan att slappna av. Att returnera stulen utrustning förklarar inte varför den togs. Han vill ha ett namn och något mer pålitligt än ditt ord."
STR_INTERCEPT_CHOICE_8_0: "Erbjudande att hitta bevis"
STR_INTERCEPT_CHOICE_8_1: "Stanna och svara på frågor"
STR_INTERCEPT_TITLE_9: "Det alibi"
STR_INTERCEPT_TEXT_9: "Harris öppnar filen.En vakthund såg dig lämna maskinrummet.Ditt uppfann konto har nu ett vittne mot det."
STR_INTERCEPT_CHOICE_9_0: "Försvara berättelsen"
STR_INTERCEPT_CHOICE_9_1: "erkänna utpressningen"
STR_INTERCEPT_CHOICE_9_2: "Avvisa fler frågor"
STR_INTERCEPT_TITLE_10: "Fönstret"
STR_INTERCEPT_TEXT_10: "Fönstret är högt och glaset är tjockt.Bortom det leder vägen förbi en annan hytte.Bryt det skulle vara högt; väntar här har sina egna faror."
STR_INTERCEPT_CHOICE_10_0: "Bryta glaset"
STR_INTERCEPT_CHOICE_10_1: "Studera vägen utanför"
STR_INTERCEPT_CHOICE_10_2: "Tillbaka till intervjun"
STR_INTERCEPT_TITLE_11: "Ännu en besökare"
STR_INTERCEPT_TEXT_11: "Hooper har kommit medan du är instabil. Han vill veta om Harris har komponenten. Han håller en hand nära dörren."
STR_INTERCEPT_CHOICE_11_0: "Låtsas att sova"
STR_INTERCEPT_CHOICE_11_1: "Begär en förklaring"
STR_INTERCEPT_CHOICE_11_2: "Be om vatten"
STR_INTERCEPT_TITLE_12: "En varning"
STR_INTERCEPT_TEXT_12: "Du ringer till Harris innan teet tar tag. Han återvänder, irriterad. En anklagelse om koppen kommer att behöva något han kan testa."
STR_INTERCEPT_CHOICE_12_0: "Håll cupen som bevis"
STR_INTERCEPT_CHOICE_12_1: "Anklaga Harris för att förgifta dig"
STR_INTERCEPT_CHOICE_12_2: "Fokusera på det verkliga"
STR_INTERCEPT_TITLE_13: "Hoppar"
STR_INTERCEPT_TEXT_13: "Harris känner igen namnet. Hooper är användbar, väl ansluten och inte frånvarande från gårdagens lista heller."
STR_INTERCEPT_CHOICE_13_0: "Hitta något verifierbart"
STR_INTERCEPT_CHOICE_13_1: "Insist Hooper stal det"
STR_INTERCEPT_TITLE_14: "Blackmail"
STR_INTERCEPT_TEXT_14: "Du beskriver en ung man, ett förtroende som förråddes och det krav som följde. Harris lyssnar utan att hjälpa dig. Namnge personen som satte fällan kan också avslöja den person du hoppades skydda."
STR_INTERCEPT_CHOICE_14_0: "Ge Harris det fullständiga kontot"
STR_INTERCEPT_CHOICE_14_1: "Lämna ut namnen"
STR_INTERCEPT_CHOICE_14_2: "Föreslå ett sätt att fånga Hooper"
STR_INTERCEPT_TITLE_15: "En lätt anklagelse"
STR_INTERCEPT_TEXT_15: "Hooper, säger du, måste vara ansvarig. Harris frågar hur du vet.Det finns en skillnad mellan att lösa ett problem och producera ett vittne som kan bevisa svaret."
STR_INTERCEPT_CHOICE_15_0: "Låt Harris utmana påståendet"
STR_INTERCEPT_CHOICE_15_1: "Prova ett privat meddelande till Hooper"
STR_INTERCEPT_TITLE_16: "En testbar nyckel"
STR_INTERCEPT_TEXT_16: "En berättelse kan förnekas. ett dokument, ett vittne eller den saknade komponenten är svårare att förklara bort."
STR_INTERCEPT_CHOICE_16_0: "Kolla in närliggande stuga"
STR_INTERCEPT_CHOICE_16_1: "Använd morgoninterceptet"
STR_INTERCEPT_CHOICE_16_2: "Fråga Hooper direkt"
STR_INTERCEPT_TITLE_17: "Mer än en återkomst"
STR_INTERCEPT_TEXT_17: "Maskinen kan fungera igen, men Harris har fortfarande ett säkerhetsbrott att förklara."
STR_INTERCEPT_CHOICE_17_0: "Visa bevisen"
STR_INTERCEPT_CHOICE_17_1: "Sök efter bevis"
STR_INTERCEPT_CHOICE_17_2: "Acceptera hans dom"
STR_INTERCEPT_TITLE_18: "En motsättning"
STR_INTERCEPT_TEXT_18: "Harris sätter ditt första svar bredvid ditt senaste.De kan inte båda vara sanna.Du kan överge lögnen, eller låta intervjun sluta på en motsägelse."
STR_INTERCEPT_CHOICE_18_0: "Berätta sanningen om utpressning"
STR_INTERCEPT_CHOICE_18_1: "Förneka allt"
STR_INTERCEPT_CHOICE_18_2: "Försök att lämna"
STR_INTERCEPT_TITLE_19: "Tystnad"
STR_INTERCEPT_TEXT_19: "Harris stänger filen.I det här rummet avslutar tystnaden inte utredningen; den avslutar bara din del i att styra den."
STR_INTERCEPT_CHOICE_19_0: "Hör beslutet"
STR_INTERCEPT_TITLE_20: "Bruten glas"
STR_INTERCEPT_TEXT_20: "Den kalla luften och ljudet av en vakts whistle anländer tillsammans.Det finns tid för ett beslut innan någon når dörren."
STR_INTERCEPT_CHOICE_20_0: "Löp för den yttre vägen"
STR_INTERCEPT_CHOICE_20_1: "Lämna en kodad clue"
STR_INTERCEPT_CHOICE_20_2: "Stanna och förklara"
STR_INTERCEPT_TITLE_21: "Mellan stugorna"
STR_INTERCEPT_TEXT_21: "Hoopers stuga är tillräckligt nära för att nå innan nästa patrull, men den öppna marken bortom det erbjuder en annan typ av chans."
STR_INTERCEPT_CHOICE_21_0: "Försök att undkomma orsakerna"
STR_INTERCEPT_CHOICE_21_1: "Gå in i Hooper's hut"
STR_INTERCEPT_CHOICE_21_2: "Tillbaka till Harris"
STR_INTERCEPT_TITLE_22: "Ett privat spel"
STR_INTERCEPT_TEXT_22: "Hooper studerar dig.På bordet sätter han ut en imaginära schackposition med sina fingrar.Ett kodat svar kan få honom att avslöja vad en direkt anklagelse aldrig skulle göra."
STR_INTERCEPT_CHOICE_22_0: "Svara med en schackspelare"
STR_INTERCEPT_CHOICE_22_1: "Hotade att döpa honom"
STR_INTERCEPT_CHOICE_22_2: "Tala ärligt"
STR_INTERCEPT_TITLE_23: "ansikte mot ansikte"
STR_INTERCEPT_TEXT_23: "Hooper frågar vad du faktiskt kan bevisa.Hans förtroende svinner bara när du nämner detaljer som någon utanför hans plan inte borde veta."
STR_INTERCEPT_CHOICE_23_0: "Jämför honom med bevis"
STR_INTERCEPT_CHOICE_23_1: "Erbjud komponenten som en handel"
STR_INTERCEPT_CHOICE_23_2: "bluff"
STR_INTERCEPT_TITLE_24: "och cupen"
STR_INTERCEPT_TEXT_24: "Hooper tar med vatten men når för te-koppen först. Att hålla den koppen kan vara mer användbart än att acceptera något annat han erbjuder."
STR_INTERCEPT_CHOICE_24_0: "Håll cupen"
STR_INTERCEPT_CHOICE_24_1: "Kolla på din jacka igen"
STR_INTERCEPT_TITLE_25: "Något att testa på"
STR_INTERCEPT_TEXT_25: "Du håller koppen och ber Harris att få den undersökt.Det här är äntligen ett påstående med ett föremål fäst vid det.Hooper försök att ta bort den ger en andra användbar detalj."
STR_INTERCEPT_CHOICE_25_0: "Ge Harris cupen"
STR_INTERCEPT_CHOICE_25_1: "Konfrontera Hooper med det"
STR_INTERCEPT_TITLE_26: "Fel mål"
STR_INTERCEPT_TEXT_26: "Du anklagar Harris utan bevis. Han ser en misstänkt som försöker att diskreditera utredaren. Vad som än hände med teet, har du gjort det svårare för honom att tro dig."
STR_INTERCEPT_CHOICE_26_0: "Intervjun avslutas"
STR_INTERCEPT_TITLE_27: "Hela kontot"
STR_INTERCEPT_TEXT_27: "Du ger namnen och beskriver mötet. Harris ställer exakta frågor. Din pinsamhet är verklig, men så är detaljerna han nu kan kontrollera."
STR_INTERCEPT_CHOICE_27_0: "Låt honom kontrollera kontot"
STR_INTERCEPT_CHOICE_27_1: "Erbjudande att hitta Hooper"
STR_INTERCEPT_TITLE_28: "Ett misslyckat bluff"
STR_INTERCEPT_TEXT_28: "Harris har hört tillräckligt förtroendefulla svar. Hooper har också."
STR_INTERCEPT_CHOICE_28_0: "Håll fast vid påståendet"
STR_INTERCEPT_CHOICE_28_1: "Gör en desperat flykt"
STR_INTERCEPT_CHOICE_28_2: "Erkänna vad som verkligen hände"
STR_INTERCEPT_TITLE_29: "Intercepten är"
STR_INTERCEPT_TEXT_29: "Bladen i fickan bär mer än bara knäppa bokstäver: dess väg genom hytterna placerar Hooper nära maskinen."
STR_INTERCEPT_CHOICE_29_0: "Koda ett meddelande till Hooper"
STR_INTERCEPT_CHOICE_29_1: "Visa vägen till Harris"
STR_INTERCEPT_TITLE_30: "Maskinen springer"
STR_INTERCEPT_TEXT_30: "Harris har komponenten, och ett spår som leder bortom dina första rädda svar.Bomben återupptar sitt arbete.Du lämnar Hut 14 under ditt eget namn, med färre hemligheter och en framtid kvar att svara för."
STR_INTERCEPT_TITLE_31: "Under misstanke"
STR_INTERCEPT_TEXT_31: "Att returnera komponenten räddade maskinen från en fördröjning. Det sparade inte din position. Harris avslutar din tillgång till hytterna medan utredningen fortsätter. Du överlevde intervjun, men rensade inte ditt namn."
STR_INTERCEPT_TITLE_32: "i förvar"
STR_INTERCEPT_TEXT_32: "Motsägelser, saknade bevis och en stulen komponent har blivit ett fall du inte längre kan rikta."
STR_INTERCEPT_TITLE_33: "Den yttre vägen"
STR_INTERCEPT_TEXT_33: "Du lämnar stugorna bakom dig.Mörkret är användbart, men grunden bevakas.Ett brutet fönster har fört patrullerna närmare än du hoppats."
STR_INTERCEPT_CHOICE_33_0: "Över den öppna marken"
STR_INTERCEPT_CHOICE_33_1: "Fortsätt till Service Path"
STR_INTERCEPT_CHOICE_33_2: "Vänd dig tillbaka och ansikte mot ansikte Harris"
STR_INTERCEPT_TITLE_34: "Hooper's Hut lägenhet"
STR_INTERCEPT_TEXT_34: "Skrivbordet är obevakad. Papper ligger under ett korsord, och maskinrummet visas i en penna schema."
STR_INTERCEPT_CHOICE_34_0: "Undersök papperna"
STR_INTERCEPT_CHOICE_34_1: "Vänta på Hooper"
STR_INTERCEPT_CHOICE_34_2: "Lämna för Harris"
STR_INTERCEPT_TITLE_35: "Ett schackproblem"
STR_INTERCEPT_TEXT_35: "Du ger Hooper en position som speglar hans situation: ett skyddat stycke, en exponerad kung och ett drag som ser säkert ut tills svaret."
STR_INTERCEPT_CHOICE_35_0: "Be honom att erkänna planen"
STR_INTERCEPT_CHOICE_35_1: "Skicka tillståndet till Harris"
STR_INTERCEPT_TITLE_36: "Utan en mask"
STR_INTERCEPT_TEXT_36: "Du talar om trycket istället för att låtsas att det aldrig existerade. Hooper svarar kortfattat som en person snarare än som en motståndare."
STR_INTERCEPT_CHOICE_36_0: "Be om ett ärligt arrangemang"
STR_INTERCEPT_CHOICE_36_1: "Be honom att bekänna"
STR_INTERCEPT_CHOICE_36_2: "Ta räkningen till Harris"
STR_INTERCEPT_TITLE_37: "Hoopers erkännande"
STR_INTERCEPT_TEXT_37: "Hooper förklarar tillräckligt för att ansluta utpressningen till den saknade komponenten. Harris kan nu återställa utrustningen och kontrollera historien."
STR_INTERCEPT_CHOICE_37_0: "Få Harris med erkännandet"
STR_INTERCEPT_CHOICE_37_1: "Låt Hooper gå och gå"
STR_INTERCEPT_TITLE_38: "handeln"
STR_INTERCEPT_TEXT_38: "Du lägger din sista hävstång inom Hoopers räckvidd.En affär utan vittne eller bevis är en inbjudan för honom att lösa sitt problem på din bekostnad."
STR_INTERCEPT_CHOICE_38_0: "Handen över komponenten"
STR_INTERCEPT_CHOICE_38_1: "Kräver ett vittneavtal"
STR_INTERCEPT_CHOICE_38_2: "Dra tillbaka erbjudandet"
STR_INTERCEPT_TITLE_39: "Harris lyssnar"
STR_INTERCEPT_TEXT_39: "Detaljerna kan kontrolleras. Harris frågar var komponenten är nu. Att rensa ditt konto och få maskinen igång är relaterade problem, men de är inte samma sak."
STR_INTERCEPT_CHOICE_39_0: "Ge tillbaka det som finns i din jacka"
STR_INTERCEPT_CHOICE_39_1: "Hjälp att återställa komponenten"
STR_INTERCEPT_CHOICE_39_2: "Sluta svara nu"
STR_INTERCEPT_TITLE_40: "Utanför stängslet"
STR_INTERCEPT_TEXT_40: "Frihet utanför fältet är inte detsamma som oskuld, och maskinen är någon annans brådskande problem nu."
STR_INTERCEPT_TITLE_41: "Det sista misstaget"
STR_INTERCEPT_TEXT_41: "Patrullen når dig innan den öppna marken slutar, eller Hooper löfte kollapsar när det inte längre är användbart för honom."
STR_INTERCEPT_TITLE_42: "De papper"
STR_INTERCEPT_TEXT_42: "Schemat placerar Hooper där din berättelse sa att han var. Bredvid det är anteckningen som först drog dig in i fällan."
