STR_QUEST_CAM_DECOR_NAME_5: "کریستال زمستانی"
STR_QUEST_CAM_DECOR_TEXT_5: "آب شدن، بلوری را نشان می دهد که آخرین خاطره کوه را در خود نگه می دارد."
STR_QUEST_CAM_DECOR_NAME_6: "جغد ساعتی"
STR_QUEST_CAM_DECOR_TEXT_6: "ساعت ساز این نگهبان کوچک را تعمیر می کند تا از شما برای بازگرداندن زمان تشکر کند."
STR_QUEST_CAM_DECOR_NAME_7: "پر ققنوس"
STR_QUEST_CAM_DECOR_TEXT_7: "از خاکسترهای بازیابی شده یک پر برمی‌خیزد: این نوید که داستان‌ها می‌توانند دوباره شروع شوند."
STR_QUEST_CAM_DECOR_NAME_8: "چراغ صحرا"
STR_QUEST_CAM_DECOR_TEXT_8: "یک قصه گو چراغی را به شما می دهد که قصه های صحرا را زنده نگه داشته است."
STR_QUEST_CAM_DECOR_NAME_9: "ابر کوی"
STR_QUEST_CAM_DECOR_TEXT_9: "قفس ابر را باز می کنید. یک کوی کوچک می ماند تا مراقب رویاهای شما باشد."
STR_QUEST_CAM_DECOR_NAME_10: "قلب اژدها"
STR_QUEST_CAM_DECOR_TEXT_10: "اژدهاها کریستالی را به شما می سپارند که از حافظه بازیابی شده آنها متولد شده است."
STR_QUEST_CAM_DECOR_NAME_11: "ستاره خاطره"
STR_QUEST_CAM_DECOR_TEXT_11: "اولین ستاره بازسازی شده راه شما را به سمت صفحات پایانی روشن می کند."
STR_QUEST_CAM_DECOR_NAME_12: "خواندن جوانه"
