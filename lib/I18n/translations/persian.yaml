STR_INTERCEPT_TITLE_29: "بازداشت"
STR_INTERCEPT_TEXT_29: "کاغذی که در جیب شما قرار دارد، بیش از نامه های پیچیده ای دارد: مسیر آن از طریق کافه ها Hooper را در نزدیکی ماشین قرار می دهد."
