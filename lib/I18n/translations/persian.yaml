STR_PET_STORY_TEXT_3: "یک قطعه کاغذ به یک کشتی کوچک تبدیل می شود. شریک شما از طریق میز دنبال آن می شود، مانند اینکه یک ماجراجویی کامل را برگزار می کند."
STR_PET_STORY_4: "زیر ستاره ها"
STR_PET_STORY_TEXT_4: "بعد از خواندن، شما با هم نگاه کنید. یک ستاره ظاهر می شود، سپس دیگری."
STR_PET_STORY_5: "» قفل گمشده"
STR_PET_STORY_TEXT_5: "شما آن را در کنار علامت کتاب خود نگه دارید: هدیه کوچک از یک روز معمول."
STR_PET_STORY_6: "یک زاویه سکوت"
STR_PET_STORY_TEXT_6: "شما یک جاده ای را پیدا می کنید و کتاب خود را باز می کنید و شریک شما در کنار شما قرار دارد و هیچ کدام از شما به عجله نمی روید."
STR_PET_STORY_7: "یک راه جدید"
STR_PET_STORY_TEXT_7: "یک صفحه دیگر شما را به جایی جدید می برد. شریک شما استراحت می کند و به شما نگاه می کند، آماده برای فصل فردا."
