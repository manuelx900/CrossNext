STR_INTERCEPT_CHOICE_29_1: "راهنمای سفر به Harris"
STR_INTERCEPT_TITLE_30: "ماشین راه می رود"
STR_INTERCEPT_TEXT_30: "هریس دارای بخش، و یک راهی است که از اولین پاسخ های ترسیده شما را فراتر می رود. بمب کار خود را باز می کند. شما Hut 14 را تحت نام خودتان ترک می کنید، با کمتر رازها و آینده هنوز برای پاسخ دادن."
STR_INTERCEPT_TITLE_31: "تحت شبهه"
STR_INTERCEPT_TEXT_31: "بازگرداندن این اجزای دستگاه را از یک تاخیر نجات داد. این موقعیت شما را حفظ نکرد. هریس دسترسی شما به کافه ها را پایان می دهد در حالی که تحقیقات ادامه دارد. شما مصاحبه را زنده ماندید، اما نام خود را حذف نکردید."
STR_INTERCEPT_TITLE_32: "در نگهبان"
STR_INTERCEPT_TEXT_32: "در برای نگهبان به جای شما باز می شود. تناقض، شواهد ناپدید و یک اجزای سرقت تبدیل به یک مورد که دیگر نمی توانید هدایت کنید."
STR_INTERCEPT_TITLE_33: "مسیر خارجی"
STR_INTERCEPT_TEXT_33: "شما کوچه ها را پشت سر می گذارید. تاریکی مفید است، اما زمین ها نگهداری شده اند. یک پنجره شکسته، patrols را نزدیک تر از آنچه شما امیدوار بودید آورد."
STR_INTERCEPT_CHOICE_33_0: "عبور از زمین باز"
STR_INTERCEPT_CHOICE_33_1: "به مسیر خدمات ادامه دهید"
STR_INTERCEPT_CHOICE_33_2: "به عقب برگرد و با هریس روبرو شو"
STR_INTERCEPT_TITLE_34: "خانه Hooper"
STR_INTERCEPT_TEXT_34: "دفترچه بدون مراقبت است. کاغذ ها زیر یک کلمه ی صلیب قرار دارند و اتاق ماشین در یک برنامه ای با پنل ظاهر می شود. قدم های پایانی در طول بورهای خارج."
STR_INTERCEPT_CHOICE_34_0: "کاغذات را بررسی کنید"
STR_INTERCEPT_CHOICE_34_1: "منتظر Hooper باشید"
STR_INTERCEPT_CHOICE_34_2: "برای هری"
STR_INTERCEPT_TITLE_35: "مشکلات شطرنج"
STR_INTERCEPT_TEXT_35: "شما به هوپر موقعیت هایی می دهید که از وضعیت او در نظر گرفته می شود: یک قطعه محافظت شده، یک پادشاهی را نشان می دهد و حرکت ای که تا پاسخ مطمئن به نظر می رسد."
STR_INTERCEPT_CHOICE_35_0: "از او بخواهید برنامه را قبول کند."
STR_INTERCEPT_CHOICE_35_1: "ارسال نامه به هاری"
STR_INTERCEPT_TITLE_36: "بدون ماسک"
STR_INTERCEPT_TEXT_36: "شما در مورد فشار صحبت می کنید به جای اینکه انگار هیچ وقت وجود ندارد. Hooper به طور خلاصه به عنوان یک فرد پاسخ می دهد به جای به عنوان یک مخالف."
STR_INTERCEPT_CHOICE_36_0: "درخواست یک توافق صادقانه"
STR_INTERCEPT_CHOICE_36_1: "از او بخواهید اعتراف کند."
STR_INTERCEPT_CHOICE_36_2: "حساب خود را به هری"
STR_INTERCEPT_TITLE_37: "پذیرش Hooper"
STR_INTERCEPT_TEXT_37: "هارد اکنون می تواند تجهیزات را بازگرداند و داستان را بررسی کند. شما باید تصمیم بگیرید که آیا تحقیقات را به پایان برسانید یا اجازه دهید هارد ناپدید شود."
STR_INTERCEPT_CHOICE_37_0: "هریس را به اعتراف بدهید"
STR_INTERCEPT_CHOICE_37_1: "بگذارید Hooper برو و برو"
STR_INTERCEPT_TITLE_38: "تجارت"
STR_INTERCEPT_TEXT_38: "شما آخرین قطعه ی دستاوردهای خود را در دسترس Hooper قرار می دهید. یک معامله بدون شهدا یا شواهد دعوت به او برای حل مشکل خود را به هزینه شما است."
STR_INTERCEPT_CHOICE_38_0: "دست بر روی اجزای"
STR_INTERCEPT_CHOICE_38_1: "درخواست یک توافق شهدا"
STR_INTERCEPT_CHOICE_38_2: "بازگرداندن پیشنهاد"
STR_INTERCEPT_TITLE_39: "هریس گوش می دهد"
STR_INTERCEPT_TEXT_39: "جزئیات را می توان بررسی کرد Harris از شما می پرسد که در حال حاضر اجزای آن کجاست.با پاک کردن حساب و انجام کار دستگاه، مسائل مرتبط هستند، اما آنها یکسان نیستند."
STR_INTERCEPT_CHOICE_39_0: "آنچه در پوشاک شماست را بازگردانید"
STR_INTERCEPT_CHOICE_39_1: "کمک به بازگرداندن بخش"
STR_INTERCEPT_CHOICE_39_2: "حالا جواب دادن را متوقف کنید"
STR_INTERCEPT_TITLE_40: "در خارج از سقف"
STR_INTERCEPT_TEXT_40: "کلبه ها پشت سرت ناپديد ميشن آزادي بيرون از محوطه مثل بي گناهي نيست و اين دستگاه الان مشکل جدي يکي ديگه ست تو فرار کردي داستان به پايان نرسيده"
STR_INTERCEPT_TITLE_41: "آخرین اشتباه"
STR_INTERCEPT_TEXT_41: "پلیس پیش از پایان زمین باز به شما می رسد، یا وعده Hooper زمانی که دیگر برای او مفید نیست، سقوط می کند."
STR_INTERCEPT_TITLE_42: "کاغذ ها"
STR_INTERCEPT_TEXT_42: "برنامه ای قرار می دهد Hooper جایی که داستان شما گفته بود او است. در کنار آن نوار است که اول شما را به قفس کشید. ترکیب کافی مشخص برای هریس برای تایید است."
STR_INTERCEPT_CHOICE_42_0: "کاغذ ها را به هاریس ببرید"
STR_INTERCEPT_CHOICE_42_1: "انتظار و مقابله با Hooper"
STR_INTERCEPT_TITLE_43: "یک توافق نهایی"
STR_INTERCEPT_TEXT_43: "اعتماد به او یک مشکل فوری را حذف می کند؛ انجام هاریس به عنوان گواهی، ایجاد یک دیگر را دشوارتر می کند."
STR_INTERCEPT_CHOICE_43_0: "بازگشت گواهی دهنده"
STR_INTERCEPT_CHOICE_43_1: "Harris را در برنامه قرار دهید"
STR_INTERCEPT_TITLE_44: "بازگرداندن واقعیت"
STR_INTERCEPT_TEXT_44: "با ثبت حساب، جستجوی به نرم افزار گم شده باز می گردد. هریس اتاق دستگاه را بررسی می کند در حالی که شما تعیین می کنید که اجزای آن باید کجا باشند."
STR_INTERCEPT_CHOICE_44_0: "پایان دادن به بازگرداندن ثبت شده"
STR_INTERCEPT_CHOICE_44_1: "آن را از پوشاکتان باز کنید"
STR_INTERCEPT_CHOICE_44_2: "هاردز را در مورد Hooper هشدار دهید"
STR_INTERCEPT_TITLE_45: "سوال نهایی"
STR_INTERCEPT_TEXT_45: "اگر شما می توانید Hooper را به سرقت متصل کنید، هنوز راهی وجود دارد تا اجزای آن را بازگردانید و به درستی پایان دهید."
