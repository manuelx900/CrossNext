STR_INTERCEPT_TEXT_4: "همکاری می تواند اعتبار شما را حفظ کند. یک دروغ قانع کننده می تواند زمان را خریداری کند. فرار یک اتاق بسته برای نگهبانان خارج از خانه را عوض خواهد کرد. هیچ کدام از این حرکت ها نمی توانند به عقب بروند."
