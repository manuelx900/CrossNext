STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "داستان هايي که همسايه ها به ميدان آوردن رو بخوان ما بايد هر اسمي رو کنار زندگي اي که بهش تعلق داره بذاريم"
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "کمکم کن داستانهاي دريانوردها رو مقايسه کنم نميتونم يه کشتي ديگه رو به کانالي که ديگه يادمون نمياد بفرستم"
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "به من کمک کنید جلدهای نجات یافته را بخوانم. وقتی آنها این اتاق ها را ترک می کنند، می خواهم کسی بداند که آنها داستان های چه کسی را حمل می کنند."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "کمکم کن داستان هاي پناهگاه ها رو با هم مقايسه کنم مسافر بعدي بايد يه راه پيدا کنه نه يه طنين گمراه کننده ديگه"
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "به ما در مقایسه سفرهای قدیمی کمک کنید. یک چاه به یاد ماندنی می تواند بین رسیدن و ناپدید شدن در شن تفاوت ایجاد کند."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "کمکم کن به داستان هاي همسايه ها گوش بدم ساعت نميتونه بهم بگه که اونها اميدوار بودن با روزشون چيکار کنن"
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "به ما کمک کنين داستان هايي که از مناطق آزاد شده مياد رو بخونيم قصر سالهاست که فقط با خودش حرف ميزنه"
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "کمکم کن داستان باغبان ها رو مرتب کنم اين دانه ها بيشتر از يه اسم روي يه بسته نياز دارن"
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "به ما کمک کنید تا این داستان ها را در گردش نگه داریم. من می خواهم افرادی که پیدا کرده ایم بتوانند صدای یکدیگر را بشنوند."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "به ما کمک کن داستان هايي که به آخرين جاده رسيده رو بخونيم هر کدوم متعلق به کسي هستن که پشت ديوارهاي پادشاه منتظره"
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "به ما کمک کنيد تا اين داستان ها رو بخونيم بعد از اين همه فاصله صاحبانشون لايق بيش از يه اسم تو ليست هستن"
STR_QUEST_CAM_JOURNEY_THANKS_0: "لیورا با کف دستش صفحه را صاف می کند. او می گوید: «من می توانم دوباره آن خط را بشنوم. امروز عصر او کتاب را در کنار چراغ باز می گذارد."
STR_QUEST_CAM_JOURNEY_THANKS_1: "در قفسه، کسی یک صندلی را حرکت می‌دهد تا برای شما جا باز کند. یک داستان ناتمام خط دیگری به دست آورده است؛ صاحب آن صفحه را با هر دو دست به خانه می‌برد."
STR_QUEST_CAM_JOURNEY_THANKS_2: "مارا یک صفحه تازه خوانا را تا می‌کند و کنار کتاب جزر و مدش می‌گذارد. قبل از بازگشت به پنجره، با صدایی که از هوای نمک خشن شده است از شما تشکر می کند."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Iri یک نوار پارچه خشک بین دو صفحه می‌گذارد. \"آن شخص اکنون می تواند سفر کند.\" قبل از اینکه آن را به کتاب‌های دیگر ببرد، حجم را روی سینه‌اش نگه می‌دارد."
STR_QUEST_CAM_JOURNEY_THANKS_4: "تارن دسته‌اش را روی سنگ می‌گذارد و در حالی که شما تمام می‌کنید گوش می‌دهد. سپس سخنان یک مسافر را تکرار می کند، این بار بدون نیاز به نگاه کردن به صفحه."
STR_QUEST_CAM_JOURNEY_THANKS_5: "نادر روبانی را از میان انگشتانش می‌کشد و نامی را می‌خواند که قبلاً تشخیص آن دشوار بود. او برای شما در کنار آتش مکانی می سازد."
STR_QUEST_CAM_JOURNEY_THANKS_6: "اورین ابزاری را که در انگشتانش می‌چرخاند، کنار می‌گذارد و برای مدتی دربارهٔ شخص داستان صحبت می‌کند و ساعت بدون اینکه کسی بشنود به حرکت خود ادامه می‌دهد."
STR_QUEST_CAM_JOURNEY_THANKS_7: "\"سرا\" داستان رو از توده دستورات پادشاهي دور ميکنه و ازش ميخواد يه صندلي ديگه بگيره و بعدش به خط آخرش با تو گوش ميده"
STR_QUEST_CAM_JOURNEY_THANKS_8: "Aster یک صفحه را با یک برگ تمیز مشخص می کند. او بی سر و صدا از شما تشکر می کند. کمی بعد می شنوید که او همان قطعه را در کنار فواره می خواند."
STR_QUEST_CAM_JOURNEY_THANKS_9: "یادداشت کوتاهی همراه با بسته‌های بعدی صفحات می‌رسد. لیورا بخشی را کپی کرده است که شما به بازیابی آن کمک کردید. در حاشیه نوشته است: «این یکی را با هم در خانه خواندیم»."
STR_QUEST_CAM_JOURNEY_THANKS_10: "نت فقط چند سطر است. لیورا جایی برای پاسخ گذاشته است، گویی می تواند شما را در انتهای میز نشسته ببیند."
STR_QUEST_CAM_JOURNEY_THANKS_11: "در میان صفحات بازیابی شده، یادداشت تا شده را از خانه پیدا می‌کنید. آخرین خط آن ساده است: \"هنوز جایی برای شما اینجا وجود دارد.\""
