STR_INTERCEPT_TITLE_3: "متناقض"
STR_INTERCEPT_TEXT_3: "در داخل پوشیدن پوشاک شما انگشتان شما با فلزی سرد مواجه می شوند. اجزای آن هنوز وجود دارد. هوبر گفت که گرفتن آن باعث می شود تهمت را متوقف کند."
