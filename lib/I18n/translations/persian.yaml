STR_CAR_HELP_TEXT: "چطور يه پرونده رو حل کنيم\nهر کاراکتر یک جمله را بیان می‌کند. در بالای صفحه تعداد دقیق گناهکاران و جملات نادرست نمایش داده می‌شود. ترکیبی که هر دو عدد را برآورده کند را پیدا کنید. هر مورد یک راه حل دارد.\n  \nگناه راستگويي نيست\nیک شخصیت بی‌گناه می‌تواند دروغ بگوید، و یک مجرم می‌تواند حقیقت را بگوید. دو دروغ به این معنی است که دقیقاً دو جمله کامل نادرست هستند؛ بقیه درست هستند.\n  \nخواندن سرنخ ها\n«A یا B آن را انجام داد (یا هر دو)» به این معنی است که حداقل یکی از شخصیت‌های نام‌گذاری شده گناهکار است. «A و B آن را انجام دادند» نیازمند هر دو است. یک دروغ کل جمله را انکار می‌کند: یک نادرست یا به این معناست که هیچ‌کدام آن را انجام نداده‌اند؛ یک نادرست و به این معناست که حداقل یکی آن را انجام نداده‌است.\n  \n«هر دو راست می‌گویند یا هر دو دروغ می‌گویند» بیانیه‌ها را مقایسه می‌کند، نه گناه. « دقیقاً یکی دروغ می‌گوید» به این معنی است که بیانیه‌های آن‌ها ارزش‌های حقیقت متفاوتی دارند. این سرنخ‌ها می‌توانند خودشان درست یا نادرست باشند.\n  \nهمسايه ها روي يک صفحه کوچک\nترتیب دایره‌ای اصلی Panther, Peacock, Shark, Fox, Bear, Stag, Horse است ، که فقط از کاراکترهای این مورد استفاده می‌کند. آخرین و اولین همسایه‌ها هستند. این برنامه دو نام را مستقیماً در هر سرنخ همسایه می‌نویسد. شما هرگز نیازی به حدس زدن اینکه کدام کارت در کنار چهره است ندارید. تغییر صفحه یا جهت یک سرنخ را تغییر نمی‌دهد.\n  \nقد و وزن\nهر کارت قد و رژیم غذایی تخیلی را نشان می‌دهد. «یک گناهکار بلندتر از من است» به این معنی است که حداقل یک گناهکار بلندتر از گوینده است، نه لزوماً همه گناهکاران. کوتاه‌تر هم به همین صورت عمل می‌کند. سرنخ‌های گوشت‌خوار و گیاه‌خوار به این معناست که حداقل یک گناهکار این رژیم غذایی را دارد؛ همه‌خوارها به عنوان هیچ‌کدام در نظر گرفته نمی‌شوند. نام‌ها، قد و رژیم غذایی حقایق قابل اعتماد هستند؛ اظهارات می‌توانند دروغ باشند.\n  \nتوضيحات شما\nبرای ثبت فرضیات ، از? / حقیقت / دروغ و مشکوک زیر هر جمله استفاده کنید. اینها یادداشتهای شما هستند ، نه شواهد یا بررسیهای خودکار. پیکانها کاراکترهای دیگر را نشان می‌دهند. حالت عمودی تا سه کاراکتر در هر صفحه نمایش می‌دهد.\n  \nيه اتهام ميزنم\nاتهام را فشار دهید و دقیقاً تعداد مورد نیاز مجرم‌ها را انتخاب کنید. تنها تأیید یک اتهام نادرست یک زندگی صرف می‌شود. مبتدی و عادی دو زندگی دارند؛ پیشرفته و متخصص یک زندگی دارند. اتهام درست پرونده را حل می‌کند. اگر هیچ زندگی باقی نماند، راه حل آشکار می‌شود.\n  \nکمپين و بازي مجدد\n۴۷۰ مورد وجود دارد. مورد باز تلاش جاری را ادامه می‌دهد یا بعد از بسته شدن یکی دیگر را باز می‌کند. کمپین به شما اجازه می‌دهد که هر کدام از ۴۷۰ مورد را در هر ترتیبی از ابتدا انتخاب کنید. بازی مجدد با حفظ تکمیل قبلی ، یک تلاش تازه را آغاز می‌کند. در هر دشواری ، موارد از یک مجرم به دو متهم پیش می‌روند ، سپس از دروغگویان کمتر به بیشتر در هر گروه مجرم. مبتدی یک مجرم را نگه می‌دارد. هنگامی که شمارش‌ها مطابقت دارند ، پرتاب‌های کوچکتر اول می‌آیند. همه موارد در دسترس باقی می‌مانند. حل کردن یک مورد که قبلاً به پایان رسیده است ، آن را به حل شده ارتقا می‌دهد.\n  \nپیشرفت و زندگی‌ها بر روی کارت SD ذخیره می‌شوند. خروج، خوابیدن یا شروع مجدد دستگاه، زندگی‌ها را در تلاش جاری بازگردانده نمی‌کند. یک ذخیره ناموفق نتیجه را تا زمانی که تلاش مجدد موفقیت‌آمیز باشد مسدود می‌کند. بازنشانی همه قبل از پاک کردن فقط پیشرفت گوشت‌خوار، تأیید می‌خواهد."
