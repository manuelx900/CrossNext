STR_QUEST_CAM_JOURNEY2_APPROACH_0: "وقتی وارد جنگل می‌شوید و به دنبال جاده شهر می‌گردید، یک گرگ تاریک راه شما را می‌بندد."
STR_QUEST_CAM_JOURNEY2_APPROACH_1: "درختان افتاده و کتاب های پاره شده را پیدا می کنید. دسته ای از گرگ ها چهارراه پیش رو را تماشا می کنند."
STR_QUEST_CAM_JOURNEY2_APPROACH_2: "پل شکسته است و یک محافظ ریشه روی تخته هایی که باقی مانده اند می ایستد."
STR_QUEST_CAM_JOURNEY2_APPROACH_3: "خانه پر از کتاب های آسیب دیده است. یک هیولای پارس از در محافظت می کند و شما را از جستجوی سرنخ باز می دارد."
STR_QUEST_CAM_JOURNEY2_APPROACH_4: "نقشه شما را به یک چاه قدیمی هدایت می کند. هیولایی از بین سنگ ها بیرون می زند و شما را قطع می کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_5: "شما مسیرها را در امتداد مسیری که تقریباً در شاخه ها مدفون شده است دنبال می کنید. موجودی از میان درختان به سمت شما می خزد."
STR_QUEST_CAM_JOURNEY2_APPROACH_6: "به سنگ می‌رسی، اما کوله‌ای تاریک آن را احاطه کرده است. شما نمی توانید آن را بررسی کنید تا زمانی که گرگ ها آنجا هستند."
STR_QUEST_CAM_JOURNEY2_APPROACH_7: "اولین خانه ها از دور نمایان هستند. یک نگهبان مراقب ریشه های عظیمی است که راه را مسدود می کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_8: "به دروازه پوشیده از ریشه می رسید. یک نگهبان پوست جلوی آن قدم می گذارد."
STR_QUEST_CAM_JOURNEY2_APPROACH_9: "ارباب ریشه ها آخرین راه خروج را نگهبانی می کند. او بزرگتر و قوی تر از هر هیولایی است که تاکنون با آن روبرو شده اید."
STR_QUEST_CAM_JOURNEY2_APPROACH_10: "یک سرباز پادشاه از ورودی نگهبانی می کند و اجازه نمی دهد مسافران از آنجا عبور کنند."
STR_QUEST_CAM_JOURNEY2_APPROACH_11: "دکه های کرکره ای و کتاب های سوخته را می بینید. یک نگهبان در میدان گشت می زند و مردم را دور نگه می دارد."
STR_QUEST_CAM_JOURNEY2_APPROACH_12: "یک اطلاعیه دستور تعطیلی هر کتابخانه را می دهد. یک هیولا در حال تماشای جاده به سمت خیابان اصلی است."
STR_QUEST_CAM_JOURNEY2_APPROACH_13: "سربازان خیابان ها را تا کتابخانه پر می کنند. یکی شما را می بیند و قدم در راه شما می گذارد."
STR_QUEST_CAM_JOURNEY2_APPROACH_14: "یک هیولای بزرگ از کتابخانه بسته محافظت می کند. هنوز ممکن است کتاب‌هایی در داخل وجود داشته باشد که بتوانید آنها را ذخیره کنید."
STR_QUEST_CAM_JOURNEY2_APPROACH_15: "شما یک اتاق قفل شده پیدا می کنید که کتابخانه نقشه های خود را در آن نگهداری می کرد. یک نگهبان در را تماشا می کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_16: "چیزی روی در می خورد. هیولاها در حال نفوذ به کتابخانه هستند تا کتاب های باقی مانده را از بین ببرند."
STR_QUEST_CAM_JOURNEY2_APPROACH_17: "مردم شهر شما را به سمت برج ناقوس راهنمایی می کنند، اما سربازان از راه محافظت می کنند."
STR_QUEST_CAM_JOURNEY2_APPROACH_18: "از برج بالا می روی تا دروازه را باز کنی. یک نگهبان بین شما و چرخی که آن را کنترل می کند می ایستد."
STR_QUEST_CAM_JOURNEY2_APPROACH_19: "نگهبان زنگ در بالای برج ظاهر می شود. دروازه بندر تا زمانی که آنجا ایستاده بسته می ماند."
STR_QUEST_CAM_JOURNEY2_APPROACH_20: "قایق های متروکه و هیولایی را در حال تماشای اسکله پیدا می کنید. هنوز به راهی برای عبور از آب نیاز دارید."
STR_QUEST_CAM_JOURNEY2_APPROACH_21: "نوری در مه سوسو می زند، اما نگهبان دسترسی به قایق ها را مسدود می کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_22: "هیولاها یک کشتی را خراب کرده اند. موجودی مراقب یک قایق کوچکتر است که به نظر می رسد آماده حرکت است."
STR_QUEST_CAM_JOURNEY2_APPROACH_23: "همانطور که به سمت جزیره حرکت می کنید، موجودی از آب بلند می شود و راه شما را می بندد."
STR_QUEST_CAM_JOURNEY2_APPROACH_24: "هیولاها از ورودی محافظت می کنند. برای دیدن مه باید فانوس دریایی را روشن کنید."
STR_QUEST_CAM_JOURNEY2_APPROACH_25: "یک نگهبان پله هایی را که به لامپ منتهی می شود مسدود می کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_26: "یک هیولا در عرشه کشتی به گل نشسته شما را از نگاه کردن به داخل باز می دارد."
STR_QUEST_CAM_JOURNEY2_APPROACH_27: "نقشه نشان می دهد که ورودی کتابخانه زیر آب است. یک دروازه نزدیک می تواند آب را پایین بیاورد، اما یک نگهبان از آن محافظت می کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_28: "به مکانیزمی می رسید که آب را کنترل می کند. موجودی جلوی چرخ می ایستد."
STR_QUEST_CAM_JOURNEY2_APPROACH_29: "کاپیتان مه در فانوس دریایی ظاهر می شود. او می خواهد نور را خاموش کند و مه را برگرداند."
STR_QUEST_CAM_JOURNEY2_APPROACH_30: "مراحل را به سمت ورودی سیل زده دنبال می کنید. موجودی از اعماق در را نگهبانی می کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_31: "یک هیولا کتاب های شناور بین قفسه های شکسته را خرد می کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_32: "یک نگهبان از کتاب در مورد پادشاه محافظت می کند. برای درک جادوی هیولاها باید آن را بخوانید."
STR_QUEST_CAM_JOURNEY2_APPROACH_33: "شما مقالاتی در مورد ارتش پادشاه کشف می کنید، اما موجودی از آرشیو محافظت می کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_34: "یک نگهبان شما را از اتاقی که ممکن است قدیمی‌ترین کتاب‌ها درباره قلعه به شما بگویند، دور نگه می‌دارد."
STR_QUEST_CAM_JOURNEY2_APPROACH_35: "آب در حال افزایش است. یک هیولا از دروازه ای محافظت می کند که می تواند سیل را متوقف کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_36: "سایه ها بین قفسه ها ظاهر می شوند و شروع به پاره کردن آخرین کتاب ها می کنند. باید جلوی آنها را بگیرید."
STR_QUEST_CAM_JOURNEY2_APPROACH_37: "یک نگهبان درب سرویس را که به سمت کوه می‌رود مسدود می‌کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_38: "نور روز را در انتهای تونل می بینید، اما یک هیولا راه خروج را مسدود می کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_39: "یک جانور از آب بیرون می آید و آخرین امتداد تونل به کوه را مسدود می کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_40: "موجودی سنگی در بین صخره ها ظاهر می شود و مسیر باریکی را که به سمت کوه بالا می رود مسدود می کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_41: "در یک گذرگاه، یک هیولا تابلوی چوبی را تماشا می کند که ممکن است راه را به شما نشان دهد."
STR_QUEST_CAM_JOURNEY2_APPROACH_42: "با مشاهده پناهگاه، برف شروع به باریدن می کند. نگهبانی جلوی در موضع گرفته است."
STR_QUEST_CAM_JOURNEY2_APPROACH_43: "صدایی از مسیر اشتباه تماس می گیرد. یک هیولا سعی می کند شما را از مسیر روی نقشه دور کند."
STR_QUEST_CAM_JOURNEY2_APPROACH_44: "یک موجود بالدار از روی پل سنگی عبور می کند و شما را از عبور از تنگه باز می دارد."
STR_QUEST_CAM_JOURNEY2_APPROACH_45: "برف مسیر را پوشانده و نگهبانی در میان صخره ها کمین کرده است. قبل از بدتر شدن طوفان باید مسیر را پیدا کنید."
