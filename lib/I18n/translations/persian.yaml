STR_QUEST_CAM_DECOR_NAME_14: "بنر ویجر"
STR_QUEST_CAM_DECOR_TEXT_14: "پرچمی برای یادآوری هر شروع جدید."
STR_QUEST_CAM_DECOR_NAME_15: "قارچ ماه"
STR_QUEST_CAM_DECOR_TEXT_15: "قطعه کوچکی از جنگل برای خانه شما."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "آغاز ماجراجویی"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "سال‌ها مردم در آرامش زندگی می‌کردند و از کتاب‌هایشان لذت می‌بردند. سپس پادشاه فراموشی شروع به نابودی آنها کرد. او می خواست همه را از خواندن باز دارد و همه داستان ها را برای همیشه ناپدید می کند."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "هیولاهای پادشاه"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "پادشاه فراموشی هیولاهای خود را به سراسر جهان فرستاد. آنها هر کتابی را که می یافتند نابود می کردند و به هر کسی که می خواست جلوی آنها را بگیرد حمله می کردند. کتابخانه ها شروع به ناپدید شدن کردند و مردم از خواندن دست کشیدند."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "قدرت خواندن"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "یک روز، در حالی که در نزدیکی روستای خود مشغول مطالعه هستید، یک هیولا ظاهر می شود. سعی می کنید دور شوید، اما اتفاق شگفت انگیزی رخ می دهد: هر چه بیشتر بخوانید، ضعیف تر می شود. متوجه شدید که خواندن تنها راه مبارزه با جادوی پادشاه است."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "ماموریت شما"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "تو تصمیم گرفتی جلوی شاه را بگیری. در مسیر خود به سمت قلعه او باید از جنگل ها، شهرها، کوه ها و دیگر مکان های پر از دشمن عبور کنید. هر هیولایی که شکست می دهید شما را کمی نزدیک تر می کند. به خواندن ادامه دهید، نگهبانان او را شکست دهید و قبل از اینکه هر کتابی را در جهان نابود کند به او برسید."
