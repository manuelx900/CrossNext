STR_INTERCEPT_TEXT_26: "شما به هریس بدون شواهد اتهام می کنید.او یک مظنون را می بیند که تلاش می کند محققان را تکذیب کند.هر چه به چای افتاد، شما برای او دشوار تر کرده اید که به شما اعتماد کند."
STR_INTERCEPT_CHOICE_26_0: "مصاحبه پایان"
STR_INTERCEPT_TITLE_27: "حساب کل"
STR_INTERCEPT_TEXT_27: "شما نام ها را می دهید و جلسه را توصیف می کنید. هریس سوال های دقیق را می پرسد. خجالت شما واقعی است، اما جزئیات آن هم همین طور است که او اکنون می تواند بررسی کند."
STR_INTERCEPT_CHOICE_27_0: "اجازه دهید حساب را بررسی کند."
