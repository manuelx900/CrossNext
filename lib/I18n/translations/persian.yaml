STR_FLASHCARDS_HELP: "از عرشه‌های Anki (.apkg /.colpkg، .anki2 /.anki21)، CSV /TSV/text کپی کنید یا پوشه‌های Study را به /FLASHCARDS. تبدیل کنید از زیرپوشه‌ها استفاده کنید: هر کدام حداکثر ۱۲۸ مورد.\n\nواردات کارت های متنی پایه، معکوس و ساده را می پذیرد. صدا و HTML سفارشی پشتیبانی نمی شوند. ابتدا عرشه های تصویر /CJK را تبدیل کنید. بررسی های آفلاین از FSRS استفاده می کنند. واردات یک برنامه زمانی جدید را شروع می کند و نسخه های اصلی را حفظ می کند."
STR_FLASHCARDS_PREPARING: "بررسی و وارد کردن این عرشه. مجموعه های بزرگ Anki ممکن است کمی طول بکشد. کارت SD را متصل نگه دارید."
