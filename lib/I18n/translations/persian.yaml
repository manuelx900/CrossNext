STR_QUEST_CAM_JOURNEY2_SAGA_11_3: "اتاق ها مملو از کتاب های دزدیده و آسیب دیده است. آنهایی را که هنوز در جعبه ها قفل شده اند آزاد می کنید، سپس به سمت بالاترین قسمت قلعه بالا می روید تا منبع قدرت پادشاه را پیدا کنید."
STR_QUEST_CAM_JOURNEY2_SAGA_11_6: "اتاق ها مملو از کتاب های دزدیده و آسیب دیده است. آنهایی را که هنوز در جعبه ها قفل شده اند آزاد می کنید، سپس به سمت بالاترین قسمت قلعه بالا می روید تا منبع قدرت پادشاه را پیدا کنید.\n\nکتابی عظیم بخشی از جادوی پادشاه را در خود جای داده است. قفل آن با سه مهر و موم روی کلید مطابقت دارد. وقتی آن را باز می کنید، جادوی تاریک ضعیف می شود و می توانید به سمت تاج و تخت بروید."
