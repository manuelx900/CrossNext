STR_QUEST_CAM_JOURNEY_DAILYREQUEST_0: "Přečtěte si se mnou tuto zprávu, stále jsou rodiny, které hledají vlastní slova ve vesnické knize."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_1: "Zůstaňte s těmito příběhy trochu déle, někdo na trhu možná pozná osobu, kterou tato slova popisují."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_2: "Přečtěte si tato jména se mnou. Chci, aby rodina čekala, až přijede další loď."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_3: "Přečtěte si tenhle příběh dřív, než ho přesunu na vyšší polici, potřebuji vědět, která slova ještě chybí."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_4: "Přečtěte si se mnou slova cestovatelů. Nechci zaměnit staré varování za výzvu, která má následovat."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Přečtěte si tyto příběhy u ohně a než se vydáme na cestu, chci, aby každý slyšel své vlastní jméno."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_6: "Přečtěte si se mnou tuto stránku, než zazvoní zvony. Potřebuji si zapamatovat více než hodinu na číselníku."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_7: "Přečtěte si celé toto svědectví. Jsou zde lidé, kteří příliš dlouho čekali, než budou vyslyšeni."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Přečtěte si tuto vzpomínku poblíž fontány. Chtěl bych slyšet, co ten člověk, který tu zasadil, doufal, že po sobě zanechá."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Přečtěte si příběhy, které jsme vám poslali, hlasy z domova vám mohou dělat společnost, i když jste tak daleko."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Přečtěte si tento dopis, než vyrazíte. Nemusíte nosit každou vzpomínku sami."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_11: "Přečtěte si slova, která jsme pro vás uložili. Pevnost není celý svět, ať je jakkoli tichý."
