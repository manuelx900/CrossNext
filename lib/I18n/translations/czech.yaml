STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_0: "Pomozte mi porovnat stránky, které přinášíme domů. Jméno na okraji nám může napovědět, do které rodiny vzpomínka patří."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "Přečtěte si příběhy, které sousedé přinesli na náměstí, musíme dát každé jméno vedle života, ke kterému patří."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "Pomozte mi porovnat příběhy námořníků, nemohu poslat další loď do kanálu, který si už nepamatujeme."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "Pomozte mi přečíst zachráněné svazky. Až odejdou z těchto místností, chci, aby někdo věděl, čí příběhy nesou."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "Pomozte mi porovnat příběhy z útulků, další cestovatel by měl najít cestu, ne další zavádějící ozvěnu."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "Pomozte nám porovnat staré cesty. Dobře zapamatovaná studna může znamenat rozdíl mezi příchodem a zmizením v písku."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "Pomoz mi naslouchat příběhům sousedů, hodiny mi nemohou říct, co doufali, že udělají se dnem."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "Pomozte nám přečíst příběhy, které přicházejí z osvobozených regionů. Palác strávil dost let mluvením jen sám k sobě."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Pomozte mi dát příběhy zahradníků do pořádku, tato semena potřebují víc než jméno na balíčku."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Pomozte nám udržet tyto příběhy v oběhu. Chci, aby se lidé, které jsme našli, mohli navzájem slyšet."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Pomozte nám přečíst příběhy, které se dostávají na poslední cestu, každá z nich patří někomu, kdo čeká za královskými zdmi."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Pomozte nám přečíst tyto příběhy v plném znění, protože po tak dlouhé době si jejich majitelé zaslouží víc než jen jméno na seznamu."
STR_QUEST_CAM_JOURNEY_THANKS_0: "Liora hladí stránku dlaní. \"Už zase slyším tu čáru,\" říká. Dnes večer nechá knihu otevřenou vedle lampy."
STR_QUEST_CAM_JOURNEY_THANKS_1: "U stánku někdo přesune židli, aby vám udělal místo, nedokončený příběh získal další řádek, jeho majitel si s oběma rukama vezme stránku domů."
STR_QUEST_CAM_JOURNEY_THANKS_2: "Mara složí nově čitelnou stránku a položí ji vedle knihy přílivu a odlivu. Než se vrátí k oknu, poděkuje ti hlasem zdrsněným slaným vzduchem."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Iri položí proužek suché látky mezi dvě stránky. \"Ten už může cestovat.\" Drží svazek na hrudi, než ho přenese k ostatním knihám."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Taren položí svůj batoh na kámen a poslouchá, zatímco skončíte. Pak zopakuje slova cestovatele, tentokrát aniž by se musel podívat na stránku."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Nadir protahuje mezi prsty stuhu a čte jméno, které bylo dříve obtížné rozeznat. Dělá pro tebe místo vedle ohně."
STR_QUEST_CAM_JOURNEY_THANKS_6: "Orin odloží nářadí, které soustružil v prstech, chvíli mluví o osobě z příběhu a hodiny nechává tikat, aniž by je někdo slyšel."
STR_QUEST_CAM_JOURNEY_THANKS_7: "Sera přesouvá příběh z hromádky královských rozkazů, žádá o další židli a pak si s vámi poslechne poslední řádky."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Aster označí stránku čistým listem. Tiše děkuje; o něco později ji slyšíte číst stejnou pasáž vedle fontány."
STR_QUEST_CAM_JOURNEY_THANKS_9: "S dalším svazkem stránek přichází krátká poznámka. Liora zkopírovala pasáž, kterou jste pomohli obnovit; na okraj napsala: \"Tohle jsme si spolu četli doma.\""
STR_QUEST_CAM_JOURNEY_THANKS_10: "Poznámka je dlouhá jen několik řádků. Liora nechala prostor pro odpověď, jako by vás už viděla, jak sedíte na druhém konci stolu."
STR_QUEST_CAM_JOURNEY_THANKS_11: "Mezi obnovenými stránkami najdete přeloženou poznámku z domova. Jeho poslední věta je jednoduchá: „Stále je tu pro vás místo."
