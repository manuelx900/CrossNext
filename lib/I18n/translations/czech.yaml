STR_PET_RULE_HOME: "Každý objekt má svůj vlastní cíl čtení, až 60 minut. Výběrem jiného nevyřízeného objektu se projekt spustí od nuly. Vlastněné předměty a zásoby přecházejí na dalšího mazlíčka; každý život si uchovává svou vlastní historii čtení."
