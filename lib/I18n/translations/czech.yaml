STR_CAR_INTRO: "Vina a poctivost jsou nezávislé. Každý případ má přesně jedno řešení. Výšky jsou fiktivní charakterové rysy."
STR_CAR_HELP_TEXT: "Jak vyřešit případ\nV horní části obrazovky je uveden přesný počet viníků a falešných tvrzení. Najděte kombinaci, která splňuje oba počty. Každý případ má jedno řešení.\n  \nGuilt Is Not Honesty\nNevinná postava může lhát a vinník může říkat pravdu. Dvě lži znamenají, že přesně dvě celá tvrzení jsou nepravdivá; ostatní jsou pravdivá. Značky Pravda / Lež odkazují na tvrzení; Podezřelý odkazuje na vinu.\n  \nReading the Clues\n\"A nebo B to udělal (nebo oba)\" znamená, že alespoň jedna jmenovitá postava je vinná. \"A a B to udělali\" vyžaduje obě. Lež popírá celé tvrzení: nepravdivé NEBO znamená, že to neudělal ani jeden z nich; nepravdivé A znamená, že to neudělal alespoň jeden z nich.\n  \n\"Oba pravdomluvní nebo oba lháři\" porovnává tvrzení, nikoli vinu. \"Přesně jeden lže\" znamená, že jejich tvrzení mají různé hodnoty pravdivosti. Tyto stopy mohou být samy o sobě pravdivé nebo nepravdivé.\n  \nNeighbors on a Small Screen\nPůvodní kruhové pořadí je Panther, Peacock, Shark, Fox, Bear, Stag, Horse, s použitím pouze znaky tohoto případu. Poslední a první jsou sousedy. Tato aplikace píše dvě jména přímo do každého souseda stopy. Nikdy nemusíte hádat, které karty jsou vedle portrétu. Změna stránky nebo orientace nemění stopu.\n  \nVýška a dieta\nKaždá karta zobrazuje fiktivní výšku a stravu. \"Vinník je vyšší než já\" znamená, že alespoň jeden vinník je vyšší než řečník, ne nutně všichni vinníci. Krátší funguje stejným způsobem. Masožravé a bylinožravé stopy znamenají, že alespoň jeden vinník má tuto stravu; všežravci se počítají jako ani jedno. Jména, výška a strava jsou spolehlivá fakta; prohlášení mohou lhát.\n  \nYOUR ANALYSIS\nPoužijte ? / Pravda / Lež a Podezření pod každým tvrzením k zaznamenání hypotéz. To jsou vaše poznámky, ne důkazy nebo automatické kontroly. Šipky ukazují další znaky. Na výšku režim zobrazí až tři na stránce.\n  \nObviňování\nStiskněte Accuse a vyberte přesně požadovaný počet viníků. Pouze potvrzení špatného obvinění stráví život. Začátečník a Normální mají dva životy; Pokročilý a Expert mají jeden. Správné obvinění vyřeší případ. Když nezůstanou žádné životy, řešení je odhaleno.\n  \nCAMPAIGN AND REPLAY\nExistuje 1470 případů. Otevřený případ pokračuje v aktuálním pokusu nebo otevře další po uzavření jednoho. Kampaň vám umožňuje vybrat kterýkoli z 1470 případů v libovolném pořadí od začátku. Replay začíná nový pokus se zachováním dřívějšího dokončení. V rámci každé obtížnosti, případy postupují od jednoho viníka na dva, pak z méně lháři na více v rámci každé skupiny viníků. Začátečník si ponechává jednoho viníka. Menší casts přicházejí jako první, když počet odpovídá. Všechny případy zůstávají k dispozici. Vyřešení dříve vyčerpaného případu ho upgraduje na vyřešené.\n  \nPokrok a životy jsou uloženy na SD kartu. Odchod, spánek nebo restart zařízení neobnoví životy v aktuálním pokusu. Neúspěšné uložení blokuje výsledek, dokud Retry uspěje. Reset all žádá o potvrzení před vymazáním pouze pokroku Carnivore."
