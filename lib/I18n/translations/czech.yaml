STR_FLASHCARDS_HELP: "Zkopírujte balíčky Anki (.apkg /.colpkg , .anki2 /.anki21 ), CSV /TSV/text nebo převeďte studijní složky na /FLASHCARDS. Použijte podsložky: každá až 128 položek.\nImporty\nakceptují základní, obrácené a jednoduché zavřené textové karty. Zvuk a vlastní HTML nejsou podporovány. Nejprve převeďte obrázek /CJK decky. Offline recenze používají FSRS. Import spustí nový plán a zachová originály."
