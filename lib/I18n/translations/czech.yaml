STR_UI_SWIPE_OR_TAP_AN_ARROW_TO_887004: "Pro řízení přejeďte nebo klepněte na šipku. Jezte uvedené jídlo, abyste rostli. Vyhněte se stěnám a vlastnímu ocasu. Nemůžete obrátit směr. Před odložením čtečky klepněte na Pozastavit. Uložené hry se vždy obnoví pozastavené."
STR_UI_YOU_PLAY_BLACK_TAP_AN_EMPTY_29AEBA: "Hrajete černé. Klepněte na prázdný čtverec, který zachycuje bílé disky v přímce. Všechny zachycené disky se převrátí na vaši barvu. Zařízení hraje bílou barvou. Pokud strana nemá žádný legální tah, projde automaticky. Většina disků vyhrává, když se žádná strana nemůže pohnout."
STR_UI_MAKE_ONE_CLOSED_LOOP_EACH_NUMBER_D60227: "Vytvořte jednu uzavřenou smyčku. Každé číslo říká, kolik z jeho čtyř hran patří do smyčky. Klepnutím poblíž okraje přejedete čáru, překřížíte a vyprázdníte. Čáry se nemohou větvit ani vytvářet samostatné smyčky. Všechny stopy se musí shodovat. Přijímá se jakékoli platné řešení."
STR_UI_CONNECT_ALL_ISLANDS_IN_ONE_NETWORK_C5618B: "Připojte všechny ostrovy do jedné sítě. Číslo na ostrově je jeho požadovaný počet mostů. Klepnutím na dva sousední ostrovy ve stejném řádku nebo sloupci projedete jeden, dva a nula mostů. Mosty nemohou skákat přes ostrovy. Vyhrává jakékoli spojené řešení, které odpovídá všem číslům."
