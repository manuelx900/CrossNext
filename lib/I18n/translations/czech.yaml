STR_INTERCEPT_TITLE_0: "HUT 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. Nechávají vás čekat za zamčenými dveřmi. Komponenta z počítacího stroje zmizela. Ranní záchytka vám šustí v kapse kabátu. Venku se kroky zastaví."
STR_INTERCEPT_CHOICE_0_0: "Promyslete si obvinění"
STR_INTERCEPT_CHOICE_0_1: "Počkejte na tazatele"
STR_INTERCEPT_CHOICE_0_2: "Prohledejte si kabát"
STR_INTERCEPT_TITLE_1: "OBVINĚNÍ"
STR_INTERCEPT_TEXT_1: "Mají podezření na zradu. Řešíte figurky, křížovky a šachové pozice jako o život. Tato místnost je další problém: protiřečte si a vaše důvěryhodnost může být první obětí."
STR_INTERCEPT_CHOICE_1_0: "Vyberte strategii"
STR_INTERCEPT_CHOICE_1_1: "Poslechněte si, co vědí"
STR_INTERCEPT_TITLE_2: "HARRIS PŘICHÁZÍ"
STR_INTERCEPT_TEXT_2: "Harris vstoupí s šálkem a pilníkem. Na Bombe chybí naviják. Vaše jméno bylo na rozpisu služeb. Položí šálek vedle tebe a zeptá se, kde jsi byl minulou noc."
STR_INTERCEPT_CHOICE_2_0: "Vypijte čaj"
STR_INTERCEPT_CHOICE_2_1: "Nechte čaj nedotčený"
STR_INTERCEPT_CHOICE_2_2: "Odpovězte klidně"
STR_INTERCEPT_TITLE_3: "KOMPONENTA"
STR_INTERCEPT_TEXT_3: "Uvnitř podšívky vašeho kabátu se vaše prsty setkají se studeným kovem. Komponenta tam stále je. Hooper řekl, že když to vezmeš, zastaví se to vydírání. Nyní mají zamčené dveře jiný význam."
STR_INTERCEPT_CHOICE_3_0: "Nechte to skryté"
STR_INTERCEPT_CHOICE_3_1: "Předejte to Harrisovi"
STR_INTERCEPT_TITLE_4: "VÍTĚZNÁ HRA"
STR_INTERCEPT_TEXT_4: "Spolupráce může zachovat vaši důvěryhodnost. Přesvědčivá lež by mohla získat čas. Útěk by vyměnil zamčenou místnost za stráže venku. Žádný z těchto pohybů nelze vzít zpět."
STR_INTERCEPT_CHOICE_4_0: "Spolupracujte"
STR_INTERCEPT_CHOICE_4_1: "Vymyslete si alibi"
STR_INTERCEPT_CHOICE_4_2: "Prohlédněte si okno"
STR_INTERCEPT_TITLE_5: "ČAJ"
STR_INTERCEPT_TEXT_5: "Místnost se nakloní. Harris si všimne vašeho mlčení, ale jeho tvář už ustupuje. Když příště otevřete oči, u stolu stojí další boty."
STR_INTERCEPT_CHOICE_5_0: "Předstírejte, že spíte"
STR_INTERCEPT_CHOICE_5_1: "Konfrontujte návštěvníka"
STR_INTERCEPT_CHOICE_5_2: "Požádejte o vodu"
STR_INTERCEPT_TITLE_6: "MALÉ ODMÍTNUTÍ"
STR_INTERCEPT_TEXT_6: "Odstrčíš šálek. Harris pozorněji sleduje pohyb než odpověď. Ptá se, zda je ještě někdo, koho by měl vyslýchat."
STR_INTERCEPT_CHOICE_6_0: "Zeptejte se, jaké má důkazy"
STR_INTERCEPT_CHOICE_6_1: "Zmínit Hoopera"
STR_INTERCEPT_CHOICE_6_2: "Podívejte se k oknu"
STR_INTERCEPT_TITLE_7: "CHYBĚJÍCÍ CÍVEK"
STR_INTERCEPT_TEXT_7: "Harris chce přímou odpověď. Vzal jsi součástku? Můžete mu říct, co máte ve svém kabátě, vysvětlit tlak, který Hooper použil, nebo se pokusit nasměrovat obvinění jinam."
STR_INTERCEPT_CHOICE_7_0: "Dejte mu součástku"
STR_INTERCEPT_CHOICE_7_1: "Vysvětlete vydírání"
STR_INTERCEPT_CHOICE_7_2: "Obviňte Hoopera"
STR_INTERCEPT_TITLE_8: "KOV NA STOLE"
STR_INTERCEPT_TEXT_8: "Komponenta leží mezi vámi. Harris to zkontroluje, aniž by se uvolnil. Vrácení odcizeného vybavení nevysvětluje, proč bylo odebráno. Chce jméno a něco spolehlivějšího než vaše slovo."
STR_INTERCEPT_CHOICE_8_0: "Nabídněte se, že najdete důkazy"
STR_INTERCEPT_CHOICE_8_1: "Zůstaňte a odpovězte na otázky"
STR_INTERCEPT_TITLE_9: "ALIBI"
STR_INTERCEPT_TEXT_9: "Popisujete klidný večer u svého stolu. Harris otevře soubor. Strážný vás viděl odcházet ze strojovny. Váš vymyšlený účet má nyní svědka proti."
STR_INTERCEPT_CHOICE_9_0: "Braňte příběh"
STR_INTERCEPT_CHOICE_9_1: "Přiznej vydírání"
STR_INTERCEPT_CHOICE_9_2: "Odmítněte další otázky"
STR_INTERCEPT_TITLE_10: "OKNO"
STR_INTERCEPT_TEXT_10: "Okno je vysoké a sklo je silné. Za ním vede cesta kolem další chaty. Rozbití by bylo hlasité; čekání zde má svá nebezpečí."
STR_INTERCEPT_CHOICE_10_0: "Rozbijte sklo"
STR_INTERCEPT_CHOICE_10_1: "Prozkoumejte cestu venku"
STR_INTERCEPT_CHOICE_10_2: "Vraťte se k rozhovoru"
STR_INTERCEPT_TITLE_11: "DALŠÍ NÁVŠTĚVNÍK"
STR_INTERCEPT_TEXT_11: "Hooper přišel, když jsi nejistý. Chce vědět, jestli má Harris tu součástku. Jednu ruku drží u dveří."
STR_INTERCEPT_CHOICE_11_0: "Předstírejte, že spíte"
STR_INTERCEPT_CHOICE_11_1: "Požadujte vysvětlení"
STR_INTERCEPT_CHOICE_11_2: "Požádejte o vodu"
STR_INTERCEPT_TITLE_12: "A VAROVÁNÍ"
STR_INTERCEPT_TEXT_12: "Zavoláš Harrise, než se čaj ujme. Vrací se podrážděný. Obvinění z poháru bude potřebovat něco, co může otestovat."
STR_INTERCEPT_CHOICE_12_0: "Ponechte si pohár jako důkaz"
STR_INTERCEPT_CHOICE_12_1: "Obviňte Harrise, že vás otrávil"
STR_INTERCEPT_CHOICE_12_2: "Soustřeďte se na kotouč"
STR_INTERCEPT_TITLE_13: "HOOPER"
STR_INTERCEPT_TEXT_13: "Harris to jméno pozná. Hooper je užitečný, dobře propojený a nechybí ani na soupisce včerejšího večera. Uznání není důkaz."
STR_INTERCEPT_CHOICE_13_0: "Najděte něco ověřitelného"
STR_INTERCEPT_CHOICE_13_1: "Trvejte na tom, že to Hooper ukradl"
STR_INTERCEPT_TITLE_14: "VYRÁBĚNÍ"
STR_INTERCEPT_TEXT_14: "Popisujete mladého muže, zrazenou sebedůvěru a požadavek, který následoval. Harris poslouchá, aniž by ti pomáhal. Pojmenování osoby, která nastražila past, může také odhalit osobu, kterou jste chtěli ochránit."
STR_INTERCEPT_CHOICE_14_0: "Dejte Harrisovi celý účet"
STR_INTERCEPT_CHOICE_14_1: "Vynechejte jména"
STR_INTERCEPT_CHOICE_14_2: "Navrhněte způsob, jak chytit Hoopera"
STR_INTERCEPT_TITLE_15: "SNADNÉ OBVINENÍ"
STR_INTERCEPT_TEXT_15: "Hooper, říkáte, musí být zodpovědný. Harris se ptá, jak to víš. Je rozdíl řešit problém a produkovat svědka, který může dokázat odpověď."
STR_INTERCEPT_CHOICE_15_0: "Ať Harris zpochybní tvrzení"
STR_INTERCEPT_CHOICE_15_1: "Zkuste poslat soukromou zprávu Hooperovi"
STR_INTERCEPT_TITLE_16: "TESTOVATELNÁ NÁPOVĚDA"
STR_INTERCEPT_TEXT_16: "Příběh lze odmítnout. Dokument, svědek nebo chybějící součást je obtížnější vysvětlit. Máte trochu času na to, abyste si vybrali, co budete sledovat."
STR_INTERCEPT_CHOICE_16_0: "Prohlédněte si blízkou chatu"
STR_INTERCEPT_CHOICE_16_1: "Použijte ranní odposlech"
STR_INTERCEPT_CHOICE_16_2: "Zeptejte se přímo Hoopera"
STR_INTERCEPT_TITLE_17: "VÍCE NEŽ NÁVRAT"
STR_INTERCEPT_TEXT_17: "Stroj může znovu fungovat, ale Harris stále musí vysvětlit narušení bezpečnosti. Nabízí vám poslední příležitost zjistit, kdo to zorganizoval."
STR_INTERCEPT_CHOICE_17_0: "Ukažte důkazy"
STR_INTERCEPT_CHOICE_17_1: "Hledejte důkaz"
STR_INTERCEPT_CHOICE_17_2: "Přijměte jeho rozsudek"
STR_INTERCEPT_TITLE_18: "ROZPOR"
STR_INTERCEPT_TEXT_18: "Harris nastaví vaši první odpověď vedle vaší nejnovější. Nemohou být oba pravdivé. Můžete opustit lež nebo nechat rozhovor skončit rozporem."
STR_INTERCEPT_CHOICE_18_0: "Řekněte pravdu o vydírání"
STR_INTERCEPT_CHOICE_18_1: "Stále vše popírejte"
STR_INTERCEPT_CHOICE_18_2: "Zkuste odejít"
STR_INTERCEPT_TITLE_19: "TICHO"
STR_INTERCEPT_TEXT_19: "Založíš ruce. Harris zavře soubor. V této místnosti ticho nekončí vyšetřování; tím pouze končí vaše role v jeho režii."
STR_INTERCEPT_CHOICE_19_0: "Poslechněte si rozhodnutí"
STR_INTERCEPT_TITLE_20: "ROZBITÉ SKLO"
STR_INTERCEPT_TEXT_20: "Okno povolí. Studený vzduch a zvuk píšťalky stráže se dostanou dohromady. Než se někdo dostane ke dveřím, je čas na jedno rozhodnutí."
STR_INTERCEPT_CHOICE_20_0: "Běžte na vnější cestu"
STR_INTERCEPT_CHOICE_20_1: "Zanechte kódované vodítko"
STR_INTERCEPT_CHOICE_20_2: "Zůstaňte a vysvětlete"
STR_INTERCEPT_TITLE_21: "MEZI CHATY"
STR_INTERCEPT_TEXT_21: "Cesta je mokrá. Hooperova chýše je dostatečně blízko, aby dosáhla před další hlídkou, ale otevřené prostranství za ní nabízí jiný druh šance."
STR_INTERCEPT_CHOICE_21_0: "Pokuste se uniknout z pozemku"
STR_INTERCEPT_CHOICE_21_1: "Jděte do Hooperovy chýše"
STR_INTERCEPT_CHOICE_21_2: "Vraťte se k Harrisovi"
STR_INTERCEPT_TITLE_22: "SOUKROMÁ HRA"
STR_INTERCEPT_TEXT_22: "Hooper vás studuje. Na stole prsty vytyčí pomyslnou šachovou pozici. Kódovaná odpověď by ho mohla přimět odhalit to, co přímé obvinění nikdy neudělá."
STR_INTERCEPT_CHOICE_22_0: "Odpovězte pomocí šachového klíče"
STR_INTERCEPT_CHOICE_22_1: "Vyhrožujte mu jménem"
STR_INTERCEPT_CHOICE_22_2: "Mluvte upřímně"
STR_INTERCEPT_TITLE_23: "tváří v tvář"
STR_INTERCEPT_TEXT_23: "Hooper se ptá, co vlastně můžete dokázat. Jeho sebevědomí pokulhává pouze tehdy, když zmíníte detaily, které by někdo mimo jeho plán neměl vědět."
STR_INTERCEPT_CHOICE_23_0: "Konfrontujte ho s důkazem"
STR_INTERCEPT_CHOICE_23_1: "Nabídněte komponentu jako obchod"
STR_INTERCEPT_CHOICE_23_2: "Bluff"
STR_INTERCEPT_TITLE_24: "POHÁR"
STR_INTERCEPT_TEXT_24: "Hooper přináší vodu, ale nejprve sáhne po šálku. Ponechat si ten pohár může být užitečnější než přijímat cokoli jiného, ​​co nabízí."
STR_INTERCEPT_CHOICE_24_0: "Nechte si šálek"
STR_INTERCEPT_CHOICE_24_1: "Znovu si zkontrolujte kabát"
STR_INTERCEPT_TITLE_25: "NĚCO TESTOVAT"
STR_INTERCEPT_TEXT_25: "Ponecháte si šálek a požádáte Harrise, aby ho nechal prozkoumat. Toto je konečně obvinění s připojeným předmětem. Hooperův pokus o jeho odstranění přináší další užitečný detail."
STR_INTERCEPT_CHOICE_25_0: "Dejte Harrisovi pohár"
STR_INTERCEPT_CHOICE_25_1: "Postavte se tomu Hooperovi"
STR_INTERCEPT_TITLE_26: "ŠPATNÝ CÍL"
STR_INTERCEPT_TEXT_26: "Obviňujete Harrise bez důkazů. Vidí podezřelého, který se snaží diskreditovat vyšetřovatele. Ať už se s čajem stalo cokoli, ztížili jste mu uvěřit vám."
STR_INTERCEPT_CHOICE_26_0: "Rozhovor končí"
STR_INTERCEPT_TITLE_27: "CELÝ ÚČET"
STR_INTERCEPT_TEXT_27: "Uvedete jména a popíšete schůzku. Harris klade přesné otázky. Vaše rozpaky jsou skutečné, ale také detaily, které nyní může zkontrolovat."
STR_INTERCEPT_CHOICE_27_0: "Nechte ho ověřit účet"
STR_INTERCEPT_CHOICE_27_1: "Nabídněte, že najdete Hoopera"
STR_INTERCEPT_TITLE_28: "NEÚSPĚŠNÝ BLUFF"
STR_INTERCEPT_TEXT_28: "Harris slyšel dost sebevědomých odpovědí. Hooper má taky. Ani jedna neposkytuje skutečnost, že váš příběh chybí."
STR_INTERCEPT_CHOICE_28_0: "Trvejte na nároku"
STR_INTERCEPT_CHOICE_28_1: "Udělejte zoufalý útěk"
STR_INTERCEPT_CHOICE_28_2: "Přiznej, co se skutečně stalo"
STR_INTERCEPT_TITLE_29: "INTERCEPT"
STR_INTERCEPT_TEXT_29: "List ve vaší kapse nese více než jen neuspořádaná písmena: jeho cesta přes chatrče umístí Hoopera do blízkosti stroje. Stručné vodítko může přimět správnou osobu, aby se podívala na správné místo."
STR_INTERCEPT_CHOICE_29_0: "Zakódujte zprávu pro Hoopera"
STR_INTERCEPT_CHOICE_29_1: "Ukažte cestu do Harris"
STR_INTERCEPT_TITLE_30: "STROJ BĚŽÍ"
STR_INTERCEPT_TEXT_30: "Harris má složku a stopu, která vede za vaše první vyděšené odpovědi. Bombe pokračuje ve své práci. Chatu 14 opouštíte pod svým vlastním jménem, ​​s méně tajemstvími a budoucností, za kterou se musíte ještě zodpovídat."
STR_INTERCEPT_TITLE_31: "POD PODEZŘENÍM"
STR_INTERCEPT_TEXT_31: "Vrácení součásti zachránilo stroj před zpožděním. Vaši pozici to neuložilo. Harris ukončí váš přístup do chatrčí, zatímco vyšetřování pokračuje. Rozhovor jste přežil, ale neočistil své jméno."
STR_INTERCEPT_TITLE_32: "VE VAZE"
STR_INTERCEPT_TEXT_32: "Dveře se otevírají spíše pro hlídače než pro vás. Rozpory, chybějící důkazy a ukradený komponent se staly případem, který už nemůžete řídit. Tento pokus zde končí."
STR_INTERCEPT_TITLE_33: "VNĚJŠÍ CESTA"
STR_INTERCEPT_TEXT_33: "Necháte chýše za sebou. Tma je užitečná, ale pozemky jsou sledovány. Rozbité okno přivedlo hlídky blíž, než jste doufali."
STR_INTERCEPT_CHOICE_33_0: "Přejděte otevřenou půdu"
STR_INTERCEPT_CHOICE_33_1: "Držte se servisní cesty"
STR_INTERCEPT_CHOICE_33_2: "Otočte se zpět a čelte Harrisovi"
STR_INTERCEPT_TITLE_34: "HOOPER'S BUDOU"
STR_INTERCEPT_TEXT_34: "Stůl je bez dozoru. Papíry leží pod křížovkou a strojovna se objevuje v plánu vypsaném tužkou. Venku se po prknech blíží kroky."
STR_INTERCEPT_CHOICE_34_0: "Prohlédněte si papíry"
STR_INTERCEPT_CHOICE_34_1: "Počkejte na Hoopera"
STR_INTERCEPT_CHOICE_34_2: "Odejít do Harrise"
STR_INTERCEPT_TITLE_35: "ŠACHOVÝ PROBLÉM"
STR_INTERCEPT_TEXT_35: "Dáte Hooperovi pozici, která odráží jeho těžkou situaci: chráněná figurka, odhalený král a tah, který vypadá bezpečně až do odpovědi. Varování rozumí. Jeho další slova poskytují spojení, které jste potřebovali."
STR_INTERCEPT_CHOICE_35_0: "Požádejte ho, aby přiznal plán"
STR_INTERCEPT_CHOICE_35_1: "Pošlete Harrisovi vstupné"
STR_INTERCEPT_TITLE_36: "BEZ MASKY"
STR_INTERCEPT_TEXT_36: "Mluvíte o tlaku místo toho, abyste předstíral, že nikdy neexistoval. Hooper stručně odpovídá spíše jako osoba než jako oponent. Ten otvor by mohl být použit pro obchod nebo past."
STR_INTERCEPT_CHOICE_36_0: "Požádejte o čestné ujednání"
STR_INTERCEPT_CHOICE_36_1: "Požádejte ho, aby se přiznal"
STR_INTERCEPT_CHOICE_36_2: "Vezměte účet Harrisovi"
STR_INTERCEPT_TITLE_37: "VSTUP HOOPER"
STR_INTERCEPT_TEXT_37: "Hooper vysvětluje dost, aby spojil vydírání s chybějící komponentou. Harris nyní může obnovit vybavení a zkontrolovat příběh. Musíte se rozhodnout, zda ukončit vyšetřování nebo nechat Hoopera zmizet."
STR_INTERCEPT_CHOICE_37_0: "Přineste Harrisovi vstup"
STR_INTERCEPT_CHOICE_37_1: "Pusťte Hoopera a odejděte"
STR_INTERCEPT_TITLE_38: "OBCHOD"
STR_INTERCEPT_TEXT_38: "Umístíte svou poslední páku na Hooperův dosah. Smlouva bez svědka nebo důkazů je pro něj výzvou, aby svůj problém vyřešil na vaše náklady."
STR_INTERCEPT_CHOICE_38_0: "Předejte součást"
STR_INTERCEPT_CHOICE_38_1: "Vyžádejte si svědeckou dohodu"
STR_INTERCEPT_CHOICE_38_2: "Stáhnout nabídku"
STR_INTERCEPT_TITLE_39: "HARRIS POSLOUCHÁ"
STR_INTERCEPT_TEXT_39: "Podrobnosti lze zkontrolovat. Harris se ptá, kde je součástka nyní. Vymazání účtu a spuštění počítače jsou související problémy, ale nejsou to stejné."
STR_INTERCEPT_CHOICE_39_0: "Vraťte, co máte v kabátě"
STR_INTERCEPT_CHOICE_39_1: "Pomozte obnovit součást"
STR_INTERCEPT_CHOICE_39_2: "Přestaňte odpovídat"
STR_INTERCEPT_TITLE_40: "ZA PLOTEM"
STR_INTERCEPT_TEXT_40: "Budky za vámi mizí, svoboda mimo areál není totéž co nevinnost a stroj je nyní naléhavým problémem někoho jiného. Vy jste unikli, příběh zůstává nedokončený."
STR_INTERCEPT_TITLE_41: "POSLEDNÍ CHYBA"
STR_INTERCEPT_TEXT_41: "Hlídka se k vám dostane dříve, než skončí otevřené prostranství, jinak se Hooperův slib zhroutí, když už pro něj nebude užitečný. Došly vám bezpečné pohyby. Příběh lze zkusit znovu od začátku."
STR_INTERCEPT_TITLE_42: "PAPÍRY"
STR_INTERCEPT_TEXT_42: "Plán umístí Hoopera tam, kde byl podle vašeho příběhu. Vedle toho je poznámka, která vás jako první vtáhla do pasti. Kombinace je dostatečně specifická, aby ji Harris mohl ověřit."
STR_INTERCEPT_CHOICE_42_0: "Odneste papíry Harrisovi"
STR_INTERCEPT_CHOICE_42_1: "Počkejte a postavte se Hooperovi"
STR_INTERCEPT_TITLE_43: "JEDNO POSLEDNÍ USTANOVENÍ"
STR_INTERCEPT_TEXT_43: "Hooper nabízí vrácení dílu zpět. Důvěřovat mu by odstranilo jeden bezprostřední problém; kdyby byl Harris svědkem, bylo by těžší vytvořit dalšího."
STR_INTERCEPT_CHOICE_43_0: "Zařiďte návrat svědka"
STR_INTERCEPT_CHOICE_43_1: "Přiveďte Harrise do plánu"
STR_INTERCEPT_TITLE_44: "OBNOVENÍ CÍVKY"
STR_INTERCEPT_TEXT_44: "Se záznamem účtu se vyhledávání vrátí k chybějícímu hardwaru. Harris kontroluje strojovnu, zatímco vy určujete, kde by měla být součást."
STR_INTERCEPT_CHOICE_44_0: "Dokončete ověřený návrat"
STR_INTERCEPT_CHOICE_44_1: "Získejte jej z kabátu"
STR_INTERCEPT_CHOICE_44_2: "Varujte Harrise před Hooperem"
STR_INTERCEPT_TITLE_45: "ZÁVĚREČNÁ OTÁZKA"
STR_INTERCEPT_TEXT_45: "Harris čeká. Pokud můžete připojit Hooper ke krádeži, stále existuje způsob, jak obnovit komponentu a řádně to ukončit. Jinak má vyšetřování pouze váš měnící se účet."
STR_INTERCEPT_CHOICE_45_0: "Předložte důkazy"
STR_INTERCEPT_CHOICE_45_1: "Přiznej, že nic víc nemáš"
