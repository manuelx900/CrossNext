STR_QUEST_CAM_DECOR_NAME_0: "Lesní víla"
STR_QUEST_CAM_DECOR_TEXT_0: "Osvobodil jsi vílu od tichých kořenů. Vnese do vašeho domova malý zázrak."
STR_QUEST_CAM_SOLO_DECOR_NAME_1: "Lesní lucerna"
STR_QUEST_CAM_SOLO_DECOR_TEXT_1: "Lucerna pro osvětlení vašeho čtenářského koutku."
STR_QUEST_CAM_DECOR_NAME_2: "Echo Ulita"
STR_QUEST_CAM_DECOR_TEXT_2: "Zachráněný námořník vám dá mušli, která stále nese píseň moře."
STR_QUEST_CAM_DECOR_NAME_3: "Inkoustový duch"
STR_QUEST_CAM_DECOR_TEXT_3: "Duch utekl z prázdné stránky. Rozhodne se cestovat s vámi."
STR_QUEST_CAM_DECOR_NAME_4: "Měsíční květ"
STR_QUEST_CAM_DECOR_TEXT_4: "Zahradníci zachránili jedno semínko ze spící zahrady. Tato květina vyrostla pro vás."
STR_QUEST_CAM_DECOR_NAME_5: "Zimní krystal"
STR_QUEST_CAM_DECOR_TEXT_5: "Tání odhaluje krystal držící poslední vzpomínku na horu."
STR_QUEST_CAM_DECOR_NAME_6: "Mechanická sova"
STR_QUEST_CAM_DECOR_TEXT_6: "Hodinář opravuje tohoto malého strážce, aby vám poděkoval za to, že vracíte čas."
STR_QUEST_CAM_DECOR_NAME_7: "Fénixovo pírko"
STR_QUEST_CAM_DECOR_TEXT_7: "Z nalezeného popela vstává pírko: příslib, že příběhy mohou začít znovu."
STR_QUEST_CAM_DECOR_NAME_8: "Pouštní lampa"
STR_QUEST_CAM_DECOR_TEXT_8: "Vypravěč vám dá lampu, která udržovala pouštní příběhy naživu."
STR_QUEST_CAM_DECOR_NAME_9: "Cloud Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "Otevřete cloudovou klec. Malý koi zůstane hlídat vaše sny."
STR_QUEST_CAM_DECOR_NAME_10: "Dračí srdce"
STR_QUEST_CAM_DECOR_TEXT_10: "Draci vám svěří krystal zrozený z jejich obnovené paměti."
STR_QUEST_CAM_DECOR_NAME_11: "Hvězda paměti"
STR_QUEST_CAM_DECOR_TEXT_11: "První obnovená hvězda vám osvětlí cestu k posledním stránkám."
STR_QUEST_CAM_DECOR_NAME_12: "Čtení Sprout"
STR_QUEST_CAM_DECOR_TEXT_12: "Malá rostlina pro klidný čtenářský koutek."
STR_QUEST_CAM_DECOR_NAME_13: "Uložené knihy"
STR_QUEST_CAM_DECOR_TEXT_13: "Příběhy čekající na svého dalšího čtenáře."
STR_QUEST_CAM_DECOR_NAME_14: "Banner Voyager"
STR_QUEST_CAM_DECOR_TEXT_14: "Praporek, který si zapamatuje každý nový začátek."
STR_QUEST_CAM_DECOR_NAME_15: "Měsíční houby"
STR_QUEST_CAM_DECOR_TEXT_15: "Malý kousek lesa pro váš domov."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Začátek dobrodružství"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Po mnoho let lidé žili v míru a užívali si své knihy. Pak je začal král zapomnění ničit. Chtěl všem zabránit ve čtení a nechat všechny příběhy navždy zmizet."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Králova monstra"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "King of Oblivion poslal svá monstra do celého světa. Zničili každou knihu, kterou našli, a napadli každého, kdo se je pokusil zastavit. Knihovny začaly mizet a lidé přestali číst."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Síla čtení"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Jednoho dne, když si čtete poblíž vaší vesnice, objeví se monstrum. Snažíte se utéct, ale stane se něco překvapivého: čím více čtete, tím je to slabší. Uvědomujete si, že čtení je jediný způsob, jak bojovat s královskou magií."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Vaše poslání"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Vydali jste se zastavit krále. Na své cestě k jeho hradu musíte překonat lesy, města, hory a další místa plná nepřátel. Každé monstrum, které porazíte, vás přivede o něco blíž. Pokračujte ve čtení, porazte jeho strážce a dostaňte se k němu dříve, než zničí všechny knihy na světě."
STR_QUEST_CAM_JOURNEY2_BOOK_0: "Les monster"
STR_QUEST_CAM_JOURNEY2_BOOK_1: "Město bez knih"
STR_QUEST_CAM_JOURNEY2_BOOK_2: "Přístav Mlhy"
STR_QUEST_CAM_JOURNEY2_BOOK_3: "Knihovna pod mořem"
STR_QUEST_CAM_JOURNEY2_BOOK_4: "Hory ozvěny"
STR_QUEST_CAM_JOURNEY2_BOOK_5: "Moře písku"
STR_QUEST_CAM_JOURNEY2_BOOK_6: "Clockwork Citadela"
STR_QUEST_CAM_JOURNEY2_BOOK_7: "Palác měsíce"
STR_QUEST_CAM_JOURNEY2_BOOK_8: "Zahrada bohů"
STR_QUEST_CAM_JOURNEY2_BOOK_9: "Válka o knihy"
STR_QUEST_CAM_JOURNEY2_BOOK_10: "Cesta hvězd"
STR_QUEST_CAM_JOURNEY2_BOOK_11: "Poslední stránka"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Po porážce krále zapomnění se vrátíte domů. Jeho armáda už nemůže ničit knihy a lidé si zase v klidu čtou. Zachránili jste příběhy světa. Zbývá ještě mnoho knih k objevování."
