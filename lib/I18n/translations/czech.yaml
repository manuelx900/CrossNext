STR_MYST_GUIDE_YOU_ROLE: "Postava, kterou ovládáte"
STR_MYST_GUIDE_YOU_COPY: "Dekódujete tajné zprávy. Hooper vás vydíral, abyste si vzali součást Bombe. Začínáte zamčeni v chatě 14 s částí a zachycenou zprávou v kabátu."
STR_MYST_GUIDE_HARRIS: "Harris"
STR_MYST_GUIDE_HARRIS_ROLE: "Vyšetřovatel"
STR_MYST_GUIDE_HARRIS_COPY: "Harris se vás ptá na chybějící součástku. Porovná váš účet s rozpisem služeb a dalšími důkazy. Je to osoba, kterou musíte přesvědčit; samotné obvinění nic nedokazuje."
STR_MYST_GUIDE_HOOPER: "Hooper"
STR_MYST_GUIDE_HOOPER_ROLE: "Váš kolega a vyděrač"
STR_MYST_GUIDE_HOOPER_COPY: "Hooper také pracuje v Bletchley Park. Tlačil na vás, abyste si vzali součástku, a má své vlastní zájmy. Můžete ho vyslýchat, vyjednávat nebo hledat důkazy. Znalost jeho role vám neřekne, která volba je bezpečná."
