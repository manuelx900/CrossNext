STR_PET_GUIDE_SATIETY: "Sytost: 100 znamená, že nemáte hlad. Jídlo tuto hodnotu zvyšuje."
STR_PET_GUIDE_MOOD: "Hlaď svého společníka a hraj si s ním. Čtení mu také zlepšuje náladu."
STR_PET_GUIDE_ENERGY: "Hry využívají energii. Zvolte Odpočinek při únavě: Váš mazlíček odpočívá 2 hodiny."
STR_PET_GUIDE_HYGIENE: "Vyčistěte svého mazlíčka zdarma, abyste předešli onemocnění. Pokud je již nemocný, dejte mu nápravu ve Zdraví."
STR_PET_GUIDE_READING: "Vyberte si vejce a vychovejte svého mazlíčka čtením. Dopřejte tomu jídlo, společnost, odpočinek a úklid."
STR_PET_GUIDE_HOME: "Získejte dekorace čtením. Umístěte nebo odstraňte je volně; necháš si každý předmět."
STR_PET_GUIDE_SUPPLIES: "Získáte porci při 5, 10, 15, 30, 60 a 120 minutách čtení denně: až 6 porcí. Každý zvyšuje měřič sytosti o 25 bodů, až do 100."
STR_PET_GUIDE_FEED: "Každý den získáte jeden opravný prostředek za 30 minut čtení a další za 120 minut. Použijte je ve Zdraví, pokud váš mazlíček onemocní."
STR_PET_GUIDE_GAMES: "První 3 hry každý den zlepšují náladu a spotřebují 20 energie. Pak můžeš trénovat zdarma. Před hraním se postarej o nemocného, hladového, unaveného nebo spícího společníka."
STR_PET_GUIDE_HEALTH: "Čištění je bezplatné a obnovuje hygienu na 100. Neléčí nemoc: za tím účelem otevřete Zdraví a použijte lék."
STR_PET_GUIDE_DIFFICULTY: "Relaxed nemá žádný termín pro návrat ke čtení. Normální umožňuje 7 dní, Těžké 3 dny a Extrémní 24 hodin. Pokud lhůta uplyne, váš mazlíček zemře. Čtení znovu spustí časovač."
STR_PET_GUIDE_PROJECT: "Vyberte si objekt a čtěte až 60 minut, abyste jej získali. Změna projektů začíná na nule. Vlastněné objekty můžete odstranit, aniž byste je ztratili; dědí se."
