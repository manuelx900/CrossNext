STR_INTERCEPT_ABOUT: "Zhuštěná adaptace The Intercept by inkle, 2016, použitá pod licencí MIT. Bletchley Park, 1942: chybějící součást stroje, vydírání a rozhovor, který může skončit na svobodě nebo ve vazbě.\n\nVaše rozhodnutí a pozice se uloží po každé volbě. Nový příběh resetuje tuto hru. Pro tento firmware byly vytvořeny originální ilustrace. Původní scénář a licence jsou součástí projektu."
