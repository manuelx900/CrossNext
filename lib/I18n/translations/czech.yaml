STR_UI_EVERY_PAIR_OF_THINGS_MEETS_IN_1E0DCF: "Klepněte na pár: nejprve X, poté potvrďte. Potvrzení vyloučí zbytek řádku a sloupce se světlejšími značkami. Mřížka pouze vymaže své vlastní značky; vaše zůstaňte, dokud je nevyčistíte."
STR_UI_READ_ONE_MARK_WHAT_IT_RULES_5DA72B: "Přečtěte si jednu, označte, co vylučuje, klepnutím na její číslo ji zaškrtněte. Stopy nikdy nelžou, pokud případ neříká, že mluví podezřelý."
