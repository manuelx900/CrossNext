STR_MYST_GUIDE_OBJECTIVE_COPY: "Chybí část Bombe, stroje na rozluštění kódů. Jste v podezření. Vysvětlete, co se stalo, najděte důkazy a rozhodněte se, komu věřit. Vaše volby vedou k různým koncům."
