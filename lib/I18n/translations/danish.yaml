STR_CAR_INTRO: "Skyldfølelse og ærlighed er uafhængige. Hver sag har præcis én løsning. Højder er fiktive karaktertræk."
STR_CAR_HELP_TEXT: "Sådan løser du en sag\nHver karakter gør en erklæring. Toppen af skærmen giver det nøjagtige antal skyldige og falske udsagn. Find en kombination, der tilfredsstiller begge tæller. Hver sag har en løsning.\n  \nSkyld er ikke ærlighed\nEn uskyldig karakter kan lyve, og en skyldig kan fortælle sandheden. To løgne betyder præcis to hele udsagn er falske; de andre er sande. Sandhed / Lie mærker refererer til udsagnet; Mistanke refererer til skyld.\n  \nLæsning af sporene\n\"A eller B gjorde det (eller begge)\" betyder, at mindst en af de navngivne personer er skyldig. \"A og B gjorde det\" kræver begge. En løgn negerer hele udsagnet: et falsk ELLER betyder, at ingen af dem gjorde det; et falsk OG betyder, at mindst en af dem ikke gjorde det.\n  \n\"Begge sandfærdige eller begge lyver\" sammenligner udsagn, ikke skyld. \"Præcis en lyver\" betyder, at deres udsagn har forskellige sandhedsværdier. Disse spor kan selv være sande eller falske.\n  \nNaboer på en lille skærm\nDen oprindelige cirkulære rækkefølge er Panther, Peacock, Shark, Fox, Bear, Hirsch, Horse, ved hjælp af kun denne sags tegn. Den sidste og første er naboer. Denne app skriver de to navne direkte i hver nabo spor. Du behøver aldrig at gætte, hvilke kort er ved siden af et portræt. Ændring side eller orientering ændrer ikke et spor.\n  \nHøjde og vægt\nHvert kort viser en fiktiv højde og kost. \"En skyldige er højere end mig\" betyder, at mindst én skyldige er højere end taleren, ikke nødvendigvis alle de skyldige. Kortere virker på samme måde. Kødædende og planteædende spor betyder, at mindst én skyldige har denne kost; omnivorer tæller som ingen af delene. Navne, højder og diæter er pålidelige fakta; udsagn kan lyve.\n  \nDin analyse\nBrug? / Sandhed / Løgn og Mistanke under hvert udsagn til at notere hypoteser. Disse er dine noter, ikke beviser eller automatiske kontroller. Pile viser de andre tegn. Portrættilstand viser op til tre pr. side.\n  \nAnklagemyndigheden\nTryk på Anklage og vælg præcis det ønskede antal skyldige. Kun bekræftelse af en forkert anklage bruger et liv. Begynder og Normal har to liv; Avanceret og Ekspert har et. En korrekt anklage løser sagen. Med ingen liv tilbage, løsningen er afsløret.\n  \nKampagne og genafspilning\nDer er 1.470 sager. Åben sag genoptager det aktuelle forsøg eller åbner den næste efter en lukket sag. Kampagnen lader dig vælge en af de 1.470 sager i vilkårlig rækkefølge fra begyndelsen. Genspil starter et nyt forsøg, samtidig med at tidligere fuldførelser bevares. Inden for hver sværhedsgrad udvikler sagerne sig fra én skyldner til to, så fra færre løgnere til flere inden for hver skyldnergruppe. Begynderen beholder én skyldner. Mindre kast kommer først, når antallet stemmer overens. Alle sager forbliver tilgængelige. Løsning af en tidligere udtømt sag opgraderer den til løst.\n  \nFremskridt og liv gemmes på SD-kortet. At forlade, sove eller genstarte en enhed gendanner ikke liv i det aktuelle forsøg. En mislykket gemme blokerer resultatet, indtil Retry lykkes. Nulstil alle beder om bekræftelse, før du sletter kun kødædende fremskridt."
