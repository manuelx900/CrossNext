STR_QUEST_CAM_DECOR_NAME_0: "Skovfe"
STR_QUEST_CAM_DECOR_TEXT_0: "Du befriede feen fra de tavse rødder. Hun vil bringe et lille vidunder til dit hjem."
STR_QUEST_CAM_SOLO_DECOR_NAME_1: "Skovlanterne"
STR_QUEST_CAM_SOLO_DECOR_TEXT_1: "En lanterne til at oplyse dit læsehjørne."
STR_QUEST_CAM_DECOR_NAME_2: "Echo Conch"
STR_QUEST_CAM_DECOR_TEXT_2: "En reddet sømand giver dig en skal, der stadig rummer havets sang."
STR_QUEST_CAM_DECOR_NAME_3: "Blækånd"
STR_QUEST_CAM_DECOR_TEXT_3: "En ånd flygtede fra en tom side. Den vælger at rejse med dig."
STR_QUEST_CAM_DECOR_NAME_4: "Måneblomst"
STR_QUEST_CAM_DECOR_TEXT_4: "Gartnerne reddede et frø fra den sovende have. Denne blomst voksede for dig."
STR_QUEST_CAM_DECOR_NAME_5: "Vinterkrystal"
STR_QUEST_CAM_DECOR_TEXT_5: "Tøen afslører en krystal, der rummer det sidste minde om bjerget."
STR_QUEST_CAM_DECOR_NAME_6: "Urværksugle"
STR_QUEST_CAM_DECOR_TEXT_6: "Urmageren reparerer denne lille vogter for at takke dig for at bringe tiden tilbage."
STR_QUEST_CAM_DECOR_NAME_7: "Føniksfjer"
STR_QUEST_CAM_DECOR_TEXT_7: "Fra den genvundne aske stiger en fjer: løftet om, at historier kan begynde igen."
STR_QUEST_CAM_DECOR_NAME_8: "Ørkenlampe"
STR_QUEST_CAM_DECOR_TEXT_8: "En historiefortæller giver dig lampen, der holdt ørkenfortællingerne i live."
STR_QUEST_CAM_DECOR_NAME_9: "Cloud Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "Du åbner skyburet. En lille koi bliver for at våge over dine drømme."
STR_QUEST_CAM_DECOR_NAME_10: "Dragehjerte"
STR_QUEST_CAM_DECOR_TEXT_10: "Dragerne betror dig en krystal født fra deres genvundne hukommelse."
STR_QUEST_CAM_DECOR_NAME_11: "Mindestjerne"
STR_QUEST_CAM_DECOR_TEXT_11: "Den første restaurerede stjerne lyser din vej mod de sidste sider."
STR_QUEST_CAM_DECOR_NAME_12: "Læsespire"
STR_QUEST_CAM_DECOR_TEXT_12: "En lille plante til et stille læsehjørne."
STR_QUEST_CAM_DECOR_NAME_13: "Gemte bøger"
STR_QUEST_CAM_DECOR_TEXT_13: "Historier, der venter på deres næste læser."
STR_QUEST_CAM_DECOR_NAME_14: "Voyager-banner"
STR_QUEST_CAM_DECOR_TEXT_14: "En vimpel til at huske hver ny begyndelse."
STR_QUEST_CAM_DECOR_NAME_15: "Månesvampe"
STR_QUEST_CAM_DECOR_TEXT_15: "Et lille stykke af skoven til dit hjem."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Begyndelsen på eventyret"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "I mange år levede folk i fred og nød deres bøger. Så begyndte kongen af ​​glemsel at ødelægge dem. Han ville stoppe alle fra at læse og få alle historier til at forsvinde for altid."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Kongens monstre"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "The King of Oblivion sendte sine monstre over hele verden. De ødelagde hver bog, de fandt, og angreb enhver, der forsøgte at stoppe dem. Biblioteker begyndte at forsvinde, og folk holdt op med at læse."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Styrken ved at læse"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "En dag, mens du læser i nærheden af din landsby, dukker et monster op. Du forsøger at komme væk, men der sker noget overraskende: Jo mere du læser, jo svagere bliver det. Du indser at læsning er den eneste måde at bekæmpe kongens magi."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Din mission"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Du satte dig for at stoppe kongen. På din vej til hans slot skal du krydse skove, byer, bjerge og andre steder fulde af fjender. Hvert monster, du besejrer, bringer dig lidt tættere på. Bliv ved med at læse, besejr hans vogtere og nå ham, før han ødelægger enhver bog i verden."
