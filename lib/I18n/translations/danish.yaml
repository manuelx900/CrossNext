STR_UI_MAKE_ONE_CLOSED_LOOP_EACH_NUMBER_D60227: "Lav en lukket sløjfe. Hvert tal fortæller, hvor mange af dets fire kanter, der hører til løkken. Tryk tæt på en kant for at cykle linje, krydse og tømme. Linjer kan ikke forgrene sig eller danne separate sløjfer. Alle spor skal matche. Enhver gyldig løsning accepteres."
STR_UI_CONNECT_ALL_ISLANDS_IN_ONE_NETWORK_C5618B: "Forbind alle øer i ét netværk. Tallet på en ø er dens nødvendige broantal. Tryk på to naboøer i samme række eller kolonne for at cykle en, to og nul broer. Broer kan ikke hoppe over øer. Enhver tilsluttet løsning, der matcher alle numre, vinder."
