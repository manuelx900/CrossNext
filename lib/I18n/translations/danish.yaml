STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Efter at have besejret kongen af glemsel, vender du hjem. Hans hær kan ikke længere ødelægge bøger, og folk læser i fred igen. Du har reddet verdens historier. Der er stadig mange bøger tilbage at opdage."
