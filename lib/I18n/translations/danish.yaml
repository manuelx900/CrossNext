STR_INTERCEPT_TITLE_0: "HUT 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. De lader dig vente bag en låst dør. En komponent fra regnemaskinen er forsvundet. Morgenens opsnappede besked rasler i frakkelommen. Udenfor stopper fodtrinene."
STR_INTERCEPT_CHOICE_0_0: "Tænk anklagen igennem"
STR_INTERCEPT_CHOICE_0_1: "Vent på intervieweren"
STR_INTERCEPT_CHOICE_0_2: "Søg i din frakke"
STR_INTERCEPT_TITLE_1: "ANKÆLDELSEN"
STR_INTERCEPT_TEXT_1: "De har mistanke om forræderi. Du løser figurer, krydsord og skakstillinger for at leve af. Dette rum er et andet problem: modsige dig selv, og din troværdighed kan være det første offer."
STR_INTERCEPT_CHOICE_1_0: "Vælg en strategi"
STR_INTERCEPT_CHOICE_1_1: "Hør, hvad de ved"
STR_INTERCEPT_TITLE_2: "HARRIS ANKOMMER"
STR_INTERCEPT_TEXT_2: "Harris kommer ind med en tekop og en fil. Der mangler et hjul fra bomben. Dit navn var på vagtlisten. Han sætter koppen ved siden af ​​dig og spørger, hvor du var i går aftes."
STR_INTERCEPT_CHOICE_2_0: "Drik teen"
STR_INTERCEPT_CHOICE_2_1: "Lad teen stå urørt"
STR_INTERCEPT_CHOICE_2_2: "Svar roligt"
STR_INTERCEPT_TITLE_3: "KOMPONENTEN"
STR_INTERCEPT_TEXT_3: "Inde i foret på din frakke møder dine fingre koldt metal. Komponenten er der stadig. Hooper sagde, at det ville få afpresningen til at stoppe. Nu har den låste dør en anden betydning."
STR_INTERCEPT_CHOICE_3_0: "Hold det skjult"
STR_INTERCEPT_CHOICE_3_1: "Giv den til Harris"
STR_INTERCEPT_TITLE_4: "ET VINDERSPIL"
STR_INTERCEPT_TEXT_4: "Samarbejde kunne bevare din troværdighed. En overbevisende løgn kunne købe tid. Escape ville bytte et aflåst rum til vagterne udenfor. Ingen af ​​disse træk kan tages tilbage."
STR_INTERCEPT_CHOICE_4_0: "Samarbejd"
STR_INTERCEPT_CHOICE_4_1: "Opfind et alibi"
STR_INTERCEPT_CHOICE_4_2: "Undersøg vinduet"
STR_INTERCEPT_TITLE_5: "TE"
STR_INTERCEPT_TEXT_5: "Rummet vipper. Harris bemærker din tavshed, men hans ansigt er allerede på vej tilbage. Næste gang du åbner øjnene, står endnu et par sko ved bordet."
STR_INTERCEPT_CHOICE_5_0: "Lad som om du forbliver i søvn"
STR_INTERCEPT_CHOICE_5_1: "Konfronter den besøgende"
STR_INTERCEPT_CHOICE_5_2: "Bed om vand"
STR_INTERCEPT_TITLE_6: "ET LILLE AFSLAG"
STR_INTERCEPT_TEXT_6: "Du skubber koppen væk. Harris følger bevægelsen nøjere end svaret. Han spørger, om der er en anden, han skal afhøre."
STR_INTERCEPT_CHOICE_6_0: "Spørg hvilke beviser han har"
STR_INTERCEPT_CHOICE_6_1: "Nævn Hooper"
STR_INTERCEPT_CHOICE_6_2: "Kig mod vinduet"
STR_INTERCEPT_TITLE_7: "DEN MANGENDE HJUL"
STR_INTERCEPT_TEXT_7: "Harris vil have et direkte svar. Har du taget komponenten? Du kan fortælle ham, hvad der er i din frakke, forklare det pres, Hooper lagde på, eller prøve at pege anklagen et andet sted hen."
STR_INTERCEPT_CHOICE_7_0: "Giv ham komponenten"
STR_INTERCEPT_CHOICE_7_1: "Forklar afpresningen"
STR_INTERCEPT_CHOICE_7_2: "Anklage Hooper"
STR_INTERCEPT_TITLE_8: "METAL PÅ BORDET"
STR_INTERCEPT_TEXT_8: "Komponenten ligger mellem jer. Harris tjekker det uden at slappe af. At returnere stjålet udstyr forklarer ikke, hvorfor det blev taget. Han vil have et navn og noget mere pålideligt end dit ord."
STR_INTERCEPT_CHOICE_8_0: "Tilbyd at finde beviser"
STR_INTERCEPT_CHOICE_8_1: "Bliv og svar på spørgsmål"
STR_INTERCEPT_TITLE_9: "ALIBIET"
STR_INTERCEPT_TEXT_9: "Du beskriver en stille aften ved dit skrivebord. Harris åbner filen. En vagt så dig forlade maskinrummet. Din opfundne konto har nu et vidne imod sig."
STR_INTERCEPT_CHOICE_9_0: "Forsvar historien"
STR_INTERCEPT_CHOICE_9_1: "Indrøm afpresningen"
STR_INTERCEPT_CHOICE_9_2: "Afvis yderligere spørgsmål"
STR_INTERCEPT_TITLE_10: "VINDUET"
STR_INTERCEPT_TEXT_10: "Vinduet er højt, og glasset er tykt. Ud over den fører stien forbi endnu en hytte. At bryde det ville være højt; at vente her har sine egne farer."
STR_INTERCEPT_CHOICE_10_0: "Knæk glasset"
STR_INTERCEPT_CHOICE_10_1: "Studér stien udenfor"
STR_INTERCEPT_CHOICE_10_2: "Vend tilbage til interviewet"
STR_INTERCEPT_TITLE_11: "EN ANDEN BESØGENDE"
STR_INTERCEPT_TEXT_11: "Hooper er kommet, mens du er ustabil. Han vil vide, om Harris har komponenten. Han holder den ene hånd tæt på døren."
STR_INTERCEPT_CHOICE_11_0: "Lad som om du sover"
STR_INTERCEPT_CHOICE_11_1: "Kræv en forklaring"
STR_INTERCEPT_CHOICE_11_2: "Bed om vand"
STR_INTERCEPT_TITLE_12: "EN ADVARSEL"
STR_INTERCEPT_TEXT_12: "Du ringer efter Harris, før teen tager fat. Han vender tilbage irriteret. En anklage om koppen skal have noget, han kan teste."
STR_INTERCEPT_CHOICE_12_0: "Behold koppen som bevis"
STR_INTERCEPT_CHOICE_12_1: "Beskyld Harris for at forgifte dig"
STR_INTERCEPT_CHOICE_12_2: "Koncentrer dig om rullen"
STR_INTERCEPT_TITLE_13: "HOOPER"
STR_INTERCEPT_TEXT_13: "Harris genkender navnet. Hooper er nyttig, godt forbundet og heller ikke fraværende fra gårsdagens liste. Anerkendelse er ikke bevis."
STR_INTERCEPT_CHOICE_13_0: "Find noget, der kan verificeres"
STR_INTERCEPT_CHOICE_13_1: "Insister på, at Hooper stjal den"
STR_INTERCEPT_TITLE_14: "BLACKMAIL"
STR_INTERCEPT_TEXT_14: "Du beskriver en ung mand, en svigtet selvtillid og det krav, der fulgte. Harris lytter uden at hjælpe dig. At navngive den person, der satte fælden, kan også afsløre den person, du håbede at beskytte."
STR_INTERCEPT_CHOICE_14_0: "Giv Harris den fulde konto"
STR_INTERCEPT_CHOICE_14_1: "Udelad navnene"
STR_INTERCEPT_CHOICE_14_2: "Foreslå en måde at fange Hooper på"
STR_INTERCEPT_TITLE_15: "EN NEM ANGELSE"
STR_INTERCEPT_TEXT_15: "Hooper, siger du, må være ansvarlig. Harris spørger, hvordan du ved det. Der er forskel på at løse et problem og at fremstille et vidne, der kan bevise svaret."
STR_INTERCEPT_CHOICE_15_0: "Lad Harris anfægte påstanden"
STR_INTERCEPT_CHOICE_15_1: "Prøv en privat besked til Hooper"
STR_INTERCEPT_TITLE_16: "EN PRØVELIG LED"
STR_INTERCEPT_TEXT_16: "En historie kan nægtes. Et dokument, et vidne eller den manglende komponent er sværere at bortforklare. Du har lidt tid til at vælge, hvad du vil forfølge."
STR_INTERCEPT_CHOICE_16_0: "Undersøg den nærliggende hytte"
STR_INTERCEPT_CHOICE_16_1: "Brug morgenaflytningen"
STR_INTERCEPT_CHOICE_16_2: "Spørg Hooper direkte"
STR_INTERCEPT_TITLE_17: "MERE END ET RETUR"
STR_INTERCEPT_TEXT_17: "Maskinen kan fungere igen, men Harris har stadig et sikkerhedsbrud at forklare. Han giver dig en sidste mulighed for at fastslå, hvem der har organiseret det."
STR_INTERCEPT_CHOICE_17_0: "Vis beviserne"
STR_INTERCEPT_CHOICE_17_1: "Se efter beviser"
STR_INTERCEPT_CHOICE_17_2: "Accepter hans dom"
STR_INTERCEPT_TITLE_18: "EN MODstrid"
STR_INTERCEPT_TEXT_18: "Harris sætter dit første svar ved siden af dit seneste. De kan ikke begge være sande. Du kan opgive løgnen, eller lade interviewet ende på en selvmodsigelse."
STR_INTERCEPT_CHOICE_18_0: "Fortæl sandheden om afpresningen"
STR_INTERCEPT_CHOICE_18_1: "Bliv ved med at benægte alt"
STR_INTERCEPT_CHOICE_18_2: "Prøv at forlade"
STR_INTERCEPT_TITLE_19: "STILLE"
STR_INTERCEPT_TEXT_19: "Du folder dine arme. Harris lukker filen. I dette rum afslutter tavshed ikke efterforskningen; det ender kun din del i at dirigere det."
STR_INTERCEPT_CHOICE_19_0: "Hør afgørelsen"
STR_INTERCEPT_TITLE_20: "KNUST GLAS"
STR_INTERCEPT_TEXT_20: "Ruden giver efter. Kold luft og lyden af ​​en vagts fløjte ankommer sammen. Der er tid til én beslutning, før nogen når døren."
STR_INTERCEPT_CHOICE_20_0: "Løb efter den ydre sti"
STR_INTERCEPT_CHOICE_20_1: "Efterlad en kodet ledetråd"
STR_INTERCEPT_CHOICE_20_2: "Bliv og forklar"
STR_INTERCEPT_TITLE_21: "MELLEM HUTTENE"
STR_INTERCEPT_TEXT_21: "Stien er våd. Hoopers hytte er tæt nok til at nå før den næste patrulje, men den åbne grund bagved giver en anden slags chance."
STR_INTERCEPT_CHOICE_21_0: "Prøv at undslippe grunden"
STR_INTERCEPT_CHOICE_21_1: "Gå ind i Hoopers hytte"
STR_INTERCEPT_CHOICE_21_2: "Vend tilbage til Harris"
STR_INTERCEPT_TITLE_22: "ET PRIVAT SPIL"
STR_INTERCEPT_TEXT_22: "Hooper studerer dig. På bordet sætter han en imaginær skakstilling ud med fingrene. Et kodet svar kunne få ham til at afsløre, hvad en direkte anklage aldrig ville."
STR_INTERCEPT_CHOICE_22_0: "Svar med et skakspor"
STR_INTERCEPT_CHOICE_22_1: "Truer med at navngive ham"
STR_INTERCEPT_CHOICE_22_2: "Tal ærligt"
STR_INTERCEPT_TITLE_23: "ANSIGT TIL ANSIGT"
STR_INTERCEPT_TEXT_23: "Hooper spørger, hvad du faktisk kan bevise. Hans selvtillid vakler kun, når du nævner detaljer, som nogen uden for hans plan ikke burde vide."
STR_INTERCEPT_CHOICE_23_0: "Konfronter ham med beviser"
STR_INTERCEPT_CHOICE_23_1: "Tilbyd komponenten som en handel"
STR_INTERCEPT_CHOICE_23_2: "Bluff"
STR_INTERCEPT_TITLE_24: "CUPEN"
STR_INTERCEPT_TEXT_24: "Hooper kommer med vand, men rækker først efter tekoppen. At beholde den kop kan være mere nyttigt end at acceptere alt andet, han tilbyder."
STR_INTERCEPT_CHOICE_24_0: "Behold koppen"
STR_INTERCEPT_CHOICE_24_1: "Tjek din frakke igen"
STR_INTERCEPT_TITLE_25: "NOGET AT TESTE"
STR_INTERCEPT_TEXT_25: "Du beholder koppen og beder Harris om at få den undersøgt. Dette er endelig en påstand med en genstand knyttet til den. Hoopers forsøg på at fjerne det giver en anden nyttig detalje."
STR_INTERCEPT_CHOICE_25_0: "Giv Harris koppen"
STR_INTERCEPT_CHOICE_25_1: "Konfronter Hooper med det"
STR_INTERCEPT_TITLE_26: "DET FORKERTE MÅL"
STR_INTERCEPT_TEXT_26: "Du anklager Harris uden beviser. Han ser en mistænkt forsøge at miskreditere efterforskeren. Uanset hvad der skete med teen, har du gjort det sværere for ham at tro på dig."
STR_INTERCEPT_CHOICE_26_0: "Interviewet slutter"
STR_INTERCEPT_TITLE_27: "HELE KONTOEN"
STR_INTERCEPT_TEXT_27: "Du giver navnene og beskriver mødet. Harris stiller præcise spørgsmål. Din forlegenhed er reel, men det er de detaljer, han nu kan tjekke, også."
STR_INTERCEPT_CHOICE_27_0: "Lad ham bekræfte kontoen"
STR_INTERCEPT_CHOICE_27_1: "Tilbyd at finde Hooper"
STR_INTERCEPT_TITLE_28: "EN FEJLLET BLUFF"
STR_INTERCEPT_TEXT_28: "Harris har hørt nok selvsikre svar. Hooper har også. Ingen af ​​dem giver det faktum, at din historie mangler."
STR_INTERCEPT_CHOICE_28_0: "Fortsæt med påstanden"
STR_INTERCEPT_CHOICE_28_1: "Lav en desperat flugt"
STR_INTERCEPT_CHOICE_28_2: "Indrøm, hvad der virkelig skete"
STR_INTERCEPT_TITLE_29: "AFLYTNING"
STR_INTERCEPT_TEXT_29: "Arket i lommen har mere end rodede bogstaver: dets rute gennem hytterne placerer Hooper i nærheden af maskinen. Et kortfattet fingerpeg kan få den rigtige person til at kigge det rigtige sted."
STR_INTERCEPT_CHOICE_29_0: "Indkode en besked til Hooper"
STR_INTERCEPT_CHOICE_29_1: "Vis ruten til Harris"
STR_INTERCEPT_TITLE_30: "MASKINEN KØRER"
STR_INTERCEPT_TEXT_30: "Harris har komponenten og et spor, der fører ud over dine første bange svar. The Bombe genoptager sit arbejde. Du forlader Hut 14 under dit eget navn, med færre hemmeligheder og en fremtid at stå til ansvar for."
STR_INTERCEPT_TITLE_31: "UNDER MISTINKELSE"
STR_INTERCEPT_TEXT_31: "Returnering af komponenten reddede maskinen fra en forsinkelse. Det reddede ikke din position. Harris afslutter din adgang til hytterne, mens efterforskningen fortsætter. Du overlevede interviewet, men rensede ikke dit navn."
STR_INTERCEPT_TITLE_32: "I FARHED"
STR_INTERCEPT_TEXT_32: "Døren åbner for vagten i stedet for for dig. Modsigelser, manglende beviser og en stjålet komponent er blevet en sag, du ikke længere kan dirigere. Dette forsøg slutter her."
STR_INTERCEPT_TITLE_33: "DEN YDRE VEJ"
STR_INTERCEPT_TEXT_33: "Du efterlader hytterne. Mørket er nyttigt, men grunden er overvåget. En knust rude har bragt patruljerne tættere på, end du håbede."
STR_INTERCEPT_CHOICE_33_0: "Kryds den åbne grund"
STR_INTERCEPT_CHOICE_33_1: "Hold dig til servicestien"
STR_INTERCEPT_CHOICE_33_2: "Vend tilbage og se mod Harris"
STR_INTERCEPT_TITLE_34: "HOOPER'S HUT"
STR_INTERCEPT_TEXT_34: "Skrivebordet er uden opsyn. Papirer ligger under et krydsord, og maskinrummet dukker op i et blyant skema. Fodtrin nærmer sig langs brædderne udenfor."
STR_INTERCEPT_CHOICE_34_0: "Undersøg papirerne"
STR_INTERCEPT_CHOICE_34_1: "Vent på Hooper"
STR_INTERCEPT_CHOICE_34_2: "Tag afsted til Harris"
STR_INTERCEPT_TITLE_35: "ET SKAKPROBLEM"
STR_INTERCEPT_TEXT_35: "Du giver Hooper en position, der afspejler hans knibe: en beskyttet brik, en afsløret konge og et træk, der ser sikkert ud indtil svaret. Han forstår advarslen. Hans næste ord giver den forbindelse, du havde brug for."
STR_INTERCEPT_CHOICE_35_0: "Bed ham om at indrømme planen"
STR_INTERCEPT_CHOICE_35_1: "Send optagelsen til Harris"
STR_INTERCEPT_TITLE_36: "UDEN MASK"
STR_INTERCEPT_TEXT_36: "Du taler om presset i stedet for at lade, som om det aldrig har eksisteret. Hooper svarer kort som person snarere end som modstander. Den åbning kunne bruges til en handel eller en fælde."
STR_INTERCEPT_CHOICE_36_0: "Bed om en ærlig aftale"
STR_INTERCEPT_CHOICE_36_1: "Bed ham om at tilstå"
STR_INTERCEPT_CHOICE_36_2: "Tag kontoen til Harris"
STR_INTERCEPT_TITLE_37: "HOOPER'S ADGANG"
STR_INTERCEPT_TEXT_37: "Hooper forklarer nok til at forbinde afpresningen til den manglende komponent. Harris kan nu gendanne udstyret og tjekke historien. Du skal beslutte, om du vil afslutte efterforskningen eller lade Hooper forsvinde."
STR_INTERCEPT_CHOICE_37_0: "Medbring Harris optagelsen"
STR_INTERCEPT_CHOICE_37_1: "Lad Hooper gå og gå"
STR_INTERCEPT_TITLE_38: "HANDELEN"
STR_INTERCEPT_TEXT_38: "Du placerer dit sidste stykke løftestang inden for Hoopers rækkevidde. En handel uden vidne eller beviser er en opfordring til ham om at løse sit problem for din regning."
STR_INTERCEPT_CHOICE_38_0: "Overdrag komponenten"
STR_INTERCEPT_CHOICE_38_1: "Kræv en bevidnet aftale"
STR_INTERCEPT_CHOICE_38_2: "Træk tilbuddet tilbage"
STR_INTERCEPT_TITLE_39: "HARRIS LYTTER"
STR_INTERCEPT_TEXT_39: "Detaljerne kan kontrolleres. Harris spørger, hvor komponenten er nu. At rydde din konto og få maskinen til at køre er relaterede problemer, men de er ikke det samme."
STR_INTERCEPT_CHOICE_39_0: "Returner, hvad der er i din frakke"
STR_INTERCEPT_CHOICE_39_1: "Hjælp med at gendanne komponenten"
STR_INTERCEPT_CHOICE_39_2: "Stop med at svare nu"
STR_INTERCEPT_TITLE_40: "UDOVER HÆGNET"
STR_INTERCEPT_TEXT_40: "Hytterne forsvinder bag dig, frihed uden for grunden er ikke det samme som uskyld, og maskinen er nu en andens presserende problem. Du undslap, historien forbliver uafsluttet."
STR_INTERCEPT_TITLE_41: "DEN SIDSTE FEJL"
STR_INTERCEPT_TEXT_41: "Patruljen når dig, før den åbne jord slutter, eller Hoopers løfte kollapser, når det ikke længere er nyttigt for ham. Du er løbet tør for sikre træk. Historien kan prøves igen fra begyndelsen."
STR_INTERCEPT_TITLE_42: "PAPIRENE"
STR_INTERCEPT_TEXT_42: "Tidsplanen placerer Hooper, hvor din historie sagde, at han var. Ved siden af ​​den er sedlen, der først trak dig i fælden. Kombinationen er specifik nok til at Harris kan bekræfte."
STR_INTERCEPT_CHOICE_42_0: "Tag papirerne med til Harris"
STR_INTERCEPT_CHOICE_42_1: "Vent og konfronter Hooper"
STR_INTERCEPT_TITLE_43: "EN SIDSTE ARrangement"
STR_INTERCEPT_TEXT_43: "Hooper tilbyder at sætte delen tilbage. At stole på ham ville fjerne et øjeblikkeligt problem; at gøre Harris til et vidne ville gøre det sværere at skabe et andet."
STR_INTERCEPT_CHOICE_43_0: "Arranger en bevidnet tilbagevenden"
STR_INTERCEPT_CHOICE_43_1: "Bring Harris ind i planen"
STR_INTERCEPT_TITLE_44: "GENOPRETTELSE AF SPOLEN"
STR_INTERCEPT_TEXT_44: "Med kontoen registreret vender søgningen tilbage til den manglende hardware. Harris tjekker maskinrummet, mens du identificerer, hvor komponenten skal være."
STR_INTERCEPT_CHOICE_44_0: "Afslut den verificerede returnering"
STR_INTERCEPT_CHOICE_44_1: "Hent det fra din frakke"
STR_INTERCEPT_CHOICE_44_2: "Advar Harris om Hooper"
STR_INTERCEPT_TITLE_45: "DET ENDELIG SPØRGSMÅL"
STR_INTERCEPT_TEXT_45: "Harris venter. Hvis du kan forbinde Hooper med tyveriet, er der stadig en måde at gendanne komponenten og afslutte dette korrekt. Ellers har undersøgelsen kun din skiftende konto."
STR_INTERCEPT_CHOICE_45_0: "Præsenter beviserne"
STR_INTERCEPT_CHOICE_45_1: "Indrøm, at du ikke har mere"
