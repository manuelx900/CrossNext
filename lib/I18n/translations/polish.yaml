STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Po pokonaniu Króla Zapomnienia wracasz do domu. Jego armia nie może już niszczyć książek, a ludzie znów mogą czytać w spokoju. Uratowałeś historie świata. Jest jeszcze wiele książek do odkrycia."
