STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_0: "Pomóż mi porównać strony, które przynosimy do domu. Imię na marginesie może nam powiedzieć, do której rodziny należy dane wspomnienie."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "Przeczytaj relacje, które sąsiedzi przynieśli na plac. Musimy umieścić każde imię obok życia, do którego należy."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "Pomóż mi porównać historie marynarzy, nie mogę wysłać kolejnego statku do kanału, którego już nie pamiętamy."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "Pomóż mi przeczytać uratowane tomy. Kiedy opuszczą te pokoje, chcę, żeby ktoś wiedział, czyje historie niosą."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "Pomóż mi porównać historie ze schronów. Następny podróżnik powinien znaleźć ścieżkę, a nie kolejne mylące echo."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "Pomóż nam porównać stare podróże. Dobrze zapamiętana może zadecydować o przybyciu lub zniknięciu w piasku."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "Pomóż mi wysłuchać relacji sąsiadów. Zegar nie może mi powiedzieć, co miał nadzieję zrobić z tym dniem."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "Pomóż nam przeczytać historie napływające z uwolnionych regionów. Pałac spędził wystarczająco dużo lat, rozmawiając tylko sam ze sobą."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Pomóż mi uporządkować historie ogrodników, te nasiona potrzebują czegoś więcej niż nazwy na opakowaniu."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Pomóż nam utrzymać te historie w obiegu. Chcę, żeby ludzie, których znaleźliśmy, mogli się nawzajem słyszeć."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Pomóż nam odczytać relacje dochodzące do ostatniej drogi. Każdy należy do kogoś czekającego za murami króla."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Pomóż nam przeczytać te historie w całości, ponieważ po tak długiej przerwie ich właściciele zasługują na więcej niż tylko nazwisko na liście."
STR_QUEST_CAM_JOURNEY_THANKS_0: "Liora wygładza stronę dłonią. „Znowu słyszę tę kwestię” – mówi. Dziś wieczorem zostawi otwartą książkę obok lampy."
STR_QUEST_CAM_JOURNEY_THANKS_1: "Na stoisku ktoś przesuwa krzesło, żeby zrobić miejsce dla Ciebie. Niedokończona historia zyskała kolejną linię; jej właściciel zabiera stronę do domu w obu rękach."
STR_QUEST_CAM_JOURNEY_THANKS_2: "Mara składa nową, czytelną stronę i kładzie ją obok księgi pływów. Zanim wróci do okna, dziękuje ci głosem zachrypniętym przez słone powietrze."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Iri kładzie pasek suchego materiału pomiędzy dwiema kartkami. – Ten może teraz podróżować. Przytrzymuje tom przy piersi, po czym przenosi go do innych książek."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Taren kładzie swój plecak na kamieniu i słucha, kiedy skończysz. Następnie powtarza słowa podróżnika, tym razem bez patrzenia na stronę."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Nadir przeciąga w palcach wstążkę, czytając imię, które wcześniej było trudne do odczytania. On przygotowuje dla ciebie miejsce przy ogniu."
STR_QUEST_CAM_JOURNEY_THANKS_6: "Orin odkłada w palcach narzędzie, które obracał. Przez chwilę mówi o osobie na koncie, a zegar tyka bezgłośnie."
STR_QUEST_CAM_JOURNEY_THANKS_7: "Sera odsuwa historię od stosu królewskich rozkazów, prosi o kolejne krzesło, a potem słucha z tobą ostatnich wersów."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Aster zaznacza stronę czystą kartką. Ona ci dziękuje po cichu; nieco później słyszysz, jak czyta ten sam fragment obok fontanny."
STR_QUEST_CAM_JOURNEY_THANKS_9: "Krótka notatka pojawia się wraz z kolejnym pakietem stron. Liora skopiowała fragment, który pomogłeś przywrócić; na marginesie napisała: „Czytamy to razem w domu”."
STR_QUEST_CAM_JOURNEY_THANKS_10: "Notatka ma tylko kilka linijek. Liora zostawiła miejsce na odpowiedź, jakby już widziała Cię siedzącego na drugim końcu stołu."
STR_QUEST_CAM_JOURNEY_THANKS_11: "Wśród odzyskanych stron znajdziesz złożoną notatkę z domu. Jej ostatnie zdanie jest proste: „Tutaj jest jeszcze miejsce dla Ciebie”."
