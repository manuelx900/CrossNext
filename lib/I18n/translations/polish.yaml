STR_INTERCEPT_TITLE_0: "Domek 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942 r. - Trzymają cię za zamkniętymi drzwiami. Zniknął element z maszyny obliczeniowej. Rano przechwytujesz wędliny w kieszeni płaszcza."
STR_INTERCEPT_CHOICE_0_0: "Pomyśl przez oskarżenie"
STR_INTERCEPT_CHOICE_0_1: "Czekaj na rozmówcę"
STR_INTERCEPT_CHOICE_0_2: "Znajdź swoją kurtkę"
STR_INTERCEPT_TITLE_1: "Oskarżenia"
STR_INTERCEPT_TEXT_1: "Podejrzewają zdradę. Rozwiązujesz figury, krzyżówki i pozycje szachowe na życie. Ten pokój jest kolejnym problemem: sprzecz się z samym sobą, a twoja wiarygodność może być pierwszą ofiarą."
STR_INTERCEPT_CHOICE_1_0: "Wybierz strategię"
STR_INTERCEPT_CHOICE_1_1: "Słuchaj tego, co wiesz"
STR_INTERCEPT_TITLE_2: "Harry przyjeżdża"
STR_INTERCEPT_TEXT_2: "Harris wchodzi z filiżanką herbaty i plikiem. Brakuje zbiornika z bomby. Twoje imię było na liście obowiązków."
STR_INTERCEPT_CHOICE_2_0: "Pij herbatę"
STR_INTERCEPT_CHOICE_2_1: "Pozostaw herbatę nie dotkniętą"
STR_INTERCEPT_CHOICE_2_2: "Odpowiedz spokojnie"
STR_INTERCEPT_TITLE_3: "składnik"
STR_INTERCEPT_TEXT_3: "Wewnątrz płaszcza twojego płaszcza twoje palce spotykają zimny metal. Składnik jest nadal tam. Hooper powiedział, że biorąc to spowoduje, że szantaż się zatrzyma."
STR_INTERCEPT_CHOICE_3_0: "Utrzymuj je ukryte"
STR_INTERCEPT_CHOICE_3_1: "Daj to Harrisowi"
STR_INTERCEPT_TITLE_4: "Zwycięska gra"
STR_INTERCEPT_TEXT_4: "Współpraca może zachować Twoją wiarygodność. Przekonujące kłamstwo może kupić czas. Ucieczka zamieniłaby zamknięty pokój na strażników z zewnątrz."
STR_INTERCEPT_CHOICE_4_0: "Współpracuj"
STR_INTERCEPT_CHOICE_4_1: "Stwórz alibi"
STR_INTERCEPT_CHOICE_4_2: "Sprawdź okno"
STR_INTERCEPT_TITLE_5: "herbaty"
STR_INTERCEPT_TEXT_5: "Harris zauważa twoje milczenie, ale jego twarz już się cofa.Kiedy następnym razem otworzysz oczy, przy stole stoi inna para butów."
STR_INTERCEPT_CHOICE_5_0: "Udawaj, że śpisz"
STR_INTERCEPT_CHOICE_5_1: "Porównanie z odwiedzającym"
STR_INTERCEPT_CHOICE_5_2: "Poproś o wodę"
STR_INTERCEPT_TITLE_6: "Mała odmowa"
STR_INTERCEPT_TEXT_6: "Harris przygląda się ruchowi bliżej niż odpowiedzi.Pyta, czy jest ktoś inny, kogo powinien kwestionować."
STR_INTERCEPT_CHOICE_6_0: "Zapytaj, jakie dowody ma"
STR_INTERCEPT_CHOICE_6_1: "Wspomnienie Hooper"
STR_INTERCEPT_CHOICE_6_2: "Spójrz w stronę okna"
STR_INTERCEPT_TITLE_7: "Brakujące prawdziwe"
STR_INTERCEPT_TEXT_7: "Harris chce bezpośredniej odpowiedzi. - Czy wziąłeś ten element? - Możesz powiedzieć mu, co jest w twojej kurtce, wyjaśnić ciśnienie, na które naciskał Hooper, lub spróbować wskazać zarzut gdzie indziej."
STR_INTERCEPT_CHOICE_7_0: "Daj mu składnik"
STR_INTERCEPT_CHOICE_7_1: "Wyjaśnij szantaż"
STR_INTERCEPT_CHOICE_7_2: "Oskarżenie Hooper"
STR_INTERCEPT_TITLE_8: "Metal na stole"
STR_INTERCEPT_TEXT_8: "Harris sprawdza go bez relaksu.Wrócenie skradzionego sprzętu nie wyjaśnia, dlaczego został zabrany.Chce nazwy i czegoś bardziej wiarygodnego niż twoje słowo."
STR_INTERCEPT_CHOICE_8_0: "Oferta na znalezienie dowodów"
STR_INTERCEPT_CHOICE_8_1: "Zostań i odpowiedz na pytania"
STR_INTERCEPT_TITLE_9: "Ale alibi"
STR_INTERCEPT_TEXT_9: "Harris otwiera plik. Strażnik widział cię opuszczając pomieszczenie maszynowe. Twój wymyślony rachunek ma teraz świadka przeciwko niemu."
STR_INTERCEPT_CHOICE_9_0: "Obronić historię"
STR_INTERCEPT_CHOICE_9_1: "Przyznanie się do szantażu"
STR_INTERCEPT_CHOICE_9_2: "Odmówić dalszych pytań"
STR_INTERCEPT_TITLE_10: "Okno"
STR_INTERCEPT_TEXT_10: "Okno jest wysokie, a szkło grube.Daleko od niego droga prowadzi przez inną chatę.Złamanie byłoby głośne; czekanie tutaj ma swoje niebezpieczeństwa."
STR_INTERCEPT_CHOICE_10_0: "Złamać szklankę"
STR_INTERCEPT_CHOICE_10_1: "Studiuj drogę na zewnątrz"
STR_INTERCEPT_CHOICE_10_2: "Wróć do wywiadu"
STR_INTERCEPT_TITLE_11: "Kolejny gość"
STR_INTERCEPT_TEXT_11: "Hooper przyszedł, gdy jesteś niestabilny. Chce wiedzieć, czy Harris ma komponent."
STR_INTERCEPT_CHOICE_11_0: "Udawaj, że śpisz"
STR_INTERCEPT_CHOICE_11_1: "Wymaga wyjaśnień"
STR_INTERCEPT_CHOICE_11_2: "Poproś o wodę"
STR_INTERCEPT_TITLE_12: "Ostrzeżenie"
STR_INTERCEPT_TEXT_12: "Zadzwoń do Harrisa, zanim herbata się zatrzyma.On wraca, zdenerwowany.Oskarżenie o kubek będzie potrzebowało czegoś, co może przetestować."
STR_INTERCEPT_CHOICE_12_0: "Puchar jako dowód"
STR_INTERCEPT_CHOICE_12_1: "Oskarżaj Harrisa o zatrucie"
STR_INTERCEPT_CHOICE_12_2: "Koncentruj się na real"
STR_INTERCEPT_TITLE_13: "Hopera"
STR_INTERCEPT_TEXT_13: "Harris rozpoznaje nazwisko.Hooper jest przydatny, dobrze połączony i również nie brakuje z wczorajszej nocy."
STR_INTERCEPT_CHOICE_13_0: "Znajdź coś sprawdzalnego"
STR_INTERCEPT_CHOICE_13_1: "Hooper go ukradł"
STR_INTERCEPT_TITLE_14: "Blackmail"
STR_INTERCEPT_TEXT_14: "Opisujesz młodego człowieka, zdradzoną pewność siebie i żądanie, które towarzyszyło. Harris słucha bez pomocy."
STR_INTERCEPT_CHOICE_14_0: "Daj Harris pełny rachunek"
STR_INTERCEPT_CHOICE_14_1: "Zostaw nazwiska"
STR_INTERCEPT_CHOICE_14_2: "Znajdź sposób na złapanie Hooper"
STR_INTERCEPT_TITLE_15: "Łatwe oskarżenie"
STR_INTERCEPT_TEXT_15: "Harris pyta, skąd wiesz. – Istnieje różnica między rozwiązaniem problemu a wyprodukowaniem świadka, który może udowodnić odpowiedź."
STR_INTERCEPT_CHOICE_15_0: "Niech Harris zakwestionować roszczenie"
STR_INTERCEPT_CHOICE_15_1: "Wyślij prywatną wiadomość do Hooper"
STR_INTERCEPT_TITLE_16: "Testowanie kluczy"
STR_INTERCEPT_TEXT_16: "Opowieść może zostać zaprzeczona. dokument, świadek lub brakujący element jest trudniejszy do wyjaśnienia."
STR_INTERCEPT_CHOICE_16_0: "Sprawdź pobliską chatkę"
STR_INTERCEPT_CHOICE_16_1: "Użyj porannego intercepta"
STR_INTERCEPT_CHOICE_16_2: "Pytanie Hooper bezpośrednio"
STR_INTERCEPT_TITLE_17: "Więcej niż powrót"
STR_INTERCEPT_TEXT_17: "Maszyna może ponownie działać, ale Harris nadal ma naruszenie bezpieczeństwa do wyjaśnienia."
STR_INTERCEPT_CHOICE_17_0: "Pokaż dowody"
STR_INTERCEPT_CHOICE_17_1: "Szukaj dowodów"
STR_INTERCEPT_CHOICE_17_2: "Zaakceptuj jego wyrok"
STR_INTERCEPT_TITLE_18: "O sprzeczności"
STR_INTERCEPT_TEXT_18: "Harris stawia swoją pierwszą odpowiedź obok ostatniej. Nie mogą one być prawdą. Możesz porzucić kłamstwo lub pozwolić, aby wywiad zakończył się sprzecznością."
STR_INTERCEPT_CHOICE_18_0: "Powiedz prawdę o szantażu"
STR_INTERCEPT_CHOICE_18_1: "Ciągle zaprzecza wszystko"
STR_INTERCEPT_CHOICE_18_2: "Spróbuj odejść"
STR_INTERCEPT_TITLE_19: "cisza"
STR_INTERCEPT_TEXT_19: "Harris zamyka plik.W tym pokoju milczenie nie kończy śledztwa; kończy tylko twoją rolę w kierowaniu nim."
STR_INTERCEPT_CHOICE_19_0: "Posłuchaj decyzji"
STR_INTERCEPT_TITLE_20: "Złamane szkło"
STR_INTERCEPT_TEXT_20: "Chłodne powietrze i dźwięk szeptania strażnika docierają razem."
STR_INTERCEPT_CHOICE_20_0: "Bieganie po zewnętrznej ścieżce"
STR_INTERCEPT_CHOICE_20_1: "Zostaw kodowany clue"
STR_INTERCEPT_CHOICE_20_2: "Zostań i wyjaśnij"
STR_INTERCEPT_TITLE_21: "Między namiotami"
STR_INTERCEPT_TEXT_21: "Hooper's hut jest wystarczająco blisko, aby dotrzeć przed następną patrolą, ale otwarte tereny poza nim oferują inny rodzaj szans."
STR_INTERCEPT_CHOICE_21_0: "Spróbuj uciec od przyczyn"
STR_INTERCEPT_CHOICE_21_1: "Wejdź do domku Hooper"
STR_INTERCEPT_CHOICE_21_2: "Wróć do Harris"
STR_INTERCEPT_TITLE_22: "Prywatna gra"
STR_INTERCEPT_TEXT_22: "Hooper bada cię.Na stole wyznacza sobie wyimaginowaną pozycję szachową palcami.Kodowana odpowiedź może sprawić, że ujawni to, czego bezpośrednie oskarżenie nigdy nie zrobi."
STR_INTERCEPT_CHOICE_22_0: "Odpowiedź z szachowym clue"
STR_INTERCEPT_CHOICE_22_1: "Groził, że go nazwie"
STR_INTERCEPT_CHOICE_22_2: "Mów szczerze"
STR_INTERCEPT_TITLE_23: "twarzą w twarz"
STR_INTERCEPT_TEXT_23: "Hooper pyta, co możesz faktycznie udowodnić.Jego zaufanie zanika tylko wtedy, gdy wymienisz szczegóły, których ktoś spoza jego planu nie powinien wiedzieć."
STR_INTERCEPT_CHOICE_23_0: "Porównaj go z dowodami"
STR_INTERCEPT_CHOICE_23_1: "Oferuj składnik jako handel"
STR_INTERCEPT_CHOICE_23_2: "Bluffowanie"
STR_INTERCEPT_TITLE_24: "Puchar"
STR_INTERCEPT_TEXT_24: "Hooper przynosi wodę, ale najpierw dostaje filiżankę herbaty.Utrzymanie tej filiżanki może być bardziej przydatne niż akceptacja czegokolwiek innego, co oferuje."
STR_INTERCEPT_CHOICE_24_0: "Utrzymuj puchar"
STR_INTERCEPT_CHOICE_24_1: "Sprawdź swoją kurtkę ponownie"
STR_INTERCEPT_TITLE_25: "Coś na test"
STR_INTERCEPT_TEXT_25: "Trzymasz filiżankę i prosisz Harrisa, aby ją zbadał.To jest ostatecznie zarzut z obiektem dołączonym do niego."
STR_INTERCEPT_CHOICE_25_0: "Daj Harrisowi puchar"
STR_INTERCEPT_CHOICE_25_1: "Konfrontuj Hooper z nim"
STR_INTERCEPT_TITLE_26: "Niewłaściwy cel"
STR_INTERCEPT_TEXT_26: "Oskarżasz Harrisa bez dowodów.Widzi podejrzanego, który próbuje zdyskredytować śledczego.Cokolwiek się stało z herbatą, utrudniłeś mu uwierzyć w ciebie."
STR_INTERCEPT_CHOICE_26_0: "Wywiad się kończy"
STR_INTERCEPT_TITLE_27: "Cały rachunek"
STR_INTERCEPT_TEXT_27: "Podajesz imiona i opiszesz spotkanie. Harris zadaje precyzyjne pytania. Twój wstyd jest prawdziwy, ale tak samo są szczegóły, które może teraz sprawdzić."
STR_INTERCEPT_CHOICE_27_0: "Pozwól mu sprawdzić konto"
STR_INTERCEPT_CHOICE_27_1: "Oferta na znalezienie Hooper"
STR_INTERCEPT_TITLE_28: "Nieudany oszust"
STR_INTERCEPT_TEXT_28: "Harris usłyszał wystarczająco pewne odpowiedzi. Hooper też."
STR_INTERCEPT_CHOICE_28_0: "Trzymaj się roszczenia"
STR_INTERCEPT_CHOICE_28_1: "Zrób beznadziejną ucieczkę"
STR_INTERCEPT_CHOICE_28_2: "Przyznaj to, co naprawdę się stało"
STR_INTERCEPT_TITLE_29: "Intercepcja"
STR_INTERCEPT_TEXT_29: "Arkusz w kieszeni niesie więcej niż skręcone litery: jego ścieżka przez domki umieszcza Hooper w pobliżu maszyny."
STR_INTERCEPT_CHOICE_29_0: "Zakoduj wiadomość dla Hoopera"
STR_INTERCEPT_CHOICE_29_1: "Pokaż trasę do Harris"
STR_INTERCEPT_TITLE_30: "Maszyna biegnie"
STR_INTERCEPT_TEXT_30: "Harris ma komponent i ścieżkę, która prowadzi poza twoje pierwsze przerażone odpowiedzi. Bomba wznowi swoją pracę. opuszczasz Hut 14 pod własnym nazwiskiem, z mniej tajemnicami i przyszłością, na którą jeszcze trzeba odpowiedzieć."
STR_INTERCEPT_TITLE_31: "Pod podejrzeniem"
STR_INTERCEPT_TEXT_31: "Zwrot komponentu uratował maszynę przed opóźnieniem. Nie zaoszczędził Twojej pozycji. Harris kończy dostęp do chaty, podczas gdy śledztwo trwa."
STR_INTERCEPT_TITLE_32: "w opiece"
STR_INTERCEPT_TEXT_32: "Brama otwiera się dla strażnika, a nie dla ciebie.Przeciwności, brakujące dowody i skradziony element stały się sprawą, której nie możesz już kierować."
STR_INTERCEPT_TITLE_33: "OSTATNIA DROGA"
STR_INTERCEPT_TEXT_33: "Zostawiasz za sobą chaty. ciemność jest przydatna, ale teren jest strzeżony.Złamane okno przybliżyło patrole bliżej niż się spodziewałeś."
STR_INTERCEPT_CHOICE_33_0: "Przejście przez otwarty teren"
STR_INTERCEPT_CHOICE_33_1: "Trzymaj się ścieżki usługowej"
STR_INTERCEPT_CHOICE_33_2: "Odwróć się i oblicze Harris"
STR_INTERCEPT_TITLE_34: "Hut Hopera"
STR_INTERCEPT_TEXT_34: "Biurko jest bez opieki. Papiery leżą pod skrzyżowaniem, a pomieszczenie maszynowe pojawia się w kalendarzu ołówkiem."
STR_INTERCEPT_CHOICE_34_0: "Sprawdź dokumenty"
STR_INTERCEPT_CHOICE_34_1: "Czekaj na Hooper"
STR_INTERCEPT_CHOICE_34_2: "Zostań z Harris"
STR_INTERCEPT_TITLE_35: "Problem szachowy"
STR_INTERCEPT_TEXT_35: "Dajesz Hooperowi pozycję, która odzwierciedla jego sytuację: zabezpieczony kawałek, wystawiony król i ruch, który wygląda bezpiecznie aż do odpowiedzi."
STR_INTERCEPT_CHOICE_35_0: "Poproś go, aby przyjął plan"
STR_INTERCEPT_CHOICE_35_1: "Wyślij zgłoszenie do Harris"
STR_INTERCEPT_TITLE_36: "Bez maski"
STR_INTERCEPT_TEXT_36: "Mówisz o presji zamiast udawać, że nigdy nie istniała. Hooper krótko odpowiada jako osoba, a nie jako przeciwnik."
STR_INTERCEPT_CHOICE_36_0: "Poproś o uczciwą umowę"
STR_INTERCEPT_CHOICE_36_1: "Poproś go o spowiedź"
STR_INTERCEPT_CHOICE_36_2: "Zrób rachunek Harrisowi"
STR_INTERCEPT_TITLE_37: "Przyznanie Hoopera"
STR_INTERCEPT_TEXT_37: "Harris może teraz odzyskać sprzęt i sprawdzić historię. Musisz zdecydować, czy zakończyć śledztwo, czy pozwolić Hooperowi zniknąć."
STR_INTERCEPT_CHOICE_37_0: "Daj Harris przyznanie"
STR_INTERCEPT_CHOICE_37_1: "Niech Hooper idzie i odchodzi"
STR_INTERCEPT_TITLE_38: "handlu"
STR_INTERCEPT_TEXT_38: "Umowa bez świadków lub dowodów jest zaproszeniem dla niego, aby rozwiązać swój problem na twój koszt."
STR_INTERCEPT_CHOICE_38_0: "Ręka nad elementem"
STR_INTERCEPT_CHOICE_38_1: "Wymagane jest świadectwo porozumienia"
STR_INTERCEPT_CHOICE_38_2: "Wycofać ofertę"
STR_INTERCEPT_TITLE_39: "Harry słyszy"
STR_INTERCEPT_TEXT_39: "Szczegóły można sprawdzić. Harris pyta, gdzie teraz znajduje się komponent. Wyczyścić konto i uruchomić maszynę są powiązane problemy, ale nie są to te same."
STR_INTERCEPT_CHOICE_39_0: "Zwróć to, co jest w twoim płaszczu"
STR_INTERCEPT_CHOICE_39_1: "Pomóż odzyskać składnik"
STR_INTERCEPT_CHOICE_39_2: "Przestań odpowiadać teraz"
STR_INTERCEPT_TITLE_40: "Poza ogrodem"
STR_INTERCEPT_TEXT_40: "Wolność poza terenem nie jest tym samym co niewinność, a maszyna jest teraz kogoś innego pilnym problemem."
STR_INTERCEPT_TITLE_41: "Ostatni błąd"
STR_INTERCEPT_TEXT_41: "Patrol dociera do ciebie, zanim otwarta ziemia się skończy, lub obietnica Hoopera upada, gdy nie jest już dla niego przydatna."
STR_INTERCEPT_TITLE_42: "papierów"
STR_INTERCEPT_TEXT_42: "Harmonogram umieszcza Hoopera tam, gdzie twoja historia powiedziała, że jest. Obok niego znajduje się notatka, która po raz pierwszy wciągnęła cię do pułapki."
STR_INTERCEPT_CHOICE_42_0: "Wziąć dokumenty do Harris"
STR_INTERCEPT_CHOICE_42_1: "Czekaj i zmierź się z Hooperem"
STR_INTERCEPT_TITLE_43: "Jedna ostatnia umowa"
STR_INTERCEPT_TEXT_43: "Zaufanie do niego usunęłoby jeden bezpośredni problem; uczynienie Harrisa świadkiem utrudniałoby stworzenie innego."
STR_INTERCEPT_CHOICE_43_0: "Zorganizuj świadectwo powrotu"
STR_INTERCEPT_CHOICE_43_1: "Wprowadź Harrisa do planu"
STR_INTERCEPT_TITLE_44: "Odzyskanie prawdziwego"
STR_INTERCEPT_TEXT_44: "Po zapisaniu konta, wyszukiwanie powraca do brakującego sprzętu. Harris sprawdza pomieszczenie maszynowe, podczas gdy identyfikujesz miejsce, w którym powinien znajdować się komponent."
STR_INTERCEPT_CHOICE_44_0: "Zakończenie zweryfikowanego zwrotu"
STR_INTERCEPT_CHOICE_44_1: "Wyciągnij go z kurtki"
STR_INTERCEPT_CHOICE_44_2: "Harris ostrzega przed Hooperem"
STR_INTERCEPT_TITLE_45: "Ostatnie pytanie"
STR_INTERCEPT_TEXT_45: "Harris czeka.Jeśli możesz podłączyć Hooper do kradzieży, nadal istnieje sposób na odzyskanie komponentu i prawidłowe zakończenie tego procesu."
STR_INTERCEPT_CHOICE_45_0: "Przedstawiamy dowody"
STR_INTERCEPT_CHOICE_45_1: "Przyznaj, że nie masz nic więcej"
