STR_QUEST_CAM_JOURNEY_DAILYREQUEST_0: "Przeczytajcie razem ze mną tę relację, wciąż są rodziny, które szukają własnych słów w wiejskiej księdze."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_1: "Zostań z tymi historiami trochę dłużej, ktoś na rynku może rozpoznać osobę, którą opisują te słowa."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_2: "Przeczytaj ze mną te nazwiska. Chcę, żeby rodzina czekała, kiedy przypłynie następny statek."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_3: "Przeczytaj tę relację, zanim przeniosę ją na wyższą półkę. Muszę wiedzieć, jakich słów jeszcze brakuje."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_4: "Przeczytaj ze mną słowa podróżników. Nie chcę pomylić starego ostrzeżenia z wezwaniem, które należy wykonać."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Przeczytaj te relacje przy ognisku. Zanim wyruszymy w podróż, chcę, żeby każdy usłyszał swoje imię."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_6: "Przeczytaj ze mną tę stronę, zanim zadzwoni dzwonek. Muszę zapamiętać więcej niż tylko godzinę na tarczy."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_7: "Przeczytaj całe zeznanie. Są tu ludzie, którzy zbyt długo czekali, aby ich wysłuchano."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Przeczytaj to wspomnienie w pobliżu fontanny. Chciałbym usłyszeć, co osoba, która tu zasadziła, chciała zostawić po sobie."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Przeczytaj historie, które ci przesłaliśmy, głosy z domu mogą ci towarzyszyć, nawet tak daleko."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Przeczytaj ten list przed wyruszeniem w podróż. Nie musisz nosić każdego wspomnienia osobno."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_11: "Przeczytaj słowa, które dla Ciebie zachowaliśmy. Twierdza to nie cały świat, niezależnie od tego, jak cicho jest."
