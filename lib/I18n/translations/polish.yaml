STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Początek przygody"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Przez wiele lat ludzie żyli w pokoju i cieszyli się książkami. Wtedy Król Zapomnienia zaczął ich niszczyć. Chciał powstrzymać wszystkich od czytania i sprawić, by wszystkie historie zniknęły na zawsze."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Potwory króla"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Król Zapomnienia wysłał swoje potwory na cały świat. Zniszczyli każdą znalezioną książkę i zaatakowali każdego, kto próbował ich powstrzymać. Biblioteki zaczęły znikać, a ludzie przestali czytać."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Moc czytania"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Pewnego dnia, gdy czytasz w pobliżu swojej wioski, pojawia się potwór. Próbujesz uciec, ale dzieje się coś zaskakującego: im więcej czytasz, tym staje się słabszy. Zdajesz sobie sprawę, że czytanie to jedyny sposób na walkę z magią króla."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Twoja misja"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Postanowiłeś powstrzymać króla. W drodze do jego zamku musisz przemierzać lasy, miasta, góry i inne miejsca pełne wrogów. Każdy pokonany potwór przybliża Cię nieco. Czytaj dalej, pokonaj jego strażników i dotrzyj do niego, zanim zniszczy wszystkie książki na świecie."
