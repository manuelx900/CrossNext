STR_CAR_INTRO: "Wina i uczciwość są niezależne. Każdy przypadek ma dokładnie jedno rozwiązanie. Wysokości są fikcyjnymi cechami charakteru."
STR_CAR_HELP_TEXT: "Jak rozwiązać sprawę\nKażda postać składa jedno stwierdzenie. Na górze ekranu znajduje się dokładna liczba winnych i fałszywych oświadczeń. Znajdź kombinację, która spełnia oba liczenia. Każdy przypadek ma jedno rozwiązanie.\n  \nWina nie jest uczciwością\nNiewinna postać może kłamać, a winowajca może powiedzieć prawdę. Dwa kłamstwa oznaczają, że dokładnie dwa całe stwierdzenia są fałszywe; pozostałe są prawdziwe. Znaki Prawda / Kłamstwo odnoszą się do stwierdzenia; Podejrzany odnosi się do winy.\n  \nReading the clues\n\"A lub B zrobił to (lub oboje)\" oznacza, że przynajmniej jedna z nazwanych postaci jest winna. \"A i B zrobili to\" wymaga obu. Kłamstwo neguje całe stwierdzenie: fałszywe OR oznacza, że żaden z nich nie zrobił tego; fałszywe AND oznacza, że przynajmniej jeden z nich tego nie zrobił.\n  \n\"Oboje są prawdomówni lub oboje kłamią\" porównuje stwierdzenia, nie winę. \"Dokładnie jeden kłamie\" oznacza, że ich stwierdzenia mają różne wartości prawdy. Te wskazówki mogą być prawdziwe lub fałszywe.\n  \nSąsiedzi na małym ekranie\nOryginalny okrągły porządek to Panther, Peacock, Shark, Fox, Bear, Stag, Horse, używając tylko znaków tego przypadku. Ostatni i pierwszy są sąsiadami. Ta aplikacja pisze dwie nazwy bezpośrednio w każdej wskazówce sąsiada. Nigdy nie musisz zgadywać, które karty są obok portretu. Zmiana strony lub orientacji nie zmienia wskazówki.\n  \nWzrost i dieta\nKażda karta przedstawia fikcyjny wzrost i dietę. \"Sprawca jest wyższy ode mnie\" oznacza, że przynajmniej jeden sprawca jest wyższy niż mówca, niekoniecznie wszyscy sprawcy. Krótsze działa w ten sam sposób. Wskazówki mięsożerne i roślinożerne oznaczają, że co najmniej jeden sprawca ma taką dietę; wszystkożerne liczą się jako żadne z nich. Nazwy, wzrosty i diety są wiarygodnymi faktami; stwierdzenia mogą kłamać.\n  \nTwoja analiza\nUżyj? / Prawda / Kłamstwo i Podejrzany pod każdym stwierdzeniem, aby zapisać hipotezy. Są to twoje notatki, nie dowody lub automatyczne sprawdzenia. Strzałki pokazują inne znaki. Tryb pionowy wyświetla do trzech na stronie.\n  \nMaking an Accusation\nNaciśnij Accuse i wybierz dokładnie wymaganą liczbę winnych. Tylko potwierdzenie błędnego oskarżenia kosztuje życie. Początkujący i Normalny mają dwa życia; Zaawansowany i Ekspert mają jedno. Prawidłowe oskarżenie rozwiązuje sprawę. Kiedy nie ma już życia, ujawnia się rozwiązanie.\n  \nKampania i powtórka\nIstnieje 1470 spraw. Otwarta sprawa wznawia bieżącą próbę lub otwiera następną po zamkniętej. Kampania pozwala wybrać dowolną z 1470 spraw w dowolnej kolejności od początku. Powtórka rozpoczyna nową próbę, zachowując wcześniejsze ukończenie. W ramach każdego poziomu trudności sprawy przechodzą od jednego winnego do dwóch, a następnie od mniejszej liczby kłamców do większej liczby w każdej grupie winnych. Początkujący zachowuje jednego winnego. Mniejsze rzuty są pierwsze, gdy liczby się pokrywają. Wszystkie sprawy pozostają dostępne. Rozwiązanie wcześniej wyczerpanej sprawy ulepsza ją do rozwiązanej.\n  \nPostępy i życia są zapisywane na karcie SD. Opuszczenie, uśpienie lub ponowne uruchomienie urządzenia nie przywraca życia w bieżącej próbie. Nieudany zapis blokuje wynik, dopóki Retry się powiedzie. Reset all prosi o potwierdzenie przed usunięciem tylko postępów Carnivore."
