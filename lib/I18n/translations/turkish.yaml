STR_CAR_INTRO: "Suçluluk ve dürüstlük bağımsızdır.Her durumda tam olarak bir çözüm vardır. Yükseklikler fiktif karakter özellikleri."
STR_CAR_HELP_TEXT: "Bir dava nasıl çözülür?\nHer karakter bir açıklama yapar. Ekranın üst kısmında suçlu ve yanlış ifadelerin tam sayıları gösterilir. Her iki sayıyı da karşılayacak bir kombinasyon bul. Her durumda bir çözüm vardır.\n  \nSuçluluk dürüstlük değildir.\nMasum bir karakter yalan söyleyebilir ve suçlu bir karakter doğruyu söyleyebilir. İki yalan tam olarak iki ifadenin yanlış olduğu anlamına gelir; diğerleri doğrudur. Gerçek / Yalan işaretleri ifadeye, şüpheli ise suça atıfta bulunur.\n  \nİpuçları okuyorum.\n\"A veya B yaptı (ya da ikisi de)\" en azından isimlendirilmiş bir karakterin suçlu olduğu anlamına geliyor. \"A ve B yaptı\" ikisini de gerektiriyor. Bir yalan bütün ifadeyi reddediyor: yanlış OR hiçbirinin yapmadığı anlamına geliyor; yanlış AND ise en azından birinin yapmadığı anlamına geliyor.\n  \n\"Her ikisi de doğru ya da her ikisi de yalan söylüyor\" ifadeleri karşılaştırır, suçluluk değil. \"Tam olarak biri yalan söylüyor\" ifadelerinin farklı gerçeklik değerlerine sahip olduğu anlamına gelir. Bu ipuçları kendileri doğru veya yanlış olabilir.\n  \nKüçük ekranda komşu\nOrijinal dairesel sıralama Panther, Peacock, Shark, Fox, Bear, Stag, Horse, sadece bu karakterleri kullanarak. Son ve ilk komşulardır. Bu uygulama iki ismi her komşu ipucu için doğrudan yazıyor. Bir portrenin yanında hangi kartların olduğunu tahmin etmenize gerek yok. Sayfa veya yön değiştirmek bir ipucu değiştirmez.\n  \nBoy ve diyet\nHer kart kurgusal bir boy ve beslenme şekli gösterir. \"Bir suçlu benden daha uzun\" demek, en azından bir suçlu konuşandan daha uzun olduğu anlamına gelir, bütün suçluların olması gerekmez. Kısa olanlar da aynı şekilde çalışır. Etçil ve otçul ipuçları, en azından bir suçlu bu beslenme şekliyle beslendiği anlamına gelir; omnivorlar hiçbiri olarak sayılmaz. İsimler, boy ve beslenme şekli güvenilir gerçeklerdir; ifadeler yalan olabilir.\n  \nANALİZİNİZ\nHipotezleri kaydetmek için her ifadenin altında ? / Gerçek / Yalan ve Şüpheli kullanın. Bunlar kanıt veya otomatik kontrol değil notlarınızdır. Diğer karakterler oklarla gösterilir. Dikey modu sayfa başına üçe kadar gösterir.\n  \nSuçlamada bulunmak .\nSuçlama tuşuna basın ve tam olarak gerekli suçlu sayısını seçin. Yalnızca yanlış bir suçlamayı doğrulamak için bir hayat harcanır. Başlangıç ve Normal'in iki, İleri ve Uzman'ın ise bir yaşamı vardır. Doğru bir suçlama davayı çözer. Geride hayat kalmadığında çözüm ortaya çıkar.\n  \nKampanya ve tekrarlama\n1.470 dava var. Açık dava mevcut girişimi sürdürür ya da kapalı bir girişimden sonra bir sonrakini açar. Kampanya, 1.470 davadan birini başlangıçtan herhangi bir sırayla seçmenize izin verir. Yeniden oynama, daha önce tamamlanmış olanları koruyarak yeni bir girişime başlar. Her zorluk seviyesinde, davalar bir suçludan iki suçluya, sonra her suçlu grubu içinde daha az yalancıdan daha fazlasına ilerler. Başlangıç oyuncusu bir suçlu tutar. Sayılar eşleştiği zaman daha küçük atışlar önce gelir. Tüm davalar kullanılabilir kalır. Önceden tükenmiş bir davayı çözmek onu çözülmüş hale yükseltir.\n  \nİlerleme ve hayat SD kartına kaydedilir. Çıkma, uyku veya cihazın yeniden başlatılması mevcut denemedeki hayatları geri getirmez. Başarısız bir kaydetme, Yeniden Deneme başarılı olana kadar sonucu engeller. Tümünü Geri Yükle sadece Etçil ilerlemesini silmeden önce doğrulama sorar."
