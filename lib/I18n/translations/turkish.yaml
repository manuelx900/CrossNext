STR_INTERCEPT_TITLE_0: "Şehir 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942 - Sizi kilitli bir kapının arkasında bekliyorlar. Hesaplama makinesi parçası ortadan kayboldu. Sabah ceket cebinizde çöpleri engellemek. Dışarıda ayak izleri duruyor."
STR_INTERCEPT_CHOICE_0_0: "Suçlamayı Düşün"
STR_INTERCEPT_CHOICE_0_1: "Röportajı bekleyin"
STR_INTERCEPT_CHOICE_0_2: "Ceketinizi Bulun"
STR_INTERCEPT_TITLE_1: "Suçlama"
STR_INTERCEPT_TEXT_1: "Onlar ihanet şüphesi. Eğer bir yaşam için rakamlar, haç kelimeleri ve satranç pozisyonları çözmek. Bu oda başka bir sorun: kendinize çelişki, ve güvenilirlik ilk kurban olabilir."
STR_INTERCEPT_CHOICE_1_0: "Bir Strateji Seçin"
STR_INTERCEPT_CHOICE_1_1: "bildiklerini duyunca"
STR_INTERCEPT_TITLE_2: "Harry geliyor"
STR_INTERCEPT_TEXT_2: "Harris bir çay kaşığı ve bir dosya ile girer. Bombadan bir tekerlek eksik. Adın görev listesindeydi."
STR_INTERCEPT_CHOICE_2_0: "Çayı iç"
STR_INTERCEPT_CHOICE_2_1: "Çayı dokunmadan bırakın"
STR_INTERCEPT_CHOICE_2_2: "Sakin cevap"
STR_INTERCEPT_TITLE_3: "bileşeni"
STR_INTERCEPT_TEXT_3: "Elbiselerinizin içindeki parmaklarınız soğuk metallerle karşılaşır.Bölüm hala orada.Hooper bunu alarak şantajı durduracağını söyledi.Şimdi kilitli kapının farklı bir anlamı var."
STR_INTERCEPT_CHOICE_3_0: "saklı tutun"
STR_INTERCEPT_CHOICE_3_1: "Haris’e Gönder"
STR_INTERCEPT_TITLE_4: "Kazanan Oyun"
STR_INTERCEPT_TEXT_4: "İşbirliği güvenilirliğinizi koruyabilir. İnanç verici bir yalan zaman satın alabilir. Kaçış dışarıdaki muhafızlar için kilitli bir oda değiştirir. Bu hareketlerden hiçbirini geri alamazsınız."
STR_INTERCEPT_CHOICE_4_0: "işbirliği"
STR_INTERCEPT_CHOICE_4_1: "Alibi bulmak"
STR_INTERCEPT_CHOICE_4_2: "Pencereyi inceleyin"
STR_INTERCEPT_TITLE_5: "Çayı"
STR_INTERCEPT_TEXT_5: "Harris sessizliğinizi fark eder, ama yüzü zaten geri çekiliyor. Bir dahaki sefere gözlerinizi açtığınızda masanın yanında başka bir çift ayakkabı durur."
STR_INTERCEPT_CHOICE_5_0: "uykuya dalmak gibi davranın"
STR_INTERCEPT_CHOICE_5_1: "Ziyaretçi ile karşılaştırın"
STR_INTERCEPT_CHOICE_5_2: "su için sor"
STR_INTERCEPT_TITLE_6: "Küçük bir reddetme"
STR_INTERCEPT_TEXT_6: "Sen fincanı uzaklaştırıyorsun.Harris hareketini cevabından daha yakından izliyor.O soruyor, başka biri var mı diye sormalı."
STR_INTERCEPT_CHOICE_6_0: "Ne kanıtları var diye sor"
STR_INTERCEPT_CHOICE_6_1: "Hooper Hakkında"
STR_INTERCEPT_CHOICE_6_2: "pencereye bakın"
STR_INTERCEPT_TITLE_7: "eksik gerçek"
STR_INTERCEPT_TEXT_7: "Harris doğrudan bir cevap istiyor.Bunları aldığınızda ne olduğunu söyleyebilir, Hooper'in uyguladığı baskıyı açıklayabilir veya suçlamayı başka bir yerde göstermeye çalışabilirsiniz."
STR_INTERCEPT_CHOICE_7_0: "Onu bileşenle"
STR_INTERCEPT_CHOICE_7_1: "Şantajı açıklaması"
STR_INTERCEPT_CHOICE_7_2: "Hooper'ı suçluyor"
STR_INTERCEPT_TITLE_8: "Masa üzerinde metal"
STR_INTERCEPT_TEXT_8: "Harris rahatlamadan kontrol eder. çalınan ekipmanları geri vermek, neden alındığını açıklamaz."
STR_INTERCEPT_CHOICE_8_0: "Kanıt bulmak için teklif"
STR_INTERCEPT_CHOICE_8_1: "Kalın ve soruları yanıtlayın"
STR_INTERCEPT_TITLE_9: "Alibi Hakkında"
STR_INTERCEPT_TEXT_9: "Harris dosyayı açar. bir bekçi sizi makine odasından çıkardığını gördü. icat ettiğiniz hesabınız şimdi buna karşı bir şahit var."
STR_INTERCEPT_CHOICE_9_0: "Hikayeyi savun"
STR_INTERCEPT_CHOICE_9_1: "Şantajı kabul et"
STR_INTERCEPT_CHOICE_9_2: "Başka sorular reddet"
STR_INTERCEPT_TITLE_10: "penceresi"
STR_INTERCEPT_TEXT_10: "Penceresi yüksek ve cam kalın.Ondan öteye, yol başka bir kabine geçiyor.Kırmak gürültülü olurdu; burada beklemek kendi tehlikeleri vardır."
STR_INTERCEPT_CHOICE_10_0: "camı kırmak"
STR_INTERCEPT_CHOICE_10_1: "Dışarıdan yolunuzu inceleyin"
STR_INTERCEPT_CHOICE_10_2: "Röportajına geri dön"
STR_INTERCEPT_TITLE_11: "Diğer Ziyaretçi"
STR_INTERCEPT_TEXT_11: "Hooper, sizin istikrarsız olduğunuz sürece geldi. Harris'in bileşeni olup olmadığını bilmek istiyor. Bir elini kapının yanında tutuyor."
STR_INTERCEPT_CHOICE_11_0: "uyumak gibi davranmak"
STR_INTERCEPT_CHOICE_11_1: "Açıklama istemek"
STR_INTERCEPT_CHOICE_11_2: "su için sor"
STR_INTERCEPT_TITLE_12: "bir uyarı"
STR_INTERCEPT_TEXT_12: "Çayı tutmadan önce Harris'e sesleniyorsun. kızgın bir şekilde geri döner."
STR_INTERCEPT_CHOICE_12_0: "Kupa kanıtı olarak"
STR_INTERCEPT_CHOICE_12_1: "Sizi zehirlediğini iddia ediyorlar"
STR_INTERCEPT_CHOICE_12_2: "Reel’e odaklanın"
STR_INTERCEPT_TITLE_13: "Hooper"
STR_INTERCEPT_TEXT_13: "Harris ismini tanır. Hooper yararlıdır, iyi bağlantılıdır ve dün akşamın listesinden de yok değildir."
STR_INTERCEPT_CHOICE_13_0: "Kontrol edilebilecek bir şey bulun"
STR_INTERCEPT_CHOICE_13_1: "Hooper bunu çaldı"
STR_INTERCEPT_TITLE_14: "Blackmail Hakkında"
STR_INTERCEPT_TEXT_14: "Bir genç adamı, ihanet edilen bir güven ve ardından gelen talepleri tarif ediyorsunuz.Harris size yardım etmeden dinliyor.Kapıyı koyan kişiyi adlandırmak da koruduğunuz kişiyi ortaya çıkarabilir."
STR_INTERCEPT_CHOICE_14_0: "Harris'e Tam Hesap Ver"
STR_INTERCEPT_CHOICE_14_1: "Adları bırakın"
STR_INTERCEPT_CHOICE_14_2: "Hooper'ı yakalamak için bir yol önerin"
STR_INTERCEPT_TITLE_15: "Kolay bir suçlama"
STR_INTERCEPT_TEXT_15: "Hooper, sorumluluk duymak zorundadır.Haris sorar: Bir sorunu çözmek ve cevabı kanıtlayabilen bir şahit üretmek arasında bir fark vardır."
STR_INTERCEPT_CHOICE_15_0: "Harris'in iddiasını reddetmesi"
STR_INTERCEPT_CHOICE_15_1: "Hooper'a özel mesaj gönder"
STR_INTERCEPT_TITLE_16: "Test anahtarı"
STR_INTERCEPT_TEXT_16: "Bir hikaye reddedilebilir. bir belge, tanık veya eksik bileşeni açıklamak daha zordur."
STR_INTERCEPT_CHOICE_16_0: "yakınındaki otele bakın"
STR_INTERCEPT_CHOICE_16_1: "Sabahları intercept kullanın"
STR_INTERCEPT_CHOICE_16_2: "Hooper sorusu doğrudan"
STR_INTERCEPT_TITLE_17: "Geri dönüşten daha fazlası"
STR_INTERCEPT_TEXT_17: "Makine tekrar çalışabilir, ancak Harris hala açıklamak için bir güvenlik ihlali var."
STR_INTERCEPT_CHOICE_17_0: "kanıtları göster"
STR_INTERCEPT_CHOICE_17_1: "kanıt arayın"
STR_INTERCEPT_CHOICE_17_2: "Kararını kabul et"
STR_INTERCEPT_TITLE_18: "Bir çelişki"
STR_INTERCEPT_TEXT_18: "Harris, ilk cevabını en son cevabının yanında koyuyor.İkisi de doğru olamaz.Yalanı bırakabilirsiniz ya da röportajın bir çelişki ile sona ermesine izin verebilirsiniz."
STR_INTERCEPT_CHOICE_18_0: "Şantaj Hakkında Gerçeği Anlat"
STR_INTERCEPT_CHOICE_18_1: "her şeyi inkar etmeye devam"
STR_INTERCEPT_CHOICE_18_2: "Gitmeye çalışın"
STR_INTERCEPT_TITLE_19: "Sessizliği"
STR_INTERCEPT_TEXT_19: "Harris dosyayı kapatır.Bu odada, sessizlik soruşturmayı bitirmez; sadece onu yönlendirmenin sizin rolünüzü bitirir."
STR_INTERCEPT_CHOICE_19_0: "Kararını dinle"
STR_INTERCEPT_TITLE_20: "Kırık cam"
STR_INTERCEPT_TEXT_20: "Soğuk hava ve bir bekçinin şapkasının sesi bir araya gelir."
STR_INTERCEPT_CHOICE_20_0: "Dışarıya doğru koşmak"
STR_INTERCEPT_CHOICE_20_1: "Kodu Kullanacak Kilo Verin"
STR_INTERCEPT_CHOICE_20_2: "Kalıp Açıklayın"
STR_INTERCEPT_TITLE_21: "Şapkalar arasında"
STR_INTERCEPT_TEXT_21: "Hooper'ın kabini, bir sonraki patrolden önce ulaşmak için yeterince yakın, ancak bunun ötesindeki açık toprak farklı bir şansı sunar."
STR_INTERCEPT_CHOICE_21_0: "Nedenlerden kaçmaya çalışın"
STR_INTERCEPT_CHOICE_21_1: "Hooper's Hut'a Git"
STR_INTERCEPT_CHOICE_21_2: "Harris’e geri dön"
STR_INTERCEPT_TITLE_22: "Özel bir oyun"
STR_INTERCEPT_TEXT_22: "Hooper sizi inceliyor. masada parmaklarıyla hayali bir satranç pozisyonunu ortaya koyuyor. kodlanmış bir cevap, doğrudan bir suçlamanın asla yapamayacağı şeyleri ortaya çıkarmasına neden olabilir."
STR_INTERCEPT_CHOICE_22_0: "Cevap: bir satranç çubuğu"
STR_INTERCEPT_CHOICE_22_1: "Adını vermekle tehdit etti"
STR_INTERCEPT_CHOICE_22_2: "Dürüstçe konuşun"
STR_INTERCEPT_TITLE_23: "Yüzüne bakış"
STR_INTERCEPT_TEXT_23: "Hooper, gerçekte neyi kanıtlayabileceğinizi sorar. güvenini sadece planının dışındaki birinin bilmemesi gerektiği detayları anlattığınızda bozulur."
STR_INTERCEPT_CHOICE_23_0: "kanıtlarla karşılaştırın"
STR_INTERCEPT_CHOICE_23_1: "Bir ticaret olarak bileşeni teklif"
STR_INTERCEPT_CHOICE_23_2: "bluff"
STR_INTERCEPT_TITLE_24: "Kupa"
STR_INTERCEPT_TEXT_24: "Hooper su getirir ama ilk çay kaşığına ulaşır. o fincanı tutmak, teklif ettiği her şeyi kabul etmekten daha faydalı olabilir."
STR_INTERCEPT_CHOICE_24_0: "Kupa tutun"
STR_INTERCEPT_CHOICE_24_1: "Ceketinizi tekrar kontrol edin"
STR_INTERCEPT_TITLE_25: "Test etmek için bir şeyler"
STR_INTERCEPT_TEXT_25: "Siz fincanı tutun ve Harris'e incelenmesini isteyin.Bu nihayetinde bir nesneyle ilgili bir iddiadır.Hooper'ın onu çıkarmaya çalışması ikinci bir yararlı ayrıntı sağlar."
STR_INTERCEPT_CHOICE_25_0: "Harris’e Kupa Ver"
STR_INTERCEPT_CHOICE_25_1: "Hooper ile karşılaştırın"
STR_INTERCEPT_TITLE_26: "Yanlış hedef"
STR_INTERCEPT_TEXT_26: "Harris'i kanıt olmadan suçluyorsun. bir şüphelinin soruşturmacıyı şantaj etmeye çalıştığını görürsün. Çayla ne olursa olsun, onun sana inanmamasını zorlaştırdın."
STR_INTERCEPT_CHOICE_26_0: "Röportaj sona erdi"
STR_INTERCEPT_TITLE_27: "Tüm hesap"
STR_INTERCEPT_TEXT_27: "Adları verip toplantıyı tanımlarsınız.Haris doğru sorular sorar.Utançlarınız gerçektir, ama şimdi kontrol edebileceği ayrıntılar da öyle."
STR_INTERCEPT_CHOICE_27_0: "Hesabınızı doğrulayın"
STR_INTERCEPT_CHOICE_27_1: "Hooper'ı bulmak için"
STR_INTERCEPT_TITLE_28: "Başarısız bir aldatmaca"
STR_INTERCEPT_TEXT_28: "Harris yeterince güvenilir cevaplar duymuştur. Hooper da var. Ne de hikayenizin eksik olduğu gerçeği sağlar."
STR_INTERCEPT_CHOICE_28_0: "İtirazda kalır"
STR_INTERCEPT_CHOICE_28_1: "Çaresiz bir kaçış yapın"
STR_INTERCEPT_CHOICE_28_2: "Gerçekten ne olduğunu itiraf et"
STR_INTERCEPT_TITLE_29: "Saldırının"
STR_INTERCEPT_TEXT_29: "Cebinizdeki kağıt, birden fazla harfden daha fazlasını taşıyor: çadırlar boyunca yolculuğu Hooper'i makineye yakın yerleştirir."
STR_INTERCEPT_CHOICE_29_0: "Hooper için bir mesajı şifrele"
STR_INTERCEPT_CHOICE_29_1: "Harris'e giden yol göster"
STR_INTERCEPT_TITLE_30: "Makine çalışıyor"
STR_INTERCEPT_TEXT_30: "Harris, ilk korkunç cevaplarınızın ötesine geçecek bir yolculuğa sahiptir.The Bombe çalışmalarını sürdürür.Hut 14'i kendi adınızla bırakırsınız, daha az sır ve henüz sorulacak bir gelecek var."
STR_INTERCEPT_TITLE_31: "Şüphelendirme altında"
STR_INTERCEPT_TEXT_31: "Parçayı iade ederek makineyi gecikme korudu. Durumu kurtarmadı. Harris, soruşturma devam ederken çadırlara erişiminizi sona erdirir. Röportajı hayatta kaldınız ama adınızı temizlemediniz."
STR_INTERCEPT_TITLE_32: "Custody içinde"
STR_INTERCEPT_TEXT_32: "Anlaşmazlıklar, eksik kanıtlar ve çalınan bir bileşen artık yönlendirebileceğiniz bir durum haline gelmiştir."
STR_INTERCEPT_TITLE_33: "Dış Yolu"
STR_INTERCEPT_TEXT_33: "Karanlıklar faydalıdır, ama topraklar gözlemlenir.Kırık bir pencere, patrolleri umduğunuzdan daha yaklaştırdı."
STR_INTERCEPT_CHOICE_33_0: "Açık Toprağın Çevresinde"
STR_INTERCEPT_CHOICE_33_1: "Servis Yoluna Git"
STR_INTERCEPT_CHOICE_33_2: "Geri dön ve Harris'e yüz"
STR_INTERCEPT_TITLE_34: "Hooper'ın Şapkası"
STR_INTERCEPT_TEXT_34: "Masanın önünde duruyor.Kitaplar bir çerçeve altında ve makine odası kalemli bir programla görünür."
STR_INTERCEPT_CHOICE_34_0: "Kağıtları inceleyin"
STR_INTERCEPT_CHOICE_34_1: "Hooper için bekleyin"
STR_INTERCEPT_CHOICE_34_2: "Harris’i bırakın"
STR_INTERCEPT_TITLE_35: "Satranç Sorunu"
STR_INTERCEPT_TEXT_35: "Hooper'a durumunu yansıtan bir pozisyon veriyorsun: korunmuş bir parça, açık bir kral ve cevap gelene kadar güvende görünen bir hareket."
STR_INTERCEPT_CHOICE_35_0: "Planı kabul etmesini isteyin"
STR_INTERCEPT_CHOICE_35_1: "Harris'e İtiraz Gönder"
STR_INTERCEPT_TITLE_36: "Maske olmadan"
STR_INTERCEPT_TEXT_36: "Hooper kısa bir şekilde bir kişi olarak değil, bir rakip olarak cevap verir."
STR_INTERCEPT_CHOICE_36_0: "Dürüst Bir Anlaşma İsteyin"
STR_INTERCEPT_CHOICE_36_1: "itiraf etmesini isteyin"
STR_INTERCEPT_CHOICE_36_2: "Hesabını Haris'e Ver"
STR_INTERCEPT_TITLE_37: "Hooper’ın İtirafı"
STR_INTERCEPT_TEXT_37: "Hooper, şantajı eksik olan bileşene bağlamak için yeterince açıklıyor.Harris artık ekipmanları geri alabilir ve hikayeyi kontrol edebilir.Araştırmayı bitirmek veya Hooper'ın ortadan kaybolmasına izin vermek için karar vermelisiniz."
STR_INTERCEPT_CHOICE_37_0: "Harris'e itiraf et"
STR_INTERCEPT_CHOICE_37_1: "Hooper git ve git"
STR_INTERCEPT_TITLE_38: "ticaret"
STR_INTERCEPT_TEXT_38: "Hooper'ın elinde olan son çekişini yapıyorsunuz.Bilge veya kanıt olmadan yapılan bir anlaşma, onun sorununu sizin masrafınızla çözmesi için bir davettir."
STR_INTERCEPT_CHOICE_38_0: "Elin üstünde bileşen"
STR_INTERCEPT_CHOICE_38_1: "Görgü Tanıklığı İstiyoruz"
STR_INTERCEPT_CHOICE_38_2: "Teklifini Geri Çek"
STR_INTERCEPT_TITLE_39: "Harry Dinler"
STR_INTERCEPT_TEXT_39: "Detayları kontrol edebilirsiniz. Harris, bileşenin nerede olduğunu sorar. Hesabınızı temizlemek ve makinenizi çalıştırmak ilgili sorunlardır, ancak aynı değildir."
STR_INTERCEPT_CHOICE_39_0: "Ceketinizde olanı geri verin"
STR_INTERCEPT_CHOICE_39_1: "Yedek parçayı kurtarmaya yardımcı olun"
STR_INTERCEPT_CHOICE_39_2: "Cevaplamayı şimdi bırakın"
STR_INTERCEPT_TITLE_40: "Çitlerin ötesinde"
STR_INTERCEPT_TEXT_40: "Sizin arkanızda çadırlar kaybolur.Araçların dışındaki özgürlük masumiyetle aynı değildir ve makine şimdi başkasının acil sorunu."
STR_INTERCEPT_TITLE_41: "Son hata"
STR_INTERCEPT_TEXT_41: "Patrol açık zemin sona ermeden önce size ulaşır, ya da Hooper'ın sözleri artık onun için faydalı olmayınca çöker."
STR_INTERCEPT_TITLE_42: "Kağıtlar"
STR_INTERCEPT_TEXT_42: "Program Hooper'ı hikayenin söylediği yere yerleştirir. Yanında sizi ilk tuzağa çeken not var. Kombinasyon Harris için doğrulamak için yeterince spesifiktir."
STR_INTERCEPT_CHOICE_42_0: "Harris'e Kağıtları Getirin"
STR_INTERCEPT_CHOICE_42_1: "Bekle ve Hooper ile karşılaş"
STR_INTERCEPT_TITLE_43: "Son bir anlaşma"
STR_INTERCEPT_TEXT_43: "Hooper, kendisine güvenerek bir sorunu ortadan kaldıracak; Harris'i tanık yaparak başka bir sorunu daha zorlaştıracaktır."
STR_INTERCEPT_CHOICE_43_0: "Şahitlik Dönüşü"
STR_INTERCEPT_CHOICE_43_1: "Harris’i planlara dahil edin"
STR_INTERCEPT_TITLE_44: "Gerçekleri Geri Almak"
STR_INTERCEPT_TEXT_44: "Hesap kaydedildiğinde, arama eksik donanımlara döner. Harris makine odasını kontrol ederken bileşenin nerede olması gerektiğini belirler."
STR_INTERCEPT_CHOICE_44_0: "Verifiye edilen dönüşü tamamlayın"
STR_INTERCEPT_CHOICE_44_1: "Ceketinizden çıkarın onu"
STR_INTERCEPT_CHOICE_44_2: "Harris Hooper Hakkında"
STR_INTERCEPT_TITLE_45: "Son soru"
STR_INTERCEPT_TEXT_45: "Harris bekler. Hooper'ı hırsızlığa bağlayabiliyorsanız, bileşeni geri kazanmanın ve bunu düzgün bir şekilde bitirmek için hala bir yol vardır. aksi takdirde soruşturma sadece hesabınızı değiştirir."
STR_INTERCEPT_CHOICE_45_0: "kanıtları sunmak"
STR_INTERCEPT_CHOICE_45_1: "İtiraf et artık bir şeyin yok"
