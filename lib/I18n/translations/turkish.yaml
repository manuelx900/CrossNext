STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Maceranın başlangıcı"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "İnsanlar uzun yıllar huzur içinde yaşadılar ve kitaplarından keyif aldılar. Sonra Unutulma Kralı onları yok etmeye başladı. Herkesin okumasını engellemek ve tüm hikayelerin sonsuza kadar yok olmasını istiyordu."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Kralın canavarları"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Unutulma Kralı canavarlarını dünyanın her yerine gönderdi. Buldukları her kitabı yok ettiler ve onları durdurmaya çalışan herkese saldırdılar. Kütüphaneler kaybolmaya başladı ve insanlar okumayı bıraktı."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Okumanın gücü"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Bir gün köyünüzün yakınında kitap okurken bir canavar belirir. Kaçmaya çalışırsın ama şaşırtıcı bir şey olur: Ne kadar çok okursan o kadar zayıflar. Kralın büyüsüne karşı savaşmanın tek yolunun okumak olduğunun farkındasın."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Misyonunuz"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Kralı durdurmak için yola çıktın. Onun kalesine giderken ormanları, şehirleri, dağları ve düşmanlarla dolu diğer yerleri geçmelisiniz. Yendiğiniz her canavar sizi biraz daha yaklaştırıyor. Okumaya devam edin, koruyucularını alt edin ve dünyadaki tüm kitapları yok etmeden ona ulaşın."
