STR_CAR_INTRO: "內疚和誠實是獨立的。每個案例都有一個解決方案。身高是虛構的人物特徵。"
STR_CAR_HELP_TEXT: "如何解決案件\n每個角色做一個陳述。 屏幕的頂部顯示了罪犯和錯誤陳述的確切數量。 找到滿足兩個計數的組合,每個案例都有一個解決方案。\n  \n罪惡不是誠實\n一個無辜的角色可以說謊,一個有罪的人可以說真話。 兩個謊言意味着正好兩個完整的陳述是假的;其他的都是真的。 真相/謊言標記指的是陳述;嫌疑人指的是罪惡。\n  \n閱讀線索\n“A或B做了(或兩者都做了 ) ” 意味着至少有一個被指定的角色是有罪的,而“A和B都做了”則需要兩個角色。 謊言否定整個陳述:假的OR意味着兩者都沒有做過;假的AND意味着至少有一個角色沒有做過。\n  \n“兩人都說實話或者兩人都撒謊”比較的是陳述,而不是罪惡感。 “正好一個人在撒謊”意味着他們的陳述有不同的真值,這些線索本身可以是真或假。\n  \n小屏鄰居\n原始的圓形順序是豹,孔雀,鯊魚,狐狸,熊,鹿,馬,只使用這種情況下的角色。 最後一個和第一個是鄰居。 這款應用程序直接在每個鄰居線索中寫入兩個名字。 你永遠不需要猜測哪張卡片是在肖像旁邊。 改變頁面或方向不會改變線索。\n  \n身高與飲食\n每張卡片都顯示一個虛構的身高和飲食習慣。 \"一個罪犯比我高\"意味着至少有一個罪犯比發言人高,而不一定是所有的罪犯。 較短的卡片效果相同。 肉食動物和草食動物線索意味着至少有一個罪犯有這種飲食習慣;雜食動物兩者都不算。\n  \n你的分析\n使用? / Truth / Lie 和 Suspect 在每個陳述下面記錄假設。 這些是你的筆記,不是證據或自動檢查。 箭頭顯示其他角色。\n  \n指控\n點擊\"指控 \" , 然後選擇所需的罪犯數量。 只有確認錯誤的指控才需要一生命。 初學者和普通玩家有兩個生命;高級玩家和專家玩家有一個生命。\n  \n戰役與重播\n有 1,470 個案件。 打開案件恢復當前嘗試或在關閉後打開下一個案件。 戰役允許您從開始任意順序選擇 1,470 個案件中的任何一個。 重播開始新的嘗試,同時保留之前完成的任務。 在每個難度級別中,案件從一個罪犯到兩個罪犯,然後從每個罪犯組內較少的謊言到更多的謊言。\n  \n進度和生命都保存在SD卡上。 離開、睡眠或重新啓動設備不會恢復當前嘗試的生命。 失敗的保存將阻止結果,直到重試成功。"
