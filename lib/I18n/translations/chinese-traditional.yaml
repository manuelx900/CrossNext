STR_INTERCEPT_TITLE_0: "小屋 14"
STR_INTERCEPT_TEXT_0: "布萊奇利公園，1942 年。他們讓你在鎖著的門後等待。計算機的一個元件消失了。早晨的攔截在你外套口袋裡沙沙作響。外面，腳步聲停了下來。"
STR_INTERCEPT_CHOICE_0_0: "仔細思考指控"
STR_INTERCEPT_CHOICE_0_1: "等待面試官"
STR_INTERCEPT_CHOICE_0_2: "搜查你的外套"
STR_INTERCEPT_TITLE_1: "指控"
STR_INTERCEPT_TEXT_1: "他們懷疑叛國罪。你以解算數、填字遊戲和國際象棋棋局為生。這個房間還有一個問題：自相矛盾，你的信譽可能是第一個受害者。"
STR_INTERCEPT_CHOICE_1_0: "選擇策略"
STR_INTERCEPT_CHOICE_1_1: "聽聽他們所知道的"
STR_INTERCEPT_TITLE_2: "哈里斯抵達"
STR_INTERCEPT_TEXT_2: "哈里斯拿著茶杯和銼刀進來。 Bombe 缺少一個卷軸。你的名字在值班名單上。他把杯子放在你旁邊，問你昨晚在哪裡。"
STR_INTERCEPT_CHOICE_2_0: "喝茶"
STR_INTERCEPT_CHOICE_2_1: "保持茶原樣"
STR_INTERCEPT_CHOICE_2_2: "冷靜回答"
STR_INTERCEPT_TITLE_3: "元件"
STR_INTERCEPT_TEXT_3: "在你外套的襯裡裡，你的手指接觸到冰冷的金屬。該元件仍然存在。胡珀表示，拿走它就能讓勒索行為停止。現在，鎖著的門有了不同的含義。"
STR_INTERCEPT_CHOICE_3_0: "隱藏起來"
STR_INTERCEPT_CHOICE_3_1: "交給哈里斯"
STR_INTERCEPT_TITLE_4: "一場勝利的比賽"
STR_INTERCEPT_TEXT_4: "合作可以維護您的信譽。一個令人信服的謊言可以贏得時間。逃亡者需要用一個上鎖的房間換取外面的守衛。這些舉動都無法收回。"
STR_INTERCEPT_CHOICE_4_0: "合作"
STR_INTERCEPT_CHOICE_4_1: "發明不在場證明"
STR_INTERCEPT_CHOICE_4_2: "檢查視窗"
STR_INTERCEPT_TITLE_5: "茶"
STR_INTERCEPT_TEXT_5: "房間傾斜。哈里斯注意到你的沉默，但他的表情已經消失了。當你再次睜開眼睛時，另一雙鞋站在桌子旁邊。"
STR_INTERCEPT_CHOICE_5_0: "假裝睡著了"
STR_INTERCEPT_CHOICE_5_1: "面對訪客"
STR_INTERCEPT_CHOICE_5_2: "要水"
STR_INTERCEPT_TITLE_6: "小拒絕"
STR_INTERCEPT_TEXT_6: "你把杯子推開。哈里斯更仔細地觀察動作而不是答案。他詢問是否還有其他人他應該詢問。"
STR_INTERCEPT_CHOICE_6_0: "問他有什麼證據"
STR_INTERCEPT_CHOICE_6_1: "提及胡珀"
STR_INTERCEPT_CHOICE_6_2: "看向窗戶"
STR_INTERCEPT_TITLE_7: "丟失的卷軸"
STR_INTERCEPT_TEXT_7: "哈里斯想要一個直接的答案。你拿走了這個元件嗎？你可以告訴他你的外套裡有什麼，解釋胡珀施加的壓力，或者嘗試將指控指向其他地方。"
STR_INTERCEPT_CHOICE_7_0: "把元件給他"
STR_INTERCEPT_CHOICE_7_1: "解釋一下勒索事件"
STR_INTERCEPT_CHOICE_7_2: "指責胡珀"
STR_INTERCEPT_TITLE_8: "桌子上的金屬"
STR_INTERCEPT_TEXT_8: "該元件位於你們之間。哈里斯毫不放鬆地檢查了一下。歸還被盜裝置並不能解釋其被盜的原因。他想要一個名字和比你的話更可靠的東西。"
STR_INTERCEPT_CHOICE_8_0: "主動尋找證據"
STR_INTERCEPT_CHOICE_8_1: "留下來回答問題"
STR_INTERCEPT_TITLE_9: "不在場證明"
STR_INTERCEPT_TEXT_9: "您描述了在辦公桌前度過的一個安靜的夜晚。哈里斯開啟檔案。一名警衛看到你離開機房。你發明的帳戶現在有證人反對它。"
STR_INTERCEPT_CHOICE_9_0: "捍衛故事"
STR_INTERCEPT_CHOICE_9_1: "承認敲詐"
STR_INTERCEPT_CHOICE_9_2: "拒絕進一步提問"
STR_INTERCEPT_TITLE_10: "窗戶"
STR_INTERCEPT_TEXT_10: "窗戶高，玻璃厚。再往前，小路經過另一間小屋。打破它會很響；在這裡等待有其自身的危險。"
STR_INTERCEPT_CHOICE_10_0: "打破玻璃"
STR_INTERCEPT_CHOICE_10_1: "研究外面的路"
STR_INTERCEPT_CHOICE_10_2: "返回採訪"
STR_INTERCEPT_TITLE_11: "另一位訪客"
STR_INTERCEPT_TEXT_11: "當你站不穩的時候，胡珀來了。他想知道哈里斯是否擁有該元件。他一隻手靠近門。"
STR_INTERCEPT_CHOICE_11_0: "假裝睡覺"
STR_INTERCEPT_CHOICE_11_1: "要求解釋"
STR_INTERCEPT_CHOICE_11_2: "要水"
STR_INTERCEPT_TITLE_12: "警告"
STR_INTERCEPT_TEXT_12: "在喝茶之前你叫來了哈里斯。他回來了，很生氣。關於杯子的指控需要他可以測試的東西。"
STR_INTERCEPT_CHOICE_12_0: "保留杯子作為證據"
STR_INTERCEPT_CHOICE_12_1: "指控哈里斯毒害你"
STR_INTERCEPT_CHOICE_12_2: "專注於卷軸"
STR_INTERCEPT_TITLE_13: "胡珀"
STR_INTERCEPT_TEXT_13: "哈里斯認得這個名字。胡珀很有用，人脈廣泛，並且在昨晚的名單中也沒有缺席。認可不是證據。"
STR_INTERCEPT_CHOICE_13_0: "找到可驗證的東西"
STR_INTERCEPT_CHOICE_13_1: "堅持胡珀偷了它"
STR_INTERCEPT_TITLE_14: "勒索"
STR_INTERCEPT_TEXT_14: "你描述了一個年輕人，一次被背叛的信心，以及隨之而來的要求。哈里斯只會傾聽，但不會幫助你。說出設定陷阱的人的名字也可能會暴露你希望保護的人。"
STR_INTERCEPT_CHOICE_14_0: "給哈里斯完整的賬戶"
STR_INTERCEPT_CHOICE_14_1: "省略名字"
STR_INTERCEPT_CHOICE_14_2: "提出抓住胡珀的方法"
STR_INTERCEPT_TITLE_15: "一個簡單的指控"
STR_INTERCEPT_TEXT_15: "胡珀，你說，必須負責。哈里斯問你怎麼知道的。解決問題和提供可以證明答案的證人之間是有區別的。"
STR_INTERCEPT_CHOICE_15_0: "讓哈里斯質疑這一說法"
STR_INTERCEPT_CHOICE_15_1: "嘗試給 Hooper 發私信"
STR_INTERCEPT_TITLE_16: "可測試的線索"
STR_INTERCEPT_TEXT_16: "故事可以被否認。檔案、證人或缺失的部分都很難解釋清楚。你有一點時間來選擇要追求什麼。"
STR_INTERCEPT_CHOICE_16_0: "檢查附近的小屋"
STR_INTERCEPT_CHOICE_16_1: "使用早上攔截"
STR_INTERCEPT_CHOICE_16_2: "直接向胡珀提問"
STR_INTERCEPT_TITLE_17: "不僅僅是回報"
STR_INTERCEPT_TEXT_17: "機器可以再次工作，但哈里斯仍有安全漏洞需要解釋。他為您提供了最後一次機會來確定是誰組織了這次活動。"
STR_INTERCEPT_CHOICE_17_0: "出示證據"
STR_INTERCEPT_CHOICE_17_1: "尋找證據"
STR_INTERCEPT_CHOICE_17_2: "接受他的判斷"
STR_INTERCEPT_TITLE_18: "矛盾"
STR_INTERCEPT_TEXT_18: "哈里斯將您的第一個答案設定在最新答案旁邊。它們不可能都是真的。你可以放棄謊言，或者讓採訪以矛盾結束。"
STR_INTERCEPT_CHOICE_18_0: "說出勒索的真相"
STR_INTERCEPT_CHOICE_18_1: "不斷否認一切"
STR_INTERCEPT_CHOICE_18_2: "嘗試離開"
STR_INTERCEPT_TITLE_19: "沉默"
STR_INTERCEPT_TEXT_19: "你交叉雙臂。哈里斯關閉了檔案。在這個房間裡，沉默並沒有結束調查；它只是結束了你指導它的部分。"
STR_INTERCEPT_CHOICE_19_0: "聽取決定"
STR_INTERCEPT_TITLE_20: "碎玻璃"
STR_INTERCEPT_TEXT_20: "窗格讓路了。冷空氣和警衛的哨聲一起襲來。在有人到達門口之前，有時間做出決定。"
STR_INTERCEPT_CHOICE_20_0: "往外路徑跑"
STR_INTERCEPT_CHOICE_20_1: "留下編碼線索"
STR_INTERCEPT_CHOICE_20_2: "留下來解釋"
STR_INTERCEPT_TITLE_21: "小屋之間"
STR_INTERCEPT_TEXT_21: "路溼了。胡珀的小屋足夠近，可以在下一次巡邏之前到達，但它後面的空地提供了不同的機會。"
STR_INTERCEPT_CHOICE_21_0: "嘗試逃離場地"
STR_INTERCEPT_CHOICE_21_1: "進入胡珀的小屋"
STR_INTERCEPT_CHOICE_21_2: "返回哈里斯"
STR_INTERCEPT_TITLE_22: "私人遊戲"
STR_INTERCEPT_TEXT_22: "胡珀研究你。他用手指在桌子上擺出一個想象的棋局。隱晦的回答可以讓他揭露直接指控永遠無法揭露的真相。"
STR_INTERCEPT_CHOICE_22_0: "用國際象棋線索回答"
STR_INTERCEPT_CHOICE_22_1: "威脅要說出他的名字"
STR_INTERCEPT_CHOICE_22_2: "說實話"
STR_INTERCEPT_TITLE_23: "面對面"
STR_INTERCEPT_TEXT_23: "胡珀問你實際上可以證明什麼。只有當你提到他計劃之外的人不應該知道的細節時，他的信心才會動搖。"
STR_INTERCEPT_CHOICE_23_0: "用證據面對他"
STR_INTERCEPT_CHOICE_23_1: "提供元件作為交易"
STR_INTERCEPT_CHOICE_23_2: "虛張聲勢"
STR_INTERCEPT_TITLE_24: "杯子"
STR_INTERCEPT_TEXT_24: "胡珀端來水，但先伸手去拿茶杯。保留那個杯子可能比接受他提供的任何其他東西更有用。"
STR_INTERCEPT_CHOICE_24_0: "保留杯子"
STR_INTERCEPT_CHOICE_24_1: "再次檢查你的外套"
STR_INTERCEPT_TITLE_25: "需要測試的東西"
STR_INTERCEPT_TEXT_25: "你保留杯子並請哈里斯檢查。這最終是一項附有物體的指控。胡珀試圖將其移除的嘗試提供了第二個有用的細節。"
STR_INTERCEPT_CHOICE_25_0: "把杯子給哈里斯"
STR_INTERCEPT_CHOICE_25_1: "與胡珀對峙"
STR_INTERCEPT_TITLE_26: "錯誤的目標"
STR_INTERCEPT_TEXT_26: "你在沒有證據的情況下指控哈里斯。他看到一名嫌疑人試圖抹黑調查員。不管茶發生了什麼，你都讓他更難相信你了。"
STR_INTERCEPT_CHOICE_26_0: "採訪結束"
STR_INTERCEPT_TITLE_27: "整個賬戶"
STR_INTERCEPT_TEXT_27: "您給出姓名並描述會議。哈里斯提出了精確的問題。你的尷尬是真實的，但他現在可以檢查的細節也是如此。"
STR_INTERCEPT_CHOICE_27_0: "讓他驗證賬戶"
STR_INTERCEPT_CHOICE_27_1: "主動尋找胡珀"
STR_INTERCEPT_TITLE_28: "失敗的虛張聲勢"
STR_INTERCEPT_TEXT_28: "哈里斯已經聽到了足夠自信的答案。胡珀也有。兩者都沒有提供您的故事缺失的事實。"
STR_INTERCEPT_CHOICE_28_0: "堅持主張"
STR_INTERCEPT_CHOICE_28_1: "絕望逃脫"
STR_INTERCEPT_CHOICE_28_2: "承認真實發生的事情"
STR_INTERCEPT_TITLE_29: "截距"
STR_INTERCEPT_TEXT_29: "你口袋裡的那張紙上不僅有亂七八糟的字母：它穿過小屋的路線使胡珀靠近機器。一條簡潔的線索可能會讓正確的人在正確的地方尋找。"
STR_INTERCEPT_CHOICE_29_0: "為 Hooper 編碼訊息"
STR_INTERCEPT_CHOICE_29_1: "顯示前往哈里斯的路線"
STR_INTERCEPT_TITLE_30: "機器執行"
STR_INTERCEPT_TEXT_30: "哈里斯擁有這個元件，以及一條超越你第一個恐懼答案的線索。炸彈恢復工作。你以自己的名義離開了 14 號小屋，秘密更少，未來仍需負責。"
STR_INTERCEPT_TITLE_31: "受到懷疑"
STR_INTERCEPT_TEXT_31: "退回元件使機器免於延誤。它並沒有保住你的位置。在調查繼續進行期間，哈里斯阻止了你進入小屋。你在採訪中倖存下來，但並沒有洗清你的罪名。"
STR_INTERCEPT_TITLE_32: "被拘留"
STR_INTERCEPT_TEXT_32: "門是為警衛而不是為你開啟的。矛盾、證據缺失和部件失竊已成為您無法再處理的案件。本次嘗試到此結束。"
STR_INTERCEPT_TITLE_33: "外部路徑"
STR_INTERCEPT_TEXT_33: "你把小屋拋在了身後。黑暗是有用的，但地面卻受到監視。一扇破碎的窗戶讓巡邏隊比你希望的更近了。"
STR_INTERCEPT_CHOICE_33_0: "穿過空地"
STR_INTERCEPT_CHOICE_33_1: "保持服務路徑"
STR_INTERCEPT_CHOICE_33_2: "轉身面向哈里斯"
STR_INTERCEPT_TITLE_34: "胡珀小屋"
STR_INTERCEPT_TEXT_34: "辦公桌無人看管。填字遊戲下面放著檔案，機房則出現在用鉛筆寫的時間表中。腳步聲沿著外面的木板接近。"
STR_INTERCEPT_CHOICE_34_0: "檢查試卷"
STR_INTERCEPT_CHOICE_34_1: "等待胡珀"
STR_INTERCEPT_CHOICE_34_2: "前往哈里斯"
STR_INTERCEPT_TITLE_35: "國際象棋問題"
STR_INTERCEPT_TEXT_35: "你給胡珀一個反映他困境的位置：一個受保護的棋子，一個暴露的國王，以及在答覆之前看起來安全的一步。他理解這個警告。他接下來的話提供了你所需要的聯絡。"
STR_INTERCEPT_CHOICE_35_0: "讓他承認這個計劃"
STR_INTERCEPT_CHOICE_35_1: "將入場券傳送給 Harris"
STR_INTERCEPT_TITLE_36: "不戴口罩"
STR_INTERCEPT_TEXT_36: "你談論壓力，而不是假裝它不存在。胡珀作為一個人而不是作為一個對手簡單地回答道。該空缺可用於交易或陷阱。"
STR_INTERCEPT_CHOICE_36_0: "要求誠實的安排"
STR_INTERCEPT_CHOICE_36_1: "讓他坦白"
STR_INTERCEPT_CHOICE_36_2: "將賬戶交給 Harris"
STR_INTERCEPT_TITLE_37: "胡珀入學"
STR_INTERCEPT_TEXT_37: "Hooper 的解釋足以將勒索與丟失的元件聯絡起來。哈里斯現在可以恢復裝置並檢查故事。你必須決定是結束調查還是讓胡珀消失。"
STR_INTERCEPT_CHOICE_37_0: "給哈里斯帶來入場券"
STR_INTERCEPT_CHOICE_37_1: "讓胡珀走開"
STR_INTERCEPT_TITLE_38: "貿易"
STR_INTERCEPT_TEXT_38: "你將最後一塊槓桿放在胡珀力所能及的範圍內。沒有證人或證據的討價還價是邀請他以你為代價解決他的問題。"
STR_INTERCEPT_CHOICE_38_0: "移交元件"
STR_INTERCEPT_CHOICE_38_1: "要求見證協議"
STR_INTERCEPT_CHOICE_38_2: "撤回報價"
STR_INTERCEPT_TITLE_39: "哈里斯傾聽"
STR_INTERCEPT_TEXT_39: "詳情可檢視。哈里斯詢問該元件現在在哪裡。清除帳戶和讓機器執行是相關的問題，但它們不是同一個問題。"
STR_INTERCEPT_CHOICE_39_0: "歸還外套裡的東西"
STR_INTERCEPT_CHOICE_39_1: "幫助恢復元件"
STR_INTERCEPT_CHOICE_39_2: "現在停止回答"
STR_INTERCEPT_TITLE_40: "超越柵欄"
STR_INTERCEPT_TEXT_40: "小屋消失在你身後。場外的自由並不等於純真，而機器現在是別人的緊迫問題。你逃脫了；該賬目仍未完成。"
STR_INTERCEPT_TITLE_41: "最後一個錯誤"
STR_INTERCEPT_TEXT_41: "巡邏隊會在空地結束之前到達您身邊，或者當胡珀不再有用時，他的承諾就會崩潰。您已用完安全動作。這個故事可以從頭再試一次。"
STR_INTERCEPT_TITLE_42: "論文"
STR_INTERCEPT_TEXT_42: "時間表將胡珀放置在你的故事所說的地方。旁邊是最先把你引入陷阱的便條。該組合足夠具體，可供哈里斯驗證。"
STR_INTERCEPT_CHOICE_42_0: "把檔案交給哈里斯"
STR_INTERCEPT_CHOICE_42_1: "等待並面對胡珀"
STR_INTERCEPT_TITLE_43: "最後的安排"
STR_INTERCEPT_TEXT_43: "Hooper 提議將零件放回去。信任他可以解決一個迫在眉睫的問題；讓哈里斯成為證人將使創造另一個證人變得更加困難。"
STR_INTERCEPT_CHOICE_43_0: "安排見證回程"
STR_INTERCEPT_CHOICE_43_1: "將哈里斯納入計劃"
STR_INTERCEPT_TITLE_44: "恢復卷軸"
STR_INTERCEPT_TEXT_44: "帳戶記錄後，搜尋將返回到丟失的硬體。哈里斯檢查機房，同時確定元件應該放置的位置。"
STR_INTERCEPT_CHOICE_44_0: "完成驗證退貨"
STR_INTERCEPT_CHOICE_44_1: "從你的外套中取出它"
STR_INTERCEPT_CHOICE_44_2: "警告哈里斯注意胡珀"
STR_INTERCEPT_TITLE_45: "最後一個問題"
STR_INTERCEPT_TEXT_45: "哈里斯等待著。如果您可以將胡珀與盜竊案聯絡起來，那麼仍然有辦法恢復該元件並正確結束這件事。否則調查的只有你變更的賬戶。"
STR_INTERCEPT_CHOICE_45_0: "出示證據"
STR_INTERCEPT_CHOICE_45_1: "承認你一無所有"
