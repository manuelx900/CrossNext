STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "冒險的開始"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "多年來，人們過著平靜的生活，享受著書籍。然後湮滅之王開始消滅他們。他想要阻止所有人閱讀，讓所有故事永遠消失。"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "國王的怪物"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "湮滅之王把他的怪物送到世界各地。他們毀掉了找到的每一本書，並攻擊任何試圖阻止他們的人。圖書館開始消失，人們停止閱讀。"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "閱讀的力量"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "有一天，當你在村莊附近讀書時，一隻怪物出現了。你試圖逃脫，但令人驚訝的事情發生了：你讀得越多，它就變得越弱。你意識到閱讀是對抗國王魔法的唯一方法。"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "你的使命"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "你出發去阻止國王。在前往他的城堡的路上，你必須穿越森林、城市、山脈和其他充滿敵人的地方。你擊敗的每一個怪物都會讓你更接近一些。繼續閱讀，擊敗他的守護者並在他摧毀世界上的每一本書之前找到他。"
