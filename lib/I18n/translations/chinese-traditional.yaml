STR_PET_STORY_0: "種子"
STR_PET_STORY_TEXT_0: "您完成了一章。在你的同伴旁邊，一顆小小的種子已經發芽了。你給它一個靠窗的地方。"
STR_PET_STORY_1: "一個下雨天"
STR_PET_STORY_TEXT_1: "當你讀書時，雨敲打著窗戶。你的同伴蜷縮在附近。一時間，整個房間就像一個避難所。"
STR_PET_STORY_2: "訪客"
STR_PET_STORY_TEXT_2: "一隻鳥落在窗邊。你的同伴靜靜地看著，直到它飛走。你標記你的頁面並微笑。"
STR_PET_STORY_3: "紙船"
STR_PET_STORY_TEXT_3: "一張紙變成一艘小船。你的同伴跟著它穿過桌子，彷彿它經歷了一次完整的冒險。"
STR_PET_STORY_4: "星空下"
STR_PET_STORY_TEXT_4: "看完了，一起看吧。出現一顆星星，然後是另一顆星星。還有很多東西有待發現。"
STR_PET_STORY_5: "丟失的葉子"
STR_PET_STORY_TEXT_5: "你的同伴給你帶來了一片葉子。你把它放在書籤旁邊：一個平凡日子裡的小禮物。"
STR_PET_STORY_6: "安靜的角落"
STR_PET_STORY_TEXT_6: "你找到一個舒適的角落，開啟你的書。你的同伴坐在你旁邊。你們兩個都不著急。"
STR_PET_STORY_7: "一條新路"
STR_PET_STORY_TEXT_7: "再一頁將帶您到新的地方。你的同伴伸了個懶腰，看著你，準備好迎接明天的章節。"
