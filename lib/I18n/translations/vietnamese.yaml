STR_NAVAL_DEFEAT: "Hạm đội của bạn đã bị chìm"
STR_NAVAL_RESULT_HELP: "Xem lại các bảng cuối cùng hoặc bắt đầu một trận chiến khác."
STR_PET_GUIDE_SATIETY: "Độ no: 100 nghĩa là bạn không đói. Thực phẩm làm tăng giá trị này."
STR_PET_GUIDE_MOOD: "Vuốt ve bạn đồng hành và chơi cùng nhau. Đọc sách cũng cải thiện tâm trạng."
STR_PET_GUIDE_ENERGY: "Chọn nghỉ ngơi khi mệt mỏi: thú cưng của bạn nghỉ ngơi trong 2 giờ."
STR_PET_GUIDE_HYGIENE: "Làm sạch thú cưng của bạn miễn phí để giúp ngăn ngừa bệnh tật.Nếu nó đã bị ốm, hãy cho nó một biện pháp khắc phục trong Sức khỏe."
STR_PET_GUIDE_READING: "Chọn một quả trứng và nuôi thú cưng của bạn bằng cách đọc. Cho nó thức ăn, công ty, nghỉ ngơi và làm sạch."
STR_PET_GUIDE_HOME: "Đặt hoặc loại bỏ chúng tự do; bạn giữ mọi đối tượng."
STR_PET_GUIDE_SUPPLIES: "Bạn kiếm được một phần ăn khi đọc 5, 10, 15, 30, 60 và 120 phút mỗi ngày: tối đa 6 phần ăn. Mỗi lần tăng đồng hồ đo độ bão hòa thêm 25 điểm, tối đa 100."
STR_PET_GUIDE_FEED: "Bạn kiếm được một phương thuốc trong 30 phút đọc sách và một trong 120 phút mỗi ngày."
STR_PET_GUIDE_GAMES: "3 trò chơi đầu tiên mỗi ngày thưởng tâm trạng và tốn 20 năng lượng. Sau đó có thể luyện tập miễn phí. Trước khi chơi, hãy chăm sóc bạn đồng hành đang bệnh, đói, mệt hoặc ngủ."
STR_PET_GUIDE_HEALTH: "Làm sạch là miễn phí và khôi phục vệ sinh đến 100. nó không chữa khỏi bệnh tật: vì điều đó, mở sức khỏe và sử dụng một phương thuốc."
STR_PET_GUIDE_DIFFICULTY: "Relaxed không có thời hạn để trở lại đọc. Normal cho phép 7 ngày, Hard 3 ngày và Extreme 24 giờ. Nếu thời hạn vượt qua, thú cưng của bạn chết. Đọc bắt đầu thời gian một lần nữa."
STR_PET_GUIDE_PROJECT: "Chọn một đối tượng và đọc lên đến 60 phút để kiếm được nó. thay đổi dự án bắt đầu từ không. Bạn có thể loại bỏ các đối tượng sở hữu mà không mất chúng; chúng được thừa kế."
