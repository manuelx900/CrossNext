STR_QUEST_CAM_JOURNEY2_BOOK_11: "Trang cuối cùng"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Sau khi đánh bại King of Oblivion, bạn trở về nhà. Quân đội của ông không còn có thể phá hủy sách và mọi người đọc sách trong hòa bình trở lại. Bạn đã lưu lại những câu chuyện của thế giới. Vẫn còn rất nhiều cuốn sách để khám phá."
