STR_QUEST_CAM_JOURNEY_DAILYREQUEST_1: "Hãy tiếp tục với những câu chuyện này một chút, ai đó trong thị trường có thể nhận ra người mà những từ ngữ mô tả."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_2: "Tôi muốn một gia đình chờ đợi khi con thuyền tiếp theo đến."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_3: "Đọc bài này trước khi tôi chuyển nó lên kệ cao hơn, tôi cần biết những từ nào vẫn còn thiếu."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_4: "Tôi không muốn nhầm lẫn một lời cảnh báo cũ với một cuộc gọi sắp tới."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Trước khi chúng ta đi, tôi muốn mọi người nghe tên của mình."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_6: "Đọc trang này với tôi trước khi tiếng chuông vang lên, tôi cần phải nhớ nhiều hơn là giờ trên đồng hồ."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_7: "Đọc toàn bộ lời khai này, có những người ở đây đã chờ đợi quá lâu để được nghe."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Đọc cuốn hồi ký này gần suối nước, tôi muốn nghe người đã trồng ở đây hy vọng để lại gì."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Đọc những ghi chép chúng tôi gửi cho anh, tiếng nói từ quê nhà có thể giúp anh, ngay cả khi xa như vậy."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Đọc lá thư này trước khi rời đi, anh không cần phải mang theo mọi ký ức một mình."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_11: "Đọc những lời chúng tôi đã giữ lại cho anh, pháo đài không phải là cả thế giới, dù nó có yên tĩnh đến đâu."
