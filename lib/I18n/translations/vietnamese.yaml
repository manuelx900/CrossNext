STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "Đọc những ghi chép mà hàng xóm mang đến quảng trường, chúng ta cần đặt tên của mỗi người bên cạnh cái chết của họ."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "Tôi không thể gửi một con thuyền khác vào một kênh mà chúng ta không còn nhớ nữa."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "Khi chúng rời khỏi phòng này, tôi muốn ai đó biết câu chuyện của ai mà chúng mang theo."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "Giúp tôi so sánh các báo cáo từ các nơi trú ẩn, người đi tiếp sẽ phải tìm ra một con đường, không phải là một tiếng vang sai lầm khác."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "Hãy giúp chúng tôi so sánh những chuyến đi cũ, một cái giếng nhớ có thể tạo ra sự khác biệt giữa đến nơi và biến mất trong cát."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "Hãy giúp tôi lắng nghe những câu chuyện của hàng xóm đồng hồ không thể nói cho tôi biết họ hy vọng làm gì trong ngày."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "Hãy giúp chúng tôi đọc những ghi chép từ các vùng được giải phóng Cung điện đã dành đủ nhiều năm chỉ nói chuyện với chính mình."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Hãy giúp tôi sắp xếp lại câu chuyện của những người làm vườn, những hạt giống này cần nhiều hơn là một cái tên trên gói."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Hãy giúp chúng tôi giữ cho những câu chuyện này được lưu truyền, tôi muốn những người chúng tôi tìm thấy có thể nghe được nhau."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Giúp chúng tôi đọc các tài liệu đến con đường cuối cùng, mỗi một cái thuộc về ai đó đang chờ đợi bên ngoài tường thành của nhà vua."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Hãy giúp chúng tôi đọc toàn bộ những tài liệu này, sau một thời gian dài xa cách, chủ nhân của chúng xứng đáng hơn là một cái tên trong danh sách."
STR_QUEST_CAM_JOURNEY_THANKS_0: "Liora làm mềm trang giấy bằng lòng bàn tay. \"Tôi có thể nghe thấy dòng chữ đó một lần nữa,\" cô nói. Đêm nay cô sẽ để cuốn sách mở ra bên cạnh đèn."
STR_QUEST_CAM_JOURNEY_THANKS_1: "Tại quầy sách, ai đó di chuyển một chiếc ghế để tạo chỗ cho bạn. Một câu chuyện chưa hoàn thành đã có một dòng khác; chủ sở hữu của nó mang trang về nhà trong cả hai tay."
STR_QUEST_CAM_JOURNEY_THANKS_2: "Mara gấp lại một trang mới có thể đọc được và đặt nó bên cạnh cuốn sách thủy triều của cô trước khi quay lại cửa sổ, cô ấy cảm ơn anh với giọng nói nặng nề do không khí muối."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Iri đặt một dải vải khô giữa hai trang. \"Người đó có thể đi du lịch bây giờ.\" Cô cầm quyển sách lên ngực trước khi mang nó đến những cuốn sách khác."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Taren đặt túi của mình lên đá và lắng nghe khi bạn kết thúc, sau đó anh ta lặp lại lời nói của một người du lịch, lần này không cần nhìn vào trang giấy."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Nadir rút dây ruy băng qua ngón tay, đọc một cái tên mà trước đây rất khó phát âm, ông ấy tạo ra một chỗ cho anh bên cạnh ngọn lửa."
STR_QUEST_CAM_JOURNEY_THANKS_6: "Orin bỏ công cụ mà anh ta đang xoay trong tay xuống và nói về người trong câu chuyện, và đồng hồ được cho phép chạy mà không ai nghe thấy."
STR_QUEST_CAM_JOURNEY_THANKS_7: "Sera chuyển câu chuyện ra khỏi đống lệnh của hoàng gia, cô ấy yêu cầu một chiếc ghế khác, rồi nghe những dòng cuối cùng của nó với anh."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Aster đánh dấu một trang bằng một tờ giấy sạch. Cô ấy cảm ơn anh một cách lặng lẽ; một chút sau, anh nghe cô ấy đọc cùng một đoạn bên cạnh suối nước."
STR_QUEST_CAM_JOURNEY_THANKS_9: "Liora đã sao chép một đoạn văn mà anh đã giúp khôi phục lại; ở lề cô ấy đã viết, \"Chúng tôi đọc bài này cùng nhau tại nhà.\""
STR_QUEST_CAM_JOURNEY_THANKS_10: "Bức thư chỉ dài vài dòng, Liora đã để lại chỗ cho một câu trả lời, như thể cô ấy có thể thấy anh đang ngồi ở bên kia bàn."
STR_QUEST_CAM_JOURNEY_THANKS_11: "Trong số các trang đã được khôi phục, bạn tìm thấy một lá thư gấp từ nhà. dòng cuối cùng của nó đơn giản: \"Vẫn còn một chỗ cho anh ở đây.\""
