STR_PET_STORY_4: "Dưới những vì sao"
STR_PET_STORY_TEXT_4: "Sau khi đọc, bạn nhìn ra cùng nhau. Một ngôi sao xuất hiện, sau đó một ngôi sao khác."
STR_PET_STORY_5: "Chiếc lá thất lạc"
STR_PET_STORY_TEXT_5: "Người bạn đồng hành của bạn mang đến cho bạn một chiếc lá.Bạn giữ nó bên cạnh dấu trang: một món quà nhỏ từ một ngày bình thường."
STR_PET_STORY_6: "Một góc yên tĩnh"
STR_PET_STORY_TEXT_6: "Bạn tìm thấy một góc thoải mái và mở cuốn sách của bạn. người bạn đồng hành của bạn ngồi bên cạnh bạn."
