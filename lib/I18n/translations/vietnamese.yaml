STR_CAR_HELP_TEXT: "Làm thế nào để giải quyết một vụ án\nMỗi nhân vật đưa ra một tuyên bố. Phía trên màn hình cho biết số lượng chính xác của những người phạm tội và các tuyên bố sai lầm. Tìm một kết hợp thỏa mãn cả hai số liệu. Mỗi trường hợp có một giải pháp.\n  \nTội lỗi không phải là sự trung thực\nMột nhân vật vô tội có thể nói dối, và một kẻ phạm tội có thể nói sự thật. Hai lời nói dối có nghĩa là chính xác hai tuyên bố hoàn chỉnh là sai; những tuyên bố còn lại là đúng.\n  \nĐọc những manh mối\n\"A hoặc B đã làm điều đó (hoặc cả hai)\" có nghĩa là ít nhất một nhân vật được đặt tên là tội phạm. \"A và B đã làm điều đó\" đòi hỏi cả hai. Một lời nói dối phủ nhận toàn bộ tuyên bố: một sai OR có nghĩa là cả hai đều không làm điều đó; một sai AND có nghĩa là ít nhất một người không làm điều đó.\n  \n\"Cả hai đều nói thật hoặc cả hai đều nói dối\" so sánh các tuyên bố, không phải tội lỗi. \"Đúng một người nói dối\" có nghĩa là các tuyên bố của họ có giá trị sự thật khác nhau.\n  \nNEIGHBORS ON A SMALL SCREEN\nThứ tự vòng tròn ban đầu là Panther, Peacock, Shark, Fox, Bear, Stag, Horse, chỉ sử dụng các ký tự của trường hợp này. Chữ cuối cùng và đầu tiên là hàng xóm. Ứng dụng này viết hai tên trực tiếp vào mỗi gợi ý hàng xóm. Bạn không bao giờ cần phải đoán thử lá bài nào nằm bên cạnh một hình thẳng đứng. Thay trang hoặc hướng không thay đổi gợi ý.\n  \nChiều cao và chế độ ăn uống\nMỗi thẻ cho thấy chiều cao và chế độ ăn uống hư cấu. \"Một kẻ phạm tội cao hơn tôi\" có nghĩa là ít nhất một kẻ phạm tội cao hơn người nói, không nhất thiết là tất cả kẻ phạm tội. Kiểu ngắn cũng như vậy. Những gợi ý về động vật ăn thịt và động vật ăn cỏ có nghĩa là ít nhất một kẻ phạm tội có chế độ ăn uống đó; động vật ăn tạp được tính là không có cả hai. Tên, chiều cao và chế độ ăn uống là những sự thật đáng tin cậy; các tuyên bố có thể nói dối.\n  \nPhân tích của anh\nDùng ? / Thật / Lừa dối và Nghi ngờ dưới mỗi tuyên bố để ghi lại giả thuyết. Đây là ghi chú của bạn, không phải bằng chứng hay kiểm tra tự động. Các mũi tên hiển thị các ký tự khác. Chế độ thẳng đứng hiển thị đến ba trên mỗi trang.\n  \nBị buộc tội.\nNhấn vào nút Tội phạm và chọn chính xác số lượng tội phạm cần thiết. Chỉ khi xác nhận một tội phạm sai sẽ mất một mạng sống. Người mới bắt đầu và người bình thường có hai mạng sống; người cao cấp và chuyên gia có một mạng sống. Một tội phạm đúng sẽ giải quyết vụ án. Khi không còn mạng sống nào, giải pháp sẽ được tiết lộ.\n  \nChiến dịch và lặp lại\nCó 1, 470 trường hợp. Mở trường hợp tiếp tục thử nghiệm hiện tại hoặc mở trường hợp kế tiếp sau khi đóng trường hợp trước đó. Chiến dịch cho phép bạn chọn bất kỳ trường hợp nào trong số 1, 470 trường hợp theo bất kỳ thứ tự nào từ lúc bắt đầu. Lặp lại bắt đầu một thử nghiệm mới trong khi giữ nguyên kết thúc trước đó. Trong mỗi khó khăn, các trường hợp tiến triển từ một tội phạm đến hai, sau đó từ ít người nói dối đến nhiều hơn trong mỗi nhóm tội phạm. Người mới bắt đầu giữ một tội phạm. Các lượt ném nhỏ hơn đến đầu tiên khi số lượng tương ứng. Tất cả các trường hợp vẫn còn sẵn sàng. Giải quyết một trường hợp đã hết thời hạn trước đó sẽ nâng cấp nó thành giải quyết xong.\n  \nTiến trình và mạng sống được lưu trên thẻ SD. Rời khỏi, ngủ hoặc khởi động lại thiết bị không phục hồi mạng sống trong nỗ lực hiện tại. Nếu không ghi lại, kết quả sẽ bị chặn cho đến khi Thử lại thành công. Đặt lại tất cả yêu cầu xác nhận trước khi xóa tiến trình của chỉ Carnivore."
