STR_QUEST_CAM_DECOR_TEXT_3: "Một linh hồn thoát ra từ một trang giấy trắng. Nó chọn đi du lịch cùng bạn."
STR_QUEST_CAM_DECOR_NAME_4: "Hoa trăng"
STR_QUEST_CAM_DECOR_TEXT_4: "Người làm vườn đã cứu được một hạt giống từ vườn ngủ. Bông hoa này mọc lên là dành cho bạn."
STR_QUEST_CAM_DECOR_NAME_5: "Pha Lê Mùa Đông"
STR_QUEST_CAM_DECOR_TEXT_5: "Sự tan băng tiết lộ một viên pha lê chứa ký ức cuối cùng về ngọn núi."
STR_QUEST_CAM_DECOR_NAME_6: "Cú đồng hồ"
STR_QUEST_CAM_DECOR_TEXT_6: "Người thợ sửa đồng hồ sửa chữa người bảo vệ nhỏ này để cảm ơn bạn đã mang thời gian quay trở lại."
STR_QUEST_CAM_DECOR_NAME_7: "Lông Phượng Hoàng"
STR_QUEST_CAM_DECOR_TEXT_7: "Từ đống tro tàn mọc lên một chiếc lông vũ: lời hứa rằng những câu chuyện có thể bắt đầu lại."
STR_QUEST_CAM_DECOR_NAME_8: "Đèn sa mạc"
STR_QUEST_CAM_DECOR_TEXT_8: "Người kể chuyện tặng bạn ngọn đèn lưu giữ những câu chuyện về sa mạc."
STR_QUEST_CAM_DECOR_NAME_9: "Cá Koi Mây"
STR_QUEST_CAM_DECOR_TEXT_9: "Bạn mở lồng mây ra. Một chú cá koi nhỏ ở lại để trông chừng giấc mơ của bạn."
STR_QUEST_CAM_DECOR_NAME_10: "Tim Rồng"
STR_QUEST_CAM_DECOR_TEXT_10: "Những con rồng giao cho bạn một viên pha lê được sinh ra từ ký ức đã được phục hồi của chúng."
STR_QUEST_CAM_DECOR_NAME_11: "Ngôi sao ký ức"
STR_QUEST_CAM_DECOR_TEXT_11: "Ngôi sao được khôi phục đầu tiên sẽ soi đường cho bạn đến những trang cuối cùng."
STR_QUEST_CAM_DECOR_NAME_12: "Đọc Mầm"
STR_QUEST_CAM_DECOR_TEXT_12: "Một chậu cây nhỏ cho góc đọc sách yên tĩnh."
STR_QUEST_CAM_DECOR_NAME_13: "Sách đã lưu"
STR_QUEST_CAM_DECOR_TEXT_13: "Những câu chuyện đang chờ độc giả tiếp theo."
STR_QUEST_CAM_DECOR_NAME_14: "Biểu ngữ du hành"
STR_QUEST_CAM_DECOR_TEXT_14: "Một lá cờ hiệu để ghi nhớ mỗi khởi đầu mới."
STR_QUEST_CAM_DECOR_NAME_15: "Nấm mặt trăng"
STR_QUEST_CAM_DECOR_TEXT_15: "Một mảnh rừng nhỏ cho ngôi nhà của bạn."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Sự khởi đầu của cuộc phiêu lưu"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Trong nhiều năm mọi người sống trong hòa bình và yêu thích sách của họ. Sau đó, Vua lãng quên bắt đầu tiêu diệt họ. Anh ta muốn ngăn mọi người đọc và khiến mọi câu chuyện biến mất mãi mãi."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Quái vật của nhà vua"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Vua của sự lãng quên đã gửi quái vật của mình đi khắp thế giới. Họ phá hủy mọi cuốn sách tìm thấy và tấn công bất cứ ai cố ngăn cản họ. Thư viện bắt đầu biến mất và mọi người ngừng đọc."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Sức mạnh của việc đọc"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Một ngày nọ, khi bạn đang đọc sách gần ngôi làng của mình thì một con quái vật xuất hiện. Bạn cố gắng tránh xa, nhưng một điều đáng ngạc nhiên xảy ra: bạn càng đọc, nó càng trở nên yếu hơn. Bạn nhận ra rằng đọc sách là cách duy nhất để chống lại phép thuật của nhà vua."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Nhiệm vụ của bạn"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Bạn đặt ra để ngăn chặn nhà vua. Trên đường đến lâu đài của anh ấy, bạn phải băng qua những khu rừng, thành phố, ngọn núi và những nơi khác đầy kẻ thù. Mỗi con quái vật bạn đánh bại sẽ đưa bạn đến gần hơn một chút. Hãy tiếp tục đọc, đánh bại những người bảo vệ của anh ta và tiếp cận anh ta trước khi anh ta phá hủy mọi cuốn sách trên thế giới."
