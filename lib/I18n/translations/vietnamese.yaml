STR_PET_STORY_1: "Một ngày mưa"
STR_PET_STORY_TEXT_1: "Mưa chạm vào cửa sổ trong khi bạn đọc. người bạn đồng hành của bạn lắc đầu gần đó. Trong một thời gian, toàn bộ căn phòng cảm thấy như một nơi trú ẩn."
STR_PET_STORY_2: "Khách thăm"
STR_PET_STORY_TEXT_2: "Một con chim hạ cánh bên cửa sổ. người bạn đồng hành của bạn yên lặng nhìn cho đến khi nó bay đi. Bạn đánh dấu trang và mỉm cười."
