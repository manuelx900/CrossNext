STR_INTERCEPT_TITLE_0: "Lều 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942.Họ đang chờ bạn đằng sau một cánh cửa khóa.Một thành phần từ máy tính đã biến mất.Vào buổi sáng chặn các mảnh vỡ trong túi áo khoác của bạn.Bên ngoài, bước chân dừng lại."
STR_INTERCEPT_CHOICE_0_0: "Suy nghĩ qua cáo buộc"
STR_INTERCEPT_CHOICE_0_1: "Chờ người phỏng vấn"
STR_INTERCEPT_CHOICE_0_2: "Tìm áo khoác của bạn"
STR_INTERCEPT_TITLE_1: "cáo buộc"
STR_INTERCEPT_TEXT_1: "Họ nghi ngờ sự phản bội. Bạn giải quyết các con số, từ chéo và vị trí cờ vua để sống. phòng này là một vấn đề khác: mâu thuẫn với chính mình, và uy tín của bạn có thể là nạn nhân đầu tiên."
STR_INTERCEPT_CHOICE_1_0: "Chọn một chiến lược"
STR_INTERCEPT_CHOICE_1_1: "Nghe những gì họ biết"
STR_INTERCEPT_TITLE_2: "Harry đến"
STR_INTERCEPT_TEXT_2: "Harris bước vào với một cốc trà và một tập tin. Một cuộn bị mất từ bom. tên của bạn là trên danh sách nhiệm vụ. Ông đặt cốc bên cạnh bạn và hỏi nơi bạn đã ở đêm qua."
STR_INTERCEPT_CHOICE_2_0: "Uống trà"
STR_INTERCEPT_CHOICE_2_1: "Để trà không bị ảnh hưởng"
STR_INTERCEPT_CHOICE_2_2: "Trả lời bình tĩnh"
STR_INTERCEPT_TITLE_3: "Thành phần"
STR_INTERCEPT_TEXT_3: "Bên trong vỏ áo khoác của bạn, ngón tay của bạn gặp kim loại lạnh. Thành phần vẫn còn đó. Hooper nói rằng lấy nó sẽ làm cho sự tống tiền dừng lại."
STR_INTERCEPT_CHOICE_3_0: "Giữ nó ẩn"
STR_INTERCEPT_CHOICE_3_1: "Gửi nó cho Harris"
STR_INTERCEPT_TITLE_4: "Một trò chơi thắng"
STR_INTERCEPT_TEXT_4: "Hợp tác có thể bảo tồn uy tín của bạn. Một lời nói dối thuyết phục có thể mua thời gian. Trốn thoát sẽ trao đổi một căn phòng bị khóa cho các vệ sĩ bên ngoài. Không ai trong số những động thái này có thể được thực hiện trở lại."
STR_INTERCEPT_CHOICE_4_0: "Hợp tác"
STR_INTERCEPT_CHOICE_4_1: "Tạo ra một alibi"
STR_INTERCEPT_CHOICE_4_2: "Kiểm tra cửa sổ"
STR_INTERCEPT_TITLE_5: "Trà"
STR_INTERCEPT_TEXT_5: "Harris nhận thấy sự im lặng của bạn, nhưng khuôn mặt của anh ấy đã rút lui.Khi bạn mở mắt lần sau, một đôi giày khác đứng cạnh bàn."
STR_INTERCEPT_CHOICE_5_0: "giả vờ vẫn ngủ"
STR_INTERCEPT_CHOICE_5_1: "So sánh khách thăm"
STR_INTERCEPT_CHOICE_5_2: "Yêu cầu nước"
STR_INTERCEPT_TITLE_6: "Từ chối nhỏ"
STR_INTERCEPT_TEXT_6: "Harris quan sát chuyển động chặt chẽ hơn là câu trả lời. anh ta hỏi liệu có ai khác mà anh ta nên đặt câu hỏi hay không."
STR_INTERCEPT_CHOICE_6_0: "Hỏi anh ta có bằng chứng gì"
STR_INTERCEPT_CHOICE_6_1: "Nhắc đến Hooper"
STR_INTERCEPT_CHOICE_6_2: "Nhìn về phía cửa sổ"
STR_INTERCEPT_TITLE_7: "Sự thật mất tích"
STR_INTERCEPT_TEXT_7: "Harris muốn có một câu trả lời trực tiếp.Bạn đã lấy thành phần này chưa?Bạn có thể nói với anh ta những gì trong áo khoác của bạn, giải thích áp lực Hooper áp dụng, hoặc cố gắng chỉ ra cáo buộc ở nơi khác."
STR_INTERCEPT_CHOICE_7_0: "Cho anh ta thành phần"
STR_INTERCEPT_CHOICE_7_1: "Giải thích sự tống tiền"
STR_INTERCEPT_CHOICE_7_2: "cáo buộc Hooper"
STR_INTERCEPT_TITLE_8: "kim loại trên bàn"
STR_INTERCEPT_TEXT_8: "Harris kiểm tra nó mà không cần thư giãn. Trả lại thiết bị bị đánh cắp không giải thích lý do tại sao nó đã được lấy đi. anh ấy muốn một cái tên và một cái gì đó đáng tin cậy hơn lời nói của bạn."
STR_INTERCEPT_CHOICE_8_0: "Cung cấp để tìm bằng chứng"
STR_INTERCEPT_CHOICE_8_1: "Ở lại và trả lời các câu hỏi"
STR_INTERCEPT_TITLE_9: "Alibi của tôi"
STR_INTERCEPT_TEXT_9: "Bạn kể về một buổi tối yên tĩnh bên bàn làm việc. Harris mở hồ sơ. Một lính gác đã thấy bạn rời phòng máy. Lời bịa đặt của bạn giờ đã có nhân chứng bác bỏ."
STR_INTERCEPT_CHOICE_9_0: "Bảo vệ câu chuyện"
STR_INTERCEPT_CHOICE_9_1: "Chấp nhận tống tiền"
STR_INTERCEPT_CHOICE_9_2: "Từ chối thêm câu hỏi"
STR_INTERCEPT_TITLE_10: "Cửa sổ"
STR_INTERCEPT_TEXT_10: "Cửa sổ cao và kính dày.Ngoài đó, con đường dẫn qua một cái lều khác.Kết thúc nó sẽ lớn; chờ đợi ở đây có những nguy hiểm của riêng mình."
STR_INTERCEPT_CHOICE_10_0: "Đánh vỡ ly"
STR_INTERCEPT_CHOICE_10_1: "Nghiên cứu con đường bên ngoài"
STR_INTERCEPT_CHOICE_10_2: "Quay lại cuộc phỏng vấn"
STR_INTERCEPT_TITLE_11: "Khách thăm khác"
STR_INTERCEPT_TEXT_11: "Hooper đã đến trong khi bạn không ổn định. anh ấy muốn biết liệu Harris có thành phần hay không. anh ấy giữ một tay gần cửa."
STR_INTERCEPT_CHOICE_11_0: "Giả vờ ngủ"
STR_INTERCEPT_CHOICE_11_1: "Yêu cầu giải thích"
STR_INTERCEPT_CHOICE_11_2: "Yêu cầu nước"
STR_INTERCEPT_TITLE_12: "Một cảnh báo"
STR_INTERCEPT_TEXT_12: "Bạn gọi cho Harris trước khi trà bắt đầu. anh ta trở lại, kích thích. Một cáo buộc về cốc sẽ cần một cái gì đó anh ta có thể kiểm tra."
STR_INTERCEPT_CHOICE_12_0: "Giữ cốc làm bằng chứng"
STR_INTERCEPT_CHOICE_12_1: "Ông Harris bị cáo buộc đã đầu độc ông."
STR_INTERCEPT_CHOICE_12_2: "Tập trung vào Real"
STR_INTERCEPT_TITLE_13: "Hooper"
STR_INTERCEPT_TEXT_13: "Harris nhận ra tên. Hooper hữu ích, kết nối tốt, và không vắng mặt từ danh sách đêm qua."
STR_INTERCEPT_CHOICE_13_0: "Tìm một cái gì đó có thể xác minh"
STR_INTERCEPT_CHOICE_13_1: "Hooper đã đánh cắp nó"
STR_INTERCEPT_TITLE_14: "Blackmail"
STR_INTERCEPT_TEXT_14: "Bạn mô tả một người trẻ tuổi, sự tự tin bị phản bội, và yêu cầu sau đó. Harris lắng nghe mà không giúp bạn. đặt tên cho người đã đặt cái bẫy cũng có thể phơi bày người mà bạn hy vọng sẽ bảo vệ."
STR_INTERCEPT_CHOICE_14_0: "Gửi Harris tài khoản đầy đủ"
STR_INTERCEPT_CHOICE_14_1: "Hãy để lại tên"
STR_INTERCEPT_CHOICE_14_2: "Đề xuất một cách để bắt Hooper"
STR_INTERCEPT_TITLE_15: "Một lời buộc tội dễ dàng"
STR_INTERCEPT_TEXT_15: "Hooper, bạn nói, phải chịu trách nhiệm.Harris hỏi làm thế nào bạn biết.Có một sự khác biệt giữa việc giải quyết một vấn đề và tạo ra một nhân chứng có thể chứng minh câu trả lời."
STR_INTERCEPT_CHOICE_15_0: "Hãy để Harris thách thức tuyên bố"
STR_INTERCEPT_CHOICE_15_1: "Gửi tin nhắn riêng tới Hooper"
STR_INTERCEPT_TITLE_16: "Chìa khóa thử nghiệm"
STR_INTERCEPT_TEXT_16: "Một câu chuyện có thể bị từ chối. một tài liệu, một nhân chứng, hoặc các thành phần bị thiếu khó giải thích hơn."
STR_INTERCEPT_CHOICE_16_0: "Kiểm tra nhà ở gần"
STR_INTERCEPT_CHOICE_16_1: "Sử dụng buổi sáng Intercept"
STR_INTERCEPT_CHOICE_16_2: "Câu hỏi Hooper trực tiếp"
STR_INTERCEPT_TITLE_17: "Hơn cả sự trở lại"
STR_INTERCEPT_TEXT_17: "Máy có thể hoạt động trở lại, nhưng Harris vẫn còn một sự xâm phạm bảo mật để giải thích."
STR_INTERCEPT_CHOICE_17_0: "Hiển thị bằng chứng"
STR_INTERCEPT_CHOICE_17_1: "Tìm kiếm proof"
STR_INTERCEPT_CHOICE_17_2: "Chấp nhận phán quyết của Ngài"
STR_INTERCEPT_TITLE_18: "Một mâu thuẫn"
STR_INTERCEPT_TEXT_18: "Harris đặt câu trả lời đầu tiên của bạn bên cạnh câu trả lời mới nhất của bạn.Cả hai không thể là sự thật.Bạn có thể từ bỏ lời nói dối, hoặc để cuộc phỏng vấn kết thúc trên một mâu thuẫn."
STR_INTERCEPT_CHOICE_18_0: "Nói sự thật về tống tiền"
STR_INTERCEPT_CHOICE_18_1: "Tiếp tục phủ nhận mọi thứ"
STR_INTERCEPT_CHOICE_18_2: "Cố gắng rời"
STR_INTERCEPT_TITLE_19: "im lặng"
STR_INTERCEPT_TEXT_19: "Trong căn phòng này, sự im lặng không kết thúc cuộc điều tra; nó chỉ kết thúc phần của bạn trong việc chỉ đạo nó."
STR_INTERCEPT_CHOICE_19_0: "Lắng nghe quyết định"
STR_INTERCEPT_TITLE_20: "Đánh vỡ kính"
STR_INTERCEPT_TEXT_20: "Không khí lạnh và âm thanh của tiếng gầm của một người canh gác đến với nhau.Có thời gian cho một quyết định trước khi ai đó đến cửa."
STR_INTERCEPT_CHOICE_20_0: "Chạy cho con đường bên ngoài"
STR_INTERCEPT_CHOICE_20_1: "Để lại một clue mã hóa"
STR_INTERCEPT_CHOICE_20_2: "Ở lại và giải thích"
STR_INTERCEPT_TITLE_21: "Giữa những cái lều"
STR_INTERCEPT_TEXT_21: "Hooper's cottage là đủ gần để đạt trước khi tuần tra tiếp theo, nhưng mặt đất mở bên ngoài nó cung cấp một loại cơ hội khác."
STR_INTERCEPT_CHOICE_21_0: "Cố gắng thoát khỏi những lý do"
STR_INTERCEPT_CHOICE_21_1: "Đi vào Hooper's hut"
STR_INTERCEPT_CHOICE_21_2: "Trở lại Harris"
STR_INTERCEPT_TITLE_22: "Trò chơi riêng tư"
STR_INTERCEPT_TEXT_22: "Hooper nghiên cứu bạn.Trên bàn ông đặt ra một vị trí cờ vua tưởng tượng với ngón tay của mình. Một câu trả lời mã hóa có thể làm cho anh ta tiết lộ những gì một cáo buộc trực tiếp sẽ không bao giờ."
STR_INTERCEPT_CHOICE_22_0: "Trả lời với một cờ vua"
STR_INTERCEPT_CHOICE_22_1: "đe dọa đặt tên cho"
STR_INTERCEPT_CHOICE_22_2: "Nói chuyện thẳng thắn"
STR_INTERCEPT_TITLE_23: "Mặt đối mặt"
STR_INTERCEPT_TEXT_23: "Hooper hỏi bạn có thể chứng minh được điều gì, sự tự tin của anh ta chỉ mờ đi khi bạn đề cập đến những chi tiết mà người ngoài kế hoạch của anh ta không nên biết."
STR_INTERCEPT_CHOICE_23_0: "So sánh nó với bằng chứng"
STR_INTERCEPT_CHOICE_23_1: "Cung cấp thành phần như một thương mại"
STR_INTERCEPT_CHOICE_23_2: "bluff"
STR_INTERCEPT_TITLE_24: "Cúp"
STR_INTERCEPT_TEXT_24: "Hooper mang theo nước nhưng đến để lấy cốc trà đầu tiên. giữ cốc đó có thể hữu ích hơn là chấp nhận bất cứ điều gì khác mà anh ta cung cấp."
STR_INTERCEPT_CHOICE_24_0: "Giữ cốc"
STR_INTERCEPT_CHOICE_24_1: "Kiểm tra áo khoác một lần nữa"
STR_INTERCEPT_TITLE_25: "Một cái gì đó để kiểm tra"
STR_INTERCEPT_TEXT_25: "Bạn giữ cốc và yêu cầu Harris để nó được kiểm tra. Đây là cuối cùng một cáo buộc với một đối tượng gắn liền với nó. nỗ lực Hooper để loại bỏ nó cung cấp một chi tiết hữu ích thứ hai."
STR_INTERCEPT_CHOICE_25_0: "Đưa chiếc cốc cho Harris"
STR_INTERCEPT_CHOICE_25_1: "Confront Hooper với nó"
STR_INTERCEPT_TITLE_26: "nhầm mục tiêu"
STR_INTERCEPT_TEXT_26: "Bạn cáo buộc Harris mà không có bằng chứng. anh ta thấy một nghi phạm cố gắng làm mất uy tín điều tra viên. Bất kể chuyện gì xảy ra với trà, bạn đã khiến anh ta khó tin bạn hơn."
STR_INTERCEPT_CHOICE_26_0: "Phỏng vấn kết thúc"
STR_INTERCEPT_TITLE_27: "Toàn bộ tài khoản"
STR_INTERCEPT_TEXT_27: "Bạn đưa ra tên và mô tả cuộc họp. Harris đặt câu hỏi chính xác. sự xấu hổ của bạn là thật, nhưng cũng vậy là các chi tiết ông có thể kiểm tra bây giờ."
STR_INTERCEPT_CHOICE_27_0: "Hãy để anh ấy kiểm tra tài khoản"
STR_INTERCEPT_CHOICE_27_1: "Tìm kiếm Hooper"
STR_INTERCEPT_TITLE_28: "Lừa đảo thất bại"
STR_INTERCEPT_TEXT_28: "Harris đã nghe đủ câu trả lời tự tin. Hooper cũng vậy."
STR_INTERCEPT_CHOICE_28_0: "Vĩnh viễn trong tuyên bố"
STR_INTERCEPT_CHOICE_28_1: "Làm một cuộc chạy trốn tuyệt vọng"
STR_INTERCEPT_CHOICE_28_2: "thừa nhận những gì thực sự đã xảy ra"
STR_INTERCEPT_TITLE_29: "Cái bắt"
STR_INTERCEPT_TEXT_29: "Các tờ rơi trong túi của bạn mang nhiều hơn so với các chữ cái trộn: con đường của nó thông qua các hầm đặt Hooper gần máy. một manh mối ngắn gọn có thể làm cho người phù hợp để nhìn vào đúng nơi."
STR_INTERCEPT_CHOICE_29_0: "Mã hóa tin nhắn cho Hooper"
STR_INTERCEPT_CHOICE_29_1: "Cách di chuyển đến Harris"
STR_INTERCEPT_TITLE_30: "Máy chạy"
STR_INTERCEPT_TEXT_30: "Harris có thành phần, và một con đường dẫn ra ngoài những câu trả lời sợ hãi đầu tiên của bạn. The Bombe tiếp tục công việc của mình. Bạn rời khỏi Hut 14 dưới tên riêng của bạn, với ít bí mật hơn và một tương lai vẫn còn để trả lời."
STR_INTERCEPT_TITLE_31: "Dưới sự nghi ngờ"
STR_INTERCEPT_TEXT_31: "Trả lại các thành phần đã cứu máy từ một sự chậm trễ. Nó đã không tiết kiệm vị trí của bạn. Harris chấm dứt truy cập của bạn vào các hầm trong khi cuộc điều tra tiếp tục. Bạn sống sót cuộc phỏng vấn, nhưng không làm rõ tên của bạn."
STR_INTERCEPT_TITLE_32: "Trong Custody"
STR_INTERCEPT_TEXT_32: "Cánh cửa mở ra cho người canh gác chứ không phải cho bạn. mâu thuẫn, thiếu bằng chứng và một thành phần bị đánh cắp đã trở thành một trường hợp bạn không còn có thể trực tiếp."
STR_INTERCEPT_TITLE_33: "Con đường ngoài"
STR_INTERCEPT_TEXT_33: "Bạn để lại những cái lều phía sau. Bóng tối là hữu ích, nhưng các mặt đất được giám sát. Một cửa sổ bị phá vỡ đã đưa các tuần tra gần hơn bạn hy vọng."
STR_INTERCEPT_CHOICE_33_0: "Vượt qua vùng đất mở"
STR_INTERCEPT_CHOICE_33_1: "Tiếp tục đến con đường dịch vụ"
STR_INTERCEPT_CHOICE_33_2: "Quay lại và đối mặt với Harris"
STR_INTERCEPT_TITLE_34: "Hoopers Hut"
STR_INTERCEPT_TEXT_34: "Bàn làm việc không có người giám sát. Các giấy tờ nằm dưới một chữ thập phân, và phòng máy xuất hiện trong một lịch trình bằng bút chì."
STR_INTERCEPT_CHOICE_34_0: "Kiểm tra các giấy tờ"
STR_INTERCEPT_CHOICE_34_1: "Chờ Hooper"
STR_INTERCEPT_CHOICE_34_2: "Để Harris đi"
STR_INTERCEPT_TITLE_35: "Vấn đề cờ vua"
STR_INTERCEPT_TEXT_35: "Bạn cho Hooper một vị trí phản ánh tình huống khó khăn của anh ấy: một mảnh bảo vệ, một vị vua bị phơi bày và một động thái trông an toàn cho đến khi trả lời."
STR_INTERCEPT_CHOICE_35_0: "Yêu cầu anh ta thừa nhận kế hoạch"
STR_INTERCEPT_CHOICE_35_1: "Gửi thông báo cho Harris"
STR_INTERCEPT_TITLE_36: "Nếu không có mặt nạ"
STR_INTERCEPT_TEXT_36: "Bạn nói về áp lực thay vì giả vờ rằng nó không bao giờ tồn tại. Hooper trả lời ngắn gọn như một người chứ không phải là một đối thủ."
STR_INTERCEPT_CHOICE_36_0: "Yêu cầu một thỏa thuận trung thực"
STR_INTERCEPT_CHOICE_36_1: "Đề nghị anh ta thú tội"
STR_INTERCEPT_CHOICE_36_2: "Đặt tài khoản cho Harris"
STR_INTERCEPT_TITLE_37: "Hooper thừa nhận"
STR_INTERCEPT_TEXT_37: "Hooper giải thích đủ để kết nối sự tống tiền với thành phần bị mất. Harris bây giờ có thể phục hồi thiết bị và kiểm tra câu chuyện. Bạn phải quyết định liệu bạn có nên kết thúc cuộc điều tra hay để Hooper biến mất."
STR_INTERCEPT_CHOICE_37_0: "Mang Harris sự thừa nhận"
STR_INTERCEPT_CHOICE_37_1: "Hãy để Hooper đi và đi"
STR_INTERCEPT_TITLE_38: "thương mại"
STR_INTERCEPT_TEXT_38: "Bạn đặt đòn bẩy cuối cùng của bạn trong tầm tay của Hooper.Một thỏa thuận mà không có nhân chứng hoặc bằng chứng là một lời mời gọi cho anh ta để giải quyết vấn đề của mình với chi phí của bạn."
STR_INTERCEPT_CHOICE_38_0: "tay trên phần"
STR_INTERCEPT_CHOICE_38_1: "Yêu cầu một thỏa thuận chứng nhân"
STR_INTERCEPT_CHOICE_38_2: "Hủy đề nghị"
STR_INTERCEPT_TITLE_39: "Harry nghe"
STR_INTERCEPT_TEXT_39: "Các chi tiết có thể được kiểm tra. Harris hỏi thành phần hiện đang ở đâu. Làm sạch tài khoản của bạn và làm cho máy chạy là các vấn đề liên quan, nhưng chúng không giống nhau."
STR_INTERCEPT_CHOICE_39_0: "Trả lại những gì trong áo khoác của bạn"
STR_INTERCEPT_CHOICE_39_1: "Giúp phục hồi thành phần"
STR_INTERCEPT_CHOICE_39_2: "Ngừng trả lời ngay bây giờ"
STR_INTERCEPT_TITLE_40: "Bên ngoài hàng rào"
STR_INTERCEPT_TEXT_40: "Tự do bên ngoài địa điểm không giống như sự vô tội, và máy móc là vấn đề cấp bách của người khác bây giờ."
STR_INTERCEPT_TITLE_41: "Sai lầm cuối cùng"
STR_INTERCEPT_TEXT_41: "Lực lượng tuần tra đến với bạn trước khi cuộc chiến mở kết thúc, hoặc lời hứa của Hooper sụp đổ khi nó không còn hữu ích cho anh ta."
STR_INTERCEPT_TITLE_42: "Các giấy tờ"
STR_INTERCEPT_TEXT_42: "Lịch trình đặt Hooper nơi câu chuyện của bạn nói rằng anh ta đang ở. Bên cạnh đó là ghi chú đầu tiên kéo bạn vào bẫy."
STR_INTERCEPT_CHOICE_42_0: "Đưa giấy tờ cho Harris"
STR_INTERCEPT_CHOICE_42_1: "Chờ đợi và đối đầu với Hooper"
STR_INTERCEPT_TITLE_43: "Một thỏa thuận cuối cùng"
STR_INTERCEPT_TEXT_43: "Tin tưởng anh ta sẽ loại bỏ một vấn đề ngay lập tức; làm cho Harris một nhân chứng sẽ khiến việc tạo ra một vấn đề khác trở nên khó khăn hơn."
STR_INTERCEPT_CHOICE_43_0: "Sắp xếp một sự trở lại của nhân chứng"
STR_INTERCEPT_CHOICE_43_1: "Đưa Harris vào kế hoạch"
STR_INTERCEPT_TITLE_44: "Lấy lại cái thật"
STR_INTERCEPT_TEXT_44: "Với tài khoản được ghi lại, tìm kiếm trở về phần cứng bị thiếu. Harris kiểm tra phòng máy trong khi bạn xác định nơi thành phần nên ở."
STR_INTERCEPT_CHOICE_44_0: "Hoàn thành việc hoàn trả đã xác minh"
STR_INTERCEPT_CHOICE_44_1: "Lấy nó ra khỏi áo khoác của bạn"
STR_INTERCEPT_CHOICE_44_2: "Harris cảnh báo Hooper"
STR_INTERCEPT_TITLE_45: "Câu hỏi cuối cùng"
STR_INTERCEPT_TEXT_45: "Harris chờ đợi.Nếu bạn có thể kết nối Hooper với vụ trộm, vẫn còn một cách để khôi phục thành phần và kết thúc điều này đúng cách.Nếu không, cuộc điều tra chỉ có tài khoản thay đổi của bạn."
