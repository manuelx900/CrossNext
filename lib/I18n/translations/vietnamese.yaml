STR_FLASHCARDS_HELP: "Sao chép các bộ bài Anki (.apk /.colpkg , .anki2 /.anki21 ), CSV /TSV/text hoặc đã chuyển đổi các thư mục Nghiên cứu thành /FLASHCARDS. Sử dụng các thư mục con: mỗi thư mục lên tới 128 mục.\n\nNhập khẩu chấp nhận thẻ văn bản cloze Cơ bản, đảo ngược và đơn giản. Âm thanh và HTML tùy chỉnh không được hỗ trợ. Chuyển đổi hình ảnh bộ bài /CJK trước. Đánh giá ngoại tuyến sử dụng FSRS. Quá trình nhập sẽ bắt đầu một lịch trình mới và giữ lại các bản gốc."
