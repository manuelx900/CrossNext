STR_MYST_GUIDE_SETTING: "Công viên Bletchley, 1942"
STR_MYST_GUIDE_OBJECTIVE_COPY: "Một phần của Bombe, một máy phá mã, đang mất tích. Bạn đang bị nghi ngờ. Giải thích những gì đã xảy ra, tìm bằng chứng và quyết định ai để tin tưởng. lựa chọn của bạn dẫn đến kết thúc khác nhau."
STR_MYST_GUIDE_YOU: "Bạn: người giải mã"
STR_MYST_GUIDE_YOU_ROLE: "Nhân vật bạn kiểm soát"
STR_MYST_GUIDE_YOU_COPY: "Bạn giải mã tin nhắn bí mật. Hooper tống tiền bạn để lấy một thành phần Bombe. Bạn bắt đầu khóa trong Hut 14, với phần và một thông điệp bị chặn trong áo khoác của bạn."
STR_MYST_GUIDE_HARRIS: "Harris"
STR_MYST_GUIDE_HARRIS_ROLE: "Nhà điều tra"
STR_MYST_GUIDE_HARRIS_COPY: "Harris hỏi bạn về thành phần bị thiếu. Anh ta kiểm tra tài khoản của bạn chống lại danh sách nhiệm vụ và các bằng chứng khác. anh ấy là người bạn phải thuyết phục; một lời buộc tội không chứng minh bất cứ điều gì."
STR_MYST_GUIDE_HOOPER: "Hooper"
STR_MYST_GUIDE_HOOPER_ROLE: "đồng nghiệp và tống tiền"
STR_MYST_GUIDE_HOOPER_COPY: "Hooper cũng làm việc tại Bletchley Park. Ông đã gây áp lực cho bạn để lấy thành phần và có lợi ích riêng của mình. Bạn có thể đặt câu hỏi cho anh ta, đàm phán hoặc tìm kiếm bằng chứng. Biết vai trò của anh ấy không nói với bạn lựa chọn nào là an toàn."
STR_MYST_GUIDE_CHOICES: "Đọc, sau đó chọn một câu trả lời hoặc hành động. Không có giới hạn thời gian."
