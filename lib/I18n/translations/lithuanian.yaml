STR_QUEST_CAM_JOURNEY2_BOOK_6: "Laikrodžio mechanizmo citadelė"
STR_QUEST_CAM_JOURNEY2_BOOK_7: "Mėnulio rūmai"
STR_QUEST_CAM_JOURNEY2_BOOK_8: "Dievų sodas"
STR_QUEST_CAM_JOURNEY2_BOOK_9: "Karas už knygas"
STR_QUEST_CAM_JOURNEY2_BOOK_10: "Žvaigždžių kelias"
STR_QUEST_CAM_JOURNEY2_BOOK_11: "Paskutinis puslapis"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Nugalėję užmaršties karalių, grįžtate namo. Jo kariuomenė nebegali sunaikinti knygų, o žmonės vėl ramiai skaito. Jūs išsaugojote pasaulio istorijas. Dar liko daug knygų, kurias reikia atrasti."
