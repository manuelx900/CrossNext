STR_INTERCEPT_TITLE_0: "Namas 14"
STR_INTERCEPT_TEXT_0: "Bletchley parkas, 1942 m. Jie laukia už užrakintų durų. Iš skaičiavimo mašinos sudedamoji dalis dingo. Ryte perimti rūdžius savo striukės kišenėje. Lauke, pėdos sustoja."
STR_INTERCEPT_CHOICE_0_0: "Pagalvokite apie kaltinimus"
STR_INTERCEPT_CHOICE_0_1: "Laukite interviu"
STR_INTERCEPT_CHOICE_0_2: "Ieškokite savo striukės"
STR_INTERCEPT_TITLE_1: "Apkaltinimas"
STR_INTERCEPT_TEXT_1: "Jie įtaria išdavystę. Jūs išsprendžiate figūras, kryžiažodžius ir šachmatų pozicijas, kad galėtumėte gyventi. Šis kambarys yra dar viena problema: prieštaraukite sau, o jūsų patikimumas gali būti pirmoji auka."
STR_INTERCEPT_CHOICE_1_0: "Pasirinkite strategiją"
STR_INTERCEPT_CHOICE_1_1: "Išgirsk, ką žinai"
STR_INTERCEPT_TITLE_2: "Atvyksta Haris"
STR_INTERCEPT_TEXT_2: "Harris įeina su arbatos puodeliu ir failu. Iš bombos trūksta ritinio. Jūsų vardas buvo pareigų sąraše. Jis uždeda puodelį šalia jūsų ir klausia, kur jūs buvai praėjusią naktį."
STR_INTERCEPT_CHOICE_2_0: "Gerkite arbatą"
STR_INTERCEPT_CHOICE_2_1: "Palikite arbatą nepaliestą"
STR_INTERCEPT_CHOICE_2_2: "Atsakyti ramiai"
STR_INTERCEPT_TITLE_3: "Komponentas"
STR_INTERCEPT_TEXT_3: "Viduje savo striukės apmušalai jūsų pirštai susiduria su šaltu metalu. Komponentas vis dar ten. Hooper sakė, kad jį imant būtų sustabdyti šantažą."
STR_INTERCEPT_CHOICE_3_0: "Laikykite jį paslėptą"
STR_INTERCEPT_CHOICE_3_1: "Padėk tai Harris"
STR_INTERCEPT_TITLE_4: "Nugalėtojo žaidimas"
STR_INTERCEPT_TEXT_4: "Bendradarbiavimas gali išsaugoti jūsų patikimumą. Įtikinamas melas galėtų nusipirkti laiko. Pabėgimas pakeistų užrakintą kambarį už sargybinių lauke."
STR_INTERCEPT_CHOICE_4_0: "bendradarbiauti"
STR_INTERCEPT_CHOICE_4_1: "Sukurkite alibi"
STR_INTERCEPT_CHOICE_4_2: "Apžiūrėkite – Langas"
STR_INTERCEPT_TITLE_5: "Arbatos"
STR_INTERCEPT_TEXT_5: "Haris pastebi jūsų tylą, bet jo veidas jau atsitraukia.Kai kitą kartą atidarysite akis, prie stalo stovi dar viena batų pora."
STR_INTERCEPT_CHOICE_5_0: "Nustokite apsimesti užmigę"
STR_INTERCEPT_CHOICE_5_1: "Lyginti lankytoją"
STR_INTERCEPT_CHOICE_5_2: "Paprašykite vandens"
STR_INTERCEPT_TITLE_6: "Mažas atsisakymas"
STR_INTERCEPT_TEXT_6: "Jūs stumiate puodelį.Haris atidžiau stebi judėjimą nei atsakymą.Jis klausia, ar yra kas nors kitas, kurį jis turėtų apklausti."
STR_INTERCEPT_CHOICE_6_0: "Paklauskite, kokius įrodymus jis turi"
STR_INTERCEPT_CHOICE_6_1: "Žymė Hooper"
STR_INTERCEPT_CHOICE_6_2: "Žvilgsnis į langą"
STR_INTERCEPT_TITLE_7: "Trūksta tikrosios"
STR_INTERCEPT_TEXT_7: "Harris nori tiesioginio atsakymo. ar paėmėte komponentą? Galite jam pasakyti, kas yra jūsų striukėje, paaiškinti spaudimą Hooperui arba pabandyti nurodyti kaltinimą kitur."
STR_INTERCEPT_CHOICE_7_0: "Suteikite jam komponentą"
STR_INTERCEPT_CHOICE_7_1: "Paaiškino šantažą"
STR_INTERCEPT_CHOICE_7_2: "Apkaltino Hooperį"
STR_INTERCEPT_TITLE_8: "Metalas ant stalo"
STR_INTERCEPT_TEXT_8: "Komponentas yra tarp jūsų. Harris patikrina jį be atsipalaidavimo. Grąžinant pavogtą įrangą nepaaiškina, kodėl ji buvo paimta."
STR_INTERCEPT_CHOICE_8_0: "Siūlo rasti įrodymų"
STR_INTERCEPT_CHOICE_8_1: "Pasilikite ir atsakykite į klausimus"
STR_INTERCEPT_TITLE_9: "Alibi"
STR_INTERCEPT_TEXT_9: "Jūs apibūdinate tylų vakarą prie savo stalo.Haris atidaro failą.Vagis pamatė jus paliekant mašinų kambarį.Jūsų išrastas sąskaita dabar turi liudytoją prieš tai."
STR_INTERCEPT_CHOICE_9_0: "Ginti istoriją"
STR_INTERCEPT_CHOICE_9_1: "Pripažįsta šantažą"
STR_INTERCEPT_CHOICE_9_2: "Atsisakyti papildomų klausimų"
STR_INTERCEPT_TITLE_10: "langą"
STR_INTERCEPT_TEXT_10: "Langas aukštas, o stiklas storas.Už jo kelias veda pro kitą namelį.Sugriauti būtų garsiai; laukimas čia turi savo pavojų."
STR_INTERCEPT_CHOICE_10_0: "Išardykite stiklą"
STR_INTERCEPT_CHOICE_10_1: "Išnagrinėkite kelią išorėje"
STR_INTERCEPT_CHOICE_10_2: "Grįžti į interviu"
STR_INTERCEPT_TITLE_11: "Kitas lankytojas"
STR_INTERCEPT_TEXT_11: "Hooperas atvyko, kol jūs esate nestabilus. Jis nori žinoti, ar Harris turi komponentą."
STR_INTERCEPT_CHOICE_11_0: "Veiksmas kaip miegas"
STR_INTERCEPT_CHOICE_11_1: "Prašo paaiškinimo"
STR_INTERCEPT_CHOICE_11_2: "Paprašykite vandens"
STR_INTERCEPT_TITLE_12: "Įspėjimas"
STR_INTERCEPT_TEXT_12: "Jūs skambinate Harris prieš arbatą. jis grįžta, sudirgęs. kaltinimas apie puodelį reikės kažko, ką jis gali išbandyti."
STR_INTERCEPT_CHOICE_12_0: "Laikykite taurę kaip įrodymą"
STR_INTERCEPT_CHOICE_12_1: "Apkaltino Harisą nuodijant tave"
STR_INTERCEPT_CHOICE_12_2: "Sutelkite dėmesį į realius"
STR_INTERCEPT_TITLE_13: "Vilties"
STR_INTERCEPT_TEXT_13: "Harris atpažįsta vardą. „Hooper“ yra naudingas, gerai susijęs ir taip pat nėra praleistas iš praėjusios nakties sąrašo."
STR_INTERCEPT_CHOICE_13_0: "Suraskite ką nors patikrinamo"
STR_INTERCEPT_CHOICE_13_1: "Įsitikinkite, kad Hooper jį pavogė"
STR_INTERCEPT_TITLE_14: "Juodasis laiškas"
STR_INTERCEPT_TEXT_14: "Jūs apibūdinate jaunuolį, išduotą pasitikėjimą ir reikalavimą, kuris sekė.Haris klausosi be jūsų pagalbos.Pavadinimas asmens, kuris įdėjo spąstus, taip pat gali atskleisti asmenį, kurį tikėjotės apsaugoti."
STR_INTERCEPT_CHOICE_14_0: "Suteikite Haris visą sąskaitą"
STR_INTERCEPT_CHOICE_14_1: "Palikite vardus"
STR_INTERCEPT_CHOICE_14_2: "Siūlykite būdą, kaip sugauti Hooper"
STR_INTERCEPT_TITLE_15: "Lengvas kaltinimas"
STR_INTERCEPT_TEXT_15: "Hooper, jūs sakote, turi būti atsakingas.Haris klausia, kaip žinote.Yra skirtumas tarp problemos sprendimo ir liudytojo, kuris gali įrodyti atsakymą."
STR_INTERCEPT_CHOICE_15_0: "Leiskite Haris ginčyti pretenziją"
STR_INTERCEPT_CHOICE_15_1: "Pabandykite siųsti privatų pranešimą Hooper"
STR_INTERCEPT_TITLE_16: "Išbandyti raktą"
STR_INTERCEPT_TEXT_16: "Istoriją galima paneigti. dokumentą, liudytoją ar trūkstamą komponentą sunkiau paaiškinti."
STR_INTERCEPT_CHOICE_16_0: "Apžiūrėkite – Netoliese esanti kajutė"
STR_INTERCEPT_CHOICE_16_1: "Naudokite ryto interceptą"
STR_INTERCEPT_CHOICE_16_2: "Klausimas Hooper tiesiogiai"
STR_INTERCEPT_TITLE_17: "Daugiau nei grįžimas"
STR_INTERCEPT_TEXT_17: "Mašina gali vėl veikti, tačiau Harris vis dar turi saugumo pažeidimą paaiškinti."
STR_INTERCEPT_CHOICE_17_0: "Parodykite įrodymus"
STR_INTERCEPT_CHOICE_17_1: "Ieškoti įrodymų"
STR_INTERCEPT_CHOICE_17_2: "Priimkite jo sprendimą"
STR_INTERCEPT_TITLE_18: "Prieštaravimas"
STR_INTERCEPT_TEXT_18: "Harris nustato savo pirmąjį atsakymą šalia savo paskutiniojo.Jie negali būti tiesa.Galite atsisakyti melą, arba leiskite interviu baigtis prieštaravimu."
STR_INTERCEPT_CHOICE_18_0: "Pasakyk tiesą apie šantažą"
STR_INTERCEPT_CHOICE_18_1: "Visada viską neigia"
STR_INTERCEPT_CHOICE_18_2: "Pabandykite išeiti"
STR_INTERCEPT_TITLE_19: "tylos"
STR_INTERCEPT_TEXT_19: "Harris uždaro failą.Šioje patalpoje tyla nesibaigia tyrimu; ji tik baigiasi jūsų dalimi jį nukreipti."
STR_INTERCEPT_CHOICE_19_0: "Išgirskite sprendimą"
STR_INTERCEPT_TITLE_20: "Sumažintas stiklas"
STR_INTERCEPT_TEXT_20: "Šaltasis oras ir sargybos švilpukas ateina kartu.Vienam sprendimui yra laikas, kol kas nors pasiekia duris."
STR_INTERCEPT_CHOICE_20_0: "Bėgimas išoriniu keliu"
STR_INTERCEPT_CHOICE_20_1: "Palikite koduojamą clue"
STR_INTERCEPT_CHOICE_20_2: "Pasilik ir paaiškink"
STR_INTERCEPT_TITLE_21: "Tarp kajutės"
STR_INTERCEPT_TEXT_21: "Hooperio kajutė yra pakankamai arti, kad pasiektų prieš kitą patrulį, tačiau atvira žemė už jos siūlo kitokią galimybę."
STR_INTERCEPT_CHOICE_21_0: "Pabandykite pabėgti nuo priežasčių"
STR_INTERCEPT_CHOICE_21_1: "Eikite į Hooper's Cabin"
STR_INTERCEPT_CHOICE_21_2: "Grįžti į Haris"
STR_INTERCEPT_TITLE_22: "Privatus žaidimas"
STR_INTERCEPT_TEXT_22: "Ant stalo jis išdėsto įsivaizduojamą šachmatų poziciją pirštais.Kodiruotas atsakymas gali padaryti jį atskleisti, ką tiesioginis kaltinimas niekada nebūtų."
STR_INTERCEPT_CHOICE_22_0: "Atsakymas su šachmatų ženklu"
STR_INTERCEPT_CHOICE_22_1: "Grėsė jį pavadinti"
STR_INTERCEPT_CHOICE_22_2: "Kalbėk sąžiningai"
STR_INTERCEPT_TITLE_23: "Veidas į veidą"
STR_INTERCEPT_TEXT_23: "Jo pasitikėjimas silpnėja tik tada, kai paminite detales, kurių kažkas už jo plano ribų neturėtų žinoti."
STR_INTERCEPT_CHOICE_23_0: "Susidraugauti su įrodymais"
STR_INTERCEPT_CHOICE_23_1: "Siūlykite komponentą kaip prekybą"
STR_INTERCEPT_CHOICE_23_2: "blufų"
STR_INTERCEPT_TITLE_24: "Taurė"
STR_INTERCEPT_TEXT_24: "Hooperas atneša vandenį, bet pirmiausia pasiekia arbatinį puodelį."
STR_INTERCEPT_CHOICE_24_0: "Laikykite puodelį"
STR_INTERCEPT_CHOICE_24_1: "Patikrinkite savo striukę dar kartą"
STR_INTERCEPT_TITLE_25: "Kažką išbandyti"
STR_INTERCEPT_TEXT_25: "Jūs išlaikote puodelį ir paprašysite Harris jį ištirti.Tai galiausiai yra kaltinimas su objektu, pritvirtintu prie jo.Hooper bandymas pašalinti jį suteikia antrą naudingą detalę."
STR_INTERCEPT_CHOICE_25_0: "Suteik Haris taurę"
STR_INTERCEPT_CHOICE_25_1: "Konfrontuoti Hooper su juo"
STR_INTERCEPT_TITLE_26: "Netinkamas tikslas"
STR_INTERCEPT_TEXT_26: "Jūs kaltinate Harris be įrodymų.Jis mato įtariamąjį, bandantį diskredituoti tyrėją.Kad ir kas nutiktų arbatai, jums sunku jam patikėti jumis."
STR_INTERCEPT_CHOICE_26_0: "Interviu baigėsi"
STR_INTERCEPT_TITLE_27: "Visa sąskaita"
STR_INTERCEPT_TEXT_27: "Jūs duodate vardus ir apibūdinate susitikimą.Haris užduoda tikslius klausimus.Jūsų gėda yra tikra, bet taip pat ir detalės, kurias jis dabar gali patikrinti."
STR_INTERCEPT_CHOICE_27_0: "Patikrinkite sąskaitą"
STR_INTERCEPT_CHOICE_27_1: "Ieškoti pasiūlymų Hooper"
STR_INTERCEPT_TITLE_28: "Nesėkmingas sukčiavimas"
STR_INTERCEPT_TEXT_28: "Harris girdėjo pakankamai pasitikinčių atsakymų. Hooper taip pat turi. Nei teikia faktą, kad jūsų istorija trūksta."
STR_INTERCEPT_CHOICE_28_0: "Tęsti pretenziją"
STR_INTERCEPT_CHOICE_28_1: "Padarykite beviltišką pabėgimą"
STR_INTERCEPT_CHOICE_28_2: "Pripažinkite, kas iš tikrųjų atsitiko"
STR_INTERCEPT_TITLE_29: "Intercepcijos"
STR_INTERCEPT_TEXT_29: "Jūsų kišenėje esantis lakštas nešioja daugiau negu sulankstytus laiškus: jo maršrutas per namelius Hooperą įdeda šalia mašinos."
STR_INTERCEPT_CHOICE_29_0: "Užkoduoti žinutę Hooperiui"
STR_INTERCEPT_CHOICE_29_1: "Rodyti maršrutą į Harris"
STR_INTERCEPT_TITLE_30: "Mašina bėga"
STR_INTERCEPT_TEXT_30: "Harris turi komponentą ir takelį, kuris veda už jūsų pirmųjų išsigandusių atsakymų. „Bombe“ atnaujina savo darbą. Jūs paliekate „Hut 14“ savo vardu, su mažiau paslapčių ir ateityje dar reikia atsakyti."
STR_INTERCEPT_TITLE_31: "Pagal įtarimą"
STR_INTERCEPT_TEXT_31: "Grąžinant komponentą mašina išgelbėjo nuo vėlavimo. Tai neišsaugojo jūsų pozicijos. Harris nutraukia prieigą prie kaimų, o tyrimas tęsiasi. Jūs išgyvenote interviu, bet nepašalina savo vardo."
STR_INTERCEPT_TITLE_32: "Prieglobstyje"
STR_INTERCEPT_TEXT_32: "Prieštaravimai, trūksta įrodymų ir pavogtas komponentas tapo atvejais, kurių nebegalite nukreipti."
STR_INTERCEPT_TITLE_33: "Išorinis kelias"
STR_INTERCEPT_TEXT_33: "Jūs paliekate namelius už nugaros. Tamsa yra naudinga, bet laukas yra saugomas. Sugedęs langas privedė patrulius arčiau nei tikėjotės."
STR_INTERCEPT_CHOICE_33_0: "Peržengė atvirą žemę"
STR_INTERCEPT_CHOICE_33_1: "Laikykitės paslaugų kelio"
STR_INTERCEPT_CHOICE_33_2: "Atsigręžk ir atsisuk Haris"
STR_INTERCEPT_TITLE_34: "Hooperio skrybėlė"
STR_INTERCEPT_TEXT_34: "Stalas yra be priežiūros. Pranešimai yra po kryžiažodžiu, o mašinų salė pasirodo rašomuoju grafiku."
STR_INTERCEPT_CHOICE_34_0: "Išnagrinėkite dokumentus"
STR_INTERCEPT_CHOICE_34_1: "Laukite Hooper"
STR_INTERCEPT_CHOICE_34_2: "Išvyka į Harį"
STR_INTERCEPT_TITLE_35: "Šachmatų problema"
STR_INTERCEPT_TEXT_35: "Jūs suteikiate Hooper poziciją, kuri atspindi jo sunkumus: apsaugotą gabalėlį, atskleistą karalių ir judėjimą, kuris atrodo saugus, kol atsakymas."
STR_INTERCEPT_CHOICE_35_0: "Paprašykite jo pripažinti planą"
STR_INTERCEPT_CHOICE_35_1: "Siųskite priėmimą į Haris"
STR_INTERCEPT_TITLE_36: "Be kaukės"
STR_INTERCEPT_TEXT_36: "Jūs kalbate apie spaudimą, o ne apsimesti, kad jis niekada neegzistavo. Hooper trumpai atsako kaip asmuo, o ne kaip priešininkas."
STR_INTERCEPT_CHOICE_36_0: "Prašykite sąžiningo susitarimo"
STR_INTERCEPT_CHOICE_36_1: "Paprašykite jo prisipažinti"
STR_INTERCEPT_CHOICE_36_2: "Atsiskaitykite su Haris"
STR_INTERCEPT_TITLE_37: "Hoopers pripažinimas"
STR_INTERCEPT_TEXT_37: "Hooper paaiškina pakankamai, kad susietų šantažą su trūkstamu komponentu.Haris dabar gali atgauti įrangą ir patikrinti istoriją.Jūs turite nuspręsti, ar užbaigti tyrimą, ar leisti Hooper išnykti."
STR_INTERCEPT_CHOICE_37_0: "Atneškite Harris pripažinimą"
STR_INTERCEPT_CHOICE_37_1: "Leiskite Hooper eiti ir išeiti"
STR_INTERCEPT_TITLE_38: "Prekyba"
STR_INTERCEPT_TEXT_38: "Jūs įdėjote savo paskutinį sverto gabalėlį Hooper'o rankose.Sutartis be liudytojų ar įrodymų yra kvietimas jam išspręsti savo problemą jūsų sąskaita."
STR_INTERCEPT_CHOICE_38_0: "Rankos virš komponento"
STR_INTERCEPT_CHOICE_38_1: "Reikalauja liudytojo susitarimo"
STR_INTERCEPT_CHOICE_38_2: "Atšaukti pasiūlymą"
STR_INTERCEPT_TITLE_39: "Haris klausosi"
STR_INTERCEPT_TEXT_39: "Detales galima patikrinti.Haris klausia, kur komponentas yra dabar.Kontos išvalymas ir mašinos paleidimas yra susijusios problemos, tačiau jos nėra tos pačios."
STR_INTERCEPT_CHOICE_39_0: "Grąžinkite tai, kas yra jūsų striukėje"
STR_INTERCEPT_CHOICE_39_1: "Padėti atkurti komponentą"
STR_INTERCEPT_CHOICE_39_2: "Nustokite atsakyti dabar"
STR_INTERCEPT_TITLE_40: "Virš tvoros"
STR_INTERCEPT_TEXT_40: "Laisvė už žemės ribų nėra tas pats, kas nekaltybė, o mašina dabar yra kažkieno kitos skubi problema."
STR_INTERCEPT_TITLE_41: "Paskutinė klaida"
STR_INTERCEPT_TEXT_41: "Patrulis pasieks jus prieš atviros žemės pabaigos, arba Hooper pažadas žlunga, kai jis nebėra naudingas jam."
STR_INTERCEPT_TITLE_42: "Dokumentų"
STR_INTERCEPT_TEXT_42: "Planavimas įdeda Hooperą ten, kur jūsų istorija sakė, kad jis buvo. Be to, tai yra pastaba, kuri pirmiausia atvedė jus į spąstus."
STR_INTERCEPT_CHOICE_42_0: "Paimkite dokumentus į Haris"
STR_INTERCEPT_CHOICE_42_1: "Laukti ir susidurti su Hooper"
STR_INTERCEPT_TITLE_43: "Paskutinis susitarimas"
STR_INTERCEPT_TEXT_43: "Pasitikėjimas juo pašalintų vieną tiesioginę problemą; padarydamas Harris liudytoju būtų sunkiau sukurti kitą."
STR_INTERCEPT_CHOICE_43_0: "Ruoškite liudytojo sugrįžimą"
STR_INTERCEPT_CHOICE_43_1: "Įtraukite Haris į planą"
STR_INTERCEPT_TITLE_44: "Atgauti tikrąjį"
STR_INTERCEPT_TEXT_44: "Kai sąskaita užregistruota, paieška grįžta į trūkstamą aparatūrą.Harris tikrina mašinų kambarį, o jūs nustatysite, kur turėtų būti komponentas."
STR_INTERCEPT_CHOICE_44_0: "Užbaigti patikrintą grąžinimą"
STR_INTERCEPT_CHOICE_44_1: "Paimkite jį iš savo striukės"
STR_INTERCEPT_CHOICE_44_2: "Įspėkite Haris apie Hooper"
STR_INTERCEPT_TITLE_45: "Galutinis klausimas"
STR_INTERCEPT_TEXT_45: "Harris laukia. Jei galite prijungti Hooperą prie vagystės, vis dar yra būdas atkurti komponentą ir tinkamai jį užbaigti."
STR_INTERCEPT_CHOICE_45_0: "Pateikite įrodymus"
STR_INTERCEPT_CHOICE_45_1: "Pripažinkite, kad daugiau nieko neturite"
