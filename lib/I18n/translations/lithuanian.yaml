STR_QUEST_CAM_DECOR_NAME_0: "Miško fėja"
STR_QUEST_CAM_DECOR_TEXT_0: "Išlaisvinai fėją iš tylių šaknų. Ji atneš mažą stebuklą į jūsų namus."
STR_QUEST_CAM_SOLO_DECOR_NAME_1: "Miško žibintas"
STR_QUEST_CAM_SOLO_DECOR_TEXT_1: "Žibintas jūsų skaitymo kampeliui apšviesti."
STR_QUEST_CAM_DECOR_NAME_2: "Echo Conch"
STR_QUEST_CAM_DECOR_TEXT_2: "Išgelbėtas jūreivis dovanoja kriauklę, kurioje tebelaikoma jūros giesmė."
STR_QUEST_CAM_DECOR_NAME_3: "Rašalo spiritas"
STR_QUEST_CAM_DECOR_TEXT_3: "Dvasia pabėgo iš tuščio puslapio. Jis pasirenka keliauti su jumis."
STR_QUEST_CAM_DECOR_NAME_4: "Mėnulio gėlė"
STR_QUEST_CAM_DECOR_TEXT_4: "Sodininkai išsaugojo vieną sėklą iš miegančio sodo. Ši gėlė užaugo tau."
STR_QUEST_CAM_DECOR_NAME_5: "Žiemos kristalas"
STR_QUEST_CAM_DECOR_TEXT_5: "Atšilimas atskleidžia kristalą, kuriame saugomas paskutinis kalno prisiminimas."
STR_QUEST_CAM_DECOR_NAME_6: "Pelėda su laikrodžiu"
STR_QUEST_CAM_DECOR_TEXT_6: "Laikrodininkas suremontuoja šį mažą globėją, kad padėkotų jums už sugrąžintą laiką."
STR_QUEST_CAM_DECOR_NAME_7: "Fenikso plunksna"
STR_QUEST_CAM_DECOR_TEXT_7: "Iš atgautų pelenų kyla plunksna: pažadas, kad istorijos gali prasidėti iš naujo."
STR_QUEST_CAM_DECOR_NAME_8: "Dykumos lempa"
STR_QUEST_CAM_DECOR_TEXT_8: "Pasakotojas suteikia jums lempą, kuri išlaikė dykumos pasakas."
STR_QUEST_CAM_DECOR_NAME_9: "Debesis Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "Atidarote debesų narvą. Mažas koi lieka stebėti jūsų svajones."
STR_QUEST_CAM_DECOR_NAME_10: "Drakono širdis"
STR_QUEST_CAM_DECOR_TEXT_10: "Drakonai patiki jums kristalą, gimusį iš atgautos atminties."
STR_QUEST_CAM_DECOR_NAME_11: "Atminties žvaigždė"
STR_QUEST_CAM_DECOR_TEXT_11: "Pirmoji atkurta žvaigždė nušviečia jūsų kelią link paskutinių puslapių."
STR_QUEST_CAM_DECOR_NAME_12: "Skaitymo daigas"
STR_QUEST_CAM_DECOR_TEXT_12: "Mažas augalas ramiam skaitymo kampeliui."
STR_QUEST_CAM_DECOR_NAME_13: "Išsaugotos knygos"
STR_QUEST_CAM_DECOR_TEXT_13: "Istorijos laukia kito skaitytojo."
STR_QUEST_CAM_DECOR_NAME_14: "Voyager reklamjuostė"
STR_QUEST_CAM_DECOR_TEXT_14: "Vimpelis, skirtas prisiminti kiekvieną naują pradžią."
STR_QUEST_CAM_DECOR_NAME_15: "Mėnulio grybai"
STR_QUEST_CAM_DECOR_TEXT_15: "Dalelė miško jūsų namams."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Nuotykių pradžia"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Daugelį metų žmonės gyveno ramiai ir mėgavosi savo knygomis. Tada užmaršties karalius pradėjo juos naikinti. Jis norėjo, kad visi neskaitytų ir visos istorijos išnyktų amžiams."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Karaliaus monstrai"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Užmaršties karalius išsiuntė savo monstrus į visą pasaulį. Jie sunaikino kiekvieną rastą knygą ir užpuolė visus, kurie bandė juos sustabdyti. Bibliotekos pradėjo nykti, žmonės nustojo skaityti."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Skaitymo galia"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Vieną dieną, kai skaitai netoli savo kaimo, pasirodo pabaisa. Bandai išsisukti, bet nutinka kažkas stebinančio: kuo daugiau skaitai, tuo jis silpnėja. Jūs suprantate, kad skaitymas yra vienintelis būdas kovoti su karaliaus magija."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Jūsų misija"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Jūs nusprendėte sustabdyti karalių. Pakeliui į jo pilį turite kirsti miškus, miestus, kalnus ir kitas vietas, pilnas priešų. Kiekviena pabaisa, kurią nugalite, jus šiek tiek priartina. Skaitykite toliau, nugalėkite jo globėjus ir pasiekite jį, kol jis nesunaikins kiekvienos pasaulio knygos."
STR_QUEST_CAM_JOURNEY2_BOOK_0: "Monstrų miškas"
STR_QUEST_CAM_JOURNEY2_BOOK_1: "Miestas be knygų"
STR_QUEST_CAM_JOURNEY2_BOOK_2: "Miglos uostas"
STR_QUEST_CAM_JOURNEY2_BOOK_3: "Biblioteka po jūra"
STR_QUEST_CAM_JOURNEY2_BOOK_4: "Aidų kalnai"
