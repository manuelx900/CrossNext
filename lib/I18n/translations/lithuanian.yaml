STR_CAR_INTRO: "Kaltė ir sąžiningumas yra nepriklausomi. Kiekvienas atvejis turi tiksliai vieną sprendimą. Aukštai yra fiktyvūs charakterio bruožai."
STR_CAR_HELP_TEXT: "Kaip išspręsti bylą\nKiekvienas veikėjas pateikia vieną teiginį. Ekrano viršuje rodomas tikslus kaltininkų ir klaidingų teiginių skaičius. Raskite kombinaciją, kuri atitiktų abu skaičius. Kiekviena byla turi vieną sprendimą.\n  \nKaltė nėra sąžiningumas\nNekaltas personažas gali meluoti, o kaltininkas gali pasakyti tiesą. Du melas reiškia, kad tiksliai du visi teiginiai yra neteisingi; kiti yra teisingi. Tiesos / melo ženklai nurodo pareiškimą; įtariamasis nurodo kaltę.\n  \nSkaitymas užuominų\n\"A arba B padarė tai (arba abu)\" reiškia, kad bent vienas įvardytas personažas yra kaltas. \"A ir B padarė tai\" reikalauja abiejų. Melas neigia visą teiginį: melas OR reiškia, kad nei vienas nepadarė to; melas AND reiškia, kad bent vienas nepadarė to.\n  \n\"Tiek tiesa, tiek melas\" lygina teiginius, o ne kaltę. \"Tik vienas meluoja\" reiškia, kad jų teiginiai turi skirtingas tiesos vertes. Šios užuominos gali būti teisingos arba klaidingos.\n  \nKaimynai mažame ekrane\nOriginali apskritoji tvarka yra Panther, Povas, Ryklys, Fox, Bear, Stag, Horse, naudojant tik šio atvejo simbolius. Paskutinis ir pirmas yra kaimynai. Ši programa rašo du vardus tiesiai į kiekvieną kaimyno clue.You niekada nereikia atspėti, kurios kortelės yra šalia portreto. Keisti puslapį ar orientaciją nekeičia clue.\n  \nŪgis ir mityba\nKiekviena kortelė rodo fiktyvų ūgį ir mitybą. \"Kaltininkas yra aukštesnis už mane\" reiškia, kad bent vienas kaltininkas yra aukštesnis už kalbėtoją, nebūtinai visi kaltininkai. Trumpesnis veikia taip pat. Plėšrūnai ir žolėdžiai įkalčiai reiškia, kad bent vienas kaltininkas turi tokią dietą; visaėdžiai skaičiuojami kaip nei vienas. Vardai, aukščiai ir dietos yra patikimi faktai; teiginiai gali meluoti.\n  \nJŪSŲ ANALIZĖ\nNaudokite? / Tiesa / Melas ir Įtariamasis po kiekvienu teiginiu įrašyti hipotezes. Tai yra jūsų pastabos, o ne įrodymai ar automatiniai patikrinimai. Rodyklės rodo kitus simbolius. Portreto režimas rodo iki trijų puslapyje.\n  \nKaltinimo pateikimas\nPaspauskite Apkaltinti ir pasirinkite tiksliai reikiamą kaltininkų skaičių. Tik patvirtinant neteisingą kaltinimą praleidžia vieną gyvenimą. Pradedantysis ir Normalus turi du gyvybes; Išplėstinis ir Ekspertas turi vieną. Teisingas kaltinimas išsprendžia bylą. Kai neliko gyvybių, sprendimas atskleidžiamas.\n  \nKampanija ir pakartojimas\nYra 1,470 bylų. Atvira byla atnaujina dabartinį bandymą arba atidaro kitą po uždarytos bylos. Kampanija leidžia jums pasirinkti bet kurią iš 1,470 bylų bet kokia tvarka nuo pradžios. Pakartotinis paleidimas pradeda naują bandymą išlaikant ankstesnį užbaigimą. Kiekvieno sudėtingumo atveju bylos progresuoja nuo vieno kaltininko iki dviejų, tada nuo mažiau melagių iki daugiau kiekvienoje kaltininko grupėje. Pradedantysis išlaiko vieną kaltininką. Mažesni metimai ateina pirmi, kai skaičiai sutampa. Visos bylos lieka prieinamos. Išsprendus anksčiau išnaudotą bylą ji pakeliama į išspręstą.\n  \nPažanga ir gyvenimai yra saugomi SD kortelėje. Paliekant, miego ar prietaiso paleidimo iš naujo neatkuria gyvybių dabartiniame bandyme. Nepavyko išsaugoti blokuoja rezultatą, kol Retry sėkmingai. Atkurti visus prašo patvirtinimo prieš ištrinant tik Plėšrūnas pažangą."
