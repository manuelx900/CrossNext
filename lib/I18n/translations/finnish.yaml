STR_QUEST_CAM_EXP_CLOSE_WARNING: "Kun suljet kampanjan, voit jatkaa lukemista ja tilausten tekemistä. Toisen kampanjan aloittaminen poistaa tämän profiilin."
STR_QUEST_CAM_DECOR_NAME_0: "Metsäkeiju"
STR_QUEST_CAM_DECOR_TEXT_0: "Vapautitte keijun hiljaisista juurista. Hän tuo pienen ihmeen kotiisi."
STR_QUEST_CAM_SOLO_DECOR_NAME_1: "Metsän lyhty"
STR_QUEST_CAM_SOLO_DECOR_TEXT_1: "Lyhty valaisemaan lukunurkkaasi."
STR_QUEST_CAM_DECOR_NAME_2: "Echo Conch"
STR_QUEST_CAM_DECOR_TEXT_2: "Pelastettu merimies antaa sinulle kuoren, jossa on yhä meren laulu."
STR_QUEST_CAM_DECOR_NAME_3: "Mustehenki"
STR_QUEST_CAM_DECOR_TEXT_3: "Henki pakeni tyhjältä sivulta. Se päättää matkustaa kanssasi."
STR_QUEST_CAM_DECOR_NAME_4: "Kuukukka"
STR_QUEST_CAM_DECOR_TEXT_4: "Puutarhurit pelastivat yhden siemenen makuupuutarhasta. Tämä kukka kasvoi sinulle."
STR_QUEST_CAM_DECOR_NAME_5: "Talvikristalli"
STR_QUEST_CAM_DECOR_TEXT_5: "Sula paljastaa kristallin, joka pitää sisällään viimeisiä muistoja vuoresta."
STR_QUEST_CAM_DECOR_NAME_6: "Kellotyöpöllö"
STR_QUEST_CAM_DECOR_TEXT_6: "Kelloseppä korjaa tämän pienen huoltajan kiittääkseen sinua ajan palauttamisesta."
STR_QUEST_CAM_DECOR_NAME_7: "Feeniksin sulka"
STR_QUEST_CAM_DECOR_TEXT_7: "Talteenotetusta tuhkasta nousee höyhen: lupaus siitä, että tarinat voivat alkaa uudestaan."
STR_QUEST_CAM_DECOR_NAME_8: "Desert Lamp"
STR_QUEST_CAM_DECOR_TEXT_8: "Tarinankertoja antaa sinulle lampun, joka piti aavikon tarinat elossa."
STR_QUEST_CAM_DECOR_NAME_9: "Cloud Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "Avaat pilvihäkin. Pieni koi jää vartioimaan unelmiasi."
STR_QUEST_CAM_DECOR_NAME_10: "Lohikäärmeen sydän"
STR_QUEST_CAM_DECOR_TEXT_10: "Lohikäärmeet uskovat sinulle kristallin, joka on syntynyt heidän palautetusta muististaan."
STR_QUEST_CAM_DECOR_NAME_11: "Muistin tähti"
STR_QUEST_CAM_DECOR_TEXT_11: "Ensimmäinen kunnostettu tähti valaisee tiesi kohti viimeisiä sivuja."
STR_QUEST_CAM_DECOR_NAME_12: "Lukemisen verso"
STR_QUEST_CAM_DECOR_TEXT_12: "Pieni kasvi hiljaiseen lukunurkkaan."
STR_QUEST_CAM_DECOR_NAME_13: "Tallennetut kirjat"
STR_QUEST_CAM_DECOR_TEXT_13: "Tarinat odottavat seuraavaa lukijaansa."
STR_QUEST_CAM_DECOR_NAME_14: "Voyager-banneri"
STR_QUEST_CAM_DECOR_TEXT_14: "Viiri, joka muistaa jokaisen uuden alun."
STR_QUEST_CAM_DECOR_NAME_15: "Kuusienet"
STR_QUEST_CAM_DECOR_TEXT_15: "Pieni pala metsää kotiisi."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Seikkailun alku"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Monien vuosien ajan ihmiset elivät rauhassa ja nauttivat kirjoistaan. Sitten Oblivion kuningas alkoi tuhota heidät. Hän halusi estää kaikkia lukemasta ja saada kaikki tarinat katoamaan ikuisesti."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Kuninkaan hirviöitä"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Oblivion kuningas lähetti hirviöitä ympäri maailmaa. He tuhosivat kaikki löytämänsä kirjat ja hyökkäsivät jokaisen kimppuun, joka yritti pysäyttää heidät. Kirjastot alkoivat kadota, ja ihmiset lopettivat lukemisen."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Lukemisen voima"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Eräänä päivänä, kun luet lähellä kylääsi, hirviö ilmestyy. Yrität paeta, mutta jotain yllättävää tapahtuu: mitä enemmän luet, sitä heikommaksi se tulee. Ymmärrät, että lukeminen on ainoa tapa taistella kuninkaan taikuutta vastaan."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Sinun tehtäväsi"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Päätit pysäyttää kuninkaan. Matkalla hänen linnaansa sinun on ylitettävä metsiä, kaupunkeja, vuoria ja muita vihollisia täynnä olevia paikkoja. Jokainen kukistamasi hirviö vie sinut hieman lähemmäs. Jatka lukemista, voita hänen huoltajansa ja tavoita hänet ennen kuin hän tuhoaa jokaisen kirjan maailmassa."
STR_QUEST_CAM_JOURNEY2_BOOK_0: "Hirviöiden metsä"
STR_QUEST_CAM_JOURNEY2_BOOK_1: "Kaupunki ilman kirjoja"
STR_QUEST_CAM_JOURNEY2_BOOK_2: "Sumun satama"
STR_QUEST_CAM_JOURNEY2_BOOK_3: "Kirjasto meren alla"
STR_QUEST_CAM_JOURNEY2_BOOK_4: "Kaikujen vuoret"
STR_QUEST_CAM_JOURNEY2_BOOK_5: "Hiekkameri"
STR_QUEST_CAM_JOURNEY2_BOOK_6: "Clockwork Citadel"
STR_QUEST_CAM_JOURNEY2_BOOK_7: "Kuun palatsi"
STR_QUEST_CAM_JOURNEY2_BOOK_8: "Jumalien puutarha"
STR_QUEST_CAM_JOURNEY2_BOOK_9: "Sota kirjoista"
STR_QUEST_CAM_JOURNEY2_BOOK_10: "Tähtien polku"
STR_QUEST_CAM_JOURNEY2_BOOK_11: "Viimeinen sivu"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Kun voitat Unohduksen kuninkaan, palaat kotiin. Hänen armeijansa ei voi enää tuhota kirjoja, ja ihmiset lukevat jälleen rauhassa. Olet pelastanut maailman tarinat. Lukuisia kirjoja on vielä jäljellä."
