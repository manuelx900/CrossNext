STR_INTERCEPT_TITLE_0: "HUT 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. He pitävät sinua odottamassa lukitun oven takana. Laskukoneen komponentti on kadonnut. Aamupala kahisee takkitaskussasi. Ulkona askeleet pysähtyvät."
STR_INTERCEPT_CHOICE_0_0: "Mieti syytöstä"
STR_INTERCEPT_CHOICE_0_1: "Odota haastattelijaa"
STR_INTERCEPT_CHOICE_0_2: "Etsi takkisi"
STR_INTERCEPT_TITLE_1: "Syytös"
STR_INTERCEPT_TEXT_1: "He epäilevät maanpetoksesta. Ratkaiset hahmoja, ristisanatehtäviä ja shakkiasentoja elämiseen. Tämä huone on toinen ongelma: ole ristiriidassa itsesi kanssa, ja uskottavuutesi voi olla ensimmäinen uhri."
STR_INTERCEPT_CHOICE_1_0: "Valitse strategia"
STR_INTERCEPT_CHOICE_1_1: "Kuuntele, mitä he tietävät"
STR_INTERCEPT_TITLE_2: "HARRIS SAAPUU"
STR_INTERCEPT_TEXT_2: "Harris astuu sisään teekupin ja viilan kanssa. Bombesta puuttuu kela. Nimesi oli työvuorolistalla. Hän asettaa kupin vierellesi ja kysyy, missä olit viime yönä."
STR_INTERCEPT_CHOICE_2_0: "Juo teetä"
STR_INTERCEPT_CHOICE_2_1: "Jätä tee koskemattomaksi"
STR_INTERCEPT_CHOICE_2_2: "Vastaa rauhallisesti"
STR_INTERCEPT_TITLE_3: "KOMPONENTTI"
STR_INTERCEPT_TEXT_3: "Takin vuorauksen sisällä sormesi kohtaavat kylmää metallia. Komponentti on edelleen olemassa. Hooper sanoi, että sen ottaminen lopettaisi kiristyksen. Nyt lukitulla ovella on eri merkitys."
STR_INTERCEPT_CHOICE_3_0: "Pidä se piilossa"
STR_INTERCEPT_CHOICE_3_1: "Anna se Harrisille"
STR_INTERCEPT_TITLE_4: "VOITTOLEIKKI"
STR_INTERCEPT_TEXT_4: "Yhteistyö voi säilyttää uskottavuutesi. Vakuuttava valhe voi ostaa aikaa. Escape vaihtaisi lukitun huoneen ulkopuolisille vartijoille. Mitään näistä liikkeistä ei voi ottaa takaisin."
STR_INTERCEPT_CHOICE_4_0: "Tee yhteistyötä"
STR_INTERCEPT_CHOICE_4_1: "Keksi alibi"
STR_INTERCEPT_CHOICE_4_2: "Tutki ikkunaa"
STR_INTERCEPT_TITLE_5: "TEE"
STR_INTERCEPT_TEXT_5: "Huone kallistuu. Harris huomaa hiljaisuutesi, mutta hänen kasvonsa ovat jo vetäytymässä. Kun seuraavan kerran avaat silmäsi, toinen kenkäpari seisoo pöydän vieressä."
STR_INTERCEPT_CHOICE_5_0: "Teeskentele jäävasi uneen"
STR_INTERCEPT_CHOICE_5_1: "Kohtaa vierailija"
STR_INTERCEPT_CHOICE_5_2: "Pyydä vettä"
STR_INTERCEPT_TITLE_6: "PIENI KIELTÄMINEN"
STR_INTERCEPT_TEXT_6: "Työnnät kupin pois. Harris seuraa liikettä tarkemmin kuin vastausta. Hän kysyy, onko joku muu, jota hänen pitäisi kuulustella."
STR_INTERCEPT_CHOICE_6_0: "Kysy mitä todisteita hänellä on"
STR_INTERCEPT_CHOICE_6_1: "Mainitse Hooper"
STR_INTERCEPT_CHOICE_6_2: "Katso ikkunaa kohti"
STR_INTERCEPT_TITLE_7: "PUUTTUVA KELA"
STR_INTERCEPT_TEXT_7: "Harris haluaa suoran vastauksen. Otitko komponentin? Voit kertoa hänelle, mitä takissasi on, selittää Hooperin painostuksen tai yrittää osoittaa syytöksen muualle."
STR_INTERCEPT_CHOICE_7_0: "Anna hänelle komponentti"
STR_INTERCEPT_CHOICE_7_1: "Selitä kiristys"
STR_INTERCEPT_CHOICE_7_2: "Syytä Hooperia"
STR_INTERCEPT_TITLE_8: "METALLIA PÖYDÄLLÄ"
STR_INTERCEPT_TEXT_8: "Komponentti on teidän välillänne. Harris tarkistaa sen rentoutumatta. Varastettujen laitteiden palauttaminen ei selitä, miksi ne vietiin. Hän haluaa nimen ja jotain luotettavampaa kuin sinun sanasi."
STR_INTERCEPT_CHOICE_8_0: "Tarjoa todisteita"
STR_INTERCEPT_CHOICE_8_1: "Pysy ja vastaa kysymyksiin"
STR_INTERCEPT_TITLE_9: "ALIBI"
STR_INTERCEPT_TEXT_9: "Kuvailet hiljaista iltaa työpöytäsi ääressä. Harris avaa tiedoston. Vartija näki sinun poistuvan konehuoneesta. Keksimäsi tililläsi on nyt todistaja sitä vastaan."
STR_INTERCEPT_CHOICE_9_0: "Puolusta tarinaa"
STR_INTERCEPT_CHOICE_9_1: "Myönnä kiristys"
STR_INTERCEPT_CHOICE_9_2: "Kieltäytyä lisäkysymyksistä"
STR_INTERCEPT_TITLE_10: "IKKUNA"
STR_INTERCEPT_TEXT_10: "Ikkuna on korkea ja lasit paksut. Sen takana polku vie toisen kotan ohi. Sen rikkominen olisi kovaa; täällä odottamisessa on omat vaaransa."
STR_INTERCEPT_CHOICE_10_0: "Riko lasi"
STR_INTERCEPT_CHOICE_10_1: "Opiskele polkua ulkona"
STR_INTERCEPT_CHOICE_10_2: "Palaa haastatteluun"
STR_INTERCEPT_TITLE_11: "TOINEN VIERAILIJA"
STR_INTERCEPT_TEXT_11: "Hooper on tullut, kun olet epävarma. Hän haluaa tietää, onko Harrisilla komponentti. Hän pitää toista kättä lähellä ovea."
STR_INTERCEPT_CHOICE_11_0: "Teeskentele nukkuvasi"
STR_INTERCEPT_CHOICE_11_1: "Pyydä selitystä"
STR_INTERCEPT_CHOICE_11_2: "Pyydä vettä"
STR_INTERCEPT_TITLE_12: "VAROITUS"
STR_INTERCEPT_TEXT_12: "Soitat Harrisille ennen kuin tee valtaa. Hän palaa ärtyneenä. Cupia koskeva syytös vaatii jotain, jonka hän voi testata."
STR_INTERCEPT_CHOICE_12_0: "Pidä kuppi todisteena"
STR_INTERCEPT_CHOICE_12_1: "Syytä Harrisia myrkyttämisestäsi"
STR_INTERCEPT_CHOICE_12_2: "Keskity kelaan"
STR_INTERCEPT_TITLE_13: "HOOPER"
STR_INTERCEPT_TEXT_13: "Harris tunnistaa nimen. Hooper on hyödyllinen, hyvät yhteydet, eikä myöskään ole poissa eilisillan listasta. Tunnustus ei ole todiste."
STR_INTERCEPT_CHOICE_13_0: "Etsi jotain tarkistettavissa olevaa"
STR_INTERCEPT_CHOICE_13_1: "Vaadi, että Hooper varasti sen"
STR_INTERCEPT_TITLE_14: "KIISTUS"
STR_INTERCEPT_TEXT_14: "Kuvailet nuorta miestä, petettyä luottamusta ja sitä seurannutta vaatimusta. Harris kuuntelee sinua auttamatta. Ansan asettajan nimeäminen saattaa myös paljastaa henkilön, jota toivoit suojeltavasi."
STR_INTERCEPT_CHOICE_14_0: "Anna Harrisille koko tili"
STR_INTERCEPT_CHOICE_14_1: "Jätä nimet pois"
STR_INTERCEPT_CHOICE_14_2: "Ehdota tapa saada Hooper kiinni"
STR_INTERCEPT_TITLE_15: "HELPPO SYYTTÖ"
STR_INTERCEPT_TEXT_15: "Hooperin, sanot, on oltava vastuullinen. Harris kysyy, mistä tiedät. On ero ratkaista ongelma ja tuottaa todistaja, joka voi todistaa vastauksen."
STR_INTERCEPT_CHOICE_15_0: "Anna Harrisin haastaa vaatimus"
STR_INTERCEPT_CHOICE_15_1: "Kokeile yksityisviestiä Hooperille"
STR_INTERCEPT_TITLE_16: "TEESTETTÄVÄ VINKKI"
STR_INTERCEPT_TEXT_16: "Tarina voidaan kieltää. Asiakirja, todistaja tai puuttuva komponentti on vaikeampi selittää pois. Sinulla on vähän aikaa valita, mitä haluat harjoittaa."
STR_INTERCEPT_CHOICE_16_0: "Tarkasta läheinen kota"
STR_INTERCEPT_CHOICE_16_1: "Käytä aamun sieppausta"
STR_INTERCEPT_CHOICE_16_2: "Kysy Hooperilta suoraan"
STR_INTERCEPT_TITLE_17: "ENEMMÄN KUIN PALAUTUS"
STR_INTERCEPT_TEXT_17: "Kone voi toimia taas, mutta Harrisilla on vielä selitettävä tietoturvaloukkaus. Hän tarjoaa sinulle viimeisen tilaisuuden selvittää, kuka sen järjesti."
STR_INTERCEPT_CHOICE_17_0: "Näytä todisteet"
STR_INTERCEPT_CHOICE_17_1: "Etsi todisteita"
STR_INTERCEPT_CHOICE_17_2: "Hyväksy hänen tuomionsa"
STR_INTERCEPT_TITLE_18: "RISTIRIITA"
STR_INTERCEPT_TEXT_18: "Harris asettaa ensimmäisen vastauksesi viimeisimmän vastauksesi viereen. Molemmat eivät voi olla totta. Voit hylätä valheen tai antaa haastattelun päättyä ristiriitaan."
STR_INTERCEPT_CHOICE_18_0: "Kerro totuus kiristämisestä"
STR_INTERCEPT_CHOICE_18_1: "Jatka kaiken kieltämistä"
STR_INTERCEPT_CHOICE_18_2: "Yritä lähteä"
STR_INTERCEPT_TITLE_19: "hiljaisuus"
STR_INTERCEPT_TEXT_19: "Taitat kätesi. Harris sulkee tiedoston. Tässä huoneessa hiljaisuus ei lopeta tutkimusta; se vain lopettaa osuutesi sen ohjaamiseen."
STR_INTERCEPT_CHOICE_19_0: "Kuuntele päätös"
STR_INTERCEPT_TITLE_20: "Rikkoutunut lasi"
STR_INTERCEPT_TEXT_20: "Ruutu antaa periksi. Kylmä ilma ja vartijan pillin ääni saapuvat yhteen. Yhdelle päätökselle on aikaa, ennen kuin joku saapuu ovelle."
STR_INTERCEPT_CHOICE_20_0: "Juokse ulompaa polkua kohti"
STR_INTERCEPT_CHOICE_20_1: "Jätä koodattu vihje"
STR_INTERCEPT_CHOICE_20_2: "Pysy ja selitä"
STR_INTERCEPT_TITLE_21: "TUOJEN VÄLILLÄ"
STR_INTERCEPT_TEXT_21: "Polku on märkä. Hooperin kota on tarpeeksi lähellä päästäkseen ennen seuraavaa partiota, mutta sen takana oleva avoin maa tarjoaa toisenlaisen mahdollisuuden."
STR_INTERCEPT_CHOICE_21_0: "Yritä paeta alueelta"
STR_INTERCEPT_CHOICE_21_1: "Mene Hooperin kotaan"
STR_INTERCEPT_CHOICE_21_2: "Palaa Harrisin luo"
STR_INTERCEPT_TITLE_22: "YKSITYISPELI"
STR_INTERCEPT_TEXT_22: "Hooper tutkii sinua. Pöydällä hän asettaa sormillaan kuvitteellisen shakkiasennon. Koodattu vastaus voisi saada hänet paljastamaan mitä suora syytös ei koskaan tekisi."
STR_INTERCEPT_CHOICE_22_0: "Vastaa shakkivihjeellä"
STR_INTERCEPT_CHOICE_22_1: "Uhkaa nimeämällä hänet"
STR_INTERCEPT_CHOICE_22_2: "Puhu rehellisesti"
STR_INTERCEPT_TITLE_23: "kasvotusten"
STR_INTERCEPT_TEXT_23: "Hooper kysyy, mitä voit todella todistaa. Hänen itseluottamuksensa horjuu vain, kun mainitset yksityiskohtia, joita jonkun hänen suunnitelmansa ulkopuolella olevan ei pitäisi tietää."
STR_INTERCEPT_CHOICE_23_0: "Esitä hänelle todisteet"
STR_INTERCEPT_CHOICE_23_1: "Tarjoa komponenttia kauppana"
STR_INTERCEPT_CHOICE_23_2: "Bluff"
STR_INTERCEPT_TITLE_24: "CUP"
STR_INTERCEPT_TEXT_24: "Hooper tuo vettä, mutta kurottaa ensin teekuppiin. Tämän kupin pitäminen voi olla hyödyllisempää kuin kaiken muun hänen tarjoamansa hyväksyminen."
STR_INTERCEPT_CHOICE_24_0: "Pidä kuppi"
STR_INTERCEPT_CHOICE_24_1: "Tarkista takkisi uudelleen"
STR_INTERCEPT_TITLE_25: "JOtain TESTAATTAVAA"
STR_INTERCEPT_TEXT_25: "Pidä kuppi ja pyydä Harrisia tutkimaan se. Tämä on lopulta väite, johon on liitetty esine. Hooperin yritys poistaa se tarjoaa toisen hyödyllisen yksityiskohdan."
STR_INTERCEPT_CHOICE_25_0: "Anna Harrisille kuppi"
STR_INTERCEPT_CHOICE_25_1: "Kohtaa Hooper sen kanssa"
STR_INTERCEPT_TITLE_26: "VÄÄRÄ TOHDE"
STR_INTERCEPT_TEXT_26: "Syytät Harrisia ilman todisteita. Hän näkee epäillyn yrittävän häpäistä tutkijaa. Mitä tahansa teelle tapahtui, olet tehnyt hänen uskoakseen sinua vaikeammaksi."
STR_INTERCEPT_CHOICE_26_0: "Haastattelu päättyy"
STR_INTERCEPT_TITLE_27: "KOKO TILI"
STR_INTERCEPT_TEXT_27: "Annat nimet ja kuvailet tapaamista. Harris kysyy tarkkoja kysymyksiä. Hämmennyksesi on todellinen, mutta niin ovat myös yksityiskohdat, jotka hän voi nyt tarkistaa."
STR_INTERCEPT_CHOICE_27_0: "Anna hänen vahvistaa tili"
STR_INTERCEPT_CHOICE_27_1: "Tarjoa Hooperin löytämistä"
STR_INTERCEPT_TITLE_28: "Epäonnistunut BLFF"
STR_INTERCEPT_TEXT_28: "Harris on kuullut tarpeeksi luottavaisia vastauksia. Hooperilla on myös. Kumpikaan ei kerro sitä tosiasiaa, että tarinasi puuttuu."
STR_INTERCEPT_CHOICE_28_0: "Säilytä vaatimus"
STR_INTERCEPT_CHOICE_28_1: "Paeta epätoivoisesti"
STR_INTERCEPT_CHOICE_28_2: "Myönnä, mitä todella tapahtui"
STR_INTERCEPT_TITLE_29: "ESITTELY"
STR_INTERCEPT_TEXT_29: "Taskussasi oleva arkki kantaa muutakin kuin sekaisin kirjaimia: sen reitti majojen läpi asettaa Hooperin koneen lähelle. Lyhyt vihje saattaa saada oikean henkilön katsomaan oikeasta paikasta."
STR_INTERCEPT_CHOICE_29_0: "Koodaa viesti Hooperille"
STR_INTERCEPT_CHOICE_29_1: "Näytä reitti Harrisille"
STR_INTERCEPT_TITLE_30: "KONEE KÄYNNISSÄ"
STR_INTERCEPT_TEXT_30: "Harrisilla on osa ja polku, joka johtaa ensimmäisten pelästyneiden vastaustesi ulkopuolelle. Bombe jatkaa työtään. Jätät Hut 14:n omalle nimellesi, vähemmän salaisuuksia ja tulevaisuutta, josta on vielä vastattava."
STR_INTERCEPT_TITLE_31: "Epäilyssä"
STR_INTERCEPT_TEXT_31: "Komponentin palauttaminen säästi koneen viiveeltä. Se ei pelastanut asemaasi. Harris lopettaa pääsysi majoihin tutkimuksen jatkuessa. Selvisit haastattelusta, mutta et paljastanut nimeäsi."
STR_INTERCEPT_TITLE_32: "SÄILITYSESSÄ"
STR_INTERCEPT_TEXT_32: "Ovi avautuu vartijalle eikä sinulle. Ristiriidoista, puuttuvista todisteista ja varastetusta komponentista on tullut tapaus, jota et voi enää ohjata. Tämä yritys päättyy tähän."
STR_INTERCEPT_TITLE_33: "ULKOPOLKU"
STR_INTERCEPT_TEXT_33: "Jätät mökit taaksesi. Pimeys on hyödyllinen, mutta maata valvotaan. Rikkoutunut ikkuna on tuonut partiot lähemmäksi kuin toivoit."
STR_INTERCEPT_CHOICE_33_0: "Ylitä avoin maa"
STR_INTERCEPT_CHOICE_33_1: "Pysy palvelupolulla"
STR_INTERCEPT_CHOICE_33_2: "Käänny taaksepäin ja katso Harrisia päin"
STR_INTERCEPT_TITLE_34: "HOOPPERIN TUPA"
STR_INTERCEPT_TEXT_34: "Työpöytää ei valvota. Paperit ovat ristisanatehtävän alla, ja konehuone ilmestyy lyijykynällä. Askelia lähestyy ulkona olevia lautoja pitkin."
STR_INTERCEPT_CHOICE_34_0: "Tutki paperit"
STR_INTERCEPT_CHOICE_34_1: "Odota Hooperia"
STR_INTERCEPT_CHOICE_34_2: "Lähde Harrisin luo"
STR_INTERCEPT_TITLE_35: "SAKKI-ONGELMA"
STR_INTERCEPT_TEXT_35: "Annat Hooperille aseman, joka kuvastaa hänen ahdinkoaan: suojattu nappula, paljastettu kuningas ja siirto, joka näyttää turvalliselta vastaukseen asti. Hän ymmärtää varoituksen. Hänen seuraavat sanansa tarjoavat tarvitsemasi yhteyden."
STR_INTERCEPT_CHOICE_35_0: "Pyydä häntä myöntämään suunnitelma"
STR_INTERCEPT_CHOICE_35_1: "Lähetä sisäänpääsy Harrisille"
STR_INTERCEPT_TITLE_36: "ILMAN NAAMIA"
STR_INTERCEPT_TEXT_36: "Puhut paineesta sen sijaan, että teeskentelet, että sitä ei olisi koskaan ollutkaan. Hooper vastaa lyhyesti ihmisenä eikä vastustajana. Tätä aukkoa voitaisiin käyttää kauppaan tai ansaan."
STR_INTERCEPT_CHOICE_36_0: "Pyydä rehellistä järjestelyä"
STR_INTERCEPT_CHOICE_36_1: "Pyydä häntä tunnustamaan"
STR_INTERCEPT_CHOICE_36_2: "Vie tili Harrisille"
STR_INTERCEPT_TITLE_37: "HOOPERIN PÄÄSY"
STR_INTERCEPT_TEXT_37: "Hooper selittää tarpeeksi yhdistääkseen kiristyksen puuttuvaan komponenttiin. Harris voi nyt palauttaa laitteet ja tarkistaa tarinan. Sinun on päätettävä, lopetatko tutkimuksen vai annatko Hooperin kadota."
STR_INTERCEPT_CHOICE_37_0: "Tuo Harrisin sisäänpääsy"
STR_INTERCEPT_CHOICE_37_1: "Anna Hooperin mennä ja lähteä"
STR_INTERCEPT_TITLE_38: "KAUPPA"
STR_INTERCEPT_TEXT_38: "Asetat viimeisen vipupalasi Hooperin ulottuville. Kauppa ilman todistajaa tai todisteita kutsuu häntä ratkaisemaan ongelmansa sinun kustannuksellasi."
STR_INTERCEPT_CHOICE_38_0: "Luovuta komponentti"
STR_INTERCEPT_CHOICE_38_1: "Vaadi todistajasopimus"
STR_INTERCEPT_CHOICE_38_2: "Peruuta tarjous"
STR_INTERCEPT_TITLE_39: "HARRIS KUUNTELEE"
STR_INTERCEPT_TEXT_39: "Tiedot voidaan tarkistaa. Harris kysyy, missä komponentti on nyt. Tilin tyhjentäminen ja koneen käynnistäminen ovat toisiinsa liittyviä ongelmia, mutta ne eivät ole sama asia."
STR_INTERCEPT_CHOICE_39_0: "Palauta mitä takissasi on"
STR_INTERCEPT_CHOICE_39_1: "Auta palauttamaan komponentti"
STR_INTERCEPT_CHOICE_39_2: "Lopeta vastaaminen nyt"
STR_INTERCEPT_TITLE_40: "AIDAN TÄÄLTÄ"
STR_INTERCEPT_TEXT_40: "Majat häviävät takanasi, vapaus ei ole sama asia kuin viattomuus, ja kone on nyt jonkun toisen kiireellinen ongelma. Olet paennut, tarina jää kesken."
STR_INTERCEPT_TITLE_41: "VIIMEINEN VIRHE"
STR_INTERCEPT_TEXT_41: "Partio tavoittaa sinut ennen kuin avoin kenttä loppuu tai Hooperin lupaus kaatuu, kun siitä ei ole enää hyötyä hänelle. Sinulta on loppunut turvalliset liikkeet. Tarinaa voi kokeilla uudestaan ​​alusta."
STR_INTERCEPT_TITLE_42: "PAPERIT"
STR_INTERCEPT_TEXT_42: "Aikataulu sijoittaa Hooperin tarinasi mukaan hänen olevan. Sen vieressä on seteli, joka veti sinut ensin ansaan. Yhdistelmä on tarpeeksi spesifinen, jotta Harris voi varmistaa."
STR_INTERCEPT_CHOICE_42_0: "Vie paperit Harrisille"
STR_INTERCEPT_CHOICE_42_1: "Odota ja kohtaa Hooper"
STR_INTERCEPT_TITLE_43: "VIIMEINEN SOPIMUS"
STR_INTERCEPT_TEXT_43: "Hooper tarjoutuu laittamaan osan takaisin. Häneen luottaminen poistaisi yhden välittömän ongelman; Harrisin tekeminen todistajaksi vaikeuttaisi toisen luomista."
STR_INTERCEPT_CHOICE_43_0: "Järjestä todistettu paluu"
STR_INTERCEPT_CHOICE_43_1: "Ota Harris mukaan suunnitelmaan"
STR_INTERCEPT_TITLE_44: "KELAN PALAUTTAMINEN"
STR_INTERCEPT_TEXT_44: "Kun tili on tiedossa, haku palaa puuttuvaan laitteistoon. Harris tarkistaa konehuoneen, kun tunnistat, missä komponentin pitäisi olla."
STR_INTERCEPT_CHOICE_44_0: "Viimeistele vahvistettu palautus"
STR_INTERCEPT_CHOICE_44_1: "Ota se pois takistasi"
STR_INTERCEPT_CHOICE_44_2: "Varoita Harrisia Hooperista"
STR_INTERCEPT_TITLE_45: "VIIMEINEN KYSYMYS"
STR_INTERCEPT_TEXT_45: "Harris odottaa. Jos voit yhdistää Hooperin varkaukseen, komponentti voidaan palauttaa ja lopettaa oikein. Muussa tapauksessa tutkimuksessa on vain vaihtuva tilisi."
STR_INTERCEPT_CHOICE_45_0: "Esitä todisteet"
STR_INTERCEPT_CHOICE_45_1: "Myönnä, että sinulla ei ole muuta"
