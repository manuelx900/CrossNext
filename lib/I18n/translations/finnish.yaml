STR_INTERCEPT_ABOUT: "Inklen tiivistetty muunnos The Interceptistä, 2016, käytetty MIT-lisenssillä. Bletchley Park, 1942: kadonnut konekomponentti, kiristys ja haastattelu, joka voi päättyä vapauteen tai vankeuteen.\n\nPäätöksesi ja asemasi tallennetaan jokaisen valinnan jälkeen. Uusi tarina nollaa tämän toiston. Tälle laiteohjelmistolle luotiin alkuperäiset kuvat. Alkuperäinen käsikirjoitus ja lisenssi sisältyvät projektiin."
