STR_PET_STORY_TEXT_3: "Paperinpalasta tulee pieni vene. Kumppanisi seuraa sitä pöydän yli, ikään kuin siinä olisi kokonainen seikkailu."
STR_PET_STORY_4: "Tähtien alla"
STR_PET_STORY_TEXT_4: "Lukemisen jälkeen katsotte yhdessä. Näkyviin tulee yksi tähti, sitten toinen. Vielä on niin paljon löydettävää."
STR_PET_STORY_5: "Kadonnut lehti"
STR_PET_STORY_TEXT_5: "Toverisi tuo sinulle lehden. Pidä se kirjanmerkkisi vieressä: pieni lahja tavalliselta päivästä."
STR_PET_STORY_6: "Rauhallinen nurkka"
STR_PET_STORY_TEXT_6: "Löydät mukavan kulman ja avaat kirjasi. Kumppanisi asettuu viereesi. Kummallakaan ei ole kiirettä."
STR_PET_STORY_7: "Uusi polku"
STR_PET_STORY_TEXT_7: "Vielä yksi sivu vie sinut jonnekin uuteen. Kumppanisi venyttelee ja katsoo sinua, valmiina huomiseen lukuun."
