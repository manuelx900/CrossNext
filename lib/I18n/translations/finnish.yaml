STR_PET_STORY_TEXT_0: "Lopetat luvun. Toverisi vieressä on itänyt pieni siemen. Annat sille paikan ikkunan vieressä."
STR_PET_STORY_1: "Sateinen päivä"
STR_PET_STORY_TEXT_1: "Sade koskettaa ikkunaa lukiessasi. Kumppanisi käpertyy lähelle. Hetken koko huone tuntuu suojalta."
