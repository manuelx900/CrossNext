STR_CAR_INTRO: "Syyllisyys ja rehellisyys ovat riippumattomia. Jokaisella tapauksella on täsmälleen yksi ratkaisu. Korkeudet ovat kuvitteellisia luonteenpiirteitä."
STR_CAR_HELP_TEXT: "Miten ratkaista tapaus\nJokainen hahmo tekee yhden lausunnon. Näytön yläosassa on tarkka määrä syyllisiä ja vääriä lausuntoja. Etsi yhdistelmä, joka täyttää molemmat laskutoimitukset. Jokaisella tapauksella on yksi ratkaisu.\n  \nSyyllisyys ei ole rehellisyyttä\nSyytön hahmo voi valehdella ja syyllinen voi kertoa totuuden. Kaksi valhetta tarkoittaa, että täsmälleen kaksi kokonaista lausuntoa ovat vääriä; muut ovat totta. Totuus / Valhe-merkit viittaavat lausuntoon; Epäilty viittaa syyllisyyteen.\n  \nLukemassa johtolankoja\n\"A tai B teki sen (tai molemmat)\" tarkoittaa, että ainakin yksi nimetty hahmo on syyllinen. \"A ja B tekivät sen\" edellyttää molempia. Valhe kieltää koko lausunnon: epätosi TAI tarkoittaa, että kumpikaan ei tehnyt sitä; epätosi JA tarkoittaa, että ainakin yksi ei tehnyt sitä.\n  \n\"Molemmat totuudenmukaiset tai molemmat valehtelevat\" vertaa lausuntoja, ei syyllisyyttä. \"Tasan toinen valehtelee\" tarkoittaa, että heidän lausunnoillaan on eri totuusarvot. Nämä vihjeet voivat itse olla tosia tai vääriä.\n  \nNaapurit pienellä näytöllä\nAlkuperäinen pyöreä järjestys on Panther, Peacock, Shark, Fox, Bear, Stag, Horse, käyttäen vain tämän tapauksen merkkejä. Viimeinen ja ensimmäinen ovat naapureita. Tämä sovellus kirjoittaa kaksi nimeä suoraan jokaisen naapuri vihje. Sinun ei koskaan tarvitse arvata, mitkä kortit ovat vieressä muotokuva. Vaihtamalla sivua tai suunta ei muuta vihjettä.\n  \nKorkeus ja paino\nJokainen kortti näyttää kuvitteellisen pituuden ja ruokavalion. \"Syyllinen on pitempi kuin minä\" tarkoittaa, että ainakin yksi syyllinen on pidempi kuin puhuja, ei välttämättä kaikki syylliset. Lyhyempi toimii samalla tavalla. Liha- ja kasvissyöjävihjeet tarkoittavat, että ainakin yhdellä syyllisellä on kyseinen ruokavalio; yleissyöjät lasketaan kumpaakaan. Nimet, pituudet ja ruokavalio ovat luotettavia tosiasioita; lausunnot voivat valehdella.\n  \nANALYYSISI\nKäytä ? / Totuus / Vale ja Epäilijä jokaisen lausunnon alla kirjoittaaksesi hypoteeseja. Nämä ovat muistiinpanojasi, eivät todisteita tai automaattisia tarkistuksia. Nuolet näyttävät muut merkit. Pystytila näyttää enintään kolme merkkiä sivulla.\n  \nSyytteen esittäminen\nPaina Accuse ja valitse täsmälleen tarvittava määrä syyllisiä. Vain vahvistamalla väärä syytös viettää elämän. Aloittelija ja Normaali on kaksi elämää; Advanced ja Expert on yksi. Oikea syytös ratkaisee tapauksen. Kun ei ole elämää jäljellä, ratkaisu paljastuu.\n  \nKampanja ja toisto\nTapauksia on 1,470. Avoin tapaus jatkaa nykyistä yritystä tai avaa seuraavan suljetun yrityksen jälkeen. Kampanja antaa sinun valita minkä tahansa 1,470 tapauksesta missä tahansa järjestyksessä alusta alkaen. Uudelleentoisto aloittaa uuden yrityksen säilyttäen aiemman loppuun saattamisen. Jokaisen vaikeustason sisällä tapaukset etenevät yhdestä syyllisestä kahteen, sitten vähemmän valehtelijoista useampiin syyllisryhmässä. Aloittelija pitää yhden syyllisen. Pienemmät heitot tulevat ensin, kun määrä vastaa. Kaikki tapaukset pysyvät käytettävissä. Ratkaisemalla aiemmin loppuun käytetyn tapauksen se päivittyy ratkaistuksi.\n  \nEdistyminen ja elämät tallennetaan SD-kortille. Poistuminen, nukkua tai laitteen uudelleenkäynnistys ei palauta elämää nykyisessä yrityksessä. Epäonnistunut tallennus estää tuloksen kunnes Uusi yritys onnistuu. Palauta kaikki pyytää vahvistusta ennen tyhjentää vain Carnivore edistymistä."
