STR_PET_STORY_TEXT_0: "Has acabat un capítol. Al costat del teu company, ha brotat una petita llavor. Li doneu un lloc a la finestra."
STR_PET_STORY_1: "Un dia plujós"
STR_PET_STORY_TEXT_1: "La pluja toca la finestra mentre llegeixes. El teu company s'arrossega a prop. Durant un temps, tota l'habitació se sent com un refugi."
STR_PET_STORY_2: "El visitant"
STR_PET_STORY_TEXT_2: "Un ocell aterra a la finestra. El teu company mira en silenci fins que s'allunya volant. Marques la teva pàgina i somriu."
STR_PET_STORY_3: "Un vaixell de paper"
STR_PET_STORY_TEXT_3: "Un tros de paper es converteix en un petit vaixell. El teu company el segueix a través de la taula, com si tingués tota una aventura."
STR_PET_STORY_4: "Sota les estrelles"
STR_PET_STORY_TEXT_4: "Després de llegir, mireu junts. Apareix una sola estrella, després una altra. Encara hi ha molt per descobrir."
STR_PET_STORY_5: "La fulla perduda"
STR_PET_STORY_TEXT_5: "El teu company et porta una fulla. El guardes al costat del teu marcador: un petit regal d'un dia normal."
STR_PET_STORY_6: "Un racó tranquil"
STR_PET_STORY_TEXT_6: "Trobeu un racó còmode i obriu el vostre llibre. El teu company s'instal·la al teu costat. Cap de vosaltres no té pressa."
STR_PET_STORY_7: "Un nou camí"
STR_PET_STORY_TEXT_7: "Una pàgina més et porta a un lloc nou. El teu company s'estira i et mira, preparat per al capítol de demà."
