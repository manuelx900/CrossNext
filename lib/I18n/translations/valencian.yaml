STR_PET_GUIDE_GAMES: "Els primers 3 jocs de cada dia donen ànim i gasten 20 d’energia. Després pots practicar de franc. Abans de jugar, atén la mascota si està malalta, té fam, està cansada o dorm."
STR_PET_GUIDE_HEALTH: "La neteja és gratuïta i restableix la higiene al 100. No cura cap malaltia: per això, obriu Salut i utilitzeu un remei."
STR_PET_GUIDE_DIFFICULTY: "Relaxed no té data límit per tornar a la lectura. Normal permet 7 dies, Dur 3 dies i Extreme 24 hores. Si passa el termini, la teva mascota mor. La lectura torna a iniciar el temporitzador."
STR_PET_GUIDE_PROJECT: "Tria un objecte i llegeix fins a 60 minuts per guanyar-lo. El canvi de projectes comença a zero. Podeu eliminar objectes de la vostra propietat sense perdre-los; són heretats."
