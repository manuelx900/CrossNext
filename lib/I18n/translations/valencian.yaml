STR_QUEST_CAM_JOURNEY_DAILYREQUEST_0: "Llegeix aquest relat amb mi, encara hi ha famílies buscant les seves pròpies paraules en el llibre del poble."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_1: "Quedeu-vos amb aquestes històries una mica més, algú del mercat podria reconèixer la persona que descriuen les paraules."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_2: "Llegiu aquests noms amb mi. Vull que una família estigui esperant quan arribi el següent vaixell."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_3: "Llegeix aquesta història abans que la mogui a un prestatge més alt. Necessito saber quines paraules encara falten."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_4: "Llegeix amb mi les paraules dels viatgers. No vull confondre un vell avís amb una trucada a seguir."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Llegeix aquestes històries al costat del foc, abans de viatjar, vull que tothom escolti el seu nom."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_6: "Llegeix aquesta pàgina amb mi abans que sonin les campanes. Necessito recordar més de l'hora al dial."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_7: "Llegeix aquest testimoni sencer. Aquí hi ha gent que ha esperat massa per ser escoltada."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Llegeix aquest record prop de la font. M'agradaria saber què esperava deixar enrere la persona que va plantar aquí."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Llegeix les històries que t'hem enviat. Les veus de casa poden fer-te companyia, fins i tot aquí lluny."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Llegeix aquesta carta abans de marxar. No cal portar tots els records sols."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_11: "Llegeix les paraules que hem guardat per a tu. La fortalesa no és el món sencer, per més tranquil que esdevingui."
