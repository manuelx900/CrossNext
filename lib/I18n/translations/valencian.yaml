STR_QUEST_CAM_JOURNEY2_SAGA_11_10: "Les habitacions estan amuntegades de llibres robats i danyats. Allibereu els que encara estan tancats a les caixes, i després pugeu cap a la part més alta de la fortalesa per trobar la font del poder del rei.\n\nUn llibre enorme conté part de la màgia del rei. El seu pany coincideix amb els tres segells de la clau. Quan l'obres, la màgia fosca es debilita i pots dirigir-te al tron.\n\nEl rei fa una última ombra per protegir-se. Tu la fas desaparèixer. Ara no hi ha cap guardià entre vosaltres i la batalla pels llibres està a punt de començar.\n\nDerrotes el rei de l'oblit. Els seus monstres ja no poden amenaçar el món i els llibres robats tornen als seus propietaris. De tornada a casa, obris un llibre tal com ho feies abans del viatge."
