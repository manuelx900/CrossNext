STR_CAR_HELP_TEXT: "Com resoldre un cas\nCada caràcter fa una declaració. La part superior de la pantalla mostra el nombre exacte de culpables i declaracions falses. Trobeu una combinació que satisfà ambdós comptadors. Cada cas té una solució.\n  \nLa culpa no és honestedat.\nUn personatge innocent pot mentir, i un culpable pot dir la veritat. Dues mentides signifiquen que exactament dues afirmacions senceres són falses; les altres són veritables. Les marques Veritat / Mentida es refereixen a l' afirmació; Sospitós es refereix a la culpabilitat.\n  \nLlegir les pistes\n\"A o B ho va fer (o tots dos)\" vol dir que almenys un dels caràcters és culpable. \"A i B ho van fer\" requereix a tots dos. Una mentida nega tota l' afirmació: un fals OR significa que cap d' ells ho va fer; un fals AND significa que almenys un no ho va fer.\n  \n\"Tots dos verídics o tots dos mentiders\" compara declaracions, no culpabilitat. \"Exactament un està mentint\" vol dir que les seves declaracions tenen diferents valors de veritat. Aquestes pistes poden ser vertaderes o falses.\n  \nVEÏNS EN UNA PETITA PANTALLA\nL' ordre circular original és Panther, Peacock, Shark, Fox, Bear, Deer, Horse, usant només els caràcters d' aquesta caixa. L' últim i el primer són veïns. Aquesta aplicació escriu els dos noms directament en cada pista de veí. Mai no heu d' endevinar quines cartes estan al costat d' un retrat. Canviar la pàgina o l' orientació no canvia una pista.\n  \nAlçada i dieta\nCada targeta mostra una alçada i dieta fictícies. \"Un culpable és més alt que jo\" vol dir que almenys un culpable és més alt que el parlant, no necessàriament tots els culpables. Més curt funciona de la mateixa manera. Les pistes carnívores i herbívores signifiquen que almenys un culpable té aquesta dieta; els omnívors compten com a cap dels dos. Els noms, alçades i dietes són fets fiables; les afirmacions poden mentir.\n  \nLa teva anàlisi\nUseu ? / Veritat / Mentida i Sospitós sota cada afirmació per a registrar hipòtesis. Aquestes són les vostres notes, no proves o comprovacions automàtiques. Les fletxes mostren els altres caràcters. El mode vertical mostra fins a tres per pàgina.\n  \nFER UNA ACUSACIÓ\nPremeu Acusa i seleccioneu exactament el nombre requerit de culpables. Només confirmar una acusació errònia gasta una vida. Els principiants i normals tenen dues vides; els avançats i experts en tenen una. Una acusació correcta resol el cas. Quan no queden vides, es revela la solució.\n  \nCampanya i repetició\nHi ha 1. 470 casos. El cas obert reprendrà l' intent actual o obrirà el següent després d' un tancat. La campanya us permet triar qualsevol dels 1. 470 casos en qualsevol ordre des del començament. La repetició començarà un nou intent preservant la finalització anterior. Dins de cada dificultat, els casos progressen d' un culpable a dos, després de menys mentiders a més dins de cada grup de culpables. El principiant manté un culpable. Els llançaments més petits vénen primer quan els comptes coincideixen. Tots els casos es mantenen disponibles. Resoldre un cas prèviament esgotat l' actualitza a resolt.\n  \nEl progrés i les vides es desaten a la targeta SD. Sortir, dormir o reiniciar un dispositiu no restaura les vides en l' intent actual. Un error de desat bloqueja el resultat fins que Torna a intentar té èxit. Reinicialitza- ho tot demana confirmació abans d' esborrar només el progrés del Carnivor."
