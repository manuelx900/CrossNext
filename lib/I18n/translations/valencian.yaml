STR_QUEST_CAM_JOURNEY2_SAGA_10_10: "Es creua un pont penjat i obris una porta coberta de llums. Més enllà d'ell hi ha un antic arxiu els llibres del qual poden dir on trobar l'últim segell.\n\nUn llibre diu que el tercer segell es manté a sota de l'arxiu. Agafeu les escales cap a túnels foscos que porten a una cambra segellada.\n\nRecupereu el tercer segell i completeu la clau. Sortint dels túnels, es veuen les muralles de la fortalesa. Un pont condueix a la porta, on els darrers monstres vigilen.\n\nLa Serp del Buit ja no pot protegir l'arc. Els tres segells brillen mentre introduïu la clau a la porta. S'obre el castell, i només queda el Rei de l'Oblit."
STR_QUEST_CAM_JOURNEY2_SAGA_11_0: "Per fi s'arriba al castell del rei de l'oblit. Conté molts llibres que els seus soldats van robar. Els seus últims guardians protegeixen el tron, i has de debilitar la seua màgia abans d'enfrontar-te a ell."
