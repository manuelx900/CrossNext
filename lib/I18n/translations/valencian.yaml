STR_MYST_GUIDE_HOOPER_COPY: "Hooper també treballa a Bletchley Park. Et va pressionar perquè agafes el component i té els seus propis interessos. Pots interrogar-lo, negociar o buscar proves. Conèixer el seu paper no us diu quina opció és segura."
