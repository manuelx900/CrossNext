STR_INTERCEPT_TITLE_0: "CABANA 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. Et fan esperar darrere d'una porta tancada. Un component de la màquina calculadora ha desaparegut. L'interceptació matinal cruix a la butxaca de l'abric. A fora, els passos s'aturen."
STR_INTERCEPT_CHOICE_0_0: "Pensa en l'acusació"
STR_INTERCEPT_CHOICE_0_1: "Espereu l'entrevistador"
STR_INTERCEPT_CHOICE_0_2: "Busca el teu abric"
STR_INTERCEPT_TITLE_1: "L'ACUSACIÓ"
STR_INTERCEPT_TEXT_1: "Sospiten de traïció. Resoleu figures, mots encreuats i posicions d'escacs per guanyar-vos la vida. Aquesta habitació és un altre problema: contradiu-vos i la vostra credibilitat pot ser la primera víctima."
STR_INTERCEPT_CHOICE_1_0: "Trieu una estratègia"
STR_INTERCEPT_CHOICE_1_1: "Escolta el que saben"
STR_INTERCEPT_TITLE_2: "ARRIBA HARRIS"
STR_INTERCEPT_TEXT_2: "En Harris entra amb una tassa de te i una llima. Falta un rodet al Bombe. El teu nom estava a la llista de deures. Posa la tassa al teu costat i et pregunta on eres ahir a la nit."
STR_INTERCEPT_CHOICE_2_0: "Beu el te"
STR_INTERCEPT_CHOICE_2_1: "Deixa el te intacte"
STR_INTERCEPT_CHOICE_2_2: "Respon amb calma"
STR_INTERCEPT_TITLE_3: "EL COMPONENT"
STR_INTERCEPT_TEXT_3: "Dins del folre de l'abric, els teus dits es troben amb metall fred. El component encara hi és. Hooper va dir que prendre'l faria aturar el xantatge. Ara la porta tancada té un significat diferent."
STR_INTERCEPT_CHOICE_3_0: "Manteniu-lo amagat"
STR_INTERCEPT_CHOICE_3_1: "Passeu-lo a Harris"
STR_INTERCEPT_TITLE_4: "UNA JUGA GUANYADORA"
STR_INTERCEPT_TEXT_4: "La cooperació podria preservar la vostra credibilitat. Una mentida convincent pot guanyar temps. La fugida canviaria una habitació tancada amb clau per als guàrdies de fora. Cap d'aquests moviments es pot recuperar."
STR_INTERCEPT_CHOICE_4_0: "Cooperar"
STR_INTERCEPT_CHOICE_4_1: "Inventa una coartada"
STR_INTERCEPT_CHOICE_4_2: "Examineu la finestra"
STR_INTERCEPT_TITLE_5: "EL TE"
STR_INTERCEPT_TEXT_5: "L'habitació s'inclina. Harris s'adona del teu silenci, però la seva cara ja s'allunya. La propera vegada que obris els ulls, un altre parell de sabates està al costat de la taula."
STR_INTERCEPT_CHOICE_5_0: "Fingeix que romans adormit"
STR_INTERCEPT_CHOICE_5_1: "Confronta el visitant"
STR_INTERCEPT_CHOICE_5_2: "Demana aigua"
STR_INTERCEPT_TITLE_6: "UNA PETITA NEGACIÓ"
STR_INTERCEPT_TEXT_6: "Allunyes la tassa. Harris observa el moviment més de prop que la resposta. Li pregunta si hi ha algú més a qui hauria d'interrogar."
STR_INTERCEPT_CHOICE_6_0: "Pregunteu quines proves té"
STR_INTERCEPT_CHOICE_6_1: "Esmenta Hooper"
STR_INTERCEPT_CHOICE_6_2: "Mira cap a la finestra"
STR_INTERCEPT_TITLE_7: "EL CARRET QUE FALTA"
STR_INTERCEPT_TEXT_7: "Harris vol una resposta directa. Has agafat el component? Pots dir-li què hi ha a l'abric, explicar la pressió aplicada en Hooper o intentar apuntar l'acusació a un altre lloc."
STR_INTERCEPT_CHOICE_7_0: "Doneu-li el component"
STR_INTERCEPT_CHOICE_7_1: "Explica el xantatge"
STR_INTERCEPT_CHOICE_7_2: "Acusar Hooper"
STR_INTERCEPT_TITLE_8: "METALL A LA TAULA"
STR_INTERCEPT_TEXT_8: "El component es troba entre vosaltres. Harris ho comprova sense relaxar-se. Tornar l'equip robat no explica per què es va prendre. Vol un nom i alguna cosa més fiable que la teva paraula."
STR_INTERCEPT_CHOICE_8_0: "Ofereix-te per trobar proves"
STR_INTERCEPT_CHOICE_8_1: "Queda't i respon les preguntes"
STR_INTERCEPT_TITLE_9: "LA COARTA"
STR_INTERCEPT_TEXT_9: "Descrius una nit tranquil·la al teu escriptori. Harris obre el fitxer. Un guàrdia et va veure sortir de la sala de màquines. El teu compte inventat ara té un testimoni en contra."
STR_INTERCEPT_CHOICE_9_0: "Defensa la història"
STR_INTERCEPT_CHOICE_9_1: "Admet el xantatge"
STR_INTERCEPT_CHOICE_9_2: "Rebutja més preguntes"
STR_INTERCEPT_TITLE_10: "LA FINESTRA"
STR_INTERCEPT_TEXT_10: "La finestra és alta i el vidre és gruixut. Més enllà, el camí passa per davant d'una altra barraca. Trencar-lo seria fort; esperar aquí té els seus propis perills."
STR_INTERCEPT_CHOICE_10_0: "Trenca el vidre"
STR_INTERCEPT_CHOICE_10_1: "Estudia el camí a l'exterior"
STR_INTERCEPT_CHOICE_10_2: "Torna a l'entrevista"
STR_INTERCEPT_TITLE_11: "UN ALTRE VISITANT"
STR_INTERCEPT_TEXT_11: "En Hooper ha vingut mentre estàs insegur. Vol saber si Harris té el component. Manté una mà a prop de la porta."
STR_INTERCEPT_CHOICE_11_0: "Fingeix dormir"
STR_INTERCEPT_CHOICE_11_1: "Demana una explicació"
STR_INTERCEPT_CHOICE_11_2: "Demana aigua"
STR_INTERCEPT_TITLE_12: "UN ADVERTIMENT"
STR_INTERCEPT_TEXT_12: "Truques per Harris abans que el te s'apoderi. Torna, irritat. Una acusació sobre la copa necessitarà alguna cosa que pugui provar."
STR_INTERCEPT_CHOICE_12_0: "Conserveu la tassa com a prova"
STR_INTERCEPT_CHOICE_12_1: "Acusar a Harris d'haver-te enverinat"
STR_INTERCEPT_CHOICE_12_2: "Concentra't en el rodet"
STR_INTERCEPT_TITLE_13: "HOOPER"
STR_INTERCEPT_TEXT_13: "Harris reconeix el nom. Hooper és útil, està ben connectat i tampoc no està absent de la llista d'ahir a la nit. El reconeixement no és una prova."
STR_INTERCEPT_CHOICE_13_0: "Trobeu alguna cosa verificable"
STR_INTERCEPT_CHOICE_13_1: "Insisteix que Hooper l'ha robat"
STR_INTERCEPT_TITLE_14: "XANTATGE"
STR_INTERCEPT_TEXT_14: "Descrius un jove, una confiança traïda i la demanda que va seguir. Harris escolta sense ajudar-te. Anomenar la persona que va posar el parany també pot exposar la persona que esperàvem protegir."
STR_INTERCEPT_CHOICE_14_0: "Doneu a Harris el compte complet"
STR_INTERCEPT_CHOICE_14_1: "Deixa de banda els noms"
STR_INTERCEPT_CHOICE_14_2: "Proposa una manera d'atrapar en Hooper"
STR_INTERCEPT_TITLE_15: "UNA ACUSACIÓ FÀCIL"
STR_INTERCEPT_TEXT_15: "Hooper, dius, ha de ser responsable. Harris et pregunta com ho saps. Hi ha una diferència entre resoldre un problema i produir un testimoni que pugui demostrar la resposta."
STR_INTERCEPT_CHOICE_15_0: "Deixa que Harris desafii la reclamació"
STR_INTERCEPT_CHOICE_15_1: "Prova d'enviar un missatge privat a Hooper"
STR_INTERCEPT_TITLE_16: "UNA PISTA COMPROBABLE"
STR_INTERCEPT_TEXT_16: "Es pot negar una història. Un document, un testimoni o el component que falta és més difícil d'explicar. Tens una mica de temps per triar què vols."
STR_INTERCEPT_CHOICE_16_0: "Inspeccioneu la cabana propera"
STR_INTERCEPT_CHOICE_16_1: "Utilitzeu la intercepció matinal"
STR_INTERCEPT_CHOICE_16_2: "Pregunta directament a Hooper"
STR_INTERCEPT_TITLE_17: "MÉS QUE UNA Devolució"
STR_INTERCEPT_TEXT_17: "La màquina pot tornar a funcionar, però Harris encara té una bretxa de seguretat per explicar. T'ofereix una darrera oportunitat per establir qui ho va organitzar."
STR_INTERCEPT_CHOICE_17_0: "Mostra les proves"
STR_INTERCEPT_CHOICE_17_1: "Busqueu proves"
STR_INTERCEPT_CHOICE_17_2: "Accepta el seu judici"
STR_INTERCEPT_TITLE_18: "UNA CONTRADICCIÓ"
STR_INTERCEPT_TEXT_18: "Harris posa la teva primera resposta al costat de la teva última. Ambdós no poden ser certs. Pots abandonar la mentida o deixar que l'entrevista acabi en una contradicció."
STR_INTERCEPT_CHOICE_18_0: "Digues la veritat sobre el xantatge"
STR_INTERCEPT_CHOICE_18_1: "Continua negant-ho tot"
STR_INTERCEPT_CHOICE_18_2: "Intenta marxar"
STR_INTERCEPT_TITLE_19: "SILENCI"
STR_INTERCEPT_TEXT_19: "Creu els braços. Harris tanca el fitxer. En aquesta sala, el silenci no acaba la investigació; només acaba la teva part en dirigir-lo."
STR_INTERCEPT_CHOICE_19_0: "Escolteu la decisió"
STR_INTERCEPT_TITLE_20: "VIDRE TRENCAT"
STR_INTERCEPT_TEXT_20: "El panell cedeix. L'aire fred i el so del xiulet d'un guàrdia arriben junts. Hi ha temps per a una decisió abans que algú arribi a la porta."
STR_INTERCEPT_CHOICE_20_0: "Corre pel camí exterior"
STR_INTERCEPT_CHOICE_20_1: "Deixa una pista codificada"
STR_INTERCEPT_CHOICE_20_2: "Queda't i explica"
STR_INTERCEPT_TITLE_21: "ENTRE LES CABANES"
STR_INTERCEPT_TEXT_21: "El camí està humit. La cabana d'Hooper està prou a prop per arribar abans de la següent patrulla, però el terreny obert que hi ha més enllà ofereix un tipus d'oportunitat diferent."
STR_INTERCEPT_CHOICE_21_0: "Intenta escapar dels terrenys"
STR_INTERCEPT_CHOICE_21_1: "Aneu a la cabana d'en Hooper"
STR_INTERCEPT_CHOICE_21_2: "Torna a Harris"
STR_INTERCEPT_TITLE_22: "UN JOC PRIVAT"
STR_INTERCEPT_TEXT_22: "Hooper t'estudia. Sobre la taula exposa amb els dits una posició imaginària d'escacs. Una resposta codificada podria fer-li revelar el que una acusació directa mai no faria."
STR_INTERCEPT_CHOICE_22_0: "Respon amb una pista d'escacs"
STR_INTERCEPT_CHOICE_22_1: "Amenaça amb posar-lo un nom"
STR_INTERCEPT_CHOICE_22_2: "Parla sincerament"
STR_INTERCEPT_TITLE_23: "CARA A CARA"
STR_INTERCEPT_TEXT_23: "En Hooper et pregunta què pots demostrar realment. La seva confiança només falla quan esmentes detalls que algú fora del seu pla no hauria de conèixer."
STR_INTERCEPT_CHOICE_23_0: "Confronteu-lo amb proves"
STR_INTERCEPT_CHOICE_23_1: "Oferir el component com a comerç"
STR_INTERCEPT_CHOICE_23_2: "Bluff"
STR_INTERCEPT_TITLE_24: "LA COPA"
STR_INTERCEPT_TEXT_24: "Hooper porta aigua però primer s'acosta a la tassa de te. Conservar aquesta copa pot ser més útil que acceptar qualsevol altra cosa que ofereixi."
STR_INTERCEPT_CHOICE_24_0: "Guarda la copa"
STR_INTERCEPT_CHOICE_24_1: "Torna a comprovar el teu abric"
STR_INTERCEPT_TITLE_25: "ALGUNA COSA PER PROVA"
STR_INTERCEPT_TEXT_25: "Guardes la tassa i demanes a Harris que l'examini. Finalment es tracta d'una al·legació amb un objecte adjunt. L'intent de Hooper d'eliminar-lo proporciona un segon detall útil."
STR_INTERCEPT_CHOICE_25_0: "Dóna la tassa a Harris"
STR_INTERCEPT_CHOICE_25_1: "Enfronta't a en Hooper"
STR_INTERCEPT_TITLE_26: "L'OBJECTIU ERRÓN"
STR_INTERCEPT_TEXT_26: "Acuses Harris sense proves. Veu un sospitós que intenta desacreditar l'investigador. Sigui el que hagi passat amb el te, li has fet més difícil creure't."
STR_INTERCEPT_CHOICE_26_0: "L'entrevista acaba"
STR_INTERCEPT_TITLE_27: "TOT EL COMPTE"
STR_INTERCEPT_TEXT_27: "Doneu els noms i descriu la reunió. Harris fa preguntes precises. La teva vergonya és real, però també ho són els detalls que ara pot comprovar."
STR_INTERCEPT_CHOICE_27_0: "Deixa'l verificar el compte"
STR_INTERCEPT_CHOICE_27_1: "Ofereix-te per trobar en Hooper"
STR_INTERCEPT_TITLE_28: "UN BLUFF FALLAT"
STR_INTERCEPT_TEXT_28: "En Harris ha escoltat prou respostes segures. Hooper també ho ha fet. Cap dels dos proporciona el fet que la teva història no es troba."
STR_INTERCEPT_CHOICE_28_0: "Persisteix en la reclamació"
STR_INTERCEPT_CHOICE_28_1: "Fes una escapada desesperada"
STR_INTERCEPT_CHOICE_28_2: "Admet el que va passar realment"
STR_INTERCEPT_TITLE_29: "LA INTERCEPTA"
STR_INTERCEPT_TEXT_29: "El llençol a la butxaca porta més que lletres confuses: el seu recorregut per les barraques situa en Hooper a prop de la màquina. Una pista concisa pot fer que la persona adequada busqui al lloc correcte."
STR_INTERCEPT_CHOICE_29_0: "Codificar un missatge per a Hooper"
STR_INTERCEPT_CHOICE_29_1: "Mostra la ruta cap a Harris"
STR_INTERCEPT_TITLE_30: "LA MÀQUINA FUNCIONA"
STR_INTERCEPT_TEXT_30: "Harris té el component i un camí que porta més enllà de les teves primeres respostes espantades. La Bomba reprèn la seva feina. Deixes Hut 14 amb el teu propi nom, amb menys secrets i un futur per respondre."
STR_INTERCEPT_TITLE_31: "BAIX SOSPIÇA"
STR_INTERCEPT_TEXT_31: "El retorn del component ha salvat la màquina d'un retard. No va salvar la teva posició. Harris acaba amb el teu accés a les barraques mentre la investigació continua. Vau sobreviure a l'entrevista, però no vau esborrar el vostre nom."
STR_INTERCEPT_TITLE_32: "EN CUSTODIA"
STR_INTERCEPT_TEXT_32: "La porta s'obre per al guàrdia més que per a tu. Les contradiccions, les proves que falten i un component robat s'han convertit en un cas que ja no pots dirigir. Aquest intent acaba aquí."
STR_INTERCEPT_TITLE_33: "EL CAMÍ EXTERIOR"
STR_INTERCEPT_TEXT_33: "Deixes les barraques enrere. La foscor és útil, però el terreny està vigilat. Una finestra trencada ha acostat les patrulles més del que esperàveu."
STR_INTERCEPT_CHOICE_33_0: "Travessa el terreny obert"
STR_INTERCEPT_CHOICE_33_1: "Mantingueu-vos al camí de servei"
STR_INTERCEPT_CHOICE_33_2: "Gira enrere i enfronta't a Harris"
STR_INTERCEPT_TITLE_34: "CABANA DEL HOOPER"
STR_INTERCEPT_TEXT_34: "L'escriptori està desatenat. Els papers es troben sota un mot encreuat i la sala de màquines apareix en una programació escrita a llapis. Els passos s'acosten al llarg dels taulers de fora."
STR_INTERCEPT_CHOICE_34_0: "Examineu els papers"
STR_INTERCEPT_CHOICE_34_1: "Espera Hooper"
STR_INTERCEPT_CHOICE_34_2: "Sortiu cap a Harris"
STR_INTERCEPT_TITLE_35: "UN PROBLEMA D'ESCACS"
STR_INTERCEPT_TEXT_35: "Dones a Hooper una posició que reflecteix la seva situació: una peça protegida, un rei exposat i un moviment que sembla segur fins a la resposta. Entén l'avís. Les seves següents paraules proporcionen la connexió que necessiteu."
STR_INTERCEPT_CHOICE_35_0: "Demana-li que admeti el pla"
STR_INTERCEPT_CHOICE_35_1: "Envieu l'admissió a Harris"
STR_INTERCEPT_TITLE_36: "SENSE MÀSCARA"
STR_INTERCEPT_TEXT_36: "Parles de la pressió en lloc de fingir que mai va existir. Hooper respon breument com a persona més que com a oponent. Aquesta obertura es podria utilitzar per a un comerç o una trampa."
STR_INTERCEPT_CHOICE_36_0: "Demaneu un acord honest"
STR_INTERCEPT_CHOICE_36_1: "Demana-li que confessi"
STR_INTERCEPT_CHOICE_36_2: "Porta el compte a Harris"
STR_INTERCEPT_TITLE_37: "ADMISSIÓ DE HOOPER"
STR_INTERCEPT_TEXT_37: "Hooper explica prou com per connectar el xantatge amb el component que falta. Harris ara pot recuperar l'equip i comprovar la història. Heu de decidir si acabeu la investigació o deixeu que l'Hooper desaparegui."
STR_INTERCEPT_CHOICE_37_0: "Porta l'entrada a Harris"
STR_INTERCEPT_CHOICE_37_1: "Deixa anar en Hooper i marxar"
STR_INTERCEPT_TITLE_38: "EL COMERÇ"
STR_INTERCEPT_TEXT_38: "Poses la teva última peça de palanquejament a l'abast d'Hooper. Una ganga sense testimoni ni proves és una invitació perquè resolgui el seu problema a costa vostra."
STR_INTERCEPT_CHOICE_38_0: "Entrega el component"
STR_INTERCEPT_CHOICE_38_1: "Exigir un acord presencial"
STR_INTERCEPT_CHOICE_38_2: "Retira l'oferta"
STR_INTERCEPT_TITLE_39: "HARRIS ESCOLTA"
STR_INTERCEPT_TEXT_39: "Els detalls es poden comprovar. Harris pregunta on és ara el component. Esborrar el vostre compte i fer funcionar la màquina són problemes relacionats, però no són el mateix."
STR_INTERCEPT_CHOICE_39_0: "Torna el que hi ha a l'abric"
STR_INTERCEPT_CHOICE_39_1: "Ajuda a recuperar el component"
STR_INTERCEPT_CHOICE_39_2: "Deixa de respondre ara"
STR_INTERCEPT_TITLE_40: "MÉS ENLLÀ DE LA TANCA"
STR_INTERCEPT_TEXT_40: "Les cabanes desapareixen darrere teu. La llibertat fora dels terrenys no és el mateix que la innocència, i la màquina ara és un problema urgent d'algú altre. Has escapat; la història roman inacabada."
STR_INTERCEPT_TITLE_41: "L'ÚLTIM ERROR"
STR_INTERCEPT_TEXT_41: "La patrulla t'arriba abans que s'acabi el terreny obert, o la promesa d'en Hooper s'enfonsa quan ja no li serveix. T'has quedat sense moviments segurs. La història es pot tornar a provar des del principi."
STR_INTERCEPT_TITLE_42: "ELS PAPERS"
STR_INTERCEPT_TEXT_42: "L'horari situa en Hooper on la teva història deia que era. Al costat hi ha la nota que primer et va atraure a la trampa. La combinació és prou específica perquè Harris la verifici."
STR_INTERCEPT_CHOICE_42_0: "Porta els papers a Harris"
STR_INTERCEPT_CHOICE_42_1: "Espera i enfronta't a l'Hooper"
STR_INTERCEPT_TITLE_43: "UN ÚLTIM ACCORD"
STR_INTERCEPT_TEXT_43: "Hooper ofereix tornar la peça. Confiar en ell eliminaria un problema immediat; fer de Harris un testimoni dificultaria la creació d'un altre."
STR_INTERCEPT_CHOICE_43_0: "Organitzeu una devolució presencial"
STR_INTERCEPT_CHOICE_43_1: "Porta a Harris al pla"
STR_INTERCEPT_TITLE_44: "RECUPERACIÓ DEL CARRET"
STR_INTERCEPT_TEXT_44: "Amb el compte registrat, la cerca torna al maquinari que falta. Harris comprova la sala de màquines mentre identifiqueu on hauria d'estar el component."
STR_INTERCEPT_CHOICE_44_0: "Finalitzar la devolució verificada"
STR_INTERCEPT_CHOICE_44_1: "Recupera-lo de l'abric"
STR_INTERCEPT_CHOICE_44_2: "Avisa a Harris sobre Hooper"
STR_INTERCEPT_TITLE_45: "LA PREGUNTA FINAL"
STR_INTERCEPT_TEXT_45: "Harris espera. Si podeu connectar Hooper al robatori, encara hi ha una manera de recuperar el component i acabar-ho correctament. En cas contrari, la investigació només té el vostre compte canviant."
STR_INTERCEPT_CHOICE_45_0: "Presentar les proves"
STR_INTERCEPT_CHOICE_45_1: "Admet que no tens res més"
