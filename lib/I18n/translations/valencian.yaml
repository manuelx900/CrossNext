STR_PET_GUIDE_SUPPLIES: "Guanyes una ració als 5, 10, 15, 30, 60 i 120 minuts de lectura del dia: fins a 6 racions. Cadascuna augmenta el mesurador de sacietat en 25 punts, fins a 100."
