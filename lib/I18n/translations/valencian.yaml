STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "L'inici de l'aventura"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Durant molts anys la gent va viure en pau i va gaudir dels seus llibres. Aleshores el Rei de l'Oblit va començar a destruir-los. Volia que tothom no llegís i que totes les històries desapareguessin per sempre."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Els monstres del rei"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "El rei de l'oblit va enviar els seus monstres per tot el món. Van destruir tots els llibres que van trobar i van atacar qualsevol que intentés aturar-los. Les biblioteques van començar a desaparèixer i la gent va deixar de llegir."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "El poder de la lectura"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Un dia, mentre llegeixes prop del teu poble, apareix un monstre. Intentes fugir, però passa una cosa sorprenent: com més llegeixes, més feble es torna. T'adones que la lectura és l'única manera de lluitar contra la màgia del rei."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "La teua missió"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "T'has proposat aturar el rei. De camí cap al seu castell hauràs de creuar boscos, ciutats, muntanyes i altres llocs plens d'enemics. Cada monstre que derrotes t'apropa una mica més. Segueix llegint, derrota els seus guardians i arriba a ell abans que destrueixi tots els llibres del món."
