STR_INTERCEPT_ABOUT: "Una adaptació condensada de The Intercept by Inkle, 2016, utilitzada sota la llicència del MIT. Bletchley Park, 1942: un component de màquina desaparegut, xantatge i una entrevista que pot acabar en llibertat o custòdia.\n\nLes vostres decisions i posició es guarden després de cada elecció. Una nova història restableix aquest joc. Es van crear il·lustracions originals per a aquest firmware. El guió i la llicència originals s'inclouen al projecte."
