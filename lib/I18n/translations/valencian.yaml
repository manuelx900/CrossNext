STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_0: "Ajuda'm a comparar les pàgines que portem a casa. Un nom al marge pot dir-nos a quina família pertany un record."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "Llegeix les històries que els veïns han portat a la plaça, hem de posar cada nom al costat de la vida a què pertany."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "Ajudeu-me a comparar les històries dels mariners, no puc enviar un altre vaixell en un canal que ja no recordem."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "Ajuda'm a llegir els volums rescatats. Quan surtin d'aquestes habitacions, vull que algú sàpiga les històries de qui porten."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "Ajudeu-me a comparar les històries dels refugis, el proper viatger hauria de trobar un camí, no un altre eco enganyós."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "Ajuda'ns a comparar els antics viatges. Un pou recordat pot marcar la diferència entre arribar i desaparèixer a la sorra."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "Ajuda'm a escoltar les històries dels veïns, un rellotge no pot dir-me què esperaven fer amb el dia."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "Ajudeu-nos a llegir les històries que arriben de les regions alliberades, el palau ha passat prou anys parlant només amb ell mateix."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Ajuda'm a posar en ordre les històries dels jardiners, aquestes llavors necessiten més que un nom en un paquet."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Ajuda'ns a mantenir aquestes històries en circulació. Vull que la gent que hem trobat es pugui escoltar."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Ajuda'ns a llegir les històries que arriben a l'últim camí, cadascuna pertany a algú que espera més enllà dels murs del rei."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Ajudeu-nos a llegir aquestes històries completament. Després de tant de temps separats, els seus propietaris es mereixen més que un nom en una llista."
STR_QUEST_CAM_JOURNEY_THANKS_0: "La Liora allisa la pàgina amb el palmell. \"Puc tornar a sentir aquesta línia\", diu. Aquest vespre deixarà el llibre obert al costat del llum."
STR_QUEST_CAM_JOURNEY_THANKS_1: "A l'estand, algú mou una cadira per fer-te lloc. Una història inacabada ha adquirit una altra línia; el seu propietari porta la pàgina a casa amb les dues mans."
STR_QUEST_CAM_JOURNEY_THANKS_2: "La Mara doblega una pàgina que acaba de llegir i la posa al costat del seu llibre de marees. Abans de tornar a la finestra, t'agraeix amb una veu arrugada per l'aire salat."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Iri posa una tira de drap sec entre dues pàgines. \"Aquell pot viatjar ara\". Sosté el volum contra el pit abans de portar-lo als altres llibres."
STR_QUEST_CAM_JOURNEY_THANKS_4: "En Taren recolza la seva motxilla sobre la pedra i escolta mentre acabes. Després repeteix les paraules d'un viatger, aquesta vegada sense necessitat de mirar la pàgina."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Nadir es dibuixa una cinta entre els dits, llegint un nom que abans era difícil d'entendre. Et fa un lloc al costat del foc."
STR_QUEST_CAM_JOURNEY_THANKS_6: "L'Orin deixa l'eina que ha estat girant entre els seus dits. Durant una estona parla de la persona de la història, i el rellotge es deixa passar sense ser escoltat."
STR_QUEST_CAM_JOURNEY_THANKS_7: "La Sera allunya la història de la pila d'ordres reials, demana una altra cadira i llavors escolta les últimes línies amb tu."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Aster marca una pàgina amb una fulla neta. Ella t'agraeix en silenci; una mica més tard la sents llegir el mateix passatge al costat de la font."
STR_QUEST_CAM_JOURNEY_THANKS_9: "Arriba una nota breu amb el següent paquet de pàgines. La Liora ha copiat un passatge que vau ajudar a restaurar; al marge ha escrit: \"Aquest l'hem llegit junts a casa\"."
STR_QUEST_CAM_JOURNEY_THANKS_10: "La nota només té unes poques línies. La Liora ha deixat espai per a una resposta, com si ja et pogués veure assegut a l'altre extrem de la taula."
STR_QUEST_CAM_JOURNEY_THANKS_11: "Entre les pàgines recuperades trobareu la nota plegada des de casa. La seva darrera línia és senzilla: \"Encara hi ha un lloc per a tu aquí\"."
