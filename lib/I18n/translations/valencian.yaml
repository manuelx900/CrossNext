STR_FLASHCARDS_HELP: "Copieu les carpetes Anki (.apkg /.colpkg , .anki2 /.anki21 ), CSV /TSV/text o carpetes d'estudi convertides a /FLASHCARDS. Utilitzeu subcarpetes: fins a 128 elements cadascuna.\nLes importacions\naccepten targetes de text bàsiques, invertides i simples. L'àudio i l'HTML personalitzat no són compatibles. Converteix primer les cobertes d'imatge /CJK. Les ressenyes fora de línia utilitzen FSRS. La importació inicia una nova programació i conserva els originals."
