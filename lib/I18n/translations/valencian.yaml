STR_MYST_GUIDE_OBJECTIVE_COPY: "Falta una part de la Bombe, una màquina de trencar codis. Estàs sota sospita. Explica què ha passat, troba proves i decideix en qui confiar. Les teves eleccions porten a diferents finals."
