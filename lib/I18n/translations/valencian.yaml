STR_CAR_GUIDE_OR: "A o B ho van fer"
STR_CAR_GUIDE_OR_COPY: "\"Ho van fer Ana o Bruno\" vol dir que almenys un és culpable. Si el parlant menteix, cap dels dos ho va fer."
STR_CAR_GUIDE_AND: "A i B ho van fer"
STR_CAR_GUIDE_AND_COPY: "\"Ho van fer l'Ana i el Bruno\" diu que tots dos són culpables. Si és mentida, almenys un és innocent."
STR_CAR_GUIDE_COMPARE: "Sinceritat"
STR_CAR_GUIDE_COMPARE_COPY: "\"Tots dos diuen la veritat o tots dos menteixen\" compara les seves declaracions, no la seva culpabilitat. Comprova si les dues afirmacions són certes o totes dues falses."
STR_CAR_GUIDE_NEIGHBOURS: "Veïns"
