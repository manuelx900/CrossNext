STR_QUEST_CAM_DECOR_TEXT_2: "Un mariner rescatat et regala una petxina que encara conté el cant del mar."
STR_QUEST_CAM_DECOR_NAME_3: "Esperit de Tinta"
STR_QUEST_CAM_DECOR_TEXT_3: "Un esperit es va escapar d'una pàgina en blanc. Tria viatjar amb tu."
STR_QUEST_CAM_DECOR_NAME_4: "Flor de lluna"
STR_QUEST_CAM_DECOR_TEXT_4: "Els jardiners van guardar una llavor del jardí dormint. Aquesta flor va créixer per a tu."
STR_QUEST_CAM_DECOR_NAME_5: "Cristall d'hivern"
STR_QUEST_CAM_DECOR_TEXT_5: "El desgel revela un cristall que conté l'últim record de la muntanya."
STR_QUEST_CAM_DECOR_NAME_6: "Mussol mecànic"
STR_QUEST_CAM_DECOR_TEXT_6: "El rellotger repara aquest petit guardià per donar-vos les gràcies per tornar el temps."
STR_QUEST_CAM_DECOR_NAME_7: "Ploma de Fènix"
STR_QUEST_CAM_DECOR_TEXT_7: "De les cendres recuperades sorgeix una ploma: la promesa que les històries poden començar de nou."
STR_QUEST_CAM_DECOR_NAME_8: "Làmpada del desert"
STR_QUEST_CAM_DECOR_TEXT_8: "Un contacontes et regala el llum que va mantenir vius els contes del desert."
STR_QUEST_CAM_DECOR_NAME_9: "Núvol Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "Obriu la gàbia del núvol. Un petit koi es queda per vigilar els teus somnis."
STR_QUEST_CAM_DECOR_NAME_10: "Cor de Drac"
STR_QUEST_CAM_DECOR_TEXT_10: "Els dracs et confien un cristall que neix de la seva memòria recuperada."
STR_QUEST_CAM_DECOR_NAME_11: "Estrella de la memòria"
STR_QUEST_CAM_DECOR_TEXT_11: "La primera estrella restaurada t'il·lumina cap a les pàgines finals."
STR_QUEST_CAM_DECOR_NAME_12: "Brot de lectura"
STR_QUEST_CAM_DECOR_TEXT_12: "Una petita planta per a un racó de lectura tranquil."
