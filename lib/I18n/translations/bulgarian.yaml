STR_PET_GUIDE_HYGIENE: "Почистете вашия домашен любимец безплатно, за да предотвратите заболяване. Ако вече е болно, дайте му лекарство в Health."
STR_PET_GUIDE_READING: "Изберете яйце и отгледайте любимеца си с четене. Осигурете му храна, компания, почивка и почистване."
