STR_PET_RETIRE_CONFIRM: "Приключи и запази този живот"
STR_PET_RETIRE_HELP: "Този живот ще свърши. Когато започнете друго яйце, неговото резюме, обекти, разпоредби, средства за защита и напредъкът на проекта остават. Подробните сцени от паметта не се архивират."
