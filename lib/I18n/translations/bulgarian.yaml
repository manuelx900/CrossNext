STR_INTERCEPT_TITLE_2: "ХАРИС ПРИСТИГА"
STR_INTERCEPT_TEXT_2: "Харис влиза с чаена чаша и папка. Липсва макара от Bombe. Вашето име беше в списъка на дежурствата. Той слага чашата до вас и пита къде сте били снощи."
STR_INTERCEPT_CHOICE_2_0: "Изпийте чая"
STR_INTERCEPT_CHOICE_2_1: "Оставете чая недокоснат"
STR_INTERCEPT_CHOICE_2_2: "Отговорете спокойно"
STR_INTERCEPT_TITLE_3: "КОМПОНЕНТЪТ"
STR_INTERCEPT_TEXT_3: "В подплатата на палтото ви пръстите ви срещат студен метал. Компонентът все още е там. Хупър каза, че вземането му ще спре изнудването. Сега заключената врата има друго значение."
