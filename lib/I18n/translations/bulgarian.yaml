STR_UI_SWIPE_OR_TAP_AN_ARROW_TO_887004: "Плъзнете или докоснете стрелка, за да управлявате. Яжте очертаната храна, за да растете. Избягвайте стените и собствената си опашка. Не можете да обърнете посоката. Докоснете Пауза, преди да оставите четеца. Запазените игри винаги се възобновяват на пауза."
STR_UI_YOU_PLAY_BLACK_TAP_AN_EMPTY_29AEBA: "Играеш черно. Докоснете празен квадрат, който улавя бели дискове в права линия. Всички хванати дискове се обръщат към вашия цвят. Устройството възпроизвежда бели. Ако страна няма законен ход, тя преминава автоматично. Повечето дискове печелят, когато нито една страна не може да се движи."
STR_UI_MAKE_ONE_CLOSED_LOOP_EACH_NUMBER_D60227: "Направете един затворен цикъл. Всяко число показва колко от неговите четири ръба принадлежат на цикъла. Докоснете близо до ръб, за да преминете през линия, пресечете и изпразнете. Линиите не могат да се разклоняват или да образуват отделни цикли. Всички улики трябва да съвпадат. Всяко валидно решение се приема."
STR_UI_CONNECT_ALL_ISLANDS_IN_ONE_NETWORK_C5618B: "Свържете всички острови в една мрежа. Числото на остров е необходимият брой мостове. Докоснете два съседни острова в един и същ ред или колона, за да преминете един, два и нула мостове. Мостовете не могат да прескачат острови. Печели всяко свързано решение, съответстващо на всички числа."
