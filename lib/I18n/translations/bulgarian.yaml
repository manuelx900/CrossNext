STR_INTERCEPT_CHOICE_3_1: "Подайте го на Harris"
STR_INTERCEPT_TITLE_4: "ПЕЧЕЛИВША ИГРА"
STR_INTERCEPT_TEXT_4: "Сътрудничеството може да запази доверието ви. Една убедителна лъжа може да спечели време. Escape щеше да размени заключена стая за пазачите отвън. Нито един от тези ходове не може да бъде върнат."
STR_INTERCEPT_CHOICE_4_0: "Сътрудничи"
STR_INTERCEPT_CHOICE_4_1: "Измислете си алиби"
STR_INTERCEPT_CHOICE_4_2: "Разгледайте прозореца"
STR_INTERCEPT_TITLE_5: "ЧАЯТ"
STR_INTERCEPT_TEXT_5: "Стаята се накланя. Харис забелязва мълчанието ви, но лицето му вече се отдалечава. Когато следващия път отворите очи, друг чифт обувки стои до масата."
STR_INTERCEPT_CHOICE_5_0: "Преструвай се, че спиш"
STR_INTERCEPT_CHOICE_5_1: "Изправете се срещу посетителя"
STR_INTERCEPT_CHOICE_5_2: "Поискайте вода"
STR_INTERCEPT_TITLE_6: "МАЛЪК ОТКАЗ"
STR_INTERCEPT_TEXT_6: "Избутваш чашата. Харис наблюдава движението по-внимателно, отколкото отговора. Пита дали има някой друг, когото да разпита."
STR_INTERCEPT_CHOICE_6_0: "Попитайте какви доказателства има"
STR_INTERCEPT_CHOICE_6_1: "Споменете Хупър"
STR_INTERCEPT_CHOICE_6_2: "Погледни към прозореца"
STR_INTERCEPT_TITLE_7: "ЛИПСВАЩАТА МАКАРА"
STR_INTERCEPT_TEXT_7: "Харис иска директен отговор. Взехте ли компонента? Можете да му кажете какво има в палтото ви, да обясните натиска, който Хупър е оказал, или да се опитате да насочите обвинението другаде."
STR_INTERCEPT_CHOICE_7_0: "Дайте му компонента"
STR_INTERCEPT_CHOICE_7_1: "Обяснете изнудването"
STR_INTERCEPT_CHOICE_7_2: "Обвинете Хупър"
STR_INTERCEPT_TITLE_8: "МЕТАЛ НА МАСАТА"
STR_INTERCEPT_TEXT_8: "Компонентът лежи между вас. Харис го проверява, без да се отпуска. Връщането на откраднато оборудване не обяснява защо е взето. Той иска име и нещо по-надеждно от вашата дума."
STR_INTERCEPT_CHOICE_8_0: "Предложете да намерите доказателства"
STR_INTERCEPT_CHOICE_8_1: "Останете и отговаряйте на въпроси"
STR_INTERCEPT_TITLE_9: "АЛИБИТО"
STR_INTERCEPT_TEXT_9: "Описвате тиха вечер на бюрото си. Харис отваря файла. Един пазач те видя да излизаш от машинното отделение. Вашият измислен акаунт вече има свидетел срещу него."
STR_INTERCEPT_CHOICE_9_0: "Защитете историята"
STR_INTERCEPT_CHOICE_9_1: "Признай изнудването"
STR_INTERCEPT_CHOICE_9_2: "Откажете се от допълнителни въпроси"
STR_INTERCEPT_TITLE_10: "ПРОЗОРЕЦЪТ"
STR_INTERCEPT_TEXT_10: "Прозорецът е висок и стъклото е дебело. Отвъд него пътеката минава покрай друга хижа. Счупването му би било шумно; чакането тук крие своите опасности."
STR_INTERCEPT_CHOICE_10_0: "Счупете стъклото"
STR_INTERCEPT_CHOICE_10_1: "Разгледайте пътя отвън"
STR_INTERCEPT_CHOICE_10_2: "Върнете се към интервюто"
STR_INTERCEPT_TITLE_11: "ДРУГ ПОСЕТИТЕЛ"
STR_INTERCEPT_TEXT_11: "Хупър дойде, докато ти си нестабилен. Той иска да знае дали Харис има компонента. Той държи едната си ръка близо до вратата."
STR_INTERCEPT_CHOICE_11_0: "Преструвай се, че спиш"
STR_INTERCEPT_CHOICE_11_1: "Поискайте обяснение"
STR_INTERCEPT_CHOICE_11_2: "Поискайте вода"
STR_INTERCEPT_TITLE_12: "ПРЕДУПРЕЖДЕНИЕ"
STR_INTERCEPT_TEXT_12: "Обаждаш се на Харис, преди чаят да се хване. Той се връща раздразнен. Обвинение за чашата ще се нуждае от нещо, което може да тества."
STR_INTERCEPT_CHOICE_12_0: "Запазете чашата като доказателство"
STR_INTERCEPT_CHOICE_12_1: "Обвинете Харис, че ви е отровил"
STR_INTERCEPT_CHOICE_12_2: "Концентрирайте се върху макарата"
STR_INTERCEPT_TITLE_13: "ХУПЪР"
STR_INTERCEPT_TEXT_13: "Харис разпознава името. Хупър е полезен, има добри връзки и също не отсъства от снощния списък. Признанието не е доказателство."
STR_INTERCEPT_CHOICE_13_0: "Намерете нещо проверимо"
STR_INTERCEPT_CHOICE_13_1: "Настоявайте, че Хупър го е откраднал"
STR_INTERCEPT_TITLE_14: "ИЗНУДВАНЕ"
STR_INTERCEPT_TEXT_14: "Описвате млад мъж, предадено доверие и последвалото търсене. Харис слуша, без да ти помага. Назоваването на човека, който е заложил капана, също може да разкрие лицето, което сте се надявали да защитите."
STR_INTERCEPT_CHOICE_14_0: "Дайте на Харис пълната сметка"
STR_INTERCEPT_CHOICE_14_1: "Изключете имената"
STR_INTERCEPT_CHOICE_14_2: "Предложете начин да хванете Хупър"
STR_INTERCEPT_TITLE_15: "ЛЕСНО ОБВИНЕНИЕ"
STR_INTERCEPT_TEXT_15: "Хупър, казваш, трябва да носи отговорност. Харис пита откъде знаеш. Има разлика между решаването на проблем и представянето на свидетел, който може да докаже отговора."
STR_INTERCEPT_CHOICE_15_0: "Нека Харис оспори иска"
STR_INTERCEPT_CHOICE_15_1: "Опитайте лично съобщение до Хупър"
STR_INTERCEPT_TITLE_16: "УЛИКА ЗА ТЕСТВАНЕ"
STR_INTERCEPT_TEXT_16: "Една история може да бъде отказана. Документ, свидетел или липсващ компонент е по-трудно да се обясни. Имате малко време да изберете какво да преследвате."
STR_INTERCEPT_CHOICE_16_0: "Огледайте близката хижа"
STR_INTERCEPT_CHOICE_16_1: "Използвайте сутрешното прихващане"
STR_INTERCEPT_CHOICE_16_2: "Задайте директно въпрос на Хупър"
STR_INTERCEPT_TITLE_17: "ПОВЕЧЕ ОТ ВРЪЩАНЕ"
STR_INTERCEPT_TEXT_17: "Машината може да работи отново, но Харис все още трябва да обясни пробив в сигурността. Той ви предлага последна възможност да установите кой го е организирал."
STR_INTERCEPT_CHOICE_17_0: "Покажете доказателствата"
STR_INTERCEPT_CHOICE_17_1: "Потърсете доказателство"
STR_INTERCEPT_CHOICE_17_2: "Приемете преценката му"
STR_INTERCEPT_TITLE_18: "ПРОТИВОРЕЧИЕ"
STR_INTERCEPT_TEXT_18: "Харис поставя първия ви отговор до последния ви. И двете не могат да бъдат верни. Можете да изоставите лъжата или да оставите интервюто да завърши с противоречие."
STR_INTERCEPT_CHOICE_18_0: "Кажете истината за изнудването"
STR_INTERCEPT_CHOICE_18_1: "Продължавай да отричаш всичко"
STR_INTERCEPT_CHOICE_18_2: "Опитайте се да си тръгнете"
STR_INTERCEPT_TITLE_19: "МЪЛЧАНИЕ"
STR_INTERCEPT_TEXT_19: "Скръстваш ръце. Харис затваря файла. В тази стая мълчанието не слага край на разследването; това само приключва вашата роля в насочването му."
STR_INTERCEPT_CHOICE_19_0: "Чуйте решението"
STR_INTERCEPT_TITLE_20: "СЧУПЕНО СТЪКЛО"
STR_INTERCEPT_TEXT_20: "Панелът отстъпва. Студеният въздух и звукът на свирката на охраната пристигат заедно. Има време за едно решение, преди някой да стигне до вратата."
STR_INTERCEPT_CHOICE_20_0: "Бягайте към външната пътека"
STR_INTERCEPT_CHOICE_20_1: "Оставете кодирана следа"
STR_INTERCEPT_CHOICE_20_2: "Остани и обясни"
STR_INTERCEPT_TITLE_21: "МЕЖДУ ХИБИТЕ"
STR_INTERCEPT_TEXT_21: "Пътеката е мокра. Хижата на Хупър е достатъчно близо, за да се стигне преди следващия патрул, но откритата земя отвъд нея предлага различен вид шанс."
STR_INTERCEPT_CHOICE_21_0: "Опитайте се да избягате от територията"
STR_INTERCEPT_CHOICE_21_1: "Отидете в колибата на Хупър"
STR_INTERCEPT_CHOICE_21_2: "Върнете се при Харис"
STR_INTERCEPT_TITLE_22: "ЧАСТНА ИГРА"
STR_INTERCEPT_TEXT_22: "Хупър те изучава. На масата той поставя въображаема шах позиция с пръсти. Един кодиран отговор би могъл да го накара да разкрие това, което прякото обвинение никога не би направило."
STR_INTERCEPT_CHOICE_22_0: "Отговорете с шахматна подсказка"
STR_INTERCEPT_CHOICE_22_1: "Заплаши да го назовеш"
STR_INTERCEPT_CHOICE_22_2: "Говорете честно"
STR_INTERCEPT_TITLE_23: "ЛИЦЕ В ЛИЦЕ"
STR_INTERCEPT_TEXT_23: "Хупър пита какво всъщност можете да докажете. Увереността му се разклаща само когато споменете подробности, които някой извън неговия план не трябва да знае."
STR_INTERCEPT_CHOICE_23_0: "Дайте му доказателство"
STR_INTERCEPT_CHOICE_23_1: "Предложете компонента като сделка"
STR_INTERCEPT_CHOICE_23_2: "Блъф"
STR_INTERCEPT_TITLE_24: "ЧАШАТА"
STR_INTERCEPT_TEXT_24: "Хупър носи вода, но пръв посяга към чашата. Задържането на тази чаша може да е по-полезно от приемането на всичко друго, което предлага."
STR_INTERCEPT_CHOICE_24_0: "Запазете чашата"
STR_INTERCEPT_CHOICE_24_1: "Проверете отново палтото си"
STR_INTERCEPT_TITLE_25: "НЕЩО ЗА ТЕСТВАНЕ"
STR_INTERCEPT_TEXT_25: "Задържате чашата и молите Харис да я прегледа. Това най-накрая е обвинение с прикрепен към него предмет. Опитът на Хупър да го премахне предоставя втора полезна подробност."
STR_INTERCEPT_CHOICE_25_0: "Дайте чашата на Харис"
STR_INTERCEPT_CHOICE_25_1: "Изправете се срещу Хупър с него"
STR_INTERCEPT_TITLE_26: "ГРЕШНАТА ЦЕЛ"
STR_INTERCEPT_TEXT_26: "Обвинявате Харис без доказателства. Той вижда заподозрян, който се опитва да дискредитира следователя. Каквото и да се е случило с чая, вие сте направили по-трудно за него да ви повярва."
STR_INTERCEPT_CHOICE_26_0: "Интервюто приключва"
STR_INTERCEPT_TITLE_27: "ЦЕЛИЯТ АКАУНТ"
STR_INTERCEPT_TEXT_27: "Вие давате имената и описвате срещата. Харис задава точни въпроси. Вашето смущение е истинско, но също и подробностите, които той вече може да провери."
STR_INTERCEPT_CHOICE_27_0: "Нека верифицира акаунта"
STR_INTERCEPT_CHOICE_27_1: "Предложете да намерите Хупър"
STR_INTERCEPT_TITLE_28: "НЕУСПЕШЕН БЛЪФ"
STR_INTERCEPT_TEXT_28: "Харис е чувал достатъчно уверени отговори. Хупър също има. Нито едно от двете не потвърждава факта, че вашата история липсва."
STR_INTERCEPT_CHOICE_28_0: "Упорствайте в иска"
STR_INTERCEPT_CHOICE_28_1: "Направете отчаяно бягство"
STR_INTERCEPT_CHOICE_28_2: "Признайте какво наистина се е случило"
STR_INTERCEPT_TITLE_29: "ПРИХВАЩАНЕТО"
STR_INTERCEPT_TEXT_29: "Листът в джоба ви съдържа повече от разбъркани букви: маршрутът му през колибите поставя Хупър близо до машината. Една кратка следа може да накара правилния човек да търси на правилното място."
STR_INTERCEPT_CHOICE_29_0: "Кодирайте съобщение за Хупър"
STR_INTERCEPT_CHOICE_29_1: "Покажете маршрута до Харис"
STR_INTERCEPT_TITLE_30: "МАШИНАТА РАБОТИ"
STR_INTERCEPT_TEXT_30: "Харис има компонента и следа, която води отвъд първите ви уплашени отговори. Бомбата възобновява работата си. Напускате Hut 14 под собственото си име, с по-малко тайни и бъдеще, за което все още трябва да отговаряте."
STR_INTERCEPT_TITLE_31: "ПОД ПОДОЗРЕНИЕ"
STR_INTERCEPT_TEXT_31: "Връщането на компонента спаси машината от забавяне. Това не спаси позицията ви. Харис прекратява достъпа ви до колибите, докато разследването продължава. Преживяхте интервюто, но не изчистихте името си."
STR_INTERCEPT_TITLE_32: "В ЗАДЪРЖАНИЕ"
STR_INTERCEPT_TEXT_32: "Вратата се отваря за пазача, а не за вас. Противоречия, липсващи доказателства и откраднат компонент се превърнаха в случай, който вече не можете да ръководите. Този опит свършва тук."
STR_INTERCEPT_TITLE_33: "ВЪНШНАТА ПЪТЕКА"
STR_INTERCEPT_TEXT_33: "Оставяш колибите зад себе си. Тъмнината е полезна, но терените се наблюдават. Счупен прозорец е приближил патрулите повече, отколкото сте се надявали."
STR_INTERCEPT_CHOICE_33_0: "Пресечете откритата земя"
STR_INTERCEPT_CHOICE_33_1: "Придържайте се към сервизния път"
STR_INTERCEPT_CHOICE_33_2: "Обърни се назад и с лице към Харис"
STR_INTERCEPT_TITLE_34: "ХИЖАТА НА ХУПЕР"
STR_INTERCEPT_TEXT_34: "Бюрото е без надзор. Документите лежат под кръстословица, а машинното помещение се появява в график с молив. Стъпки се приближават по дъските отвън."
STR_INTERCEPT_CHOICE_34_0: "Разгледайте документите"
STR_INTERCEPT_CHOICE_34_1: "Изчакайте Хупър"
STR_INTERCEPT_CHOICE_34_2: "Тръгни за Харис"
STR_INTERCEPT_TITLE_35: "ЗАДАЧА ЗА ШАХ"
STR_INTERCEPT_TEXT_35: "Давате на Хупър позиция, която отразява затрудненото му положение: защитена фигура, открит цар и ход, който изглежда безопасен до отговора. Той разбира предупреждението. Следващите му думи осигуряват връзката, от която се нуждаете."
STR_INTERCEPT_CHOICE_35_0: "Помолете го да признае плана"
STR_INTERCEPT_CHOICE_35_1: "Изпратете допускането до Харис"
STR_INTERCEPT_TITLE_36: "БЕЗ МАСКА"
STR_INTERCEPT_TEXT_36: "Говорите за натиска, вместо да се преструвате, че никога не е съществувал. Хупър отговаря накратко като човек, а не като опонент. Този отвор може да се използва за търговия или капан."
STR_INTERCEPT_CHOICE_36_0: "Поискайте честно споразумение"
STR_INTERCEPT_CHOICE_36_1: "Помолете го да си признае"
STR_INTERCEPT_CHOICE_36_2: "Занесете сметката на Харис"
STR_INTERCEPT_TITLE_37: "ВХОД ЗА ХУПЕР"
STR_INTERCEPT_TEXT_37: "Хупър обяснява достатъчно, за да свърже изнудването с липсващия компонент. Сега Харис може да възстанови оборудването и да провери историята. Трябва да решите дали да приключите разследването или да оставите Хупър да изчезне."
STR_INTERCEPT_CHOICE_37_0: "Донесете входа на Харис"
STR_INTERCEPT_CHOICE_37_1: "Пусни Хупър и си тръгни"
STR_INTERCEPT_TITLE_38: "ТЪРГОВИЯТА"
STR_INTERCEPT_TEXT_38: "Поставяте последната си част от ливъриджа в обсега на Хупър. Сделка без свидетел и доказателства е покана за него да реши проблема си за ваша сметка."
STR_INTERCEPT_CHOICE_38_0: "Предайте компонента"
STR_INTERCEPT_CHOICE_38_1: "Изисквайте свидетелско споразумение"
STR_INTERCEPT_CHOICE_38_2: "Оттеглете офертата"
STR_INTERCEPT_TITLE_39: "ХАРИС СЛУША"
STR_INTERCEPT_TEXT_39: "Детайлите могат да се проверят. Харис пита къде е компонентът сега. Изчистването на вашия акаунт и стартирането на машината са свързани проблеми, но не са едно и също."
STR_INTERCEPT_CHOICE_39_0: "Върни каквото има в палтото ти"
STR_INTERCEPT_CHOICE_39_1: "Помогнете за възстановяването на компонента"
STR_INTERCEPT_CHOICE_39_2: "Спри да отговаряш сега"
STR_INTERCEPT_TITLE_40: "ОТВЪД ОГРАДАТА"
STR_INTERCEPT_TEXT_40: "Колибите изчезват зад теб. Свободата извън парка не е същото като невинността, а машината сега е спешен проблем на някой друг. Ти си избягал, историята остава незавършена."
STR_INTERCEPT_TITLE_41: "ПОСЛЕДНАТА ГРЕШКА"
STR_INTERCEPT_TEXT_41: "Патрулът ви достига преди края на откритата земя или обещанието на Хупър се срива, когато вече не му е полезно. Свършихте безопасните ходове. Историята може да се опита отново от началото."
STR_INTERCEPT_TITLE_42: "ХАРТИИТЕ"
STR_INTERCEPT_TEXT_42: "Графикът поставя Хупър там, където каза вашата история. До него е бележката, която за първи път ви въвлече в капана. Комбинацията е достатъчно конкретна, за да я провери Харис."
STR_INTERCEPT_CHOICE_42_0: "Занесете документите на Харис"
STR_INTERCEPT_CHOICE_42_1: "Изчакайте и се изправете срещу Хупър"
STR_INTERCEPT_TITLE_43: "ЕДНА ПОСЛЕДНА УГОВОРКА"
STR_INTERCEPT_TEXT_43: "Хупър предлага да върне частта обратно. Доверяването му би премахнало един непосредствен проблем; превръщането на Харис в свидетел би затруднило създаването на друг."
STR_INTERCEPT_CHOICE_43_0: "Уредете връщане при свидетел"
STR_INTERCEPT_CHOICE_43_1: "Включете Харис в плана"
STR_INTERCEPT_TITLE_44: "ВЪЗСТАНОВЯВАНЕ НА МАКАРАТА"
STR_INTERCEPT_TEXT_44: "При регистриран акаунт търсенето се връща към липсващия хардуер. Харис проверява машинното помещение, докато вие определяте къде трябва да бъде компонентът."
STR_INTERCEPT_CHOICE_44_0: "Завършете потвърденото връщане"
STR_INTERCEPT_CHOICE_44_1: "Вземете го от палтото си"
STR_INTERCEPT_CHOICE_44_2: "Предупредете Харис за Хупър"
STR_INTERCEPT_TITLE_45: "ПОСЛЕДНИЯТ ВЪПРОС"
STR_INTERCEPT_TEXT_45: "Харис чака. Ако можете да свържете Хупър с кражбата, все още има начин да възстановите компонента и да прекратите това правилно. В противен случай разследването има само вашата променяща се сметка."
STR_INTERCEPT_CHOICE_45_0: "Представете доказателствата"
