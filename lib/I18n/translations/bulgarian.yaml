STR_PET_GUIDE_FEED: "Печелите едно лекарство за 30 минути четене и друго за 120 минути всеки ден. Използвайте ги в Health, ако вашият домашен любимец се разболее."
STR_PET_GUIDE_GAMES: "Първите 3 игри всеки ден подобряват настроението и използват 20 енергия. След това можеш да тренираш безплатно. Преди игра се погрижи за болен, гладен, уморен или спящ любимец."
