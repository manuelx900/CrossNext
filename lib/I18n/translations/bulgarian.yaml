STR_CAR_HELP_TEXT: "КАК ДА РАЗРЕШИМ СЛУЧАЙ\nВсеки герой прави едно изявление. Горната част на екрана дава точния брой на виновниците и фалшиви твърдения. Намерете комбинация, която задоволява и двете бройки. Всеки случай има едно решение.\n  \nВината не е честност\nНевинен герой може да лъже и виновникът може да каже истината. Две лъжи означават, че точно две цели изявления са фалшиви; другите са верни. Знаците за истина / лъжа се отнасят до изявлението; Заподозреният се отнася до вината.\n  \nЧетене на уликите\n\"А или Б са го направили (или и двамата)\" означава, че поне един от посочените герои е виновен. \"А и Б са го направили\" изисква и двамата. Лъжата отрича цялото твърдение: невярно ИЛИ означава, че нито един от тях не е направил; невярно И означава, че поне един от тях не е направил.\n  \n\"И двамата са верни или и двамата лъжат\" сравнява твърденията, а не вината. \"Точно един лъже\" означава, че техните твърдения имат различни стойности на истината. Тези улики могат сами да бъдат верни или неверни.\n  \nСъседи на малък екран\nОригиналният кръгъл ред е Пантера, Паун, Акула, Лисица, Мечка, Елен, Кон, използвайки само знаците на този случай. Последният и първият са съседи. Това приложение пише двете имена директно във всеки съседен улика. Никога не е нужно да се досетите кои карти са до портрет. Промяната на страницата или ориентация не променя улика.\n  \nВисочина и тегло\nВсяка карта показва измислена височина и диета. \"Виновникът е по-висок от мен\" означава, че поне един виновник е по-висок от говорителя, а не непременно всички виновници. По-кратките работи по същия начин. Хищни и тревопасни улики означават, че поне един виновник има тази диета; всеядните се броят като нито едното, нито другото. Имената, височината и диетите са надеждни факти; изявленията могат да лъжат.\n  \nВашият анализ\nИзползвайте? / Истина / Лъжа и Заподозрян под всяко твърдение, за да записвате хипотези. Това са вашите бележки, а не доказателства или автоматични проверки. Стрелките показват другите знаци. Портретният режим показва до три на страница.\n  \nОбвинителни актове\nНатиснете Обвинение и изберете точно необходимия брой виновници. Само потвърждаване на грешно обвинение прекарва един живот. Начинаещ и Нормални имат два живота; напреднали и експерти имат един. Правилното обвинение решава случая. С не остават животи, решението се разкрива.\n  \nКампания и повторение\nИма 1470 случая. Отвореният случай възобновява текущия опит или отваря следващия след затворения. Кампанията ви позволява да изберете който и да е от 1470-те случая в произволен ред от началото. Преиграването започва нов опит, като запазва по-ранното завършване. Във всяка трудност случаите напредват от един виновник до двама, след това от по-малко лъжци до повече във всяка група виновници. Начинаещият запазва един виновник. По-малките хвърляния идват първо, когато броят съвпада. Всички случаи остават на разположение. Решаването на предварително изчерпан случай го надгражда до разрешен.\n  \nНапредъкът и животите се записват на картата. Излизането, заспиването или рестартирането на устройството не възстановява животите в текущия опит. Неуспешното запазване блокира резултата, докато повторният опит успее. Нулиране на всички иска потвърждение, преди да изтрие само напредъка на Хищник."
