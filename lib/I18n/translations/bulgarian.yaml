STR_QUEST_CAM_DECOR_NAME_10: "Сърце на дракон"
STR_QUEST_CAM_DECOR_TEXT_10: "Драконите ви поверяват кристал, роден от възстановената им памет."
STR_QUEST_CAM_DECOR_NAME_11: "Звезда на паметта"
STR_QUEST_CAM_DECOR_TEXT_11: "Първата възстановена звезда осветява пътя ви към последните страници."
STR_QUEST_CAM_DECOR_NAME_12: "Кълн на четенето"
STR_QUEST_CAM_DECOR_TEXT_12: "Малко растение за тих кът за четене."
STR_QUEST_CAM_DECOR_NAME_13: "Запазени книги"
STR_QUEST_CAM_DECOR_TEXT_13: "Истории, чакащи своя следващ читател."
STR_QUEST_CAM_DECOR_NAME_14: "Банер на Вояджър"
STR_QUEST_CAM_DECOR_TEXT_14: "Вимпел за запомняне на всяко ново начало."
STR_QUEST_CAM_DECOR_NAME_15: "Лунни гъби"
STR_QUEST_CAM_DECOR_TEXT_15: "Малко късче гора за вашия дом."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Началото на приключението"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Дълги години хората живееха в мир и се наслаждаваха на книгите си. Тогава кралят на забравата започна да ги унищожава. Искаше да спре всички да четат и всички истории да изчезнат завинаги."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Чудовищата на краля"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Кралят на забравата изпрати своите чудовища по целия свят. Те унищожиха всяка книга, която намериха, и нападнаха всеки, който се опита да ги спре. Библиотеките започнаха да изчезват и хората спряха да четат."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Силата на четенето"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Един ден, докато четете близо до вашето село, се появява чудовище. Опитвате се да се измъкнете, но се случва нещо изненадващо: колкото повече четете, толкова по-слабо става. Разбираш, че четенето е единственият начин да се бориш с магията на краля."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Вашата мисия"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Ти се зае да спреш краля. По пътя си към неговия замък трябва да пресичате гори, градове, планини и други места, пълни с врагове. Всяко чудовище, което победите, ви отвежда малко по-близо. Продължете да четете, победете пазителите му и достигнете до него, преди той да унищожи всяка книга в света."
