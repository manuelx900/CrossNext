STR_QUEST_CAM_JOURNEY2_BOOK_8: "Градината на боговете"
STR_QUEST_CAM_JOURNEY2_BOOK_9: "Войната за книгите"
STR_QUEST_CAM_JOURNEY2_BOOK_10: "Пътят на звездите"
STR_QUEST_CAM_JOURNEY2_BOOK_11: "Последната страница"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "След като победите Краля на забравата, вие се връщате у дома. Неговата армия вече не може да унищожава книги и хората отново четат в мир. Вие спасихте историите на света. Остават още много книги за откриване."
