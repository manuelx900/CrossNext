STR_PET_STORY_0: "Семето"
STR_PET_STORY_TEXT_0: "Завършвате глава. До вашия спътник е поникнало малко семе. Даваш му място до прозореца."
STR_PET_STORY_1: "Дъждовен ден"
STR_PET_STORY_TEXT_1: "Дъждът почуква по прозореца, докато четеш. Вашият спътник се свива наблизо. За известно време цялата стая се чувства като подслон."
STR_PET_STORY_2: "Посетителят"
STR_PET_STORY_TEXT_2: "Птица каца до прозореца. Вашият спътник гледа тихо, докато не отлети. Маркирате страницата си и се усмихвате."
STR_PET_STORY_3: "Хартиена лодка"
STR_PET_STORY_TEXT_3: "Парче хартия се превръща в малка лодка. Вашият спътник го следва през масата, сякаш крие цяло приключение."
STR_PET_STORY_4: "Под звездите"
STR_PET_STORY_TEXT_4: "След като прочетете, гледате заедно. Появява се една звезда, след това друга. Има още толкова много за откриване."
STR_PET_STORY_5: "Изгубеният лист"
STR_PET_STORY_TEXT_5: "Вашият спътник ви носи лист. Държите го до отметката си: малък подарък от един обикновен ден."
STR_PET_STORY_6: "Тихо кътче"
STR_PET_STORY_TEXT_6: "Намирате удобно кътче и отваряте книгата си. Вашият спътник се настанява до вас. Никой от вас не бърза."
STR_PET_STORY_7: "Нов път"
STR_PET_STORY_TEXT_7: "Още една страница ви отвежда на ново място. Вашият спътник се протяга и ви гледа, готов за утрешната глава."
