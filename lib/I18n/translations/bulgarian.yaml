STR_INTERCEPT_TITLE_1: "ОБВИНЕНИЕТО"
STR_INTERCEPT_TEXT_1: "Подозират държавна измяна. Вие решавате фигури, кръстословици и шахматни позиции, за да си изкарвате прехраната. Тази стая е друг проблем: противоречите си и вашата достоверност може да бъде първата жертва."
