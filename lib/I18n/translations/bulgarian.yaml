STR_FLASHCARDS_HELP: "Копиране на тестета Anki (.apkg /.colpkg, .anki2 /.anki21), CSV /TSV/text или конвертирани папки Study в /FLASHCARDS. Използвайте подпапки: до 128 елемента всяка.\n\nImports приема основни, обърнати и прости затворени текстови карти. Аудиото и персонализираният HTML не се поддържат. Първо преобразувайте колодите на изображения /CJK. Офлайн прегледите използват FSRS. Импортирането стартира нов график и запазва оригиналите."
