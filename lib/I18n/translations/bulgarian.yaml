STR_PET_GUIDE_DIFFICULTY: "Relaxed няма срок за връщане към четене. Normal позволява 7 дни, Hard 3 дни и Extreme 24 часа. Ако срокът изтече, вашият домашен любимец умира. Четенето стартира таймера отново."
STR_PET_GUIDE_PROJECT: "Изберете обект и четете до 60 минути, за да го спечелите. Смяната на проекти започва от нула. Можете да премахвате притежавани обекти, без да ги губите; те се предават по наследство."
