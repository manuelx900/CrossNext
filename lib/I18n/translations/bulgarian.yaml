STR_CAR_GUIDE_OR: "А или Б го направиха"
STR_CAR_GUIDE_OR_COPY: "„Ана или Бруно го направиха“ означава поне един да е виновен. Ако говорещият лъже, никой от двамата не го е направил."
STR_CAR_GUIDE_AND: "А и Б го направиха"
STR_CAR_GUIDE_AND_COPY: "„Ана и Бруно го направиха“ казва, че и двамата са виновни. Ако е лъжа, поне един е невинен."
STR_CAR_GUIDE_COMPARE: "Искреност"
STR_CAR_GUIDE_COMPARE_COPY: "„И двамата казват истината или и двамата лъжат“ сравнява техните твърдения, а не тяхната вина. Проверете дали и двете твърдения са верни или и двете са неверни."
STR_CAR_GUIDE_NEIGHBOURS: "Съседи"
STR_CAR_GUIDE_NEIGHBOURS_COPY: "Уликите директно назовават и двамата съседи. Смяната на страници не променя връзката."
STR_CAR_GUIDE_RELIABLE: "Надеждни факти"
STR_CAR_GUIDE_RELIABLE_COPY: "Имената, ръстовете и диетите са надеждни. Твърденията могат да лъжат. Височините са измислени."
STR_CAR_GUIDE_HEIGHT: "Ръст и диета"
STR_CAR_GUIDE_HEIGHT_COPY: "Височината и диетата на героя са надеждни. „Виновникът е по-висок от мен“ сравнява виновника с говорещия. Всеядните не се считат за месоядни или тревопасни."
STR_CAR_GUIDE_MARKS: "Вашите бележки"
STR_CAR_GUIDE_MARKS_COPY: "Прочетете всяко твърдение. Използвайте Truth, Lie и Suspect, за да записвате идеите си. Това са вашите бележки: играта все още не ги проверява."
STR_CAR_GUIDE_NAV: "Навигация"
STR_CAR_GUIDE_NAV_COPY: "Има 3 символа на страница в портрет. Стрелките показват останалите."
STR_CAR_GUIDE_CONFIRM: "Потвърдете обвинението"
STR_CAR_GUIDE_CONFIRM_COPY: "Когато вашите идеи отговарят на всяка улика и броя на лъжите, докоснете Обвинение. Изберете виновниците и потвърдете отговора си."
STR_CAR_GUIDE_LIVES: "Животи и резултат"
STR_CAR_GUIDE_LIVES_COPY: "Начинаещ /Normal : 2 живота. Напреднал /Expert : 1. Правилното обвинение решава случая. Без останали животи, вижте решението."
STR_CAR_GUIDE_CAMPAIGN: "Кампания"
