STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_0: "Помогнете ми да сравня страниците, които носим у дома. Име в полето може да ни каже на кое семейство принадлежи споменът."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "Прочетете историите, които съседите са донесли на площада.Трябва да поставим всяко име до живота, към който принадлежи."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "Помогнете ми да сравня историите на моряците, не мога да изпратя друга лодка в канал, който вече не помним."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "Помогнете ми да прочета спасените томове. Когато напуснат тези стаи, искам някой да знае чии истории носят."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "Помогнете ми да сравня историите от приютите, следващият пътешественик трябва да намери пътя, а не поредното подвеждащо ехо."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "Помогнете ни да сравним старите пътувания. Един запомнен кладенец може да направи разликата между пристигането и изчезването в пясъка."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "Помогни ми да изслушам разказите на съседите. Часовникът не може да ми каже какво са се надявали да направят с деня."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "Помогнете ни да прочетем историите, пристигащи от освободените региони. Дворецът е прекарал достатъчно години, говорейки само на себе си."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Помогнете ми да подредя историите на градинарите.Тези семена се нуждаят от повече от името на пакета."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Помогнете ни да поддържаме тези истории в обращение. Искам хората, които намерихме, да могат да се чуват."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Помогнете ни да прочетем историите, които стигат до последния път.Всяка от тях принадлежи на някой, който чака отвъд царските стени."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Помогнете ни да прочетем тези истории изцяло, защото след толкова дълга раздяла техните собственици заслужават повече от името си в списъка."
STR_QUEST_CAM_JOURNEY_THANKS_0: "Лиора изглажда страницата с длан. „Мога да чуя тази реплика отново“, казва тя. Тази вечер тя ще остави книгата отворена до лампата."
STR_QUEST_CAM_JOURNEY_THANKS_1: "На щанда някой мести стол, за да ти направи място. Една недовършена история е придобила друга линия; нейният собственик носи страницата вкъщи с две ръце."
STR_QUEST_CAM_JOURNEY_THANKS_2: "Мара сгъва току-що четлива страница и я поставя до книгата си с приливи и отливи. Преди да се върне до прозореца, тя ви благодари с глас, груб от соления въздух."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Ири поставя лента сух плат между две страници. — Този вече може да пътува. Тя държи тома на гърдите си, преди да го занесе към другите книги."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Тарен опира раницата си на камъка и слуша, докато свършваш. След това повтаря думите на пътешественик, този път без да е необходимо да поглежда страницата."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Надир прокарва лента през пръстите си, четейки име, което беше трудно да се различи преди. Той прави място за вас до огъня."
STR_QUEST_CAM_JOURNEY_THANKS_6: "Орин оставя инструмента, който е въртял в пръстите си. За известно време той говори за лицето в историята и часовникът е оставен да тиктака нечуто."
STR_QUEST_CAM_JOURNEY_THANKS_7: "Сера отдалечава историята от купчината кралски заповеди. Тя иска друг стол, след което изслушва последните му реплики с вас."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Aster маркира страница с чист лист. Тя ти благодари тихо; малко по-късно я чувате да чете същия пасаж до фонтана."
STR_QUEST_CAM_JOURNEY_THANKS_9: "Кратка бележка пристига със следващия пакет от страници. Лиора е копирала пасаж, който помогнахте да възстановите; в полето тя е написала: „Четем това заедно у дома.“"
STR_QUEST_CAM_JOURNEY_THANKS_10: "Бележката е дълга само няколко реда. Лиора е оставила място за отговор, сякаш вече те вижда да седиш в другия край на масата."
STR_QUEST_CAM_JOURNEY_THANKS_11: "Сред възстановените страници намирате сгънатата бележка от дома. Последният му ред е прост: „Все още има място за теб тук.“"
