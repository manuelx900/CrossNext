STR_INTERCEPT_TEXT_0: "Блечли Парк, 1942 г. Държат ви да чакате зад заключена врата. Компонент от изчислителната машина е изчезнал. Сутрешната пресечка шумоли в джоба на палтото ти. Отвън стъпките спират."
