STR_QUEST_CAM_JOURNEY_DAILYREQUEST_1: "Останете с тези истории още малко. Някой на пазара може да разпознае лицето, което думите описват."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_2: "Прочетете тези имена с мен. Искам семейството да чака, когато пристигне следващата лодка."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_3: "Прочетете тази история, преди да я преместя на по-висок рафт. Трябва да знам кои думи все още липсват."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_4: "Прочетете думите на пътниците с мен. Не искам да бъркам старо предупреждение с обаждане, което да последвам."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Преди да тръгнем, искам всеки да чуе собственото си име."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_6: "Прочетете тази страница с мен, преди камбаните да бият. Трябва да помня повече от часа на циферблата."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_7: "Прочетете това свидетелство изцяло. Тук има хора, които са чакали твърде дълго, за да бъдат чути."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Прочетете този спомен близо до фонтана. Бих искал да чуя какво се е надявал да остави след себе си човекът, който е посадил тук."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Прочетете историите, които ви изпратихме. Гласовете от дома могат да ви правят компания, дори и толкова далеч."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Прочетете това писмо, преди да тръгнете. Не е нужно да носите всеки спомен сам."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_11: "Прочетете думите, които сме запазили за вас. Крепостта не е целият свят, колкото и тих да е той."
