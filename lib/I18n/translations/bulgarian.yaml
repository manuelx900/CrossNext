STR_PET_CLEANED: "Отърсва се от водата и се приближава. Възстановена хигиена."
STR_PET_CURED: "Приближава се отново, чувства се по-добре. Здравето възстановено."
STR_PET_EGG_HEALTH: "Грижата става достъпна, когато яйцето се излюпи. Продължавай да четеш!"
STR_PET_HEALTH_HELP: "Хигиената пада бавно с времето. На 20 или по-малко вашият спътник може да се разболее. Почистването е безплатно; лечението използва едно лекарство."
STR_PET_MEDICINE_HELP: "Лекарства на 30 и 120 минути на ден. Почистването предпазва от заболяване; почивката възстановява енергията."
