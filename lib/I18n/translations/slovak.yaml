STR_WORDLE_INSTRUCTIONS: "Uhádnite skryté slovo v 6 pokusoch. Zadajte platné slovo a potvrďte ho, aby ste videli výsledok. Slovo chýbajúce v zozname slov nepoužíva pokus; upravte ho a skúste to znova. Čierna znamená, že písmeno a jeho poloha sú správne. Sivá znamená, že písmeno je v slove, ale na inej pozícii. Biela znamená, že písmeno chýba. Opakované písmená sa počítajú samostatne. V španielčine používajte Ñ a píšte samohlásky s diakritikou bez akcentov."
