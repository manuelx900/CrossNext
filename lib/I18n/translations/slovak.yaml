STR_PET_GUIDE_HYGIENE: "Vyčistite svojho domáceho maznáčika zadarmo, aby pomohol predchádzať chorobe. Ak je už chorý, dajte mu liek v Zdravie."
STR_PET_GUIDE_READING: "Vyberte si vajíčko a vychovajte svojho domáceho maznáčika čítaním. Dajte mu jedlo, spoločnosť, odpočinok a upratovanie."
