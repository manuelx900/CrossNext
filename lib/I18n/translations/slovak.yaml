STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Začiatok dobrodružstva"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Po mnoho rokov ľudia žili v pokoji a tešili sa zo svojich kníh. Potom ich začal kráľ zabudnutia ničiť. Chcel všetkým zabrániť v čítaní a nechať všetky príbehy navždy zmiznúť."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Kráľove príšery"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Kráľ zabudnutia poslal svoje príšery do celého sveta. Zničili každú knihu, ktorú našli, a napadli každého, kto sa ich pokúsil zastaviť. Knižnice začali miznúť a ľudia prestali čítať."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Sila čítania"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Jedného dňa, keď si čítaš neďaleko svojej dediny, objaví sa monštrum. Pokúšate sa dostať preč, ale stane sa niečo prekvapivé: čím viac čítate, tým je to slabšie. Uvedomujete si, že čítanie je jediný spôsob, ako bojovať s kráľovskou mágiou."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Vaša misia"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Vydali ste sa zastaviť kráľa. Na ceste k jeho hradu musíte prejsť cez lesy, mestá, hory a ďalšie miesta plné nepriateľov. Každé monštrum, ktoré porazíte, vás privedie o niečo bližšie. Pokračujte v čítaní, porazte jeho strážcov a dostaňte sa k nemu skôr, ako zničí každú knihu na svete."
