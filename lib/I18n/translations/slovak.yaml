STR_FLASHCARDS_HELP: "Skopírujte balíčky Anki (.apkg /.colpkg , .anki2 /.anki21 ), CSV /TSV/text alebo preveďte študijné priečinky na /FLASHCARDS. Použite podpriečinky: každý až 128 položiek.\nDovoz\nakceptuje základné, obrátené a jednoduché zablokované textové karty. Zvuk a vlastný kód HTML nie sú podporované. Najprv preveďte obrázok /CJK decky. Offline recenzie používajú FSRS. Importovanie spustí nový plán a zachová originály."
