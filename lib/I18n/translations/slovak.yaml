STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_0: "Pomôžte mi porovnať stránky, ktoré prinášame domov. Meno na okraji nám môže povedať, do ktorej rodiny patrí spomienka."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "Prečítajte si príbehy susedov, ktoré priniesli na námestie.Každé meno musíme dať vedľa života, ku ktorému patrí."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "Pomôžte mi porovnať príbehy námorníkov, nemôžem poslať ďalšiu loď do kanála, ktorý si už nepamätáme."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "Pomôžte mi prečítať zachránené zväzky. Keď odídu z týchto miestností, chcem, aby niekto vedel, koho príbehy nesú."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "Pomôžte mi porovnať príbehy z útulkov, aby ďalší cestujúci našiel cestu, nie ďalšiu zavádzajúcu ozvenu."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "Pomôžte nám porovnať staré cesty. Zapamätaná studňa môže znamenať rozdiel medzi príchodom a zmiznutím v piesku."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "Pomôž mi vypočuť si príbehy susedov, hodiny mi nemôžu povedať, čo dúfali, že urobia s dňom."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "Pomôžte nám čítať príbehy, ktoré prichádzajú z oslobodených oblastí. Palác strávil dosť rokov hovorením len sám so sebou."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Pomôžte mi usporiadať príbehy záhradkárov, tieto semená potrebujú viac ako len názov na balíčku."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Pomôžte nám udržať tieto príbehy v obehu. Chcem, aby sa ľudia, ktorých sme našli, navzájom počuli."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Pomôžte nám čítať príbehy, ktoré sa dostanú na poslednú cestu. Každý z nich patrí niekomu, kto čaká za kráľovskými múrmi."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Pomôžte nám prečítať si tieto príbehy v plnom rozsahu, pretože po takom dlhom čase si ich majitelia zaslúžia viac ako len meno na zozname."
STR_QUEST_CAM_JOURNEY_THANKS_0: "Liora hladká stránku dlaňou. \"Znova počujem ten riadok,\" hovorí. Dnes večer nechá knihu otvorenú pri lampe."
STR_QUEST_CAM_JOURNEY_THANKS_1: "V stánku niekto presunie stoličku, aby vám urobil miesto, nedokončený príbeh získal ďalšiu líniu, jeho majiteľ si vezme stranu domov s oboma rukami."
STR_QUEST_CAM_JOURNEY_THANKS_2: "Mara zloží novú čitateľnú stranu a položí ju vedľa knihy prílivu a odlivu. Než sa vráti k oknu, poďakuje sa hlasom zhrubnutým slaným vzduchom."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Iri položí prúžok suchej látky medzi dve strany. \"Ten už môže cestovať.\" Drží zväzok na hrudi a potom ho prenesie do iných kníh."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Taren položí batoh na kameň a počúva, kým skončíte. Potom zopakuje slová cestovateľa, tentoraz bez toho, aby sa musel pozrieť na stránku."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Nadir preťahuje stužku cez prsty a číta meno, ktoré bolo predtým ťažké rozpoznať. Urobí pre teba miesto pri ohni."
