STR_INTERCEPT_TITLE_0: "Chata 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. Ťa čakajú za zamknutými dverami. Zmizla časť počítačového stroja. Ráno si v kapse kabátu vystrieľajú hromady. Vonku sa zastavia kroky."
STR_INTERCEPT_CHOICE_0_0: "Premýšľajte o obvinení"
STR_INTERCEPT_CHOICE_0_1: "Počkajte na rozhovor"
STR_INTERCEPT_CHOICE_0_2: "Vyhľadajte svoj kabát"
STR_INTERCEPT_TITLE_1: "Obvinenie"
STR_INTERCEPT_TEXT_1: "Podozrievajú zrady.Riešite postavy, krížovky a šachové pozície pre život.Táto miestnosť je ďalším problémom: protirečíte sami sebe a vaša dôveryhodnosť môže byť prvou obeťou."
STR_INTERCEPT_CHOICE_1_0: "Vyberte si stratégiu"
STR_INTERCEPT_CHOICE_1_1: "Počúvaj, čo vedia"
STR_INTERCEPT_TITLE_2: "Harry prichádza"
STR_INTERCEPT_TEXT_2: "Harris vstúpi s čajovou šálkou a súborom. Z Bombe chýba valec. Tvoje meno bolo na zozname povinností."
STR_INTERCEPT_CHOICE_2_0: "Piť čaj"
STR_INTERCEPT_CHOICE_2_1: "Nechajte čaj nedotknutý"
STR_INTERCEPT_CHOICE_2_2: "Odpoveď pokojne"
STR_INTERCEPT_TITLE_3: "- zložka"
STR_INTERCEPT_TEXT_3: "Vo vnútri plášťa vášho kabátu sa vaše prsty stretnú s chladným kovom. Komponent je stále tam. Hooper povedal, že jeho užívanie by zastavilo vydieranie."
STR_INTERCEPT_CHOICE_3_0: "Udržujte to skryté"
STR_INTERCEPT_CHOICE_3_1: "Dajte to Harrisovi"
STR_INTERCEPT_TITLE_4: "Víťazná hra"
STR_INTERCEPT_TEXT_4: "Spolupráca môže zachovať vašu dôveryhodnosť. Presvedčivá lož by mohla kúpiť čas. Útek by vymenil zamknutú miestnosť pre strážcov vonku. Žiadny z týchto pohybov nemožno odobrať."
STR_INTERCEPT_CHOICE_4_0: "spolupracovať"
STR_INTERCEPT_CHOICE_4_1: "Vytvorte si alibi"
STR_INTERCEPT_CHOICE_4_2: "Preskúmať okno"
STR_INTERCEPT_TITLE_5: "Čajový"
STR_INTERCEPT_TEXT_5: "Harris si všimne tvoje ticho, ale jeho tvár už ustupuje.Keď nabudúce otvoríš oči, pri stole stojí ďalší pár topánok."
STR_INTERCEPT_CHOICE_5_0: "Predstierať, že zostanete spiaci"
STR_INTERCEPT_CHOICE_5_1: "Porovnať návštevníka"
STR_INTERCEPT_CHOICE_5_2: "Požiadajte o vodu"
STR_INTERCEPT_TITLE_6: "Malé odmietnutie"
STR_INTERCEPT_TEXT_6: "Harris pozoruje pohyb bližšie ako odpoveď.Pýta sa, či by mal niekto iný spochybňovať."
STR_INTERCEPT_CHOICE_6_0: "Pýtajte sa, aké dôkazy má"
STR_INTERCEPT_CHOICE_6_1: "Spomienka na Hooper"
STR_INTERCEPT_CHOICE_6_2: "Pozrite sa do okna"
STR_INTERCEPT_TITLE_7: "Chýbajúca skutočnosť"
STR_INTERCEPT_TEXT_7: "Harris chce priamu odpoveď.Vzal si zložku?Môžete mu povedať, čo je vo vašom kabáte, vysvetliť tlak, ktorý Hooper uplatnil, alebo sa pokúsiť poukázať na obvinenie inde."
STR_INTERCEPT_CHOICE_7_0: "Dajte mu zložku"
STR_INTERCEPT_CHOICE_7_1: "Vysvetliť vydieranie"
STR_INTERCEPT_CHOICE_7_2: "Obvinenie Hooper"
STR_INTERCEPT_TITLE_8: "Kov na stole"
STR_INTERCEPT_TEXT_8: "Harris to skontroluje bez toho, aby sa uvoľnil. Vrátenie ukradnutého vybavenia nevysvetľuje, prečo bolo odobraté. chce meno a niečo spoľahlivejšie ako vaše slovo."
STR_INTERCEPT_CHOICE_8_0: "Ponuka nájsť dôkazy"
STR_INTERCEPT_CHOICE_8_1: "Zostaňte a odpovedať na otázky"
STR_INTERCEPT_TITLE_9: "Alebo alibi"
STR_INTERCEPT_TEXT_9: "Harris otvorí súbor. strážca vás videl odchádzať z strojovej miestnosti. Váš vynájdený účet má teraz svedka proti nemu."
STR_INTERCEPT_CHOICE_9_0: "Obhajovať príbeh"
STR_INTERCEPT_CHOICE_9_1: "Priznať vydieranie"
STR_INTERCEPT_CHOICE_9_2: "Odmietnuť ďalšie otázky"
STR_INTERCEPT_TITLE_10: "Okná"
STR_INTERCEPT_TEXT_10: "Okno je vysoké a sklo je hrubé. Za ním cesta vedie cez inú chatu. Rozbiť by to bolo hlasné; čakanie tu má svoje vlastné nebezpečenstvá."
STR_INTERCEPT_CHOICE_10_0: "Rozbiť sklo"
STR_INTERCEPT_CHOICE_10_1: "Preskúmajte cestu vonku"
STR_INTERCEPT_CHOICE_10_2: "Späť na rozhovor"
STR_INTERCEPT_TITLE_11: "Ďalší návštevník"
STR_INTERCEPT_TEXT_11: "Hooper prišiel, keď ste nestabilný. Chce vedieť, či má Harris komponent. Drží jednu ruku pri dverách."
STR_INTERCEPT_CHOICE_11_0: "predstierať, že spí"
STR_INTERCEPT_CHOICE_11_1: "Požiadať o vysvetlenie"
STR_INTERCEPT_CHOICE_11_2: "Požiadajte o vodu"
STR_INTERCEPT_TITLE_12: "Jedno varovanie"
STR_INTERCEPT_TEXT_12: "Zavoláte Harrisovi skôr, než sa čaj zastaví. On sa vracia, podráždený. Obvinenie o pohári bude potrebovať niečo, čo môže otestovať."
STR_INTERCEPT_CHOICE_12_0: "Pohár ako dôkaz"
STR_INTERCEPT_CHOICE_12_1: "Obviňujte Harrisa z toho, že vás otrávil"
STR_INTERCEPT_CHOICE_12_2: "Sústreďte sa na reál"
STR_INTERCEPT_TITLE_13: "Hooperová"
STR_INTERCEPT_TEXT_13: "Hooper je užitočný, dobre prepojený a ani z minuloročného zoznamu chýba."
STR_INTERCEPT_CHOICE_13_0: "Nájdite niečo overiteľné"
STR_INTERCEPT_CHOICE_13_1: "Hooper to ukradol"
STR_INTERCEPT_TITLE_14: "Čierny mail"
STR_INTERCEPT_TEXT_14: "Opisujete mladého muža, dôveru zradenú a požiadavku, ktorá nasledovala. Harris vás počúva bez toho, aby vám pomohol."
STR_INTERCEPT_CHOICE_14_0: "Získajte Harris plný účet"
STR_INTERCEPT_CHOICE_14_1: "Zanechať mená"
STR_INTERCEPT_CHOICE_14_2: "Navrhnúť spôsob, ako chytiť Hooper"
STR_INTERCEPT_TITLE_15: "Jednoduché obvinenie"
STR_INTERCEPT_TEXT_15: "Hooper, hovoríte, musí byť zodpovedný. Harris sa pýta, ako viete.Existuje rozdiel medzi riešením problému a produkovaním svedka, ktorý môže dokázať odpoveď."
STR_INTERCEPT_CHOICE_15_0: "Nechajte Harris spochybniť tvrdenie"
STR_INTERCEPT_CHOICE_15_1: "Skúsiť súkromnú správu pre Hooper"
STR_INTERCEPT_TITLE_16: "Testovateľný kľúč"
STR_INTERCEPT_TEXT_16: "Príbeh môže byť popretý. dokument, svedok alebo chýbajúca zložka je ťažšie vysvetliť."
STR_INTERCEPT_CHOICE_16_0: "Preskúmajte okolitú chatu"
STR_INTERCEPT_CHOICE_16_1: "Použite ranný intercept"
STR_INTERCEPT_CHOICE_16_2: "Otázka Hooper priamo"
STR_INTERCEPT_TITLE_17: "Viac ako návrat"
STR_INTERCEPT_TEXT_17: "Stroj môže opäť fungovať, ale Harris má stále porušenie zabezpečenia na vysvetlenie. ponúka vám poslednú príležitosť zistiť, kto ho organizoval."
STR_INTERCEPT_CHOICE_17_0: "Ukázať dôkazy"
STR_INTERCEPT_CHOICE_17_1: "Hľadať dôkaz"
STR_INTERCEPT_CHOICE_17_2: "Prijmite jeho rozsudok"
STR_INTERCEPT_TITLE_18: "a protirečenie"
STR_INTERCEPT_TEXT_18: "Harris nastavuje vašu prvú odpoveď vedľa vašej najnovšej. Nemôžu byť obe pravdivé. Môžete opustiť lož, alebo nechajte rozhovor skončiť na protirečení."
STR_INTERCEPT_CHOICE_18_0: "Povedzte pravdu o vydieraní"
STR_INTERCEPT_CHOICE_18_1: "Neustále popierať všetko"
STR_INTERCEPT_CHOICE_18_2: "Skúste odísť"
STR_INTERCEPT_TITLE_19: "Ticho"
STR_INTERCEPT_TEXT_19: "V tejto miestnosti ticho nekončí vyšetrovaním; končí len vašou úlohou pri jeho riadení."
STR_INTERCEPT_CHOICE_19_0: "Počúvajte rozhodnutie"
STR_INTERCEPT_TITLE_20: "Zlomené sklo"
STR_INTERCEPT_TEXT_20: "Studený vzduch a zvuk strážneho pískania sa spájajú.Je čas na jedno rozhodnutie predtým, než niekto príde k dverám."
STR_INTERCEPT_CHOICE_20_0: "Beh na vonkajšej ceste"
STR_INTERCEPT_CHOICE_20_1: "Zanechať kódovaný clue"
STR_INTERCEPT_CHOICE_20_2: "Zostaňte a vysvetlite"
STR_INTERCEPT_TITLE_21: "Medzi kaplnkami"
STR_INTERCEPT_TEXT_21: "Hooperova chata je dostatočne blízko, aby sa dosiahla pred ďalšou hliadkou, ale otvorená pôda za ňou ponúka iný druh šance."
STR_INTERCEPT_CHOICE_21_0: "Snažte sa uniknúť dôvodom"
STR_INTERCEPT_CHOICE_21_1: "Vstúpte do Hooperovej chaty"
STR_INTERCEPT_CHOICE_21_2: "Späť na Harris"
STR_INTERCEPT_TITLE_22: "Súkromná hra"
STR_INTERCEPT_TEXT_22: "Hooper vás študuje.Na stole si s prstami vytvára imaginárnu šachovú pozíciu.Kódovaná odpoveď by mu mohla odhaliť to, čo priame obvinenie nikdy nebude."
STR_INTERCEPT_CHOICE_22_0: "Odpoveď s šachovým bodom"
STR_INTERCEPT_CHOICE_22_1: "Hrozí, že ho pomenujú"
STR_INTERCEPT_CHOICE_22_2: "Hovorte úprimne"
STR_INTERCEPT_TITLE_23: "tvárou v tvár"
STR_INTERCEPT_TEXT_23: "Hooper sa pýta, čo môžete skutočne dokázať. Jeho dôvera mizne len vtedy, keď spomenete detaily, ktoré by niekto mimo jeho plánu nemal vedieť."
STR_INTERCEPT_CHOICE_23_0: "Porovnajte ho s dôkazom"
STR_INTERCEPT_CHOICE_23_1: "Ponúkame komponent ako obchod"
STR_INTERCEPT_CHOICE_23_2: "bláznivý"
STR_INTERCEPT_TITLE_24: "Pohár"
STR_INTERCEPT_TEXT_24: "Hooper prináša vodu, ale najprv sa dostane na šálku čaju.Udržiavanie tej šálky môže byť užitočnejšie ako prijatie čohokoľvek iného, čo ponúka."
STR_INTERCEPT_CHOICE_24_0: "Držte pohár"
STR_INTERCEPT_CHOICE_24_1: "Opäť si skontrolujte kabát"
STR_INTERCEPT_TITLE_25: "Niečo na testovanie"
STR_INTERCEPT_TEXT_25: "Držte pohár a požiadajte Harrisa, aby ho preskúmal. Toto je nakoniec tvrdenie s objektom pripojeným k nemu. Hooperov pokus odstrániť ho poskytuje druhý užitočný detail."
STR_INTERCEPT_CHOICE_25_0: "Daj Harris pohár"
STR_INTERCEPT_CHOICE_25_1: "Konfrontácia Hooper s ním"
STR_INTERCEPT_TITLE_26: "Nesprávny cieľ"
STR_INTERCEPT_TEXT_26: "Obviňuješ Harrisa bez dôkazov. On vidí podozrivého, ktorý sa pokúša vyšetrujúceho diskreditovať.Čokoľvek sa stalo s čajom, urobilo si to pre neho ťažšie uveriť vám."
STR_INTERCEPT_CHOICE_26_0: "Rozhovor končí"
STR_INTERCEPT_TITLE_27: "Celý účet"
STR_INTERCEPT_TEXT_27: "Vy dáte mená a popisujete stretnutie. Harris kladie presné otázky. Vaše rozpaky sú skutočné, ale tak je to aj s podrobnosťami, ktoré teraz môže skontrolovať."
STR_INTERCEPT_CHOICE_27_0: "Nechajte ho overiť účet"
STR_INTERCEPT_CHOICE_27_1: "Ponuka na nájdenie Hooper"
STR_INTERCEPT_TITLE_28: "Neúspešný podvod"
STR_INTERCEPT_TEXT_28: "Harris počul dostatok dôverčivých odpovedí. Hooper má tiež. ani neposkytuje skutočnosť, že váš príbeh chýba."
STR_INTERCEPT_CHOICE_28_0: "Trvať na tvrdení"
STR_INTERCEPT_CHOICE_28_1: "Urobte zúfalý únik"
STR_INTERCEPT_CHOICE_28_2: "Priznať, čo sa skutočne stalo"
STR_INTERCEPT_TITLE_29: "Zadržanie"
STR_INTERCEPT_TEXT_29: "List vo vašom vrecku nesie viac než len hrubé písmená: jeho trasa cez chaty umiestňuje Hooper blízko stroja."
STR_INTERCEPT_CHOICE_29_0: "Zakódovať správu pre Hoopera"
STR_INTERCEPT_CHOICE_29_1: "Ukážte si cestu do Harris"
STR_INTERCEPT_TITLE_30: "Stroj beží"
STR_INTERCEPT_TEXT_30: "Harris má komponentu a stopu, ktorá vedie nad rámec vašich prvých strašidelných odpovedí. Bomba obnovuje svoju prácu. Opustíte Hut 14 pod vlastným menom, s menej tajomstvami a budúcnosťou, na ktorú ešte treba odpovedať."
STR_INTERCEPT_TITLE_31: "Pod podozrením"
STR_INTERCEPT_TEXT_31: "Vrátenie komponentu ušetrilo stroj pred oneskorením. Nezachránilo vašu pozíciu. Harris ukončil váš prístup k chátam, zatiaľ čo vyšetrovanie pokračuje. Prežili ste rozhovor, ale nezmazali ste svoje meno."
STR_INTERCEPT_TITLE_32: "V strážení"
STR_INTERCEPT_TEXT_32: "Dvere sa otvárajú pre strážcu skôr ako pre vás. Rozpory, chýbajúce dôkazy a ukradnutá časť sa stali prípadom, ktorý už nemôžete priamo nasmerovať."
STR_INTERCEPT_TITLE_33: "Vonkajšia cesta"
STR_INTERCEPT_TEXT_33: "Zanechávate chaty za sebou.Tma je užitočná, ale pozemky sú strážené.Zlomené okno priviedlo hliadky bližšie, než ste dúfali."
STR_INTERCEPT_CHOICE_33_0: "Prejsť cez otvorenú pôdu"
STR_INTERCEPT_CHOICE_33_1: "Pokračujte na služobnú cestu"
STR_INTERCEPT_CHOICE_33_2: "Obráťte sa a tvár Harris"
STR_INTERCEPT_TITLE_34: "Hooperova chata"
STR_INTERCEPT_TEXT_34: "Stôl je bez dozoru. Papiery ležia pod krížovým slovom a strojová miestnosť sa zobrazuje v ceruzkovom rozvrhu."
STR_INTERCEPT_CHOICE_34_0: "Preskúmajte dokumenty"
STR_INTERCEPT_CHOICE_34_1: "Čakať na Hooper"
STR_INTERCEPT_CHOICE_34_2: "Odísť od Harris"
STR_INTERCEPT_TITLE_35: "Šachový problém"
STR_INTERCEPT_TEXT_35: "Dáte Hooperovi pozíciu, ktorá odráža jeho predsudok: chránený kúsok, vystavený kráľ a pohyb, ktorý vyzerá bezpečne až do odpovede."
STR_INTERCEPT_CHOICE_35_0: "Požiadajte ho, aby prijal plán"
STR_INTERCEPT_CHOICE_35_1: "Odoslať prihlášku na Harris"
STR_INTERCEPT_TITLE_36: "Bez masky"
STR_INTERCEPT_TEXT_36: "Hovoríte o tlaku namiesto predstierania, že nikdy neexistoval. Hooper krátko odpovedá ako osoba skôr než ako súper."
STR_INTERCEPT_CHOICE_36_0: "Požiadajte o čestnú dohodu"
STR_INTERCEPT_CHOICE_36_1: "Požiadajte ho, aby sa priznal"
STR_INTERCEPT_CHOICE_36_2: "Vezmite účet na Harris"
STR_INTERCEPT_TITLE_37: "Hooperovo priznanie"
STR_INTERCEPT_TEXT_37: "Hooper vysvetľuje dostatočne, aby spojil vydieranie s chýbajúcou súčasťou. Harris teraz môže obnoviť vybavenie a skontrolovať príbeh. Musíte sa rozhodnúť, či dokončiť vyšetrovanie alebo nechať Hoopera zmiznúť."
STR_INTERCEPT_CHOICE_37_0: "Priniesť Harris priznanie"
STR_INTERCEPT_CHOICE_37_1: "Nechaj Hooper ísť a odísť"
STR_INTERCEPT_TITLE_38: "Obchodný"
STR_INTERCEPT_TEXT_38: "Umiestnite svoj posledný kúsok pákového efektu v dosahu Hoopera. dohodu bez svedka alebo dôkazov je pozvánkou pre neho, aby vyriešil svoj problém na vaše náklady."
STR_INTERCEPT_CHOICE_38_0: "Ruka nad komponentom"
STR_INTERCEPT_CHOICE_38_1: "Vyžiadajú si svedeckú dohodu"
STR_INTERCEPT_CHOICE_38_2: "Zrušiť ponuku"
STR_INTERCEPT_TITLE_39: "Harry počúva"
STR_INTERCEPT_TEXT_39: "Podrobnosti možno skontrolovať. Harris sa pýta, kde je súčasť teraz. Vyčistenie vášho účtu a spustenie stroja súvisia s problémami, ale nie sú to isté."
STR_INTERCEPT_CHOICE_39_0: "Vráťte, čo je vo vašom kabáte"
STR_INTERCEPT_CHOICE_39_1: "Pomôžte obnoviť zložku"
STR_INTERCEPT_CHOICE_39_2: "Prestaňte odpovedať teraz"
STR_INTERCEPT_TITLE_40: "Za plotom"
STR_INTERCEPT_TEXT_40: "Sloboda mimo pozemku nie je to isté ako nevinnosť a stroj je teraz niekomu inému naliehavým problémom."
STR_INTERCEPT_TITLE_41: "Posledná chyba"
STR_INTERCEPT_TEXT_41: "Patrola sa k vám dostane skôr, než sa otvorená zem skončí, alebo Hooperov sľub zrúti, keď už nie je pre neho užitočný."
STR_INTERCEPT_TITLE_42: "Papierové"
STR_INTERCEPT_TEXT_42: "Rozvrh umiestni Hoopera tam, kde váš príbeh povedal, že bol. Vedľa neho je poznámka, ktorá vás najprv vytiahla do pasce."
STR_INTERCEPT_CHOICE_42_0: "Vezmite dokumenty na Harris"
STR_INTERCEPT_CHOICE_42_1: "Čakať a čeliť Hooper"
STR_INTERCEPT_TITLE_43: "Jedna posledná dohoda"
STR_INTERCEPT_TEXT_43: "Dôvera v neho by odstránila jeden bezprostredný problém; urobiť Harrisa svedkom by bolo ťažšie vytvoriť iný."
STR_INTERCEPT_CHOICE_43_0: "Usporiadajte návrat svedkov"
STR_INTERCEPT_CHOICE_43_1: "Priniesť Harris do plánu"
STR_INTERCEPT_TITLE_44: "Obnovenie skutočného"
STR_INTERCEPT_TEXT_44: "Pri registrácii účtu sa vyhľadávanie vráti k chýbajúcemu hardvéru. Harris skontroluje strojovú miestnosť, zatiaľ čo vy identifikujete miesto, kde by mal byť komponent."
STR_INTERCEPT_CHOICE_44_0: "Ukončiť overený návrat"
STR_INTERCEPT_CHOICE_44_1: "Zbavte sa ho z kabátu"
STR_INTERCEPT_CHOICE_44_2: "Varovať Harris o Hooper"
STR_INTERCEPT_TITLE_45: "Konečná otázka"
STR_INTERCEPT_TEXT_45: "Harris čaká. Ak môžete Hooper pripojiť k krádeži, stále existuje spôsob, ako obnoviť komponentu a ukončiť to správne."
STR_INTERCEPT_CHOICE_45_0: "Prezentácia dôkazov"
STR_INTERCEPT_CHOICE_45_1: "Priznaj, že nič viac nemáš"
