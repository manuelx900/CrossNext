STR_QUEST_CAM_JOURNEY_DAILYREQUEST_0: "Prečítajte si so mnou tento príbeh, stále sú rodiny, ktoré hľadajú vlastné slová v dedinskej knihe."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_1: "Zostaňte s týmito príbehmi trochu dlhšie, niekto na trhu môže rozpoznať osobu, ktorú tieto slová opisujú."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_2: "Prečítajte si tieto mená so mnou. Chcem, aby rodina čakala, keď príde ďalšia loď."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_3: "Prečítajte si tento príbeh skôr, ako ho presuniem na vyššiu poličku, potrebujem vedieť, ktoré slová ešte chýbajú."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_4: "Prečítajte si so mnou slová cestovateľov. Nechcem si pomýliť staré varovanie s výzvou, ktorá má nasledovať."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Prečítajte si tieto príbehy pri ohni, predtým ako pôjdeme, chcem aby každý počul svoje vlastné meno."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_6: "Prečítajte si so mnou túto stránku skôr, ako zazvonia zvony. Potrebujem si zapamätať viac ako hodinu na ciferníku."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_7: "Prečítajte si celé toto svedectvo. Sú tu ľudia, ktorí príliš dlho čakali na vypočutie."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Prečítajte si túto spomienku pri fontáne. Chcel by som počuť, čo dúfal, že zanechá ten, kto tu zasadil."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Prečítajte si príbehy, ktoré sme vám poslali.Hlasy z domova vám môžu robiť spoločnosť, aj keď ste tak ďaleko."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Prečítajte si tento list skôr, ako vyrazíte. Nemusíte nosiť každú spomienku sám."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_11: "Prečítajte si slová, ktoré sme pre vás uložili. Pevnosť nie je celý svet, nech je akokoľvek tichý."
