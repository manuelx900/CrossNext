STR_PET_GUIDE_SUPPLIES: "Jednu porciu získate pri 5, 10, 15, 30, 60 a 120 minútach čítania denne: až 6 porcií. Každý z nich zvyšuje merač sýtosti o 25 bodov, až do 100."
STR_PET_GUIDE_FEED: "Jeden liek získate za 30 minút čítania a druhý za 120 minút každý deň."
STR_PET_GUIDE_GAMES: "Prvé 3 hry každý deň zlepšujú náladu a stoja 20 energie. Potom môžeš trénovať zadarmo. Pred hraním sa postaraj o chorého, hladného, unaveného alebo spiaceho spoločníka."
STR_PET_GUIDE_HEALTH: "Čistenie je zadarmo a obnovuje hygienu na 100.Nezdraví chorobu: pre to otvorte Zdravie a použite liek."
STR_PET_GUIDE_DIFFICULTY: "Relaxed nemá žiadny termín na návrat k čítaniu. Normálne umožňuje 7 dní, Hard 3 dni a Extreme 24 hodín. Ak lehota uplynie, váš maznáčik zomrie. Čítanie spustí časovač znova."
