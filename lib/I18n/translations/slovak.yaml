STR_CAR_INTRO: "Vina a úprimnosť sú nezávislé. Každý prípad má presne jedno riešenie. Výšky sú fiktívne charakterové črty."
STR_CAR_HELP_TEXT: "Ako vyriešiť prípad\nKaždá postava robí jedno tvrdenie. V hornej časti obrazovky je uvedený presný počet vinníkov a nepravdivých tvrdení. Nájdite kombináciu, ktorá spĺňa oba počty. Každý prípad má jedno riešenie.\n  \nVina nie je čestnosť\nNevinná postava môže klamať a vinník môže povedať pravdu. Dve lži znamenajú, že presne dve celé vyhlásenia sú nepravdivé; ostatné sú pravdivé. Značky pravdy / lži sa týkajú vyhlásenia; Podozrivý sa týka viny.\n  \nČítanie kľúčov\n\"A alebo B to urobil (alebo obaja)\" znamená, že aspoň jedna z pomenovaných postáv je vinná. \"A a B to urobili\" vyžaduje obe. Klamstvo neguje celé tvrdenie: nepravdivé ALEBO znamená, že ani jeden z nich to neurobil; nepravdivé A znamená, že aspoň jeden z nich to neurobil.\n  \n\"Obaja pravdiví alebo obaja klamú\" porovnáva výroky, nie vinu. \"Presne jeden klame\" znamená, že ich výroky majú rôzne hodnoty pravdy. Tieto stopy môžu byť pravdivé alebo nepravdivé.\n  \nSusedia na malej obrazovke\nPôvodné kruhové poradie je Panther, Peacock, Shark, Fox, Bear, Stag, Horse, používajúc len znaky tohto prípadu. Posledný a prvý sú susedia. Táto aplikácia píše dve mená priamo do každej susednej stopy. Nikdy nemusíte hádať, ktoré karty sú vedľa portrétu. Zmena strany alebo orientácie nezmení stopu.\n  \nVýška a hmotnosť\nKaždá karta zobrazuje fiktívnu výšku a stravu. \"Vinník je vyšší ako ja\" znamená, že aspoň jeden vinník je vyšší ako rečník, nie nevyhnutne všetci vinníci. Kratšia funguje rovnakým spôsobom. Mäsožravé a bylinožravé stopy znamenajú, že aspoň jeden vinník má túto stravu; všežravce sa považujú za žiadne. Mená, výšky a diéty sú spoľahlivé fakty; vyhlásenia môžu klamať.\n  \nVaša analýza\nPoužite ? / Pravda / Klam a Podozrivý pod každým výrokom na zaznamenanie hypotéz. Toto sú vaše poznámky, nie dôkazy alebo automatické kontroly. Šípky ukazujú ostatné znaky. Režim na výšku zobrazuje až tri na stránku.\n  \nObvinenie\nStlačte Accuse a vyberte presne požadovaný počet vinníkov. Iba potvrdenie nesprávneho obvinenia stráca život. Začiatočník a Normálny majú dva životy; Pokročilý a Expert majú jeden. Správne obvinenie rieši prípad. Keď už nezostávajú žiadne životy, odhalí sa riešenie.\n  \nKampaň a opakovanie\nExistuje 1470 prípadov. Otvorený prípad pokračuje v aktuálnom pokuse alebo otvorí ďalší po uzavretom. Kampaň vám umožňuje vybrať si ktorýkoľvek z 1470 prípadov v ľubovoľnom poradí od začiatku. Replay začína nový pokus pri zachovaní predchádzajúceho dokončenia. V rámci každej obtiažnosti, prípady postupujú z jedného vinníka na dvoch, potom z menej klamárov na viac v rámci každej skupiny vinníkov. Začiatočník si ponecháva jedného vinníka. Menšie kasty sú prvé, keď sa počet zhoduje. Všetky prípady zostávajú k dispozícii. Vyriešenie predtým vyčerpaného prípadu ho povýši na vyriešený.\n  \nPokrok a životy sú uložené na SD kartu. Opustenie, spánok alebo reštart zariadenia neobnoví životy v aktuálnom pokuse. Neúspešné uloženie blokuje výsledok, kým Retry uspeje. Resetovať všetko žiada o potvrdenie pred vymazaním len pokrok Carnivore."
