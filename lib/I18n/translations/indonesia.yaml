STR_INTERCEPT_TITLE_3: "Komponen yang"
STR_INTERCEPT_TEXT_3: "Di dalam lapisan jaket Anda jari-jari Anda bertemu logam dingin. komponen masih ada. Hooper mengatakan mengambilnya akan membuat pemerasan berhenti."
STR_INTERCEPT_CHOICE_3_0: "Jaga itu tersembunyi"
STR_INTERCEPT_CHOICE_3_1: "Berikan itu kepada Harris"
STR_INTERCEPT_TITLE_4: "Permainan yang menang"
STR_INTERCEPT_TEXT_4: "Kerjasama dapat mempertahankan kredibilitas Anda. Kebohongan yang meyakinkan dapat membeli waktu. Escape akan menukar ruang tertutup untuk penjaga di luar."
STR_INTERCEPT_CHOICE_4_0: "Kolaborasi"
STR_INTERCEPT_CHOICE_4_1: "Menemukan Alibi"
STR_INTERCEPT_CHOICE_4_2: "Periksa jendela"
STR_INTERCEPT_TITLE_5: "teh yang"
STR_INTERCEPT_TEXT_5: "Harris memperhatikan keheningan Anda, tetapi wajahnya sudah mundur.Ketika Anda membuka mata berikutnya, sepasang sepatu lain berdiri di samping meja."
STR_INTERCEPT_CHOICE_5_0: "Berpura-pura untuk tetap tertidur"
STR_INTERCEPT_CHOICE_5_1: "Membandingkan pengunjung"
STR_INTERCEPT_CHOICE_5_2: "Minta untuk air"
STR_INTERCEPT_TITLE_6: "Penolakan kecil"
STR_INTERCEPT_TEXT_6: "Harris menonton gerakan lebih dekat daripada jawaban. dia bertanya apakah ada orang lain yang harus dia tanyakan."
STR_INTERCEPT_CHOICE_6_0: "Tanyakan apa bukti yang dia miliki."
STR_INTERCEPT_CHOICE_6_1: "Mengutip Hooper"
STR_INTERCEPT_CHOICE_6_2: "Melihat ke arah jendela"
STR_INTERCEPT_TITLE_7: "Real yang hilang"
STR_INTERCEPT_TEXT_7: "Harris ingin jawaban langsung. apakah Anda mengambil komponen? Anda dapat memberitahu dia apa yang ada di mantel Anda, menjelaskan tekanan Hooper diterapkan, atau mencoba menunjukkan tuduhan di tempat lain."
STR_INTERCEPT_CHOICE_7_0: "Berikan komponen tersebut"
STR_INTERCEPT_CHOICE_7_1: "Menjelaskan Penyiksaan"
STR_INTERCEPT_CHOICE_7_2: "Tuntutan Hooper"
STR_INTERCEPT_TITLE_8: "Logam di atas meja"
STR_INTERCEPT_TEXT_8: "Harris memeriksa tanpa rileks. mengembalikan peralatan yang dicuri tidak menjelaskan mengapa itu diambil. dia ingin nama dan sesuatu yang lebih dapat diandalkan daripada kata-kata Anda."
STR_INTERCEPT_CHOICE_8_0: "Tawaran untuk menemukan bukti"
STR_INTERCEPT_CHOICE_8_1: "Tetap dan jawab pertanyaan"
STR_INTERCEPT_TITLE_9: "Alibi yang"
STR_INTERCEPT_TEXT_9: "Harris membuka file tersebut. seorang penjaga melihat Anda meninggalkan ruang mesin. akun yang Anda ciptakan sekarang memiliki saksi terhadapnya."
STR_INTERCEPT_CHOICE_9_0: "Membela Kisah"
STR_INTERCEPT_CHOICE_9_1: "Mengakui Penyiksaan"
STR_INTERCEPT_CHOICE_9_2: "Menolak pertanyaan lebih lanjut"
STR_INTERCEPT_TITLE_10: "jendela yang"
STR_INTERCEPT_TEXT_10: "Jendela tinggi dan kaca tebal. di luarnya, jalan mengarah melewati pondok lain. memecahkannya akan keras; menunggu di sini memiliki bahaya sendiri."
STR_INTERCEPT_CHOICE_10_0: "memecahkan gelas"
STR_INTERCEPT_CHOICE_10_1: "Belajar dari Jalan Luar"
STR_INTERCEPT_CHOICE_10_2: "Kembali ke wawancara"
STR_INTERCEPT_TITLE_11: "Pengunjung lain"
STR_INTERCEPT_TEXT_11: "Hooper datang sementara Anda tidak stabil. dia ingin tahu apakah Harris memiliki komponen. dia memegang satu tangan dekat pintu."
STR_INTERCEPT_CHOICE_11_0: "Berpura-pura untuk tidur"
STR_INTERCEPT_CHOICE_11_1: "Menuntut penjelasan"
STR_INTERCEPT_CHOICE_11_2: "Minta untuk air"
STR_INTERCEPT_TITLE_12: "Sebuah peringatan"
STR_INTERCEPT_TEXT_12: "Anda memanggil Harris sebelum teh berhenti. ia kembali, marah. sebuah tuduhan tentang cangkir akan membutuhkan sesuatu yang dapat dia coba."
STR_INTERCEPT_CHOICE_12_0: "Menjaga cangkir sebagai bukti"
STR_INTERCEPT_CHOICE_12_1: "Mengaku Haris Meracuni Anda"
STR_INTERCEPT_CHOICE_12_2: "Berkonsentrasi pada Real"
STR_INTERCEPT_TITLE_13: "Hooper"
STR_INTERCEPT_TEXT_13: "Harris mengenali nama itu. Hooper berguna, terhubung dengan baik, dan tidak hilang dari daftar malam kemarin juga."
STR_INTERCEPT_CHOICE_13_0: "Temukan sesuatu yang dapat diperiksa"
STR_INTERCEPT_CHOICE_13_1: "Hooper menegaskan telah mencuri"
STR_INTERCEPT_TITLE_14: "Blackmail yang"
STR_INTERCEPT_TEXT_14: "Anda menggambarkan seorang pemuda, kepercayaan yang dikhianati, dan tuntutan yang diikuti. Harris mendengarkan tanpa membantu Anda."
STR_INTERCEPT_CHOICE_14_0: "Berikan Harris akun penuh"
STR_INTERCEPT_CHOICE_14_1: "Tinggalkan Nama-Nama"
STR_INTERCEPT_CHOICE_14_2: "Cara untuk menangkap Hooper"
STR_INTERCEPT_TITLE_15: "Tuntutan yang mudah"
STR_INTERCEPT_TEXT_15: "Hooper, Anda katakan, harus bertanggung jawab. Harris bertanya bagaimana Anda tahu. ada perbedaan antara memecahkan masalah dan menghasilkan saksi yang dapat membuktikan jawaban."
STR_INTERCEPT_CHOICE_15_0: "Haris menantang klaim tersebut"
STR_INTERCEPT_CHOICE_15_1: "Coba pesan pribadi ke Hooper"
STR_INTERCEPT_TITLE_16: "Pengujian kunci"
STR_INTERCEPT_TEXT_16: "Sebuah cerita dapat ditolak. dokumen, saksi, atau komponen yang hilang lebih sulit untuk dijelaskan."
STR_INTERCEPT_CHOICE_16_0: "Memeriksa Ruangan Terdekat"
STR_INTERCEPT_CHOICE_16_1: "Menggunakan Intercept Pagi"
STR_INTERCEPT_CHOICE_16_2: "Pertanyaan Hooper secara langsung"
STR_INTERCEPT_TITLE_17: "Lebih dari sekedar kembali"
STR_INTERCEPT_TEXT_17: "Mesin dapat bekerja lagi, tetapi Harris masih memiliki pelanggaran keamanan untuk dijelaskan."
STR_INTERCEPT_CHOICE_17_0: "Tunjukkan bukti"
STR_INTERCEPT_CHOICE_17_1: "Mencari bukti"
STR_INTERCEPT_CHOICE_17_2: "Menerima penghakiman-Nya"
STR_INTERCEPT_TITLE_18: "Sebuah kontradiksi"
STR_INTERCEPT_TEXT_18: "Harris menetapkan jawaban pertama Anda di samping yang terakhir. keduanya tidak bisa benar. Anda dapat meninggalkan kebohongan, atau membiarkan wawancara berakhir pada kontradiksi."
STR_INTERCEPT_CHOICE_18_0: "Bicarakan Kebenaran Tentang Penyiksaan"
STR_INTERCEPT_CHOICE_18_1: "terus menyangkal segalanya"
STR_INTERCEPT_CHOICE_18_2: "Cobalah untuk pergi"
STR_INTERCEPT_TITLE_19: "Ketenangan"
STR_INTERCEPT_TEXT_19: "Harris menutup file. di ruangan ini, diam tidak mengakhiri penyelidikan; itu hanya mengakhiri bagian Anda dalam mengarahkan itu."
STR_INTERCEPT_CHOICE_19_0: "Dengarkan Keputusan"
STR_INTERCEPT_TITLE_20: "Kaca yang rusak"
STR_INTERCEPT_TEXT_20: "Udara dingin dan bunyi pisau penjaga datang bersama-sama. ada waktu untuk satu keputusan sebelum seseorang mencapai pintu."
STR_INTERCEPT_CHOICE_20_0: "Berlari untuk Jalan Luar"
STR_INTERCEPT_CHOICE_20_1: "Tinggalkan Kode Kode"
STR_INTERCEPT_CHOICE_20_2: "Tetap dan jelaskan"
STR_INTERCEPT_TITLE_21: "Di antara topi"
STR_INTERCEPT_TEXT_21: "Hooper's hut cukup dekat untuk mencapai sebelum patroli berikutnya, tetapi tanah terbuka di luarnya menawarkan jenis kesempatan yang berbeda."
STR_INTERCEPT_CHOICE_21_0: "Cobalah untuk melarikan diri dari alasan"
STR_INTERCEPT_CHOICE_21_1: "Masuk ke Hooper's hut"
STR_INTERCEPT_CHOICE_21_2: "Kembali ke Harris"
STR_INTERCEPT_TITLE_22: "Sebuah permainan pribadi"
STR_INTERCEPT_TEXT_22: "Hooper mempelajari Anda.Di atas meja, dia menetapkan posisi catur imajinatif dengan jari-jari. sebuah jawaban yang dikodekan dapat membuatnya mengungkapkan apa yang tidak akan pernah terjadi dengan tuduhan langsung."
STR_INTERCEPT_CHOICE_22_0: "Jawaban dengan Cakram Catur"
STR_INTERCEPT_CHOICE_22_1: "Ancaman untuk menyebutnya"
STR_INTERCEPT_CHOICE_22_2: "Berbicara jujur"
STR_INTERCEPT_TITLE_23: "Wajah ke Wajah"
STR_INTERCEPT_TEXT_23: "Hooper bertanya apa yang sebenarnya dapat Anda buktikan. kepercayaan dirinya hanya berkurang ketika Anda menyebutkan rincian yang tidak seharusnya diketahui oleh seseorang di luar rencana."
STR_INTERCEPT_CHOICE_23_0: "Menghadapinya dengan bukti"
STR_INTERCEPT_CHOICE_23_1: "Memberikan komponen sebagai perdagangan"
STR_INTERCEPT_CHOICE_23_2: "blusukan"
STR_INTERCEPT_TITLE_24: "Untuk Piala"
STR_INTERCEPT_TEXT_24: "Hooper membawa air tetapi menjangkau untuk secangkir teh pertama. menjaga secangkir itu mungkin lebih berguna daripada menerima apa pun yang dia tawarkan."
STR_INTERCEPT_CHOICE_24_0: "Menjaga Piala"
STR_INTERCEPT_CHOICE_24_1: "Periksa jaket Anda lagi"
STR_INTERCEPT_TITLE_25: "Sesuatu untuk diuji"
STR_INTERCEPT_TEXT_25: "Anda menyimpan cangkir dan meminta Harris untuk memeriksanya. ini akhirnya adalah tuduhan dengan objek yang terpasang ke dalamnya. percobaan Hooper untuk menghapusnya memberikan rincian kedua yang berguna."
STR_INTERCEPT_CHOICE_25_0: "Berikan Harris Piala"
STR_INTERCEPT_CHOICE_25_1: "Menghadapi Hooper dengan"
STR_INTERCEPT_TITLE_26: "Tujuan yang salah"
STR_INTERCEPT_TEXT_26: "Anda menuduh Harris tanpa bukti. ia melihat seorang tersangka mencoba untuk mendiskreditkan penyelidik. apa pun yang terjadi pada teh, Anda telah membuatnya lebih sulit untuk percaya kepada Anda."
STR_INTERCEPT_CHOICE_26_0: "wawancara berakhir"
STR_INTERCEPT_TITLE_27: "Akun Seluruh"
STR_INTERCEPT_TEXT_27: "Anda memberikan nama-nama dan menggambarkan pertemuan. Harris mengajukan pertanyaan yang tepat. rasa malu Anda nyata, tetapi juga detail yang dapat dia periksa sekarang."
STR_INTERCEPT_CHOICE_27_0: "Biarkan dia memverifikasi akun"
STR_INTERCEPT_CHOICE_27_1: "Menemukan Hooper"
STR_INTERCEPT_TITLE_28: "Penipuan yang gagal"
STR_INTERCEPT_TEXT_28: "Harris telah mendengar jawaban yang cukup percaya diri. Hooper juga."
STR_INTERCEPT_CHOICE_28_0: "Bertahan dalam klaim"
STR_INTERCEPT_CHOICE_28_1: "Buatlah Perjalanan Kecewa"
STR_INTERCEPT_CHOICE_28_2: "mengakui apa yang sebenarnya terjadi"
STR_INTERCEPT_TITLE_29: "Interceptor yang"
STR_INTERCEPT_TEXT_29: "Lapisan di saku Anda membawa lebih dari sekadar huruf-huruf yang bergelombang: rute melalui huts menempatkan Hooper dekat mesin."
STR_INTERCEPT_CHOICE_29_0: "Sandikan pesan untuk Hooper"
STR_INTERCEPT_CHOICE_29_1: "Tunjukkan rute ke Harris"
STR_INTERCEPT_TITLE_30: "Mesin yang berjalan"
STR_INTERCEPT_TEXT_30: "Harris memiliki komponen, dan jejak yang membawa melampaui jawaban-jawaban pertama Anda yang ditakuti. The Bombe kembali bekerja. Anda meninggalkan Hut 14 dengan nama Anda sendiri, dengan lebih sedikit rahasia dan masa depan yang masih harus dijawab."
STR_INTERCEPT_TITLE_31: "Di bawah kecurigaan"
STR_INTERCEPT_TEXT_31: "Mengembalikan komponen menyelamatkan mesin dari keterlambatan. Hal ini tidak menyelamatkan posisi Anda. Harris mengakhiri akses Anda ke pondok sementara penyelidikan berlanjut. Anda selamat dari wawancara, tetapi tidak menghapus nama Anda."
STR_INTERCEPT_TITLE_32: "dalam penjaga"
STR_INTERCEPT_TEXT_32: "Pintu terbuka untuk penjaga bukan untuk Anda. kontradiksi, bukti yang hilang dan komponen yang dicuri telah menjadi kasus yang tidak dapat Anda arahkan lagi."
STR_INTERCEPT_TITLE_33: "Jalan yang lain"
STR_INTERCEPT_TEXT_33: "Anda meninggalkan pondok di belakang. kegelapan berguna, tetapi tanah dipelihara. jendela yang rusak telah membawa patroli lebih dekat daripada yang Anda harapkan."
STR_INTERCEPT_CHOICE_33_0: "Melintasi Tanah Terbuka"
STR_INTERCEPT_CHOICE_33_1: "Lanjutkan ke Jalan Layanan"
STR_INTERCEPT_CHOICE_33_2: "Berbalik dan berhadapan dengan Harris"
STR_INTERCEPT_TITLE_34: "Rumah Hooper"
STR_INTERCEPT_TEXT_34: "Meja tidak diurus. kertas terletak di bawah kata salib, dan ruang mesin muncul dalam jadwal pensil. langkah kaki mendekati papan di luar."
STR_INTERCEPT_CHOICE_34_0: "Periksa dokumen"
STR_INTERCEPT_CHOICE_34_1: "Menunggu Hooper"
STR_INTERCEPT_CHOICE_34_2: "Tinggalkan Harris"
STR_INTERCEPT_TITLE_35: "Masalah catur"
STR_INTERCEPT_TEXT_35: "Anda memberi Hooper posisi yang mencerminkan kondisi kesehatannya: potongan yang dilindungi, raja yang terpapar, dan gerakan yang terlihat aman sampai jawaban."
STR_INTERCEPT_CHOICE_35_0: "Mintalah dia untuk mengakui rencana"
STR_INTERCEPT_CHOICE_35_1: "Kirimkan Penghargaan ke Harris"
STR_INTERCEPT_TITLE_36: "Tanpa Masker"
STR_INTERCEPT_TEXT_36: "Anda berbicara tentang tekanan alih-alih berpura-pura bahwa itu tidak pernah ada. Hooper menjawab singkat sebagai orang, bukan sebagai lawan."
STR_INTERCEPT_CHOICE_36_0: "Meminta perjanjian yang jujur"
STR_INTERCEPT_CHOICE_36_1: "Mintalah dia untuk mengaku"
STR_INTERCEPT_CHOICE_36_2: "Berikan Akun ke Harris"
STR_INTERCEPT_TITLE_37: "Pengakuan Hooper"
STR_INTERCEPT_TEXT_37: "Hooper menjelaskan cukup untuk menghubungkan pemerasan ke komponen yang hilang. Harris sekarang dapat memulihkan peralatan dan memeriksa cerita. Anda harus memutuskan apakah untuk menyelesaikan penyelidikan atau membiarkan Hooper menghilang."
STR_INTERCEPT_CHOICE_37_0: "Hadirkan Harris pengakuan"
STR_INTERCEPT_CHOICE_37_1: "Biarkan Hooper pergi dan pergi"
STR_INTERCEPT_TITLE_38: "perdagangan"
STR_INTERCEPT_TEXT_38: "Anda menempatkan leverage terakhir Anda dalam jangkauan Hooper. sebuah kesepakatan tanpa saksi atau bukti adalah undangan baginya untuk memecahkan masalahnya dengan biaya Anda."
STR_INTERCEPT_CHOICE_38_0: "tangan atas komponen"
STR_INTERCEPT_CHOICE_38_1: "Menuntut kesepakatan saksi"
STR_INTERCEPT_CHOICE_38_2: "Menarik Penawaran"
STR_INTERCEPT_TITLE_39: "Harris mendengarkan"
STR_INTERCEPT_TEXT_39: "Harris bertanya di mana komponen sekarang.Menghapus akun Anda dan mendapatkan mesin berjalan adalah masalah terkait, tetapi mereka tidak sama."
STR_INTERCEPT_CHOICE_39_0: "Kembalikan apa yang ada di jaket Anda"
STR_INTERCEPT_CHOICE_39_1: "Membantu mengembalikan komponen"
STR_INTERCEPT_CHOICE_39_2: "Hentikan Jawaban Sekarang"
STR_INTERCEPT_TITLE_40: "Di luar pagar"
STR_INTERCEPT_TEXT_40: "Kebebasan di luar tanah tidak sama dengan tidak bersalah, dan mesin adalah masalah mendesak orang lain sekarang."
STR_INTERCEPT_TITLE_41: "Kesalahan Terakhir"
STR_INTERCEPT_TEXT_41: "Patroli mencapai Anda sebelum akhir tanah terbuka, atau janji Hooper runtuh ketika itu tidak lagi berguna baginya."
STR_INTERCEPT_TITLE_42: "Kertas tersebut"
STR_INTERCEPT_TEXT_42: "Jadwal menempatkan Hooper di mana cerita Anda mengatakan dia berada. Di samping itu adalah catatan yang pertama kali menarik Anda ke dalam perangkap. kombinasi ini cukup spesifik untuk Harris untuk memverifikasi."
STR_INTERCEPT_CHOICE_42_0: "Berikan kertas untuk Harris"
STR_INTERCEPT_CHOICE_42_1: "Tunggu dan hadapi Hooper"
STR_INTERCEPT_TITLE_43: "Satu Perjanjian Terakhir"
STR_INTERCEPT_TEXT_43: "Percaya padanya akan menghilangkan satu masalah langsung; membuat Harris saksi akan membuat lebih sulit untuk menciptakan yang lain."
STR_INTERCEPT_CHOICE_43_0: "Mengatur kembali saksi"
STR_INTERCEPT_CHOICE_43_1: "Ambil Harris ke dalam rencana"
STR_INTERCEPT_TITLE_44: "Mengembalikan Real"
STR_INTERCEPT_TEXT_44: "Dengan akun terdaftar, pencarian kembali ke perangkat keras yang hilang. Harris memeriksa ruang mesin sementara Anda mengidentifikasi di mana komponen harus berada."
