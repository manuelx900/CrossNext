STR_QUEST_CAM_DECOR_NAME_0: "Peri Hutan"
STR_QUEST_CAM_DECOR_TEXT_0: "Anda membebaskan peri dari akar diam. Dia akan membawa sedikit keajaiban ke rumah Anda."
STR_QUEST_CAM_SOLO_DECOR_NAME_1: "Lentera hutan"
STR_QUEST_CAM_SOLO_DECOR_TEXT_1: "Lentera untuk menerangi sudut baca Anda."
STR_QUEST_CAM_DECOR_NAME_2: "Kulit Gema"
STR_QUEST_CAM_DECOR_TEXT_2: "Seorang pelaut yang diselamatkan memberimu cangkang yang masih menyimpan nyanyian laut."
STR_QUEST_CAM_DECOR_NAME_3: "Semangat Tinta"
STR_QUEST_CAM_DECOR_TEXT_3: "Roh keluar dari halaman kosong. Ia memilih untuk bepergian bersama Anda."
STR_QUEST_CAM_DECOR_NAME_4: "Bunga bulan"
STR_QUEST_CAM_DECOR_TEXT_4: "Para tukang kebun menyelamatkan satu benih dari kebun tidur. Bunga ini tumbuh untukmu."
STR_QUEST_CAM_DECOR_NAME_5: "Kristal Musim Dingin"
STR_QUEST_CAM_DECOR_TEXT_5: "Pencairan mengungkap kristal yang menyimpan kenangan terakhir gunung tersebut."
STR_QUEST_CAM_DECOR_NAME_6: "Burung Hantu Jarum Jam"
STR_QUEST_CAM_DECOR_TEXT_6: "Pembuat jam memperbaiki penjaga kecil ini sebagai ucapan terima kasih karena telah mengembalikan waktu."
STR_QUEST_CAM_DECOR_NAME_7: "Bulu Phoenix"
STR_QUEST_CAM_DECOR_TEXT_7: "Dari abu yang ditemukan muncul sehelai bulu: janji bahwa cerita bisa dimulai lagi."
STR_QUEST_CAM_DECOR_NAME_8: "Lampu Gurun"
STR_QUEST_CAM_DECOR_TEXT_8: "Seorang pendongeng memberimu lampu yang membuat kisah gurun pasir tetap hidup."
STR_QUEST_CAM_DECOR_NAME_9: "Awan Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "Anda membuka sangkar awan. Seekor koi kecil tetap menjaga impian Anda."
STR_QUEST_CAM_DECOR_NAME_10: "Hati Naga"
STR_QUEST_CAM_DECOR_TEXT_10: "Para naga mempercayakanmu sebuah kristal yang lahir dari ingatan mereka yang telah pulih."
STR_QUEST_CAM_DECOR_NAME_11: "Bintang Memori"
STR_QUEST_CAM_DECOR_TEXT_11: "Bintang pertama yang dipulihkan menerangi jalan Anda menuju halaman terakhir."
STR_QUEST_CAM_DECOR_NAME_12: "Membaca Kecambah"
STR_QUEST_CAM_DECOR_TEXT_12: "Tanaman kecil untuk sudut baca yang tenang."
STR_QUEST_CAM_DECOR_NAME_13: "Buku Tersimpan"
STR_QUEST_CAM_DECOR_TEXT_13: "Cerita menunggu pembaca berikutnya."
STR_QUEST_CAM_DECOR_NAME_14: "Spanduk Voyager"
STR_QUEST_CAM_DECOR_TEXT_14: "Sebuah panji untuk mengingat setiap awal yang baru."
STR_QUEST_CAM_DECOR_NAME_15: "Jamur Bulan"
STR_QUEST_CAM_DECOR_TEXT_15: "Sepotong kecil hutan untuk rumah Anda."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Awal dari petualangan"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Selama bertahun-tahun orang hidup damai dan menikmati buku-buku mereka. Kemudian King of Oblivion mulai menghancurkan mereka. Dia ingin menghentikan semua orang membaca dan membuat semua cerita hilang selamanya."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Monster raja"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "King of Oblivion mengirim monsternya ke seluruh dunia. Mereka menghancurkan setiap buku yang mereka temukan dan menyerang siapa saja yang mencoba menghentikan mereka. Perpustakaan mulai menghilang, dan orang-orang berhenti membaca."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Kekuatan membaca"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Suatu hari, ketika Anda sedang membaca di dekat desa Anda, seekor monster muncul. Anda mencoba melarikan diri, namun sesuatu yang mengejutkan terjadi: semakin banyak Anda membaca, semakin lemah jadinya. Kamu sadar membaca adalah satu-satunya cara untuk melawan sihir raja."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Misi Anda"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Anda berangkat untuk menghentikan raja. Dalam perjalanan menuju kastilnya Anda harus melintasi hutan, kota, gunung, dan tempat lain yang penuh musuh. Setiap monster yang Anda kalahkan akan membawa Anda semakin dekat. Teruslah membaca, kalahkan penjaganya dan hubungi dia sebelum dia menghancurkan setiap buku di dunia."
