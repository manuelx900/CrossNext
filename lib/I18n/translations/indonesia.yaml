STR_INTERCEPT_TITLE_45: "Pertanyaan Terakhir"
STR_INTERCEPT_TEXT_45: "Harris menunggu. Jika Anda dapat menghubungkan Hooper ke pencurian, masih ada cara untuk memulihkan komponen dan mengakhiri ini dengan benar."
