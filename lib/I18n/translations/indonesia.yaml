STR_INTERCEPT_CHOICE_0_1: "Menunggu wawancara"
STR_INTERCEPT_CHOICE_0_2: "Temukan jaket Anda"
STR_INTERCEPT_TITLE_1: "Tuntutan"
STR_INTERCEPT_TEXT_1: "Mereka mencurigai pengkhianatan. Anda memecahkan angka, kata silang dan posisi catur untuk hidup. ruangan ini adalah masalah lain: bertentangan dengan diri sendiri, dan kredibilitas Anda bisa menjadi korban pertama."
