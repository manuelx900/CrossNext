STR_CAR_INTRO: "Kesalahan dan kejujuran adalah hal yang tidak terpisahkan.Setiap kasus memiliki satu solusi."
STR_CAR_HELP_TEXT: "Bagaimana untuk menyelesaikan kasus\nSetiap karakter membuat satu pernyataan. Di bagian atas layar terdapat jumlah yang tepat dari pelaku dan pernyataan palsu. Cari kombinasi yang memenuhi kedua perhitungan. Setiap kasus memiliki satu solusi.\n  \nBersalah bukan kejujuran\nSeorang karakter yang tidak bersalah bisa berbohong, dan seorang yang bersalah bisa mengatakan kebenaran. Dua kebohongan berarti dua pernyataan yang sama-sama salah; yang lainnya benar. Tanda Kebenaran/Kebohongan mengacu pada pernyataan; Tersangka mengacu pada rasa bersalah.\n  \nMembaca petunjuk\n\"A atau B melakukannya (atau keduanya)\" berarti setidaknya satu karakter yang disebutkan bersalah. \"A dan B melakukannya\" memerlukan keduanya. Kebohongan membatalkan seluruh pernyataan: OR palsu berarti keduanya tidak melakukannya; AND palsu berarti setidaknya satu orang tidak melakukannya.\n  \n\"Both truthful or both lying\" membandingkan pernyataan, bukan rasa bersalah. \"Exactly one is lying\" berarti pernyataan mereka memiliki nilai kebenaran yang berbeda.\n  \nNeighbors on a Small Screen\nUrutan lingkaran aslinya adalah Panther, Peacock, Shark, Fox, Bear, Stag, Horse, hanya menggunakan karakter dari kasus ini. Yang terakhir dan yang pertama adalah tetangga. Aplikasi ini menuliskan dua nama secara langsung di setiap petunjuk tetangga. Anda tidak perlu menebak kartu mana yang ada di samping potret. Mengganti halaman atau orientasi tidak mengubah petunjuk.\n  \nTinggi dan diet\nSetiap kartu menunjukkan tinggi dan pola makan fiktif. \"Seorang pelaku lebih tinggi dari saya\" berarti setidaknya satu pelaku lebih tinggi dari pembicara, bukan semua pelaku. Yang lebih pendek bekerja dengan cara yang sama. Petunjuk karnivora dan herbivora berarti setidaknya satu pelaku memiliki pola makan itu; omnivora dihitung sebagai tidak ada. Nama, tinggi dan pola makan adalah fakta yang dapat diandalkan; pernyataan dapat berbohong.\n  \nANALISI ANDA\nGunakan ? / Truth / Lie dan Suspect di bawah setiap pernyataan untuk merekam hipotesis. Ini adalah catatan Anda, bukan bukti atau periksa otomatis. Anak panah menunjukkan karakter lain. Mode potret menampilkan hingga tiga per halaman.\n  \nMembuat tuntutan\nTekan Tuduhan dan pilih jumlah pelaku yang dibutuhkan. Hanya konfirmasi tuduhan yang salah yang menghabiskan satu hidup. Pemula dan Normal memiliki dua hidup; Advanced dan Expert memiliki satu. Tuduhan yang benar menyelesaikan kasus. Jika tidak ada kehidupan yang tersisa, solusinya akan terungkap.\n  \nCAMPAIGN AND REPLAY\nAda 1,470 kasus. Buka kasus melanjutkan percobaan saat ini atau membuka yang berikutnya setelah satu tertutup. Kampanye memungkinkan Anda untuk memilih salah satu dari 1,470 kasus dalam urutan apapun dari awal. Replay memulai percobaan baru sambil mempertahankan penyelesaian sebelumnya. Dalam setiap kesulitan, kasus berkembang dari satu pelaku ke dua, kemudian dari lebih sedikit pembohong ke lebih banyak di dalam setiap kelompok pelaku. Pemula menyimpan satu pelaku. Cast yang lebih kecil datang pertama kali ketika jumlahnya sepadan. Semua kasus tetap tersedia. Menyelesaikan kasus yang sebelumnya habis meningkatkannya menjadi selesai.\n  \nProgres dan nyawa disimpan pada kartu SD. Keluar, tidur atau memulai ulang perangkat tidak mengembalikan nyawa dalam percobaan saat ini. Penyimpanan yang gagal menghalangi hasil sampai Retry berhasil. Reset semua meminta konfirmasi sebelum menghapus progres Carnivore saja."
