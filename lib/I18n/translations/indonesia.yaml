STR_INTERCEPT_TITLE_2: "Harris datang"
STR_INTERCEPT_TEXT_2: "Harris masuk dengan secangkir teh dan file. Sebuah gulungan hilang dari Bombe. nama Anda ada di daftar tugas. dia menempatkan cangkir di samping Anda dan bertanya di mana Anda malam lalu."
STR_INTERCEPT_CHOICE_2_0: "Minumlah teh"
STR_INTERCEPT_CHOICE_2_1: "Biarkan teh tidak tersentuh"
