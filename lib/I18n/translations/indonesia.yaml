STR_INTERCEPT_TITLE_0: "Rumah 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. mereka menunggumu di belakang pintu tertutup. Sebuah komponen dari mesin perhitungan telah menghilang. Pagi-pagi menangkap rumput di saku mantelmu. Di luar, langkah kaki berhenti."
