STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Setelah mengalahkan King of Oblivion, Anda kembali ke rumah. Pasukannya tidak dapat lagi menghancurkan buku, dan orang-orang kembali membaca dengan tenang. Anda telah menyimpan kisah-kisah dunia. Masih banyak buku yang perlu ditemukan."
