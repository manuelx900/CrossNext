STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "ราชาแห่งการลืมเลือนส่งสัตว์ประหลาดของเขาไปทั่วโลก พวกเขาทำลายหนังสือทุกเล่มที่พบและโจมตีใครก็ตามที่พยายามหยุดพวกเขา ห้องสมุดเริ่มหายไป และผู้คนก็หยุดอ่านหนังสือ"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "พลังแห่งการอ่าน"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "วันหนึ่ง ขณะที่คุณกำลังอ่านหนังสืออยู่ใกล้หมู่บ้านของคุณ สัตว์ประหลาดก็ปรากฏตัวขึ้น คุณพยายามจะหนี แต่มีเรื่องน่าประหลาดใจเกิดขึ้น ยิ่งคุณอ่านมากเท่าไหร่ มันก็ยิ่งอ่อนแอลงเท่านั้น คุณตระหนักดีว่าการอ่านเป็นวิธีเดียวที่จะต่อสู้กับเวทมนตร์ของกษัตริย์"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "ภารกิจของคุณ"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "คุณตั้งใจที่จะหยุดกษัตริย์ ระหว่างทางไปปราสาทของเขา คุณต้องข้ามป่า เมือง ภูเขา และสถานที่อื่น ๆ ที่เต็มไปด้วยศัตรู สัตว์ประหลาดแต่ละตัวที่คุณเอาชนะได้จะพาคุณเข้าใกล้มากขึ้นอีกนิด อ่านต่อไป เอาชนะการ์เดี้ยนของเขาและเข้าถึงเขา ก่อนที่เขาจะทำลายหนังสือทุกเล่มในโลก"
