STR_INTERCEPT_TITLE_0: "ฮัท 14"
STR_INTERCEPT_TEXT_0: "เบล็ตช์ลีย์ พาร์ค, 1942 พวกเขาให้คุณรออยู่หลังประตูที่ล็อคไว้ ส่วนประกอบจากเครื่องคำนวณหายไป การสกัดกั้นในตอนเช้าทำให้เกิดเสียงกรอบแกรบในกระเป๋าเสื้อโค้ทของคุณ ภายนอกฝีเท้าหยุดลง"
STR_INTERCEPT_CHOICE_0_0: "คิดให้ผ่านข้อกล่าวหา"
STR_INTERCEPT_CHOICE_0_1: "รอผู้สัมภาษณ์ก่อน"
STR_INTERCEPT_CHOICE_0_2: "ค้นหาเสื้อโค้ทของคุณ"
STR_INTERCEPT_TITLE_1: "ข้อกล่าวหา"
STR_INTERCEPT_TEXT_1: "พวกเขาสงสัยว่าเป็นกบฏ คุณแก้ตัวเลข ปริศนาอักษรไขว้ และตำแหน่งหมากรุกเพื่อหาเลี้ยงชีพ ห้องนี้เป็นอีกปัญหาหนึ่ง: ขัดแย้งกับตัวเองและความน่าเชื่อถือของคุณอาจเป็นเหยื่อรายแรก"
STR_INTERCEPT_CHOICE_1_0: "เลือกกลยุทธ์"
STR_INTERCEPT_CHOICE_1_1: "ฟังสิ่งที่พวกเขารู้"
STR_INTERCEPT_TITLE_2: "แฮร์ริสมาถึงแล้ว"
STR_INTERCEPT_TEXT_2: "แฮร์ริสเข้ามาพร้อมถ้วยชาและแฟ้ม รอกหายไปจาก Bombe ชื่อของคุณอยู่ในบัญชีรายชื่อปฏิบัติหน้าที่ เขาวางถ้วยไว้ข้างคุณแล้วถามว่าเมื่อคืนคุณอยู่ที่ไหน"
STR_INTERCEPT_CHOICE_2_0: "ดื่มชา"
STR_INTERCEPT_CHOICE_2_1: "ปล่อยชาไว้โดยไม่แตะต้อง"
STR_INTERCEPT_CHOICE_2_2: "ตอบอย่างใจเย็น"
STR_INTERCEPT_TITLE_3: "ส่วนประกอบ"
STR_INTERCEPT_TEXT_3: "ภายในชั้นเคลือบของคุณ นิ้วของคุณสัมผัสกับโลหะเย็น ส่วนประกอบยังคงอยู่ ฮูเปอร์กล่าวว่าการทำเช่นนั้นจะทำให้การแบล็กเมล์หยุดลง ตอนนี้ประตูที่ถูกล็อคมีความหมายที่แตกต่างออกไป"
STR_INTERCEPT_CHOICE_3_0: "ปกปิดไว้"
STR_INTERCEPT_CHOICE_3_1: "ส่งมอบให้แฮร์ริส"
STR_INTERCEPT_TITLE_4: "การเล่นที่ชนะ"
STR_INTERCEPT_TEXT_4: "ความร่วมมือสามารถรักษาความน่าเชื่อถือของคุณได้ คำโกหกที่น่าเชื่อถือสามารถซื้อเวลาได้ การหลบหนีจะแลกห้องที่ล็อคไว้กับผู้คุมที่อยู่ข้างนอก ไม่สามารถนำการเคลื่อนไหวเหล่านี้กลับมาได้"
STR_INTERCEPT_CHOICE_4_0: "ให้ความร่วมมือ"
STR_INTERCEPT_CHOICE_4_1: "ประดิษฐ์ข้อแก้ตัว"
STR_INTERCEPT_CHOICE_4_2: "ตรวจสอบหน้าต่าง"
STR_INTERCEPT_TITLE_5: "ชา"
STR_INTERCEPT_TEXT_5: "ห้องเอียง แฮร์ริสสังเกตเห็นความเงียบของคุณ แต่ใบหน้าของเขากลับหายไปแล้ว เมื่อคุณลืมตาขึ้นมาอีกครั้ง รองเท้าอีกคู่หนึ่งก็วางอยู่ข้างโต๊ะ"
STR_INTERCEPT_CHOICE_5_0: "แกล้งทำเป็นว่ายังคงหลับอยู่"
STR_INTERCEPT_CHOICE_5_1: "เผชิญหน้ากับผู้มาเยือน"
STR_INTERCEPT_CHOICE_5_2: "ขอน้ำ"
STR_INTERCEPT_TITLE_6: "การปฏิเสธเล็กน้อย"
STR_INTERCEPT_TEXT_6: "คุณดันถ้วยออกไป แฮร์ริสจับตาดูการเคลื่อนไหวอย่างใกล้ชิดมากกว่าคำตอบ เขาถามว่ามีคนอื่นที่เขาควรจะซักถามหรือไม่"
STR_INTERCEPT_CHOICE_6_0: "ถามว่าเขามีหลักฐานอะไรบ้าง"
STR_INTERCEPT_CHOICE_6_1: "พูดถึงฮูเปอร์"
STR_INTERCEPT_CHOICE_6_2: "มองไปทางหน้าต่าง"
STR_INTERCEPT_TITLE_7: "รอกที่หายไป"
STR_INTERCEPT_TEXT_7: "แฮร์ริสต้องการคำตอบโดยตรง คุณเอาส่วนประกอบหรือไม่? คุณสามารถบอกเขาได้ว่ามีอะไรอยู่ในเสื้อคลุมของคุณ อธิบายแรงกดดันที่ฮูเปอร์ใช้ หรือพยายามชี้ข้อกล่าวหาไปที่อื่น"
STR_INTERCEPT_CHOICE_7_0: "ให้ส่วนประกอบแก่เขา"
STR_INTERCEPT_CHOICE_7_1: "อธิบายการแบล็กเมล์"
STR_INTERCEPT_CHOICE_7_2: "กล่าวหาฮูเปอร์"
STR_INTERCEPT_TITLE_8: "โลหะบนโต๊ะ"
STR_INTERCEPT_TEXT_8: "ส่วนประกอบอยู่ระหว่างคุณ แฮร์ริสตรวจสอบโดยไม่ผ่อนคลาย การคืนอุปกรณ์ที่ถูกขโมยไม่ได้อธิบายว่าเหตุใดจึงถูกยึดไป เขาต้องการชื่อและบางสิ่งที่เชื่อถือได้มากกว่าคำพูดของคุณ"
STR_INTERCEPT_CHOICE_8_0: "เสนอให้หาหลักฐาน"
STR_INTERCEPT_CHOICE_8_1: "อยู่ตอบคำถาม"
STR_INTERCEPT_TITLE_9: "ข้อแก้ตัว"
STR_INTERCEPT_TEXT_9: "คุณบรรยายถึงยามเย็นอันเงียบสงบที่โต๊ะของคุณ แฮร์ริสเปิดไฟล์ ยามเห็นคุณออกจากห้องเครื่อง บัญชีที่คุณประดิษฐ์ขึ้นตอนนี้มีพยานคัดค้านมันแล้ว"
STR_INTERCEPT_CHOICE_9_0: "ปกป้องเรื่องราว"
STR_INTERCEPT_CHOICE_9_1: "ยอมรับแบล็กเมล์"
STR_INTERCEPT_CHOICE_9_2: "ปฏิเสธคำถามเพิ่มเติม"
STR_INTERCEPT_TITLE_10: "หน้าต่าง"
STR_INTERCEPT_TEXT_10: "หน้าต่างสูงและกระจกหนา เลยไปจะมีทางเดินผ่านกระท่อมอีกหลังหนึ่ง ถ้าพังก็จะดัง การรออยู่ที่นี่ก็มีอันตรายในตัวมันเอง"
STR_INTERCEPT_CHOICE_10_0: "ทุบกระจก"
STR_INTERCEPT_CHOICE_10_1: "ศึกษาเส้นทางภายนอก"
STR_INTERCEPT_CHOICE_10_2: "กลับมาสัมภาษณ์อีกครั้ง"
STR_INTERCEPT_TITLE_11: "ผู้มาเยือนอีกคน"
STR_INTERCEPT_TEXT_11: "ฮูเปอร์มาขณะที่คุณไม่มั่นคง เขาต้องการทราบว่าแฮร์ริสมีส่วนประกอบหรือไม่ เขาเอามือข้างหนึ่งไว้ใกล้ประตู"
STR_INTERCEPT_CHOICE_11_0: "แกล้งหลับ"
STR_INTERCEPT_CHOICE_11_1: "ต้องการคำอธิบาย"
STR_INTERCEPT_CHOICE_11_2: "ขอน้ำ"
STR_INTERCEPT_TITLE_12: "คำเตือน"
STR_INTERCEPT_TEXT_12: "คุณโทรหาแฮร์ริสก่อนที่น้ำชาจะหยุด เขากลับมาหงุดหงิด ข้อกล่าวหาเรื่องถ้วยจะต้องมีสิ่งที่เขาทดสอบได้"
STR_INTERCEPT_CHOICE_12_0: "เก็บถ้วยไว้เป็นหลักฐาน"
STR_INTERCEPT_CHOICE_12_1: "กล่าวหาว่าแฮร์ริสวางยาพิษคุณ"
STR_INTERCEPT_CHOICE_12_2: "ตั้งสมาธิที่รอก"
STR_INTERCEPT_TITLE_13: "ฮูเปอร์"
STR_INTERCEPT_TEXT_13: "แฮร์ริสจำชื่อนี้ได้ ฮูเปอร์มีประโยชน์ มีการเชื่อมต่อที่ดี และไม่ขาดหายไปจากบัญชีรายชื่อเมื่อคืนนี้ด้วย การรับรู้ไม่ใช่ข้อพิสูจน์"
STR_INTERCEPT_CHOICE_13_0: "ค้นหาสิ่งที่ตรวจสอบได้"
STR_INTERCEPT_CHOICE_13_1: "ยืนยันว่าฮูเปอร์ขโมยมันไป"
STR_INTERCEPT_TITLE_14: "แบล็กเมล์"
STR_INTERCEPT_TEXT_14: "คุณบรรยายถึงชายหนุ่ม ความมั่นใจที่ถูกทรยศ และความต้องการที่ตามมา แฮร์ริสฟังโดยไม่ช่วยคุณ การตั้งชื่อบุคคลที่วางกับดักอาจเปิดเผยบุคคลที่คุณหวังจะปกป้องด้วย"
STR_INTERCEPT_CHOICE_14_0: "ให้บัญชีเต็มแก่แฮร์ริส"
STR_INTERCEPT_CHOICE_14_1: "งดชื่อนะครับ"
STR_INTERCEPT_CHOICE_14_2: "เสนอวิธีจับฮูเปอร์"
STR_INTERCEPT_TITLE_15: "ข้อกล่าวหาที่ง่ายดาย"
STR_INTERCEPT_TEXT_15: "คุณบอกว่าฮูเปอร์ต้องรับผิดชอบ แฮร์ริสถามว่าคุณรู้ได้อย่างไร มีความแตกต่างระหว่างการแก้ปัญหากับการสร้างพยานที่สามารถพิสูจน์คำตอบได้"
STR_INTERCEPT_CHOICE_15_0: "ให้แฮร์ริสโต้แย้งคำกล่าวอ้าง"
STR_INTERCEPT_CHOICE_15_1: "ลองส่งข้อความส่วนตัวถึงฮูเปอร์"
STR_INTERCEPT_TITLE_16: "เบาะแสที่ทดสอบได้"
STR_INTERCEPT_TEXT_16: "เรื่องราวสามารถปฏิเสธได้ เอกสาร พยาน หรือส่วนประกอบที่หายไปนั้นยากต่อการอธิบาย คุณมีเวลาเพียงเล็กน้อยในการเลือกว่าจะติดตามอะไร"
STR_INTERCEPT_CHOICE_16_0: "ตรวจสอบกระท่อมใกล้เคียง"
STR_INTERCEPT_CHOICE_16_1: "ใช้สัญญาณตัดสัญญาณตอนเช้า"
STR_INTERCEPT_CHOICE_16_2: "ถามฮูเปอร์โดยตรง"
STR_INTERCEPT_TITLE_17: "มากกว่าผลตอบแทน"
STR_INTERCEPT_TEXT_17: "เครื่องสามารถทำงานได้อีกครั้ง แต่ Harris ยังมีการละเมิดความปลอดภัยที่ต้องอธิบาย พระองค์ทรงเสนอโอกาสสุดท้ายแก่คุณในการพิจารณาว่าใครเป็นผู้จัดระเบียบ"
STR_INTERCEPT_CHOICE_17_0: "แสดงหลักฐาน"
STR_INTERCEPT_CHOICE_17_1: "หาหลักฐาน"
STR_INTERCEPT_CHOICE_17_2: "ยอมรับการตัดสินใจของเขา"
STR_INTERCEPT_TITLE_18: "ความขัดแย้ง"
STR_INTERCEPT_TEXT_18: "แฮร์ริสตั้งคำตอบแรกของคุณไว้ข้างคำตอบล่าสุด พวกเขาทั้งสองไม่สามารถเป็นจริงได้ คุณสามารถละทิ้งคำโกหกหรือปล่อยให้การสัมภาษณ์จบลงด้วยความขัดแย้ง"
STR_INTERCEPT_CHOICE_18_0: "บอกความจริงเรื่องแบล็กเมล์"
STR_INTERCEPT_CHOICE_18_1: "ปฏิเสธทุกอย่างต่อไป"
STR_INTERCEPT_CHOICE_18_2: "ลองออกไปดู"
STR_INTERCEPT_TITLE_19: "ความเงียบ"
STR_INTERCEPT_TEXT_19: "คุณพับแขนของคุณ แฮร์ริสปิดไฟล์ ในห้องนี้ ความเงียบไม่ได้ทำให้การสืบสวนสิ้นสุดลง มันแค่จบส่วนของคุณในการกำกับมันเท่านั้น"
STR_INTERCEPT_CHOICE_19_0: "ฟังผลการตัดสินใจ"
STR_INTERCEPT_TITLE_20: "กระจกแตก"
STR_INTERCEPT_TEXT_20: "บานหน้าต่างเปิดทาง อากาศเย็นๆ และเสียงนกหวีดของยามดังเข้ามาพร้อมกัน มีเวลาสำหรับการตัดสินใจครั้งหนึ่งก่อนที่จะมีคนมาถึงประตู"
STR_INTERCEPT_CHOICE_20_0: "วิ่งเพื่อเส้นทางด้านนอก"
STR_INTERCEPT_CHOICE_20_1: "ทิ้งรหัสไว้"
STR_INTERCEPT_CHOICE_20_2: "อยู่และอธิบาย"
STR_INTERCEPT_TITLE_21: "ระหว่างกระท่อม"
STR_INTERCEPT_TEXT_21: "เส้นทางเปียก. กระท่อมของฮูเปอร์อยู่ใกล้พอที่จะไปถึงก่อนการลาดตระเวนครั้งถัดไป แต่พื้นที่เปิดโล่งที่อยู่ด้านนอกนั้นให้โอกาสที่แตกต่างออกไป"
STR_INTERCEPT_CHOICE_21_0: "พยายามหลบหนีจากบริเวณนั้น"
STR_INTERCEPT_CHOICE_21_1: "เข้าไปในกระท่อมของฮูเปอร์"
STR_INTERCEPT_CHOICE_21_2: "กลับไปหาแฮร์ริส"
STR_INTERCEPT_TITLE_22: "เกมส่วนตัว"
STR_INTERCEPT_TEXT_22: "ฮูเปอร์ศึกษาคุณ บนโต๊ะเขาวางตำแหน่งหมากรุกในจินตนาการด้วยมือของเขา คำตอบที่ถูกเข้ารหัสสามารถทำให้เขาเปิดเผยว่าข้อกล่าวหาโดยตรงไม่เคยเปิดเผยมาก่อน"
STR_INTERCEPT_CHOICE_22_0: "ตอบด้วยเบาะแสหมากรุก"
STR_INTERCEPT_CHOICE_22_1: "ขู่จะตั้งชื่อเขา"
STR_INTERCEPT_CHOICE_22_2: "พูดอย่างตรงไปตรงมา"
STR_INTERCEPT_TITLE_23: "เผชิญหน้ากัน"
STR_INTERCEPT_TEXT_23: "ฮูเปอร์ถามว่าคุณสามารถพิสูจน์อะไรได้บ้าง ความมั่นใจของเขาจะลดลงก็ต่อเมื่อคุณพูดถึงรายละเอียดที่คนนอกแผนของเขาไม่ควรรู้"
STR_INTERCEPT_CHOICE_23_0: "เผชิญหน้ากับเขาพร้อมหลักฐาน"
STR_INTERCEPT_CHOICE_23_1: "เสนอส่วนประกอบเป็นการซื้อขาย"
STR_INTERCEPT_CHOICE_23_2: "บลัฟ"
STR_INTERCEPT_TITLE_24: "เดอะ คัพ"
STR_INTERCEPT_TEXT_24: "ฮูเปอร์นำน้ำมาแต่เอื้อมไปหยิบถ้วยน้ำชาก่อน การเก็บถ้วยนั้นอาจมีประโยชน์มากกว่าการยอมรับสิ่งอื่นที่เขาเสนอให้"
STR_INTERCEPT_CHOICE_24_0: "เก็บถ้วย"
STR_INTERCEPT_CHOICE_24_1: "ตรวจสอบเสื้อโค้ทของคุณอีกครั้ง"
STR_INTERCEPT_TITLE_25: "มีบางอย่างที่ต้องทดสอบ"
STR_INTERCEPT_TEXT_25: "คุณเก็บถ้วยไว้และขอให้แฮร์ริสตรวจดู สุดท้ายนี้ก็เป็นข้อกล่าวหาโดยมีวัตถุสิ่งของติดอยู่ด้วย ความพยายามของฮูเปอร์ที่จะลบมันออกให้รายละเอียดที่เป็นประโยชน์ประการที่สอง"
STR_INTERCEPT_CHOICE_25_0: "มอบถ้วยให้แฮร์ริส"
STR_INTERCEPT_CHOICE_25_1: "เผชิญหน้ากับฮูเปอร์ด้วยมัน"
STR_INTERCEPT_TITLE_26: "เป้าหมายผิด"
STR_INTERCEPT_TEXT_26: "คุณกล่าวหาแฮร์ริสโดยไม่มีหลักฐาน เขาเห็นผู้ต้องสงสัยพยายามทำให้เสื่อมเสียชื่อเสียงของผู้สืบสวน ไม่ว่าเกิดอะไรขึ้นกับชา คุณทำให้เขาเชื่อคุณได้ยากขึ้น"
STR_INTERCEPT_CHOICE_26_0: "การสัมภาษณ์สิ้นสุดลง"
STR_INTERCEPT_TITLE_27: "ทั้งบัญชี"
STR_INTERCEPT_TEXT_27: "คุณแจ้งชื่อและอธิบายการประชุม แฮร์ริสถามคำถามที่ชัดเจน ความลำบากใจของคุณมีอยู่จริง แต่รายละเอียดที่เขาสามารถตรวจสอบได้ก็เช่นกัน"
STR_INTERCEPT_CHOICE_27_0: "ให้เขายืนยันบัญชี"
STR_INTERCEPT_CHOICE_27_1: "เสนอที่จะตามหาฮูเปอร์"
STR_INTERCEPT_TITLE_28: "การบลัฟที่ล้มเหลว"
STR_INTERCEPT_TEXT_28: "แฮร์ริสได้ยินคำตอบที่มั่นใจมากพอแล้ว ฮูเปอร์ก็มีเช่นกัน ไม่ได้หมายความว่าเรื่องราวของคุณหายไป"
STR_INTERCEPT_CHOICE_28_0: "ยังคงอยู่ในการอ้างสิทธิ์"
STR_INTERCEPT_CHOICE_28_1: "หลบหนีอย่างสิ้นหวัง"
STR_INTERCEPT_CHOICE_28_2: "ยอมรับสิ่งที่เกิดขึ้นจริง"
STR_INTERCEPT_TITLE_29: "การสกัดกั้น"
STR_INTERCEPT_TEXT_29: "กระดาษในกระเป๋าของคุณมีมากกว่าตัวอักษรที่ยุ่งวุ่นวาย: เส้นทางผ่านกระท่อมทำให้ฮูเปอร์อยู่ใกล้เครื่อง คำใบ้ที่กระชับอาจทำให้บุคคลที่เหมาะสมมองไปในที่ที่ถูกต้อง"
STR_INTERCEPT_CHOICE_29_0: "เข้ารหัสข้อความสำหรับฮูเปอร์"
STR_INTERCEPT_CHOICE_29_1: "แสดงเส้นทางไปแฮร์ริส"
STR_INTERCEPT_TITLE_30: "เครื่องจักรกำลังทำงาน"
STR_INTERCEPT_TEXT_30: "แฮร์ริสมีองค์ประกอบและเส้นทางที่นำไปสู่คำตอบที่คุณหวาดกลัวครั้งแรก Bombe กลับมาทำงานต่อ คุณปล่อยให้ Hut 14 อยู่ภายใต้ชื่อของคุณเอง โดยมีความลับน้อยลงและยังมีอนาคตที่รอคำตอบอยู่"
STR_INTERCEPT_TITLE_31: "อยู่ระหว่างสงสัย"
STR_INTERCEPT_TEXT_31: "การส่งคืนส่วนประกอบช่วยไม่ให้เครื่องเกิดความล่าช้า มันไม่ได้บันทึกตำแหน่งของคุณ แฮร์ริสยุติการเข้าถึงกระท่อมของคุณในขณะที่การสืบสวนยังดำเนินต่อไป คุณรอดชีวิตจากการสัมภาษณ์ แต่ไม่ได้เปิดเผยชื่อของคุณ"
STR_INTERCEPT_TITLE_32: "อยู่ในความดูแล"
STR_INTERCEPT_TEXT_32: "ประตูเปิดไว้สำหรับยามมากกว่าสำหรับคุณ ความขัดแย้ง หลักฐานที่หายไป และส่วนประกอบที่ถูกขโมยกลายเป็นกรณีที่คุณไม่สามารถสั่งการได้อีกต่อไป ความพยายามนี้สิ้นสุดที่นี่"
STR_INTERCEPT_TITLE_33: "เส้นทางด้านนอก"
STR_INTERCEPT_TEXT_33: "คุณทิ้งกระท่อมไว้ข้างหลัง ความมืดนั้นมีประโยชน์ แต่พื้นที่นั้นถูกเฝ้าดู หน้าต่างที่พังทำให้หน่วยลาดตระเวนเข้ามาใกล้กว่าที่คุณคาดหวัง"
STR_INTERCEPT_CHOICE_33_0: "ข้ามพื้นที่โล่ง"
STR_INTERCEPT_CHOICE_33_1: "รักษาเส้นทางการให้บริการ"
STR_INTERCEPT_CHOICE_33_2: "หันหลังกลับและเผชิญหน้ากับแฮร์ริส"
STR_INTERCEPT_TITLE_34: "กระท่อมของฮูเปอร์"
STR_INTERCEPT_TEXT_34: "โต๊ะไม่มีคนดูแล เอกสารอยู่ใต้ปริศนาอักษรไขว้ และห้องเครื่องก็ปรากฏขึ้นตามตารางที่เขียนไว้ด้วยดินสอ เสียงฝีเท้าเดินเข้ามาตามกระดานด้านนอก"
STR_INTERCEPT_CHOICE_34_0: "ตรวจสอบเอกสาร"
STR_INTERCEPT_CHOICE_34_1: "รอฮูเปอร์ก่อน"
STR_INTERCEPT_CHOICE_34_2: "ออกเดินทางไปแฮร์ริส"
STR_INTERCEPT_TITLE_35: "ปัญหาหมากรุก"
STR_INTERCEPT_TEXT_35: "คุณให้ตำแหน่งฮูเปอร์ที่สะท้อนสถานการณ์ของเขา: ชิ้นส่วนที่ได้รับการปกป้อง ราชาที่ถูกเปิดเผย และการเคลื่อนไหวที่ดูปลอดภัยจนกว่าจะได้รับคำตอบ เขาเข้าใจคำเตือน คำพูดถัดมาของเขาบ่งบอกถึงความเชื่อมโยงที่คุณต้องการ"
STR_INTERCEPT_CHOICE_35_0: "ขอให้เขายอมรับแผน"
STR_INTERCEPT_CHOICE_35_1: "ส่งรับสมัครแฮร์ริส"
STR_INTERCEPT_TITLE_36: "โดยไม่ต้องสวมหน้ากาก"
STR_INTERCEPT_TEXT_36: "คุณพูดถึงความกดดันแทนที่จะแสร้งทำเป็นว่ามันไม่เคยมีอยู่จริง ฮูเปอร์ตอบสั้นๆ ในฐานะบุคคลมากกว่าในฐานะคู่ต่อสู้ ช่องนั้นสามารถใช้เพื่อการค้าหรือกับดักได้"
STR_INTERCEPT_CHOICE_36_0: "ขอข้อตกลงที่ซื่อสัตย์"
STR_INTERCEPT_CHOICE_36_1: "ขอให้เขาสารภาพ"
STR_INTERCEPT_CHOICE_36_2: "นำบัญชีไปให้แฮร์ริส"
STR_INTERCEPT_TITLE_37: "การรับเข้าเรียนของฮูเปอร์"
STR_INTERCEPT_TEXT_37: "ฮูเปอร์อธิบายได้เพียงพอที่จะเชื่อมโยงแบล็กเมล์กับองค์ประกอบที่ขาดหายไป แฮร์ริสสามารถกู้คืนอุปกรณ์และตรวจสอบเรื่องราวได้แล้ว คุณต้องตัดสินใจว่าจะเสร็จสิ้นการสอบสวนหรือปล่อยให้ฮูเปอร์หายไป"
STR_INTERCEPT_CHOICE_37_0: "นำแฮร์ริสเข้ามาด้วย"
STR_INTERCEPT_CHOICE_37_1: "ให้ฮูเปอร์ไปและจากไป"
STR_INTERCEPT_TITLE_38: "การค้าขาย"
STR_INTERCEPT_TEXT_38: "คุณวางเลเวอเรจชิ้นสุดท้ายของคุณให้อยู่ในอุ้งมือของฮูเปอร์ การต่อรองโดยไม่มีพยานหรือหลักฐานเป็นการเชิญชวนให้เขาแก้ไขปัญหาโดยเสียค่าใช้จ่าย"
STR_INTERCEPT_CHOICE_38_0: "ส่งมอบส่วนประกอบ"
STR_INTERCEPT_CHOICE_38_1: "เรียกร้องข้อตกลงที่เป็นพยาน"
STR_INTERCEPT_CHOICE_38_2: "ถอนข้อเสนอ"
STR_INTERCEPT_TITLE_39: "แฮร์ริส ฟัง"
STR_INTERCEPT_TEXT_39: "สามารถตรวจสอบรายละเอียดได้ แฮร์ริสถามว่าตอนนี้องค์ประกอบอยู่ที่ไหน การล้างบัญชีของคุณและการทำให้เครื่องทำงานเป็นปัญหาที่เกี่ยวข้องกัน แต่ก็ไม่เหมือนกัน"
STR_INTERCEPT_CHOICE_39_0: "คืนสิ่งที่อยู่ในเสื้อโค้ทของคุณ"
STR_INTERCEPT_CHOICE_39_1: "ช่วยกู้คืนส่วนประกอบ"
STR_INTERCEPT_CHOICE_39_2: "หยุดตอบเดี๋ยวนี้"
STR_INTERCEPT_TITLE_40: "เหนือรั้ว"
STR_INTERCEPT_TEXT_40: "กระท่อมหายไปข้างหลังคุณ อิสรภาพนอกสนาม ไม่เหมือนกับความบริสุทธิ์ และเครื่องจักรเป็นปัญหาเร่งด่วนของคนอื่นในขณะนี้ คุณหนีออกมา เรื่องราวยังคงไม่จบ"
STR_INTERCEPT_TITLE_41: "ความผิดพลาดครั้งสุดท้าย"
STR_INTERCEPT_TEXT_41: "หน่วยลาดตระเวนมาถึงคุณก่อนที่พื้นที่เปิดโล่งจะสิ้นสุดลง หรือคำสัญญาของฮูเปอร์พังทลายลงเมื่อมันไม่มีประโยชน์กับเขาอีกต่อไป คุณหมดการเคลื่อนไหวที่ปลอดภัยแล้ว สามารถลองเรื่องราวได้อีกครั้งตั้งแต่ต้น"
STR_INTERCEPT_TITLE_42: "เอกสาร"
STR_INTERCEPT_TEXT_42: "ตารางงานจะพาฮูเปอร์ไปที่ที่เรื่องราวของคุณบอกว่าเขาอยู่ นอกจากนั้นยังมีข้อความที่ดึงคุณเข้าสู่กับดักเป็นอันดับแรก การรวมกันนี้มีความเฉพาะเจาะจงเพียงพอให้แฮร์ริสตรวจสอบได้"
STR_INTERCEPT_CHOICE_42_0: "นำเอกสารไปให้แฮร์ริส"
STR_INTERCEPT_CHOICE_42_1: "รอและเผชิญหน้ากับฮูเปอร์"
STR_INTERCEPT_TITLE_43: "การจัดการครั้งสุดท้าย"
STR_INTERCEPT_TEXT_43: "ฮูเปอร์เสนอให้นำชิ้นส่วนกลับคืน การเชื่อใจเขาจะขจัดปัญหาเฉพาะหน้าไปหนึ่งอย่าง การทำให้แฮร์ริสเป็นพยานจะทำให้ยากขึ้นในการสร้างอีกคนหนึ่ง"
STR_INTERCEPT_CHOICE_43_0: "จัดให้มีพยานการกลับมา"
STR_INTERCEPT_CHOICE_43_1: "นำแฮร์ริสเข้ามาในแผน"
STR_INTERCEPT_TITLE_44: "การกู้คืนรีล"
STR_INTERCEPT_TEXT_44: "เมื่อบัญชีถูกบันทึกไว้ การค้นหาจะกลับไปยังฮาร์ดแวร์ที่หายไป Harris ตรวจสอบห้องเครื่องในขณะที่คุณระบุว่าส่วนประกอบควรอยู่ที่ใด"
STR_INTERCEPT_CHOICE_44_0: "เสร็จสิ้นการคืนสินค้าที่ตรวจสอบแล้ว"
STR_INTERCEPT_CHOICE_44_1: "ดึงมันออกมาจากเสื้อโค้ทของคุณ"
STR_INTERCEPT_CHOICE_44_2: "เตือนแฮร์ริสเกี่ยวกับฮูเปอร์"
STR_INTERCEPT_TITLE_45: "คำถามสุดท้าย"
STR_INTERCEPT_TEXT_45: "แฮร์ริสรออยู่ หากคุณสามารถเชื่อมต่อ Hooper กับการโจรกรรมได้ ก็ยังมีวิธีกู้คืนส่วนประกอบและยุติการดำเนินการนี้อย่างถูกต้อง มิฉะนั้นการสืบสวนจะมีเพียงบัญชีที่เปลี่ยนแปลงของคุณเท่านั้น"
