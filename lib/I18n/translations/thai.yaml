STR_CAR_HELP_TEXT: "วิธีการแก้ไขกรณี\nตัวอักษรแต่ละตัวแสดงคำกล่าวหนึ่งข้อ ด้านบนของหน้าจอแสดงจำนวนที่แน่นอนของผู้กระทำความผิดและคำพูดที่ไม่ถูกต้อง ค้นหาการผสมผสานที่ตรงกับการนับทั้งสองข้อ ทุกกรณีมีคำตอบหนึ่งข้อ\n  \nความผิดไม่ใช่ความซื่อสัตย์\nตัวละครที่ไร้เดียงสาสามารถโกหกได้ และผู้กระทำความผิดก็สามารถพูดความจริงได้ โกหกสองครั้ง หมายถึงการกล่าวหาทั้งสองอย่างเป็นความเท็จ ส่วนอีกอย่างเป็นความจริง สัญลักษณ์ความจริง/ การโกหก อ้างถึงการกล่าวหา; ผู้ต้องสงสัย อ้างถึงความผิด\n  \nอ่านเบาะแส\n\"A or B did it (or both)\" แปลว่า อย่างน้อยตัวละครชื่อหนึ่งต้องมีความผิด \"A and B did it\" ต้องใช้ทั้งสองตัวละคร คำโกหกจะลบข้อความทั้งหมดออกไป คำว่า false OR แปลว่า ไม่มีการกระทำใดๆ ทั้งสิ้น และคำว่า false AND แปลว่า ไม่มีการกระทำใดๆ ทั้งสิ้น\n  \n\"ทั้งสองคนพูดจริงหรือทั้งสองคนโกหก\" เปรียบเทียบข้อกล่าวหา ไม่ใช่ความผิด \"หนึ่งในนั้นโกหก\" หมายความว่าข้อกล่าวหาของพวกเขา มีค่าความจริงที่แตกต่างกัน\n  \nเพื่อนบ้านบนจอเล็ก\nเรียงลำดับวงกลมเดิมคือ Panther, Peacock, Shark, Fox, Bear, Stag, Horse โดยใช้เพียงตัวอักษรในกรณีนี้เท่านั้น ตัวอักษรสุดท้ายและตัวแรกเป็นเพื่อนบ้าน โปรแกรมนี้จะเขียนชื่อสองตัวโดยตรงในเบาะแสของเพื่อนบ้านทุกตัว คุณไม่จำเป็นต้องเดาว่าบัตรใดอยู่ด้านข้างรูปภาพ การเปลี่ยนหน้าหรือทิศทางจะไม่เปลี่ยนเบาะแส\n  \nความสูงและอาหาร\nบัตรแต่ละใบแสดงความสูงและอาหารที่สร้างขึ้นมา \"ผู้กระทำผิดสูงกว่าฉัน\" หมายถึง ผู้กระทำผิดอย่างน้อยคนหนึ่งที่สูงกว่าผู้พูด แต่ไม่จำเป็นต้องเป็นผู้กระทำผิดทั้งหมด ตัวอักษรยาวก็ใช้ได้เช่นเดียวกัน ตัวอักษรสัตว์กินเนื้อและสัตว์กินพืชหมายถึง ผู้กระทำผิดอย่างน้อยคนหนึ่งที่กินอาหารแบบนั้น แต่สัตว์กินทุกอย่างไม่ได้นับว่ากินทั้งสองอย่าง ชื่อ ความสูง และอาหารเป็นความจริงที่เชื่อถือได้ คำกล่าวอาจจะโกหกได้\n  \nการวิเคราะห์ของคุณ\nใช้? / Truth / Lie และ Suspect ภายใต้คำกล่าวแต่ละประโยค เพื่อบันทึกสมมติฐาน นี่เป็นข้อความของคุณ ไม่ใช่หลักฐานหรือการตรวจสอบอัตโนมัติ ลูกศรแสดงตัวอักษรอื่น ๆ โหมดภาพวาดแสดงถึง3ตัวอักษรต่อหน้า\n  \nทำการกล่าวหา\nกดปุ่ม กล่าวหา และเลือกจำนวนผู้กระทำผิดที่ต้องการ เพียงแค่ยืนยันการกล่าวหาที่ผิดเท่านั้นที่จะใช้ชีวิตหนึ่งครั้ง ผู้เริ่มต้นและผู้ปกติมีชีวิตสองชีวิต; ผู้เชี่ยวชาญและผู้เชี่ยวชาญมีชีวิตหนึ่งครั้ง การกล่าวหาที่ถูกต้องจะช่วยแก้ไขคดีได้ หากไม่มีชีวิตเหลือ ทางออกจะปรากฏขึ้น\n  \nแคมเปญและเล่นใหม่\nมีคดีทั้งหมด 1,470 คดี เปิดคดี จะเปิดคดีปัจจุบัน หรือเปิดคดีถัดไปหลังจากที่ปิดคดีก่อนหน้านี้ การโจมตีจะให้คุณเลือกคดีใด ๆ จาก 1,470 คดี ในลำดับใดก็ได้จากจุดเริ่มต้น การเล่นซ้ำจะเริ่มการพยายามใหม่โดยเก็บความสำเร็จก่อนหน้านี้ไว้ ในแต่ละระดับความยาก คดีจะพัฒนาจากผู้กระทำผิดคนหนึ่งเป็นสองคน จากนั้นจากผู้โกหกน้อยลงเป็นมากขึ้นในแต่ละกลุ่มผู้กระทำผิด ผู้เริ่มต้นจะเก็บผู้กระทำผิดคนหนึ่งไว้ การโยนคดีเล็ก ๆ จะมาก่อน เมื่อจำนวนคู่สมรสเท่ากัน คดีทั้งหมดจะยังคงมีอยู่ การแก้ไขคดีที่หมดอายุก่อนหน้านี้ จะปรับระดับมันให้เป็นคดีที่แก้ไขแล้ว\n  \nความคืบหน้าและชีวิตจะถูกบันทึกไว้บนแผ่น SD การออกจากเกม, หยุดเกม หรือเริ่มเครื่องใหม่ จะไม่ทำให้ชีวิตกลับมาเป็นเหมือนเดิมในครั้งนี้ หากล้มเหลวในการบันทึก จะปิดผลลัพธ์จนกว่าคุณจะลองเล่นอีกครั้งได้สำเร็จ รีเซ็ตทั้งหมด จะถามให้ยืนยันก่อนที่จะลบเพียงแต่ความคืบหน้าของ Carnivore"
