STR_QUEST_CAM_JOURNEY2_SAGA_10_10: "你穿过一座吊桥，打开一扇布满灯光的门。除此之外还有一个古老的档案馆，其中的书籍可能会告诉您在哪里可以找到最后一个封印。\n\n一本书上说第三封印保存在档案下面。你沿着楼梯进入黑暗的隧道，通向一个密封的房间。\n\n你恢复了第三个封印并完成了钥匙。离开隧道，你就看到了堡垒的城墙。一座桥通向大门，最后的怪物在那里站岗。\n\n虚空之蛇无法再守护拱门。当您将钥匙插入门时，三个密封件会发光。城堡打开了，只剩下湮灭之王。"
STR_QUEST_CAM_JOURNEY2_SAGA_11_0: "最后你到达了遗忘之王的城堡。里面藏着许多他的士兵偷来的书。他最后的守护者保护着王位，在面对他之前你必须削弱他的魔法。"
