STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "冒险的开始"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "多年来，人们过着平静的生活，享受着书籍。然后湮灭之王开始消灭他们。他想要阻止所有人阅读，让所有故事永远消失。"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "国王的怪物"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "湮灭之王把他的怪物派往世界各地。他们毁掉了找到的每一本书，并攻击任何试图阻止他们的人。图书馆开始消失，人们停止阅读。"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "阅读的力量"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "有一天，当你在村庄附近读书时，一只怪物出现了。你试图逃脱，但令人惊讶的事情发生了：你读得越多，它就变得越弱。你意识到阅读是对抗国王魔法的唯一方法。"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "你的使命"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "你出发去阻止国王。在前往他的城堡的路上，你必须穿越森林、城市、山脉和其他充满敌人的地方。你击败的每一个怪物都会让你更接近一些。继续阅读，击败他的守护者并在他摧毁世界上的每一本书之前找到他。"
