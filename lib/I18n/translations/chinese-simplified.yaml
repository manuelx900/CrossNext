STR_INTERCEPT_TITLE_0: "小屋 14"
STR_INTERCEPT_TEXT_0: "布莱奇利公园，1942 年。他们让你在锁着的门后等待。计算机的一个组件消失了。早晨的拦截在你外套口袋里沙沙作响。外面，脚步声停了下来。"
STR_INTERCEPT_CHOICE_0_0: "仔细思考指控"
STR_INTERCEPT_CHOICE_0_1: "等待面试官"
STR_INTERCEPT_CHOICE_0_2: "搜查你的外套"
STR_INTERCEPT_TITLE_1: "指控"
STR_INTERCEPT_TEXT_1: "他们怀疑叛国罪。你以解算数、填字游戏和国际象棋棋局为生。这个房间还有一个问题：自相矛盾，你的信誉可能是第一个受害者。"
STR_INTERCEPT_CHOICE_1_0: "选择策略"
STR_INTERCEPT_CHOICE_1_1: "听听他们所知道的"
STR_INTERCEPT_TITLE_2: "哈里斯抵达"
STR_INTERCEPT_TEXT_2: "哈里斯拿着茶杯和锉刀进来。 Bombe 缺少一个卷轴。你的名字在值班名单上。他把杯子放在你旁边，问你昨晚在哪里。"
STR_INTERCEPT_CHOICE_2_0: "喝茶"
STR_INTERCEPT_CHOICE_2_1: "保持茶原样"
STR_INTERCEPT_CHOICE_2_2: "冷静回答"
STR_INTERCEPT_TITLE_3: "组件"
STR_INTERCEPT_TEXT_3: "在你外套的衬里里，你的手指接触到冰冷的金属。该组件仍然存在。胡珀表示，拿走它就能让勒索行为停止。现在，锁着的门有了不同的含义。"
STR_INTERCEPT_CHOICE_3_0: "隐藏起来"
STR_INTERCEPT_CHOICE_3_1: "交给哈里斯"
STR_INTERCEPT_TITLE_4: "一场胜利的比赛"
STR_INTERCEPT_TEXT_4: "合作可以维护您的信誉。一个令人信服的谎言可以赢得时间。逃亡者需要用一个上锁的房间换取外面的守卫。这些举动都无法收回。"
STR_INTERCEPT_CHOICE_4_0: "合作"
STR_INTERCEPT_CHOICE_4_1: "发明不在场证明"
STR_INTERCEPT_CHOICE_4_2: "检查窗口"
STR_INTERCEPT_TITLE_5: "茶"
STR_INTERCEPT_TEXT_5: "房间倾斜。哈里斯注意到你的沉默，但他的表情已经消失了。当你再次睁开眼睛时，另一双鞋站在桌子旁边。"
STR_INTERCEPT_CHOICE_5_0: "假装睡着了"
STR_INTERCEPT_CHOICE_5_1: "面对访客"
STR_INTERCEPT_CHOICE_5_2: "要水"
STR_INTERCEPT_TITLE_6: "小拒绝"
STR_INTERCEPT_TEXT_6: "你把杯子推开。哈里斯更仔细地观察动作而不是答案。他询问是否还有其他人他应该询问。"
STR_INTERCEPT_CHOICE_6_0: "问他有什么证据"
STR_INTERCEPT_CHOICE_6_1: "提及胡珀"
STR_INTERCEPT_CHOICE_6_2: "看向窗户"
STR_INTERCEPT_TITLE_7: "丢失的卷轴"
STR_INTERCEPT_TEXT_7: "哈里斯想要一个直接的答案。你拿走了这个组件吗？你可以告诉他你的外套里有什么，解释胡珀施加的压力，或者尝试将指控指向其他地方。"
STR_INTERCEPT_CHOICE_7_0: "把组件给他"
STR_INTERCEPT_CHOICE_7_1: "解释一下勒索事件"
STR_INTERCEPT_CHOICE_7_2: "指责胡珀"
STR_INTERCEPT_TITLE_8: "桌子上的金属"
STR_INTERCEPT_TEXT_8: "该组件位于你们之间。哈里斯毫不放松地检查了一下。归还被盗设备并不能解释其被盗的原因。他想要一个名字和比你的话更可靠的东西。"
STR_INTERCEPT_CHOICE_8_0: "主动寻找证据"
STR_INTERCEPT_CHOICE_8_1: "留下来回答问题"
STR_INTERCEPT_TITLE_9: "不在场证明"
STR_INTERCEPT_TEXT_9: "您描述了在办公桌前度过的一个安静的夜晚。哈里斯打开文件。一名警卫看到你离开机房。你发明的帐户现在有证人反对它。"
STR_INTERCEPT_CHOICE_9_0: "捍卫故事"
STR_INTERCEPT_CHOICE_9_1: "承认敲诈"
STR_INTERCEPT_CHOICE_9_2: "拒绝进一步提问"
STR_INTERCEPT_TITLE_10: "窗户"
STR_INTERCEPT_TEXT_10: "窗户高，玻璃厚。再往前，小路经过另一间小屋。打破它会很响；在这里等待有其自身的危险。"
STR_INTERCEPT_CHOICE_10_0: "打破玻璃"
STR_INTERCEPT_CHOICE_10_1: "研究外面的路"
STR_INTERCEPT_CHOICE_10_2: "返回采访"
STR_INTERCEPT_TITLE_11: "另一位访客"
STR_INTERCEPT_TEXT_11: "当你站不稳的时候，胡珀来了。他想知道哈里斯是否拥有该组件。他一只手靠近门。"
STR_INTERCEPT_CHOICE_11_0: "假装睡觉"
STR_INTERCEPT_CHOICE_11_1: "要求解释"
STR_INTERCEPT_CHOICE_11_2: "要水"
STR_INTERCEPT_TITLE_12: "警告"
STR_INTERCEPT_TEXT_12: "在喝茶之前你叫来了哈里斯。他回来了，很生气。关于杯子的指控需要他可以测试的东西。"
STR_INTERCEPT_CHOICE_12_0: "保留杯子作为证据"
STR_INTERCEPT_CHOICE_12_1: "指控哈里斯毒害你"
STR_INTERCEPT_CHOICE_12_2: "专注于卷轴"
STR_INTERCEPT_TITLE_13: "胡珀"
STR_INTERCEPT_TEXT_13: "哈里斯认得这个名字。胡珀很有用，人脉广泛，并且在昨晚的名单中也没有缺席。认可不是证据。"
STR_INTERCEPT_CHOICE_13_0: "找到可验证的东西"
STR_INTERCEPT_CHOICE_13_1: "坚持胡珀偷了它"
STR_INTERCEPT_TITLE_14: "勒索"
STR_INTERCEPT_TEXT_14: "你描述了一个年轻人，一次被背叛的信心，以及随之而来的要求。哈里斯只会倾听，但不会帮助你。说出设置陷阱的人的名字也可能会暴露你希望保护的人。"
STR_INTERCEPT_CHOICE_14_0: "给哈里斯完整的账户"
STR_INTERCEPT_CHOICE_14_1: "省略名字"
STR_INTERCEPT_CHOICE_14_2: "提出抓住胡珀的方法"
STR_INTERCEPT_TITLE_15: "一个简单的指控"
STR_INTERCEPT_TEXT_15: "胡珀，你说，必须负责。哈里斯问你怎么知道的。解决问题和提供可以证明答案的证人之间是有区别的。"
STR_INTERCEPT_CHOICE_15_0: "让哈里斯质疑这一说法"
STR_INTERCEPT_CHOICE_15_1: "尝试给 Hooper 发私信"
STR_INTERCEPT_TITLE_16: "可测试的线索"
STR_INTERCEPT_TEXT_16: "故事可以被否认。文件、证人或缺失的部分都很难解释清楚。你有一点时间来选择要追求什么。"
STR_INTERCEPT_CHOICE_16_0: "检查附近的小屋"
STR_INTERCEPT_CHOICE_16_1: "使用早上拦截"
STR_INTERCEPT_CHOICE_16_2: "直接向胡珀提问"
STR_INTERCEPT_TITLE_17: "不仅仅是回报"
STR_INTERCEPT_TEXT_17: "机器可以再次工作，但哈里斯仍有安全漏洞需要解释。他为您提供了最后一次机会来确定是谁组织了这次活动。"
STR_INTERCEPT_CHOICE_17_0: "出示证据"
STR_INTERCEPT_CHOICE_17_1: "寻找证据"
STR_INTERCEPT_CHOICE_17_2: "接受他的判断"
STR_INTERCEPT_TITLE_18: "矛盾"
STR_INTERCEPT_TEXT_18: "哈里斯将您的第一个答案设置在最新答案旁边。它们不可能都是真的。你可以放弃谎言，或者让采访以矛盾结束。"
STR_INTERCEPT_CHOICE_18_0: "说出勒索的真相"
STR_INTERCEPT_CHOICE_18_1: "不断否认一切"
STR_INTERCEPT_CHOICE_18_2: "尝试离开"
STR_INTERCEPT_TITLE_19: "沉默"
STR_INTERCEPT_TEXT_19: "你交叉双臂。哈里斯关闭了文件。在这个房间里，沉默并没有结束调查；它只是结束了你指导它的部分。"
STR_INTERCEPT_CHOICE_19_0: "听取决定"
STR_INTERCEPT_TITLE_20: "碎玻璃"
STR_INTERCEPT_TEXT_20: "窗格让路了。冷空气和警卫的哨声一起袭来。在有人到达门口之前，有时间做出决定。"
STR_INTERCEPT_CHOICE_20_0: "往外路径跑"
STR_INTERCEPT_CHOICE_20_1: "留下编码线索"
STR_INTERCEPT_CHOICE_20_2: "留下来解释"
STR_INTERCEPT_TITLE_21: "小屋之间"
STR_INTERCEPT_TEXT_21: "路湿了。胡珀的小屋足够近，可以在下一次巡逻之前到达，但它后面的空地提供了不同的机会。"
STR_INTERCEPT_CHOICE_21_0: "尝试逃离场地"
STR_INTERCEPT_CHOICE_21_1: "进入胡珀的小屋"
STR_INTERCEPT_CHOICE_21_2: "返回哈里斯"
STR_INTERCEPT_TITLE_22: "私人游戏"
STR_INTERCEPT_TEXT_22: "胡珀研究你。他用手指在桌子上摆出一个想象的棋局。隐晦的回答可以让他揭露直接指控永远无法揭露的真相。"
STR_INTERCEPT_CHOICE_22_0: "用国际象棋线索回答"
STR_INTERCEPT_CHOICE_22_1: "威胁要说出他的名字"
STR_INTERCEPT_CHOICE_22_2: "说实话"
STR_INTERCEPT_TITLE_23: "面对面"
STR_INTERCEPT_TEXT_23: "胡珀问你实际上可以证明什么。只有当你提到他计划之外的人不应该知道的细节时，他的信心才会动摇。"
STR_INTERCEPT_CHOICE_23_0: "用证据面对他"
STR_INTERCEPT_CHOICE_23_1: "提供组件作为交易"
STR_INTERCEPT_CHOICE_23_2: "虚张声势"
STR_INTERCEPT_TITLE_24: "杯子"
STR_INTERCEPT_TEXT_24: "胡珀端来水，但先伸手去拿茶杯。保留那个杯子可能比接受他提供的任何其他东西更有用。"
STR_INTERCEPT_CHOICE_24_0: "保留杯子"
STR_INTERCEPT_CHOICE_24_1: "再次检查你的外套"
STR_INTERCEPT_TITLE_25: "需要测试的东西"
STR_INTERCEPT_TEXT_25: "你保留杯子并请哈里斯检查。这最终是一项附有物体的指控。胡珀试图将其移除的尝试提供了第二个有用的细节。"
STR_INTERCEPT_CHOICE_25_0: "把杯子给哈里斯"
STR_INTERCEPT_CHOICE_25_1: "与胡珀对峙"
STR_INTERCEPT_TITLE_26: "错误的目标"
STR_INTERCEPT_TEXT_26: "你在没有证据的情况下指控哈里斯。他看到一名嫌疑人试图抹黑调查员。不管茶发生了什么，你都让他更难相信你了。"
STR_INTERCEPT_CHOICE_26_0: "采访结束"
STR_INTERCEPT_TITLE_27: "整个账户"
STR_INTERCEPT_TEXT_27: "您给出姓名并描述会议。哈里斯提出了精确的问题。你的尴尬是真实的，但他现在可以检查的细节也是如此。"
STR_INTERCEPT_CHOICE_27_0: "让他验证账户"
STR_INTERCEPT_CHOICE_27_1: "主动寻找胡珀"
STR_INTERCEPT_TITLE_28: "失败的虚张声势"
STR_INTERCEPT_TEXT_28: "哈里斯已经听到了足够自信的答案。胡珀也有。两者都没有提供您的故事缺失的事实。"
STR_INTERCEPT_CHOICE_28_0: "坚持主张"
STR_INTERCEPT_CHOICE_28_1: "绝望逃脱"
STR_INTERCEPT_CHOICE_28_2: "承认真实发生的事情"
STR_INTERCEPT_TITLE_29: "截距"
STR_INTERCEPT_TEXT_29: "你口袋里的那张纸上不仅有乱七八糟的字母：它穿过小屋的路线使胡珀靠近机器。一条简洁的线索可能会让正确的人在正确的地方寻找。"
STR_INTERCEPT_CHOICE_29_0: "为 Hooper 编码消息"
STR_INTERCEPT_CHOICE_29_1: "显示前往哈里斯的路线"
STR_INTERCEPT_TITLE_30: "机器运行"
STR_INTERCEPT_TEXT_30: "哈里斯拥有这个组件，以及一条超越你第一个恐惧答案的线索。炸弹恢复工作。你以自己的名义离开了 14 号小屋，秘密更少，未来仍需负责。"
STR_INTERCEPT_TITLE_31: "受到怀疑"
STR_INTERCEPT_TEXT_31: "退回组件使机器免于延误。它并没有保住你的位置。在调查继续进行期间，哈里斯阻止了你进入小屋。你在采访中幸存下来，但并没有洗清你的罪名。"
STR_INTERCEPT_TITLE_32: "被拘留"
STR_INTERCEPT_TEXT_32: "门是为警卫而不是为你打开的。矛盾、证据缺失和部件失窃已成为您无法再处理的案件。本次尝试到此结束。"
STR_INTERCEPT_TITLE_33: "外部路径"
STR_INTERCEPT_TEXT_33: "你把小屋抛在了身后。黑暗是有用的，但地面却受到监视。一扇破碎的窗户让巡逻队比你希望的更近了。"
STR_INTERCEPT_CHOICE_33_0: "穿过空地"
STR_INTERCEPT_CHOICE_33_1: "保持服务路径"
STR_INTERCEPT_CHOICE_33_2: "转身面向哈里斯"
STR_INTERCEPT_TITLE_34: "胡珀小屋"
STR_INTERCEPT_TEXT_34: "办公桌无人看管。填字游戏下面放着文件，机房则出现在用铅笔写的时间表中。脚步声沿着外面的木板接近。"
STR_INTERCEPT_CHOICE_34_0: "检查试卷"
STR_INTERCEPT_CHOICE_34_1: "等待胡珀"
STR_INTERCEPT_CHOICE_34_2: "前往哈里斯"
STR_INTERCEPT_TITLE_35: "国际象棋问题"
STR_INTERCEPT_TEXT_35: "你给胡珀一个反映他困境的位置：一个受保护的棋子，一个暴露的国王，以及在答复之前看起来安全的一步。他理解这个警告。他接下来的话提供了你所需要的联系。"
STR_INTERCEPT_CHOICE_35_0: "让他承认这个计划"
STR_INTERCEPT_CHOICE_35_1: "将入场券发送给 Harris"
STR_INTERCEPT_TITLE_36: "不戴口罩"
STR_INTERCEPT_TEXT_36: "你谈论压力，而不是假装它不存在。胡珀作为一个人而不是作为一个对手简单地回答道。该空缺可用于交易或陷阱。"
STR_INTERCEPT_CHOICE_36_0: "要求诚实的安排"
STR_INTERCEPT_CHOICE_36_1: "让他坦白"
STR_INTERCEPT_CHOICE_36_2: "将账户交给 Harris"
STR_INTERCEPT_TITLE_37: "胡珀入学"
STR_INTERCEPT_TEXT_37: "Hooper 的解释足以将勒索与丢失的组件联系起来。哈里斯现在可以恢复设备并检查故事。你必须决定是结束调查还是让胡珀消失。"
STR_INTERCEPT_CHOICE_37_0: "给哈里斯带来入场券"
STR_INTERCEPT_CHOICE_37_1: "让胡珀走开"
STR_INTERCEPT_TITLE_38: "贸易"
STR_INTERCEPT_TEXT_38: "你将最后一块杠杆放在胡珀力所能及的范围内。没有证人或证据的讨价还价是邀请他以你为代价解决他的问题。"
STR_INTERCEPT_CHOICE_38_0: "移交组件"
STR_INTERCEPT_CHOICE_38_1: "要求见证协议"
STR_INTERCEPT_CHOICE_38_2: "撤回报价"
STR_INTERCEPT_TITLE_39: "哈里斯倾听"
STR_INTERCEPT_TEXT_39: "详情可查看。哈里斯询问该组件现在在哪里。清除帐户和让机器运行是相关的问题，但它们不是同一个问题。"
STR_INTERCEPT_CHOICE_39_0: "归还外套里的东西"
STR_INTERCEPT_CHOICE_39_1: "帮助恢复组件"
STR_INTERCEPT_CHOICE_39_2: "现在停止回答"
STR_INTERCEPT_TITLE_40: "超越栅栏"
STR_INTERCEPT_TEXT_40: "小屋在你身后消失了。 园区外的自由不等于纯真,机器现在是别人的紧急问题。 你逃脱了;故事仍然没有结束。"
STR_INTERCEPT_TITLE_41: "最后一个错误"
STR_INTERCEPT_TEXT_41: "巡逻队会在空地结束之前到达您身边，或者当胡珀不再有用时，他的承诺就会崩溃。您已用完安全动作。这个故事可以从头再试一次。"
STR_INTERCEPT_TITLE_42: "论文"
STR_INTERCEPT_TEXT_42: "时间表将胡珀放置在你的故事所说的地方。旁边是最先把你引入陷阱的便条。该组合足够具体，可供哈里斯验证。"
STR_INTERCEPT_CHOICE_42_0: "把文件交给哈里斯"
STR_INTERCEPT_CHOICE_42_1: "等待并面对胡珀"
STR_INTERCEPT_TITLE_43: "最后的安排"
STR_INTERCEPT_TEXT_43: "Hooper 提议将零件放回去。信任他可以解决一个迫在眉睫的问题；让哈里斯成为证人将使创造另一个证人变得更加困难。"
STR_INTERCEPT_CHOICE_43_0: "安排见证回程"
STR_INTERCEPT_CHOICE_43_1: "将哈里斯纳入计划"
STR_INTERCEPT_TITLE_44: "恢复卷轴"
STR_INTERCEPT_TEXT_44: "帐户记录后，搜索将返回到丢失的硬件。哈里斯检查机房，同时确定组件应该放置的位置。"
STR_INTERCEPT_CHOICE_44_0: "完成验证退货"
STR_INTERCEPT_CHOICE_44_1: "从你的外套中取出它"
STR_INTERCEPT_CHOICE_44_2: "警告哈里斯注意胡珀"
STR_INTERCEPT_TITLE_45: "最后一个问题"
STR_INTERCEPT_TEXT_45: "哈里斯等待着。如果您可以将胡珀与盗窃案联系起来，那么仍然有办法恢复该组件并正确结束这件事。否则调查的只有你变更的账户。"
