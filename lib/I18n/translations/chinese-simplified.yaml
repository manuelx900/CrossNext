STR_CAR_INTRO: "内疚和诚实是独立的。每个案例都有一个解决方案。身高是虚构的人物特征。"
STR_CAR_HELP_TEXT: "如何解决案件\n每个角色做一个陈述。 屏幕的顶部显示了罪犯和错误陈述的确切数量。 找到满足两个计数的组合,每个案例都有一个解决方案。\n  \n罪恶不是诚实\n一个无辜的角色可以说谎,一个有罪的人可以说真话。 两个谎言意味着正好两个完整的陈述是假的;其他的都是真的。 真相/谎言标记指的是陈述;嫌疑人指的是罪恶。\n  \n阅读线索\n“A或B做了(或两者都做了 ) ” 意味着至少有一个被指定的角色是有罪的,而“A和B都做了”则需要两个角色。 谎言否定整个陈述:假的OR意味着两者都没有做过;假的AND意味着至少有一个角色没有做过。\n  \n“两人都说实话或者两人都撒谎”比较的是陈述,而不是罪恶感。 “正好一个人在撒谎”意味着他们的陈述有不同的真值,这些线索本身可以是真或假。\n  \n小屏邻居\n原始的圆形顺序是豹,孔雀,鲨鱼,狐狸,熊,鹿,马,只使用这种情况下的角色。 最后一个和第一个是邻居。 这款应用程序直接在每个邻居线索中写入两个名字。 你永远不需要猜测哪张卡片是在肖像旁边。 改变页面或方向不会改变线索。\n  \n身高與飲食\n每张卡片都显示一个虚构的身高和饮食习惯。 \"一个罪犯比我高\"意味着至少有一个罪犯比发言人高,而不一定是所有的罪犯。 较短的卡片效果相同。 肉食动物和草食动物线索意味着至少有一个罪犯有这种饮食习惯;杂食动物两者都不算。\n  \n你的分析\n使用? / Truth / Lie 和 Suspect 在每个陈述下面记录假设。 这些是你的笔记,不是证据或自动检查。 箭头显示其他角色。\n  \n指控\n点击\"指控 \" , 然后选择所需的罪犯数量。 只有确认错误的指控才需要一生命。 初学者和普通玩家有两个生命;高级玩家和专家玩家有一个生命。\n  \n战役与重播\n有 1,470 个案件。 打开案件恢复当前尝试或在关闭后打开下一个案件。 战役允许您从开始任意顺序选择 1,470 个案件中的任何一个。 重播开始新的尝试,同时保留之前完成的任务。 在每个难度级别中,案件从一个罪犯到两个罪犯,然后从每个罪犯组内较少的谎言到更多的谎言。\n  \n进度和生命都保存在SD卡上。 离开、睡眠或重新启动设备不会恢复当前尝试的生命。 失败的保存将阻止结果,直到重试成功。"
