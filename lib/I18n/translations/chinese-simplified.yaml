STR_QUEST_CAM_JOURNEY2_SAGA_11_10: "房间里堆满了被盗和损坏的书籍。你释放那些仍然锁在盒子里的人，然后爬向堡垒的最高部分，寻找国王力量的源泉。\n\n一本巨大的书记载了国王的一些魔法。它的锁与钥匙上的三个封条相匹配。当你打开它时，黑暗魔法就会减弱，你就可以前往王座了。\n\n国王留下最后一个影子来保护自己。你让它消失。现在没有守护者挡在你们中间，书籍之战即将开始。\n\n你击败了遗忘之王。他的怪物无法再威胁世界，被盗的书籍也回到了它们的主人身边。回到家，你像出发前一样打开一本书。"
