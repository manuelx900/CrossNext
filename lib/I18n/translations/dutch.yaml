STR_QUEST_CAM_JOURNEY2_SAGA_6_10: "De stadsmensen vertellen je hoe de klok de poort bestuurt. In een werkplaats vind je een tandwiel dat de toren misschien weer aan de praat kan krijgen.\n\nHet tandwiel opent de ingang van de toren. Binnenin vind je een kleinere klok met een ontbrekende wijzer. Je haalt de hand uit de werkplaats en plaatst hem op zijn plaats, waardoor de machinekamer wordt geopend. De monsters van de koning hebben de enorme wielen geblokkeerd.\n\nJe repareert het grootste deel van het mechanisme, maar de wijzers bewegen nog steeds niet. Bovenaan de toren bestuurt een levende machine het laatste wiel en houdt de poort gesloten.\n\nDe Clockwork Automaton stopt en de grote wielen draaien. De klokken luiden als de poort opengaat. De nacht valt als je in het maanlicht een oud paleis ziet."
STR_QUEST_CAM_JOURNEY2_SAGA_7_0: "Een rustig paleis staat in het maanlicht. Monsters patrouilleren nog steeds in de hallen. Je gaat naar binnen om een ​​weg te zoeken naar het fort van de Koning van Oblivion."
STR_QUEST_CAM_JOURNEY2_SAGA_7_3: "Oude symbolen en een tekening van een sleutel springen in het paleis in het oog. De sleutel lijkt bij het kasteel van de koning te horen, dus doorzoek de paleisboeken voor meer informatie."
