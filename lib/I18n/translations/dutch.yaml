STR_QUEST_CAM_JOURNEY2_SAGA_8_10: "Je vindt dode planten en droge kanalen. Een standbeeld heeft de hoofdpoort gesloten, maar je krijgt hem open en het water stroomt naar de fontein. Er glinstert iets metaalachtigs aan de onderkant.\n\nHet object is de sleutel, met drie lege plaatsen voor de zegels. Op een kaart is de eerste zeehond te zien bij de uitgang, maar het pad is ingestort. Je zoekt een andere weg er doorheen.\n\nJe repareert een bruggetje en volgt een tunnel naar het uiteinde van de tuin. Een gigantisch standbeeld draagt ​​het symbool van de sleutel. Naarmate je dichterbij komt, begint de steen te bewegen.\n\nJe verslaat de Stone Colossus en plaatst het eerste zegel in de sleutel. Er blijven er twee over. De banieren van de koning in de verte markeren het land waar zijn soldaten het volgende zegel vasthouden."
STR_QUEST_CAM_JOURNEY2_SAGA_9_0: "Het leger van de koning bezet deze regio. De soldaten verzamelen gestolen boeken om het tweede zegel in een van hun kampen te vernietigen en vast te houden."
