STR_QUEST_CAM_JOURNEY2_BOOK_11: "De laatste pagina"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Nadat je de King of Oblivion hebt verslagen, keer je terug naar huis. Zijn leger kan geen boeken meer vernietigen en mensen lezen weer in vrede. Je hebt de verhalen van de wereld gered. Er zijn nog veel boeken te ontdekken."
