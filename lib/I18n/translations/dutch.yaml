STR_FLASHCARDS_IMPORT_ERROR: "Kan dit kaartspel niet importeren. Originele dossiers en bestaande studievoortgang zijn veilig. Controleer de SD-kaart, het beschikbare PSRAM en het exportformaat. Probeer een Anki-tekstexport of de meegeleverde converter voor ongebruikelijke sjablonen."
