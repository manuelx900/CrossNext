STR_QUEST_CAM_JOURNEY2_SAGA_7_9: "Oude symbolen en een tekening van een sleutel springen in het paleis in het oog. De sleutel lijkt bij het kasteel van de koning te horen, dus doorzoek de paleisboeken voor meer informatie.\n\nEen oud boek zegt dat het kasteel wordt geopend met een speciale sleutel en drie zegels. De sleutel ligt mogelijk in een tuin achter het paleis. Nu weet je wat je nodig hebt en waar je eerst moet kijken.\n\nEen oude spiegel onthult verborgen vlekken op de muren. Ze leiden naar het mechanisme van de achterpoort. Daarachter zie je dorre bomen en een niet meer gebruikte fontein, maar een grote schaduw bewaakt de weg."
STR_QUEST_CAM_JOURNEY2_SAGA_7_10: "Oude symbolen en een tekening van een sleutel springen in het paleis in het oog. De sleutel lijkt bij het kasteel van de koning te horen, dus doorzoek de paleisboeken voor meer informatie.\n\nEen oud boek zegt dat het kasteel wordt geopend met een speciale sleutel en drie zegels. De sleutel ligt mogelijk in een tuin achter het paleis. Nu weet je wat je nodig hebt en waar je eerst moet kijken.\n\nEen oude spiegel onthult verborgen vlekken op de muren. Ze leiden naar het mechanisme van de achterpoort. Daarachter zie je dorre bomen en een niet meer gebruikte fontein, maar een grote schaduw bewaakt de weg.\n\nDe Lunar Spectre verdwijnt en je verlaat het paleis. In de tuin verderop vind je het eerste deel van je zoektocht naar de sleutel en zijn zegels."
STR_QUEST_CAM_JOURNEY2_SAGA_8_0: "De tuin ligt er al jaren verlaten bij. De kanalen zijn droog en in het midden staat een oude fontein. Mogelijk ligt de sleutel van het fort er nog."
