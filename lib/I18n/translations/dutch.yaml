STR_QUEST_CAM_DECOR_NAME_0: "Bosfee"
STR_QUEST_CAM_DECOR_TEXT_0: "Je hebt de fee bevrijd van de stille wortels. Ze brengt een klein wonder in je huis."
STR_QUEST_CAM_SOLO_DECOR_NAME_1: "Boslantaarn"
STR_QUEST_CAM_SOLO_DECOR_TEXT_1: "Een lantaarn om uw leeshoek te verlichten."
STR_QUEST_CAM_DECOR_NAME_2: "Echoshell"
STR_QUEST_CAM_DECOR_TEXT_2: "Een geredde zeeman geeft je een schelp die nog steeds het lied van de zee bevat."
STR_QUEST_CAM_DECOR_NAME_3: "Inktgeest"
STR_QUEST_CAM_DECOR_TEXT_3: "Een geest ontsnapte uit een blanco pagina. Het kiest ervoor om met u mee te reizen."
STR_QUEST_CAM_DECOR_NAME_4: "Maanbloem"
STR_QUEST_CAM_DECOR_TEXT_4: "De tuinmannen hebben één zaadje uit de slaaptuin bewaard. Deze bloem is voor jou gegroeid."
STR_QUEST_CAM_DECOR_NAME_5: "Winterkristal"
STR_QUEST_CAM_DECOR_TEXT_5: "Door de dooi wordt een kristal onthuld dat de laatste herinnering aan de berg bevat."
STR_QUEST_CAM_DECOR_NAME_6: "Uurwerkuil"
STR_QUEST_CAM_DECOR_TEXT_6: "De horlogemaker repareert deze kleine bewaker om je te bedanken voor het terugbrengen van de tijd."
STR_QUEST_CAM_DECOR_NAME_7: "Feniksveer"
STR_QUEST_CAM_DECOR_TEXT_7: "Uit de teruggevonden as rijst een veer op: de belofte dat verhalen opnieuw kunnen beginnen."
STR_QUEST_CAM_DECOR_NAME_8: "Woestijnlamp"
STR_QUEST_CAM_DECOR_TEXT_8: "Een verhalenverteller geeft je de lamp die de woestijnverhalen levend hield."
STR_QUEST_CAM_DECOR_NAME_9: "Wolkenkoi"
STR_QUEST_CAM_DECOR_TEXT_9: "Je opent de wolkenkooi. Een kleine koi blijft om over je dromen te waken."
STR_QUEST_CAM_DECOR_NAME_10: "Drakenhart"
STR_QUEST_CAM_DECOR_TEXT_10: "De draken vertrouwen je een kristal toe, geboren uit hun herstelde geheugen."
STR_QUEST_CAM_DECOR_NAME_11: "Ster van herinnering"
STR_QUEST_CAM_DECOR_TEXT_11: "De eerste herstelde ster verlicht je weg naar de laatste pagina's."
STR_QUEST_CAM_DECOR_NAME_12: "Spruitje lezen"
STR_QUEST_CAM_DECOR_TEXT_12: "Een klein plantje voor een rustig leeshoekje."
STR_QUEST_CAM_DECOR_NAME_13: "Opgeslagen boeken"
STR_QUEST_CAM_DECOR_TEXT_13: "Verhalen wachten op hun volgende lezer."
STR_QUEST_CAM_DECOR_NAME_14: "Voyager-banner"
STR_QUEST_CAM_DECOR_TEXT_14: "Een wimpel om elk nieuw begin te onthouden."
STR_QUEST_CAM_DECOR_NAME_15: "Maanpaddestoelen"
STR_QUEST_CAM_DECOR_TEXT_15: "Een klein stukje bos voor bij jou thuis."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Het begin van het avontuur"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Jarenlang leefden mensen in vrede en genoten van hun boeken. Toen begon de Koning van Oblivion ze te vernietigen. Hij wilde voorkomen dat iedereen zou lezen en alle verhalen voor altijd laten verdwijnen."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "De monsters van de koning"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "De Koning van Oblivion stuurde zijn monsters de hele wereld over. Ze vernietigden elk boek dat ze vonden en vielen iedereen aan die hen probeerde tegen te houden. Bibliotheken begonnen te verdwijnen en mensen stopten met lezen."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "De kracht van lezen"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Op een dag, terwijl je aan het lezen bent in de buurt van je dorp, verschijnt er een monster. Je probeert weg te komen, maar er gebeurt iets verrassends: hoe meer je leest, hoe zwakker het wordt. Je realiseert je dat lezen de enige manier is om de magie van de koning te bestrijden."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Jouw missie"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Jij wilde de koning tegenhouden. Op weg naar zijn kasteel moet je bossen, steden, bergen en andere plaatsen vol vijanden doorkruisen. Met elk monster dat je verslaat, kom je een beetje dichterbij. Blijf lezen, versla zijn bewakers en bereik hem voordat hij elk boek ter wereld vernietigt."
