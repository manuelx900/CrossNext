STR_INTERCEPT_TITLE_39: "Harris luistert"
STR_INTERCEPT_TEXT_39: "De details kunnen worden gecontroleerd. Harris vraagt waar de component nu is. Het opruimen van uw account en het laten draaien van de machine zijn gerelateerde problemen, maar ze zijn niet hetzelfde."
STR_INTERCEPT_CHOICE_39_0: "Geef terug wat in je jas zit"
STR_INTERCEPT_CHOICE_39_1: "Helpen bij het herstellen van de component"
STR_INTERCEPT_CHOICE_39_2: "Stop met antwoorden nu"
STR_INTERCEPT_TITLE_40: "Buiten het hek"
STR_INTERCEPT_TEXT_40: "Vrijheid buiten het terrein is niet hetzelfde als onschuld, en de machine is nu iemand anders’s dringende probleem."
STR_INTERCEPT_TITLE_41: "De laatste fout"
STR_INTERCEPT_TEXT_41: "De patrouille bereikt u voordat de open grond eindigt, of Hooper's belofte instort wanneer het niet langer nuttig voor hem is."
STR_INTERCEPT_TITLE_42: "De papieren"
STR_INTERCEPT_TEXT_42: "Het schema plaatst Hooper waar uw verhaal zei dat hij was. Naast het is de notitie die u eerst in de val trok."
STR_INTERCEPT_CHOICE_42_0: "Breng de papieren naar Harris"
STR_INTERCEPT_CHOICE_42_1: "Wacht en confronteer Hooper"
STR_INTERCEPT_TITLE_43: "Een laatste afspraak"
STR_INTERCEPT_TEXT_43: "Vertrouwen in hem zou een onmiddellijk probleem verwijderen; het maken van Harris een getuige zou het moeilijker maken om een ander te maken."
STR_INTERCEPT_CHOICE_43_0: "Maak een getuige terug"
STR_INTERCEPT_CHOICE_43_1: "Breng Harris in het plan"
STR_INTERCEPT_TITLE_44: "Het echte terugvinden"
STR_INTERCEPT_TEXT_44: "Met het account op record, de zoekopdracht keert terug naar de ontbrekende hardware. Harris controleert de machine kamer terwijl u identificeert waar de component zou moeten zijn."
STR_INTERCEPT_CHOICE_44_0: "Voltooi de gecontroleerde retour"
STR_INTERCEPT_CHOICE_44_1: "Haal het uit je jas"
STR_INTERCEPT_CHOICE_44_2: "Harris waarschuwt voor Hooper"
STR_INTERCEPT_TITLE_45: "De laatste vraag"
STR_INTERCEPT_TEXT_45: "Harris wacht. Als je Hooper kunt verbinden met de diefstal, is er nog steeds een manier om het onderdeel te herstellen en dit goed te beëindigen."
