STR_INTERCEPT_ABOUT: "Een gecondenseerde aanpassing van The Intercept by inkle, 2016, gebruikt onder de MIT-licentie. Bletchley Park, 1942: een ontbrekende machinecomponent, chantage en een interview dat kan eindigen in vrijheid of bewaring.\n\nUw beslissingen en positie worden opgeslagen na elke keuze. Een nieuw verhaal herstelt dit spel. Originele illustraties werden gemaakt voor deze firmware. Het originele script en licentie zijn inbegrepen in het project."
