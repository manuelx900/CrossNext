STR_UI_SWIPE_OR_TAP_AN_ARROW_TO_887004: "Draai of tik op een pijl om te sturen. Eet het beschreven voedsel om te groeien. Vermijd muren en je eigen staart. U kunt de richting niet omkeren. Tik op Pause voordat u de lezer neerzet. Bewaarde spellen hervatten altijd pauze."
STR_UI_YOU_PLAY_BLACK_TAP_AN_EMPTY_29AEBA: "Je speelt zwart. Tik op een leeg vierkant dat witte schijven in een rechte lijn vastlegt. Alle gevangen schijven draaien naar je kleur. Het apparaat speelt wit. Als een zijde geen wettelijke beweging heeft, gaat deze automatisch door. De meeste schijven winnen wanneer geen van beide zijden kan bewegen."
STR_UI_MAKE_ONE_CLOSED_LOOP_EACH_NUMBER_D60227: "Maak één gesloten loop. Elk getal vertelt hoeveel van zijn vier randen tot de loop behoren. Tik dicht bij een rand naar cycluslijn, kruis en leeg. Lijnen kunnen geen takken of afzonderlijke slagen vormen. Alle aanwijzingen moeten overeenkomen. Elke geldige oplossing wordt geaccepteerd."
STR_UI_CONNECT_ALL_ISLANDS_IN_ONE_NETWORK_C5618B: "Verbind alle eilanden in één netwerk. Het nummer op een eiland is het vereiste aantal bruggen. Tik twee naburige eilanden op dezelfde rij of kolom om één, twee en nul bruggen te draaien. Bruggen kunnen niet over eilanden springen. Elke verbonden oplossing die overeenkomt met alle getallen wint."
