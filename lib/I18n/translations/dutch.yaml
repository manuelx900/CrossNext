STR_CAR_INTRO: "Schuld en eerlijkheid zijn onafhankelijk.Elke zaak heeft precies één oplossing."
STR_CAR_HELP_TEXT: "Hoe een zaak op te lossen\nElk personage maakt een verklaring. De bovenkant van het scherm geeft het exacte aantal boosdoeners en valse verklaringen. Zoek een combinatie die voldoet aan beide tellingen. Elke zaak heeft één oplossing.\n  \nSchuld is geen eerlijkheid\nEen onschuldig personage kan liegen, en een schuldige kan de waarheid vertellen. Twee leugens betekent dat precies twee volledige uitspraken onwaar zijn; de andere zijn waar. Waarheid / Leugen markeringen verwijzen naar de verklaring; Verdachte verwijst naar schuld.\n  \nHet lezen van de aanwijzingen\n\"A of B deed het (of beide)\" betekent dat ten minste één van de genoemde personages schuldig is. \"A en B deden het\" vereist beide. Een leugen ontkent de hele stelling: een vals OF betekent dat geen van beiden het deed; een vals EN betekent dat ten minste één ervan het niet deed.\n  \n\"Beiden waarachtig of beiden liegen\" vergelijkt uitspraken, niet schuld. \"Precies één liegt\" betekent dat hun uitspraken verschillende waarheidswaarden hebben. Deze aanwijzingen kunnen zelf waar of onwaar zijn.\n  \nBuren op een klein scherm\nDe oorspronkelijke cirkelvormige volgorde is Panter, Pauw, Haai, Vos, Beer, Hert, Paard, met behulp van alleen deze case karakters. De laatste en de eerste zijn buren. Deze app schrijft de twee namen direct in elke buur aanwijzing. Je hoeft nooit te raden welke kaarten zijn naast een portret. Het veranderen van pagina of oriëntatie verandert niet een aanwijzing.\n  \nLengte en voeding\nElke kaart toont een fictieve lengte en dieet. \"Een boosdoener is groter dan ik\" betekent dat ten minste één boosdoener groter is dan de spreker, niet noodzakelijkerwijs alle boosdoeners. Kortere werkt op dezelfde manier. Carnivore en herbivore aanwijzingen betekenen dat ten minste één boosdoener dat dieet heeft; omnivoren tellen als geen van beide. Namen, lengtes en diëten zijn betrouwbare feiten; uitspraken kunnen liegen.\n  \nUW ANALYSE\nGebruik ? / Waarheid / Leugen en Verdachte onder elke uitspraak om hypothesen op te nemen. Dit zijn uw notities, geen bewijs of automatische controles. Pijlen tonen de andere tekens. Portretmodus toont maximaal drie per pagina.\n  \nEen aanklacht indienen\nDruk op Accuse en selecteer precies het vereiste aantal boosdoeners. Alleen het bevestigen van een verkeerde beschuldiging kost een leven. Beginner en Normal hebben twee levens; Advanced en Expert hebben één. Een juiste beschuldiging lost de zaak op. Als er geen levens meer over zijn, wordt de oplossing onthuld.\n  \nCampagne en herhaling\nEr zijn 1.470 gevallen. Open geval hervat de huidige poging of opent de volgende na een gesloten geval. Campagne laat je kiezen uit een van de 1.470 gevallen in elke volgorde vanaf het begin. Replay start een nieuwe poging met behoud van eerdere voltooiing. Binnen elke moeilijkheidsgraad, gaan gevallen van één boosdoener naar twee, dan van minder leugenaars naar meer binnen elke groep boosdoeners. Beginner houdt één boosdoener. Kleinere casts komen eerst wanneer het aantal overeenkomt. Alle gevallen blijven beschikbaar. Het oplossen van een eerder uitgeput geval upgradet het naar opgelost.\n  \nVoortgang en levens worden opgeslagen op de SD-kaart. Verlaten, slapen of een apparaat opnieuw opstarten herstelt geen levens in de huidige poging. Een mislukte opslag blokkeert het resultaat tot Retry succesvol is. Reset all vraagt om bevestiging voordat alleen Carnivore-voortgang wordt gewist."
