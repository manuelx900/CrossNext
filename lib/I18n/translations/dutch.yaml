STR_FLASHCARDS_HELP: "Anki-decks kopiëren (.apkg /.colpkg , .anki2 /.anki21 ), CSV /TSV/text of geconverteerde studiemappen naar /FLASHCARDS. Gebruik submappen: elk maximaal 128 items.\n\nImport accepteert standaard-, omgekeerde en eenvoudige cloze-tekstkaarten. Audio en aangepaste HTML worden niet ondersteund. Converteer eerst de afbeelding /CJK-decks. Offline beoordelingen gebruiken FSRS. Bij het importeren wordt een nieuw schema gestart en blijven de originelen behouden."
STR_FLASHCARDS_PREPARING: "Dit kaartspel controleren en importeren. Grote Anki-collecties kunnen een tijdje duren. Houd de SD-kaart aangesloten."
