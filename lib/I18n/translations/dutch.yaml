STR_QUEST_CAM_JOURNEY2_SAGA_9_6: "Je bereikt een legerkamp en vindt een kar vol boeken die nog gered kunnen worden. Een kaart erin leidt je naar de tent van de commandant, waar je hoopt meer te weten te komen over de tweede zeehond.\n\nEen aantekening verwijst naar het kamparchief. Binnenin vind je verslagen van aanvallen op bibliotheken en een plattegrond van een kamer achter een ijzeren deur. Het zegel moet tot de waardevolle spullen behoren die daar worden bewaard."
STR_QUEST_CAM_JOURNEY2_SAGA_9_9: "Je bereikt een legerkamp en vindt een kar vol boeken die nog gered kunnen worden. Een kaart erin leidt je naar de tent van de commandant, waar je hoopt meer te weten te komen over de tweede zeehond.\n\nEen aantekening verwijst naar het kamparchief. Binnenin vind je verslagen van aanvallen op bibliotheken en een plattegrond van een kamer achter een ijzeren deur. Het zegel moet tot de waardevolle spullen behoren die daar worden bewaard.\n\nJe opent de kamer en haalt het tweede zegel terug. Een kaart toont de weg naar het fort, maar de commandant controleert nog steeds het laatste controlepunt van het kamp."
STR_QUEST_CAM_JOURNEY2_SAGA_9_10: "Je bereikt een legerkamp en vindt een kar vol boeken die nog gered kunnen worden. Een kaart erin leidt je naar de tent van de commandant, waar je hoopt meer te weten te komen over de tweede zeehond.\n\nEen aantekening verwijst naar het kamparchief. Binnenin vind je verslagen van aanvallen op bibliotheken en een plattegrond van een kamer achter een ijzeren deur. Het zegel moet tot de waardevolle spullen behoren die daar worden bewaard.\n\nJe opent de kamer en haalt het tweede zegel terug. Een kaart toont de weg naar het fort, maar de commandant controleert nog steeds het laatste controlepunt van het kamp.\n\nDe commandant valt. Je vertrekt met het tweede zegel en enkele van de bewaarde boeken. De kaart leidt naar oude paden die boven een leegte hangen, waar je op zoek gaat naar de laatste zeehond."
STR_QUEST_CAM_JOURNEY2_SAGA_10_0: "Het fort is dichtbij, maar het derde zegel ontbreekt nog. Een oude weg over een leegte leidt naar een archief waar het zegel mogelijk verborgen is."
STR_QUEST_CAM_JOURNEY2_SAGA_10_3: "Je steekt een hangbrug over en opent een deur bedekt met licht. Daarachter ligt een oud archief waarvan de boeken je kunnen vertellen waar je het laatste zegel kunt vinden."
STR_QUEST_CAM_JOURNEY2_SAGA_10_6: "Je steekt een hangbrug over en opent een deur bedekt met licht. Daarachter ligt een oud archief waarvan de boeken je kunnen vertellen waar je het laatste zegel kunt vinden.\n\nIn een boek staat dat het derde zegel onder het archief wordt bewaard. Je neemt de trap naar donkere tunnels die naar een afgesloten kamer leiden."
STR_QUEST_CAM_JOURNEY2_SAGA_10_9: "Je steekt een hangbrug over en opent een deur bedekt met licht. Daarachter ligt een oud archief waarvan de boeken je kunnen vertellen waar je het laatste zegel kunt vinden.\n\nIn een boek staat dat het derde zegel onder het archief wordt bewaard. Je neemt de trap naar donkere tunnels die naar een afgesloten kamer leiden.\n\nJe herstelt het derde zegel en voltooit de sleutel. Als je de tunnels verlaat, zie je de vestingmuren. Een brug leidt naar de poort, waar de laatste monsters op wacht staan."
STR_QUEST_CAM_JOURNEY2_SAGA_10_10: "Je steekt een hangbrug over en opent een deur bedekt met licht. Daarachter ligt een oud archief waarvan de boeken je kunnen vertellen waar je het laatste zegel kunt vinden.\n\nIn een boek staat dat het derde zegel onder het archief wordt bewaard. Je neemt de trap naar donkere tunnels die naar een afgesloten kamer leiden.\n\nJe herstelt het derde zegel en voltooit de sleutel. Als je de tunnels verlaat, zie je de vestingmuren. Een brug leidt naar de poort, waar de laatste monsters op wacht staan.\n\nDe Leegteslang kan de boog niet langer bewaken. De drie zegels gloeien als u de sleutel in de deur steekt. Het kasteel gaat open en alleen de Koning van Oblivion blijft over."
STR_QUEST_CAM_JOURNEY2_SAGA_11_0: "Eindelijk bereik je het kasteel van de Koning van Oblivion. Er zitten veel boeken in die zijn soldaten hebben gestolen. Zijn laatste bewakers beschermen de troon, en jij moet zijn magie verzwakken voordat je hem tegemoet treedt."
STR_QUEST_CAM_JOURNEY2_SAGA_11_3: "De kamers liggen vol met gestolen en beschadigde boeken. Je bevrijdt degenen die nog in dozen zitten en klimt vervolgens naar het hoogste deel van het fort om de bron van de macht van de koning te vinden."
STR_QUEST_CAM_JOURNEY2_SAGA_11_6: "De kamers liggen vol met gestolen en beschadigde boeken. Je bevrijdt degenen die nog in dozen zitten en klimt vervolgens naar het hoogste deel van het fort om de bron van de macht van de koning te vinden.\n\nEen enorm boek bevat een deel van de magie van de koning. Het slot komt overeen met de drie zegels op de sleutel. Als je hem opent, verzwakt de duistere magie en kun je op weg naar de troon."
STR_QUEST_CAM_JOURNEY2_SAGA_11_9: "De kamers liggen vol met gestolen en beschadigde boeken. Je bevrijdt degenen die nog in dozen zitten en klimt vervolgens naar het hoogste deel van het fort om de bron van de macht van de koning te vinden.\n\nEen enorm boek bevat een deel van de magie van de koning. Het slot komt overeen met de drie zegels op de sleutel. Als je hem opent, verzwakt de duistere magie en kun je op weg naar de troon.\n\nDe koning maakt nog een laatste schaduw om zichzelf te beschermen. Je laat het verdwijnen. Er staat nu geen voogd meer tussen jullie, en de strijd om de boeken staat op het punt te beginnen."
STR_QUEST_CAM_JOURNEY2_SAGA_11_10: "De kamers liggen vol met gestolen en beschadigde boeken. Je bevrijdt degenen die nog in dozen zitten en klimt vervolgens naar het hoogste deel van het fort om de bron van de macht van de koning te vinden.\n\nEen enorm boek bevat een deel van de magie van de koning. Het slot komt overeen met de drie zegels op de sleutel. Als je hem opent, verzwakt de duistere magie en kun je op weg naar de troon.\n\nDe koning maakt nog een laatste schaduw om zichzelf te beschermen. Je laat het verdwijnen. Er staat nu geen voogd meer tussen jullie, en de strijd om de boeken staat op het punt te beginnen.\n\nJe verslaat de Koning van Oblivion. Zijn monsters kunnen de wereld niet langer bedreigen en de gestolen boeken keren terug naar hun eigenaren. Thuis sla je een boek open, net zoals je dat voor de reis deed."
