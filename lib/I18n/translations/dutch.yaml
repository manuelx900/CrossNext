STR_INTERCEPT_TITLE_0: "Huis 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. Ze houden je achter een vergrendelde deur te wachten. Een onderdeel van de berekenmachine is verdwenen. De ochtend intercepteer rustels in je jaszak. Buiten stoppen voetstappen."
STR_INTERCEPT_CHOICE_0_0: "Denk door de beschuldiging"
STR_INTERCEPT_CHOICE_0_1: "Wachten op de interviewer"
STR_INTERCEPT_CHOICE_0_2: "Zoek je jas"
STR_INTERCEPT_TITLE_1: "De beschuldiging"
STR_INTERCEPT_TEXT_1: "Ze vermoeden verraad. U oplost cijfers, kruiswoorden en schaakposities voor een leven. Deze kamer is een ander probleem: tegenover jezelf, en je geloofwaardigheid kan het eerste slachtoffer zijn."
STR_INTERCEPT_CHOICE_1_0: "Kies een strategie"
STR_INTERCEPT_CHOICE_1_1: "Luisteren naar wat ze weten"
STR_INTERCEPT_TITLE_2: "Harry komt"
STR_INTERCEPT_TEXT_2: "Harris komt binnen met een kopje thee en een bestand. Een rol ontbreekt van de Bombe. Uw naam stond op de takenlijst."
STR_INTERCEPT_CHOICE_2_0: "Drink de thee"
STR_INTERCEPT_CHOICE_2_1: "Laat de thee ongerept"
STR_INTERCEPT_CHOICE_2_2: "Reageer rustig"
STR_INTERCEPT_TITLE_3: "De component"
STR_INTERCEPT_TEXT_3: "Binnenin de doek van je jas ontmoeten je vingers koud metaal. Het onderdeel is er nog steeds. Hooper zei dat het nemen ervan de chantage zou stoppen."
STR_INTERCEPT_CHOICE_3_0: "Houd het verborgen"
STR_INTERCEPT_CHOICE_3_1: "Geef het aan Harris"
STR_INTERCEPT_TITLE_4: "Een winnend spel"
STR_INTERCEPT_TEXT_4: "Samenwerking kan je geloofwaardigheid behouden. Een overtuigende leugen zou tijd kunnen kopen. Escape zou een gesloten kamer inwisselen voor de bewakers buiten."
STR_INTERCEPT_CHOICE_4_0: "Samenwerken"
STR_INTERCEPT_CHOICE_4_1: "Een alibi bedenken"
STR_INTERCEPT_CHOICE_4_2: "Het raam bekijken"
STR_INTERCEPT_TITLE_5: "De thee"
STR_INTERCEPT_TEXT_5: "Harris merkt je stilte, maar zijn gezicht is al terug te trekken.Wanneer je de volgende keer je ogen opent, staat een ander paar schoenen aan de tafel."
STR_INTERCEPT_CHOICE_5_0: "Voelt alsof je slaapt"
STR_INTERCEPT_CHOICE_5_1: "Vergelijk de bezoeker"
STR_INTERCEPT_CHOICE_5_2: "Vraag om water"
STR_INTERCEPT_TITLE_6: "Een kleine afwijzing"
STR_INTERCEPT_TEXT_6: "U duwt de beker weg. Harris kijkt de beweging dichterbij dan het antwoord."
STR_INTERCEPT_CHOICE_6_0: "Vraag wat voor bewijs hij heeft"
STR_INTERCEPT_CHOICE_6_1: "Verwijzing Hooper"
STR_INTERCEPT_CHOICE_6_2: "Kijk naar het raam"
STR_INTERCEPT_TITLE_7: "De ontbrekende echte"
STR_INTERCEPT_TEXT_7: "Harris wil een direct antwoord.Heeft u het onderdeel genomen?U kunt hem vertellen wat er in uw jas zit, de druk uitleggen die Hooper heeft toegepast, of de beschuldiging elders opmerken."
STR_INTERCEPT_CHOICE_7_0: "Geef hem de component"
STR_INTERCEPT_CHOICE_7_1: "De chantage uitleggen"
STR_INTERCEPT_CHOICE_7_2: "beschuldigen Hooper"
STR_INTERCEPT_TITLE_8: "Metaal op tafel"
STR_INTERCEPT_TEXT_8: "De component ligt tussen jou. Harris controleert het zonder te ontspannen. Het teruggeven van gestolen apparatuur verklaart niet waarom het werd genomen."
STR_INTERCEPT_CHOICE_8_0: "Aanbod om bewijs te vinden"
STR_INTERCEPT_CHOICE_8_1: "Blijf staan en beantwoord vragen"
STR_INTERCEPT_TITLE_9: "Het alibi"
STR_INTERCEPT_TEXT_9: "U beschrijft een rustige avond op uw bureau. Harris opent het bestand. Een bewaker zag u de machine kamer verlaten. Uw uitgevonden account heeft nu een getuige tegen het."
STR_INTERCEPT_CHOICE_9_0: "Verdedig het verhaal"
STR_INTERCEPT_CHOICE_9_1: "De chantage toegeven"
STR_INTERCEPT_CHOICE_9_2: "Weigeren van verdere vragen"
STR_INTERCEPT_TITLE_10: "Het venster"
STR_INTERCEPT_TEXT_10: "Het raam is hoog en het glas is dik.Boven het leidt het pad langs een andere hut.Het breken ervan zou luid zijn; wachten hier heeft zijn eigen gevaren."
STR_INTERCEPT_CHOICE_10_0: "Breek het glas"
STR_INTERCEPT_CHOICE_10_1: "Onderzoek de weg buiten"
STR_INTERCEPT_CHOICE_10_2: "Terug naar het interview"
STR_INTERCEPT_TITLE_11: "Een andere bezoeker"
STR_INTERCEPT_TEXT_11: "Hooper is gekomen terwijl je onstabiel bent. Hij wil weten of Harris de component heeft."
STR_INTERCEPT_CHOICE_11_0: "Voelt alsof je slaapt"
STR_INTERCEPT_CHOICE_11_1: "Vraag een uitleg"
STR_INTERCEPT_CHOICE_11_2: "Vraag om water"
STR_INTERCEPT_TITLE_12: "Een waarschuwing"
STR_INTERCEPT_TEXT_12: "Je belt Harris voor de thee vasthoudt. hij keert terug, geïrriteerd. een beschuldiging over de beker zal iets nodig hebben dat hij kan testen."
STR_INTERCEPT_CHOICE_12_0: "Houd de beker als bewijs"
STR_INTERCEPT_CHOICE_12_1: "Beschuldigen Harris van vergiftiging"
STR_INTERCEPT_CHOICE_12_2: "Concentreer je op het echte"
STR_INTERCEPT_TITLE_13: "Hooper"
STR_INTERCEPT_TEXT_13: "Harris herkent de naam. Hooper is nuttig, goed verbonden en niet afwezig van de schilderij van gisterenavond ook."
STR_INTERCEPT_CHOICE_13_0: "Zoek iets te controleren"
STR_INTERCEPT_CHOICE_13_1: "Hooper heeft het gestolen"
STR_INTERCEPT_TITLE_14: "De Blackmail"
STR_INTERCEPT_TEXT_14: "Je beschrijft een jonge man, een vertrouwen verraden, en de eis die volgde. Harris luistert zonder je te helpen."
STR_INTERCEPT_CHOICE_14_0: "Geef Harris het volledige account"
STR_INTERCEPT_CHOICE_14_1: "Laat de namen achter"
STR_INTERCEPT_CHOICE_14_2: "Een manier om Hooper te vangen"
STR_INTERCEPT_TITLE_15: "Een makkelijke beschuldiging"
STR_INTERCEPT_TEXT_15: "Hooper, zegt u, moet verantwoordelijk zijn. Harris vraagt hoe je het weet. Er is een verschil tussen het oplossen van een probleem en het produceren van een getuige die het antwoord kan bewijzen."
STR_INTERCEPT_CHOICE_15_0: "Laat Harris de claim betwisten"
STR_INTERCEPT_CHOICE_15_1: "Probeer een privébericht te sturen naar Hooper"
STR_INTERCEPT_TITLE_16: "Een test sleutel"
STR_INTERCEPT_TEXT_16: "Een verhaal kan worden ontkend.Een document, een getuige of het ontbrekende onderdeel is moeilijker uit te leggen."
STR_INTERCEPT_CHOICE_16_0: "Bekijk de nabijgelegen hut"
STR_INTERCEPT_CHOICE_16_1: "Gebruik de ochtendinterceptie"
STR_INTERCEPT_CHOICE_16_2: "Vraag Hooper direct"
STR_INTERCEPT_TITLE_17: "Meer dan een terugkeer"
STR_INTERCEPT_TEXT_17: "De machine kan weer werken, maar Harris heeft nog steeds een beveiligingsinbreuk om uit te leggen."
STR_INTERCEPT_CHOICE_17_0: "Toon het bewijs"
STR_INTERCEPT_CHOICE_17_1: "Zoek naar bewijs"
STR_INTERCEPT_CHOICE_17_2: "Accepteer zijn oordeel"
STR_INTERCEPT_TITLE_18: "Een tegenstelling"
STR_INTERCEPT_TEXT_18: "Harris stelt je eerste antwoord naast je nieuwste.Ze kunnen niet beide waar zijn.Je kunt de leugen verlaten, of het interview laten eindigen op een tegenstelling."
STR_INTERCEPT_CHOICE_18_0: "Vertel de waarheid over chantage"
STR_INTERCEPT_CHOICE_18_1: "Blijf alles ontkennen"
STR_INTERCEPT_CHOICE_18_2: "Probeer te vertrekken"
STR_INTERCEPT_TITLE_19: "Stilte"
STR_INTERCEPT_TEXT_19: "Harris sluit het bestand.In deze kamer, stilte eindigt niet het onderzoek; het eindigt alleen je deel in het regisseren ervan."
STR_INTERCEPT_CHOICE_19_0: "Luister naar de beslissing"
STR_INTERCEPT_TITLE_20: "gebroken glas"
STR_INTERCEPT_TEXT_20: "De koude lucht en het geluid van een waakhondje komen samen."
STR_INTERCEPT_CHOICE_20_0: "Rennen voor de buitenste weg"
STR_INTERCEPT_CHOICE_20_1: "Laat een gecodeerde clue achter"
STR_INTERCEPT_CHOICE_20_2: "Blijf staan en uitleg"
STR_INTERCEPT_TITLE_21: "Tussen de hutten"
STR_INTERCEPT_TEXT_21: "Het pad is nat. Hoopers hut is dichtbij genoeg om vóór de volgende patrouille te bereiken, maar het open terrein erachter biedt een ander soort kans."
STR_INTERCEPT_CHOICE_21_0: "Probeer te ontsnappen aan de redenen"
STR_INTERCEPT_CHOICE_21_1: "Ga naar Hooper's hut"
STR_INTERCEPT_CHOICE_21_2: "Terug naar Harris"
STR_INTERCEPT_TITLE_22: "Een privé spel"
STR_INTERCEPT_TEXT_22: "Hooper bestudeert u. Op de tafel stelt hij met zijn vingers een denkbeeldige schaakpositie op. Een gecodeerd antwoord kan hem laten onthullen wat een directe beschuldiging nooit zou doen."
STR_INTERCEPT_CHOICE_22_0: "Antwoord met een schaakje"
STR_INTERCEPT_CHOICE_22_1: "Bedreigd met naam"
STR_INTERCEPT_CHOICE_22_2: "Spreek eerlijk"
STR_INTERCEPT_TITLE_23: "Gezicht op gezicht"
STR_INTERCEPT_TEXT_23: "Hooper vraagt wat je eigenlijk kunt bewijzen.Zijn vertrouwen vervaagt alleen als je details noemt die iemand buiten zijn plan niet zou moeten weten."
STR_INTERCEPT_CHOICE_23_0: "Vergelijk hem met bewijs"
STR_INTERCEPT_CHOICE_23_1: "Het aanbieden van de component als een handel"
STR_INTERCEPT_CHOICE_23_2: "bluffen"
STR_INTERCEPT_TITLE_24: "De cup"
STR_INTERCEPT_TEXT_24: "Hooper brengt water, maar reikt eerst naar de theekopje.Het houden van die beker kan nuttiger zijn dan het accepteren van iets anders dat hij biedt."
STR_INTERCEPT_CHOICE_24_0: "Houd de beker"
STR_INTERCEPT_CHOICE_24_1: "Controleer je jas opnieuw"
STR_INTERCEPT_TITLE_25: "Iets om te testen"
STR_INTERCEPT_TEXT_25: "Je houdt de beker vast en vraagt Harris om het te laten onderzoeken.Dit is eindelijk een beschuldiging met een voorwerp erbij gehecht."
STR_INTERCEPT_CHOICE_25_0: "Geef Harris de beker"
STR_INTERCEPT_CHOICE_25_1: "Confront Hooper met het"
STR_INTERCEPT_TITLE_26: "Het verkeerde doel"
STR_INTERCEPT_TEXT_26: "Je beschuldigt Harris zonder bewijs. hij ziet een verdachte die probeert de onderzoeker te discrediteren. wat er ook met de thee is gebeurd, je hebt het moeilijker gemaakt voor hem om je te geloven."
STR_INTERCEPT_CHOICE_26_0: "Het interview eindigt"
STR_INTERCEPT_TITLE_27: "De gehele rekening"
STR_INTERCEPT_TEXT_27: "U geeft de namen en beschrijft de vergadering. Harris stelt precieze vragen. Uw schaamte is echt, maar zo zijn de details die hij nu kan controleren."
STR_INTERCEPT_CHOICE_27_0: "Laat hem de rekening controleren"
STR_INTERCEPT_CHOICE_27_1: "Aanbod om Hooper te vinden"
STR_INTERCEPT_TITLE_28: "Een mislukte bluff"
STR_INTERCEPT_TEXT_28: "Harris heeft genoeg vertrouwde antwoorden gehoord. Hooper heeft het ook."
STR_INTERCEPT_CHOICE_28_0: "Blijf bij de claim"
STR_INTERCEPT_CHOICE_28_1: "Maak een wanhopige ontsnapping"
STR_INTERCEPT_CHOICE_28_2: "Erken wat er werkelijk is gebeurd"
STR_INTERCEPT_TITLE_29: "De interceptie"
STR_INTERCEPT_TEXT_29: "Het blad in je zak draagt meer dan gemommelde letters: zijn route door de hutten plaatst Hooper dicht bij de machine."
STR_INTERCEPT_CHOICE_29_0: "Een bericht voor Hooper coderen"
STR_INTERCEPT_CHOICE_29_1: "Toon de route naar Harris"
STR_INTERCEPT_TITLE_30: "De machine loopt"
STR_INTERCEPT_TEXT_30: "Harris heeft de component, en een spoor dat verder gaat dan je eerste angstige antwoorden.The Bombe hervat zijn werk.Je laat Hut 14 achter onder je eigen naam, met minder geheimen en een toekomst die nog te beantwoorden is."
STR_INTERCEPT_TITLE_31: "Onder vermoeden"
STR_INTERCEPT_TEXT_31: "Door de component terug te geven werd de machine gered van een vertraging. Het heeft uw positie niet gered. Harris beëindigt uw toegang tot de hutten terwijl het onderzoek doorgaat. U hebt het interview overleefd, maar hebt uw naam niet verwijderd."
STR_INTERCEPT_TITLE_32: "In bewaring"
STR_INTERCEPT_TEXT_32: "Contradicties, gebrek aan bewijs en een gestolen onderdeel zijn een zaak geworden die je niet meer kunt richten."
STR_INTERCEPT_TITLE_33: "De buitenste weg"
STR_INTERCEPT_TEXT_33: "De duisternis is nuttig, maar het terrein wordt bewaakt.Een gebroken raam heeft de patrouilles dichterbij gebracht dan je had gehoopt."
STR_INTERCEPT_CHOICE_33_0: "Over de open grond"
STR_INTERCEPT_CHOICE_33_1: "Blijf op de dienstpad"
STR_INTERCEPT_CHOICE_33_2: "Draai terug en kijk Harris aan"
STR_INTERCEPT_TITLE_34: "Hoopers hut"
STR_INTERCEPT_TEXT_34: "Het bureau is onbeheerd. Papers liggen onder een kruiswoord en de machine kamer verschijnt in een met potlood gepland schema."
STR_INTERCEPT_CHOICE_34_0: "Bekijk de papieren"
STR_INTERCEPT_CHOICE_34_1: "Wacht op Hooper"
STR_INTERCEPT_CHOICE_34_2: "Weg met Harris"
STR_INTERCEPT_TITLE_35: "Schaken probleem"
STR_INTERCEPT_TEXT_35: "Je geeft Hooper een positie die zijn situatie weerspiegelt: een beschermd stuk, een blootgestelde koning en een beweging die er veilig uitziet tot het antwoord."
STR_INTERCEPT_CHOICE_35_0: "Vraag hem om het plan toe te geven"
STR_INTERCEPT_CHOICE_35_1: "Stuur de toelating aan Harris"
STR_INTERCEPT_TITLE_36: "Zonder een masker"
STR_INTERCEPT_TEXT_36: "Je spreekt over de druk in plaats van te doen alsof het nooit bestond. Hooper antwoordt kort als een persoon in plaats van als een tegenstander."
STR_INTERCEPT_CHOICE_36_0: "Vraag een eerlijke afspraak"
STR_INTERCEPT_CHOICE_36_1: "Vraag hem om te bekennen"
STR_INTERCEPT_CHOICE_36_2: "Neem de rekening voor Harris"
STR_INTERCEPT_TITLE_37: "Hoopers toelating"
STR_INTERCEPT_TEXT_37: "Hooper legt voldoende uit om de chantage aan te sluiten op het ontbrekende onderdeel. Harris kan nu de apparatuur herstellen en het verhaal controleren."
STR_INTERCEPT_CHOICE_37_0: "Bring Harris de erkenning"
STR_INTERCEPT_CHOICE_37_1: "Laat Hooper gaan en vertrekken"
STR_INTERCEPT_TITLE_38: "De handel"
STR_INTERCEPT_TEXT_38: "Een deal zonder getuige of bewijs is een uitnodiging voor hem om zijn probleem op uw kosten op te lossen."
STR_INTERCEPT_CHOICE_38_0: "Hand over de component"
STR_INTERCEPT_CHOICE_38_1: "Vraag een getuige overeenkomst"
