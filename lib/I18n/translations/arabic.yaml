STR_CAR_INTRO: "الذنب والصدق مستقلان. كل حالة لها حل واحد بالضبط. المرتفعات هي سمات شخصية خيالية."
STR_CAR_HELP_TEXT: "كيف تحل قضية \n تقوم كل شخصية بتقديم بيان واحد. يقدم أعلى الشاشة الأرقام الدقيقة للمذنبين والتصريحات الكاذبة. ابحث عن مزيج يلبي كلا العددين. لكل قضية حل واحد. \n \n لا يصدق الذنب \n يمكن لشخصية بريئة أن تكذب، والمذنب يستطيع أن يقول الحقيقة. كذبتان تعنيان بالضبط أن بيانين كاملين كاذبان؛ والآخران صحيحان. علامات الحقيقة / الكذب تشير إلى البيان؛ المشتبه فيه يشير إلى الذنب. \n \n قراءة الأدلة \n \"أ أو ب فعل ذلك (أو كلاهما)\" تعني على الأقل شخص واحد اسمه مذنب. \"أ و ب فعلا ذلك\" يتطلب كلاهما. الكذب ينفي البيان بأكمله: كذب أو يعني أن أي منهما لم يفعل ذلك؛ كذب و يعني أن أحدهما على الأقل لم يفعل ذلك. \n \n \n \"كلاهما صادقان أو كلاهما يكذبان\" يقارن البيانات، وليس الذنب. \"واحد منهم يكذب تماماً\" يعني أن تصريحاتهم لها قيم حقيقة مختلفة. هذه الخرائط نفسها يمكن أن تكون صحيحة أو خاطئة. \n \n جيران على شاشة صغيرة \n الترتيب الدائري الأصلي هو الفهد، أ أو ب فعل ذلك (أو كليهما) يعني على الأقل شخص واحد اسمه مذنب. \"أ و ب فعلا ذلك\" يتطلب كلاهما. الكذب ينفي البيان بأكمله: كذب أو يعني أن أي منهما لم يفعل ذلك؛ كذب و يعني أن أحدهما على الأقل لم يفعل ذلك. \n \n \n \n تحليلك \n \n استخدم ? / الحقيقة / الكذب والمشتبه به تحت كل بيان لتسجيل الفرضيات. هذه هي ملاحظاتك، وليس الأدلة أو التحقق الآلي. الأسهم تظهر الشخصيات الأخرى. طريقة الصورة تظهر حتى ثلاثة في كل صفحة. \n \n إعداد اتهام \n اضغط على اتهام وانتخب بالضبط العدد المطلوب من المذنبين. فقط تأكيد اتهام خاطئ يستأنف القضية الحالية أو يفتح التالي بعد محاولة مغلقة. مع عدم وجود أي حياة متبقية، يتم الكشف عن الحل. \n الحملة وإعادة اللعب \n هناك 1,470 قضية. فتح القضية تستأنف المحاولة الحالية أو تفتح القضية التالية من البداية. هناك 1,470 قضية. داخل كل صعوبة، تقدم القضايا من مجرم واحد إلى اثنين، ثم من عدد أقل من الكاذبين إلى أكثر داخل كل مجموعة من المذنبين. يحتفظ المبتدئ بمجرم واحد. يأتي الاتهام الأصغر أولاً عندما تتطابق الحسابات. تبقى جميع القضايا متاحة. حل قضية مستنفدة سابقاً يرفعها إلى حلها. \n التقدم والأرواح يتم حفظها على بطاقة SD. المغادرة أو النوم أو إعادة تشغيل الجهاز لا يسترد الأرواح في المحاولة الحالية. الحفظ الفاشل يحجب النتيجة حتى تنجح المحاولة مجدداً. استعادة كل شيء يطلب التأكيد قبل محو تقدم مجرم."
