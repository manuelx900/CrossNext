STR_QUEST_CAM_JOURNEY_THANKS_2: "تطوي مارا صفحة مقروءة حديثًا وتضعها بجانب كتاب المد الخاص بها. قبل أن تعود إلى النافذة، تشكرك بصوت خشن بسبب الهواء المالح."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Iri تضع شريطًا من القماش الجاف بين صفحتين. \"هذا الشخص يمكنه السفر الآن.\" تحمل المجلد على صدرها قبل أن تحمله إلى الكتب الأخرى."
STR_QUEST_CAM_JOURNEY_THANKS_4: "يضع تارين حقيبته على الحجر ويستمع بينما تنتهي. ثم يكرر كلام المسافر، هذه المرة دون الحاجة إلى النظر إلى الصفحة."
STR_QUEST_CAM_JOURNEY_THANKS_5: "نادر يرسم شريطًا بين أصابعه، ويقرأ اسمًا كان من الصعب فهمه من قبل. يجعل لك مكانا بجانب النار ."
STR_QUEST_CAM_JOURNEY_THANKS_6: "يضع أورين الأداة التي كان يدورها في أصابعه جانباً. ويتحدث لبعض الوقت عن الشخص في القصة، ويسمح للساعة بأن تسير دون أن يسمع أحد."
STR_QUEST_CAM_JOURNEY_THANKS_7: "سيرا تنقل القصة بعيداً عن كومة الأوامر الملكية، فهي تطلب كرسياً آخر، ثم تستمع إلى السطور الأخيرة معك."
STR_QUEST_CAM_JOURNEY_THANKS_8: "النجمة تشير إلى صفحة بورقة نظيفة. إنها تشكرك بهدوء؛ وبعد قليل تسمعها تقرأ نفس المقطع بجانب النافورة."
STR_QUEST_CAM_JOURNEY_THANKS_9: "تصلك ملاحظة قصيرة مع مجموعة الصفحات التالية. قامت Liora بنسخ مقطع ساعدت في استعادته؛ كتبت في الهامش: \"لقد قرأنا هذه القصة معًا في المنزل\"."
STR_QUEST_CAM_JOURNEY_THANKS_10: "المذكرة لا يتجاوز طولها بضعة أسطر. لقد تركت ليورا مجالًا للرد، كما لو أنها تستطيع رؤيتك بالفعل جالسًا على الطرف الآخر من الطاولة."
