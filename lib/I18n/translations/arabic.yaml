STR_FLASHCARDS_HELP: "انسخ مجموعات Anki (.apkg /.colpkg أو .anki2 /.anki21) أو CSV /TSV/text أو مجلدات الدراسة المحولة إلى /FLASHCARDS. استخدم المجلدات الفرعية: ما يصل إلى 128 عنصرًا لكل منها. تقبل واردات\n\nالبطاقات النصية الأساسية والمعكوسة والبسيطة. الصوت وHTML المخصص غير مدعومين. قم بتحويل مجموعات الصور /CJK أولاً. تستخدم المراجعات غير المتصلة بالإنترنت FSRS. يؤدي الاستيراد إلى بدء جدول زمني جديد والاحتفاظ بالنسخ الأصلية."
