STR_CAR_GUIDE_SOLVE_COPY: "حل جريمة قتل من خلال الاستماع إلى الشخصيات والعثور على الجاني. تخبرك كل حالة بعدد الجناة والبيانات الكاذبة التي يجب العثور عليها."
STR_CAR_GUIDE_SINCERE: "الذنب والإخلاص"
STR_CAR_GUIDE_SINCERE_COPY: "بعض الشخصيات تقول الحقيقة والبعض الآخر يكذب. الكاذب ليس مذنبًا بالضرورة: فالشخصية البريئة يمكن أن تكذب أيضًا."
STR_CAR_GUIDE_EXAMPLE: "مثال"
STR_CAR_GUIDE_EXAMPLE_COPY: "مع مذنب واحد وكذبة واحدة، ابحث بالضبط عن شخصية مذنبة واحدة وبيان كاذب واحد. كل بيان آخر يجب أن يكون صحيحا."
STR_CAR_GUIDE_OR: "فعلها أ أو ب"
STR_CAR_GUIDE_OR_COPY: "عبارة \"آنا أو برونو فعلت ذلك\" تعني أن شخصًا واحدًا على الأقل مذنب. وإذا كان المتحدث يكذب، فلم يفعله أي منهما."
STR_CAR_GUIDE_AND: "A و B فعلوها"
STR_CAR_GUIDE_AND_COPY: "\"آنا وبرونو فعلوا ذلك\" يقول كلاهما مذنب. إذا كانت كذبة، واحد على الأقل بريء."
STR_CAR_GUIDE_COMPARE: "الإخلاص"
STR_CAR_GUIDE_COMPARE_COPY: "\"كلاهما صدق أو كذب كلاهما\" مقارنة بين أقوالهما وليس ذنبهما. تحقق مما إذا كانت كلا العبارتين صحيحتين أو كلاهما خطأ."
STR_CAR_GUIDE_NEIGHBOURS: "الجيران"
STR_CAR_GUIDE_NEIGHBOURS_COPY: "القرائن تسمي كلا الجيران مباشرة. تغيير الصفحات لا يغير العلاقة."
STR_CAR_GUIDE_RELIABLE: "حقائق موثوقة"
STR_CAR_GUIDE_RELIABLE_COPY: "الأسماء والأطوال والأنظمة الغذائية موثوقة. التصريحات يمكن أن تكذب. المرتفعات خيالية."
STR_CAR_GUIDE_HEIGHT: "الطول والنظام الغذائي"
STR_CAR_GUIDE_HEIGHT_COPY: "يمكن الاعتماد على طول الشخصية ونظامها الغذائي. \"الجاني أطول مني\" يقارن الجاني بالمتحدث. لا تعتبر الحيوانات آكلة اللحوم من الحيوانات آكلة اللحوم أو الحيوانات العاشبة."
STR_CAR_GUIDE_MARKS: "ملاحظاتك"
STR_CAR_GUIDE_MARKS_COPY: "اقرأ كل عبارة. استخدم الحقيقة والكذب والاشتباه لتسجيل أفكارك. هذه هي ملاحظاتك: اللعبة لم تتحقق منها بعد."
STR_CAR_GUIDE_NAV: "الملاحة"
STR_CAR_GUIDE_NAV_COPY: "يوجد 3 أحرف في كل صفحة في الصورة. الأسهم تظهر الآخرين."
STR_CAR_GUIDE_CONFIRM: "تأكيد الاتهام"
STR_CAR_GUIDE_CONFIRM_COPY: "عندما تتناسب أفكارك مع كل دليل وعدد الأكاذيب، اضغط على \"اتهام\". اختر الجناة وأكد إجابتك."
STR_CAR_GUIDE_LIVES: "حياة ونتيجة"
STR_CAR_GUIDE_LIVES_COPY: "المبتدئ /Normal : 2 حياة. /Expert المتقدم: 1. الاتهام الصحيح يحل القضية. مع عدم وجود حياة متبقية، شاهد الحل."
STR_CAR_GUIDE_CAMPAIGN: "الحملة"
STR_CAR_GUIDE_CAMPAIGN_COPY: "الحالة المفتوحة تواصل لعبتك. تتيح لك الحملة الاختيار من بين 1470 حالة. ابدأ بالمبتدئ أثناء التعلم."
STR_CAR_GUIDE_REPEAT: "إعادة وحفظ"
STR_CAR_GUIDE_REPEAT_COPY: "الحالة المتكررة تبدأ محاولة جديدة مع الحفاظ على النتيجة السابقة. يتم حفظ التقدم والأرواح على microSD."
