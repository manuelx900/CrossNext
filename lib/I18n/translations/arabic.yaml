STR_PET_GUIDE_HYGIENE: "قم بتنظيف حيوانك الأليف مجانًا للمساعدة في الوقاية من المرض. إذا كان مريضًا بالفعل، فامنحه علاجًا في الصحة."
STR_PET_GUIDE_READING: "اختر بيضة وربي حيوانك الأليف بالقراءة. أعطه الطعام والصحبة والراحة والتنظيف."
STR_PET_GUIDE_HOME: "اكسب الزينة عن طريق القراءة. وضعها أو إزالتها بحرية؛ يمكنك الاحتفاظ بكل كائن."
STR_PET_GUIDE_SUPPLIES: "تحصل على حصة من القراءة لمدة 5 و10 و15 و30 و60 و120 دقيقة يوميًا: ما يصل إلى 6 حصص. كل منها يزيد مقياس الشبع بمقدار 25 نقطة، حتى 100."
STR_PET_GUIDE_FEED: "تكسب علاجًا واحدًا عند 30 دقيقة من القراءة وآخر عند 120 دقيقة كل يوم. استخدمها في الصحة إذا مرض حيوانك الأليف."
STR_PET_GUIDE_GAMES: "أول 3 ألعاب كل يوم تحسن المزاج وتستهلك 20 طاقة. بعدها يمكنك التدريب مجانًا. اعتن برفيقك المريض أو الجائع أو المتعب أو النائم قبل اللعب."
STR_PET_GUIDE_HEALTH: "التنظيف مجاني ويعيد النظافة إلى 100. ولا يعالج المرض: لذلك، افتح الصحة واستخدم العلاج."
STR_PET_GUIDE_DIFFICULTY: "استرخاء ليس له موعد نهائي للعودة إلى القراءة. العادي يسمح بـ 7 أيام، والصعب 3 أيام، والأقصى 24 ساعة. إذا مر الموعد النهائي، يموت حيوانك الأليف. القراءة تبدأ الموقت مرة أخرى."
STR_PET_GUIDE_PROJECT: "اختر شيئًا واقرأه لمدة تصل إلى 60 دقيقة لتكسبه. تغيير المشاريع يبدأ من الصفر. يمكنك إزالة العناصر المملوكة دون فقدانها؛ إنهم موروثون."
