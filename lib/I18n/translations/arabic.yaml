STR_INTERCEPT_CHOICE_0_1: "انتظر المقابلة"
STR_INTERCEPT_CHOICE_0_2: "ابحث في معطفك"
STR_INTERCEPT_TITLE_1: "الاتهام"
STR_INTERCEPT_TEXT_1: "يشتبهون بالخيانة. أنت تحل الأرقام والكلمات المتقاطعة ومواقف الشطرنج من أجل لقمة العيش. هذه الغرفة مشكلة أخرى: تناقض نفسك، وقد تكون مصداقيتك هي الضحية الأولى."
STR_INTERCEPT_CHOICE_1_0: "اختر الإستراتيجية"
STR_INTERCEPT_CHOICE_1_1: "اسمع ما يعرفون"
STR_INTERCEPT_TITLE_2: "وصول هاريس"
STR_INTERCEPT_TEXT_2: "يدخل هاريس ومعه فنجان شاي وملف. بكرة مفقودة من Bombe. كان اسمك في قائمة المناوبة. يضع الكأس بجانبك ويسأل أين كنت الليلة الماضية."
STR_INTERCEPT_CHOICE_2_0: "اشرب الشاي"
STR_INTERCEPT_CHOICE_2_1: "اترك الشاي على حاله"
STR_INTERCEPT_CHOICE_2_2: "أجب بهدوء"
STR_INTERCEPT_TITLE_3: "المكون"
STR_INTERCEPT_TEXT_3: "داخل بطانة معطفك تلتقي أصابعك بالمعدن البارد. المكون لا يزال موجودا. قال هوبر إن أخذها سيوقف الابتزاز. الآن الباب المغلق له معنى مختلف."
STR_INTERCEPT_CHOICE_3_0: "خليها مخفية"
STR_INTERCEPT_CHOICE_3_1: "سلمها لهاريس"
STR_INTERCEPT_TITLE_4: "مسرحية رابحة"
STR_INTERCEPT_TEXT_4: "التعاون قد يحفظ مصداقيتك. الكذبة المقنعة يمكن أن تكسب الوقت. الهروب سوف يستبدل غرفة مغلقة بالحراس بالخارج. ولا يمكن التراجع عن أي من هذه التحركات."
STR_INTERCEPT_CHOICE_4_0: "التعاون"
STR_INTERCEPT_CHOICE_4_1: "اخترع عذر غياب"
STR_INTERCEPT_CHOICE_4_2: "افحص النافذة"
STR_INTERCEPT_TITLE_5: "الشاي"
STR_INTERCEPT_TEXT_5: "الغرفة تميل. يلاحظ هاريس صمتك، لكن وجهه ينحسر بالفعل. عندما تفتح عينيك بعد ذلك، ستجد زوجًا آخر من الأحذية يقف بجانب الطاولة."
STR_INTERCEPT_CHOICE_5_0: "تظاهر بالنوم"
STR_INTERCEPT_CHOICE_5_1: "مواجهة الزائر"
STR_INTERCEPT_CHOICE_5_2: "اطلب الماء"
STR_INTERCEPT_TITLE_6: "رفض صغير"
STR_INTERCEPT_TEXT_6: "تدفع الكأس بعيدًا. يراقب هاريس الحركة عن كثب أكثر من الإجابة. يسأل ما إذا كان هناك شخص آخر يجب أن يستجوبه."
STR_INTERCEPT_CHOICE_6_0: "اسأل عن الدليل الذي لديه"
STR_INTERCEPT_CHOICE_6_1: "منشن هوبر"
STR_INTERCEPT_CHOICE_6_2: "أنظر نحو النافذة"
STR_INTERCEPT_TITLE_7: "البكرة المفقودة"
STR_INTERCEPT_TEXT_7: "هاريس يريد إجابة مباشرة. هل أخذت المكون؟ يمكنك إخباره بما يوجد في معطفك، أو شرح الضغط الذي مارسه هوبر، أو محاولة توجيه الاتهام إلى مكان آخر."
STR_INTERCEPT_CHOICE_7_0: "أعطيه المكون"
STR_INTERCEPT_CHOICE_7_1: "شرح الابتزاز"
STR_INTERCEPT_CHOICE_7_2: "اتهم هوبر"
STR_INTERCEPT_TITLE_8: "معدن على الطاولة"
STR_INTERCEPT_TEXT_8: "المكون يقع بينكم. يتفقدها هاريس دون أن يسترخي. إعادة المعدات المسروقة لا تفسر سبب أخذها. يريد اسمًا وشيئًا أكثر موثوقية من كلمتك."
STR_INTERCEPT_CHOICE_8_0: "عرض العثور على الأدلة"
STR_INTERCEPT_CHOICE_8_1: "ابقوا وأجيبوا على الأسئلة"
STR_INTERCEPT_TITLE_9: "العذر"
STR_INTERCEPT_TEXT_9: "تصف أمسية هادئة على مكتبك. يفتح هاريس الملف. رآك أحد الحراس وأنت تغادر غرفة الآلة. حسابك المخترع لديه الآن شاهد ضده."
STR_INTERCEPT_CHOICE_9_0: "دافع عن القصة"
STR_INTERCEPT_CHOICE_9_1: "اعترف بالابتزاز"
STR_INTERCEPT_CHOICE_9_2: "ارفض المزيد من الأسئلة"
STR_INTERCEPT_TITLE_10: "النافذة"
STR_INTERCEPT_TEXT_10: "الشباك مرتفع والزجاج سميك. وبعد ذلك، يمر الطريق عبر كوخ آخر. كسرها سيكون بصوت عال. الانتظار هنا له مخاطره الخاصة."
STR_INTERCEPT_CHOICE_10_0: "كسر الزجاج"
STR_INTERCEPT_CHOICE_10_1: "دراسة المسار بالخارج"
STR_INTERCEPT_CHOICE_10_2: "العودة للمقابلة"
STR_INTERCEPT_TITLE_11: "زائر آخر"
STR_INTERCEPT_TEXT_11: "جاء هوبر وأنت غير مستقر. يريد أن يعرف ما إذا كان هاريس لديه المكون. ويبقي يد واحدة بالقرب من الباب."
STR_INTERCEPT_CHOICE_11_0: "تظاهر بالنوم"
STR_INTERCEPT_CHOICE_11_1: "أطلب توضيحاً"
STR_INTERCEPT_CHOICE_11_2: "اطلب الماء"
STR_INTERCEPT_TITLE_12: "تحذير"
STR_INTERCEPT_TEXT_12: "تتصل بهاريس قبل أن يترسخ الشاي. يعود غاضبا. الاتهام بشأن الكأس سيحتاج إلى شيء يمكنه اختباره."
STR_INTERCEPT_CHOICE_12_0: "احتفظ بالكوب كدليل"
STR_INTERCEPT_CHOICE_12_1: "اتهم هاريس بتسميمك"
STR_INTERCEPT_CHOICE_12_2: "ركز على البكرة"
STR_INTERCEPT_TITLE_13: "هوبر"
STR_INTERCEPT_TEXT_13: "هاريس يتعرف على الاسم. Hooper مفيد ومتصل بشكل جيد ولم يغيب عن قائمة الليلة الماضية أيضًا. الاعتراف ليس دليلا."
STR_INTERCEPT_CHOICE_13_0: "ابحث عن شيء يمكن التحقق منه"
STR_INTERCEPT_CHOICE_13_1: "أصر على أن هوبر سرقها"
STR_INTERCEPT_TITLE_14: "ابتزاز"
STR_INTERCEPT_TEXT_14: "تصف الشاب والثقة التي خانتها والمطلب الذي تبعها. هاريس يستمع دون مساعدتك. إن تسمية الشخص الذي نصب الفخ قد يؤدي أيضًا إلى كشف الشخص الذي تأمل في حمايته."
STR_INTERCEPT_CHOICE_14_0: "أعط هاريس الحساب كاملاً"
STR_INTERCEPT_CHOICE_14_1: "اترك الأسماء"
STR_INTERCEPT_CHOICE_14_2: "اقترح طريقة للقبض على هوبر"
STR_INTERCEPT_TITLE_15: "اتهام سهل"
STR_INTERCEPT_TEXT_15: "هوبر، كما تقول، يجب أن يكون مسؤولاً. يسأل هاريس كيف تعرف. هناك فرق بين حل المشكلة وإنتاج شاهد يمكنه إثبات الإجابة."
STR_INTERCEPT_CHOICE_15_0: "دع هاريس يطعن في المطالبة"
STR_INTERCEPT_CHOICE_15_1: "حاول إرسال رسالة خاصة إلى هوبر"
STR_INTERCEPT_TITLE_16: "دليل قابل للاختبار"
STR_INTERCEPT_TEXT_16: "قصة يمكن نكرانها. من الصعب شرح الوثيقة أو الشاهد أو العنصر المفقود. لديك القليل من الوقت لاختيار ما تريد متابعته."
STR_INTERCEPT_CHOICE_16_0: "تفقد الكوخ المجاور"
STR_INTERCEPT_CHOICE_16_1: "استخدم الاعتراض الصباحي"
STR_INTERCEPT_CHOICE_16_2: "سؤال هوبر مباشرة"
STR_INTERCEPT_TITLE_17: "أكثر من إرجاع"
STR_INTERCEPT_TEXT_17: "يمكن للآلة أن تعمل مرة أخرى، لكن لا يزال لدى هاريس خرق أمني يجب توضيحه. يقدم لك فرصة أخيرة لتحديد من نظمها."
STR_INTERCEPT_CHOICE_17_0: "أظهر الأدلة"
STR_INTERCEPT_CHOICE_17_1: "ابحث عن الدليل"
STR_INTERCEPT_CHOICE_17_2: "قبول حكمه"
STR_INTERCEPT_TITLE_18: "تناقض"
STR_INTERCEPT_TEXT_18: "يقوم Harris بتعيين إجابتك الأولى بجانب إجابتك الأخيرة. لا يمكن أن يكون كلاهما صحيحا. يمكنك التخلي عن الكذبة، أو ترك المقابلة تنتهي بالتناقض."
STR_INTERCEPT_CHOICE_18_0: "احكي الحقيقة عن الابتزاز"
STR_INTERCEPT_CHOICE_18_1: "استمر في إنكار كل شيء"
STR_INTERCEPT_CHOICE_18_2: "حاول الرحيل"
STR_INTERCEPT_TITLE_19: "الصمت"
STR_INTERCEPT_TEXT_19: "تطوي ذراعيك. يغلق هاريس الملف. في هذه الغرفة، الصمت لا ينهي التحقيق؛ فهو لا ينهي سوى دورك في توجيهه."
STR_INTERCEPT_CHOICE_19_0: "اسمع القرار"
STR_INTERCEPT_TITLE_20: "زجاج مكسور"
STR_INTERCEPT_TEXT_20: "الجزء يفسح المجال. يصل الهواء البارد وصوت صافرة الحارس معًا. هناك وقت لاتخاذ قرار واحد قبل أن يصل شخص ما إلى الباب."
STR_INTERCEPT_CHOICE_20_0: "الركض للمسار الخارجي"
STR_INTERCEPT_CHOICE_20_1: "اترك دليلاً مشفراً"
STR_INTERCEPT_CHOICE_20_2: "خليك واشرح"
STR_INTERCEPT_TITLE_21: "بين الأكواخ"
STR_INTERCEPT_TEXT_21: "الطريق مبلل. كوخ هوبر قريب بما يكفي للوصول إليه قبل الدورية التالية، لكن الأرض المفتوحة خلفه توفر نوعًا مختلفًا من الفرص."
STR_INTERCEPT_CHOICE_21_0: "حاول الهروب من الأرض"
STR_INTERCEPT_CHOICE_21_1: "ادخل إلى كوخ هوبر"
STR_INTERCEPT_CHOICE_21_2: "العودة إلى هاريس"
STR_INTERCEPT_TITLE_22: "لعبة خاصة"
STR_INTERCEPT_TEXT_22: "هوبر يدرسك. على الطاولة، يحدد موقعًا خياليًا للشطرنج بأصابعه. يمكن للإجابة المشفرة أن تجعله يكشف ما لن يكشفه الاتهام المباشر أبدًا."
STR_INTERCEPT_CHOICE_22_0: "أجب بدليل الشطرنج"
STR_INTERCEPT_CHOICE_22_1: "التهديد بتسميته"
STR_INTERCEPT_CHOICE_22_2: "تكلم بصدق"
STR_INTERCEPT_TITLE_23: "وجهاً لوجه"
STR_INTERCEPT_TEXT_23: "يسأل هوبر عما يمكنك إثباته بالفعل. تتعثر ثقته فقط عندما تذكر تفاصيل لا ينبغي أن يعرفها شخص خارج خطته."
STR_INTERCEPT_CHOICE_23_0: "واجهه بالدليل"
STR_INTERCEPT_CHOICE_23_1: "عرض المكون كتبادل"
STR_INTERCEPT_CHOICE_23_2: "بلاف"
STR_INTERCEPT_TITLE_24: "الكأس"
STR_INTERCEPT_TEXT_24: "هوبر يجلب الماء لكنه يصل إلى فنجان الشاي أولاً. قد يكون الاحتفاظ بهذا الكأس أكثر فائدة من قبول أي شيء آخر يقدمه."
STR_INTERCEPT_CHOICE_24_0: "احتفظ بالكوب"
STR_INTERCEPT_CHOICE_24_1: "افحص معطفك مرة أخرى"
STR_INTERCEPT_TITLE_25: "شيء للاختبار"
STR_INTERCEPT_TEXT_25: "تحتفظ بالكوب وتطلب من هاريس أن يفحصه. وهذا في النهاية ادعاء مرتبط به شيء. توفر محاولة هوبر لإزالته تفاصيل مفيدة ثانية."
STR_INTERCEPT_CHOICE_25_0: "أعط هاريس الكأس"
STR_INTERCEPT_CHOICE_25_1: "واجه هوبر بها"
STR_INTERCEPT_TITLE_26: "الهدف الخاطئ"
STR_INTERCEPT_TEXT_26: "تتهم هاريس بدون دليل. يرى مشتبهًا به يحاول تشويه سمعة المحقق. مهما حدث للشاي، فقد جعلت من الصعب عليه أن يصدقك."
STR_INTERCEPT_CHOICE_26_0: "تنتهي المقابلة"
STR_INTERCEPT_TITLE_27: "الحساب كاملا"
STR_INTERCEPT_TEXT_27: "تقوم بإعطاء الأسماء ووصف اللقاء. يطرح هاريس أسئلة دقيقة. إن إحراجك حقيقي، لكن التفاصيل التي يمكنه الآن التحقق منها كذلك."
STR_INTERCEPT_CHOICE_27_0: "خليه يوثق الحساب"
STR_INTERCEPT_CHOICE_27_1: "عرض للعثور على هوبر"
STR_INTERCEPT_TITLE_28: "خدعة فاشلة"
STR_INTERCEPT_TEXT_28: "لقد سمع هاريس ما يكفي من الإجابات الواثقة. هوبر لديه أيضا. لا يوفر أي منهما حقيقة أن قصتك مفقودة."
STR_INTERCEPT_CHOICE_28_0: "الثبات على المطالبة"
STR_INTERCEPT_CHOICE_28_1: "قم بالهروب اليائس"
STR_INTERCEPT_CHOICE_28_2: "اعترف بما حدث بالفعل"
STR_INTERCEPT_TITLE_29: "المعترض"
STR_INTERCEPT_TEXT_29: "الورقة التي في جيبك تحمل أكثر من مجرد حروف مختلطة: فطريقها عبر الأكواخ يضع هوبر بالقرب من الآلة. قد يؤدي الدليل الموجز إلى جعل الشخص المناسب يبحث في المكان المناسب."
STR_INTERCEPT_CHOICE_29_0: "تشفير رسالة لهوبر"
STR_INTERCEPT_CHOICE_29_1: "أظهر الطريق إلى هاريس"
STR_INTERCEPT_TITLE_30: "الآلة تعمل"
STR_INTERCEPT_TEXT_30: "لدى هاريس المكون، والطريق الذي يقودك إلى ما هو أبعد من إجاباتك المخيفة الأولى. تستأنف Bombe عملها. ستترك الكوخ 14 باسمك، مع عدد أقل من الأسرار ومستقبل لا يزال يتعين عليك الإجابة عليه."
STR_INTERCEPT_TITLE_31: "تحت الشك"
STR_INTERCEPT_TEXT_31: "إرجاع المكون أنقذ الآلة من التأخير. ولم يحفظ موقفك. ينهي هاريس وصولك إلى الأكواخ بينما يستمر التحقيق. لقد نجوت من المقابلة، لكنك لم تبرئ اسمك."
STR_INTERCEPT_TITLE_32: "في الحجز"
STR_INTERCEPT_TEXT_32: "الباب يفتح للحارس وليس لك. أصبحت التناقضات والأدلة المفقودة والعنصر المسروق قضية لم يعد بإمكانك توجيهها. تنتهي هذه المحاولة هنا."
STR_INTERCEPT_TITLE_33: "المسار الخارجي"
STR_INTERCEPT_TEXT_33: "تترك الأكواخ خلفك. الظلام مفيد، لكن الأرض مراقبه. نافذة مكسورة جعلت الدوريات أقرب مما كنت تأمل."
STR_INTERCEPT_CHOICE_33_0: "عبور الأرض المفتوحة"
STR_INTERCEPT_CHOICE_33_1: "التزم بمسار الخدمة"
STR_INTERCEPT_CHOICE_33_2: "ارجع للخلف وواجه هاريس"
STR_INTERCEPT_TITLE_34: "كوخ هوبر"
STR_INTERCEPT_TEXT_34: "المكتب غير مراقب. توجد الأوراق أسفل الكلمات المتقاطعة، وتظهر غرفة الآلة في جدول زمني مكتوب بالقلم الرصاص. تقترب الخطى على طول الألواح بالخارج."
STR_INTERCEPT_CHOICE_34_0: "افحص الأوراق"
STR_INTERCEPT_CHOICE_34_1: "انتظر هوبر"
STR_INTERCEPT_CHOICE_34_2: "الرحيل إلى هاريس"
STR_INTERCEPT_TITLE_35: "مشكلة في الشطرنج"
STR_INTERCEPT_TEXT_35: "أنت تمنح هوبر وضعية تعكس ورطته: قطعة محمية، وملك مكشوف، وحركة تبدو آمنة حتى الرد. إنه يفهم التحذير. كلماته التالية توفر الاتصال الذي تحتاجه."
STR_INTERCEPT_CHOICE_35_0: "اطلب منه الاعتراف بالخطة"
STR_INTERCEPT_CHOICE_35_1: "أرسل القبول لهاريس"
STR_INTERCEPT_TITLE_36: "بدون كمامة"
STR_INTERCEPT_TEXT_36: "تتحدث عن الضغط بدلاً من التظاهر بأنه لم يكن موجوداً أبداً. يجيب هوبر لفترة وجيزة كشخص وليس كمعارض. يمكن استخدام هذا الافتتاح للتجارة، أو الفخ."
STR_INTERCEPT_CHOICE_36_0: "اطلب الترتيب الصادق"
STR_INTERCEPT_CHOICE_36_1: "اطلب منه الاعتراف"
STR_INTERCEPT_CHOICE_36_2: "خذ الحساب لهاريس"
STR_INTERCEPT_TITLE_37: "قبول هوبر"
STR_INTERCEPT_TEXT_37: "هوبر يشرح ما يكفي لربط الابتزاز بالمكون المفقود. يستطيع هاريس الآن استعادة المعدات والتحقق من القصة. يجب أن تقرر ما إذا كنت تريد إنهاء التحقيق أو ترك هوبر يختفي."
STR_INTERCEPT_CHOICE_37_0: "أحضر هاريس القبول"
STR_INTERCEPT_CHOICE_37_1: "دع هوبر يذهب ويغادر"
STR_INTERCEPT_TITLE_38: "التجارة"
STR_INTERCEPT_TEXT_38: "تضع آخر قطعة من الرافعة المالية في متناول هوبر. فالصفقة بدون شاهد أو دليل هي دعوة له لحل مشكلته على حسابك."
STR_INTERCEPT_CHOICE_38_0: "تسليم المكون"
STR_INTERCEPT_CHOICE_38_1: "أطالب بإتفاقية مشهودة"
STR_INTERCEPT_CHOICE_38_2: "سحب العرض"
STR_INTERCEPT_TITLE_39: "هاريس يستمع"
STR_INTERCEPT_TEXT_39: "يمكن التأكد من التفاصيل. يسأل هاريس أين يوجد المكون الآن. يعد مسح حسابك وتشغيل الجهاز من المشكلات المرتبطة، لكنهما ليسا نفس المشكلة."
STR_INTERCEPT_CHOICE_39_0: "أعد ما في معطفك"
STR_INTERCEPT_CHOICE_39_1: "المساعدة في استعادة المكون"
STR_INTERCEPT_CHOICE_39_2: "توقف عن الرد الآن"
STR_INTERCEPT_TITLE_40: "ما وراء السياج"
STR_INTERCEPT_TEXT_40: "الأكواخ تختفي خلفك، الحرية خارج الحديقة ليست نفس البراءة، والآلة هي مشكلة ملحة لشخص آخر الآن، لقد هربت، القصة لا تزال غير منتهية."
STR_INTERCEPT_TITLE_41: "الخطأ الأخير"
STR_INTERCEPT_TEXT_41: "تصل إليك الدورية قبل انتهاء الأرض المفتوحة، أو ينهار وعد هوبر عندما لا يكون ذلك مفيدًا له. لقد نفدت التحركات الآمنة. يمكن تجربة القصة مرة أخرى من البداية."
STR_INTERCEPT_TITLE_42: "الأوراق"
STR_INTERCEPT_TEXT_42: "الجدول الزمني يضع هوبر في المكان الذي ذكرت قصتك أنه كان فيه. وبجانبها الملاحظة التي جذبتك أولاً إلى الفخ. المجموعة محددة بما يكفي ليتحقق منها هاريس."
STR_INTERCEPT_CHOICE_42_0: "خذ الأوراق إلى هاريس"
STR_INTERCEPT_CHOICE_42_1: "انتظر وواجه هوبر"
STR_INTERCEPT_TITLE_43: "ترتيب أخير"
STR_INTERCEPT_TEXT_43: "يعرض هوبر إعادة الجزء. إن الثقة به ستزيل مشكلة فورية واحدة؛ إن جعل هاريس شاهدًا سيجعل من الصعب إنشاء شاهد آخر."
