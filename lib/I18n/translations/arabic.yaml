STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "وحوش الملك"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "أرسل ملك النسيان وحوشه إلى جميع أنحاء العالم. لقد دمروا كل كتاب وجدوه وهاجموا أي شخص حاول إيقافهم. وبدأت المكتبات تختفي، وتوقف الناس عن القراءة."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "قوة القراءة"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "في أحد الأيام، بينما كنت تقرأ بالقرب من قريتك، ظهر وحش. تحاول الهروب، ولكن يحدث شيء مفاجئ: كلما قرأت أكثر، أصبح أضعف. تدرك أن القراءة هي الطريقة الوحيدة لمحاربة سحر الملك."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "مهمتك"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "لقد شرعت في إيقاف الملك. وفي طريقك إلى قلعته يجب عليك عبور الغابات والمدن والجبال وغيرها من الأماكن المليئة بالأعداء. كل وحش تهزمه يجعلك أقرب قليلاً. استمر في القراءة، واهزم حراسه وتمكن من الوصول إليه قبل أن يدمر كل كتاب في العالم."
