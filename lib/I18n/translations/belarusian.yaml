STR_QUEST_CAM_DECOR_NAME_0: "Лясная фея"
STR_QUEST_CAM_DECOR_TEXT_0: "Ты вызваліў фею ад маўклівых каранёў. Яна прынясе ў ваш дом маленькі цуд."
