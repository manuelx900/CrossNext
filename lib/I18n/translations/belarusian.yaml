STR_DRAUGHTS_HELP: "Дакраніцеся да часткі, а потым да месца прызначэння. Патрабуюцца захопы; выканаць кожны скачок. Міжнародны: 10x10, 20 фігур, захопы назад, лятаючыя каралі і максімальны захоп. Бразілец: тыя ж правілы захопу на 8x8 з 12 фігурамі. Іспанская: мужчыны захопліваюць наперад, лятучыя каралі; вазьміце большасць фігур, потым большасць каралёў. Англійская: кароткія каралі, захоп нападаючым, любы поўны ланцужок захопу. Дасягненне кароннага шэрагу заканчвае ангельскі або іспанскі ход. Выберыце правілы, суперніка і складанасць у наладах. Лакальны рэжым дазваляе двум людзям выкарыстоўваць рыдэр. Змены правілаў прымяняюцца да новай гульні."
