STR_PET_GUIDE_HYGIENE: "Чысціце свайго гадаванца бясплатна, каб прадухіліць хваробу. Калі яно ўжо захварэла, дайце яму лекі ў Здароўі."
STR_PET_GUIDE_READING: "Выбірайце яйка і выхоўвайце гадаванца чытаннем. Дайце яму ежу, кампанію, адпачынак і ўборку."
STR_PET_GUIDE_HOME: "Зарабляйце ўпрыгожванні, чытаючы. Размяшчайце або здымайце іх свабодна; вы захоўваеце кожны прадмет."
STR_PET_GUIDE_SUPPLIES: "Вы зарабляеце порцыю за 5, 10, 15, 30, 60 і 120 хвілін чытання ў дзень: да 6 порцый. Кожны павялічвае паказчык сытасці на 25 пунктаў, да 100."
STR_PET_GUIDE_FEED: "Вы зарабляеце адзін лек за 30 хвілін чытання і другі за 120 хвілін кожны дзень. Выкарыстоўвайце іх у Здароўе, калі ваш гадаванец захварэе."
STR_PET_GUIDE_GAMES: "Першыя 3 гульні штодня паляпшаюць настрой і расходуюць 20 энергіі. Потым можна трэніравацца бясплатна. Перад гульнёй паклапаціся пра хворага, галоднага, стомленага або соннага гадаванца."
STR_PET_GUIDE_HEALTH: "Уборка бясплатная і аднаўляе гігіену да 100. Яна не лечыць хваробу: для гэтага адкрыйце Здароўе і скарыстайцеся сродкам."
STR_PET_GUIDE_DIFFICULTY: "Relaxed не мае тэрміну вяртання да чытання. Normal дазваляе 7 дзён, Hard 3 дні і Extreme 24 гадзіны. Калі тэрмін праходзіць, ваш гадаванец памрэ. Чытанне зноў запускае таймер."
STR_PET_GUIDE_PROJECT: "Выберыце аб'ект і чытайце да 60 хвілін, каб зарабіць яго. Змена праектаў пачынаецца з нуля. Вы можаце выдаляць аб'екты, якія належаць вам, не губляючы іх; яны перадаюцца па спадчыне."
