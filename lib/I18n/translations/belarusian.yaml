STR_PET_STORY_TEXT_0: "Вы скончылі раздзел. Побач з вашым таварышам прарасло малюсенькае зерне. Вы даеце яму месца каля акна."
STR_PET_STORY_1: "Чорны дзень"
STR_PET_STORY_TEXT_1: "Дождж стукае ў акно, пакуль вы чытаеце. Ваш спадарожнік згортваецца побач. Нейкі час увесь пакой здаецца прытулкам."
STR_PET_STORY_2: "Наведвальнік"
STR_PET_STORY_TEXT_2: "Ля акна прылятае птушка. Ваш спадарожнік ціха назірае, пакуль ён не паляціць. Вы адзначаеце сваю старонку і ўсміхаецеся."
STR_PET_STORY_3: "Папяровы караблік"
