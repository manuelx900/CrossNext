STR_INTERCEPT_TITLE_0: "ХАТЫНА 14"
STR_INTERCEPT_TEXT_0: "Блетчлі-парк, 1942 г. Яны чакаюць вас за зачыненымі дзвярыма. Кампанент з вылічальнай машыны знік. Ранішні перахоп шамаціць у кішэні паліто. Звонку крокі спыняюцца."
STR_INTERCEPT_CHOICE_0_0: "Прадумайце абвінавачанне"
STR_INTERCEPT_CHOICE_0_1: "Дачакайцеся інтэрв'юера"
STR_INTERCEPT_CHOICE_0_2: "Абшукайце сваё паліто"
STR_INTERCEPT_TITLE_1: "АБВІНАЎЧАННЕ"
STR_INTERCEPT_TEXT_1: "Падазраюць у здрадзе. Вы зарабляеце на жыццё разгадваннем фігур, крыжаванак і шахматных пазіцый. Гэты пакой - яшчэ адна праблема: супярэчыце самі сабе, і ваш аўтарытэт можа стаць першай ахвярай."
STR_INTERCEPT_CHOICE_1_0: "Выберыце стратэгію"
STR_INTERCEPT_CHOICE_1_1: "Паслухайце, што яны ведаюць"
STR_INTERCEPT_TITLE_2: "ПРЫБЫВАЕ ГАРЫС"
STR_INTERCEPT_TEXT_2: "Уваходзіць Харыс з кубкам гарбаты і напільнікам. У Bombe адсутнічае шпулька. Ваша прозвішча было ў спісе дзяжурных. Ён ставіць кубак побач з вамі і пытаецца, дзе вы былі мінулай ноччу."
STR_INTERCEPT_CHOICE_2_0: "Пі чай"
STR_INTERCEPT_CHOICE_2_1: "Чай не чапаць"
STR_INTERCEPT_CHOICE_2_2: "Адказвайце спакойна"
STR_INTERCEPT_TITLE_3: "КАМПАНЕНТ"
STR_INTERCEPT_TEXT_3: "Унутры падкладкі паліто твае пальцы сустракаюцца з халодным металам. Кампанент усё яшчэ ёсць. Хупер сказаў, што ўзяць яго спыніць шантаж. Цяпер зачыненыя дзверы маюць іншае значэнне."
STR_INTERCEPT_CHOICE_3_0: "Захоўвайце гэта"
STR_INTERCEPT_CHOICE_3_1: "Перадайце гэта Харысу"
STR_INTERCEPT_TITLE_4: "ПЕРАМОГА"
STR_INTERCEPT_TEXT_4: "Супрацоўніцтва можа захаваць ваш аўтарытэт. Пераканаўчая хлусня можа выйграць час. Escape абмяняў бы зачынены пакой на ахоўнікаў звонку. Ні адзін з гэтых крокаў нельга адмяніць."
STR_INTERCEPT_CHOICE_4_0: "Супрацоўнічаць"
STR_INTERCEPT_CHOICE_4_1: "Прыдумайце алібі"
STR_INTERCEPT_CHOICE_4_2: "Агледзіце акно"
STR_INTERCEPT_TITLE_5: "ЧАЙ"
STR_INTERCEPT_TEXT_5: "Пакой нахіляецца. Харыс заўважае ваша маўчанне, але яго твар ужо адыходзіць. Калі вы ў наступны раз адкрываеце вочы, ля стала стаіць іншая пара абутку."
STR_INTERCEPT_CHOICE_5_0: "Прыкінься, што спіш"
STR_INTERCEPT_CHOICE_5_1: "Супрацьстаяць наведвальніку"
STR_INTERCEPT_CHOICE_5_2: "Папрасіце вады"
STR_INTERCEPT_TITLE_6: "НЕВЯЛІКАЯ АДМОВА"
STR_INTERCEPT_TEXT_6: "Вы адштурхваеце кубак. Харыс назірае за рухам больш уважліва, чым за адказам. Пытаецца, ці не варта яшчэ каго дапытваць."
STR_INTERCEPT_CHOICE_6_0: "Спытайце, якія ў яго ёсць доказы"
STR_INTERCEPT_CHOICE_6_1: "Згадайце Хупера"
STR_INTERCEPT_CHOICE_6_2: "Паглядзіце ў акно"
STR_INTERCEPT_TITLE_7: "ЗНІКНУЛАЯ КАТУШКА"
STR_INTERCEPT_TEXT_7: "Харыс хоча атрымаць прамы адказ. Вы ўзялі кампанент? Вы можаце сказаць яму, што знаходзіцца ў вашым паліто, растлумачыць, які ціск аказаў Хупер, або паспрабаваць скіраваць абвінавачванне ў іншым месцы."
STR_INTERCEPT_CHOICE_7_0: "Дайце яму кампанент"
STR_INTERCEPT_CHOICE_7_1: "Растлумачце шантаж"
STR_INTERCEPT_CHOICE_7_2: "Абвінаваціць Хупера"
STR_INTERCEPT_TITLE_8: "МЕТАЛ НА СТАЛЕ"
STR_INTERCEPT_TEXT_8: "Кампанент знаходзіцца паміж вамі. Харыс правярае, не расслабляючыся. Вяртанне скрадзенага абсталявання не тлумачыць, чаму яго забралі. Ён хоча імя і чагосьці больш надзейнага, чым ваша слова."
STR_INTERCEPT_CHOICE_8_0: "Прапануйце знайсці доказы"
STR_INTERCEPT_CHOICE_8_1: "Заставайцеся і адказвайце на пытанні"
STR_INTERCEPT_TITLE_9: "АЛІБІ"
STR_INTERCEPT_TEXT_9: "Вы апісваеце ціхі вечар за сваім сталом. Харыс адкрывае файл. Ахоўнік бачыў, як вы выходзілі з машыннага аддзялення. Ваш прыдуманы рахунак цяпер мае сведку супраць яго."
STR_INTERCEPT_CHOICE_9_0: "Абарані гісторыю"
STR_INTERCEPT_CHOICE_9_1: "Прызнацца ў шантажы"
STR_INTERCEPT_CHOICE_9_2: "Адмоўцеся ад далейшых пытанняў"
STR_INTERCEPT_TITLE_10: "АКНО"
STR_INTERCEPT_TEXT_10: "Акно высокае, шкло тоўстае. За ім сцяжынка вядзе міма яшчэ адной хаціны. Парушаючы гэта было б гучна; чаканне тут мае свае ўласныя небяспекі."
STR_INTERCEPT_CHOICE_10_0: "Разбіць шкло"
STR_INTERCEPT_CHOICE_10_1: "Вывучыце шлях звонку"
STR_INTERCEPT_CHOICE_10_2: "Вярнуцца да інтэрв'ю"
STR_INTERCEPT_TITLE_11: "ЯШЧЭ АДЗЕГОДНІК"
STR_INTERCEPT_TEXT_11: "Хупер прыйшоў, пакуль вы хісткія. Ён хоча ведаць, ці ёсць у Харыса кампанент. Ён трымае адну руку каля дзвярэй."
STR_INTERCEPT_CHOICE_11_0: "Прыкінься, што спіш"
STR_INTERCEPT_CHOICE_11_1: "Патрабуйце тлумачэнняў"
STR_INTERCEPT_CHOICE_11_2: "Папрасіце вады"
STR_INTERCEPT_TITLE_12: "ПАПЯРЭДЖАННЕ"
STR_INTERCEPT_TEXT_12: "Вы клічаце Харыса да таго, як гарбата набярэцца. Ён вяртаецца, раздражнёны. Для абвінавачання наконт кубка спатрэбіцца нешта, што ён можа праверыць."
STR_INTERCEPT_CHOICE_12_0: "Захавайце кубак як доказ"
STR_INTERCEPT_CHOICE_12_1: "Абвінаваціць Харыса ў атручванні"
STR_INTERCEPT_CHOICE_12_2: "Засяродзьцеся на барабане"
STR_INTERCEPT_TITLE_13: "ХУПЕР"
STR_INTERCEPT_TEXT_13: "Харыс пазнае імя. Хупер карысны, мае добрыя сувязі, і яго таксама не было ў спісе мінулай ночы. Прызнанне - гэта не доказ."
STR_INTERCEPT_CHOICE_13_0: "Знайдзіце нешта, што можна праверыць"
STR_INTERCEPT_CHOICE_13_1: "Настойвайце, што Хупер скраў яго"
STR_INTERCEPT_TITLE_14: "ШАНТАЖ"
STR_INTERCEPT_TEXT_14: "Вы апісваеце маладога чалавека, падмануты давер і патрабаванне, якое вынікае з гэтага. Харыс слухае, не дапамагаючы вам. Назва чалавека, які паставіў пастку, таксама можа выкрыць чалавека, якога вы спадзяваліся абараніць."
STR_INTERCEPT_CHOICE_14_0: "Дайце Харысу поўную інфармацыю"
STR_INTERCEPT_CHOICE_14_1: "Пакіньце імёны"
STR_INTERCEPT_CHOICE_14_2: "Прапануй спосаб злавіць Хупера"
STR_INTERCEPT_TITLE_15: "ЛЕГКАЕ АБВІНАЎЧАННЕ"
STR_INTERCEPT_TEXT_15: "Хупер, кажаце вы, павінен несці адказнасць. Харыс пытаецца, адкуль ты ведаеш. Ёсць розніца паміж рашэннем праблемы і прапанаваннем сведкі, які можа пацвердзіць адказ."
STR_INTERCEPT_CHOICE_15_0: "Хай Харыс аспрэчыць прэтэнзію"
STR_INTERCEPT_CHOICE_15_1: "Паспрабуйце асабістае паведамленне Хуперу"
STR_INTERCEPT_TITLE_16: "ПРАВЕРНАЯ ПАДСКАЗКА"
STR_INTERCEPT_TEXT_16: "Гісторыю можна адмовіць. Дакумент, сведка або адсутны кампанент цяжэй растлумачыць. У вас ёсць трохі часу, каб выбраць, чым заняцца."
STR_INTERCEPT_CHOICE_16_0: "Агледзіце суседнюю хаціну"
STR_INTERCEPT_CHOICE_16_1: "Выкарыстоўвайце ранішні перахоп"
STR_INTERCEPT_CHOICE_16_2: "Задайце пытанне Хуперу непасрэдна"
STR_INTERCEPT_TITLE_17: "БОЛЬШ, ЧЫМ ВЯРТАННЕ"
STR_INTERCEPT_TEXT_17: "Машына можа зноў працаваць, але ў Харыса ўсё яшчэ ёсць пралом у бяспецы. Ён прапануе вам апошнюю магчымасць высветліць, хто гэта арганізаваў."
STR_INTERCEPT_CHOICE_17_0: "Пакажыце доказы"
STR_INTERCEPT_CHOICE_17_1: "Шукайце доказ"
STR_INTERCEPT_CHOICE_17_2: "Прыміце яго меркаванне"
STR_INTERCEPT_TITLE_18: "СУПЕРЭЧНАСЦЬ"
STR_INTERCEPT_TEXT_18: "Харыс усталёўвае ваш першы адказ побач з вашым апошнім. Абодва яны не могуць быць праўдай. Вы можаце адмовіцца ад хлусні або дазволіць інтэрв'ю скончыцца на супярэчнасці."
STR_INTERCEPT_CHOICE_18_0: "Скажы праўду пра шантаж"
STR_INTERCEPT_CHOICE_18_1: "Працягвай усё адмаўляць"
STR_INTERCEPT_CHOICE_18_2: "Паспрабуйце сысці"
STR_INTERCEPT_TITLE_19: "ЦІШЫНЯ"
STR_INTERCEPT_TEXT_19: "Вы склалі рукі. Харыс закрывае файл. У гэтым пакоі цішыня не заканчвае расследаванне; гэта толькі завяршае вашу ролю ў кіраванні ім."
STR_INTERCEPT_CHOICE_19_0: "Паслухайце рашэнне"
STR_INTERCEPT_TITLE_20: "БІТАЕ ШКЛО"
STR_INTERCEPT_TEXT_20: "Панэль саступае. Халоднае паветра і гук ахоўнага свістка прылятаюць разам. Ёсць час для аднаго рашэння, перш чым хтосьці дасягне дзвярэй."
STR_INTERCEPT_CHOICE_20_0: "Бяжы па вонкавым шляху"
STR_INTERCEPT_CHOICE_20_1: "Пакіньце закадаваную падказку"
STR_INTERCEPT_CHOICE_20_2: "Застанься і растлумач"
STR_INTERCEPT_TITLE_21: "МІЖ ХАТЫНАМІ"
STR_INTERCEPT_TEXT_21: "Сцежка мокрая. Хаціна Хупера знаходзіцца дастаткова блізка, каб дабрацца да наступнага патрулявання, але адкрытая тэрыторыя за ёй прапануе зусім іншы шанец."
STR_INTERCEPT_CHOICE_21_0: "Паспрабуйце збегчы з тэрыторыі"
STR_INTERCEPT_CHOICE_21_1: "Ідзіце ў хаціну Хупера"
STR_INTERCEPT_CHOICE_21_2: "Вярнуцца да Харыса"
STR_INTERCEPT_TITLE_22: "ПРЫВАТНАЯ ГУЛЬНЯ"
STR_INTERCEPT_TEXT_22: "Хупер вывучае цябе. На стале ён выстаўляе пальцамі ўяўную шахматную пазіцыю. Зашыфраваны адказ мог бы прымусіць яго раскрыць тое, чаго ніколі не зробіць прамое абвінавачванне."
STR_INTERCEPT_CHOICE_22_0: "Адкажыце з дапамогай шахматнай падказкі"
STR_INTERCEPT_CHOICE_22_1: "Пагражаюць назваць яго імя"
STR_INTERCEPT_CHOICE_22_2: "Гаварыце шчыра"
STR_INTERCEPT_TITLE_23: "ТВАР У ТВАР"
STR_INTERCEPT_TEXT_23: "Хупер пытаецца, што вы можаце даказаць. Яго ўпэўненасць хістаецца толькі тады, калі вы згадваеце дэталі, якія хто-небудзь па-за яго планам не павінен ведаць."
STR_INTERCEPT_CHOICE_23_0: "Дайце яму доказы"
STR_INTERCEPT_CHOICE_23_1: "Прапануйце кампанент у абмен"
STR_INTERCEPT_CHOICE_23_2: "Блеф"
STR_INTERCEPT_TITLE_24: "КУБАК"
STR_INTERCEPT_TEXT_24: "Хупер прыносіць ваду, але першым цягнецца да кубка. Захаваць гэты кубак можа быць больш карысна, чым прыняць што-небудзь яшчэ, што ён прапануе."
STR_INTERCEPT_CHOICE_24_0: "Трымайце кубак"
STR_INTERCEPT_CHOICE_24_1: "Яшчэ раз праверце сваё паліто"
STR_INTERCEPT_TITLE_25: "НЕШТА ДЛЯ СПЕЦЫРАВАННЯ"
STR_INTERCEPT_TEXT_25: "Вы пакідаеце кубак і просіце Харыса праверыць яго. Гэта, нарэшце, абвінавачванне з аб'ектам, прымацаваным да яго. Спроба Хупера выдаліць яго дае яшчэ адну карысную дэталь."
STR_INTERCEPT_CHOICE_25_0: "Дайце Харысу кубак"
STR_INTERCEPT_CHOICE_25_1: "Супрацьстаяць Хуперу з гэтым"
STR_INTERCEPT_TITLE_26: "НЯПРАВІЛЬНАЯ МЭТА"
STR_INTERCEPT_TEXT_26: "Вы абвінавачваеце Харыса без доказаў. Ён бачыць, як падазраваны спрабуе дыскрэдытаваць следчага. Што б ні здарылася з гарбатай, вы зрабілі так, што яму было цяжэй паверыць вам."
STR_INTERCEPT_CHOICE_26_0: "Інтэрв'ю скончана"
STR_INTERCEPT_TITLE_27: "УВЕСЬ АККАУНТ"
STR_INTERCEPT_TEXT_27: "Вы называеце імёны і апісваеце сустрэчу. Харыс задае дакладныя пытанні. Ваша збянтэжанасць сапраўдная, але таксама і дэталі, якія ён зараз можа праверыць."
STR_INTERCEPT_CHOICE_27_0: "Няхай спраўдзіць рахунак"
STR_INTERCEPT_CHOICE_27_1: "Прапануйце знайсці Хупера"
STR_INTERCEPT_TITLE_28: "няўдалы блеф"
STR_INTERCEPT_TEXT_28: "Харыс пачуў досыць упэўненых адказаў. У Хупера таксама. Ні тое, ні другое не сведчыць аб тым, што ваша гісторыя адсутнічае."
STR_INTERCEPT_CHOICE_28_0: "Настойвайце на пазове"
STR_INTERCEPT_CHOICE_28_1: "Здзейсніце адчайны ўцёкі"
STR_INTERCEPT_CHOICE_28_2: "Прызнайцеся, што адбылося на самой справе"
STR_INTERCEPT_TITLE_29: "ПЕРАХВАТ"
STR_INTERCEPT_TEXT_29: "Аркуш у вашай кішэні нясе не толькі пераблытаныя літары: яго шлях праз хаціны ставіць Хупера каля машыны. Кароткая падказка можа прымусіць патрэбнага чалавека шукаць у патрэбным месцы."
STR_INTERCEPT_CHOICE_29_0: "Закадзіраваць паведамленне для Хупера"
STR_INTERCEPT_CHOICE_29_1: "Пакажыце маршрут да Харыса"
STR_INTERCEPT_TITLE_30: "МАШЫНА ПРАЦАЕ"
STR_INTERCEPT_TEXT_30: "У Харыса ёсць складнік і след, які вядзе далей за вашы першыя спалоханыя адказы. Бомба аднаўляе сваю працу. Вы пакідаеце Хаціну 14 пад сваім імем, з меншай колькасцю сакрэтаў і будучыняй, за якую яшчэ трэба адказваць."
STR_INTERCEPT_TITLE_31: "ПАДАЗРЭННЕ"
STR_INTERCEPT_TEXT_31: "Вяртанне кампанента выратавала машыну ад затрымкі. Гэта не выратавала вашу пазіцыю. Харыс спыняе ваш доступ да хацін, пакуль працягваецца расследаванне. Вы перажылі інтэрв'ю, але не ачысцілі сваё імя."
STR_INTERCEPT_TITLE_32: "ПАД ВАРТАЙ"
STR_INTERCEPT_TEXT_32: "Дзверы адчыняюцца для ахоўніка, а не для вас. Супярэчнасці, адсутнасць доказаў і скрадзены кампанент сталі справай, якой вы больш не можаце кіраваць. На гэтым спроба заканчваецца."
STR_INTERCEPT_TITLE_33: "ЗНЕШНІ ШЛЯХ"
STR_INTERCEPT_TEXT_33: "Вы пакідаеце хаціны ззаду. Цемра карысная, але за тэрыторыяй сочаць. Разбітае акно наблізіла патрулі, чым вы спадзяваліся."
STR_INTERCEPT_CHOICE_33_0: "Перасячы адкрыты грунт"
STR_INTERCEPT_CHOICE_33_1: "Прытрымвайцеся службовага шляху"
STR_INTERCEPT_CHOICE_33_2: "Павярніцеся назад і тварам да Харыса"
STR_INTERCEPT_TITLE_34: "ХАТЫНА ХУПЕРА"
STR_INTERCEPT_TEXT_34: "Стол без нагляду. Дакументы ляжаць пад крыжаванкай, а машынная зала з'яўляецца ў раскладзе, намаляваным алоўкам. Звонку па дошках набліжаюцца крокі."
STR_INTERCEPT_CHOICE_34_0: "Вывучыце паперы"
STR_INTERCEPT_CHOICE_34_1: "Пачакай Хупера"
STR_INTERCEPT_CHOICE_34_2: "Адпраўляйцеся да Харыса"
STR_INTERCEPT_TITLE_35: "ШАХМАТНАЯ ЗАДАЧА"
STR_INTERCEPT_TEXT_35: "Вы даяце Хуперу пазіцыю, якая адлюстроўвае яго цяжкае становішча: абароненая фігура, адкрыты кароль і ход, які выглядае бяспечным да адказу. Ён разумее папярэджанне. Яго наступныя словы забяспечваюць вам патрэбную сувязь."
STR_INTERCEPT_CHOICE_35_0: "Папрасіце яго прызнаць план"
STR_INTERCEPT_CHOICE_35_1: "Адпраўце допуск Харысу"
STR_INTERCEPT_TITLE_36: "БЕЗ МАСКІ"
STR_INTERCEPT_TEXT_36: "Вы кажаце пра ціск замест таго, каб рабіць выгляд, што яго ніколі не было. Хупер адказвае коратка як чалавек, а не як апанент. Гэтую адтуліну можна было выкарыстоўваць для гандлю або пасткі."
STR_INTERCEPT_CHOICE_36_0: "Папытаеце сумленнай дамоўленасці"
STR_INTERCEPT_CHOICE_36_1: "Папрасіце яго прызнацца"
STR_INTERCEPT_CHOICE_36_2: "Аднясіце рахунак Харысу"
STR_INTERCEPT_TITLE_37: "УХОД ХУПЕРА"
STR_INTERCEPT_TEXT_37: "Хупер тлумачыць дастаткова, каб звязаць шантаж з адсутным кампанентам. Цяпер Харыс можа аднавіць абсталяванне і праверыць гісторыю. Вы павінны вырашыць, скончыць расследаванне або дазволіць Хуперу знікнуць."
STR_INTERCEPT_CHOICE_37_0: "Прынясіце Харысу допуск"
STR_INTERCEPT_CHOICE_37_1: "Адпусці Хупера і сыдзі"
STR_INTERCEPT_TITLE_38: "ГАНДАЛЬ"
STR_INTERCEPT_TEXT_38: "Вы размяшчаеце свой апошні рычаг у межах дасяжнасці Хупера. Здзелка без сведкі і доказаў - гэта запрашэнне яго вырашыць сваю праблему за ваш кошт."
STR_INTERCEPT_CHOICE_38_0: "Перадайце кампанент"
STR_INTERCEPT_CHOICE_38_1: "Патрабуйце засведчанага пагаднення"
STR_INTERCEPT_CHOICE_38_2: "Адклікаць прапанову"
STR_INTERCEPT_TITLE_39: "ГАРЫС СЛУХАЕ"
STR_INTERCEPT_TEXT_39: "Падрабязнасці можна праверыць. Харыс пытаецца, дзе цяпер кампанент. Ачыстка вашага ўліковага запісу і запуск машыны - звязаныя праблемы, але гэта не адно і тое ж."
STR_INTERCEPT_CHOICE_39_0: "Вярні тое, што ў тваім паліто"
STR_INTERCEPT_CHOICE_39_1: "Дапамажыце аднавіць кампанент"
STR_INTERCEPT_CHOICE_39_2: "Перастаць адказваць зараз"
STR_INTERCEPT_TITLE_40: "ЗА ПЛОТАМ"
STR_INTERCEPT_TEXT_40: "Хаціны знікаюць за вамі. Свабода за межамі тэрыторыі не тое ж самае, што невінаватасць, і машына цяпер кагосьці іншага неадкладная праблема. Вы ўцяклі; гісторыю застаецца незавершанай."
STR_INTERCEPT_TITLE_41: "АПОШНЯЯ ПАМЫЛКА"
STR_INTERCEPT_TEXT_41: "Патруль дасягае вас да таго, як скончыцца адкрытая пляцоўка, інакш абяцанне Хупера руйнуецца, калі яно больш яму не патрэбна. У вас скончыліся бяспечныя хады. Гісторыю можна паўтарыць з самага пачатку."
STR_INTERCEPT_TITLE_42: "ПАПЕРЫ"
STR_INTERCEPT_TEXT_42: "Расклад размяшчае Хупера там, дзе ён быў у вашай гісторыі. Побач знаходзіцца запіска, якая першай зацягнула вас у пастку. Камбінацыя досыць канкрэтная, каб Харыс яе мог праверыць."
STR_INTERCEPT_CHOICE_42_0: "Аднясіце паперы Харысу"
STR_INTERCEPT_CHOICE_42_1: "Пачакайце і супрацьстаяце Хуперу"
STR_INTERCEPT_TITLE_43: "АПОШНЯЯ ДАМОЎЛЕНАСЦЬ"
STR_INTERCEPT_TEXT_43: "Хупер прапануе вярнуць дэталь назад. Давер да яго ліквідаваў бы адну неадкладную праблему; робячы Харыса сведкам, было б цяжэй стварыць іншага."
STR_INTERCEPT_CHOICE_43_0: "Арганізуйце вяртанне пры сведках"
STR_INTERCEPT_CHOICE_43_1: "Уключыце Харыса ў план"
STR_INTERCEPT_TITLE_44: "АДНАЎЛЕННЕ КАТУШКІ"
STR_INTERCEPT_TEXT_44: "Калі ўліковы запіс запісаны, пошук вяртаецца да адсутнага абсталявання. Харыс правярае машыннае аддзяленне, пакуль вы вызначаеце, дзе павінен знаходзіцца кампанент."
STR_INTERCEPT_CHOICE_44_0: "Завяршыць праверанае вяртанне"
STR_INTERCEPT_CHOICE_44_1: "Дастаньце яго са свайго паліто"
STR_INTERCEPT_CHOICE_44_2: "Папярэдзьце Гарыса пра Хупера"
STR_INTERCEPT_TITLE_45: "АПОШНЕЕ ПЫТАННЕ"
STR_INTERCEPT_TEXT_45: "Харыс чакае. Калі вы можаце звязаць Хупера з крадзяжом, усё яшчэ ёсць спосаб аднавіць кампанент і пакончыць з гэтым належным чынам. У адваротным выпадку расследаванне мае толькі ваш зменлівы рахунак."
STR_INTERCEPT_CHOICE_45_0: "Прад'явіце доказы"
STR_INTERCEPT_CHOICE_45_1: "Прызнайся, што ў цябе больш нічога няма"
