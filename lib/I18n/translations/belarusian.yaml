STR_CAR_GUIDE_SOLVE: "Як вырашыць справу"
STR_CAR_GUIDE_SOLVE_COPY: "Раскрыйце забойства, выслухаўшы герояў і знайшоўшы вінаватага. Кожны выпадак паказвае вам, колькі вінаватых і ілжывых заяў трэба знайсці."
STR_CAR_GUIDE_SINCERE: "Вінаватасць і шчырасць"
STR_CAR_GUIDE_SINCERE_COPY: "Некаторыя персанажы кажуць праўду, а іншыя хлусяць. Хлус не абавязкова вінаваты: невінаваты чалавек таксама можа хлусіць."
STR_CAR_GUIDE_EXAMPLE: "Прыклад"
STR_CAR_GUIDE_EXAMPLE_COPY: "З 1 вінаватым і 1 хлуснёй знайдзіце роўна аднаго вінаватага і адно ілжывае сцвярджэнне. Кожнае іншае сцвярджэнне павінна быць праўдай."
STR_CAR_GUIDE_OR: "А або Б зрабілі гэта"
STR_CAR_GUIDE_OR_COPY: "«Гэта зрабілі Ана або Бруна» азначае, што як мінімум адзін вінаваты. Калі дакладчык хлусіць, ніхто з іх гэтага не зрабіў."
STR_CAR_GUIDE_AND: "A і B зрабілі гэта"
STR_CAR_GUIDE_AND_COPY: "«Ана і Бруна зрабілі гэта» кажа, што абодва вінаватыя. Калі гэта хлусня, то хаця б адзін невінаваты."
STR_CAR_GUIDE_COMPARE: "Шчырасць"
STR_CAR_GUIDE_COMPARE_COPY: "«Абодва кажуць праўду або абодва хлусяць» параўноўвае іх заявы, а не іх віну. Праверце, ці праўдзівыя абодва сцвярджэнні, ці абодва непраўдзівыя."
STR_CAR_GUIDE_NEIGHBOURS: "Суседзі"
STR_CAR_GUIDE_NEIGHBOURS_COPY: "Падказкі непасрэдна называюць абодвух суседзяў. Змена старонак не змяняе адносіны."
STR_CAR_GUIDE_RELIABLE: "Даставерныя факты"
STR_CAR_GUIDE_RELIABLE_COPY: "Імёны, рост і дыеты надзейныя. Заявы могуць хлусіць. Вышыні выдуманыя."
STR_CAR_GUIDE_HEIGHT: "Рост і дыета"
STR_CAR_GUIDE_HEIGHT_COPY: "Рост і дыета персанажа надзейныя. «Вінаваты вышэйшы за мяне» параўноўвае вінаватага з прамоўцам. Усяедныя не лічацца пажадлівымі або траваеднымі."
STR_CAR_GUIDE_MARKS: "Вашы нататкі"
STR_CAR_GUIDE_MARKS_COPY: "Прачытайце кожнае выказванне. Выкарыстоўвайце праўду, хлусню і падазронага, каб запісваць свае ідэі. Гэта вашы нататкі: гульня іх пакуль не правярае."
STR_CAR_GUIDE_NAV: "Навігацыя"
STR_CAR_GUIDE_NAV_COPY: "Ёсць 3 сімвалы на старонцы ў кніжнай арыентацыі. Стрэлкі паказваюць астатнія."
STR_CAR_GUIDE_CONFIRM: "Пацвердзіце абвінавачванне"
STR_CAR_GUIDE_CONFIRM_COPY: "Калі вашы ідэі адпавядаюць кожнай падказцы і колькасці хлусні, націсніце Абвінавачваць. Выберыце вінаватых і пацвердзіце свой адказ."
STR_CAR_GUIDE_LIVES: "Жыве і вынік"
STR_CAR_GUIDE_LIVES_COPY: "Пачатковец /Normal : 2 жыцці. Прасунуты /Expert : 1. Правільнае абвінавачанне вырашае справу. Калі не засталося жыццяў, паглядзіце рашэнне."
STR_CAR_GUIDE_CAMPAIGN: "Кампанія"
STR_CAR_GUIDE_CAMPAIGN_COPY: "Адкрыты футляр працягвае вашу гульню. Кампанія дазваляе выбіраць з 1470 кейсаў. Пачніце з пачаткоўца падчас навучання."
STR_CAR_GUIDE_REPEAT: "Паўтарыце і захавайце"
STR_CAR_GUIDE_REPEAT_COPY: "Паўтарэнне выпадку пачынае новую спробу з захаваннем ранейшага выніку. Прагрэс і жыццё захаваны на microSD."
