STR_QUEST_CAM_SOLO_DECOR_TEXT_1: "Ліхтар для асвятлення вашага кутка для чытання."
STR_QUEST_CAM_DECOR_NAME_2: "Echo Conch"
STR_QUEST_CAM_DECOR_TEXT_2: "Выратаваны марак дае вам ракавіну, якая ўсё яшчэ захоўвае песню мора."
STR_QUEST_CAM_DECOR_NAME_3: "Дух чарнілаў"
STR_QUEST_CAM_DECOR_TEXT_3: "Дух уцёк з чыстай старонкі. Ён выбірае падарожнічаць з вамі."
STR_QUEST_CAM_DECOR_NAME_4: "Месяцовы кветка"
STR_QUEST_CAM_DECOR_TEXT_4: "Агароднікі выратавалі адно зярнятка са спячага саду. Гэтая кветка вырасла для вас."
STR_QUEST_CAM_DECOR_NAME_5: "Зімовы крышталь"
STR_QUEST_CAM_DECOR_TEXT_5: "Адліга паказвае крышталь, які захоўвае апошні ўспамін пра гару."
STR_QUEST_CAM_DECOR_NAME_6: "Завадная сава"
STR_QUEST_CAM_DECOR_TEXT_6: "Гадзіннікавы майстар рамантуе гэтага маленькага ахоўніка, каб падзякаваць вам за вяртанне часу."
STR_QUEST_CAM_DECOR_NAME_7: "Пяро Фенікса"
STR_QUEST_CAM_DECOR_TEXT_7: "З вынятага попелу вырастае пяро: абяцанне таго, што гісторыі могуць пачацца зноўку."
STR_QUEST_CAM_DECOR_NAME_8: "Пустынная лямпа"
STR_QUEST_CAM_DECOR_TEXT_8: "Казачнік дае вам лямпу, якая падтрымлівала казкі аб пустыні."
STR_QUEST_CAM_DECOR_NAME_9: "Cloud Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "Вы адкрываеце воблачную клетку. Маленькі коі застаецца назіраць за вашымі марамі."
STR_QUEST_CAM_DECOR_NAME_10: "Сэрца дракона"
STR_QUEST_CAM_DECOR_TEXT_10: "Цмокі давяраюць вам крышталь, народжаны з іх адноўленай памяці."
STR_QUEST_CAM_DECOR_NAME_11: "Зорка памяці"
STR_QUEST_CAM_DECOR_TEXT_11: "Першая адноўленая зорка асвятляе ваш шлях да апошніх старонак."
STR_QUEST_CAM_DECOR_NAME_12: "Парастак чытання"
STR_QUEST_CAM_DECOR_TEXT_12: "Невялікая расліна для ціхага кутка для чытання."
STR_QUEST_CAM_DECOR_NAME_13: "Захаваныя кнігі"
STR_QUEST_CAM_DECOR_TEXT_13: "Гісторыі чакаюць свайго наступнага чытача."
STR_QUEST_CAM_DECOR_NAME_14: "Банэр \"Вояджэр\"."
STR_QUEST_CAM_DECOR_TEXT_14: "Вымпел, які трэба памятаць пра кожны новы пачатак."
STR_QUEST_CAM_DECOR_NAME_15: "Месяцовыя грыбы"
STR_QUEST_CAM_DECOR_TEXT_15: "Маленькі кавалак лесу для вашага дома."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Пачатак прыгоды"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Шмат гадоў людзі жылі ў міры і любілі свае кнігі. Тады Кароль Забыцця пачаў іх знішчаць. Ён хацеў перашкодзіць усім чытаць і прымусіць усе гісторыі знікнуць назаўжды."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Каралеўскія монстры"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Кароль Забыцця разаслаў сваіх монстраў па ўсім свеце. Яны знішчалі кожную кнігу, якую знайшлі, і нападалі на ўсіх, хто спрабаваў іх спыніць. Пачалі знікаць бібліятэкі, людзі перасталі чытаць."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Сіла чытання"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Аднойчы, калі вы чытаеце каля сваёй вёскі, з'яўляецца пачвара. Вы спрабуеце ўцячы, але адбываецца нешта дзіўнае: чым больш вы чытаеце, тым слабей яно становіцца. Вы разумееце, што чытанне - адзіны спосаб змагацца з магіяй караля."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Ваша місія"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Вы вырашылі спыніць караля. На вашым шляху да яго замка вы павінны перасекчы лясы, гарады, горы і іншыя месцы, поўныя ворагаў. Кожны пераможаны вамі монстр набліжае вас да сябе. Працягвайце чытаць, перамагчы яго апекуноў і дасягнуць яго, перш чым ён знішчыць усе кнігі ў свеце."
