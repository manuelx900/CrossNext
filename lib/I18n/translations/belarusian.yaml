STR_PET_STORY_4: "Пад зоркамі"
STR_PET_STORY_TEXT_4: "Пасля чытання вы разам глядзіце. З'яўляецца адна зорка, потым другая. Ёсць яшчэ так шмат, каб адкрыць."
STR_PET_STORY_5: "Страчаны лісток"
STR_PET_STORY_TEXT_5: "Ваш таварыш прыносіць вам ліст. Вы захоўваеце яго побач са сваёй закладкай: маленькі падарунак ад звычайнага дня."
STR_PET_STORY_6: "Ціхі куток"
STR_PET_STORY_TEXT_6: "Вы знаходзіце зручны куток і адкрываеце сваю кнігу. Ваш спадарожнік размяшчаецца побач з вамі. Ніхто з вас нікуды не спяшаецца."
STR_PET_STORY_7: "Новы шлях"
STR_PET_STORY_TEXT_7: "Яшчэ адна старонка перанясе вас у новае месца. Ваш спадарожнік пацягваецца і глядзіць на вас, гатовы да заўтрашняй главы."
