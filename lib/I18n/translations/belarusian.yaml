STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_0: "Дапамажы мне параўнаць старонкі, якія мы прыносім дадому. Імя на палях можа сказаць нам, якой сям'і належыць успамін."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_1: "Прачытайце гісторыі, якія суседзі прынеслі на плошчу. Мы павінны паставіць кожнае імя побач з жыццём, да якога яно адносіцца."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_2: "Дапамажыце мне параўнаць гісторыі мараплаўцаў. Я не магу паслаць другі карабель у канал, які мы больш не памятаем."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_3: "Дапамажыце мне прачытаць выратаваныя тамы. Калі яны пакідаюць гэтыя пакоі, я хачу, каб нехта ведаў, чые гісторыі яны нясуць."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_4: "Дапамажы мне параўнаць гісторыі з прытулкаў. Наступны падарожнік павінен знайсці шлях, а не чарговае рэха, якое ўводзіць у зман."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_5: "Дапамажыце нам параўнаць старыя падарожжы. Запомнены калодзеж можа зрабіць розніцу паміж прыбыццём і знікненнем у пяску."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_6: "Дапамажы мне паслухаць аповеды суседзяў. Гадзіннік не можа сказаць мне, што яны спадзяваліся зрабіць з днём."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_7: "Дапамажыце нам прачытаць гісторыі, якія прыходзяць з вызваленых рэгіёнаў. Палац правёў дастаткова гадоў, размаўляючы толькі з сабой."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_8: "Дапамажыце навесці парадак у агароднікаў. Гэтыя насенне патрабуюць не толькі назвы на ўпакоўцы."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_9: "Дапамажыце нам захаваць гэтыя гісторыі ў звароце. Я хачу, каб людзі, якіх мы знайшлі, маглі пачуць адзін аднаго."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_10: "Дапамажы нам прачытаць гісторыі, якія дасягаюць апошняй дарогі. Кожная з іх належыць камусьці, хто чакае за царскімі сценамі."
STR_QUEST_CAM_JOURNEY_WEEKLYREQUEST_11: "Дапамажыце нам прачытаць гэтыя гісторыі цалкам. Пасля такой доўгай разлукі іх уладальнікі заслугоўваюць большага, чым імя ў спісе."
STR_QUEST_CAM_JOURNEY_THANKS_0: "Ліора разгладжвае старонку далонню. \"Я зноў чую гэты радок\", - кажа яна. У гэты вечар яна пакіне кнігу адкрытай каля лямпы."
STR_QUEST_CAM_JOURNEY_THANKS_1: "На стаянцы хтосьці перамяшчае крэсла, каб зрабіць месца для вас. Незавершаны артыкул атрымаў яшчэ адзін радок; яго ўладальнік бярэ старонку дадому ў абедзвюх руках."
STR_QUEST_CAM_JOURNEY_THANKS_2: "Мара згортвае толькі што разборлівую старонку і кладзе яе побач са сваёй кнігай прыліваў. Перш чым вярнуцца да акна, яна дзякуе вам голасам, агрубелым ад салёнага паветра."
STR_QUEST_CAM_JOURNEY_THANKS_3: "Іры кладзе палоску сухой тканіны паміж дзвюма старонкамі. «Цяпер можна падарожнічаць». Яна трымае том на грудзях, перш чым аднесці яго да іншых кніг."
STR_QUEST_CAM_JOURNEY_THANKS_4: "Тарэн кладзе свой ранец на камень і слухае, пакуль вы скончыце. Затым ён паўтарае словы падарожніка, на гэты раз без неабходнасці глядзець на старонку."
STR_QUEST_CAM_JOURNEY_THANKS_5: "Надзір перацягвае стужку пальцамі, чытаючы імя, якое раней было цяжка разабраць. Ён робіць для вас месца каля агню."
STR_QUEST_CAM_JOURNEY_THANKS_6: "Арын пакідае інструмент, які ён круціў у сваіх пальцах. Некалькі часу ён гаворыць пра чалавека ў гісторыі, і гадзіннік дазваляе прайсці нечутым."
STR_QUEST_CAM_JOURNEY_THANKS_7: "Сера перамяшчае гісторыю з купы каралеўскіх загадаў. Яна просіць яшчэ адно крэсла, потым слухае апошнія радкі разам з вамі."
STR_QUEST_CAM_JOURNEY_THANKS_8: "Астра пазначае старонку чыстым аркушам. Яна ціха дзякуе табе; крыху пазней вы чуеце, як яна чытае той жа ўрывак побач з фантанам."
STR_QUEST_CAM_JOURNEY_THANKS_9: "Кароткая нататка прыходзіць разам з наступным пакетам старонак. Ліора скапіявала ўрывак, які вы дапамаглі аднавіць; на палях яна напісала: «Мы чытаем гэта разам дома»."
STR_QUEST_CAM_JOURNEY_THANKS_10: "Нататка складаецца ўсяго з некалькіх радкоў. Ліора пакінула месца для адказу, быццам ужо бачыла, як вы сядзіце на другім канцы стала."
STR_QUEST_CAM_JOURNEY_THANKS_11: "Сярод адноўленых старонак вы знойдзеце складзеную хатнюю запіску. Яго апошні радок просты: «Для вас тут яшчэ ёсць месца»."
