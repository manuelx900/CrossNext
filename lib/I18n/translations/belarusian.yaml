STR_FLASHCARDS_HELP: "Скапіруйце калоды Anki (.apkg /.colpkg , .anki2 /.anki21), CSV /TSV/text або пераўтвораныя папкі Study у /FLASHCARDS. Выкарыстоўвайце падпапкі: да 128 элементаў у кожнай.\n\nImports прымае Basic, перавернутыя і простыя закрытыя тэкставыя карткі. Аўдыё і карыстальніцкі HTML не падтрымліваюцца. Спачатку пераўтварыце малюнак калод /CJK. Аўтаномныя агляды выкарыстоўваюць FSRS. Імпарт пачынаецца па новым графіку і захоўвае арыгіналы."
