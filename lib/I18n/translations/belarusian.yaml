STR_INTERCEPT_ABOUT: "Сціснутая адаптацыя The Intercept ад Inkle, 2016 г., выкарыстаная па ліцэнзіі MIT. Блетчлі-парк, 1942 год: зніклы кампанент машыны, шантаж і інтэрв'ю, якое можа скончыцца свабодай або арыштам.\n\nВашы рашэнні і пазіцыя захоўваюцца пасля кожнага выбару. Новая гісторыя скідае гэтае праходжанне. Для гэтай прашыўкі былі створаны арыгінальныя ілюстрацыі. Арыгінальны сцэнар і ліцэнзія ўключаны ў праект."
