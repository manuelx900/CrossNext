STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Пасля перамогі над Каралём Забыцця вы вяртаецеся дадому. Яго армія больш не можа знішчаць кнігі, і людзі зноў спакойна чытаюць. Вы выратавалі гісторыі свету. Засталося адкрыць для сябе яшчэ шмат кніг."
