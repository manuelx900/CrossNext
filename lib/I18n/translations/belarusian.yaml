STR_CAR_HELP_TEXT: "Як развязаць задачу\nКожны персанаж робіць адну заяву. У верхняй частцы экрана паказана дакладная колькасць вінаватых і няпраўдзівых заяваў. Знайдзіце камбінацыю, якая задавальняе абедзве лічбы. Кожны выпадак мае адно рашэнне.\n  \nВіна не праўдзівая\nНевінаватая асоба можа ліць, а вінаваты можа сказаць праўду. Две праўды азначаюць, што ўсе два сцвярджэнні непраўдзівыя; астатнія - ісцінныя. Знакі Ісціны / Лжы паказваюць на сцвярджэнне; Падазраваны паказвае на віну.\n  \nЧытанне падказкі\n\"A або B зрабілі гэта (або абодва)\" азначае, што хоць бы адзін з названых персанажаў вінаваты. \"A і B зрабілі гэта\" патрабуе абедзвюх. Ложь негатыўна ўплывае на ўсе сцвярджэнні: непраўдзівы OR азначае, што ні адзін з іх не зрабіў гэтага; няпраўдзівы AND азначае, што хоць бы адзін з іх не зрабіў гэтага.\n  \n\"Абедзве праўдзівыя або абедзве непраўдзівыя\" параўноўвае сцвярджэнні, а не віну. \"Адна з іх непраўдзівая\" азначае, што іх сцвярджэнні маюць розныя значэнні ісціны. Гэтыя падказкі могуць быць сапраўднымі або хлуслівымі.\n  \nСуседзі на малым экране\nПачатковы парадак круга - Пантэра, Паўлюк, Акула, Ліса, Мядзведзь, Елка, Конік, з выкарыстаннем толькі знакаў рэдактара. Апошні і першы - суседзі. Гэтая праграма піша два імёны прама ў кожную суседнюю падказку. Вы ніколі не павінны здагадвацца, якія карты знаходзяцца побач з партрэтам. Змена старонкі або арыентацыі не змяняе падказку.\n  \nВышыня і дыета\nКожная карта паказвае выдуманы ўзрост і рацыён харчавання. \"Вінаваты вышэйшы за мяне\" азначае, што хоць бы адзін з вінаватых вышэйшы за гукарэжысёра, але не абавязкова ўсе вінаватыя. Кароткія адказы працуюць аднолькава. Падказкі пра мясаедаў і травяёдаў азначаюць, што хоць бы адзін з вінаватых мае гэтую дыету; усёядныя лічацца ні адным з іх. Імёны, вышыня і рацыён харчавання з' яўляюцца дакладнымі фактамі; сцвярджэнні могуць быць няправільнымі.\n  \nВаш аналіз\nВыкарыстоўвайце? / Правда / Ложь і Падазрэнне пад кожным сцвярджэннем для запісу гіпотэз. Гэта вашы запісы, а не доказы або аўтаматычныя праверкі. Стрэлкі паказваюць іншыя персанажы. Портрэтны рэжым паказвае да трох персанажаў на старонцы.\n  \nСтварэнне абвінавачвання\nНацісніце \"Абвінаваціць\" і выберыце патрэбную колькасць вінаватых. Толькі пацверджанне няправільнага абвінавачвання патрабуе аднаго жыцця. Пачаткоўцы і звычайныя карыстальнікі маюць два жыцця, дасведчаныя і эксперты - адно. Правільная абвінавачванне вырашае справу. Калі не засталося жыццяў, адкрываецца рашэнне.\n  \nКампанія і паўтор\nІснуе 1470 справаў. Адкрытая справа працягвае бягучую спробу або адкрывае наступную пасля зачыненай. Кампанія дазваляе выбраць любую з 1470 справаў у любым парадку з пачатку. Паўтарэнне пачынае новую спробу, захоўваючы ранейшыя вынікі. У межах кожнага ўзроўню складанасці справы рухаюцца ад аднаго вінаватага да двух, потым ад меньшай колькасці абманшчыкаў да большай колькасці ў кожнай групе вінаватых. Пачаткоўца захоўвае аднаго вінаватага. Маленькія выбухі пачынаюцца першымі, калі колькасць выбухаў адпавядае колькасці выбухаў. Усе справы застаюцца даступнымі. Развязванне раней вычарпанай справы павышае яе да развязанай.\n  \nПрагрэс і жыцці захоўваюцца на SD- карце. Выхад, сну або перазагрузка прылады не аднаўляе жыцці ў бягучай спробе. Памылковае захаванне заблакуе вынік да поспеху паўторнай спробы. Скінуць усе просіць пацвердзіць перад выдаленнем толькі прагрэсу Carnivore."
