STR_QUEST_CAM_JOURNEY_DAILYREQUEST_0: "Прачытайце гэтую гісторыю разам са мной. Усё яшчэ ёсць сям'і, якія шукаюць свае словы ў кнізе вёскі."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_1: "Затрымайцеся з гэтымі гісторыямі яшчэ крыху. Хтосьці на рынку можа пазнаць чалавека, якога апісваюць словы."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_2: "Прачытайце гэтыя імёны са мной. Я хачу, каб сям'я чакала, калі прыйдзе наступная лодка."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_3: "Прачытайце гэты ўліковы запіс, перш чым я перанясу яго на паліцу вышэй. Мне трэба ведаць, якіх слоў яшчэ не хапае."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_4: "Прачытайце са мной словы падарожнікаў. Я не хачу прыняць старое папярэджанне за заклік."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_5: "Прачытайце гэтыя гісторыі каля агню. Перад тым, як мы паедзем, я хачу, каб кожны пачуў сваё імя."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_6: "Прачытайце гэтую старонку са мной, перш чым зазваняць званы. Мне трэба запомніць больш, чым гадзіну на цыферблаце."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_7: "Прачытайце гэтае сведчанне цалкам. Тут ёсць людзі, якія занадта доўга чакалі, каб іх пачулі."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_8: "Прачытай гэтую памяць каля фантана. Хацелася б пачуць, што спадзяваўся пакінуць пасля сябе чалавек, які пасадзіў тут."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_9: "Прачытайце гісторыі, якія мы вам даслалі. Галасы з дому могуць стаць вам сябрамі, нават калі вы так далёка."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_10: "Прачытайце гэты ліст, перш чым адправіцца ў дарогу. Вам не трэба несці кожны ўспамін у адзіночку."
STR_QUEST_CAM_JOURNEY_DAILYREQUEST_11: "Прачытайце словы, якія мы захавалі для вас. Крэпасць - гэта яшчэ не ўвесь свет, як бы ціха ні было."
