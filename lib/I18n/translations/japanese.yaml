STR_CAR_INTRO: "罪悪感と誠実さは独立したものであり、すべてのケースには正確に一つの解決策がある。"
STR_CAR_HELP_TEXT: "事件の解決方法\n各容疑者は 1 つの供述をします。画面の上部には、犯人と虚偽の供述の正確な数が表示されます。両方の数値を満たす組み合わせを見つけます。どのケースにも解決策は 1 つあります。\n\n罪悪感は正直ではない\n無実の容疑者が嘘をつくこともあるし、犯人が真実を語ることもある。 2 つの嘘は、正確に 2 つのステートメント全体が偽であることを意味します。他は真実です。真実/嘘のマークはステートメントを指します。容疑者とは有罪を指します。\n\n手がかりを読む\n「A または B がやった（または両方）」とは、指名された容疑者のうち少なくとも 1 人が有罪であることを意味します。 「A と B がやった」には両方が必要です。嘘は発言全体を否定します。偽の OR はどちらも嘘をついていないことを意味します。 false AND は、少なくとも 1 つがそうでなかったことを意味します。\n\n「両方真実、または両方嘘」は、罪悪感ではなく、供述を比較します。 「ちょうど 1 人が嘘をついている」ということは、彼らの発言の真理値が異なることを意味します。これらの手がかり自体は、真実である場合もあれば偽である場合もあります。\n\n小さな画面上の隣人\n元の循環命令はヒョウ、クジャク、サメ、キツネ、クマ、鹿、馬で、この事件の容疑者のみを使用しています。最後と最初は隣人です。このアプリは、すべての近隣手がかりに 2 つの名前を直接書き込みます。ポートレートの横にどのカードがあるかを推測する必要はありません。ページや方向を変更しても手がかりは変わりません。\n\n身長と食事\n各カードには架空の身長と食事が表示されます。 「犯人は私より背が高い」とは、少なくとも 1 人の犯人が発言者より背が高いことを意味し、必ずしもすべての犯人がそうであるとは限りません。短い場合も同様に機能します。肉食動物と草食動物の手がかりは、少なくとも犯人の一人がその食生活をしていることを意味します。雑食動物はどちらにも数えられません。名前、身長、食事は信頼できる事実です。発言は嘘をつく可能性があります。\n\nあなたの分析\n使用しますか?仮説を記録するために、各発言の下で/真実/嘘と疑いを記録します。これらはあなたのメモであり、証拠や自動チェックではありません。矢印は他の容疑者を示しています。縦向きモードでは、1 ページあたり最大 3 つが表示されます。\n\n告発を行う\n「告発」を押して、必要な数の犯人を正確に選択します。冤罪を肯定するだけで人生が終わる。初心者とノーマルには 2 つのライフがあります。アドバンストとエキスパートには 1 つあります。正しく告発すれば事件は解決する。残された命がなくなったとき、解決策が明らかになります。\n\nキャンペーンとリプレイ\n1,470 件あります。オープンケースは現在の試行を再開するか、閉じたケースの後に次の試行を開始します。キャンペーンは1,470件の中から好きな順番で最初からお選びいただけます。リプレイは、以前の完了を維持しながら、新たな試行を開始します。それぞれの難易度内で、事件は犯人が 1 人から 2 人に進み、次に各犯人グループ内で嘘つきが少ない人から増える人へと進みます。初心者は犯人を1人にしておく。カウントが一致すると、小さいキャストが最初に表示されます。すべてのケースは引き続き利用可能です。以前に解決したケースを解決すると、解決済みにアップグレードされます。\n\n進行状況とライフは SD カードに保存されます。離れる、スリープする、またはデバイスを再起動しても、現在の試行ではライフは回復しません。保存に失敗すると、再試行が成功するまで結果がブロックされます。すべてリセットすると、Carnivore の進行状況のみを消去する前に確認が求められます。"
