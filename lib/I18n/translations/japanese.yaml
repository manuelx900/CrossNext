STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "冒険の始まり"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "長年にわたり、人々は平和に暮らし、本を楽しみました。その後、オブリビオンの王が彼らを破壊し始めました。彼は、誰もが本を読むのをやめて、すべての物語を永久に消滅させたかったのです。"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "王の怪物たち"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "オブリビオンの王は世界中にモンスターを送り込みました。彼らは見つけた本をすべて破壊し、止めようとする者を攻撃しました。図書館は姿を消し始め、人々は本を読まなくなりました。"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "読書の力"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "ある日、村の近くで読書をしていると、怪物が現れます。逃げようとしますが、驚くべきことが起こります。読めば読むほど弱くなっていくのです。あなたは、読書が王の魔法に対抗する唯一の方法であることに気づきました。"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "あなたの使命"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "あなたは王を止めようとしました。彼の城に向かう途中では、森、都市、山、その他敵がいっぱいの場所を越えなければなりません。モンスターを倒すたびに、少しずつ近づいていきます。読み続けて、彼の守護者を倒し、彼が世界中のすべての本を破壊する前に彼に到達してください。"
