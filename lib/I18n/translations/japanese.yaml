STR_FLASHCARDS_HELP: "Anki デッキ (.apkg /.colpkg 、 .anki2 /.anki21 )、CSV /TSV/text、または /FLASHCARDS. に変換されたスタディ フォルダーをコピーします。 サブフォルダーを使用します: それぞれ最大 128 アイテム。\n\nインポートでは、基本、反転、および単純なクローゼ テキスト カードを受け入れます。オーディオとカスタム HTML はサポートされていません。最初に画像 /CJK デッキを変換します。オフラインレビューではFSRSを使用します。インポートすると新しいスケジュールが開始され、元のスケジュールが保持されます。"
