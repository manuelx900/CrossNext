STR_INTERCEPT_TITLE_0: "小屋 14"
STR_INTERCEPT_TEXT_0: "ブレッチリー・パーク、1942年。彼らは施錠されたドアの後ろであなたを待たせています。計算機の部品が消えてしまいました。朝のインターセプトがコートのポケットでカサカサと音を立てます。外では足音が止まる。"
STR_INTERCEPT_CHOICE_0_0: "告発をよく考えてください"
STR_INTERCEPT_CHOICE_0_1: "面接官を待ちます"
STR_INTERCEPT_CHOICE_0_2: "コートを検索"
STR_INTERCEPT_TITLE_1: "告発"
STR_INTERCEPT_TEXT_1: "彼らは反逆罪を疑っている。あなたは、図形、クロスワード、チェスの局面を解決して生計を立てています。この部屋は別の問題です。自分自身に矛盾すると、あなたの信頼性が最初の犠牲者になる可能性があります。"
STR_INTERCEPT_CHOICE_1_0: "戦略を選択してください"
STR_INTERCEPT_CHOICE_1_1: "彼らが知っていることを聞く"
STR_INTERCEPT_TITLE_2: "ハリスが到着"
STR_INTERCEPT_TEXT_2: "ハリスがティーカップとヤスリを持って入ってくる。ボンベのリールが欠品しています。勤務名簿にあなたの名前がありました。彼はカップをあなたの横に置き、昨夜どこにいたのか尋ねます。"
STR_INTERCEPT_CHOICE_2_0: "お茶を飲みましょう"
STR_INTERCEPT_CHOICE_2_1: "お茶はそのままにしておきます"
STR_INTERCEPT_CHOICE_2_2: "冷静に答えてください"
STR_INTERCEPT_TITLE_3: "コンポーネント"
STR_INTERCEPT_TEXT_3: "コートの裏地の内側で、指が冷たい金属に触れます。コンポーネントはまだ存在します。フーパー氏は、これを服用すれば恐喝は止まるだろうと述べた。今、鍵のかかったドアは別の意味を持ちます。"
STR_INTERCEPT_CHOICE_3_0: "隠しておいてください"
STR_INTERCEPT_CHOICE_3_1: "ハリスに渡してください"
STR_INTERCEPT_TITLE_4: "勝利のプレー"
STR_INTERCEPT_TEXT_4: "協力すればあなたの信頼を保つことができます。説得力のある嘘は時間を稼ぐことができます。脱出するには密室と引き換えに外の警備員が来ることになる。これらの動きはどれも取り返すことができません。"
STR_INTERCEPT_CHOICE_4_0: "協力する"
STR_INTERCEPT_CHOICE_4_1: "アリバイをでっち上げる"
STR_INTERCEPT_CHOICE_4_2: "窓を調べる"
STR_INTERCEPT_TITLE_5: "お茶"
STR_INTERCEPT_TEXT_5: "部屋が傾く。ハリスはあなたの沈黙に気づきましたが、彼の顔はすでに遠ざかっています。次に目を開けると、テーブルのそばに別の靴が立っています。"
STR_INTERCEPT_CHOICE_5_0: "寝たふりをする"
STR_INTERCEPT_CHOICE_5_1: "訪問者と対峙する"
STR_INTERCEPT_CHOICE_5_2: "水を要求する"
STR_INTERCEPT_TITLE_6: "小さな拒否"
STR_INTERCEPT_TEXT_6: "あなたはカップを押しのけました。ハリスは答えよりも動きを注意深く観察している。彼は他に質問すべき人がいるかどうか尋ねます。"
STR_INTERCEPT_CHOICE_6_0: "彼がどんな証拠を持っているか尋ねる"
STR_INTERCEPT_CHOICE_6_1: "フーパーについて言及する"
STR_INTERCEPT_CHOICE_6_2: "窓の方を見てください"
STR_INTERCEPT_TITLE_7: "失われたリール"
STR_INTERCEPT_TEXT_7: "ハリスは直接の答えを求めています。コンポーネントを取りましたか？コートの中身を彼に話したり、フーパーが加えたプレッシャーを説明したり、非難の矛先を別の場所に向けてみたりすることもできます。"
STR_INTERCEPT_CHOICE_7_0: "彼にコンポーネントを渡してください"
STR_INTERCEPT_CHOICE_7_1: "脅迫について説明してください"
STR_INTERCEPT_CHOICE_7_2: "フーパーを告発"
STR_INTERCEPT_TITLE_8: "テーブル上の金属"
STR_INTERCEPT_TEXT_8: "コンポーネントはあなたの間にあります。ハリスは気を緩めずに確認する。盗まれた機器を返却しても、なぜそれが持ち去られたのかが説明されません。彼は名前と、あなたの言葉よりも信頼できる何かを望んでいます。"
STR_INTERCEPT_CHOICE_8_0: "証拠を見つけると申し出る"
STR_INTERCEPT_CHOICE_8_1: "残って質問に答えてください"
STR_INTERCEPT_TITLE_9: "アリバイ"
STR_INTERCEPT_TEXT_9: "あなたはデスクでの静かな夜の様子を描写しました。ハリスはファイルを開きます。あなたが機械室から出ていくのを警備員が見ました。あなたが作成したアカウントには、それに対する証人がいます。"
STR_INTERCEPT_CHOICE_9_0: "物語を守れ"
STR_INTERCEPT_CHOICE_9_1: "脅迫を認める"
STR_INTERCEPT_CHOICE_9_2: "それ以上の質問は拒否してください"
STR_INTERCEPT_TITLE_10: "窓"
STR_INTERCEPT_TEXT_10: "窓が高くてガラスが厚い。その先、道は別の小屋を通り過ぎます。それを壊すとうるさいでしょう。ここで待つことには危険が伴います。"
STR_INTERCEPT_CHOICE_10_0: "ガラスを割る"
STR_INTERCEPT_CHOICE_10_1: "外の道を調べてください"
STR_INTERCEPT_CHOICE_10_2: "インタビューに戻る"
STR_INTERCEPT_TITLE_11: "別の訪問者"
STR_INTERCEPT_TEXT_11: "フラフラしている間にフーパーがやって来ました。彼はハリスがコンポーネントを持っているかどうかを知りたいと考えています。彼は片手をドアの近くに置いています。"
STR_INTERCEPT_CHOICE_11_0: "寝たふり"
STR_INTERCEPT_CHOICE_11_1: "説明を要求する"
STR_INTERCEPT_CHOICE_11_2: "水を要求する"
STR_INTERCEPT_TITLE_12: "警告"
STR_INTERCEPT_TEXT_12: "お茶が定着する前に、あなたはハリスを呼びます。彼はイライラして戻ってきました。カップに関する告発には、彼がテストできる何かが必要になるだろう。"
STR_INTERCEPT_CHOICE_12_0: "証拠としてカップを保管してください"
STR_INTERCEPT_CHOICE_12_1: "毒を盛ったとしてハリスを告発する"
STR_INTERCEPT_CHOICE_12_2: "リールに集中する"
STR_INTERCEPT_TITLE_13: "フーパー"
STR_INTERCEPT_TEXT_13: "ハリスはその名前を認識しました。フーパーは有用で、つながりがあり、昨夜の名簿にも欠けていませんでした。認識は証拠ではありません。"
STR_INTERCEPT_CHOICE_13_0: "検証可能なものを見つける"
STR_INTERCEPT_CHOICE_13_1: "フーパーが盗んだと主張する"
STR_INTERCEPT_TITLE_14: "恐喝"
STR_INTERCEPT_TEXT_14: "あなたは、裏切られた自信と、その後の要求に直面した若者について描写しています。ハリスは助けもせずに聞いています。罠を仕掛けた人物の名前を明らかにすれば、あなたが守りたかった人物の正体が明らかになるかもしれません。"
STR_INTERCEPT_CHOICE_14_0: "ハリスに完全なアカウントを与える"
STR_INTERCEPT_CHOICE_14_1: "名前は省略します"
STR_INTERCEPT_CHOICE_14_2: "フーパーを捕まえる方法を提案する"
STR_INTERCEPT_TITLE_15: "簡単な告発"
STR_INTERCEPT_TEXT_15: "フーパーには責任があるに違いない、とあなたは言います。ハリスはどうして知っているのかと尋ねます。問題を解決することと、答えを証明できる証人を立てることには違いがあります。"
STR_INTERCEPT_CHOICE_15_0: "ハリスにその主張に異議を申し立てましょう"
STR_INTERCEPT_CHOICE_15_1: "Hooper にプライベートメッセージを送ってみてください"
STR_INTERCEPT_TITLE_16: "検証可能な手がかり"
STR_INTERCEPT_TEXT_16: "物語は否定される可能性があります。文書、証人、または欠落しているコンポーネントを説明するのはさらに困難です。何を追求するかを選択する時間が少しあります。"
STR_INTERCEPT_CHOICE_16_0: "近くの小屋を調べる"
STR_INTERCEPT_CHOICE_16_1: "朝のインターセプトを使用する"
STR_INTERCEPT_CHOICE_16_2: "フーパーに直接質問する"
STR_INTERCEPT_TITLE_17: "単なる返品以上のもの"
STR_INTERCEPT_TEXT_17: "マシンは再び動作できるようになりましたが、ハリスにはまだ説明すべきセキュリティ侵害が残っています。彼は、誰がそれを組織したのかを明らかにする最後の機会をあなたに提供します。"
STR_INTERCEPT_CHOICE_17_0: "証拠を見せろ"
STR_INTERCEPT_CHOICE_17_1: "証拠を探してください"
STR_INTERCEPT_CHOICE_17_2: "彼の判断を受け入れる"
STR_INTERCEPT_TITLE_18: "矛盾"
STR_INTERCEPT_TEXT_18: "ハリスは、最初の回答を最新の回答の横に設定します。両方が真実であることはあり得ません。嘘を放棄することも、矛盾したまま面接を終了することもできます。"
STR_INTERCEPT_CHOICE_18_0: "脅迫について真実を話してください"
STR_INTERCEPT_CHOICE_18_1: "全てを否定し続ける"
STR_INTERCEPT_CHOICE_18_2: "離れてみてください"
STR_INTERCEPT_TITLE_19: "沈黙"
STR_INTERCEPT_TEXT_19: "あなたは腕を組みます。ハリスはファイルを閉じます。この部屋では、沈黙が調査を終了するわけではありません。それはそれを監督するというあなたの役割を終えるだけです。"
STR_INTERCEPT_CHOICE_19_0: "決定を聞く"
STR_INTERCEPT_TITLE_20: "割れたガラス"
STR_INTERCEPT_TEXT_20: "ペインが道を譲ります。冷たい空気と警備員の笛の音が同時に届く。誰かがドアに到着するまでに、1 つの決断を下す時間があります。"
STR_INTERCEPT_CHOICE_20_0: "外側の道を目指して走る"
STR_INTERCEPT_CHOICE_20_1: "コード化された手がかりを残してください"
STR_INTERCEPT_CHOICE_20_2: "留まって説明してください"
STR_INTERCEPT_TITLE_21: "小屋の間"
STR_INTERCEPT_TEXT_21: "道路が濡れています。フーパーの小屋は次のパトロールまでに行ける距離にありますが、その先にある開けた場所には別の種類のチャンスがあります。"
STR_INTERCEPT_CHOICE_21_0: "敷地内から逃げようとする"
STR_INTERCEPT_CHOICE_21_1: "フーパーの小屋に入る"
STR_INTERCEPT_CHOICE_21_2: "ハリスに戻る"
STR_INTERCEPT_TITLE_22: "プライベートゲーム"
STR_INTERCEPT_TEXT_22: "フーパーがあなたを研究しています。テーブルの上で、彼は指で想像上のチェスの位置を設定します。暗号化された答えによって、直接の告発では決して明かされないことを彼に明らかにさせることができるかもしれない。"
STR_INTERCEPT_CHOICE_22_0: "チェスのヒントで答えてください"
STR_INTERCEPT_CHOICE_22_1: "名前を付けると脅す"
STR_INTERCEPT_CHOICE_22_2: "正直に話してください"
STR_INTERCEPT_TITLE_23: "対面"
STR_INTERCEPT_TEXT_23: "フーパーは実際に何を証明できるかを尋ねます。彼の自信が揺らぐのは、彼の計画外の人が知ってはならない詳細をあなたが言及したときだけです。"
STR_INTERCEPT_CHOICE_23_0: "証拠を持って彼に立ち向かう"
STR_INTERCEPT_CHOICE_23_1: "コンポーネントを取引として提供する"
STR_INTERCEPT_CHOICE_23_2: "ブラフ"
STR_INTERCEPT_TITLE_24: "カップ"
STR_INTERCEPT_TEXT_24: "フーパーは水を持ってきますが、先にティーカップに手を伸ばします。そのカップを保管しておくことは、彼が提供する他のものを受け入れるよりも役立つかもしれません。"
STR_INTERCEPT_CHOICE_24_0: "カップを保管してください"
STR_INTERCEPT_CHOICE_24_1: "コートをもう一度チェックしてください"
STR_INTERCEPT_TITLE_25: "テストするものがあります"
STR_INTERCEPT_TEXT_25: "あなたはカップを保管し、ハリスに検査してもらうように頼みます。これはいよいよ物を付けた疑惑である。フーパー氏がそれを除去しようとしたことで、2 番目の有益な詳細が得られました。"
STR_INTERCEPT_CHOICE_25_0: "ハリスにカップを渡す"
STR_INTERCEPT_CHOICE_25_1: "フーパーと対決する"
STR_INTERCEPT_TITLE_26: "間違ったターゲット"
STR_INTERCEPT_TEXT_26: "あなたは証拠もなしにハリスを告発します。彼は容疑者が捜査官の信用を失墜させようとしているのを目にした。お茶に何が起こったにせよ、あなたのせいで彼はあなたのことを信じにくくなりました。"
STR_INTERCEPT_CHOICE_26_0: "インタビュー終了"
STR_INTERCEPT_TITLE_27: "アカウント全体"
STR_INTERCEPT_TEXT_27: "あなたは名前を付け、会議について説明します。ハリスは的確な質問をします。あなたが当惑しているのは本物ですが、彼が今確認できる詳細も同様です。"
STR_INTERCEPT_CHOICE_27_0: "彼にアカウントを確認させます"
STR_INTERCEPT_CHOICE_27_1: "フーパーを探すと申し出る"
STR_INTERCEPT_TITLE_28: "失敗したブラフ"
STR_INTERCEPT_TEXT_28: "ハリスは自信たっぷりな答えをもう十分に聞きました。フーパーも同じです。それでも、あなたの話に欠けている事実は明らかになりません。"
STR_INTERCEPT_CHOICE_28_0: "主張を続ける"
STR_INTERCEPT_CHOICE_28_1: "必死の逃走を図る"
STR_INTERCEPT_CHOICE_28_2: "実際に何が起こったかを認める"
STR_INTERCEPT_TITLE_29: "インターセプト"
STR_INTERCEPT_TEXT_29: "ポケットの中のシートには、ごちゃごちゃした文字以上のものが入っています。そのシートが小屋を通るルートで、フーパーは機械の近くに置かれます。簡潔な手がかりは、適切な人に適切な場所を見てもらうことができるかもしれません。"
STR_INTERCEPT_CHOICE_29_0: "Hooper へのメッセージをエンコードする"
STR_INTERCEPT_CHOICE_29_1: "ハリスまでのルートを表示"
STR_INTERCEPT_TITLE_30: "機械が動きます"
STR_INTERCEPT_TEXT_30: "ハリスは部品を持ち、あなたが怯えて最初に話した内容よりも先へ続く手がかりをつかんだ。ボンブは作業を再開する。あなたは自分の名で第14小屋を後にする。秘密は減ったが、未来にはまだ向き合わなければならない。"
STR_INTERCEPT_TITLE_31: "容疑中"
STR_INTERCEPT_TEXT_31: "部品を返したおかげで、機械の稼働の遅れは防げました。しかし、あなたの立場は守られませんでした。調査が続く間、ハリスはあなたを小屋から締め出します。尋問は乗り切りましたが、疑いは晴れていません。"
STR_INTERCEPT_TITLE_32: "拘留中"
STR_INTERCEPT_TEXT_32: "ドアはあなたではなく警備員のために開きます。矛盾、証拠の不足、コンポーネントの盗難などにより、もはや指示できない事件になっています。この試みはここで終わります。"
STR_INTERCEPT_TITLE_33: "外側の道"
STR_INTERCEPT_TEXT_33: "あなたは小屋を後にします。暗闇は便利ですが、敷地内は監視されています。割れた窓のせいで、パトロール隊が予想以上に近づいてきました。"
STR_INTERCEPT_CHOICE_33_0: "開けた地面を横切る"
STR_INTERCEPT_CHOICE_33_1: "サービスパスを走行してください"
STR_INTERCEPT_CHOICE_33_2: "振り返ってハリスの方を向く"
STR_INTERCEPT_TITLE_34: "フーパーズハット"
STR_INTERCEPT_TEXT_34: "デスクは無人です。クロスワードの下には書類があり、鉛筆で書かれたスケジュールの中に機械室が現れます。外の板に沿って足音が近づいてくる。"
STR_INTERCEPT_CHOICE_34_0: "論文を調べる"
STR_INTERCEPT_CHOICE_34_1: "フーパーを待つ"
STR_INTERCEPT_CHOICE_34_2: "ハリスに向けて出発"
STR_INTERCEPT_TITLE_35: "チェスの問題"
STR_INTERCEPT_TEXT_35: "あなたはフーパーに彼の苦境を反映するポジションを与えます：保護された駒、露出されたキング、そして応答まで安全に見える手。彼はその警告を理解しています。彼の次の言葉は、あなたが必要としていたつながりを提供します。"
STR_INTERCEPT_CHOICE_35_0: "彼に計画を認めるように頼む"
STR_INTERCEPT_CHOICE_35_1: "ハリスに入場許可を送る"
STR_INTERCEPT_TITLE_36: "マスクなし"
STR_INTERCEPT_TEXT_36: "あなたはプレッシャーが存在しなかったふりをするのではなく、プレッシャーについて話します。フーパーは対戦相手としてではなく、一人の人間として簡潔に答えた。その隙は取引や罠に利用される可能性がある。"
STR_INTERCEPT_CHOICE_36_0: "正直な取り決めを求める"
STR_INTERCEPT_CHOICE_36_1: "彼に告白するよう頼む"
STR_INTERCEPT_CHOICE_36_2: "アカウントをハリスに持って行きます"
STR_INTERCEPT_TITLE_37: "フーパーの入場"
STR_INTERCEPT_TEXT_37: "フーパーは、脅迫と不足しているコンポーネントを結びつけるのに十分な説明をします。ハリスは装備を回収してストーリーを確認できるようになりました。調査を終了するか、フーパーを失踪させるかを決定する必要があります。"
STR_INTERCEPT_CHOICE_37_0: "ハリスに入場許可を持ってくる"
STR_INTERCEPT_CHOICE_37_1: "フーパーを手放して去ってください"
STR_INTERCEPT_TITLE_38: "貿易"
STR_INTERCEPT_TEXT_38: "あなたはフーパーの手の届く範囲に最後のてこを置きます。証人や証拠のない取引は、あなたを犠牲にして彼の問題を解決するという誘いです。"
STR_INTERCEPT_CHOICE_38_0: "コンポーネントを引き渡します"
STR_INTERCEPT_CHOICE_38_1: "立会いによる合意を要求する"
STR_INTERCEPT_CHOICE_38_2: "オファーを撤回"
STR_INTERCEPT_TITLE_39: "ハリスが聞く"
STR_INTERCEPT_TEXT_39: "詳細が確認できます。ハリスはコンポーネントが今どこにあるのか尋ねます。アカウントのクリアとマシンの稼働は関連する問題ですが、同じものではありません。"
STR_INTERCEPT_CHOICE_39_0: "コートの中のものを返してください"
STR_INTERCEPT_CHOICE_39_1: "コンポーネントの回復を手伝ってください"
STR_INTERCEPT_CHOICE_39_2: "今すぐ応答を停止してください"
STR_INTERCEPT_TITLE_40: "フェンスの向こう"
STR_INTERCEPT_TEXT_40: "小屋はあなたの後ろに消えてしまいます。 庭の外の自由は無実と同じではありません、マシンは今誰かの緊急問題です。 あなたは逃げました、物語は未完です。"
STR_INTERCEPT_TITLE_41: "最後の間違い"
STR_INTERCEPT_TEXT_41: "オープングラウンドが終了する前にパトロール隊が到着するか、フーパーにとって役に立たなくなったときにフーパーの約束が崩れてしまいます。安全な動きがなくなりました。ストーリーを最初からやり直すことができます。"
STR_INTERCEPT_TITLE_42: "論文"
STR_INTERCEPT_TEXT_42: "スケジュールでは、フーパーはあなたの話にあった場所に配置されます。その横には、最初にあなたを罠に引き込んだメモがあります。この組み合わせは、ハリスが検証するのに十分なほど具体的です。"
STR_INTERCEPT_CHOICE_42_0: "書類をハリスに持って行きます"
STR_INTERCEPT_CHOICE_42_1: "待ってフーパーに立ち向かう"
STR_INTERCEPT_TITLE_43: "最後の取り決め"
STR_INTERCEPT_TEXT_43: "フーパーは部品を元に戻すと申し出ます。彼を信頼すれば、差し迫った問題が 1 つ解決されるでしょう。ハリスを証人にすれば、新たな証人を立てることが難しくなるだろう。"
STR_INTERCEPT_CHOICE_43_0: "立ち会いによる返却を手配する"
STR_INTERCEPT_CHOICE_43_1: "ハリスを計画に参加させる"
STR_INTERCEPT_TITLE_44: "リールの回収"
STR_INTERCEPT_TEXT_44: "アカウントが記録されているため、検索は失われたハードウェアに戻ります。あなたがコンポーネントをどこに置くべきかを特定している間、ハリスは機械室をチェックします。"
STR_INTERCEPT_CHOICE_44_0: "確認済み返品を完了する"
STR_INTERCEPT_CHOICE_44_1: "コートから取り出してください"
STR_INTERCEPT_CHOICE_44_2: "フーパーについてハリスに警告する"
STR_INTERCEPT_TITLE_45: "最後の質問"
STR_INTERCEPT_TEXT_45: "ハリスは待っています。フーパーを盗難に結び付けることができれば、コンポーネントを回復してこれを適切に終了する方法がまだあります。それ以外の場合、調査には変更中のアカウントのみが含まれます。"
STR_INTERCEPT_CHOICE_45_0: "証拠を提示する"
STR_INTERCEPT_CHOICE_45_1: "あなたにはもう何もないことを認める"
