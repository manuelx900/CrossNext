STR_UI_SWIPE_OR_TAP_AN_ARROW_TO_887004: "Deslize ou toque em uma seta para dirigir. Coma o alimento desenhado para crescer. Evite paredes e sua própria cauda. Você não pode reverter a direção. Toque em Pausa antes de colocar o leitor para baixo. Jogos salvos sempre retomem parado."
STR_UI_YOU_PLAY_BLACK_TAP_AN_EMPTY_29AEBA: "Você joga preto. Toque em um quadrado vazio que prende discos brancos em uma linha reta. Todos os discos presos giram para a sua cor. O dispositivo joga branco. Se um lado não tiver nenhum movimento legal, ele passa automaticamente. A maioria dos discos ganha quando ambos os lados não podem se mover."
STR_UI_MAKE_ONE_CLOSED_LOOP_EACH_NUMBER_D60227: "Faça um loop fechado. Cada número diz quantas de suas quatro bordas pertencem ao loop. Toque perto de uma borda para a linha do ciclo, cruzamento e vazio. Linhas não podem ramificar ou formar loop separados. Todas as pistas devem coincidir. Qualquer solução válida é aceita."
STR_UI_CONNECT_ALL_ISLANDS_IN_ONE_NETWORK_C5618B: "Conecte todas as ilhas em uma única rede. O número de uma ilha é o número de pontes exigido. Toque em duas ilhas vizinhas na mesma linha ou coluna para rodar uma, duas e zero pontes. As pontes não podem saltar sobre ilhas. Qualquer solução conectada que corresponda a todos os números vence."
