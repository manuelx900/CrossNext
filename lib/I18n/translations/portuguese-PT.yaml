STR_CAR_INTRO: "Culpa e honestidade são independentes. Cada caso tem exatamente uma solução. Alturas são traços de personagem fictícios."
STR_CAR_HELP_TEXT: "COMO RESOLVER UM CASO\nCada personagem faz uma declaração. O topo da tela dá o número exato de culpados e falsas declarações. Encontre uma combinação que satisfaça ambas as contagens. Cada caso tem uma solução.\n  \nCulpa Não É Honestidade\nUm personagem inocente pode mentir, e um culpado pode dizer a verdade. Duas mentiras significa que exatamente duas declarações inteiras são falsas; as outras são verdadeiras. Marcas de Verdade / Mentira se referem à declaração; Suspeito se refere à culpa.\n  \nLer as pistas\n\"A ou B fez isso (ou ambos)\" significa que pelo menos um personagem nomeado é culpado. \"A e B fizeram isso\" requer ambos. Uma mentira nega toda a declaração: um falso OR significa que nenhum dos dois fez isso; um falso AND significa que pelo menos um não fez.\n  \n\"Ambos verdadeiros ou ambos mentindo\" compara declarações, não culpa. \"Exatamente um está mentindo\" significa que suas declarações têm diferentes valores de verdade. Essas pistas podem ser verdadeiras ou falsas.\n  \nVizinhos em uma tela pequena\nA ordem circular original é Panther, Peacock, Shark, Fox, Bear, Stag, Horse, usando apenas os caracteres deste caso. O último e o primeiro são vizinhos. Este aplicativo escreve os dois nomes diretamente em cada pista vizinho. Você nunca precisa adivinhar quais cartões estão ao lado de um retrato. Mudar a página ou orientação não muda uma pista.\n  \nAltura e dieta\nCada cartão mostra uma altura e dieta fictícias. \"Um culpado é mais alto do que eu\" significa que pelo menos um culpado é mais alto do que o falante, não necessariamente todos os culpados. Menores funcionam da mesma maneira. Carnívoros e herbívoros significam que pelo menos um culpado tem essa dieta; omnívoros contam como nenhum dos dois. Nomes, alturas e dietas são fatos confiáveis; declarações podem mentir.\n  \nSUA ANÁLISE\nUse ? / Verdade / Mentira e Suspeito sob cada declaração para registrar hipóteses. Estas são suas anotações, não evidências ou verificações automáticas. As setas mostram os outros caracteres. O modo retrato exibe até três por página.\n  \nFazendo uma acusação\nPressione Acuse e selecione exatamente o número necessário de culpados. Apenas confirmar uma acusação errada gasta uma vida. Iniciante e Normal têm duas vidas; Avançado e Especialista tem uma. Uma acusação correta resolve o caso. Sem vidas restantes, a solução é revelada.\n  \nCampanha e Repetição\nHá 1.470 casos. Caso Aberto retoma a tentativa atual ou abre o próximo após um fechado. Campanha permite que você escolha qualquer um dos 1.470 casos em qualquer ordem desde o início. Replay inicia uma nova tentativa, preservando a conclusão anterior. Dentro de cada dificuldade, os casos progridem de um culpado para dois, depois de menos mentirosos para mais dentro de cada grupo culpado. Iniciante mantém um culpado. Lançamentos menores vêm primeiro quando as contagens coincidem. Todos os casos permanecem disponíveis. Resolver um caso anteriormente esgotado atualiza-o para resolvido.\n  \nO progresso e as vidas são salvos no cartão SD. Sair, dormir ou reiniciar um dispositivo não restaura vidas na tentativa atual. Um salvamento com falha bloqueia o resultado até que Tente novamente seja bem-sucedido. Redefinir tudo pede confirmação antes de apagar apenas o progresso do Carnivore."
