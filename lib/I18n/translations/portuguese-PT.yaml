STR_WORDLE_INSTRUCTIONS: "Adivinhe a palavra escondida em 6 tentativas. Introduza uma palavra válida e confirme para ver o resultado. Uma palavra que falte na lista de palavras não exige tentativa; edite-o e tente novamente. Preto significa que a letra e a sua posição estão corretas. Cinzento significa que a letra está na palavra, mas numa posição diferente. Branco significa que a letra está ausente. As letras repetidas são contadas separadamente. Em espanhol, utilize Ñ e escreva vogais acentuadas sem acentos."
