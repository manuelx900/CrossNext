STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "O início da aventura"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Durante muitos anos as pessoas viveram em paz e desfrutaram dos seus livros. Então o Rei do Esquecimento começou a destruí-los. Queria impedir que todos lessem e fazer com que todas as histórias desaparecessem para sempre."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Os monstros do rei"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "O Rei do Esquecimento enviou os seus monstros por todo o mundo. Destruíram todos os livros que encontraram e atacaram quem tentasse detê-los. As bibliotecas começaram a desaparecer e as pessoas deixaram de ler."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "O poder da leitura"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Um dia, enquanto lês perto da tua aldeia, aparece um monstro. Tenta fugir, mas algo surpreendente acontece: quanto mais se lê, mais fraco se fica. Percebes que ler é a única forma de combater a magia do rei."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "A sua missão"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Decidiste deter o rei. No caminho para o seu castelo terá de atravessar florestas, cidades, montanhas e outros locais repletos de inimigos. Cada monstro que derrotas leva-te um pouco mais perto. Continue a ler, derrote os seus guardiões e alcance-o antes que destrua todos os livros do mundo."
