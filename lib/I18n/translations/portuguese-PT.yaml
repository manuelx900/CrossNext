STR_FLASHCARDS_HELP: "Copiar baralhos Anki (.apkg /.colpkg , .anki2 /.anki21 ), CSV /TSV/text ou converter pastas de estudo para /FLASHCARDS. Utilizar subpastas: até 128 itens cada.\n\nImports aceita cartões de texto cloze básicos, invertidos e simples. Áudio e HTML personalizado não são suportados. Converta primeiro os baralhos de imagem /CJK. As avaliações offline usam FSRS. A importação inicia uma nova programação e mantém os originais."
