STR_INTERCEPT_TITLE_0: "CASA 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942.Estão esperando por você atrás de uma porta trancada. Um componente da máquina de cálculo desapareceu.A manhã intercepta as baratas no bolso do seu casaco.Fora, os passos param."
STR_INTERCEPT_CHOICE_0_0: "Pense através da acusação"
STR_INTERCEPT_CHOICE_0_1: "Aguarde o entrevistador"
STR_INTERCEPT_CHOICE_0_2: "Encontre o seu casaco"
STR_INTERCEPT_TITLE_1: "A acusação"
STR_INTERCEPT_TEXT_1: "Eles suspeitam de traição. Você resolve figuras, palavras cruzadas e posições de xadrez para uma sobrevivência.Esta sala é outro problema: contradiz a si mesmo, e sua credibilidade pode ser a primeira vítima."
STR_INTERCEPT_CHOICE_1_0: "Escolha uma estratégia"
STR_INTERCEPT_CHOICE_1_1: "Ouça o que eles sabem"
STR_INTERCEPT_TITLE_2: "Harry chega"
STR_INTERCEPT_TEXT_2: "Harris entra com uma xícara de chá e um arquivo. Um rolo está faltando da Bombe. O seu nome estava na lista de tarefas. Ele coloca a xícara ao seu lado e pergunta onde você esteve ontem à noite."
STR_INTERCEPT_CHOICE_2_0: "Beba o chá"
STR_INTERCEPT_CHOICE_2_1: "Deixe o chá intacto"
STR_INTERCEPT_CHOICE_2_2: "Responda com calma"
STR_INTERCEPT_TITLE_3: "O Componente"
STR_INTERCEPT_TEXT_3: "Dentro do revestimento de seu casaco, seus dedos encontram metal frio. O componente ainda está lá. Hooper disse que tomá-lo faria parar a chantagem."
STR_INTERCEPT_CHOICE_3_0: "Mantenha oculto"
STR_INTERCEPT_CHOICE_3_1: "Dê uma mão a Harris"
STR_INTERCEPT_TITLE_4: "Um jogo vencedor"
STR_INTERCEPT_TEXT_4: "A cooperação pode preservar a sua credibilidade. Uma mentira convincente pode comprar tempo. Escape trocaria uma sala trancada para os guardas do lado de fora. Nenhum desses movimentos pode ser retomado."
STR_INTERCEPT_CHOICE_4_0: "Cooperação"
STR_INTERCEPT_CHOICE_4_1: "Criando um alibi"
STR_INTERCEPT_CHOICE_4_2: "Examine a janela"
STR_INTERCEPT_TITLE_5: "O chá"
STR_INTERCEPT_TEXT_5: "Harris percebe o seu silêncio, mas seu rosto já está se retirando.Quando você abre os olhos, outro par de sapatos fica à mesa."
STR_INTERCEPT_CHOICE_5_0: "Fingindo ficar adormecido"
STR_INTERCEPT_CHOICE_5_1: "Confronto com o visitante"
STR_INTERCEPT_CHOICE_5_2: "Peça água"
STR_INTERCEPT_TITLE_6: "Uma pequena rejeição"
STR_INTERCEPT_TEXT_6: "Você empurra a taça para longe.Harris observa o movimento mais de perto do que a resposta.Ele pergunta se há alguém que ele deveria estar questionando."
STR_INTERCEPT_CHOICE_6_0: "Pergunte a ele quais as provas"
STR_INTERCEPT_CHOICE_6_1: "Conheça o Hooper"
STR_INTERCEPT_CHOICE_6_2: "Olhe para a janela"
STR_INTERCEPT_TITLE_7: "A verdadeira falta"
STR_INTERCEPT_TEXT_7: "Harris quer uma resposta direta. - Você tomou o componente? - Você pode dizer-lhe o que está em seu casaco, explicar a pressão aplicada por Hooper ou tentar apontar a acusação em outro lugar."
STR_INTERCEPT_CHOICE_7_0: "Dê-lhe o componente"
STR_INTERCEPT_CHOICE_7_1: "Explique a chantagem"
STR_INTERCEPT_CHOICE_7_2: "Acusação de Hooper"
STR_INTERCEPT_TITLE_8: "Metal na mesa"
STR_INTERCEPT_TEXT_8: "O componente está entre você. Harris verifica-o sem relaxar. Devolver equipamentos roubados não explica por que foi levado. Ele quer um nome e algo mais confiável do que sua palavra."
STR_INTERCEPT_CHOICE_8_0: "Oferta para encontrar provas"
STR_INTERCEPT_CHOICE_8_1: "Fique e responda a perguntas"
STR_INTERCEPT_TITLE_9: "O Alibi"
STR_INTERCEPT_TEXT_9: "Você descreve uma noite tranquila em sua mesa.Harris abre o arquivo.Um guarda viu você deixando a sala de máquinas."
STR_INTERCEPT_CHOICE_9_0: "Defende a História"
STR_INTERCEPT_CHOICE_9_1: "Conheça a chantagem"
STR_INTERCEPT_CHOICE_9_2: "Rejeitar mais perguntas"
STR_INTERCEPT_TITLE_10: "A janela"
STR_INTERCEPT_TEXT_10: "A janela é alta e o vidro é espesso.Além disso, o caminho passa por outra cabana.Quebrá-lo seria alto; esperando aqui tem seus próprios perigos."
STR_INTERCEPT_CHOICE_10_0: "Quebrar o vidro"
STR_INTERCEPT_CHOICE_10_1: "Estude o caminho do exterior"
STR_INTERCEPT_CHOICE_10_2: "Voltar para a entrevista"
STR_INTERCEPT_TITLE_11: "Mais um visitante"
STR_INTERCEPT_TEXT_11: "Hooper veio enquanto você está instável. Ele quer saber se Harris tem o componente. Ele mantém uma mão perto da porta."
STR_INTERCEPT_CHOICE_11_0: "Fingindo dormir"
STR_INTERCEPT_CHOICE_11_1: "Solicite uma explicação"
STR_INTERCEPT_CHOICE_11_2: "Peça água"
STR_INTERCEPT_TITLE_12: "Uma advertência"
STR_INTERCEPT_TEXT_12: "Você chama Harris antes que o chá fique preso. Ele retorna, irritado. Uma acusação sobre a xícara precisará de algo que ele possa testar."
STR_INTERCEPT_CHOICE_12_0: "Mantenha a taça como prova"
STR_INTERCEPT_CHOICE_12_1: "Acusa Harris de te envenenar"
STR_INTERCEPT_CHOICE_12_2: "Concentre-se no real"
STR_INTERCEPT_TITLE_13: "Esperança"
STR_INTERCEPT_TEXT_13: "Harris reconhece o nome. Hooper é útil, bem conectado e não ausente da lista de ontem à noite também."
STR_INTERCEPT_CHOICE_13_0: "Encontre algo verificável"
STR_INTERCEPT_CHOICE_13_1: "Insistindo que Hooper roubou"
STR_INTERCEPT_TITLE_14: "Blackmail"
STR_INTERCEPT_TEXT_14: "Você descreve um jovem, uma confiança traída e a demanda que se seguiu.Harris escuta sem ajudá-lo.Nomear a pessoa que colocou a armadilha também poderia expor a pessoa que você esperava proteger."
STR_INTERCEPT_CHOICE_14_0: "Dê a Harris a conta completa"
STR_INTERCEPT_CHOICE_14_1: "Deixe os nomes fora"
STR_INTERCEPT_CHOICE_14_2: "Propor uma maneira de pegar Hooper"
STR_INTERCEPT_TITLE_15: "Uma acusação fácil"
STR_INTERCEPT_TEXT_15: "Hooper, você diz, deve ser responsável.Harris pergunta como você sabe.Há uma diferença entre resolver um problema e produzir uma testemunha que possa provar a resposta."
STR_INTERCEPT_CHOICE_15_0: "Que Harris desafie a alegação"
STR_INTERCEPT_CHOICE_15_1: "Envie uma mensagem privada para Hooper"
STR_INTERCEPT_TITLE_16: "Um teste de chave"
STR_INTERCEPT_TEXT_16: "Uma história pode ser negada.Um documento, uma testemunha ou o componente faltante é mais difícil de explicar."
STR_INTERCEPT_CHOICE_16_0: "Verifique a cabine próxima"
STR_INTERCEPT_CHOICE_16_1: "Use o intercepto da manhã"
STR_INTERCEPT_CHOICE_16_2: "Pergunta Hooper diretamente"
STR_INTERCEPT_TITLE_17: "Mais do que um retorno"
STR_INTERCEPT_TEXT_17: "A máquina pode funcionar novamente, mas Harris ainda tem uma violação de segurança para explicar."
STR_INTERCEPT_CHOICE_17_0: "Mostre as evidências"
STR_INTERCEPT_CHOICE_17_1: "Procure por provas"
STR_INTERCEPT_CHOICE_17_2: "Aceite o seu julgamento"
STR_INTERCEPT_TITLE_18: "Uma contradição"
STR_INTERCEPT_TEXT_18: "Harris coloca sua primeira resposta ao lado de sua última.Eles não podem ser ambos verdadeiros.Você pode abandonar a mentira, ou deixar a entrevista terminar em uma contradição."
STR_INTERCEPT_CHOICE_18_0: "Diga a verdade sobre chantagem"
STR_INTERCEPT_CHOICE_18_1: "Continua negando tudo"
STR_INTERCEPT_CHOICE_18_2: "Tente sair"
STR_INTERCEPT_TITLE_19: "Silêncio"
STR_INTERCEPT_TEXT_19: "Harris fecha o arquivo.Nessa sala, o silêncio não termina a investigação; ele só acaba com sua parte na direção dela."
STR_INTERCEPT_CHOICE_19_0: "Ouça a decisão"
STR_INTERCEPT_TITLE_20: "Quebrado vidro"
STR_INTERCEPT_TEXT_20: "O ar frio e o som do sussurro de um guarda chegam juntos.Há tempo para uma decisão antes que alguém chegue à porta."
STR_INTERCEPT_CHOICE_20_0: "Correr pelo caminho exterior"
STR_INTERCEPT_CHOICE_20_1: "Deixe um Coloquio Codificado"
STR_INTERCEPT_CHOICE_20_2: "Fique e explique"
STR_INTERCEPT_TITLE_21: "Entre as cabines"
STR_INTERCEPT_TEXT_21: "A cabana de Hooper está perto o suficiente para chegar antes da próxima patrulha, mas o terreno aberto além oferece um tipo diferente de oportunidade."
STR_INTERCEPT_CHOICE_21_0: "Tente fugir dos motivos"
STR_INTERCEPT_CHOICE_21_1: "Entrar na Cabana de Hooper"
STR_INTERCEPT_CHOICE_21_2: "Voltar para Harris"
STR_INTERCEPT_TITLE_22: "Um jogo privado"
STR_INTERCEPT_TEXT_22: "Hooper estuda você.Na mesa ele estabelece uma posição de xadrez imaginária com os dedos.Uma resposta codificada poderia fazê-lo revelar o que uma acusação direta nunca faria."
STR_INTERCEPT_CHOICE_22_0: "Responder com um chess clue"
STR_INTERCEPT_CHOICE_22_1: "Ameaça de nomeá-lo"
STR_INTERCEPT_CHOICE_22_2: "Fale honestamente"
STR_INTERCEPT_TITLE_23: "Face a face"
STR_INTERCEPT_TEXT_23: "Hooper pergunta o que você realmente pode provar.A sua confiança só falha quando você menciona detalhes que alguém fora de seu plano não deveria saber."
STR_INTERCEPT_CHOICE_23_0: "Confronte-o com a prova"
STR_INTERCEPT_CHOICE_23_1: "Oferecer o componente como um comércio"
STR_INTERCEPT_CHOICE_23_2: "Bluffão"
STR_INTERCEPT_TITLE_24: "A Taça"
STR_INTERCEPT_TEXT_24: "Hooper traz água, mas chega primeiro para a xícara de chá."
STR_INTERCEPT_CHOICE_24_0: "Mantenha a Taça"
STR_INTERCEPT_CHOICE_24_1: "Verifique seu casaco novamente"
STR_INTERCEPT_TITLE_25: "Algo para testar"
STR_INTERCEPT_TEXT_25: "Você mantém o copo e pede a Harris para examiná-lo.Esta é finalmente uma alegação com um objeto anexado a ele.A tentativa de Hooper de removê-lo fornece um segundo detalhe útil."
STR_INTERCEPT_CHOICE_25_0: "Dê a Harris a Taça"
STR_INTERCEPT_CHOICE_25_1: "Confrontar Hooper com ele"
STR_INTERCEPT_TITLE_26: "O alvo errado"
STR_INTERCEPT_TEXT_26: "Você acusa Harris sem provas. ele vê um suspeito tentando desacreditar o investigador. O que quer que tenha acontecido com o chá, você tornou mais difícil para ele acreditar em você."
STR_INTERCEPT_CHOICE_26_0: "A entrevista termina"
STR_INTERCEPT_TITLE_27: "Toda a conta"
STR_INTERCEPT_TEXT_27: "Você dá os nomes e descreve a reunião. Harris faz perguntas precisas. Sua vergonha é real, mas também são os detalhes que ele agora pode verificar."
STR_INTERCEPT_CHOICE_27_0: "Deixe que ele verifique a conta"
STR_INTERCEPT_CHOICE_27_1: "Procurando por um Hooper"
STR_INTERCEPT_TITLE_28: "Uma fraude fracassada"
STR_INTERCEPT_TEXT_28: "Harris ouviu respostas confiantes o suficiente. Hooper também tem. Nem fornece o fato de que sua história está faltando."
STR_INTERCEPT_CHOICE_28_0: "Persiste na reivindicação"
STR_INTERCEPT_CHOICE_28_1: "Faça uma fuga desesperada"
STR_INTERCEPT_CHOICE_28_2: "Reconheça o que realmente aconteceu"
STR_INTERCEPT_TITLE_29: "O Interceptar"
STR_INTERCEPT_TEXT_29: "A folha no seu bolso carrega mais do que letras: sua rota através das cabanas coloca Hooper perto da máquina."
STR_INTERCEPT_CHOICE_29_0: "Codificar uma mensagem para Hooper"
STR_INTERCEPT_CHOICE_29_1: "Mostrar a rota para Harris"
STR_INTERCEPT_TITLE_30: "A máquina corre"
STR_INTERCEPT_TEXT_30: "Harris tem o componente, e uma trilha que leva além de suas primeiras respostas assustadas.The Bombe retoma seu trabalho.Você deixa Hut 14 sob seu próprio nome, com menos segredos e um futuro ainda para responder."
STR_INTERCEPT_TITLE_31: "Sob suspeita"
STR_INTERCEPT_TEXT_31: "Devolver o componente salvou a máquina de um atraso. Não salvou sua posição. Harris encerra seu acesso às cabanas enquanto a investigação continua. Você sobreviveu à entrevista, mas não apagou seu nome."
STR_INTERCEPT_TITLE_32: "em custódia"
STR_INTERCEPT_TEXT_32: "As contradições, a falta de provas e um componente roubado tornaram-se um caso que você não pode mais direcionar."
STR_INTERCEPT_TITLE_33: "O caminho exterior"
STR_INTERCEPT_TEXT_33: "Você deixa as cabanas para trás.A escuridão é útil, mas os terrenos são vigiados.Uma janela quebrada trouxe as patrulhas mais perto do que você esperava."
STR_INTERCEPT_CHOICE_33_0: "Atravessando o terreno aberto"
STR_INTERCEPT_CHOICE_33_1: "Siga o caminho do serviço"
STR_INTERCEPT_CHOICE_33_2: "Volte e faça face a Harris"
STR_INTERCEPT_TITLE_34: "A Cabana de Hooper"
STR_INTERCEPT_TEXT_34: "A mesa está desatendida. Os papéis ficam debaixo de uma palavra-cruz, e a sala da máquina aparece em um cronograma de lápis."
STR_INTERCEPT_CHOICE_34_0: "Examine os papéis"
STR_INTERCEPT_CHOICE_34_1: "Aguardando o Hooper"
STR_INTERCEPT_CHOICE_34_2: "Deixar o Harris"
STR_INTERCEPT_TITLE_35: "Um problema de xadrez"
STR_INTERCEPT_TEXT_35: "Você dá a Hooper uma posição que reflete sua situação: um pedaço protegido, um rei exposto e um movimento que parece seguro até a resposta."
STR_INTERCEPT_CHOICE_35_0: "Peça a ele para admitir o plano"
STR_INTERCEPT_CHOICE_35_1: "Envie a admissão para Harris"
STR_INTERCEPT_TITLE_36: "Sem máscara"
STR_INTERCEPT_TEXT_36: "Você fala sobre a pressão em vez de fingir que nunca existiu. Hooper responde brevemente como uma pessoa em vez de um oponente."
STR_INTERCEPT_CHOICE_36_0: "Solicite um acordo honesto"
STR_INTERCEPT_CHOICE_36_1: "Peça para confessar"
STR_INTERCEPT_CHOICE_36_2: "Faça a conta para o Harris"
STR_INTERCEPT_TITLE_37: "A admissão de Hooper"
STR_INTERCEPT_TEXT_37: "Hooper explica o suficiente para conectar a chantagem ao componente perdido.Harris agora pode recuperar o equipamento e verificar a história.Você deve decidir se terminar a investigação ou deixar Hooper desaparecer."
STR_INTERCEPT_CHOICE_37_0: "Traga Harris a admissão"
STR_INTERCEPT_CHOICE_37_1: "Deixe o Hooper ir e sair"
STR_INTERCEPT_TITLE_38: "O comércio"
STR_INTERCEPT_TEXT_38: "Você coloca sua última alavancagem dentro do alcance de Hooper.Um acordo sem testemunhas ou provas é um convite para ele resolver seu problema à sua custa."
STR_INTERCEPT_CHOICE_38_0: "A mão sobre o componente"
STR_INTERCEPT_CHOICE_38_1: "Solicite um acordo testemunhado"
STR_INTERCEPT_CHOICE_38_2: "Retirar a oferta"
