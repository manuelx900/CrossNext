STR_INTERCEPT_ABOUT: "Uma adaptação condensada de The Intercept by inkle, 2016, usada sob a licença MIT. Bletchley Park, 1942: um componente de máquina perdido, chantagem e uma entrevista que pode terminar em liberdade ou custódia.\n\nSuas decisões e posições são salvas depois de cada escolha. Uma nova história reseta esta jogabilidade. As ilustrações originais foram criadas para este firmware. O script original e a licença estão incluídos no projeto."
