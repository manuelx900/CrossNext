STR_CAR_INTRO: "A bűntudat és az őszinteség függetlenek. Minden esetben pontosan egy megoldás van."
STR_CAR_HELP_TEXT: "Hogyan oldjunk meg egy esetet?\nMinden karakter egy állítást tesz. A képernyő tetején látható a bűnösök és hamis állítások pontos száma. Találj olyan kombinációt, amely mindkét számnak megfelel. Minden esetben van egy megoldás.\n  \nA bűntudat nem őszinteség\nKét hazugság azt jelenti, hogy pontosan két teljes kijelentés hamis; a többi igaz. Az igazság / hazugság jelek a kijelentésre vonatkoznak; a gyanúsított a bűnösségre utal.\n  \nA nyomok olvasása\nAz \"A vagy B tette (vagy mindkettő)\" azt jelenti, hogy legalább egy megnevezett személy bűnös. Az \"A és B tette\" mindkettőt igényli. A hazugság tagadja az egész állítást: a hamis VAGY azt jelenti, hogy egyikük sem tette; a hamis ÉS azt jelenti, hogy legalább egyikük nem tette.\n  \nA „mindketten igazat mondanak vagy mindketten hazudnak” állítások összehasonlítása, nem bűnösség. „Pontosan az egyik hazudik” azt jelenti, hogy a kijelentéseiknek különböző igazságértéke van. Ezek a nyomok maguk is lehetnek igazak vagy hamisak.\n  \nSzomszédok a kis képernyőn\nAz eredeti körkörös sorrend a Párduc, Páva, Cápa, Róka, Medve, Szarvas, Ló, csak ebben az esetben a karakterek használatával. Az utolsó és az első szomszédok. Ez az alkalmazás írja a két nevet közvetlenül minden szomszéd nyom. Soha nem kell kitalálni, melyik kártyák mellett egy portré.\n  \nMagasság és táplálkozás\nMinden kártya egy fiktív magasságot és táplálkozást mutat. \"A bűnös magasabb, mint én\" azt jelenti, hogy legalább egy bűnös magasabb, mint a beszélő, nem feltétlenül az összes bűnös. A rövidebb ugyanúgy működik. A húsevő és növényevő nyomok azt jelentik, hogy legalább egy bűnösnek van ilyen étrendje; a mindenevők egyik sem számítanak. A nevek, magasságok és étrend megbízható tények; az állítások hazudni tudnak.\n  \nAz Ön elemzése\nHasználd a ? / Igaz / Hazug és a Gyanús jeleket az egyes kijelentések alatt a hipotézisek feljegyzéséhez. Ezek a jegyzetek, nem bizonyítékok vagy automatikus ellenőrzések. A nyilak mutatják a többi karaktert. Portré módban oldalanként legfeljebb három jelenik meg.\n  \nA vádirat benyújtása\nNyomja meg az Accuse gombot és válassza ki pontosan a szükséges számú bűnöst. Csak egy rossz vád megerősítése egy életet vesz igénybe. A kezdőnek és a normálnak két élete van; a haladónak és a szakértőnek egy. A helyes vád megoldja az ügyet. Ha nincs több élet, feltárul a megoldás.\n  \nKampány és visszajátszás\n1470 eset van. A nyitott eset folytatja az aktuális kísérletet, vagy megnyitja a következőt egy lezárt után. A hadjárat lehetővé teszi, hogy bármelyik 1470 eset közül választhasson az elejétől kezdve bármilyen sorrendben. Az újrajátszás új kísérletet indít, miközben megőrzi a korábbi befejezést. Minden nehézségi szinten az esetek előrehaladnak egy bűnöstől kettőig, majd kevesebb hazugtól többig minden bűnös csoporton belül. A kezdő megtart egy bűnöst. Kisebb varázslatok jönnek először, amikor a számok megegyeznek. Az összes eset elérhető marad. Egy korábban kimerült eset megoldása megoldotttá válik.\n  \nAz előrehaladás és az életek mentésre kerülnek az SD kártyára. A kilépés, alvás vagy a készülék újraindítása nem állítja vissza az életeket az aktuális kísérletben. A sikertelen mentés blokkolja az eredményt, amíg a Retry sikeres."
