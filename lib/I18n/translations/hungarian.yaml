STR_QUEST_CAM_DECOR_TEXT_11: "Az első helyreállított csillag megvilágítja az utat az utolsó oldalak felé."
STR_QUEST_CAM_DECOR_NAME_12: "Olvasáscsíra"
STR_QUEST_CAM_DECOR_TEXT_12: "Kis növény egy csendes olvasósarok számára."
STR_QUEST_CAM_DECOR_NAME_13: "Mentett könyvek"
STR_QUEST_CAM_DECOR_TEXT_13: "A következő olvasójukra váró történetek."
STR_QUEST_CAM_DECOR_NAME_14: "Vándorzászló"
STR_QUEST_CAM_DECOR_TEXT_14: "Egy zászló, amely emlékezni fog minden új kezdetre."
STR_QUEST_CAM_DECOR_NAME_15: "Holdgomba"
STR_QUEST_CAM_DECOR_TEXT_15: "Egy kis darab az erdőből az otthonodba."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "A kaland kezdete"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "Az emberek sok éven át békében éltek, és élvezték a könyveiket. Aztán a feledés királya elkezdte elpusztítani őket. Mindenkit meg akart akadályozni az olvasástól, és minden történetet örökre eltűntetni akart."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "A király szörnyei"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "Az Oblivion királya a világ minden tájára küldte szörnyeit. Megsemmisítettek minden könyvet, amit találtak, és megtámadtak mindenkit, aki megpróbálta megállítani őket. A könyvtárak kezdtek eltűnni, és az emberek abbahagyták az olvasást."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Az olvasás ereje"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "Egy nap, miközben a falud közelében olvasol, megjelenik egy szörny. Próbálsz megszökni, de valami meglepő történik: minél többet olvasol, annál gyengébb lesz. Tudod, hogy az olvasás az egyetlen módja annak, hogy harcolj a király varázslatával."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "A küldetésed"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Elindultál, hogy megállítsd a királyt. A kastély felé vezető úton erdőkön, városokon, hegyeken és más ellenségekkel teli helyeken kell átkelnie. Minden szörny, amit legyőztél, egy kicsit közelebb visz. Olvass tovább, győzd le a védőit, és érd el, mielőtt a világ minden könyvét elpusztítja."
