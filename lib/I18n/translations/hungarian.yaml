STR_INTERCEPT_TITLE_0: "Székesfehérvár 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. Ők várnak a zárva lévő ajtó mögött. A számológép egyik része eltűnt. Reggel a kabátod zsebében elkapja a rácsokat. Kívülről megállnak a lépések."
STR_INTERCEPT_CHOICE_0_0: "Gondolj a vádakra"
STR_INTERCEPT_CHOICE_0_1: "Várja az interjút"
STR_INTERCEPT_CHOICE_0_2: "Keresse meg a kabátját"
STR_INTERCEPT_TITLE_1: "A vád"
STR_INTERCEPT_TEXT_1: "Ők gyanítják az árulást. Megoldja a számokat, keresztrejtvényeket és sakkozási pozíciókat egy életért. Ez a szoba egy másik probléma: ellentmond magadnak, és a hitelességed lehet az első áldozat."
STR_INTERCEPT_CHOICE_1_0: "Válasszon stratégiát"
STR_INTERCEPT_CHOICE_1_1: "Hallgassátok meg, amit tudnak"
STR_INTERCEPT_TITLE_2: "Harris megérkezett"
STR_INTERCEPT_TEXT_2: "Harris belép egy csésze teával és egy fájllal. Egy tekercs hiányzik a Bombából. A neved a feladatlistán volt. Ő helyezi el a pohár melletted, és megkérdezi, hol voltál tegnap este."
STR_INTERCEPT_CHOICE_2_0: "Igyál teát"
STR_INTERCEPT_CHOICE_2_1: "A teát érintetlenül hagyjuk"
STR_INTERCEPT_CHOICE_2_2: "Nyugodtan válaszoljon"
STR_INTERCEPT_TITLE_3: "Az összetevő"
STR_INTERCEPT_TEXT_3: "A kabátod burkolatánál az ujjaid hideg fémnel találkoznak. Az alkatrész még mindig ott van. Hooper azt mondta, hogy a zsarolás megállna."
STR_INTERCEPT_CHOICE_3_0: "Tartsa elrejtve"
STR_INTERCEPT_CHOICE_3_1: "Adja meg Harrisnek"
STR_INTERCEPT_TITLE_4: "Egy győztes játék"
STR_INTERCEPT_TEXT_4: "Az együttműködés megőrizheti hitelességét. Egy meggyőző hazugság időt vásárolhat. A menekülés egy zárolt helyiséget cserélne a külső őrök számára."
STR_INTERCEPT_CHOICE_4_0: "Együttműködés"
STR_INTERCEPT_CHOICE_4_1: "Találjon alibi"
STR_INTERCEPT_CHOICE_4_2: "Vizsgálja meg az ablak"
STR_INTERCEPT_TITLE_5: "A tea"
STR_INTERCEPT_TEXT_5: "Harris észreveszi a csendet, de az arca már visszahúzódik.Amikor legközelebb kinyitod a szemed, egy másik pár cipő áll az asztalnál."
STR_INTERCEPT_CHOICE_5_0: "Úgy tesz, mintha aludt volna"
STR_INTERCEPT_CHOICE_5_1: "Összehasonlítva a látogatót"
STR_INTERCEPT_CHOICE_5_2: "Kérjen vizet"
STR_INTERCEPT_TITLE_6: "Egy kis elutasítás"
STR_INTERCEPT_TEXT_6: "Harris közelebbről figyeli a mozgást, mint a választ. megkérdezi, van-e valaki más, akit megkérdőjeleznie kellene."
STR_INTERCEPT_CHOICE_6_0: "Kérdezd meg, milyen bizonyítékokkal rendelkezik"
STR_INTERCEPT_CHOICE_6_1: "Hooper megemlítése"
STR_INTERCEPT_CHOICE_6_2: "Nézd az ablakot"
STR_INTERCEPT_TITLE_7: "A hiányzó valóság"
STR_INTERCEPT_TEXT_7: "Harris közvetlen választ szeretne. - Vetted a komponenst? - Megmondhatod neki, mi van a kabátodban, elmagyarázhatod Hooper nyomását, vagy megpróbálhatod máshol megmutatni a vádat."
STR_INTERCEPT_CHOICE_7_0: "Adja meg az összetevőt"
STR_INTERCEPT_CHOICE_7_1: "A zsarolás magyarázata"
STR_INTERCEPT_CHOICE_7_2: "Hooper vádja"
STR_INTERCEPT_TITLE_8: "Fémek az asztalon"
STR_INTERCEPT_TEXT_8: "Harris nyugodtan ellenőrzi. az ellopott berendezések visszaküldése nem magyarázza meg, hogy miért vették el. névre és valami megbízhatóbbra vágyik, mint a szava."
STR_INTERCEPT_CHOICE_8_0: "Ajánlat a bizonyítékok megtalálására"
STR_INTERCEPT_CHOICE_8_1: "Maradj és válaszolj a kérdésekre"
STR_INTERCEPT_TITLE_9: "Az alibi"
STR_INTERCEPT_TEXT_9: "Harris megnyitja a fájlt. egy őr látta, hogy elhagyod a géptermet. A feltalált fiókodnak most van ellenük tanúja."
STR_INTERCEPT_CHOICE_9_0: "Védd meg a történetet"
STR_INTERCEPT_CHOICE_9_1: "A zsarolás elismerése"
STR_INTERCEPT_CHOICE_9_2: "További kérdések elutasítása"
STR_INTERCEPT_TITLE_10: "Az ablak"
STR_INTERCEPT_TEXT_10: "Az ablak magas és az üveg vastag. Továbbra is az út egy másik kúton halad át. Megtörni hangos lenne; itt várakozni saját veszélyei vannak."
STR_INTERCEPT_CHOICE_10_0: "Megtörni az üveget"
STR_INTERCEPT_CHOICE_10_1: "Tanulmányozza az utat kívülről"
STR_INTERCEPT_CHOICE_10_2: "Vissza az interjúhoz"
STR_INTERCEPT_TITLE_11: "Újabb látogató"
STR_INTERCEPT_TEXT_11: "Hooper eljött, miközben te bizonytalan vagy. Azt akarja tudni, hogy Harris rendelkezik-e az összetevővel."
STR_INTERCEPT_CHOICE_11_0: "Álomnak teszik a"
STR_INTERCEPT_CHOICE_11_1: "Magyarázatot kérnek"
STR_INTERCEPT_CHOICE_11_2: "Kérjen vizet"
STR_INTERCEPT_TITLE_12: "Egy figyelmeztetés"
STR_INTERCEPT_TEXT_12: "Meghívod Harris-t, mielőtt a tea megáll. visszatér, irritált. A pohárral kapcsolatos vádaknak szüksége lesz valamire, amit kipróbálhat."
STR_INTERCEPT_CHOICE_12_0: "A pohár bizonyítékként"
STR_INTERCEPT_CHOICE_12_1: "Harris azzal vádolja, hogy megmérgezte"
STR_INTERCEPT_CHOICE_12_2: "Koncentrálj a valóságra"
STR_INTERCEPT_TITLE_13: "Hooper"
STR_INTERCEPT_TEXT_13: "Harris felismeri a nevet. Hooper hasznos, jól kapcsolódik, és nem hiányzik a tegnap esti listából sem."
STR_INTERCEPT_CHOICE_13_0: "Találj valamit, amit ellenőrizhetsz"
STR_INTERCEPT_CHOICE_13_1: "Hooper rabolta el"
STR_INTERCEPT_TITLE_14: "Blackmail"
STR_INTERCEPT_TEXT_14: "Leírsz egy fiatalembert, elárult magabiztosságot, és a követelést, amely ezután következett. Harris meghallgatja anélkül, hogy segítene."
STR_INTERCEPT_CHOICE_14_0: "Adja meg Harris a teljes számlát"
STR_INTERCEPT_CHOICE_14_1: "Hagyja ki a neveket"
STR_INTERCEPT_CHOICE_14_2: "Ajánl egy módot, hogy elkapja Hooper"
STR_INTERCEPT_TITLE_15: "Könnyű vád"
STR_INTERCEPT_TEXT_15: "Hooper, mondod, felelősnek kell lennie. Harris megkérdezi, hogy tudod. Van különbség a probléma megoldása és egy olyan tanú előállítása között, aki bizonyítani tudja a választ."
STR_INTERCEPT_CHOICE_15_0: "Harris vitatja az állítást"
STR_INTERCEPT_CHOICE_15_1: "Próbálj meg privát üzenetet küldeni Hooper"
STR_INTERCEPT_TITLE_16: "Tesztelhető kulcs"
STR_INTERCEPT_TEXT_16: "A történetet meg lehet tagadni.A dokumentumot, a tanút vagy a hiányzó elemet nehezebb elmagyarázni."
STR_INTERCEPT_CHOICE_16_0: "Ellenőrizze a közeli házat"
STR_INTERCEPT_CHOICE_16_1: "Használja a reggeli intercept"
STR_INTERCEPT_CHOICE_16_2: "Kérdés Hooper közvetlenül"
STR_INTERCEPT_TITLE_17: "Több, mint visszatérés"
STR_INTERCEPT_TEXT_17: "A gép újra működhet, de Harris még mindig van egy biztonsági hibája, amit meg kell magyarázni."
STR_INTERCEPT_CHOICE_17_0: "Mutassa be a bizonyítékokat"
STR_INTERCEPT_CHOICE_17_1: "Keresés bizonyíték"
STR_INTERCEPT_CHOICE_17_2: "Fogadja el ítéletét"
STR_INTERCEPT_TITLE_18: "Egy ellentmondás"
STR_INTERCEPT_TEXT_18: "Harris az első választ a legújabb válasz mellett állítja be. mindkettő nem lehet igaz. Elhagyhatja a hazugságot, vagy hagyja, hogy az interjú ellentmondáson végződjön."
STR_INTERCEPT_CHOICE_18_0: "Mondd el az igazságot a zsarolásról"
STR_INTERCEPT_CHOICE_18_1: "Mindent tagadnak"
STR_INTERCEPT_CHOICE_18_2: "Próbálj meg elhagyni"
STR_INTERCEPT_TITLE_19: "csend"
STR_INTERCEPT_TEXT_19: "Harris bezárja a fájlt. – Ebben a szobában a csend nem fejezi be a nyomozást, csak véget vet az irányításodnak."
STR_INTERCEPT_CHOICE_19_0: "Hallgassa meg a döntést"
STR_INTERCEPT_TITLE_20: "törött üveg"
STR_INTERCEPT_TEXT_20: "Hűvös levegő és az őr csengésének hangja együtt érkezik. Van idő egy döntésre, mielőtt valaki eléri az ajtót."
STR_INTERCEPT_CHOICE_20_0: "Futás a külső úton"
STR_INTERCEPT_CHOICE_20_1: "Hagyj egy kódolt clue"
STR_INTERCEPT_CHOICE_20_2: "Maradj és magyarázz"
STR_INTERCEPT_TITLE_21: "A kabátok között"
STR_INTERCEPT_TEXT_21: "Hooper ház elég közel ahhoz, hogy elérje a következő járőrözés előtt, de a mögötte lévő nyílt terep másfajta esélyt kínál."
STR_INTERCEPT_CHOICE_21_0: "Próbálj meg elkerülni az okokat"
STR_INTERCEPT_CHOICE_21_1: "Lépj be Hooper házába"
STR_INTERCEPT_CHOICE_21_2: "Vissza Harrishez"
STR_INTERCEPT_TITLE_22: "Egy privát játék"
STR_INTERCEPT_TEXT_22: "Hooper tanulmányozza Önt.Az asztalra egy képzeletbeli sakkozási pozíciót állít fel ujjaival.A kódolt válasz arra késztetheti, hogy feltárja azt, amit a közvetlen vád soha nem fog."
STR_INTERCEPT_CHOICE_22_0: "Válasz egy sakkozással"
STR_INTERCEPT_CHOICE_22_1: "Fenyegetőzött, hogy nevét adja"
STR_INTERCEPT_CHOICE_22_2: "Őszintén beszéljen"
STR_INTERCEPT_TITLE_23: "Szemmel szemben"
STR_INTERCEPT_TEXT_23: "Hooper megkérdezi, hogy mit tudsz bizonyítani.A bizalma csak akkor csúszik el, ha olyan részleteket említenek, amelyeket a tervén kívül nem kellene tudnia."
STR_INTERCEPT_CHOICE_23_0: "A bizonyítékokkal szemben"
STR_INTERCEPT_CHOICE_23_1: "Az összetevőt kereskedelemként kínálják"
STR_INTERCEPT_CHOICE_23_2: "Blöff"
STR_INTERCEPT_TITLE_24: "A Kupa"
STR_INTERCEPT_TEXT_24: "Hooper vizet hoz, de először eléri a teáscsészét, amelynek megtartása hasznosabb lehet, mint bármi más elfogadása, amit kínál."
STR_INTERCEPT_CHOICE_24_0: "Tartsd meg a pohár"
STR_INTERCEPT_CHOICE_24_1: "Ellenőrizze a kabátját"
STR_INTERCEPT_TITLE_25: "Valamit tesztelni"
STR_INTERCEPT_TEXT_25: "Megtartod a csészét, és megkéred Harris-t, hogy vizsgálja meg. Ez végül egy olyan vád, amelyhez egy tárgy van csatolva."
STR_INTERCEPT_CHOICE_25_0: "Adja meg Harris a pohár"
STR_INTERCEPT_CHOICE_25_1: "Hooper összehasonlítása"
STR_INTERCEPT_TITLE_26: "Rossz célpont"
STR_INTERCEPT_TEXT_26: "Harrist bizonyíték nélkül vádolja. látja a gyanúsítottat, aki megpróbálja megbélyegezni a nyomozót. Bármi is történt a teával, nehezebbé tetted, hogy higgyen neked."
STR_INTERCEPT_CHOICE_26_0: "Az interjú vége"
STR_INTERCEPT_TITLE_27: "A teljes számla"
STR_INTERCEPT_TEXT_27: "Megadod a neveket és leírod a találkozót. Harris pontos kérdéseket tesz fel. A szégyenérzeted valós, de a részletek is, amelyeket most ellenőrizhet."
STR_INTERCEPT_CHOICE_27_0: "Ellenőrizze a számlát"
STR_INTERCEPT_CHOICE_27_1: "Ajánlat Hooper megtalálásához"
STR_INTERCEPT_TITLE_28: "A sikertelen átverés"
STR_INTERCEPT_TEXT_28: "Harris elég magabiztos válaszokat hallott. Hoopernek is van. Sem a történeted hiányzik."
STR_INTERCEPT_CHOICE_28_0: "Továbbra is a követelésben"
STR_INTERCEPT_CHOICE_28_1: "Kétségbeesett menekülés"
STR_INTERCEPT_CHOICE_28_2: "Elismerni, mi történt valójában"
STR_INTERCEPT_TITLE_29: "Az elfogás"
STR_INTERCEPT_TEXT_29: "A zsebedben lévő lap több, mint csomó betű: az útvonal a kempingeken keresztül Hooper a gép közelében helyezi el."
STR_INTERCEPT_CHOICE_29_0: "Üzenet kódolása Hoopernek"
STR_INTERCEPT_CHOICE_29_1: "Mutassa be az útvonalat Harris"
STR_INTERCEPT_TITLE_30: "A gép fut"
STR_INTERCEPT_TEXT_30: "Harris rendelkezik az összetevővel, és egy nyomvonal, amely túlmutat az első félelmetes válaszokon.A Bombe folytatja munkáját. A Hut 14-et saját neved alatt hagyod el, kevesebb titkával és még mindig van jövő, amire válaszolni kell."
STR_INTERCEPT_TITLE_31: "A gyanú alatt"
STR_INTERCEPT_TEXT_31: "Az alkatrész visszaküldése megmentette a gépet a késedelemtől. Nem mentette meg a pozícióját. Harris megszünteti a házakhoz való hozzáférést, miközben a nyomozás folytatódik. Túlélte az interjút, de nem tisztította meg a nevét."
STR_INTERCEPT_TITLE_32: "Őrzésben"
STR_INTERCEPT_TEXT_32: "Az ellentmondások, a hiányzó bizonyítékok és egy ellopott alkatrész olyan ügy lett, amit már nem lehet irányítani."
STR_INTERCEPT_TITLE_33: "A külső út"
STR_INTERCEPT_TEXT_33: "A sötétség hasznos, de a földet őrzik.A törött ablak közelebb hozta a járőröket, mint remélted."
STR_INTERCEPT_CHOICE_33_0: "Átkelés a nyílt földön"
STR_INTERCEPT_CHOICE_33_1: "Folytassa a szolgáltatás útját"
STR_INTERCEPT_CHOICE_33_2: "Fordulj hátra és nézz szembe Harris-szel"
STR_INTERCEPT_TITLE_34: "Hooper háza"
STR_INTERCEPT_TEXT_34: "Az íróasztal felügyelet nélkül van. A papírok egy keresztrejtvény alatt helyezkednek el, és a gépterem ceruzás ütemezésben jelenik meg."
STR_INTERCEPT_CHOICE_34_0: "A papírokat vizsgálja"
STR_INTERCEPT_CHOICE_34_1: "Vár a Hooper"
STR_INTERCEPT_CHOICE_34_2: "Harris elhagyása"
STR_INTERCEPT_TITLE_35: "A sakkozási probléma"
STR_INTERCEPT_TEXT_35: "Hoopernek olyan pozíciót adsz, amely tükrözi a helyzetét: egy védett darabot, egy királyt, és egy olyan mozdulatot, amely biztonságosnak tűnik, amíg meg nem válaszol."
STR_INTERCEPT_CHOICE_35_0: "Kérd meg, hogy ismerje el a tervet"
STR_INTERCEPT_CHOICE_35_1: "Küldje el a felvételt Harris"
STR_INTERCEPT_TITLE_36: "Maszk nélkül"
STR_INTERCEPT_TEXT_36: "A nyomásról beszélsz, ahelyett, hogy azt tennéd, hogy soha nem létezett. Hooper röviden válaszol személyként, nem pedig ellenfélként."
STR_INTERCEPT_CHOICE_36_0: "Kérjen őszinte megállapodást"
STR_INTERCEPT_CHOICE_36_1: "Kérd meg, hogy vallja be"
STR_INTERCEPT_CHOICE_36_2: "Fogadja el a számlát Harris"
STR_INTERCEPT_TITLE_37: "Hooper beismerése"
STR_INTERCEPT_TEXT_37: "Hooper eléggé megmagyarázza, hogy a zsarolást összekapcsolja a hiányzó alkatrészekkel. Harris most visszaszerezheti a berendezést és ellenőrizheti a történetet. Önnek el kell döntenie, hogy befejezi-e a nyomozást, vagy hagyja, hogy Hooper eltűnjön."
STR_INTERCEPT_CHOICE_37_0: "Harris a felismerés"
STR_INTERCEPT_CHOICE_37_1: "Hooper megy és megy"
STR_INTERCEPT_TITLE_38: "A kereskedelem"
STR_INTERCEPT_TEXT_38: "A Hooper hatáskörébe kerül az utolsó tőkeáttételed.A tanú vagy bizonyíték nélküli üzlet meghívja őt, hogy megoldja a problémáját az Ön költségén."
STR_INTERCEPT_CHOICE_38_0: "Kéz a komponens felett"
STR_INTERCEPT_CHOICE_38_1: "Tanúsított megállapodást követelnek"
STR_INTERCEPT_CHOICE_38_2: "Visszavonja az ajánlatot"
STR_INTERCEPT_TITLE_39: "Harris hallgat"
STR_INTERCEPT_TEXT_39: "A részletek ellenőrizhetők. Harris megkérdezi, hol van most a komponens. A fiók tisztítása és a gép futtatása kapcsolódó problémák, de nem ugyanazok."
STR_INTERCEPT_CHOICE_39_0: "Visszaadja, ami a kabátjában van"
STR_INTERCEPT_CHOICE_39_1: "Segítség az összetevők helyreállításában"
STR_INTERCEPT_CHOICE_39_2: "Hagyja abba a válaszokat most"
STR_INTERCEPT_TITLE_40: "A kerítésen túl"
STR_INTERCEPT_TEXT_40: "A házak mögötted tűnnek el. - A földön kívüli szabadság nem ugyanaz, mint az ártatlanság, és a gép most valaki más sürgős problémája."
STR_INTERCEPT_TITLE_41: "Az utolsó hiba"
STR_INTERCEPT_TEXT_41: "A járőrség eléri Önt, mielőtt a nyílt terep véget ér, vagy Hooper ígérete összeomlik, amikor már nem hasznos neki."
STR_INTERCEPT_TITLE_42: "A papírok"
STR_INTERCEPT_TEXT_42: "Az ütemterv Hooper-t ott helyezi el, ahol a történeted szerint ő volt. Mellette van az a jegyzet, amely először a csapdába húzta Önt."
STR_INTERCEPT_CHOICE_42_0: "A papírokat Harrishoz"
STR_INTERCEPT_CHOICE_42_1: "Várjon és szembenézzen Hooperrel"
STR_INTERCEPT_TITLE_43: "Egy utolsó megállapodás"
STR_INTERCEPT_TEXT_43: "Hooper felajánlja, hogy visszaadja a részét.A bizalom eltávolítaná az egyik közvetlen problémát; Harris tanúvá tétele nehezebbé tenné egy másik létrehozását."
STR_INTERCEPT_CHOICE_43_0: "A tanú visszatérése"
STR_INTERCEPT_CHOICE_43_1: "Harris a tervben"
STR_INTERCEPT_TITLE_44: "A valóság visszaszerzése"
STR_INTERCEPT_TEXT_44: "A fiók rögzítésével a keresés visszatér a hiányzó hardverhez. Harris ellenőrzi a géptermet, miközben azonosítja, hogy hol kell elhelyezni az alkatrészt."
STR_INTERCEPT_CHOICE_44_0: "Véglegesítse az ellenőrzött visszatérést"
STR_INTERCEPT_CHOICE_44_1: "Vedd ki a kabátodból"
STR_INTERCEPT_CHOICE_44_2: "Harris figyelmezteti Hooper-t"
STR_INTERCEPT_TITLE_45: "A végső kérdés"
STR_INTERCEPT_TEXT_45: "Harris vár. Ha Hooper-t csatlakoztathatja a lopáshoz, még mindig van módja annak, hogy visszaszerezze az alkatrészt, és megfelelően véget vessen ennek."
STR_INTERCEPT_CHOICE_45_0: "Bemutatjuk a bizonyítékokat"
STR_INTERCEPT_CHOICE_45_1: "Beismerd, hogy nincs több"
