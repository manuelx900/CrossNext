STR_QUEST_CAM_JOURNEY2_BOOK_11: "Az utolsó oldal"
STR_QUEST_CAM_JOURNEY2_EPILOGUE: "A felejtés királyának legyőzése után hazatérsz. Hadserege nem tudja többé elpusztítani a könyveket, és az emberek újra békében olvasnak. Megmentetted a világ történeteit. Sok könyv maradt még felfedezésre."
