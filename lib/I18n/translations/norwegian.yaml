STR_QUEST_CAM_DECOR_NAME_4: "Måneblomst"
STR_QUEST_CAM_DECOR_TEXT_4: "Gartnerne reddet ett frø fra den sovende hagen. Denne blomsten vokste for deg."
STR_QUEST_CAM_DECOR_NAME_5: "Vinterkrystall"
STR_QUEST_CAM_DECOR_TEXT_5: "Tinen avslører en krystall som holder det siste minnet om fjellet."
STR_QUEST_CAM_DECOR_NAME_6: "Mekanisk ugle"
STR_QUEST_CAM_DECOR_TEXT_6: "Urmakeren reparerer denne lille vokteren for å takke deg for at du tok tiden tilbake."
STR_QUEST_CAM_DECOR_NAME_7: "Føniksfjær"
STR_QUEST_CAM_DECOR_TEXT_7: "Fra den gjenvunnede asken stiger en fjær: løftet om at historier kan begynne på nytt."
STR_QUEST_CAM_DECOR_NAME_8: "Ørkenlampe"
STR_QUEST_CAM_DECOR_TEXT_8: "En historieforteller gir deg lampen som holdt liv i ørkenhistoriene."
STR_QUEST_CAM_DECOR_NAME_9: "Cloud Koi"
STR_QUEST_CAM_DECOR_TEXT_9: "Du åpner skyburet. En liten koi blir værende for å våke over drømmene dine."
STR_QUEST_CAM_DECOR_NAME_10: "Dragehjerte"
STR_QUEST_CAM_DECOR_TEXT_10: "Dragene betror deg en krystall født fra deres gjenopprettede minne."
STR_QUEST_CAM_DECOR_NAME_11: "Minnestjerne"
STR_QUEST_CAM_DECOR_TEXT_11: "Den første restaurerte stjernen lyser deg mot de siste sidene."
STR_QUEST_CAM_DECOR_NAME_12: "Lesespire"
STR_QUEST_CAM_DECOR_TEXT_12: "En liten plante for et stille lesehjørne."
STR_QUEST_CAM_DECOR_NAME_13: "Lagrede bøker"
STR_QUEST_CAM_DECOR_TEXT_13: "Historier som venter på deres neste leser."
STR_QUEST_CAM_DECOR_NAME_14: "Voyager-banner"
STR_QUEST_CAM_DECOR_TEXT_14: "En vimpel for å huske hver ny begynnelse."
STR_QUEST_CAM_DECOR_NAME_15: "Månesopp"
STR_QUEST_CAM_DECOR_TEXT_15: "Et lite stykke skogen til hjemmet ditt."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_0: "Begynnelsen på eventyret"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_0: "I mange år levde folk i fred og likte bøkene sine. Så begynte glemmekongen å ødelegge dem. Han ville stoppe alle fra å lese og få alle historier til å forsvinne for alltid."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_1: "Kongens monstre"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_1: "The King of Oblivion sendte monstrene sine over hele verden. De ødela hver bok de fant og angrep alle som prøvde å stoppe dem. Bibliotekene begynte å forsvinne, og folk sluttet å lese."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_2: "Kraften til lesing"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_2: "En dag, mens du leser i nærheten av landsbyen din, dukker det opp et monster. Du prøver å komme deg unna, men noe overraskende skjer: jo mer du leser, jo svakere blir det. Du skjønner å lese er den eneste måten å bekjempe kongens magi."
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TITLE_3: "Ditt oppdrag"
STR_QUEST_CAM_JOURNEY2_PROLOGUE_TEXT_3: "Du satte ut for å stoppe kongen. På vei til slottet hans må du krysse skoger, byer, fjell og andre steder fulle av fiender. Hvert monster du beseirer tar deg litt nærmere. Fortsett å lese, beseire hans foresatte og nå ham før han ødelegger alle bøker i verden."
