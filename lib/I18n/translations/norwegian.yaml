STR_QUEST_CAM_JOURNEY2_EPILOGUE: "Etter å ha beseiret King of Oblivion, vender du hjem. Hæren hans kan ikke lenger ødelegge bøker, og folk leser i fred igjen. Du har reddet verdens historier. Det er fortsatt mange bøker igjen å oppdage."
