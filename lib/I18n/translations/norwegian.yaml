STR_CAR_INTRO: "Skyld og ærlighet er uavhengige. hvert tilfelle har nøyaktig én løsning. Høyder er fiktive karaktertrekk."
STR_CAR_HELP_TEXT: "Hvordan løse en sak\nHver figur sier ett utsagn. Øverst på skjermen er det nøyaktige antallet skyldige og falske utsagn. Finn en kombinasjon som tilfredsstiller begge tallene. Hvert tilfelle har én løsning.\n  \nSkyld er ikke ærlighet\nEn uskyldig karakter kan lyve, og en skyldig kan fortelle sannheten. To løgner betyr nøyaktig to hele uttalelser er falske; de andre er sanne. Sannhet / Lie merker refererer til uttalelsen; Mistenkt refererer til skyld.\n  \nLese ledetrådene\n«A eller B gjorde det (eller begge)» betyr at minst en av de navngitte personene er skyldig. «A og B gjorde det» krever begge. En løgn negerer hele uttalelsen: en falsk ELLER betyr at ingen av dem gjorde det; en falsk OG betyr at minst en ikke gjorde det.\n  \n\"Både sannferdig eller begge lyver\" sammenligner uttalelser, ikke skyld. \"Nøyaktig en lyver\" betyr at deres uttalelser har forskjellige sannhetsverdier. Disse ledetrådene kan selv være sanne eller falske.\n  \nNaboer på en liten skjerm\nDen opprinnelige sirkulære rekkefølgen er Panther, Peacock, Shark, Fox, Bear, Stag, Horse, ved å bruke bare tegnene i dette tilfellet. Det siste og første er naboer. Dette programmet skriver de to navnene direkte i hver nabo ledetråd. Du trenger aldri å gjette hvilke kort som er ved siden av et portrett. Bytte side eller orientering endrer ikke en ledetråd.\n  \nHøyde og vekt\nHvert kort viser en oppdiktet høyde og kosthold. « En skyldig er høyere enn meg » betyr at minst én skyldig er høyere enn taleren, ikke nødvendigvis alle skyldige. Kortere fungerer på samme måte. Ledetråder om kjøttetere og planteetere betyr at minst én skyldig har det kostholdet; allmennæring teller som ingen av delene. Navn, høyde og kosthold er pålitelige fakta; uttalelser kan lyve.\n  \nDin analyse\nBruk? / Sannhet / Løgn og Mistenkt under hvert utsagn for å skrive ned hypoteser. Dette er dine notater, ikke bevis eller automatiske kontroller. Piler viser de andre tegnene. Stående modus viser opptil tre per side.\n  \nÅ gjøre en tiltale\nTrykk på Anklag og velg nøyaktig det ønskede antallet skyldige. Bare å bekrefte en feil anklage bruker et liv. Nybegynner og Normal har to liv; Avansert og Ekspert har ett. En riktig anklage løser saken. Når ingen liv er igjen, blir løsningen avslørt.\n  \nKampanje og gjentakelse\nDet er 1470 saker. Åpne sak gjenopptar det nåværende forsøket eller åpner den neste etter en lukket sak. Kampanje lar deg velge hvilken som helst av de 1470 sakene i hvilken som helst rekkefølge fra begynnelsen. Omspilling starter et nytt forsøk mens tidligere fullføringer bevares. Innenfor hver vanskelighetsgrad går sakene fra én skyldig til to, så fra færre løgnere til flere innenfor hver gruppe skyldige. Nybegynner beholder én skyldig. Mindre kast kommer først når tallene stemmer. Alle sakene forblir tilgjengelige. Løser du en sak som tidligere har vært utmattende, oppgraderes den til løst.\n  \nFremgang og liv er lagret på SD-kortet. Avslutting, søvn eller omstart av en enhet gjenoppretter ikke liv i det nåværende forsøket. En mislykket lagring blokkerer resultatet til Retry lykkes. Tilbakestill alle ber om bekreftelse før du sletter bare Carnivore fremgang."
