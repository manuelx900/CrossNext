STR_QUEST_CAM_JOURNEY2_SAGA_10_10: "Du krysser en hengebro og åpner en dør dekket av lys. Utover det ligger et gammelt arkiv hvis bøker kan fortelle deg hvor du finner det siste seglet.\n\nEn bok sier at det tredje seglet holdes under arkivet. Du tar trappene inn i mørke tunneler som fører til et forseglet kammer.\n\nDu gjenoppretter det tredje seglet og fullfører nøkkelen. Når du forlater tunnelene, ser du festningsmurene. En bro fører til porten, hvor de siste monstrene står på vakt.\n\nThe Void Serpent kan ikke lenger vokte buen. De tre tetningene lyser når du setter nøkkelen inn i døren. Slottet åpner, og bare kongen av glemsel gjenstår."
STR_QUEST_CAM_JOURNEY2_SAGA_11_0: "Endelig når du kongen av glemselens slott. Den inneholder mange bøker soldatene hans stjal. Hans siste voktere beskytter tronen, og du må svekke magien hans før du møter ham."
STR_QUEST_CAM_JOURNEY2_SAGA_11_3: "Rommene er stablet med stjålne og ødelagte bøker. Du frigjør de som fortsatt er innelåst i bokser, og klatrer deretter mot den høyeste delen av festningen for å finne kilden til kongens makt."
STR_QUEST_CAM_JOURNEY2_SAGA_11_6: "Rommene er stablet med stjålne og ødelagte bøker. Du frigjør de som fortsatt er innelåst i bokser, og klatrer deretter mot den høyeste delen av festningen for å finne kilden til kongens makt.\n\nEn enorm bok rommer noe av kongens magi. Låsen samsvarer med de tre seglene på nøkkelen. Når du åpner den, svekkes den mørke magien og du kan sette kursen mot tronen."
STR_QUEST_CAM_JOURNEY2_SAGA_11_9: "Rommene er stablet med stjålne og ødelagte bøker. Du frigjør de som fortsatt er innelåst i bokser, og klatrer deretter mot den høyeste delen av festningen for å finne kilden til kongens makt.\n\nEn enorm bok rommer noe av kongens magi. Låsen samsvarer med de tre seglene på nøkkelen. Når du åpner den, svekkes den mørke magien og du kan sette kursen mot tronen.\n\nKongen lager en siste skygge for å beskytte seg selv. Du får det til å forsvinne. Ingen verge står mellom dere nå, og kampen om bøkene er i ferd med å begynne."
STR_QUEST_CAM_JOURNEY2_SAGA_11_10: "Rommene er stablet med stjålne og ødelagte bøker. Du frigjør de som fortsatt er innelåst i bokser, og klatrer deretter mot den høyeste delen av festningen for å finne kilden til kongens makt.\n\nEn enorm bok rommer noe av kongens magi. Låsen samsvarer med de tre seglene på nøkkelen. Når du åpner den, svekkes den mørke magien og du kan sette kursen mot tronen.\n\nKongen lager en siste skygge for å beskytte seg selv. Du får det til å forsvinne. Ingen verge står mellom dere nå, og kampen om bøkene er i ferd med å begynne.\n\nDu beseirer kongen av glemsel. Monstrene hans kan ikke lenger true verden, og de stjålne bøkene kommer tilbake til eierne. Hjemme åpner du en bok akkurat som du gjorde før reisen."
