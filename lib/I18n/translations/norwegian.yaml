STR_INTERCEPT_ABOUT: "En kondensert tilpasning av The Intercept by inkle, 2016, som brukes under MIT-lisensen. Bletchley Park, 1942: en manglende maskinkomponent, utpressing og et intervju som kan ende i frihet eller forvaring.\n\nDine beslutninger og posisjoner blir lagret etter hvert valg. En ny historie gjenoppretter denne spillingen. Originale illustrasjoner ble opprettet for denne firmwaren. Det originale skriptet og lisensen er inkludert i prosjektet."
