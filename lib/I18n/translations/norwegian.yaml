STR_INTERCEPT_TITLE_0: "Hytta 14"
STR_INTERCEPT_TEXT_0: "Bletchley Park, 1942. de holder deg venter bak en låst dør. En komponent fra beregningsmaskinen har forsvunnet. Morgenen avskjære rustler i lomma din. Utenfor, fotspor stopper."
STR_INTERCEPT_CHOICE_0_0: "Tenk gjennom anklagen"
STR_INTERCEPT_CHOICE_0_1: "Venter på intervjuet"
STR_INTERCEPT_CHOICE_0_2: "Søk etter jakken din"
STR_INTERCEPT_TITLE_1: "anklagene"
STR_INTERCEPT_TEXT_1: "De mistenker svik. Du løser figurer, kryssord og sjakkposisjoner for å leve. Dette rommet er et annet problem: motsier deg selv, og din troverdighet kan være det første offeret."
STR_INTERCEPT_CHOICE_1_0: "Velg strategi"
STR_INTERCEPT_CHOICE_1_1: "Hør hva de vet"
STR_INTERCEPT_TITLE_2: "Harry kommer"
STR_INTERCEPT_TEXT_2: "Harris kommer inn med en kopp te og en fil. En hjul er savnet fra bomben. Ditt navn var på oppgavelisten. Han legger koppen ved siden av deg og spør hvor du var i går kveld."
STR_INTERCEPT_CHOICE_2_0: "Drikk te"
STR_INTERCEPT_CHOICE_2_1: "La teen være uberørt"
STR_INTERCEPT_CHOICE_2_2: "Svar rolig"
STR_INTERCEPT_TITLE_3: "Den komponenten"
STR_INTERCEPT_TEXT_3: "Inne i overflaten av din kappe dine fingre møter kald metall. Komponenten er fortsatt der. Hooper sa å ta det ville gjøre utpressingen stoppe."
STR_INTERCEPT_CHOICE_3_0: "Hold det skjult"
STR_INTERCEPT_CHOICE_3_1: "Gi det til Harris"
STR_INTERCEPT_TITLE_4: "Et vinnende spill"
STR_INTERCEPT_TEXT_4: "Samarbeid kan bevare troverdigheten din. En overbevisende løgn kan kjøpe tid. Escape ville bytte et låst rom for vaktene utenfor."
STR_INTERCEPT_CHOICE_4_0: "Samarbeide"
STR_INTERCEPT_CHOICE_4_1: "Oppdager alibi"
STR_INTERCEPT_CHOICE_4_2: "Undersøk vinduet"
STR_INTERCEPT_TITLE_5: "og te"
STR_INTERCEPT_TEXT_5: "Harris legger merke til din stillhet, men ansiktet hans er allerede tilbake.Når du neste åpner øynene, står et annet par sko ved bordet."
STR_INTERCEPT_CHOICE_5_0: "Liker å holde seg sovende"
STR_INTERCEPT_CHOICE_5_1: "Sammenlign besøkende"
STR_INTERCEPT_CHOICE_5_2: "Be om vann"
STR_INTERCEPT_TITLE_6: "Et lite avslag"
STR_INTERCEPT_TEXT_6: "Du skyver koppen bort. Harris ser på bevegelsen mer nøye enn svaret, og spør om det er noen andre han bør avhøre."
STR_INTERCEPT_CHOICE_6_0: "Spør hva han har for bevis"
STR_INTERCEPT_CHOICE_6_1: "Omtale Hooper"
STR_INTERCEPT_CHOICE_6_2: "Se mot vinduet"
STR_INTERCEPT_TITLE_7: "Den manglende virkeligheten"
STR_INTERCEPT_TEXT_7: "Har du tatt komponenten? du kan fortelle ham hva som er i jakken din, forklare presset Hooper påførte, eller prøve å peke på anklagen et annet sted."
STR_INTERCEPT_CHOICE_7_0: "Gi ham komponenten"
STR_INTERCEPT_CHOICE_7_1: "Forklar utpressingen"
STR_INTERCEPT_CHOICE_7_2: "Anklager Hooper"
STR_INTERCEPT_TITLE_8: "Metall på bordet"
STR_INTERCEPT_TEXT_8: "Harris sjekker det uten å slappe av. Å returnere stjålet utstyr forklarer ikke hvorfor det ble tatt. Han vil ha et navn og noe mer pålitelig enn ditt ord."
STR_INTERCEPT_CHOICE_8_0: "Tilbud om å finne bevis"
STR_INTERCEPT_CHOICE_8_1: "Bli og svare på spørsmål"
STR_INTERCEPT_TITLE_9: "Et alibi"
STR_INTERCEPT_TEXT_9: "Du beskriver en stille kveld ved skrivebordet ditt. Harris åpner filen. En vakt så deg forlate maskinrommet."
STR_INTERCEPT_CHOICE_9_0: "Forsvar historien"
STR_INTERCEPT_CHOICE_9_1: "Innrømmer utpressing"
STR_INTERCEPT_CHOICE_9_2: "Avviser flere spørsmål"
STR_INTERCEPT_TITLE_10: "Vinduet"
STR_INTERCEPT_TEXT_10: "Vinduet er høyt og glasset er tykt. Utenfor det fører stien forbi en annen hytte. bryte det ville være høyt; venter her har sine egne farer."
STR_INTERCEPT_CHOICE_10_0: "Brøt glasset"
STR_INTERCEPT_CHOICE_10_1: "Studer veien utenfor"
STR_INTERCEPT_CHOICE_10_2: "Tilbake til intervjuet"
STR_INTERCEPT_TITLE_11: "Enda en besøkende"
STR_INTERCEPT_TEXT_11: "Hooper har kommet mens du er ustabil. Han vil vite om Harris har komponenten."
STR_INTERCEPT_CHOICE_11_0: "Liker å sove"
STR_INTERCEPT_CHOICE_11_1: "Krever forklaring"
STR_INTERCEPT_CHOICE_11_2: "Be om vann"
STR_INTERCEPT_TITLE_12: "En advarsel"
STR_INTERCEPT_TEXT_12: "Du ringer til Harris før teet tar tak. Han kommer tilbake, irritert. En anklage om koppen vil trenge noe han kan teste."
STR_INTERCEPT_CHOICE_12_0: "Hold cupen som bevis"
STR_INTERCEPT_CHOICE_12_1: "Anklager Harris for å ha forgiftet deg"
STR_INTERCEPT_CHOICE_12_2: "Fokuser på det virkelige"
STR_INTERCEPT_TITLE_13: "Håper"
STR_INTERCEPT_TEXT_13: "Harris gjenkjenner navnet. Hooper er nyttig, godt forbundet, og ikke fraværende fra gårsdagens liste heller."
STR_INTERCEPT_CHOICE_13_0: "Finn noe verifiserbart"
STR_INTERCEPT_CHOICE_13_1: "Insist Hooper stjal det"
STR_INTERCEPT_TITLE_14: "Blackmail"
STR_INTERCEPT_TEXT_14: "Du beskriver en ung mann, en tillit forrådt, og kravet som fulgte. Harris lytter uten å hjelpe deg."
STR_INTERCEPT_CHOICE_14_0: "Gi Harris fullstendig informasjon"
STR_INTERCEPT_CHOICE_14_1: "Legg ut navnene"
STR_INTERCEPT_CHOICE_14_2: "Foreslå en måte å fange Hooper"
STR_INTERCEPT_TITLE_15: "En enkel anklage"
STR_INTERCEPT_TEXT_15: "Hooper, sier du, må være ansvarlig. Harris spør hvordan du vet.Det er en forskjell mellom å løse et problem og produsere et vitne som kan bevise svaret."
STR_INTERCEPT_CHOICE_15_0: "La Harris utfordre påstanden"
STR_INTERCEPT_CHOICE_15_1: "Prøv en privat melding til Hooper"
STR_INTERCEPT_TITLE_16: "Testet nøkkelen"
STR_INTERCEPT_TEXT_16: "Et dokument, et vitne eller den manglende komponenten er vanskeligere å forklare bort."
STR_INTERCEPT_CHOICE_16_0: "Sjekk nærmeste hytte"
STR_INTERCEPT_CHOICE_16_1: "Bruk morgeninterceptet"
STR_INTERCEPT_CHOICE_16_2: "Spørsmålet Hooper direkte"
STR_INTERCEPT_TITLE_17: "Mer enn en retur"
STR_INTERCEPT_TEXT_17: "Maskinen kan fungere igjen, men Harris har fortsatt et sikkerhetsbrudd å forklare."
STR_INTERCEPT_CHOICE_17_0: "Vis bevisene"
STR_INTERCEPT_CHOICE_17_1: "Søk etter bevis"
STR_INTERCEPT_CHOICE_17_2: "Godta hans dom"
STR_INTERCEPT_TITLE_18: "En motsetning"
STR_INTERCEPT_TEXT_18: "Harris setter ditt første svar ved siden av det siste.De kan ikke begge være sanne.Du kan forlate løgnen, eller la intervjuet ende på en motsetning."
STR_INTERCEPT_CHOICE_18_0: "Fortell sannheten om utpressing"
STR_INTERCEPT_CHOICE_18_1: "Fortsett å benekte alt"
STR_INTERCEPT_CHOICE_18_2: "Prøv å forlate"
STR_INTERCEPT_TITLE_19: "Stillhet"
STR_INTERCEPT_TEXT_19: "Harris lukker filen, og i dette rommet avsluttes ikke stillheten etterforskningen; den avsluttes bare med din del av å styre den."
STR_INTERCEPT_CHOICE_19_0: "Hør avgjørelsen"
STR_INTERCEPT_TITLE_20: "Brutt glass"
STR_INTERCEPT_TEXT_20: "Den kalde luften og lyden av en vakts whistle kommer sammen.Det er tid for én beslutning før noen når døren."
STR_INTERCEPT_CHOICE_20_0: "Løp for den ytre sti"
STR_INTERCEPT_CHOICE_20_1: "Legg igjen en kodet clue"
STR_INTERCEPT_CHOICE_20_2: "Stå og forklar"
STR_INTERCEPT_TITLE_21: "Mellom hyttene"
STR_INTERCEPT_TEXT_21: "Hooper's hytte er nær nok til å nå før neste patrulje, men den åpne bakken utenfor det gir en annen form for sjanse."
STR_INTERCEPT_CHOICE_21_0: "Prøv å unnslippe grunnene"
STR_INTERCEPT_CHOICE_21_1: "Gå inn i Hooper's hut"
STR_INTERCEPT_CHOICE_21_2: "Tilbake til Harris"
STR_INTERCEPT_TITLE_22: "Et privat spill"
STR_INTERCEPT_TEXT_22: "Hooper studerer deg. På bordet setter han ut en imaginær sjakkposisjon med fingrene. Et kodet svar kunne få ham til å avsløre hva en direkte anklage aldri ville gjøre."
STR_INTERCEPT_CHOICE_22_0: "Svar med en sjakklokke"
STR_INTERCEPT_CHOICE_22_1: "Truet med å kalle ham"
STR_INTERCEPT_CHOICE_22_2: "Snakk ærlig"
STR_INTERCEPT_TITLE_23: "Ansikt til ansikt"
STR_INTERCEPT_TEXT_23: "Hans tillit svikter bare når du nevner detaljer som noen utenfor hans plan ikke burde vite."
STR_INTERCEPT_CHOICE_23_0: "Møt ham med bevis"
STR_INTERCEPT_CHOICE_23_1: "Tilbyr komponenten som en handel"
STR_INTERCEPT_CHOICE_23_2: "Bløff"
STR_INTERCEPT_TITLE_24: "av cupen"
STR_INTERCEPT_TEXT_24: "Hooper bringer vann, men når for te-koppen først. Å holde den koppen kan være mer nyttig enn å akseptere noe annet han tilbyr."
STR_INTERCEPT_CHOICE_24_0: "Hold cupen"
STR_INTERCEPT_CHOICE_24_1: "Sjekk jakken din igjen"
STR_INTERCEPT_TITLE_25: "Noe å teste"
STR_INTERCEPT_TEXT_25: "Du holder koppen og ber Harris om å få den undersøkt. Dette er endelig en påstand med et objekt knyttet til den. Hooper forsøk på å fjerne den gir en annen nyttig detalj."
STR_INTERCEPT_CHOICE_25_0: "Gi Harris cupen"
STR_INTERCEPT_CHOICE_25_1: "Konfronter Hooper med det"
STR_INTERCEPT_TITLE_26: "Feil mål"
STR_INTERCEPT_TEXT_26: "Du anklager Harris uten bevis.Han ser en mistenkt som prøver å diskreditere etterforsker.Uansett hva som skjedde med te, har du gjort det vanskeligere for ham å tro deg."
STR_INTERCEPT_CHOICE_26_0: "Intervjuet avsluttes"
STR_INTERCEPT_TITLE_27: "Hele kontoen"
STR_INTERCEPT_TEXT_27: "Du gir navnene og beskriver møtet. Harris stiller nøyaktige spørsmål. Din flau er ekte, men det samme gjelder detaljene han nå kan sjekke."
STR_INTERCEPT_CHOICE_27_0: "La ham sjekke kontoen"
STR_INTERCEPT_CHOICE_27_1: "Søk etter Hooper"
STR_INTERCEPT_TITLE_28: "En mislykket bløff"
STR_INTERCEPT_TEXT_28: "Harris har hørt nok selvsikre svar. Hooper har det også."
STR_INTERCEPT_CHOICE_28_0: "Fortsetter i kravet"
STR_INTERCEPT_CHOICE_28_1: "Gjør en desperat flukt"
STR_INTERCEPT_CHOICE_28_2: "Innrømmer hva som egentlig skjedde"
STR_INTERCEPT_TITLE_29: "Den intercepterte"
STR_INTERCEPT_TEXT_29: "Bladet i lommen din bærer mer enn jumbled bokstaver: ruten gjennom hytter plasserer Hooper nær maskinen."
STR_INTERCEPT_CHOICE_29_0: "Kod en melding til Hooper"
STR_INTERCEPT_CHOICE_29_1: "Vis reiseruten til Harris"
STR_INTERCEPT_TITLE_30: "Maskinen kjører"
STR_INTERCEPT_TEXT_30: "Harris har komponenten, og en sti som fører utover dine første skremte svar.Bomben gjenopptar arbeidet.Du forlater Hut 14 under ditt eget navn, med færre hemmeligheter og en fremtid som fortsatt er å svare på."
STR_INTERCEPT_TITLE_31: "Under mistanke"
STR_INTERCEPT_TEXT_31: "Å returnere komponenten reddet maskinen fra en forsinkelse. Det reddet ikke posisjonen din. Harris avsluttet tilgangen til hyttene mens etterforskningen fortsetter. Du overlevde intervjuet, men klarte ikke navnet ditt."
STR_INTERCEPT_TITLE_32: "I forvaring"
STR_INTERCEPT_TEXT_32: "Motsetninger, manglende bevis og en stjålet komponent har blitt et tilfelle du ikke lenger kan direkte."
STR_INTERCEPT_TITLE_33: "Den ytre veien"
STR_INTERCEPT_TEXT_33: "Du forlater hyttene bak. Mørket er nyttig, men grunnen er bevoktet. Et ødelagt vindu har brakt patruljene nærmere enn du håpet."
STR_INTERCEPT_CHOICE_33_0: "Krysser det åpne feltet"
STR_INTERCEPT_CHOICE_33_1: "Fortsett til tjenesten vei"
STR_INTERCEPT_CHOICE_33_2: "Snu tilbake og se på Harris"
STR_INTERCEPT_TITLE_34: "Hoopers hytte"
STR_INTERCEPT_TEXT_34: "Skrivebordet er ubeskyttet. Papirer ligger under et kryssord, og maskinrommet vises i en blyant tidsplan."
STR_INTERCEPT_CHOICE_34_0: "Undersøk papirene"
STR_INTERCEPT_CHOICE_34_1: "Venter på Hooper"
STR_INTERCEPT_CHOICE_34_2: "Forlater Harris"
STR_INTERCEPT_TITLE_35: "Et sjakkproblem"
STR_INTERCEPT_TEXT_35: "Du gir Hooper en posisjon som gjenspeiler hans situasjon: et beskyttet stykke, en utsatt konge og et trekk som ser trygt ut til svaret."
STR_INTERCEPT_CHOICE_35_0: "Be ham om å innrømme planen"
STR_INTERCEPT_CHOICE_35_1: "Send innmeldingen til Harris"
STR_INTERCEPT_TITLE_36: "Uten maske"
STR_INTERCEPT_TEXT_36: "Du snakker om presset i stedet for å late som det aldri eksisterte. Hooper svarer kort som en person snarere enn som en motstander."
STR_INTERCEPT_CHOICE_36_0: "Be om en ærlig avtale"
STR_INTERCEPT_CHOICE_36_1: "Be ham om å bekjenne"
STR_INTERCEPT_CHOICE_36_2: "Ta regningen til Harris"
STR_INTERCEPT_TITLE_37: "Hoopers innrømmelse"
STR_INTERCEPT_TEXT_37: "Hooper forklarer nok til å koble utpressingen til den manglende komponenten. Harris kan nå gjenopprette utstyret og sjekke historien."
STR_INTERCEPT_CHOICE_37_0: "Bring Harris innrømmelsen"
STR_INTERCEPT_CHOICE_37_1: "La Hooper gå og dra"
STR_INTERCEPT_TITLE_38: "Handelen"
STR_INTERCEPT_TEXT_38: "En avtale uten vitner eller bevis er en invitasjon for ham til å løse sitt problem på din bekostning."
STR_INTERCEPT_CHOICE_38_0: "Hånden over komponenten"
STR_INTERCEPT_CHOICE_38_1: "Krever vitneavtale"
STR_INTERCEPT_CHOICE_38_2: "Trekker tilbudet"
STR_INTERCEPT_TITLE_39: "Harris Lystens"
STR_INTERCEPT_TEXT_39: "Detaljene kan sjekkes. Harris spør hvor komponenten er nå. Å rydde kontoen din og få maskinen til å kjøre er relaterte problemer, men de er ikke det samme."
STR_INTERCEPT_CHOICE_39_0: "Få tilbake det som er i jakken din"
STR_INTERCEPT_CHOICE_39_1: "Hjelp til å gjenopprette komponenten"
STR_INTERCEPT_CHOICE_39_2: "Slutt å svare nå"
STR_INTERCEPT_TITLE_40: "Utenfor gjerdet"
STR_INTERCEPT_TEXT_40: "Frihet utenfor tomten er ikke det samme som uskyld, og maskinen er noen andres presserende problem nå."
STR_INTERCEPT_TITLE_41: "Siste feil"
STR_INTERCEPT_TEXT_41: "Patruljen når deg før den åpne bakken slutter, eller Hooper's løfte kollapser når det ikke lenger er nyttig for ham."
STR_INTERCEPT_TITLE_42: "Papirene"
STR_INTERCEPT_TEXT_42: "Tidsplanen plasserer Hooper der historien din sa at han var. Ved siden av det er notatet som først trakk deg inn i fellen."
STR_INTERCEPT_CHOICE_42_0: "Ta papirene til Harris"
